<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>body{margin:0}</style></head><body>
<title>國立臺灣歷史博物館 語音導覽</title>
<script>/* 發布版：網址只能帶 #標記，#nmth＝標規版；#nmth&go=pt:412 這類參數照 ?query 讀 */
var __QS='?mode=nmth&'+location.search.slice(1)+'&'+location.hash.slice(1);   /* A 版固定標規版：沒有 AI 陪伴導覽員 */
window.addEventListener('hashchange',()=>location.reload());</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 中性灰階為主體，強調色只有一個＝Dainy 紫羅蘭（跟角色的淡紫粉藍同系）
     紫對白約 4.1:1 → 圖形（marker／進度／播放鈕）與淡底深字膠囊；文字型主 CTA 仍走黑 */
  --acc:#6C63E0; --acc-d:#4B41B8; --acc-l:#EFECFB;
  --ink:#111111; --ink-2:#6B6B6B; --ink-3:#9A9A9A;
  --line:#E6E6E6; --line-2:#DADADA;
  --bg:#FFFFFF; --surface:#FFFFFF; --grey:#F0F0F0; --grey-2:#F6F6F6; --canvas:#DFDFDF;
  --ok:#3F7A55;
  /* 舊語意名保留給既有 class，值改成新體系：teal→黑（主 CTA／選中）、gold→Dainy 紫（強調） */
  --teal:#111111; --teal-d:#000000; --teal-l:#F0F0F0;
  --gold:#6C63E0; --gold-d:#4B41B8; --gold-l:#EFECFB;
  --cream:#F4F4F4; --red:#4B41B8; --pin:#6C63E0;
  --panel:#1B1B1B; --panel-2:#292929; --panel-line:#3A3A3A; --panel-on:#EDEDED; --panel-dim:#A5A5A5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);
  font:14px/1.6 "Geist","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
h1,h2,h3,h4{font-weight:700;line-height:1.3}
svg{display:block}

/* ---------- phone chrome ---------- */
.nav{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:6px;padding:0 10px;background:#fff;
  border-bottom:1px solid var(--line);position:relative;z-index:5}
.nav.ondark{background:transparent;border:0;color:#fff;position:absolute;left:0;right:0;top:0}
.nav .t{flex:1;text-align:center;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icb{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border-radius:14px;
  background:#fff;border:1px solid var(--line-2);color:var(--ink)}
.icb:hover{border-color:var(--ink-3)}
.icb.bare{background:none;border:0}
.icb.bare:hover{background:rgba(0,0,0,.05)}
.nav.ondark .icb:hover{background:rgba(255,255,255,.18)}
.body{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.body::-webkit-scrollbar{width:0}
.pad{padding:14px 24px}
.sec{padding:30px 0;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec-h2{padding:0 24px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec-h2 h3{font-size:18px;letter-spacing:.01em}
.sec-h2 em{font-style:normal;font-size:11.5px;color:var(--ink-3);letter-spacing:.06em}
.sec-h2 .all{margin-left:auto;font-size:12.5px;color:var(--teal)}
.sec-h2.mid{justify-content:center}
.sec-sub{padding:7px 24px 0;font-size:12.5px;color:var(--ink-2)}
.sec-sub.mid{text-align:center}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:16px 24px 4px}
.hscroll::-webkit-scrollbar{height:0}
.hscroll>*{flex:0 0 300px;scroll-snap-align:start}
.vscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px 52px 4px}
.vscroll::-webkit-scrollbar{height:0}
.vscroll>*{flex:0 0 100%;scroll-snap-align:center}  /* 100%＝content 寬（已扣左右 52 padding）→ 每張都置中 */
.fab{width:44px;height:44px;flex:0 0 44px;border-radius:999px;background:var(--ink);color:#fff;
  display:grid;place-items:center}
.statusline{display:flex;align-items:center;justify-content:center;gap:8px;padding:18px 24px 0;font-size:13px}
.statusline .d{width:7px;height:7px;border-radius:999px;background:var(--acc)}
.footer{background:var(--cream);padding:26px 24px;text-align:center;margin-top:30px}
.hcard{margin:16px 24px 0;border-radius:16px;overflow:hidden;position:relative;height:300px;
  box-shadow:0 1px 2px rgba(60,60,60,.06),0 10px 26px rgba(60,60,60,.08)}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:26px 24px 12px;font-size:16px;font-weight:700;
  padding-top:26px;border-top:1px solid var(--line)}
.sec-h.nl{border-top:0;padding-top:0;margin-top:20px}
.sec-h em{font-style:normal;font-size:11.5px;color:var(--ink-3);font-weight:400;letter-spacing:.06em}
.sec-h .all{margin-left:auto;font-size:12.5px;font-weight:400;color:var(--teal)}
.card{background:#fff;border:0;border-radius:14px;overflow:hidden;
  box-shadow:0 1px 2px rgba(60,60,60,.05),0 6px 18px rgba(60,60,60,.05)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--grey);
  font-size:11px;color:var(--ink-2);white-space:nowrap}
.chip.teal{background:var(--ink);color:#fff}
.chip.gold{background:var(--acc-l);color:var(--acc-d);font-weight:500}
.chip.out{background:#fff;border:1px solid var(--line-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:46px;padding:0 20px;
  border-radius:16px;background:var(--teal);color:#fff;font-size:14.5px;font-weight:500}
.btn:hover{background:var(--teal-d)}
.btn.gold{background:var(--ink);color:#fff}   /* 強調紫不當文字底（對比不足）→ 主 CTA 一律黑膠囊 */
.btn.gold:hover{background:#000}
.btn.grey{background:var(--grey);color:var(--ink)}
.btn.grey:hover{background:#E6E6E6}
.btn.acc{background:var(--acc-l);color:var(--acc-d)}
.btn.acc:hover{background:#E4E0F8}
.btn.ghost{background:#fff;border:1px solid var(--line-2);color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink-3)}
.btn.sm{height:38px;padding:0 14px;font-size:13px;border-radius:13px}
.btn[disabled]{background:#E6E6E6;color:#9A9A9A;box-shadow:none;cursor:not-allowed}
.gbar{border-left:2px solid var(--acc);padding-left:10px;font-size:13px;color:var(--ink-2);margin-bottom:7px;line-height:1.5}
.hr{height:1px;background:var(--line);margin:14px 16px}
.muted{color:var(--ink-2);font-size:12.5px}
.tiny{font-size:11.5px;color:var(--ink-3)}
.rowlist{background:#fff;border:0;border-radius:14px;overflow:hidden;
  box-shadow:0 1px 2px rgba(60,60,60,.05),0 6px 18px rgba(60,60,60,.05)}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--grey-2)}
.row .g{flex:1;min-width:0}
.row .n{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.ico{width:34px;height:34px;flex:0 0 34px;border-radius:8px;display:grid;place-items:center;background:var(--cream);color:var(--ink-2)}
.ico.gold{background:var(--acc-l);color:var(--acc-d)}
.ico.grey{background:var(--grey);color:var(--ink-2)}
.searchbar{display:flex;align-items:center;gap:9px;height:52px;width:calc(100% - 48px);margin:14px 24px 0;
  padding:0 16px;background:#fff;
  border:1px solid var(--line-2);border-radius:18px;color:var(--ink-3);font-size:13.5px}
.searchbar:hover{border-color:var(--ink-3)}
.progress{height:4px;border-radius:999px;background:var(--grey);overflow:hidden}
.progress i{display:block;height:100%;background:var(--acc)}
/* 可拖曳進度列（標規 AUDIO-08）：加大觸控區到 44px，視覺仍是 4px 細線 */
.seekwrap{position:relative;padding:20px 0;margin:-16px 0 -18px;cursor:pointer;touch-action:none}
.seekwrap .progress{overflow:visible}
.seekwrap .progress i{border-radius:999px;position:relative}
.seekwrap .knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:999px;
  background:var(--acc);box-shadow:0 1px 5px rgba(0,0,0,.28);pointer-events:none}
.seekwrap.drag .knob{transform:scale(1.25)}
/* 音量滑桿（標規 AUDIO-08：兩端音量圖示） */
.volrow{display:flex;align-items:center;gap:10px;padding:2px 4px}
.volbar{flex:1;height:4px;border-radius:999px;background:var(--grey);position:relative;cursor:pointer;touch-action:none}
.volbar i{display:block;height:100%;border-radius:999px;background:var(--ink-2)}
.volbar .knob{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:999px;
  background:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.25);pointer-events:none}
/* 播放器工具列 chips */
.ptools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:10px 4px 0;margin-top:8px;border-top:1px solid var(--line)}
.ptools .chip{height:30px;padding:0 11px;font-size:12px;cursor:pointer}
.ptools .chip.on{background:var(--ink);color:#fff}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:5px;border-radius:999px;background:var(--grey)}
.steps i.on{background:var(--ink)}
.steps i.now{background:var(--acc)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;z-index:10;
  box-shadow:0 -10px 30px rgba(0,0,0,.14);padding:8px 0 16px;max-height:74%;display:flex;flex-direction:column}
.sheet .grab{width:46px;height:4px;border-radius:999px;background:var(--line-2);margin:4px auto 10px}
.sheet .sbody{overflow-y:auto;padding:0 16px}
.dim{position:absolute;inset:0;background:rgba(17,17,17,.42)}
.tabbar{flex:0 0 auto;padding:10px 16px 14px;background:transparent}
.mini{display:flex;align-items:center;gap:11px;background:#fff;border-radius:18px;padding:10px 12px;
  box-shadow:0 6px 20px rgba(0,0,0,.14);position:relative;overflow:hidden}
.mini .pl{width:44px;height:44px;border-radius:12px;background:var(--acc);color:#fff;display:grid;place-items:center;flex:0 0 44px}
.skrow{display:flex;justify-content:space-between;margin-bottom:10px}   /* 路線中：迷你播放器上方的上一站／下一站 */
.skrow .fchip{height:40px;padding:0 16px;font-size:13px;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.skrow .fchip svg{width:15px;height:15px}
.skrow .fchip[disabled]{opacity:.4;cursor:default}
.mini .thumb{width:48px;height:48px;flex:0 0 48px;border-radius:12px;
  background:linear-gradient(135deg,#D6D6D6,#B8B8B8)}
.mini .gl{position:absolute;left:0;bottom:0;height:3px;background:var(--acc)}
.floortabs{display:flex;gap:4px;background:var(--grey);border-radius:999px;padding:4px;border:0}
.floortabs button{flex:1;min-height:44px;padding:4px 2px;border-radius:999px;text-align:center;font-size:14px;
  color:var(--ink-2);display:grid;place-items:center}
.floortabs button.on{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.pilldark{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;
  background:var(--ink);color:#fff;font-size:14px;font-weight:500}
.fchip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;background:#fff;
  font-size:12.5px;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.14)}
.fchip.on{background:var(--ink);color:#fff}
.marker{position:absolute;transform:translate(-50%,-50%) scale(calc(1/var(--mz,1)));
  display:grid;place-items:center;cursor:pointer}
.zlab{transform-origin:left top;transform:scale(calc(1/var(--mz,1)))}
.pulse{position:absolute;width:36px;height:36px;border-radius:999px;border:2px solid var(--acc);
  pointer-events:none;animation:pls 1.5s ease-out infinite}
@keyframes pls{0%{transform:scale(.6);opacity:.85}100%{transform:scale(1.9);opacity:0}}
.navline{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:4 3;animation:navdash .9s linear infinite}
@keyframes navdash{to{stroke-dashoffset:-14}}
.mk{width:30px;height:30px;border-radius:999px;background:#fff;border:2px solid #fff;position:relative;
  display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--ink);
  box-shadow:0 2px 7px rgba(0,0,0,.28)}
.mk::after{content:'';position:absolute;left:50%;top:100%;margin-top:-2px;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:#fff}
.mk.on-route{background:var(--acc);color:#fff}
.mk.on-route::after{border-top-color:var(--acc)}
.mk.on-route.txt{background:#fff;color:var(--ink-2);box-shadow:inset 0 0 0 2px var(--ink-3),0 2px 7px rgba(0,0,0,.2)} .mk.on-route.txt::after{border-top-color:#fff}   /* 主題路線：只有文字導覽的站 */
.mk.done{background:var(--ink);color:#fff}
.mk.done::after{border-top-color:var(--ink)}
.mk.plain i{width:9px;height:9px;border-radius:999px;background:var(--ink-3);display:block}
/* 展品點輕微呼吸：提示「這可以點」；減少動態時不播 */
.mk.plain i,.mk.on-route{animation:mkBreath 2.4s ease-in-out infinite}
@keyframes mkBreath{0%,100%{box-shadow:0 0 0 0 rgba(108,99,224,.0)}50%{box-shadow:0 0 0 6px rgba(108,99,224,.28)}}
@media (prefers-reduced-motion:reduce){.mk.plain i,.mk.on-route{animation:none}}
.mk.fac{border-radius:9px;background:var(--grey);border-color:#fff;color:var(--ink-2);width:28px;height:28px}
.mk.fac::after{display:none}
.mk.sel{outline:3px solid var(--acc);outline-offset:2px}
.mklab{position:absolute;left:50%;top:34px;transform:translateX(-50%);white-space:nowrap;font-size:10px;
  background:#fff;border-radius:999px;padding:2px 8px;color:var(--ink);pointer-events:none;font-weight:500;
  box-shadow:0 2px 6px rgba(0,0,0,.16)}
.mklab.acc{background:var(--acc-l);color:var(--acc-d)}
.you{width:16px;height:16px;border-radius:999px;background:var(--ink);border:3px solid #fff;
  box-shadow:0 0 0 6px rgba(17,17,17,.14)}
.bubble{position:absolute;left:12px;right:12px;background:#fff;border-radius:16px;padding:12px 14px;
  box-shadow:0 6px 20px rgba(0,0,0,.16);border-left:3px solid var(--acc)}
.avatar{width:36px;height:36px;border-radius:12px;background:var(--ink);
  display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;flex:0 0 36px}
.notice{display:flex;gap:9px;background:var(--grey-2);border:0;border-left:2px solid var(--acc);
  border-radius:0 10px 10px 0;padding:12px 14px;font-size:12.5px;color:var(--ink-2)}
.notice.err{background:var(--acc-l);border-left-color:var(--acc-d);color:var(--acc-d)}
.lvl{font-size:10.5px;padding:2px 7px;border-radius:5px;font-weight:500;white-space:nowrap;display:inline-block}
.lvl.full{background:var(--ink);color:#fff}
.lvl.text{background:var(--grey);color:var(--ink-2)}
.lvl.place{background:#E8EFE9;color:var(--ok)}
table.mx{width:100%;border-collapse:collapse;font-size:12.5px}
table.mx th,table.mx td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
table.mx th{font-size:11.5px;color:var(--ink-2);font-weight:500;background:var(--cream)}
table.mx td.c{text-align:center}
.dot{display:inline-block;width:9px;height:9px;border-radius:999px}
.dot.y{background:var(--ink)}.dot.n{background:#DCDCDC}
.deskhead{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--cream)}
.deskhead b{font-size:14px}

/* ---------- 底部 menu（參考舊稿 tabBar 162:18476，樣式改為現在的中性＋Dainy 紫） ---------- */
.bnav{position:absolute;left:14px;right:14px;bottom:12px;display:flex;background:rgba(255,255,255,.62);
  -webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);
  border:1px solid rgba(255,255,255,.7);border-radius:26px;padding:6px 6px 8px;z-index:8;
  box-shadow:0 10px 28px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.8)}
.minifloat{position:absolute;left:14px;right:14px;bottom:88px;z-index:8}
.micro{position:absolute;z-index:8;width:54px;height:54px;border-radius:16px;touch-action:none;
  transition:left .18s ease,right .18s ease,top .18s ease,width .18s ease;
  box-shadow:0 6px 18px rgba(0,0,0,.20),0 0 0 3px var(--acc-l);
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.micro.open{width:236px;background:#fff;padding:0 6px 0 7px;gap:9px;justify-content:flex-start}
.micro .eq{display:flex;align-items:flex-end;gap:2.5px;height:18px}
.micro .eq i{width:3.5px;background:#fff;border-radius:2px;animation:wv 1.1s infinite ease-in-out;
  box-shadow:0 0 4px rgba(0,0,0,.25)}
.scr.tabbed>.body{padding-bottom:110px}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0}
.bnav .ind{width:56px;height:30px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2)}
.bnav button.on .ind{background:var(--acc-l);color:var(--acc-d)}
.bnav .lb{font-size:10.5px;color:var(--ink-2)}
.bnav button.on .lb{color:var(--ink);font-weight:700}
.bnav .dainybtn{flex:0 0 76px;justify-content:center}
.bnav .dpad{width:58px;height:58px;margin-top:-16px;border-radius:19px;
  background:linear-gradient(145deg,#B9AAF2 0%,#8F92EA 55%,#6F7EDD 100%);
  display:grid;place-items:center;box-shadow:0 6px 16px rgba(111,126,221,.42)}
.bnav .dainybtn.on .dpad{outline:3px solid var(--acc);outline-offset:2px}

/* ---------- Artlas 式一頁設定 ---------- */
.sldr{position:relative;height:52px;margin:6px 18px 0}   /* 左右留邊：滑到兩端時圓鈕與數字不會被切掉 */
.sldr .track{position:absolute;top:24px;left:0;right:0;height:2px;background:var(--line-2)}
.sldr .fill{position:absolute;top:24px;left:0;height:2px;background:var(--ink)}
.sldr input{position:absolute;left:0;right:0;top:6px;width:100%;height:40px;opacity:0;margin:0}
.sldr .thumb{position:absolute;top:10px;width:46px;height:30px;border-radius:10px;background:var(--acc-l);
  display:grid;place-items:center;transform:translateX(-50%);pointer-events:none;color:var(--acc-d)}
.sldr .val{position:absolute;top:44px;transform:translateX(-50%);white-space:nowrap;font-size:13px;font-weight:700}
.seg{display:flex;background:var(--grey);border-radius:14px;padding:5px;gap:5px}
.seg button{flex:1;height:46px;border-radius:11px;font-size:14px;color:var(--ink-2);display:grid;place-items:center}
.seg button.on{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.langrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.langrow::-webkit-scrollbar{height:0}
.langrow button{flex:0 0 auto;height:40px;padding:0 18px;border-radius:12px;background:var(--grey);
  font-size:14px;color:var(--ink-3);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.langrow button.on{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.14)}

/* ---------- Dainy 對話 ---------- */
.msg{display:flex;gap:9px;margin-bottom:14px;align-items:flex-start}
.msg .b{max-width:76%;background:var(--grey);border-radius:16px 16px 16px 5px;padding:11px 13px;
  font-size:13.5px;line-height:1.65}
.msg.me{flex-direction:row-reverse}
.msg.me .b{background:var(--ink);color:#fff;border-radius:16px 16px 5px 16px}

   tracks:{general:['tsl']},themes:{"listen": "must", "story": "opt"},tags:['常設展','臺灣，交會之島'],
   text:'這件展品位在「臺灣，交會之島」單元。臺灣，要從「交會」開始說起。這是一段不同人群，碰撞、摸索，共有同一塊土地的故事。本單元也有母語地名故事的線上展覽。'},
  {id:'l_dutch',n:'部落傳唱的荷蘭歌',v:'main',fl:'2F',z:'倚海而生的島與人',x:50.0,y:53.2,lvl:'full',dur:115,no:'222',
   tracks:{general:['tsl']},themes:{"listen": "must", "story": "opt"},tags:['常設展','倚海而生的島與人'],
   text:'這件展品位在「身陷角力戰的原住民」展區。在這段期間，隨著漢人、日本人、荷蘭人、西班牙人相繼到來，原本保持相對穩定狀態的臺灣原住民族社會受到一定程度的攪動。面對外來者，原住民各部落會主動選擇有利於部落的同盟對象，也會與敵對的勢力產生衝突。不同族群之間各有盤算，有時彼此交惡，有時維持著不穩定的聯盟關係。而外來團體間彼此也有糾葛衝突。'},
  {id:'l_tangshan',n:'唐山過臺灣唸謠',v:'main',fl:'2F',z:'山海之間的共存與競逐',x:69.1,y:55.0,lvl:'full',dur:115,no:'223',
   tracks:{general:['tsl']},themes:{"listen": "must", "story": "opt"},tags:['常設展','山海之間的共存與競逐'],
   text:'這件展品位在「山海之間的共存與競逐」單元。1684年臺灣被清朝併入版圖，大量漢人移民持續渡海前來，在平原、丘陵、沿山發展出各自的村落、產業及生活方式；在這片山與海之間的土地上，不同人群相互共存，也彼此競逐。'},
  {id:'l_asai',n:'淺井惠倫採集平埔歌曲',v:'main',fl:'2F',z:'新秩序下的苦悶與夢想',x:45.8,y:53.3,lvl:'full',dur:120,no:'224',
   tracks:{general:['tsl']},themes:{"listen": "must", "story": "opt"},tags:['常設展','新秩序下的苦悶與夢想'],
   text:'這件展品位在「平埔原住民的人生故事」展區。不同地方的平埔社群，原本有自己的生活文化與網絡，再加上與漢人社會、清朝官府、歐美傳教士等不同人群的接觸，每個部落的際遇與發展都不盡相同。有的人與官府關係密切，身上冠有軍功、職銜；有的人則是收取地租的「番頭家」，或是跟漢人一樣投資經商；但也有更多人因為難以在原鄉過活，遠徙他處。從這些原住民社群人們的人生故事可以看到：在不同時代與際遇下，這塊土地上的人們，各自採用什麼樣的策略來生存發展。'},
  {id:'l_forest',n:'林業勞動歌',v:'main',fl:'2F',z:'新秩序下的苦悶與夢想',x:44.4,y:33.8,lvl:'full',dur:110,no:'225',
   tracks:{general:['tsl']},themes:{"listen": "must", "story": "opt"},tags:['常設展','新秩序下的苦悶與夢想'],
   text:'這件展品位在「新時代，新產業」展區。日本時代初期將臺灣當作熱帶經濟作物和糧食的生產地，有系統地開發臺灣各項農、林、漁等產業資源，以提供日本帝國所需。工業則以新式製糖及食品加工業為主。1930年代後期，總督府提出臺灣「工業化」的方針，戰爭時期並發展各項軍需工業，也替日後臺灣工業化奠定基礎。伴隨產業建設，島內外交通手段也逐漸完備。交通的完備與治安的穩定也逐步建構起臺灣旅遊業。日本帝國為展示其殖民建設成果，舉辦許多大型博覽會，產業與物產都是其中重要的宣傳面向。'},
  {id:'l_malan',n:'馬蘭阿美群的歌謠',v:'main',fl:'2F',z:'新秩序下的苦悶與夢想',x:37.0,y:49.6,lvl:'full',dur:120,no:'226',
   tracks:{general:['tsl']},themes:{"listen": "must", "story": "opt"},tags:['常設展','新秩序下的苦悶與夢想'],
   text:'這件展品位在「當原住民遭逢近代國家」展區。當日本帝國以近代國家形式進入臺灣，對人口、土地展開嚴密的掌控後，曾經在政治、文化上維持相對自主的山地，與雖已納入版圖但控制有限的東部地區，終於也逐步納入殖民體制。在國家的政策與征討下，原住民族的生活世界遭逢劇烈變動，並透過口述傳說，留下與官方紀錄大不相同、屬於族人觀點的歷史記憶。'},
  {id:'l_play',n:'唱遊歌曲',v:'main',fl:'2F',z:'新秩序下的苦悶與夢想',x:33.0,y:39.7,lvl:'full',dur:105,no:'227',
   tracks:{general:['tsl']},themes:{"listen": "must", "story": "opt"},tags:['常設展','新秩序下的苦悶與夢想'],
   text:'這件展品位在「近代教育與社會運動」展區。日本殖民者引進了近代教育，其主要目標是讓臺灣人成為「理想的日本國民」及殖民統治所需的基礎人力。但是近代教育同時啟發了臺灣人的自覺，也有不少臺灣人至島外接受教育，習得了近代議會政治民主等概念。這些新世代的知識份子不滿臺灣的殖民制度，透過政治與社會運動，取得臺灣民眾支持，形成新時代的抵抗行動，向殖民者爭取政治權利之外，也進行臺灣的社會文化改造運動。'},
  {id:'l_tca',n:'臺灣文化協會會歌',v:'main',fl:'2F',z:'新秩序下的苦悶與夢想',x:26.1,y:43.0,lvl:'full',dur:120,no:'228',
   tracks:{general:['tsl']},themes:{"listen": "must", "story": "opt"},tags:['常設展','新秩序下的苦悶與夢想'],
   text:'臺灣文化協會會歌的原件，附在1921年9月21日蔣渭水寫給林獻堂的文協創立大會邀請信裡。信中寫明，會歌平時用〈黃海戰〉曲調演唱，儀式時改用〈始政紀念歌〉曲調。'},
  {id:'l_pop',n:'流行音樂的誕生',v:'main',fl:'2F',z:'新秩序下的苦悶與夢想',x:17.5,y:24.3,lvl:'full',dur:125,no:'229',
   tracks:{general:['tsl']},themes:{"listen": "must", "story": "opt"},tags:['常設展','新秩序下的苦悶與夢想'],
   text:'這件展品位在「現代風格起步走」展區。從都市、城鎮開始，20世紀前半的臺灣人，普遍感受到時代變革的步伐愈催愈緊，從視覺、聽覺、身體意識等感官，到社會結構、人際倫理觀念，都反映大不相同的新氣象，有人稱之為「文明」，有人戲稱為「毛斷」（modern臺語音譯）。自固有慣習裡游離而出的新一代臺灣人，憑著「和洋」（日本/西洋）混雜的技術與形式，展開創作與生活文化的改良，現代臺灣的面貌也隨之逐漸成形。'},
  {id:'l_end',n:'終戰那一天',v:'main',fl:'2F',z:'新秩序下的苦悶與夢想',x:18.3,y:61.0,lvl:'full',dur:120,no:'230',
   tracks:{general:['tsl']},themes:{"listen": "must", "story": "opt"},tags:['常設展','新秩序下的苦悶與夢想'],
   text:'這件展品位在「戰爭淹沒了社會：臺灣人的二次世界大戰」展區。1930年代，總督府特別重視農漁村的經濟自立，推展部落振興運動，由上至下進行社區改造，推行社會教化，欲在鄉村建立一套新秩序。戰爭爆發後，社會教化體系便轉為支援戰爭的動員組織。臺灣人一方面過著緊縮的物質生活，另一方面還要面對皇民化運動的強大文化壓力，被鼓勵放棄自己原有的語言、姓名，甚至走向戰場、失去生命。'},
  {id:'l_demo',n:'臺灣民主歌',v:'main',fl:'2F',z:'新秩序下的苦悶與夢想',x:44.5,y:61.5,lvl:'full',dur:115,no:'231',
   tracks:{general:['tsl']},themes:{"listen": "must", "story": "opt"},tags:['常設展','新秩序下的苦悶與夢想'],
   text:'這件展品位在「近代教育與社會運動」展區。日本殖民者引進了近代教育，其主要目標是讓臺灣人成為「理想的日本國民」及殖民統治所需的基礎人力。但是近代教育同時啟發了臺灣人的自覺，也有不少臺灣人至島外接受教育，習得了近代議會政治民主等概念。這些新世代的知識份子不滿臺灣的殖民制度，透過政治與社會運動，取得臺灣民眾支持，形成新時代的抵抗行動，向殖民者爭取政治權利之外，也進行臺灣的社會文化改造運動。'},
  {id:'l_ban',n:'愛國歌曲與禁歌',v:'main',fl:'2F',z:'走向民主這條路',x:9.8,y:64.9,lvl:'full',dur:125,no:'232',
   tracks:{general:['tsl']},themes:{"listen": "must", "story": "opt"},tags:['常設展','走向民主這條路'],
   text:'這件展品位在「反共復國基地」展區。1950年韓戰爆發。以美國、蘇聯為首的資本主義、共產主義兩大國際陣營在東亞展開對抗，作為西太平洋「第一島鏈」關鍵位置的臺灣，由中國國民黨長期執政，成為中華民國「反共復國」的基地、「自由中國」的堡壘。隨著北京政府的外交拓展，中華民國的國際地位接連挫敗，1971年退出聯合國、1978年與美國斷交。然而，政府仍力主「三民主義統一中國」的政治口號，構成一黨獨大、以黨領政的威權體制。'},
  {id:'l_exile',n:'流離之音：歌曲裡的戰後原住民史',v:'main',fl:'2F',z:'走向民主這條路',x:7.8,y:71.0,lvl:'full',dur:130,no:'233',
   tracks:{general:['tsl']},themes:{"listen": "must", "story": "opt"},tags:['常設展','走向民主這條路'],
   text:'這件展品位在「走向民主這條路」單元。1945年後臺灣人熱烈參政，隨後卻受228事件的影響而噤聲；其後實施長達38年戒嚴。這條曲折的民主路，是不同意見折衝摩擦的過程，也是近兩、三代臺灣人相互看顧、多元對話的生命經驗。'},
  {id:'t_scissors',n:'鐵剪刀',v:'main',fl:'2F',z:'倚海而生的島與人',x:78.3,y:52.7,lvl:'full',dur:100,no:'241',
   tracks:{general:['tsl']},themes:{"touch": "must", "story": "opt"},tags:['常設展','倚海而生的島與人'],
   text:'這件展品位在「倚海而生的島與人」單元。16世紀中期，臺灣逐漸成為東亞貿易的會合點與轉運點，東西方各大海權勢力在此競逐，臺灣的原住民社會開始面對一波波外來衝擊。'},
  {id:'t_sugar',n:'糖郊李勝興米駝',v:'main',fl:'2F',z:'山海之間的共存與競逐',x:72.4,y:39.0,lvl:'full',dur:105,no:'242',
   tracks:{general:['tsl']},themes:{"touch": "must", "story": "opt"},tags:['常設展','山海之間的共存與競逐'],
   text:'這件展品位在「商業市鎮」展區。清代臺灣西部港口大多是商業繁盛的市鎮，郊商、文市、洋行遞次發展。當貨物自中國沿海運至港口後，經由郊行統籌，再由批發商、零售商及挑販逐層經手，最後才到消費者手中。其中，府城（今臺南）、鹿港、艋舺（今臺北萬華）、大稻埕這四個由南至北的港口城市，各自代表了清代臺灣不同階段與類型的商業發展。'},
  {id:'t_pig',n:'豬頭骨與檳榔',v:'main',fl:'2F',z:'山海之間的共存與競逐',x:84.8,y:43.1,lvl:'full',dur:100,no:'243',
   tracks:{general:['tsl']},themes:{"touch": "must", "story": "opt"},tags:['常設展','山海之間的共存與競逐'],
   text:'這件展品位在「山海之間的共存與競逐」單元。1684年臺灣被清朝併入版圖，大量漢人移民持續渡海前來，在平原、丘陵、沿山發展出各自的村落、產業及生活方式；在這片山與海之間的土地上，不同人群相互共存，也彼此競逐。'},
  {id:'t_police',n:'南無警察大菩薩',v:'main',fl:'2F',z:'新秩序下的苦悶與夢想',x:30.1,y:49.8,lvl:'full',dur:110,no:'244',
   tracks:{general:['tsl']},themes:{"touch": "must", "story": "opt"},tags:['常設展','新秩序下的苦悶與夢想'],
   text:'這件展品位在「日本殖民體制的建立：行政、警察、教化」展區。日本的殖民統治，主要可分為行政、警察、教化三大系統。首先是以臺灣總督府為頂點的行政體系，往上接續帝國中央政府，往下伸展至地方街庄役場，以專業分工的官僚確保績效。其次是警察、保甲系統，負責維持治安、執行法令。第三是以小學校、公學校為中心的教化系統。日本殖民統治前期，熟悉原有社會運作的臺灣人民，不滿日本統治帶來的近代國家運作模式，而屢有武裝反抗事件，總督府也逐步摸索調整其統治策略，透過三大系統逐步掌控臺灣，也使原本處於各自分散的地方社會狀態，逐步邁向一體化。'},
  {id:'t_siren',n:'警報器',v:'main',fl:'2F',z:'新秩序下的苦悶與夢想',x:22.2,y:56.1,lvl:'full',dur:100,no:'245',
   tracks:{general:['tsl']},themes:{"touch": "must", "story": "opt"},tags:['常設展','新秩序下的苦悶與夢想'],
   text:'國民政府遷臺以來大力推動防空工作，「逃警報」和「防空演習」因此成為許多臺灣人的共同記憶，至今仍有軍民聯合防空演習。'},
  {id:'t_flour',n:'以麵粉袋做成的衣褲',v:'main',fl:'2F',z:'走向民主這條路',x:10.9,y:69.3,lvl:'full',dur:105,no:'246',
   tracks:{general:['tsl']},themes:{"touch": "must", "story": "opt"},tags:['常設展','走向民主這條路'],
   text:'1950到1965年美援時期，美國援助臺灣麵粉等物資。純棉的麵粉袋（俗稱「卡動」）就成了民眾做內衣和家常服的布料，衣褲上常還印著中美合作標誌和製粉公司商標。'},
  {id:'mz1',n:'單元一｜海濱神姑：海口女巫的天后之路',v:'main',fl:'4F',z:'第一特展室｜萬相天后',x:61.8,y:57.6,lvl:'full',dur:110,no:'411',
   tracks:{general:['zh','en'],expert:['zh']},themes:{mazuR:'must'},tags:['特展','媽祖'],
   text:'媽祖原為只知其姓的巫女林氏，經由歷代對媽祖顯聖事蹟的層累，形塑出神通廣大的女聖人樣貌，可看見媽祖在政治與宗教力量塑造下，成為護國救民的英烈天妃。本單元透過17至19世紀的圖像與經典文獻，看見媽祖的形象在官方與民間的共同詮釋下，逐步確立為天后林默的過程。'},
  {id:'mz2',n:'單元二｜海上福星：媽祖信仰傳播的航跡',v:'main',fl:'4F',z:'第一特展室｜萬相天后',x:73.7,y:57.6,lvl:'full',dur:115,no:'412',
   tracks:{general:['zh','en'],expert:['zh']},themes:{mazuR:'must'},tags:['特展','媽祖'],
   text:'媽祖的海上神蹟，深受閩、粵兩地崇奉。明代以來，隨著頻繁的海上活動，媽祖信仰從中國東南沿海出發，沿著貿易路徑向東亞諸國延伸。船員與移民隨身攜帶的神像與聖物，使媽祖香火得以越過汪洋，在異鄉落地生根；延伸至臺灣後，又向外輻射至世界各地。'},
  {id:'mz3',n:'單元三｜盛裝駕到：千變萬化的臺灣天后',v:'main',fl:'4F',z:'第一特展室｜萬相天后',x:86.8,y:60.0,lvl:'full',dur:120,no:'413',
   tracks:{general:['zh','en'],expert:['zh']},themes:{mazuR:'must'},tags:['特展','媽祖'],
   text:'媽祖信仰深入臺灣後，因地域與族群的差異，被賦予不同的稱呼與形象：是榮及雙親的孝女，是慈愛赤子的媽婆；能以施藥救疫，也在戰火之中顯聖。除了多樣性的神像外，冠服、神輿與時尚精品，也形塑出不同時代的媽祖樣貌。'},
  {id:'mz4',n:'單元四｜萬年香火：當靈力鑄化為聖物',v:'main',fl:'4F',z:'第一特展室｜萬相天后',x:81.6,y:74.3,lvl:'full',dur:125,no:'414',
   tracks:{general:['zh','en'],expert:['zh']},themes:{mazuR:'must'},tags:['特展','媽祖'],
   text:'無形的靈力，憑附於有形的物件，亦降於大符與各類聖物；承受香火的香爐與運載神火的香擔，是最關鍵的靈力載體。進香、遶境與過爐，是親近媽祖的神聖時刻，也是廟與廟、人與人之間交通互動的時刻，將世代的信仰記憶傳承下去。'},
  {id:'mz5',n:'單元五｜善願必佑：在當代與媽祖相遇',v:'main',fl:'4F',z:'第一特展室｜萬相天后',x:65.8,y:74.3,lvl:'full',dur:130,no:'415',
   tracks:{general:['zh','en'],expert:['zh']},themes:{mazuR:'must'},tags:['特展','媽祖'],
   text:'隨時代更迭與社會結構變化，天后以各類形式顯聖與再現。數位科技改變了信仰傳播途徑，媽祖信仰以媒體直播與影像跨越地域限制；素昧平生的人們也因「結緣品」而聚合，比肩同行，使媽祖信仰得以歷久彌新。'},
  {id:'bd0',n:'零、非關公民歷史教室',v:'main',fl:'4F',z:'走廊延伸展區',x:34.2,y:41.2,lvl:'full',dur:100,no:'431',
   tracks:{general:['zh','en'],expert:['zh']},themes:{borderR:'must'},tags:['特展'],
   text:'當邊界被劃下時，我們如何看見真正的彼此？從過去到現在，不同時代都存在著被排除在主流社會及國家制度之外的人——他們可能沒有戶籍、沒有國籍，始終游移在法律與現實的邊界。本區從更長遠的歷史脈絡出發，回看「非公民」如何被界定與形成。'},
  {id:'bd1',n:'一、時代浪潮下的移動：跨越邊界的生命印記',v:'main',fl:'4F',z:'第三特展室｜邊界之外',x:9.2,y:36.0,lvl:'full',dur:105,no:'432',
   tracks:{general:['zh','en'],expert:['zh']},themes:{borderR:'must'},tags:['特展'],
   text:'「當動盪席捲世界，人們帶來的只是行李嗎？」臺灣的歷史與世界局勢緊密相連。來自圖伯特、緬甸、香港與烏克蘭的人們，因冷戰、政變、戰爭與迫害，陸續跨越邊界來到這裡；他們的移動不只是個人選擇，而是為了守護生命、自由、信仰與未來。'},
  {id:'bd2',n:'二、看不見的邊界',v:'main',fl:'4F',z:'第三特展室｜邊界之外',x:14.5,y:45.6,lvl:'full',dur:110,no:'433',
   tracks:{general:['zh','en'],expert:['zh']},themes:{borderR:'must'},tags:['特展'],
   text:'「跨過了邊界，邊界就消失了嗎？」「身分」的邊界，從來不是固定的，它會隨著法律制度、國際局勢與國家安全考量而被重新劃定。對許多來到臺灣的人而言，邊界不只存在於海關，也延伸到入境後的停留、居留或定居審查。'},
  {id:'bd3',n:'三、At Home',v:'main',fl:'4F',z:'第三特展室｜邊界之外',x:18.4,y:34.8,lvl:'full',dur:115,no:'434',
   tracks:{general:['zh','en'],expert:['zh']},themes:{borderR:'must'},tags:['特展'],
   text:'「『家』，對你來說是什麼？」對有些人而言，「家」是正在經歷戰火的地方；對流亡者而言，是宗教、文化與身分認同的延續；對離開香港的人而言，那個地方還在，卻已不同。來自不同地方的人們，帶著各自對「家」的記憶與牽掛來到臺灣。'},
  {id:'bd4',n:'四、邊界上的未盡旅程',v:'main',fl:'4F',z:'第三特展室｜邊界之外',x:19.7,y:43.2,lvl:'full',dur:120,no:'435',
   tracks:{general:['zh','en'],expert:['zh']},themes:{borderR:'must'},tags:['特展'],
   text:'「當全球的流離與遷徙來到臺灣，我們將讓邊界變窄，還是讓關係展開？」我們看見人們在動盪中離開家園，看見人的身分如何在穿越邊界後被重新定義，也看見許多人在不安的處境中，仍努力在這裡生活、行動並照顧彼此。'},
  {id:'kidtrain',n:'時光車站：火車劇場',v:'main',fl:'1F',z:'時光車站',x:46.1,y:23.7,lvl:'place',fac:'info',tracks:{},themes:{},tags:['親子'],   /* 時光車站沒有導覽，只當地點（本日活動「火車劇場」帶路用） */
   text:'火車站內熙來攘往、好不熱鬧！等待火車發車的時候，可以逛逛車站大廳，聞一聞、摸一摸、聽一聽。嗚～嗚～～火車就要開了！搖晃的火車結合動畫《小鯨魚的臺灣冒險號》，準備展開一場充滿臺灣特色的五感奇幻旅程吧！'},
  {id:'k_cloth',n:'我會做衣服',v:'main',fl:'1F',z:'兒童廳',x:29.2,y:55.7,lvl:'full',dur:90,no:'112',
   tracks:{kid:['zh'],general:['zh']},themes:{kids:'must'},tags:['親子'],
   text:'服飾是我們生活中重要的一部分，想像一下穿上不同時代、不同族群衣服的自己。把穿著不同年代服飾的大玩偶轉一轉、站到魔法試衣鏡前試穿臺灣不同族群的服飾，還可以自己動手做衣服，當個獨領時尚的小裁縫。'},
  {id:'k_sound',n:'我愛玩聲音',v:'main',fl:'1F',z:'兒童廳',x:18.4,y:58.4,lvl:'full',dur:90,no:'113',
   tracks:{kid:['zh'],general:['zh']},themes:{kids:'must'},tags:['親子'],
   text:'這裡充滿了各種臺灣古早生活的趣味聲音，6個聲音體驗裝置，讓你自己來啟動來自早期街頭上的日常聲景。不論是冰淇淋的叭噗、穿梭街道的腳踏車，還是轉動童趣的波浪鼓，一起來感受這些懷舊又甜蜜的聲音。'},
  {id:'k_house',n:'我來蓋房子',v:'main',fl:'1F',z:'兒童廳',x:21.1,y:35.1,lvl:'full',dur:90,no:'114',
   tracks:{kid:['zh'],general:['zh']},themes:{kids:'must'},tags:['親子'],
   text:'你住在什麼樣的房子裡面呢？這裡以街屋、三合院等臺灣傳統老房子為主題，用大大的積木蓋出經典老房子，或用漂亮的馬約利卡磚拼出自己的風格。'},
  {id:'k_future',n:'我創造未來',v:'main',fl:'1F',z:'兒童廳',x:14.2,y:45.8,lvl:'full',dur:90,no:'115',
   tracks:{kid:['zh'],general:['zh']},themes:{kids:'must'},tags:['親子'],
   text:'牆上的6隻鯨魚，每一隻都乘載著一個過往年代的臺灣島嶼。那未來的臺灣呢？走進島鯨飛船，想像看看未來的島嶼會過著怎樣的生活，把自己創作的未來島嶼投影到飛行船上，一起拍張照！'},
  {id:'k_farm',n:'一起去種田',v:'main',fl:'1F',z:'兒童廳',x:9.2,y:27.6,lvl:'full',dur:90,no:'116',
   tracks:{kid:['zh'],general:['zh']},themes:{kids:'must'},tags:['親子'],
   text:'平原是臺灣的穀倉所在，我們常見的主食稻米，是如何生產出來的呢？轉動豐收彈珠台的把手，讓彈珠滾過稻米生長的旅程，看看最後可以做成什麼樣的食物。'},
  {id:'k_fish',n:'乘船追飛魚',v:'main',fl:'1F',z:'兒童廳',x:20.8,y:19.7,lvl:'full',dur:90,no:'117',
   tracks:{kid:['zh'],general:['zh']},themes:{kids:'must'},tags:['親子'],
   text:'臺灣四面環海，許多族群都發展出靠海為生的海洋文化。搭上小船、搖動划槳，感受與飛魚和鬼頭刀共游的海上樂趣，一邊認識關於飛魚的傳說及禁忌，以及故事背後的生態永續精神。'},
  {id:'k_forest',n:'山林找腳印',v:'main',fl:'1F',z:'兒童廳',x:32.9,y:26.6,lvl:'full',dur:90,no:'118',
   tracks:{kid:['zh'],general:['zh']},themes:{kids:'must'},tags:['親子'],
   text:'臺灣有廣大的森林，裡面有大自然的寶藏。跟著原住民獵人進入山林，拿起畫筆拓印地上的神祕腳印；也進入淺山丘陵，在倒木的小窺管裡尋找臺灣早期人們在淺山的活動。'},

const ORDER = P.map(p=>p.id);
const hasTrack = (p,lang,persona) => ((p.tracks||{})[persona]||[]).includes(lang);   // 導聆段（seg）沒有 tracks
const anyLang  = (p,lang) => Object.values(p.tracks||{}).some(a=>a.includes(lang));

function pool(themeId, lang, persona){
  return P.filter(p => p.lvl==='full' && p.themes[themeId] && hasTrack(p,lang,persona))
          .sort((a,b)=>ORDER.indexOf(a.id)-ORDER.indexOf(b.id));
}
/* 步行時間由圖資推算：跨場館 12 分／同館跨樓層 4／同層跨展區 2／同展區 1
   —— 與導航功能同一筆投資（md §四🟡） */
function walk(a,b){
  if(!a) return 0;
  if(a.v!==b.v) return 12;
  if(a.fl!==b.fl) return 4;
  return a.z===b.z ? 1 : 2;
}
function timeOf(list){
  let audio=0,w=0,prev=null;
  list.forEach(p=>{ audio+=p.dur/60; w+=walk(prev,p); prev=p; });
  return {audio:Math.round(audio), walk:Math.round(w), total:Math.round(audio+w)};
}
function plan(themeId, lang, persona, minutes){
  const all = pool(themeId, lang, persona);
  const musts = all.filter(p=>p.themes[themeId]==='must');
  const opts  = all.filter(p=>p.themes[themeId]==='opt');
  let list = musts.slice();
  while(list.length && timeOf(list).total > minutes) list.pop();
  opts.forEach(o=>{
    const trial = list.concat([o]).sort((a,b)=>ORDER.indexOf(a.id)-ORDER.indexOf(b.id));
    if(timeOf(trial).total <= minutes) list = trial;
  });
  return list;
}
const MIN_STATIONS = 1;   // 展覽＝路線，一站的小特展也是合法路線
function personasFor(themeId, lang){
  return Object.keys(PERSONAS).filter(k => pool(themeId,lang,k).length >= MIN_STATIONS);
}
function langsFor(themeId){
  return Object.keys(TRACK_LANGS).filter(l => personasFor(themeId,l).length > 0);
}
/* 某語系下沒有任何成立組合 → 該路線整體不出現（不灰掉、不說明） */
function themesFor(lang){ return THEMES.filter(t => personasFor(t.id,lang).length > 0 || personasFor(t.id,'tsl').length > 0); }   // 只有手語版的路線，各介面語言都看得到
/* 這一站要用哪個導覽語言播：介面語言 → 路線選的導覽語言 → 台灣手語 */
function playLang(p){ return [S.lang, S.clang, 'tsl'].find(l=>l && (hasTrack(p,l,S.persona)||hasTrack(p,l,'general'))) || null; }
const canPlay = p => p && p.lvl==='full' && !!playLang(p);

const TIME_STEPS = [30,45,60,90,120,180,240,300];
/* 時間刻度跟著路線走：只列比「全部聽完」短的刻度，最後一格＝剛好能全部聽完（不會出現選 30 分卻只有 15 分內容） */
const STEP_BASE = [10,15,20,30,45,60,90,120,180,240,300];
function stepsFor(themeId, lang, persona){
  const full = timeOf(pool(themeId,lang,persona)).total;
  const st = STEP_BASE.filter(m=>m<full);
  st.push(STEP_BASE.find(m=>m>=full) || 300);
  return st.length>1 ? st : [Math.max(5,st[0]-5), st[0]];
}
const tlabel = m => m<60 ? m+' m' : (m%60 ? Math.floor(m/60)+' h '+(m%60)+' m' : Math.floor(m/60)+' h');
/* 「推薦」＝內容池吃得剛好的那一格 */
function recommend(themeId, lang, persona){
  const full = timeOf(pool(themeId,lang,persona)).total;
  let best = TIME_STEPS[0];
  TIME_STEPS.forEach(m=>{ if(Math.abs(m-full) < Math.abs(best-full)) best = m; });
  return best;
}

function closePlayer(){

/* micro 拖曳＋吸邊：只能在畫面中段活動（上 130／下 225 內，避開上下 UI），
   放開貼最近的左右邊；輕點＝第一下展開、第二下進內頁 */
const MICRO_Y_MIN = 130;
/* 下限依底部選單實際位置算：播放器底邊停在選單上方 8px；沒有底部選單的頁面停在離底 16px */
function microPadBottom(host){
  const nav=document.querySelector('#frame .bnav'), mh=(document.getElementById('microP')||{}).offsetHeight||54;
  return nav ? (host.bottom-nav.getBoundingClientRect().top)+mh+8 : mh+16;
}
let _mic=null;
function microDown(e){
  if(e.target.closest('.icb')) return;               // 展開態的按鈕不觸發拖曳
  e.preventDefault();
  const el=document.getElementById('microP');
  const host=el.parentElement.getBoundingClientRect(), r=el.getBoundingClientRect();
  _mic={dx:e.clientX-r.left, dy:e.clientY-r.top, host, el, moved:false, sx:e.clientX, sy:e.clientY, px:0, py:0};
  const mv=ev=>{
    if(!_mic) return;
    if(!_mic.moved && Math.hypot(ev.clientX-_mic.sx, ev.clientY-_mic.sy)<6) return;
    _mic.moved=true; el.style.transition='none';
    const x=Math.max(4, Math.min(_mic.host.width-el.offsetWidth-4, ev.clientX-_mic.host.left-_mic.dx));
    const y=Math.max(MICRO_Y_MIN, Math.min(_mic.host.height-microPadBottom(_mic.host), ev.clientY-_mic.host.top-_mic.dy));
    el.style.left=x+'px'; el.style.right='auto'; el.style.top=y+'px'; el.style.bottom='auto';
    _mic.px=x; _mic.py=y;
  };
  const up=()=>{
    window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up);
    const m=_mic; _mic=null;
    if(!m.moved){
      if(!S.microOpen){ S.microOpen=true; render(); }
      else {                     // 跳回正在聽的展品位置並置中；內頁從播放器的位置展開
        const r=m.el.getBoundingClientRect();
        growFrom(m.el); S.microOpen=false;
        enterTour();
      }
      return;
    }
    S.microPos={ side:(m.px+m.el.offsetWidth/2) < m.host.width/2 ? 'left' : 'right',
                 y:Math.max(MICRO_Y_MIN, Math.min(m.host.height-microPadBottom(m.host), m.py)) };
    render();
  };
  window.addEventListener('pointermove',mv);
  window.addEventListener('pointerup',up);
}
/* 記下迷你播放器那一條在畫面中的上下位置，內頁從這裡往上展開、返回時收回這裡 */
function growFrom(el){
  const r=el.getBoundingClientRect(), f=document.getElementById('frame').getBoundingClientRect();
  S._grow={t:Math.max(0,r.top-f.top), b:Math.max(0,f.bottom-r.bottom), l:Math.max(0,r.left-f.left), r:Math.max(0,f.right-r.right), rad:el.id==='microP'?16:18};
  el.animate&&el.animate([{transform:'scale(1)'},{transform:'scale(.95)'},{transform:'scale(1)'}],{duration:160,easing:'ease-out'});   /* 按下的回饋 */
}
function miniPlayer(off){
  if(!S.player) return '';
  const p = byId(S.player.id), no = S.player.mode==='route' ? stationNo(p.id) : 0;
  const pct = (S.player.mode==='route' && S.route) ? (S.route.heard.length/S.route.list.length*100) : 34;
  const segOn = S.player.mode==='seg', inRt = !!S.route && (no>0 || segOn);   /* 路線中：播放鍵兩側加上一站／下一站 */
  const ex0 = exThemeOf(p), ex = !inRt && !segOn && ex0 && !(onTour()&&S.route.themeId===ex0.id) ? ex0 : null;   /* 單獨聽一件：給整個展覽導覽的入口（正在走同一個展覽就不給） */
  return `<div class="minifloat" style="${off?'bottom:'+off+'px':''}">${inRt?`<div class="skrow">
    <button class="fchip" ${mapPos().i<=0?'disabled':''} onclick="mapStep(-1)">${I.prev} 上一站</button>
    <button class="fchip" ${mapPos().i>=mapPos().seq.length-1?'disabled':''} onclick="mapStep(1)">下一站 ${I.next}</button></div>`
    :ex?`<div class="skrow"><button class="fchip" onclick="startEntryFrom('${ex.id}','${p.id}')">${onTour()?'改聽':'開始'}「${ex.n.split('：')[0]}」展覽導覽 ${I.arrow}</button></div>`:''}<div class="mini" onclick="growFrom(this);go('player')">

/* Dainy 永遠是浮動面板：peek(1/3 只有對話框) → half(1/2 對話) → full(完整紀錄)。
   上滑升級、下滑＝回到呼叫前的畫面；half 左上＝關閉、full 左上＝過去對話紀錄 */
function closeDainy(){
  if(S._dainyClosing) return;
  S.kbd=false; S.voiceMode=false;
  if(S.dainy.mode==='listening'){ clearInterval(window._lst); S.dainy.mode=S.dainy.msgs.length?'talking':'idle'; }
  const panel=document.getElementById('dainyPanel'), dimEl=document.getElementById('dainyDim');
  if(panel){                                         // 縮合動態：面板滑下＋dim 淡出，播完才移除
    S._dainyClosing=true;
    panel.style.transition='transform .26s ease-in, opacity .26s ease-in';
    panel.style.transform='translateY(104%)'; panel.style.opacity='.6';
    if(dimEl) dimEl.style.opacity='0';
    setTimeout(()=>{ S._dainyClosing=false; S.dainySheet=null; render(); }, 250);
  } else { S.dainySheet=null; render(); }
}
function sheetDrag(e){
  const sy=e.clientY;
  const mv=ev=>{
    const dy=ev.clientY-sy;
    if(dy>40){ cleanup(); closeDainy(); }             // 下滑＝回到呼叫黛尼之前的畫面
  };
  const up=()=>cleanup();
  function cleanup(){ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); }
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
}
function dainyCtx(){                               // 膠囊 tag＝呼叫當下畫面的語境；首頁等無語境畫面不顯示
  if(S.dainyCtxOff) return null;
  const scr=S.screen;
  if(scr==='map')
    return S.mapView==='floor' ? vname(S.venue)+(S.floor&&S.floor!=='—'?'｜'+S.floor:'') : null;
  if(scr==='player'||scr==='tourmap'||scr==='playlist'){
    if(!S.player) return null;
    if(S.player.mode==='seg') return S.route?theme(S.route.themeId).n:null;
    const p=byId(S.player.id); return p?p.z:null;
  }
  if(scr==='route') return S.route?theme(S.route.themeId).n:null;
  if(scr==='routeinfo'||scr==='routegen') return S.viewTheme?theme(S.viewTheme).n:null;
  return null;                                     // home / entry / code / member / dainylist…
}
function copyMsg(i){

}
function fbMsg(i,v){
  const m=S.dainy.msgs[i];
  if(v==='down'){
    if(m.fb==='down'){ m.fb=null; render(); return; }     // 再點一次取消
    S.report={i, reason:null, note:''}; render(); return; // 倒讚 → 先開回報彈窗
  }
  m.fb = m.fb===v ? null : v;
  if(m.fb==='up'){ say('回饋：讚'); toast('謝謝回饋！'); }
  render();
}

/* =====================================================================
   ㉔ 離線預載（標規 四（三）4：清單／MB／下載進度／暫停／已可離線／移除）
   ===================================================================== */
function offItems(){
  return EXHIBITIONS.filter(e=>!e.online).map(e=>{
    const pts = P.filter(x=>!x.seg&&x.lvl==='full');
    const n = Math.max(3, Math.round(pts.length/EXHIBITIONS.length)+2);
    return {id:e.id, n:e.n, type:e.type, count:n, mb:Math.round(n*4.6*10)/10};
  });
}
function offState(id){ return (S.offline||{})[id] || {st:'idle', pct:0}; }
function offStart(id){
  S.offline = S.offline||{};
  const cur = offState(id);
  if(cur.st==='running'){ S.offline[id]={st:'paused', pct:cur.pct}; say('暫停下載'); render(); return; }
  S.offline[id] = {st:'running', pct:cur.pct||0};
  say('開始預載：'+id);
  render();
  clearInterval(window['_off_'+id]);
  window['_off_'+id] = setInterval(()=>{
    const o = S.offline[id];
    if(!o || o.st!=='running'){ clearInterval(window['_off_'+id]); return; }
    o.pct = Math.min(100, o.pct + 7);
    if(o.pct>=100){ o.st='done'; clearInterval(window['_off_'+id]); toast('已可離線使用'); }
    render();
  }, 380);
}
function offRemove(id){
  S.offline = S.offline||{};
  clearInterval(window['_off_'+id]);
  delete S.offline[id];
  toast('已移除離線內容，空間已釋出');
  render();
}
function scrOffline(){
  const items = offItems();
  const done = items.filter(i=>offState(i.id).st==='done');
  const used = Math.round(done.reduce((a,i)=>a+i.mb,0)*10)/10;
  return shell(`
  ${navbar('離線預載')}
  <div class="body pad" style="padding-top:8px">
    <div class="tiny" style="margin:2px 2px 14px">
      先在有網路時下載，館內收訊不好也能聽。已下載 ${done.length} 檔・佔用 ${used} MB。</div>
    ${items.map(it=>{
      const o = offState(it.id);
      return `<div class="card" style="padding:13px 14px;margin-bottom:12px">
      <div style="display:flex;gap:11px;align-items:center;margin-bottom:${o.st==='idle'?'0':'10px'}">
        <div style="width:46px;height:46px;border-radius:10px;flex:0 0 46px;overflow:hidden;background:#E6E6E6;position:relative">
          ${artBox(it.id, it.n)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${it.n}</div>
          <div class="tiny" style="margin-top:3px">${it.count} 則語音・約 ${it.mb} MB</div></div>
        ${o.st==='done'
          ? `<button class="chip out" style="height:32px;padding:0 12px;flex:0 0 auto" onclick="offRemove('${it.id}')">移除</button>`
          : `<button class="chip ${o.st==='running'?'teal':'out'}" style="height:32px;padding:0 12px;flex:0 0 auto"
              onclick="offStart('${it.id}')">${o.st==='running'?'暫停':(o.st==='paused'?'繼續':'下載')}</button>`}
      </div>
      ${o.st==='done'
        ? `<div style="display:flex;align-items:center;gap:7px;font-size:12px;color:#2E7D52">
            <span style="width:7px;height:7px;border-radius:99px;background:#2E7D52"></span>已可離線使用</div>`
        : (o.st==='idle' ? '' : `
          <div class="progress"><i style="width:${o.pct}%"></i></div>
          <div style="display:flex;justify-content:space-between;margin-top:5px" class="tiny">
            <span>${o.st==='paused'?'已暫停':'下載中'} ${o.pct}%</span>
            <span>${Math.round(it.mb*o.pct/100*10)/10} / ${it.mb} MB</span></div>`)}
      </div>`;}).join('')}
    <div class="tiny" style="margin:6px 2px 0;line-height:1.9">
      館方在後臺可以指定「建議預載」的展覽；離線內容會在展覽更新時提示重新下載。</div>
    <div style="height:70px"></div>
  </div>`);
}

/* =====================================================================
   本日活動時刻表（訪談：館內每天有不同場次，觀眾依時刻表安排今天怎麼逛）
   場次照臺史博官網「開放時間」各設施場次表（cp.aspx?n=4088）；正式版由後台「場館設定」維護、每日帶入。
   現在時間可用 ?now=14:20 示範；?day=sat 示範假日場次。
   ===================================================================== */
const _qs = new URLSearchParams(__QS);
function nowMin(){
  const hq=(location.hash.match(/now=(\d{1,2}:\d{2})/)||[])[1];   // 發布版只能帶 #：#now=16:55 示範閉館前 5 分鐘
  const q=hq||_qs.get('now');
  if(q&&/^\d{1,2}:\d{2}$/.test(q)){ const [h,m]=q.split(':').map(Number); return h*60+m; }
  const d=new Date(); return d.getHours()*60+d.getMinutes();
}
function isHoliday(){ const q=_qs.get('day'); if(q) return q==='sat'||q==='sun'; const g=new Date().getDay(); return g===0||g===6; }
const hm = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
const fmtHM = m => String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function every(from,to,step){ const out=[]; for(let m=hm(from);m<=hm(to);m+=step) out.push(fmtHM(m)); return out; }
function todayEvents(){
  const hol=isHoliday();
  const dow=(()=>{ const q=_qs.get('day'); if(q==='sat') return 6; if(q==='sun') return 0; return new Date().getDay(); })();
  /* VR 片單照官網場次表：週二四六《hongu' Utax彩虹》、週三五日《重返第一法庭．噍吧哖世紀大審判》 */
  const vrFilm = [2,4,6].includes(dow) ? '《hongu\' Utax彩虹》' : '《重返第一法庭．噍吧哖世紀大審判》';
  return [
    {id:'ev_tour',    n:'常設展定時導覽',   loc:'f_info1',    where:'1F 服務臺集合', dur:55,
      note:'每場上限 40 人・導覽器每臺 30 元', s:['10:30','14:30'].map(t=>({t}))},
    {id:'ev_train',   n:'時光車站－火車劇場', loc:'kidtrain',   where:'1F 時光車站', dur:10,
      note: hol?'開館後現場預約':'各場次現場排隊', s:['09:30','10:00','10:30','11:00','11:30','12:00','13:30','14:00','14:30','15:00','15:30','16:00'].map(t=>({t}))},
    {id:'ev_theater', n:'圓形劇場｜斯土斯民', loc:'f_theater1', where:'1F 圓形劇場', dur:11,
      s:['09:30','10:30','11:30','13:30','14:30','15:30','16:30'].map(t=>({t}))},
    {id:'ev_theater2',n:'圓形劇場｜走過邊界', loc:'f_theater1', where:'1F 圓形劇場', dur:11,
      s:['10:00','11:00','12:00','14:00','15:00','16:00'].map(t=>({t}))},
    {id:'ev_vr',      n:'VR '+vrFilm,      loc:'f_vr4',      where:'4F VR再現製造所', dur:17,
      note:'免費・現場報名・每場 6 席', s:['09:30','10:15','11:00','14:00','14:45','15:30'].map(t=>({t}))},
    {id:'ev_kids',    n:'兒童廳入場',       loc:'k_cloth',    where:'1F 兒童廳', dur: hol?45:150,
      note: hol?'每場限 100 位・開放 10 分鐘後停止入場':'自由入場・結束前 10 分鐘停止入場',
      s:hol?['09:30','10:30','11:30','14:00','15:00','16:00'].map(t=>({t})):[{t:'09:30',end:'12:00'},{t:'14:00',end:'16:30'}]},
  ].map(e=>{
    const now=nowMin();
    const ss=e.s.map(x=>{ const st=hm(x.t), en=x.end?hm(x.end):st+(e.dur||30);
      return {...x, st, en, state: now>=en?'past':(now>=st?'live':'next')}; });
    const live=ss.find(x=>x.state==='live'), next=ss.find(x=>x.state==='next');
    return {...e, ss, live, next, left: ss.filter(x=>x.state!=='past').length};
  });
}
function eventsSection(full){
  const now=nowMin(), evs=todayEvents();
  evs.sort((a,b)=>{ const ka=a.left?(a.live?a.live.st:a.next.st):9999, kb=b.left?(b.live?b.live.st:b.next.st):9999; return ka-kb; });
  const remain = evs.reduce((n,e)=>n+e.left,0);
  const closed = now>=hm('17:00');
  const chip = (x,first) => {
    const lab = (x.label?x.label+' ':'')+x.t+(x.end?'–'+x.end:'');
    if(x.state==='past') return `<span style="display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:999px;
      font-size:12px;color:#6B6B6B;background:#F3F3F3;text-decoration:line-through">${lab}</span>`;
    if(x.state==='live') return `<span style="display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;
      font-size:12px;font-weight:700;color:var(--acc-d);background:#fff;border:1.5px solid var(--acc)"><i style="width:6px;height:6px;border-radius:9px;background:var(--acc)"></i>進行中 ${lab}</span>`;
    return first
      ? `<span style="display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;background:var(--ink)">下一場 ${lab}</span>`
      : `<span style="display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;color:var(--acc-d);background:var(--acc-l)">${lab}</span>`;
  };
  return `<div class="sec" style="margin-top:${full?6:22}px">
    ${full?'':`<div class="sec-h2"><h3>本日活動</h3><em>today</em>
      <span class="all" style="cursor:pointer" onclick="go('events')">查看全部 ›</span></div>`}
    <div class="sec-sub" style="margin-bottom:14px">${full?'現在 '+fmtHM(now)+'・':''}${closed?'今天的場次都結束了，明天見':(remain?'今天還有 '+remain+' 個場次，先排好想參加的，再決定先逛哪裡':'今天的場次都結束了')}</div>
    <div class="rowlist" style="margin:0 16px">${evs.map(e=>{
      const firstNext = e.next;
      const status = e.live ? '進行中'+(e.live.end?'，到 '+e.live.end:'')
        : e.next ? (e.next.st-now<=60 ? (e.next.st-now)+' 分鐘後開始' : '下一場 '+e.next.t)
        : '今日場次已結束';
      return `<button class="row" style="display:block;width:100%;text-align:left;padding:14px 14px" onclick="openSheetFrom('${e.loc}')">
        <div style="display:flex;align-items:baseline;gap:8px">
          <div style="flex:1;min-width:0;font-size:15px;font-weight:700;color:${e.left?'var(--ink)':'#6B6B6B'}">${e.n}</div>
          <span class="tiny" style="flex:0 0 auto;${e.live||e.next?'color:var(--ink);font-weight:600':''}">${status}</span>
        </div>
        <div class="tiny" style="margin:2px 0 8px">${e.where}${e.note?'・'+e.note:''}</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${(full?e.ss:[e.live||e.next].filter(Boolean)).map(x=>chip(x, x===firstNext&&!e.live)).join('')}</div>
      </button>`; }).join('')}</div>
  </div>`;
}

/* 閉館提醒：閉館前 30 分鐘、5 分鐘各跳一次（17:00 閉館）；5 分鐘那則直接帶去出口。

const CLOSE_AT='17:00';
function closeStage(){ const left=hm(CLOSE_AT)-nowMin(); return left>0&&left<=5?5:(left>0&&left<=30?30:0); }
function closeDue(){ if(document.body.classList.contains('embed')) return 0;

/* 首頁主視覺＝場館地圖（掃 QR 進站第一眼就知道「這是用地圖逛的」）：

const HERO_FLS=['site','2F','1F','4F'];   // site＝全區（場館外：園區、停車場、公車站）
const heroLab=fl=>fl==='site'?'全區地圖｜展示教育大樓・臺灣歷史公園・交通與停車':VENUES.main.floors[fl].label;
function heroMap(){

        </div></div>`; }).join('')}
    <div style="position:absolute;left:14px;top:12px;display:flex;gap:6px;z-index:2" onclick="event.stopPropagation()">
      ${HERO_FLS.map((fl,k)=>`<button class="chip ${k===i?'teal':'out'}" data-hchip="${fl}" style="height:28px;padding:0 11px;font-size:12px"
        onclick="heroSet(${k});event.stopPropagation()">${fl==='site'?'全區':fl}</button>`).join('')}</div>
    <div style="position:absolute;left:0;right:0;bottom:0;padding:34px 16px 14px;z-index:2;
      background:linear-gradient(rgba(251,250,246,0),rgba(251,250,246,.94) 46%);display:flex;align-items:flex-end;gap:10px">
      <div style="flex:1;min-width:0">

/* 漂浮卡片的落點：x%／y%／旋轉／深度（0 遠 1 中 2 近）——近景先用，資料夾在正中央 */
const DECK_SLOTS = [[14,50,-6,2],[86,48,7,2],[30,20,-9,1],[70,18,8,1],[30,82,5,1],[70,82,-7,1],
  [50,10,3,1],[12,24,-13,0],[88,26,12,0],[50,90,-3,0],[14,76,11,0],[86,74,-11,0],[38,34,-5,0],[62,34,6,0],
  [38,66,4,0],[62,66,-5,0],[8,62,-8,0],[92,62,9,0],[22,8,10,0],[78,8,-10,0],[22,92,-9,0],[78,92,8,0],[8,38,6,0],[92,38,-6,0]];
function deckSlotOf(e,id){                            /* 卡片一旦落定就不換位：新卡拿最小的空位 */
  e.slots=e.slots||{};
  if(e.slots[id]===undefined){ const used=new Set(Object.values(e.slots)); let i=0; while(used.has(i)) i++; e.slots[id]=i; }
  return e.slots[id];
}
function deckCard(p,slot,W,H,anim,order){
  const [x,y,r,d]=DECK_SLOTS[slot%DECK_SLOTS.length];
  const sc=[.8,.93,1.05][d], op=[.72,.9,1][d], bl=[.8,0,0][d], z=[1,2,4][d];
  const dx=(50-x)/100*W, dy=(50-y)/100*H;             // 從中央資料夾飛出來／收回去
  return `<div class="dcard ${anim?'':'still'}" id="dc-${p.id}" style="left:${x}%;top:${y}%;--r:${r}deg;--s:${sc};--dx:${dx}px;--dy:${dy}px;
      z-index:${z};opacity:${op};${bl?'filter:blur('+bl+'px);':''}animation-delay:${anim?order*.06:0}s">
    <div class="dfloat" style="--dur:${3.6+(slot%4)*.45}s;--del:${-(slot*.7)%3.6}s">
      <div class="dthumb" title="${p.n}">${artBox(p.id,p.n)}</div></div></div>`;
}
function entryCalc(e){
  const t=theme(e.themeId), rec=recommend(e.themeId,e.lang,e.persona);
  const steps=stepsFor(e.themeId,e.lang,e.persona);
  if(!steps.includes(e.minutes)) e.minutes = e.minutes==null ? null : steps.reduce((a,b)=>Math.abs(b-e.minutes)<Math.abs(a-e.minutes)?b:a);
  const idx=steps.indexOf(e.minutes), pos=idx/(steps.length-1)*100;
  const pl=plan(e.themeId,e.lang,e.persona,e.minutes), tm=timeOf(pl);
  return {t,rec:steps[steps.length-1],idx,pos,pl,tm,steps};
}
function folderBody(e,c){

}

  $('sldVal').style.left=c.pos+'%'; $('sldVal').textContent=tlabel(e.minutes);
  $('recChip').style.left=recPos(e,c)+'%'; $('recChip').innerHTML=recChip(e,c);
  const deck=$('deck'), W=deck.clientWidth, H=deck.clientHeight;
  const want=new Set(c.pl.map(p=>p.id));
  deck.querySelectorAll('.dcard').forEach(el=>{
    const id=el.id.slice(3);
    if(!want.has(id) && !el.classList.contains('out')){
      el.classList.add('out'); delete e.slots[id];
      setTimeout(()=>{ if(el.classList.contains('out')) el.remove(); },460);
    }
  });
  let order=0;
  c.pl.forEach(p=>{
    const el=$('dc-'+p.id);
    if(el){ if(el.classList.contains('out')){ el.classList.remove('out'); deckSlotOf(e,p.id); } return; }
    $('folder').insertAdjacentHTML('beforebegin', deckCard(p,deckSlotOf(e,p.id),W,H,true,order++));
  });
}
/* 按「繼續」：上下區塊各自退場、卡片全部收進資料夾、資料夾裡出現組路線的三步 → 進導覽內頁 */
function commitRoute(){
  if(S._committing) return;                         /* 連點「繼續」不重複觸發 */
  const deck=document.getElementById('deck');
  if(!deck || S.screen!=='entry' || matchMedia('(prefers-reduced-motion: reduce)').matches){ finishRoute(); return; }
  S._committing=true;
  try{ commitAnim(deck); }catch(err){ finishRoute(); return; }   /* 收卡動畫出錯就直接進導覽內頁，不卡在問答頁 */
  clearTimeout(window._gen);
  window._gen=setTimeout(finishRoute, 2200);
}
function commitAnim(deck){
  const $=id=>document.getElementById(id);
  ['entryTop','entrySlider'].forEach(id=>$(id)&&$(id).classList.add('leave-up'));
  ['entryBot','entryCta'].forEach(id=>$(id)&&$(id).classList.add('leave-down'));
  /* 上下區塊退場後，整個 deck 滑到畫面垂直正中 */
  const ph=$('frame').getBoundingClientRect(), dr=deck.getBoundingClientRect();
  const shift=(ph.top+ph.height/2)-(dr.top+dr.height/2);
  deck.style.transition='transform .75s cubic-bezier(.2,.8,.3,1) .3s'; deck.style.transform=`translateY(${shift}px)`;
  const W=deck.clientWidth, H=deck.clientHeight;
  const cards=[...deck.querySelectorAll('.dcard')];
  deck.style.maskImage='none'; deck.style.webkitMaskImage='none'; deck.style.overflow='visible';   // 收合後不需要邊緣淡出；步驟文字在資料夾下方要露得出來
  const peekN=Math.min(2,cards.length);           // 兩張從上緣露出上半張，其餘原尺寸收在玻璃後面（不縮、不淡出）
  cards.forEach((el,i)=>{
    el.style.animation='none';
    el.style.transition=`transform .62s cubic-bezier(.4,0,.6,1) ${i*.04}s`;
    const x=parseFloat(el.style.left)/100*W, y=parseFloat(el.style.top)/100*H;
    const peek=i<peekN, k=i-peekN;
    const tx=W/2+(peek?(i?22:-22):((k%7)-3)*22), ty=peek?H/2-52:H/2-6+((k%3)-1)*6;
    const rot=peek?(i?7:-7):((k%5)-2)*5;
    el.classList.add('peek'); el.style.zIndex=peek?2:1; el.style.filter='none'; el.style.opacity='1';
    requestAnimationFrame(()=>{ el.style.transform=`translate(calc(-50% + ${tx-x}px),calc(-50% + ${ty-y}px)) rotate(${rot}deg) scale(1)`; });
  });
  const f=$('folder'), t=theme(S.entry.themeId);
  setTimeout(()=>{ f.classList.add('collect');
    f.querySelector('.fbody').innerHTML=`<div class="ftitle">正在為你組「${t.n}」</div>`;
    deck.insertAdjacentHTML('beforeend',`<div class="gensteps">
      <div class="genstep" style="animation-delay:.2s">挑出必看的站點</div>
      <div class="genstep" style="animation-delay:.75s">放進你的時間預算</div>
      <div class="genstep" style="animation-delay:1.3s">照場館動線排出順序</div></div>`); }, 520);
}
function finishRoute(){
  clearTimeout(window._gen); S._committing=false;
  if(S.screen!=='entry'||!S.entry) return;          /* 收卡途中已離開問答頁 */
  const e=S.entry;
  /* 親子同行 → 換親子版腳本（遞話題給家長）；無障礙對象維持原腳本 */
  if(e.party==='family' && ['general','kid','expert'].includes(e.persona)
     && personasFor(e.themeId,e.lang).includes('family')) e.persona='family';
  /* 手語只當導覽語言，介面語言不變 */
  S.clang=e.lang; if(LANGS[e.lang]) S.lang=e.lang; S.persona=e.persona; S.minutes=e.minutes; S.kidAge=e.kidAge;
  const list=plan(e.themeId,e.lang,e.persona,e.minutes).map(p=>p.id);
  if(!list.length){ say('組路線失敗：'+theme(e.themeId).n+' 在這個語言／時間沒有站點'); toast('這個時間放不下任何一站，請把時間拉長一點'); render(); return; }
  S.route={themeId:e.themeId,list,idx:0,heard:[]};
  if(S.entryPin){ if(S.entryPin.themeId===e.themeId) pinIntoRoute(S.route,S.entryPin.id); S.entryPin=null; }
  /* 換了一條新路線：上一條路線還在播的那一則要停掉，不然「回到播放」會跳回舊路線的樓層（例：從常設展 2F 換到萬相天后 4F） */
  if(S.player && S.player.mode!=='single' && !list.includes(S.player.id) && !(SEGS[S.player.id]&&SEGS[S.player.id].themeId===e.themeId)){ S.player=null; S.paused=false; S.microOpen=false; }
  if(list.length){ S.at=list[0]; S.venue=byId(list[0]).v; S.floor=byId(list[0]).fl; }
  say('一頁式設定完成：'+theme(e.themeId).n+' → '+list.length+' 站（'+langName(e.lang)+'／'+PERSONAS[e.persona]+'／'+tlabel(e.minutes)+'）');
  S.viewTheme=e.themeId; S.infoTab='intro'; S.infoSheet='peek'; S.lastStop=null; S.resumeAsk=false;
  S.mapView='floor'; S.mapZoom=1; S.mapPan={x:0,y:0}; S.sheet=null;
  go('routeinfo');                                  // 過場已在問答頁原地播完 → 直接進導覽內頁
  /* 問答頁是一次性步驟：從導覽內頁返回時跳過，直接回第一層 */
  while(['routegen','entry'].includes(S.hist[S.hist.length-1])) S.hist.pop();
  if(S.hist[S.hist.length-1]===S.screen) S.hist.pop();   // 從內頁重新設定的情況，避免返回原地
}

/* 上滑展開／下滑收合路線資訊 sheet */
/* 路線跨很多樓層／場館時，上方膠囊收成一顆下拉（避免文字換行、陰影被切） */
function stopsPicker(stops){
  const on = st => S.venue===st.v&&S.floor===st.fl;
  const cur = stops.find(on) || stops[0];
  const pick = st => `S.venue='${st.v}';S.floor='${st.fl}';S.sheet=null;S.stopsOpen=false;render()`;
  if(stops.length<=3) return `<div style="display:flex;gap:8px">${stops.map(st=>
    `<button class="fchip ${on(st)?'on':''}" onclick="${pick(st)}">${vname(st.v)} ${st.fl}</button>`).join('')}</div>`;
  return `<div style="position:relative;display:inline-block">
    <button class="fchip on" style="gap:8px;padding-right:10px" onclick="S.stopsOpen=!S.stopsOpen;render()">${vname(cur.v)} ${cur.fl}
      <span style="display:inline-flex;transform:rotate(${S.stopsOpen?180:0}deg);transition:transform .2s">${I.chev}</span></button>
    ${S.stopsOpen?`<div class="popt${once('stopsPop')}" style="position:absolute;left:0;top:42px;background:#fff;border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,.16);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:160px;z-index:9">
      ${stops.map((st,i)=>`<button class="row" style="padding:10px 12px;border:0;border-radius:11px;gap:10px;
        ${on(st)?'background:var(--acc-l);color:var(--acc-d);font-weight:600':''}" onclick="${pick(st)}">
        <span style="width:22px;height:22px;border-radius:999px;background:${on(st)?'#fff':'var(--grey)'};display:grid;place-items:center;
          font-size:11px;font-weight:700;flex:0 0 22px">${i+1}</span><span style="font-size:14px;white-space:nowrap">${vname(st.v)} ${st.fl}</span></button>`).join('')}
    </div>`:''}
  </div>`;
}
function infoDrag(e){
  e.preventDefault();
  const sy=e.clientY, sh=e.currentTarget.parentElement, box=sh.parentElement.getBoundingClientRect();
  const t0=sh.getBoundingClientRect().top-box.top;
  let dy=0;
  sh.style.transition='none'; sh.style.maxHeight='none'; sh.style.top=t0+'px';   /* 面板跟著手指走 */
  const mv=ev=>{ dy=ev.clientY-sy; sh.style.top=Math.max(box.height*.08, Math.min(box.height-120, t0+dy))+'px'; };
  const up=()=>{ cleanup();
    if(dy<-40) S.infoSheet='full'; else if(dy>40) S.infoSheet='peek';            /* 放開時吸附到最近的段位 */
    sh.style.top=''; sh.style.maxHeight=''; sh.style.transition=''; render(); };
  function cleanup(){ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); }
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
}
/* 路線生成過場：填完問答 → 這裡 → 導覽內頁 */
function scrRouteGen(){
  const t = theme(S.viewTheme||'');

      <div class="genstep" style="animation-delay:.7s">放進你的時間預算</div>
      <div class="genstep" style="animation-delay:1.25s">照場館動線排出順序</div>
    </div>
  </div>`;
}

/* 全區俯視圖：四個場館全部在同一張圖上（含圖資建置中的），

/* 俯瞰圖底層＝平台內建 Google 圖資（與後台「全域總覽」同一份樣式與經緯度資料）；
   原型在平台金鑰未注入時以 OSM 圖磚代位 */
const lng2x=l=>(l+180)/360;
const lat2y=la=>{const r=la*Math.PI/180;return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2;};
const y2lat=y=>Math.atan(Math.sinh(Math.PI*(1-2*y)))*180/Math.PI;
const x2lng=x=>x*360-180;
function geoWin(aspect){
  const gs=Object.values(VENUES).map(V=>V.geo).filter(Boolean);
  const xs=gs.map(g=>lng2x(g.lng)), ys=gs.map(g=>lat2y(g.lat));
  const cx=(Math.min(...xs)+Math.max(...xs))/2, cy=(Math.min(...ys)+Math.max(...ys))/2;
  /* 視窗剛好框住所有點（留邊 30%），不再卡在整數縮放級距 */
  const spanY=Math.max((Math.max(...ys)-Math.min(...ys))/.7, (Math.max(...xs)-Math.min(...xs))/.7/aspect, 1.25/Math.pow(2,18));
  const z=Math.max(3,Math.min(18,Math.floor(Math.log2(1.25/spanY))));
  return {cx, cy, spanY, spanX:spanY*aspect, z};
}
const geoPos=(w,g)=>({x:(lng2x(g.lng)-w.cx)/w.spanX*100+50, y:(lat2y(g.lat)-w.cy)/w.spanY*100+50});
function gkey(){ try{return localStorage.getItem('g2.gkey')||'';}catch(e){return '';} }
function tileLayer(w,aspect){
  const veil=`<div style="position:absolute;inset:0;background:rgba(237,237,235,.30);pointer-events:none"></div>`;
  const k=(gkey().match(/^AIza[\w-]{10,}$/)||[])[0]||'';   /* 只接受 Google Maps 金鑰格式，其他值退回代位圖磚 */
  if(k){
    const gw=Math.min(640,Math.round(320*aspect));
    const url='https://maps.googleapis.com/maps/api/staticmap?key='+encodeURIComponent(k)
      +'&center='+y2lat(w.cy).toFixed(8)+','+x2lng(w.cx).toFixed(8)+'&zoom='+w.z
      +'&format=png&maptype=satellite&size='+gw+'x320&scale=2'
      +'&style=element:labels%7Cvisibility:off&style=feature:administrative.land_parcel%7Cvisibility:off&style=feature:administrative.neighborhood%7Cvisibility:off';
    return `<img src="${url}" alt="園區地圖" style="position:absolute;inset:0;width:100%;height:100%;object-fit:fill;
      pointer-events:none">`;
  }
  /* 圖磚級距依手機螢幕解析度挑：每張 256px 圖磚在螢幕上不被放大超過 1 倍（原本固定多 2 級，高解析手機上糊） */
  const H=(document.getElementById('frame')||{}).clientHeight||820, dpr=Math.min(3,window.devicePixelRatio||1);
  let tz=w.z+2; while(tz<19 && (1/Math.pow(2,tz))/w.spanY*H*dpr>256) tz++;
  const n=Math.pow(2,tz);
  const x0=Math.floor((w.cx-w.spanX/2)*n), x1=Math.floor((w.cx+w.spanX/2)*n);
  const y0=Math.floor((w.cy-w.spanY/2)*n), y1=Math.floor((w.cy+w.spanY/2)*n);
  let ims='';
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    const L=((tx/n)-(w.cx-w.spanX/2))/w.spanX*100, T=((ty/n)-(w.cy-w.spanY/2))/w.spanY*100;
    ims+=`<img src="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${tz}/${ty}/${tx}" alt=""
      style="position:absolute;left:${L}%;top:${T}%;width:${(1/n)/w.spanX*100+.05}%;height:${(1/n)/w.spanY*100+.05}%;pointer-events:none">`;
  }
  return ims+`<div style="position:absolute;inset:0;background:rgba(0,0,0,.08);pointer-events:none"></div>`
    +`<div class="zlab" style="position:absolute;left:8px;bottom:6px;font-size:8.5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)">衛星影像 © Esri（示意）</div>`;
}

/* 地圖縮放與平移：滾輪／拖曳／±鈕（俯視圖與樓層平面共用） */
let _mz={down:false,x:0,y:0,moved:false};
const MZMAX=4.5;   // 地圖可放大到 4.5 倍；點位用 1/縮放倍率 反向縮放，永遠維持同樣大小
function mzT(){ return `translate(${S.mapPan.x}px,${S.mapPan.y}px) scale(${S.mapZoom})`; }
function mzApply(){ const el=document.getElementById('mz');
  if(el){ el.style.transition=''; el.style.transform=mzT();   /* 手指一動就停掉鏡頭滑動動畫，跟著手走 */ el.style.setProperty('--mz', S.mapZoom); mzClamp(el); } }
/* 地圖邊界：縮小／拖曳都不能露出底圖以外的空白。
   底圖範圍＝衛星圖磚或樓層插畫（img），沒有圖片的平面圖就用整張地圖層 */
function mzBox(el){
  const ims=[...el.querySelectorAll('img')].map(i=>i.getBoundingClientRect()).filter(r=>r.width>2&&r.height>2);
  const rs=ims.length?ims:[el.firstElementChild&&el.firstElementChild.getBoundingClientRect()].filter(Boolean);
  if(!rs.length) return null;
  return {l:Math.min(...rs.map(r=>r.left)), t:Math.min(...rs.map(r=>r.top)), r:Math.max(...rs.map(r=>r.right)), b:Math.max(...rs.map(r=>r.bottom))};
}
/* 2026-11-02 改：可以縮小到整張平面圖放進畫面；拖曳時圖的邊緣最多拉到畫面中線，
   所以最底下、最旁邊的點位也能拉到畫面中間點。圖外露出的是淡灰底（不是白邊） */
function mzClamp(el){
  const V=el.parentElement.getBoundingClientRect(); let B=mzBox(el); if(!B) return;
  const fit=Math.min(V.width/(B.r-B.l), V.height/(B.b-B.t));          // >1＝比「整張剛好放進畫面」還小
  if(fit>1.001){ S.mapZoom=Math.min(MZMAX,+(S.mapZoom*fit+.002).toFixed(3)); el.style.transform=mzT(); el.style.setProperty('--mz',S.mapZoom); B=mzBox(el); }
  const cx=V.left+V.width/2, yTop=V.top+V.height*0.6, yBot=V.top+V.height*0.32;   // 底部有播放器／說明條，下緣可以拉得更高
  let dx=0, dy=0;
  if(B.l>cx) dx=cx-B.l; else if(B.r<cx) dx=cx-B.r;
  if(B.t>yTop) dy=yTop-B.t; else if(B.b<yBot) dy=yBot-B.b;
  if(dx||dy){ S.mapPan.x+=dx; S.mapPan.y+=dy; el.style.transform=mzT(); }
}
/* 底圖圖片載入完成後重新檢查邊界（一開始圖片還沒有尺寸） */
document.addEventListener('load',e=>{ if(e.target.tagName==='IMG' && e.target.closest('#mz')){ clearTimeout(window._mzc); window._mzc=setTimeout(mzApply,30); } },true);
/* 雙指縮放：記錄所有按下的手指，兩指時依距離變化換算縮放倍率 */
const _pts=new Map(); let _pinch=null;
const _pdist=()=>{ const [a,b]=[..._pts.values()]; return Math.hypot(a.x-b.x,a.y-b.y); };
function mzDown(e){
  _pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(_pts.size===2){ _pinch={d:_pdist(),z:S.mapZoom}; _mz.down=false; _mz.moved=true; return; }
  _mz={down:true,x:e.clientX,y:e.clientY,moved:false}; }
function mzMove(e){
  if(_pts.has(e.pointerId)) _pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(_pinch && _pts.size===2){
    const min = 0.3;
    S.mapZoom=Math.min(MZMAX,Math.max(min,+(_pinch.z*_pdist()/_pinch.d).toFixed(3))); mzApply(); return; }
  if(!_mz.down) return;
  const dx=e.clientX-_mz.x, dy=e.clientY-_mz.y;
  if(!_mz.moved && Math.hypot(dx,dy)<5) return;
  _mz.moved=true; S.mapPan.x+=dx; S.mapPan.y+=dy; _mz.x=e.clientX; _mz.y=e.clientY; mzApply(); }
function mzUp(e){ if(e) _pts.delete(e.pointerId); if(_pts.size<2) _pinch=null; _mz.down=false; }

/* 地圖鏡頭動態移到某個點位：先算好終點（含邊界修正），再用 transition 從目前畫面滑過去 */
/* 鏡頭框住一組點位（路線總覽時看到全部展點）：算出外框，縮放到剛好放進畫面中段，用動畫滑過去 */
function mzFit(ids){
  const el=document.getElementById('mz'); if(!el||!ids.length) return;
  const mks=ids.map(id=>el.querySelector('[data-pid="'+id+'"]')).filter(Boolean); if(!mks.length) return;
  const V=el.parentElement.getBoundingClientRect(), C={x:V.left+V.width/2, y:V.top+V.height/2}, z0=S.mapZoom;
  const pts=mks.map(mk=>{ const r=mk.getBoundingClientRect(); return {x:C.x+(r.left+r.width/2-C.x-S.mapPan.x)/z0, y:C.y+(r.top+r.height/2-C.y-S.mapPan.y)/z0}; });
  const xs=pts.map(q=>q.x), ys=pts.map(q=>q.y);
  const bw=Math.max(40,Math.max(...xs)-Math.min(...xs)), bh=Math.max(40,Math.max(...ys)-Math.min(...ys));
  const top=V.top+130, bot=V.bottom-250;               // 上方標題列、下方迷你播放器之間的可視範圍
  const z=Math.max(0.6,Math.min(MZMAX,(V.width-72)/bw,(bot-top)/bh));
  const m={x:(Math.min(...xs)+Math.max(...xs))/2, y:(Math.min(...ys)+Math.max(...ys))/2}, T={x:C.x, y:(top+bot)/2};
  const start=el.style.transform;

function mzFocus(id, z){
  const el=document.getElementById('mz'); if(!el) return;
  const mk=el.querySelector('[data-pid="'+id+'"]'); if(!mk) return;
  const V=el.parentElement.getBoundingClientRect(), r=mk.getBoundingClientRect();
  const C={x:V.left+V.width/2, y:V.top+V.height/2}, z0=S.mapZoom;
  const m0={x:C.x+(r.left+r.width/2-C.x-S.mapPan.x)/z0, y:C.y+(r.top+r.height/2-C.y-S.mapPan.y)/z0};
  const T={x:C.x, y:V.top+V.height*0.40};                 // 停在畫面中間偏上，避開下方播放器
  z=Math.min(MZMAX, z||Math.max(2,z0));

  S.mapZoom=z; S.mapPan={x:T.x-C.x-z*(m0.x-C.x), y:T.y-C.y-z*(m0.y-C.y)};

/* 首頁場館地圖輪播：左右圓鈕切上下一張（scroll-snap 卡片寬＋gap） */
function vscrollStep(dir){
  const el=document.getElementById('vscroll'); if(!el) return;
  const card=el.firstElementChild; if(!card) return;
  el.scrollBy({left:dir*(card.getBoundingClientRect().width+12), behavior:'smooth'});
}
function vscrollSync(){                              // 第一張藏 ‹、最後一張藏 ›
  const el=document.getElementById('vscroll'); if(!el||!el.firstElementChild) return;
  const step=el.firstElementChild.getBoundingClientRect().width+12;
  const i=Math.round(el.scrollLeft/step);
  const L=document.getElementById('vprev'), R=document.getElementById('vnext');
  if(L) L.style.visibility = i<=0?'hidden':'visible';
  if(R) R.style.visibility = i>=el.children.length-1?'hidden':'visible';
}

/* 地圖上的「可以做什麼」bottom sheet：展覽或主題導覽清單，開啟時底部 menu 隱藏 */
/* 地圖上點「當前展覽／主題導覽」的任一項：先在地圖上只顯示這條的點位（編號＋連線），確認位置後再讓觀眾決定要不要開始導覽 */
function mapShowTheme(tid){ const ps=viewIds(tid).map(byId).filter(Boolean);
  S.mapTheme=tid; S.mapSheet=null; S.sheet=null; S.mapView='floor'; S.mapZoom=1; S.mapPan={x:0,y:0};
  if(ps.length){ S.venue=ps[0].v; S.floor=ps[0].fl;
    /* 鏡頭對準這一層點位的中心（算法同 openLocate），往上讓出下方確認卡 */
    const q=ps.filter(p=>p.v===S.venue&&p.fl===S.floor), cx=q.reduce((a,p)=>a+p.x,0)/q.length, cy=q.reduce((a,p)=>a+p.y,0)/q.length;
    const F=document.getElementById('frame'), W=F.clientWidth, H=F.clientHeight, art=FLOOR_ART[S.venue+':'+S.floor];
    const bw=art?W*1.85:W, bh=art?bw*art.h/art.w:H, sx=Math.max(...q.map(p=>p.x))-Math.min(...q.map(p=>p.x));
    S.mapZoom=Math.max(1,Math.min(1.25,45/Math.max(sx,1)));
    S.mapPan={x:-(cx/100-0.5)*bw*S.mapZoom, y:-(cy/100-0.5)*bh*S.mapZoom - H*0.12}; }
  say('地圖篩選：'+theme(tid).n); render(); }
function mapThemeBar(){ const t=theme(S.mapTheme), ps=viewIds(t.id).map(byId).filter(Boolean), e=EXHIBITIONS.find(x=>x.themeId===t.id);
  const fls=[...new Set(ps.map(p=>p.fl))], tm=timeOf(ps);
  const where = e ? vname(e.v)+' '+e.loc : vname(ps[0]?ps[0].v:'main')+' '+fls.join('・');
  return `<div style="position:absolute;left:14px;right:14px;top:66px;z-index:6;display:flex">
      <button class="fchip on" style="max-width:100%;gap:8px" onclick="S.mapTheme=null;render()" aria-label="取消只看「${t.n}」">
        <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">只看：${t.n.split('：')[0]}</span>${I.close}</button></div>
    <div class="card" style="position:absolute;left:14px;right:14px;bottom:${S.player?256:100}px;z-index:7;padding:14px 16px">
      <div class="tiny" style="margin-bottom:4px">${e?e.type:'主題導覽'}・${where}</div>
      <div style="font-size:16px;font-weight:700;line-height:1.4;margin-bottom:4px">${t.n}</div>
      <div class="tiny" style="margin-bottom:12px">${ps.length} 個導覽點・約 ${tm.total} 分鐘${fls.length>1?'・跨 '+fls.length+' 層樓':''}・地圖上的編號就是建議順序</div>
      <div style="display:flex;gap:10px">
        <button class="btn ghost" style="flex:0 0 auto;padding:0 16px" onclick="S.mapTheme=null;render()">看全部</button>
        <button class="btn gold" style="flex:1" onclick="const id=S.mapTheme;S.mapTheme=null;startEntry(id)">${I.play} 開始導覽</button></div>
    </div>`; }
function mapSheet(){
  const ex = S.mapSheet==='ex';
  const rows = ex
    ? EXHIBITIONS.map(e=>({t:theme(e.themeId), tag:e.type, title:e.n,
        sub:vname(e.v)+' '+e.loc, click:`mapShowTheme('${e.themeId}')`}))
    : themesFor(S.lang).filter(t=>t.scope==='venue').map(t=>({t, tag:t.note, title:t.n,
        sub:t.intro, click:`mapShowTheme('${t.id}')`}));
  const a=once('mapsheet:'+S.mapSheet);
  return `<div class="dim${a}" style="z-index:9" onclick="S.mapSheet=null;render()"></div>
  <div class="sheet${a}">
    <div class="grab"></div>
    <div style="display:flex;align-items:baseline;gap:8px;padding:2px 16px 10px">
      <b style="font-size:17px">${ex?'當前展覽':'主題導覽'}</b>
      <span class="tiny">${rows.length} 個</span>
      <button class="icb bare" style="margin-left:auto;width:34px;height:34px" onclick="S.mapSheet=null;render()">${I.close}</button>
    </div>
    <div class="sbody" style="padding-bottom:14px">
      <div class="rowlist">
        ${rows.map(x=>`<button class="row" onclick="S.mapSheet=null;${x.click}">
          <div style="width:52px;height:52px;flex:0 0 52px;border-radius:12px;
            background:linear-gradient(135deg,#D8D8D8,#BDBDBD)"></div>
          <div class="g"><div class="n">${x.title}</div>
            <div class="s"><span class="chip">${x.tag}</span><span>${x.sub}</span></div></div>
          <span style="color:var(--ink-3)">›</span></button>`).join('')}
      </div>
    </div>
  </div>`;
}
/* 場館與樓層收在同一個下拉：先選在哪一棟，再選哪一層 */

  return `<div class="dim" style="z-index:8" onclick="S.mapPick=false;render()"></div>
  <div style="position:absolute;left:16px;right:16px;top:62px;z-index:9;background:#fff;border-radius:16px;
    box-shadow:0 12px 34px rgba(0,0,0,.22);overflow:hidden">

      }).join('')}

    ${Object.keys(VENUES[S.venue].floors).length?'':`<div class="emptybox" style="padding:18px 24px 22px">

function pickVenue(v){
  S.venue=v; S.floor=Object.keys(VENUES[v].floors)[0]||'—'; S.sheet=null; S.mapView='floor';
  S.mapPick=false;                                   // 選完館直接關下拉；樓層用地圖左側垂直膠囊切
  say('切換場館：'+vname(v)+'（'+VENUES[v].move+'）'); render();
}

/* 統一 sheet：通吃三種內容級別 */
function pointSheet(){
  const p = byId(S.sheet), no = routeNo(p.id);
  const inRoute = no>0;
  const playable = canPlay(p);
  /* 在導覽內頁（還沒開始聽）點這條導覽裡的展品＝從這一站開始，不再問要不要開始整個展覽 */
  const here = S.screen==='routeinfo' && !onTour() && !!S.viewTheme && p.lvl==='full'
    && (viewIds(S.viewTheme).includes(p.id) || (exThemeOf(p)&&exThemeOf(p).id===S.viewTheme));
  const hereNo = here ? viewIds(S.viewTheme).indexOf(p.id)+1 : 0;
  const langMissing = p.lvl==='full' && !playable;
  const full = S.sheetFullId===p.id;                 // 點空白處 / 手把 → 展開成完整介紹（同路線資訊 sheet 的手感）
  const a=once('sheet:'+p.id);
  const art=artOf(p.id);
  const expand=`if(!event.target.closest('button,a,input')){S.sheetFullId='${p.id}';render()}`;
  return `<div class="dim${a}" style="z-index:9" onclick="S.sheet=null;S.sheetFullId=null;render()"></div>
  <div class="sheet${a}" style="${full?'top:12%;max-height:none':''}" onclick="${full?'':expand}">
    <div class="grab" style="cursor:pointer" onclick="S.sheetFullId=${full?'null':`'${p.id}'`};render()"></div>
    ${full&&art?`<div style="margin:2px 16px 14px;height:200px;border-radius:16px;overflow:hidden;position:relative;background:#E6E6E6">
      ${artBox(p.id,p.n)}</div>`:''}
    <div class="sbody">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:9px;flex-wrap:wrap">
        ${p.lvl==='full'?'':`<span class="lvl ${p.lvl}">${p.lvl==='text'?'僅文字介紹':'設施'}</span>`}
        <span class="chip">${vname(p.v)} ${p.fl}</span>
        ${p.no?`<span class="chip">編號 ${p.no}</span>`:''}
        ${p.lvl==='full'?`<span class="chip">${Math.round(p.dur/60*10)/10} 分</span>`:''}
      </div>
      <h3 style="font-size:20px;margin-bottom:6px">${p.n}</h3>
      ${here?`<div class="tiny" style="color:var(--acc-d);margin-bottom:8px">${hereNo?`本站為「${theme(S.viewTheme).n}」第 ${hereNo} 站・從這裡開始導覽`:'這次的路線沒有排到這件・從這件開始會加進路線'}</div>`
       :inRoute?`<div class="tiny" style="color:var(--acc-d);margin-bottom:8px">本站為「${theme(S.route.themeId).n}」第 ${no} 站</div>`
                :(p.lvl==='full'?`<div class="tiny" style="margin-bottom:8px">${!onTour()?'可以單獨聽這一件，或照順序聽整個展覽'
                  :(exThemeOf(p)&&exThemeOf(p).id===S.route.themeId)?'這次的路線沒有排到這件・單獨聆聽不影響路線進度':'不在目前路線上・單獨聆聽不影響路線進度'}</div>${exEntryBtn(p)}`:'')}
      ${(()=>{ const long=p.text.length>64 && !full;
        return `<p class="muted" style="margin-bottom:14px;line-height:1.85;${long
          ?'display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden':''}">${p.text}</p>
        ${long?`<div class="tiny" style="margin:-8px 0 12px;color:var(--ink-3)">點一下看完整介紹</div>`:''}`; })()}
      ${langMissing?`<div class="notice err" style="margin-bottom:12px">${I.info}<div>此站沒有${LANGS[S.lang]}語音。
        <button style="text-decoration:underline;color:inherit" onclick="jumpNextPlayable()">跳至下一個可播站點</button></div></div>`:''}
      <div style="display:flex;gap:10px;margin-bottom:12px">
        ${(()=>{ /* 兩版都有跨樓層導航「帶我去」 */
          const goBtn = `<button class="btn ghost" style="flex:0 0 auto;padding:0 16px" onclick="startNav('${p.id}')">${I.nav} 帶我去</button>`;
          if(p.lvl==='place') return `<button class="btn gold" style="flex:1" onclick="startNav('${p.id}')">${I.nav} 帶我去</button>`;
          return playable
            ? (here?`<button class="btn gold" style="flex:1" onclick="startFromHere('${p.id}')">${I.play} 從這一站開始導覽</button>`
              :`<button class="btn gold" style="flex:1" onclick="playPoint('${p.id}')">${I.play} ${inRoute?'聽導覽・路線第 '+no+' 站':'單獨聽這一件'}</button>`)+goBtn
            : `<div class="btn ghost" style="flex:1;cursor:default">${I.text} 僅有文字說明</div>`+goBtn;
        })()}
      </div>
      ${(NMTH||p.lvl==='place')?'':`<div class="fld" style="height:48px;border-radius:999px;cursor:pointer;margin-bottom:2px" onclick="openDainy()">
        <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">問 Dainy 這件的來歷…</span>
        <button class="icb bare" style="width:36px;height:36px" title="拍給 Dainy 看"
          onclick="event.stopPropagation();openCam()">${I.cam}</button>
        <button class="mic" style="width:36px;height:36px;flex:0 0 36px;border-radius:999px" title="語音提問"
          onclick="event.stopPropagation();openDainy();startListen()">${I.mic}</button>
      </div>`}
    </div>
  </div>`;
}

function scrCode(){
  const q = S.search.trim();
  const isNo = /^[A-Za-z]?\d{1,3}$/.test(q);
  /* 範圍：從導覽路線（⑫ tourmap）進來＝只搜目前路線的展品；其他入口＝全域 */
  const from = S.hist[S.hist.length-1];
  const routeIds = (from==='tourmap' && S.route) ? S.route.list : null;
  const rt = routeIds ? theme(S.route.themeId) : null;
  const base = routeIds ? routeIds.map(byId) : P;
  const hit = q ? (isNo ? base.filter(p=>p.no && p.no.toUpperCase().startsWith(q.toUpperCase()))
                        : base.filter(p=>p.n.includes(q)||p.z.includes(q)||(p.tags||[]).some(t=>t.includes(q))))
                : (routeIds ? base : []);          // 全域搜尋空狀態不列展品清單，改預設問題
  /* 結果大卡（Artlas 式）：縮圖＋標題＋紫色展區＋位置＋收藏 */

          <span class="tiny">${vname(p.v)} ${p.fl}${p.no?'・'+p.no:''}</span>

            onclick="event.stopPropagation();say('已收藏：${p.n}')">${I.heart}</button>
        </div>
      </div>
    </div>`;
  return shell(`
  <div class="nav" style="border-bottom:0;gap:10px;padding:8px 12px 4px">
    <button class="icb" onclick="back()">${I.back}</button>
    <div style="flex:1;height:46px;background:#fff;border:1px solid var(--line-2);border-radius:999px;
      display:flex;align-items:center;gap:9px;padding:0 6px 0 14px;color:var(--ink-3)">
      ${I.search}
      <input value="${S.search}" oninput="S.search=this.value;S._typing=true;render()"
        placeholder="${rt?'在「'+rt.n+'」路線中搜尋':'展品、設施，或輸入編號如 201'}"
        style="flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:14.5px;color:var(--ink)">
      ${q?`<button class="icb bare" style="width:32px;height:32px;flex:0 0 32px" onclick="S.search='';render()">${I.close}</button>`:''}
    </div>
    ${NMTH?'':`<button class="mic" onclick="openCam()" title="拍照搜尋">${I.cam}</button>`}
  </div>

  ${rt?'':`<!-- 設施捷徑（Artlas 式圓鈕列，只在全域搜尋） -->
  <div style="display:flex;gap:18px;overflow-x:auto;padding:14px 20px 12px">
    ${[['lift','電梯'],['wc','廁所'],['baby','育嬰室'],['info','售票處'],['rest','休息區'],['locker','寄物']].map(([f,label])=>`
      <button style="display:flex;flex-direction:column;align-items:center;gap:7px;flex:0 0 auto"
        onclick="S.search='${label}';render()">
        <div style="width:58px;height:58px;border-radius:999px;background:#fff;display:grid;place-items:center;
          color:${S.search===label?'#fff':'var(--acc-d)'};
          ${S.search===label?'background:var(--acc);':'box-shadow:0 2px 10px rgba(0,0,0,.08);'}">${FACICON[f]}</div>
        <span style="font-size:12.5px;color:${S.search===label?'var(--ink)':'var(--ink-2)'}">${label}</span>
      </button>`).join('')}

  <div class="body" style="padding:14px 16px 8px">
    ${!rt&&!q&&!NMTH?`
    <div class="tiny" style="margin:4px 2px 10px">你可能想問</div>
    <div class="rowlist" style="margin-bottom:16px">
      ${['最近的育嬰室在哪？','幾點有定時導覽？','30 分鐘還能看什麼？','門票多少錢？'].map(qq=>`
        <button class="row" onclick="askDainy('${qq}')">
          <div style="flex:0 0 30px">${DAINY(30,false)}</div>
          <div class="g"><div class="n" style="font-weight:400">${qq}</div></div>
          <span style="color:var(--ink-3)">›</span></button>`).join('')}
    </div>
    <button class="card" style="width:100%;display:flex;gap:12px;align-items:center;padding:14px" onclick="openDainy()">
      <div style="flex:0 0 40px">${DAINY(40,false)}</div>
      <div style="flex:1"><div style="font-size:14.5px;font-weight:700">跟 Dainy 對話</div>

    </button>`:''}
    ${rt&&!q?`<div class="tiny" style="margin:2px 2px 10px">這條路線的展品（${hit.length}）</div>`:''}
    ${isNo&&!hit.length?`<div class="emptybox">沒有這個編號。<br><span class="tiny">館內 112–118／201–246／411–435・園區 P01–P02</span></div>`:''}
    ${hit.map(cardR).join('')}
    <div style="height:8px"></div>
  </div>
  ${S.sheet?pointSheet():''}`);
}
