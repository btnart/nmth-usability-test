let _shotN=0;
/* 真的相機：開後鏡頭＋解 QR（有 BarcodeDetector 用內建，否則載 jsQR）。瀏覽器不給權限或在不允許相機的框架裡時，退回示意 */
const _cam={stream:null,live:false,err:'',timer:null,busy:false};
async function camStart(){
  if(_cam.stream||_cam.busy) return;
  _cam.busy=true; _cam.err='';
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('此瀏覽器不支援相機');
    _cam.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    _cam.live=true; render(); camLoop();
  }catch(e){
    _cam.live=false;
    _cam.err = /NotAllowed|Permission|denied|policy/i.test(e.name+e.message) ? '沒有取得相機權限' : (e.message&&e.message.length<30?e.message:'無法開啟相機');
    if(S.cam) render();
  }finally{ _cam.busy=false; }
}
function camStop(){
  clearTimeout(_cam.timer); _cam.timer=null;
  if(_cam.stream){ _cam.stream.getTracks().forEach(t=>t.stop()); }
  _cam.stream=null; _cam.live=false; _cam.err='';
}
function camAttach(){ const v=document.getElementById('camVid'); if(v&&_cam.stream&&v.srcObject!==_cam.stream){ v.srcObject=_cam.stream; v.play&&v.play().catch(()=>{}); } }
let _bd=null, _jsqr=null;
async function camDecode(v){
  if('BarcodeDetector' in window){
    _bd=_bd||new BarcodeDetector({formats:['qr_code']});
    const r=await _bd.detect(v); return r[0]&&r[0].rawValue;
  }
  if(!_jsqr){ _jsqr=new Promise((ok,no)=>{ const sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js'; sc.onload=()=>ok(window.jsQR); sc.onerror=no; document.head.appendChild(sc); }); }
  const jsQR=await _jsqr; if(!v.videoWidth) return null;
  const c=camDecode.c||(camDecode.c=document.createElement('canvas')), w=480, h=Math.round(v.videoHeight/v.videoWidth*w);
  c.width=w; c.height=h; const x=c.getContext('2d'); x.drawImage(v,0,0,w,h);
  const r=jsQR(x.getImageData(0,0,w,h).data,w,h); return r&&r.data;
}
/* 掃描＝打開手機原生相機拍 QR Code，拍完在頁面裡解碼（有 BarcodeDetector 用內建，否則載 jsQR）。不用網頁內的相機串流，artifact 裡也能用 */
let _jsqrP=null;
function loadJsQR(){ return _jsqrP||(_jsqrP=new Promise((ok,no)=>{ const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js'; sc.onload=()=>ok(window.jsQR); sc.onerror=no; document.head.appendChild(sc); })); }
async function decodePhoto(file){
  const img=await createImageBitmap(file);
  if('BarcodeDetector' in window){ try{ const r=await new BarcodeDetector({formats:['qr_code']}).detect(img); if(r[0]) return r[0].rawValue; }catch(e){} }
  const jsQR=await loadJsQR(), w=Math.min(1200,img.width), h=Math.round(img.height*w/img.width);
  const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.drawImage(img,0,0,w,h);
  const r=jsQR(x.getImageData(0,0,w,h).data,w,h); return r&&r.data; }
function nativeScan(onText){ const i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.setAttribute('capture','environment');
  i.onchange=async()=>{ const f=i.files&&i.files[0]; if(!f) return; toast('辨識中…'); let t=null; try{ t=await decodePhoto(f); }catch(e){} onText(t); };
  i.click(); }
function scanNative(){ nativeScan(txt=>{ const hit=txt&&camMatch(txt);
  if(hit){ toast('已掃到：'+hit.n); openSheetFrom(hit.id); }
  else toast(txt?'這個 QR Code 不是本館的導覽碼':'沒有讀到 QR Code，靠近一點再拍一次'); }); }
/* QR 內容對到展品：比對導覽編號（如 201、P01）或展品 id */
function camMatch(txt){
  const t=String(txt||'');
  return P.find(p=>p.no&&new RegExp('(^|[^0-9A-Za-z])'+p.no+'($|[^0-9A-Za-z])').test(t)) || P.find(p=>t.includes(p.id)) || null;
}
async function camLoop(){
  clearTimeout(_cam.timer);
  if(!S.cam||!_cam.stream) return;
  const v=document.getElementById('camVid');
  try{ if(v&&v.readyState>=2){ const txt=await camDecode(v);
    if(txt){ const hit=camMatch(txt);
      if(hit){ camStop(); S.cam=null; toast('已掃到：'+hit.n); openSheetFrom(hit.id); return; }
      toast('這個 QR Code 不是本館的導覽碼'); } } }catch(_){}
  _cam.timer=setTimeout(camLoop,350);
}
function shoot(){                                    /* 自動判別框裡是展品／QR／編號，結果一律回到 Dainy 對話 */
  const isThing = p => p.lvl==='full' && !p.n.includes('概述');
  const here = P.filter(p=>p.v===S.venue&&p.fl===S.floor&&isThing(p));
  const hit = here[_shotN%Math.max(here.length,1)] || P.find(isThing);
  const by = NMTH?['qr','no'][_shotN%2]:['art','qr','no'][_shotN%3]; _shotN++;  // 原型輪流示範辨識來源
  camStop(); S.cam=null;
  if(NMTH){ toast(by==='qr'?'已掃到 QR Code：'+hit.n:'編號 '+hit.no+'：'+hit.n); openSheetFrom(hit.id); return; }   // 標規版：直接開展品卡
  say('拍照 → 自動判別為'+({art:'展品影像',qr:'QR Code',no:'導覽編號 '+hit.no}[by])+' → 「'+hit.n+'」→ 回到 Dainy 對話');
  S.dainy.mode='talking';
  S.dainy.msgs.push({who:'me', m:{art:'（拍了眼前的展品）',qr:'（拍了展品旁的 QR Code）',no:'（拍了標示牌上的編號 '+hit.no+'）'}[by]});
  const body = hit.text.startsWith(hit.n) ? hit.text.slice(hit.n.length).replace(/^[：。，\s]+/,'') : hit.text;
  S.dainy.msgs.push({who:'d',
    m:({art:'我認得這件：',qr:'這個 QR Code 是：',no:'編號 '+hit.no+' 是：'}[by])+hit.n+'。'+body,
    act: canPlay(hit)?{t:'聽這一站',fn:"playPoint('"+hit.id+"')"}:{t:'帶我去',fn:"startNav('"+hit.id+"')"}});
  S.dainySheet='full'; render();
}

/* =====================================================================
   播放器控制（標規 四（一）3：基本操作・常駐播放器・字幕逐字稿・背景播放）
   ±15 秒／倍速／音量／音軌切換／可拖曳進度／逐字稿放大複製／鎖屏 Media Session
   ===================================================================== */
const RATES = [0.8, 1.0, 1.25, 1.5];
const clamp01 = v => Math.max(0, Math.min(1, v));

/* 這個點目前可用的語音音軌（跨對象收集語系，標規 AUDIO-04：語言別與介面語系分離） */
function tracksOf(p){
  const per = (p.tracks[S.persona]||[]).length ? S.persona : 'general';
  return { persona: per, langs: (p.tracks[per]||[]) };
}
function pDur(){ const p = S.player && byId(S.player.id); return p ? p.dur : 0; }

function seekBy(sec){
  const d = pDur(); if(!d) return;
  S.pPos = clamp01(S.pPos + sec/d);
  say((sec>0?'前進':'後退')+Math.abs(sec)+' 秒 → '+mmss(d*S.pPos));
  render();
}
function seekRatio(e, el){
  const r = el.getBoundingClientRect();
  return clamp01((e.clientX - r.left) / r.width);
}
function paintSeek(el){
  const pct = (S.pPos*100).toFixed(2)+'%';
  const bar = el.querySelector('.progress i'), knob = el.querySelector('.knob');
  if(bar) bar.style.width = pct;
  if(knob) knob.style.left = pct;
  const d = pDur(), lab = el.parentElement.querySelector('[data-times]');
  if(lab) lab.innerHTML = '<span>'+mmss(d*S.pPos)+'</span><span>-'+mmss(d*(1-S.pPos))+'</span>';
}
function seekDown(e, el){
  el.classList.add('drag');
  try{ el.setPointerCapture(e.pointerId); }catch(_){}
  S.pPos = seekRatio(e, el); paintSeek(el);
  el.onpointermove = ev => { S.pPos = seekRatio(ev, el); paintSeek(el); };
  const up = () => { el.classList.remove('drag'); el.onpointermove=null; el.onpointerup=null; el.onpointercancel=null;
    say('拖曳進度到 '+mmss(pDur()*S.pPos)); render(); };
  el.onpointerup = up; el.onpointercancel = up;
}
function volDown(e, el){
  const set = ev => { const r = el.getBoundingClientRect();
    S.pVol = clamp01((ev.clientX - r.left)/r.width);
    el.querySelector('i').style.width = (S.pVol*100)+'%';
    el.querySelector('.knob').style.left = (S.pVol*100)+'%'; };
  try{ el.setPointerCapture(e.pointerId); }catch(_){}
  set(e);
  el.onpointermove = set;
  const up = () => { el.onpointermove=null; el.onpointerup=null; say('音量 '+Math.round(S.pVol*100)+'%'); render(); };
  el.onpointerup = up; el.onpointercancel = up;
}

function ivSlides(p){
  const own=artOf(p.id); if(!own) return [];
  const out=[{src:own.src,cap:'展品照片'}];
  P.filter(q=>q.id!==p.id&&q.z===p.z).map(artOf).filter(a=>a&&!out.some(o=>o.src===a.src)).slice(0,2)
    .forEach(a=>out.push({src:a.src,cap:'展區實景（示意）'}));
  if(out.length===1) out.push({src:own.src,cap:'細部特寫（示意）',pos:'35% 40%',zoom:1.8},{src:own.src,cap:'展場實景（示意）',pos:'65% 60%',zoom:1.35});
  return out;
}
const ivImg=(x,fit)=>`<img src="${x.src}" alt="${x.cap}" draggable="false" style="position:absolute;inset:0;width:100%;height:100%;object-fit:${fit};object-position:${x.pos||'50% 50%'};${x.zoom&&fit==='cover'?'transform:scale('+x.zoom+');':''}pointer-events:none">`;
function ivSync(el){ const i=Math.round(el.scrollLeft/el.clientWidth); S.ivImg=i;
  el.parentElement.querySelectorAll('[data-ivdot]').forEach((d,k)=>{ d.style.width=k===i?'18px':'7px'; d.style.background=k===i?'var(--acc)':'var(--line-2)'; });
  const c=el.parentElement.querySelector('[data-ivno]'); if(c) c.textContent=(i+1)+'／'+el.children.length; }
function ivGo(i){ S.ivBox=i; render(); }
function ivClose(){ const i=S.ivBox; S.ivBox=null; S.ivImg=i; render(); requestAnimationFrame(()=>{ const el=document.getElementById('ivs'); if(el) el.scrollLeft=i*el.clientWidth; }); }

/* =====================================================================
   ⑧ 陪伴層 Dainy：語音／文字兩種都可以，語音也看得到文字
   ===================================================================== */
function dainyAnswer(q){
  const cur = byId(S.at);
  /* 知識庫外＋可外搜 → 引用外部來源並明確標註 */
  if(/其他.*恐龍|還有哪裡.*恐龍|哪裡.*看恐龍/.test(q))
    return {m:'館方資料裡沒有這題，我查了外部資料：臺中的國立自然科學博物館有常設恐龍廳，高雄科工館也不定期有特展。以外部資訊為準前，建議再確認開放時間。',
      src:'外部來源・聯網搜尋（非館方資料）', ext:true};
  /* 知識庫沒有、也不適合亂猜 → 誠實說不知道 */
  if(/餐廳|咖啡|美食|好吃/.test(q)){
    const f = nearest('info', cur.v, cur.fl);
    return {m:'這題館方的知識庫裡沒有記載，我不亂猜。1F 售票處的服務人員最清楚附近哪裡好吃，要我帶你過去問嗎？',
      src:'館方知識庫・無此資料', act:f?{t:'帶我去售票處',fn:"startNav('"+f.id+"')"}:null};
  }
  if(/育嬰|哺乳|尿布/.test(q)){
    const f = nearest('baby', cur.v, cur.fl);
    return {m:'育嬰室在'+vname(f.v)+' '+f.fl+'的'+f.z+'，'+f.text+'從你現在的位置過去要換一層樓，我可以帶你走。',act:{t:'帶我去育嬰室',fn:"startNav('"+f.id+"')"},src:'館方知識庫・設施圖資'};
  }
  if(/廁所|洗手間/.test(q)){
    const f = nearest('wc', cur.v, cur.fl);
    return {m:'最近的廁所在'+vname(f.v)+' '+f.fl+' '+f.z+'。同一層還有無障礙廁所。',act:{t:'帶我去',fn:"startNav('"+f.id+"')"},src:'館方知識庫・設施圖資'};
  }
  if(/休息|坐|累/.test(q)){
    const f = nearest('rest', cur.v, cur.fl);
    return {m:f.z+'有位子（'+vname(f.v)+' '+f.fl+'）。'+f.text+'要不要先坐一下，我幫你把路線暫停在這一站？',act:{t:'帶我去休息區',fn:"startNav('"+f.id+"')"}};
  }
  if(/30|三十|還能|剩下|時間/.test(q)){
    const pl = plan(S.route?S.route.themeId:'must', S.lang, S.persona, 30);
    return {m:'30 分鐘的話我會挑這幾站：'+pl.map(p=>p.n).join('、')+'。'+(pl.length?'路線我已經重排好，站間步行也算進去了。':''),
      act:{t:'就照這樣走',fn:"setMinutes(30)"}};
  }
  if(/關係|剛剛|線索/.test(q)){
    const c = companion().find(x=>x.k==='echo');
    return {m:c?c.m:'這件目前沒有跟你聽過的內容連得上。等你多聽兩站，我再幫你串。'};
  }
  if(/定時導覽|人工|志工/.test(q)) return {m:'常設展定時導覽週二至週日 10:30 與 14:30，請提前 5 分鐘到 1F 服務臺集合，每場上限 40 人。要我提醒你嗎？',src:'館方知識庫・參觀資訊'};
  if(/票|多少錢|門票/.test(q)) return {m:'全票 100 元、優待票 50 元，未滿 6 歲免票。臺灣歷史公園每日 05:00–22:00 免費開放，出大樓正門就到光電雲牆。',src:'館方知識庫・票務資訊'};
  if(/媽祖|蔣渭水|補服|排灣|雲牆|火車/.test(q)){
    const hit = P.find(p=>p.lvl==='full' && q.split('').some(ch=>p.n.includes(ch)) && p.n.length>2) ||
                P.find(p=>p.themes.must==='must');
    return {m:hit.text+'（'+vname(hit.v)+' '+hit.fl+'・'+hit.z+'）',act:{t:'聽這一站',fn:"playPoint('"+hit.id+"')"},src:'館方知識庫・展示文本'};
  }
  return {m:'我在館藏的範圍內回答，所以這一題我先照現場的展件講：'+cur.text+'　需要更細的，我可以幫你找研究員寫的文字版。',src:'館方知識庫・展示文本'};
}
function askDainy(q, voice){
  if(NMTH) return;                                  // 標規版沒有 AI 陪伴導覽員：任何漏網入口都不開面板
  if(!S.dainySheet) S._dainyAnimIn=true;            // 面板已開著就原地更新，不重播開啟動畫
  S.kbd=false;
  S.sheet=null; S.mapSheet=null;                    // 不疊 sheet：回答直接在 Dainy 面板裡呈現
  S.dainy.mode='talking';
  S.dainy.msgs.push({who:'me',m:q});
  const a = dainyAnswer(q);
  S.dainy.msgs.push({who:'d',m:a.m,act:a.act,src:a.src,ext:a.ext,voice:!!voice});  // 語音問→語音回報
  say('Dainy 回答：'+q+(voice?'（語音播報）':''));
  S.dainySheet='full';
  render();
  requestAnimationFrame(()=>{                        // 同一視窗原地更新：新回覆捲進畫面
    const sc=document.querySelector('#dainyPanel div[style*="overflow-y"]');
    if(sc) sc.scrollTop=sc.scrollHeight;
  });
}
function openDainy(){
  if(NMTH) return;                                  // 同上
  if(!S.dainySheet) S._dainyAnimIn=true;            // 從關到開才播滑入動畫
  S.dainyOldOpen=false;                             // 每次打開：舊對話摺疊、停在最新內容
  S.dainyCtxOff=false;                              // 每次喚起重抓當前畫面語境
  S.sheet=null; S.mapSheet=null;                    // 不疊 sheet：Dainy 面板是唯一一層
  if(!S.dainy.msgs.length){
    companion().forEach(c=>S.dainy.msgs.push({who:'d',m:c.m,why:c.why,
      act:c.k==='care'?{t:'帶我去休息區',fn:"startNav('"+(nearest('rest',byId(S.at).v,byId(S.at).fl)||{}).id+"')"}
        :(c.k==='memory'?{t:'接續上次',fn:'resumeLast()'}:null)}));
  }
  S.dainy.mode = S.dainy.msgs.length?'talking':'idle';
  S.dainySheet='full';                              // 一開就是最高（非全滿）——Dainy 是主體
  render();
  requestAnimationFrame(()=>{
    const sc=document.querySelector('#dainyPanel div[style*="overflow-y"]');
    if(sc) sc.scrollTop=sc.scrollHeight;
    const inp=document.querySelector('#dainyPanel input'); if(inp) inp.focus();
  });
}

function scrDainyList(){

        <button class="row" style="padding-left:2px" onclick="askDainy('${tt}')">
          <div class="ico grey" style="border-radius:999px">${I.chat}</div>

function startListen(){
  S.kbd=false; S.voiceMode=true;                    // 進入語音對話場景（回覆也維持非文字畫面）
  S.dainy.mode='listening'; S.dainy.live='';
  S.dainySheet='full';
  const target='最近的育嬰室在哪？'; let i=0;
  clearInterval(window._lst);
  window._lst = setInterval(()=>{
    i++; S.dainy.live = target.slice(0,i);
    if(i>=target.length){ clearInterval(window._lst); }
    const el=document.querySelector('.livetext');   // 只更新文字，不整頁重繪——重繪會讓呼吸動畫每 tick 重來
    if(el) el.textContent=S.dainy.live; else render();
  }, 110);
  render();
  const box=document.getElementById('listenBox');   // 有既有對話時，把 Dainy＋送出鈕捲進畫面
  if(box) box.scrollIntoView({block:'end'});
}
function switchToType(){                             // 中斷語音，改用鍵盤輸入（不送出）
  S.voiceMode=false;
  clearInterval(window._lst);
  S.dainy.mode = S.dainy.msgs.length?'talking':'idle';
  S.dainy.live='';
  say('語音中斷 → 切換為鍵盤輸入');
  render();
  requestAnimationFrame(()=>{ const inp=document.querySelector('#dainyPanel input'); if(inp) inp.focus(); });
}
function stopListen(){
  clearInterval(window._lst);
  const q = S.dainy.live || '最近的育嬰室在哪？';
  S.dainy.live=''; askDainy(q, true);               // 語音詢問 → 語音回報＋文字輔助
}

/* =====================================================================
   ⑪ 後台：新增路線（展覽路線 vs 主題路線＝同一物件的兩種 scope）
   建立時先選類型 → 表單分岔：展覽路線帶展覽基本資料、點池限定該展覽；
   主題路線跳過展覽欄、點池開放全館。右欄即時預覽推導欄位。
   ===================================================================== */
const EXZONES = {
  ex_perm:['臺灣，交會之島','最初的抵岸','倚海而生的島與人','山海之間的共存與競逐','新秩序下的苦悶與夢想','走向民主這條路','大家的博物館'],
  ex_mazu:['第一特展室｜萬相天后'],
  ex_border:['第三特展室｜邊界之外','走廊延伸展區'],
  ex_kids:['兒童廳','時光車站'],
  ex_park:['雲天廣場','光電雲牆','有情湖畔','西側廣場'],
};
function rbPool(){
  const r=S.rb;
  const base = P.filter(p=>p.lvl!=='place');
  if(r.type==='ex'){
    if(!r.exId) return [];
    return base.filter(p=>(EXZONES[r.exId]||[]).includes(p.z));
  }
  return base;
}
function rbPicked(){ return Object.keys(S.rb.picked).map(byId).sort((a,b)=>ORDER.indexOf(a.id)-ORDER.indexOf(b.id)); }
function rbToggle(id){
  const p=byId(id);
  if(p.lvl!=='full'){ say('後台擋下：「'+p.n+'」是文字級，路線只收完整級的點（沒有音檔＝播放器無物可播）'); render(); return; }
  const w=S.rb.picked[id];
  if(!w) S.rb.picked[id]='must';
  else if(w==='must') S.rb.picked[id]='opt';
  else delete S.rb.picked[id];
  render();
}
function rbStart(t){ S.rb.type=t; S.rb.step=1; say('新增路線：選擇類型＝'+(t==='ex'?'展覽路線':'主題路線')+'（底層同一物件，scope 不同）'); render(); }
function scrBuilder(){
  if(!S.rb) S.rb={step:0,type:null,exId:null,name:'',intro:'',picked:{},overview:false,sections:{}};
  const r=S.rb;
  /* --- 推導欄位（右欄預覽用）--- */
  const picked = rbPicked();
  const venues = [...new Set(picked.map(p=>p.v))];
  const personas = Object.keys(PERSONAS).filter(k=>picked.filter(p=>(p.tracks[k]||[]).length).length>=2);
  const langs = Object.keys(LANGS).filter(l=>picked.some(p=>anyLang(p,l)));
  const tm = timeOf(picked);
  const musts = picked.filter(p=>r.picked[p.id]==='must').length;
  const exName = r.exId ? EXHIBITIONS.find(e=>e.id===r.exId).n : '';

  if(r.step===0) return `<div class="desk">
    <div class="deskhead">${I.route}<b>新增路線</b><span class="tiny" style="margin-left:auto">步驟 1／2・選擇路線類型</span></div>
    <div style="padding:28px;display:flex;gap:18px;max-width:820px">
      ${[['ex','這檔展覽的導覽','展覽路線','同一檔展覽的導覽點，依序走完。會先填展覽基本資料，導覽點限定在這檔展覽底下，可以邊建邊新增。',I.list],
         ['theme','策展主題路線','主題路線','跨展覽挑選既有的導覽點，串成一個觀點。例如「聽的臺灣史」「百年建築」。',I.route]]
        .map(([k,t,tag,d,ic])=>`
      <button class="card" style="flex:1;padding:22px;text-align:left" onclick="rbStart('${k}')">
        <div class="ico ${k==='ex'?'gold':''}" style="width:44px;height:44px;margin-bottom:14px">${ic}</div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span style="font-size:17px;font-weight:700">${t}</span><span class="chip">${tag}</span></div>

    <div class="deskhead">${I.route}<b>新增${r.type==='ex'?'展覽':'主題'}路線</b>
      <span class="chip ${r.type==='ex'?'gold':''}">${r.type==='ex'?'scope＝展覽':'scope＝全館主題'}</span>
      <button class="chip out" style="margin-left:auto" onclick="S.rb={step:0,type:null,exId:null,name:'',intro:'',picked:{},overview:false,sections:{}};render()">← 重選類型</button>
    </div>
    <div style="display:flex;gap:0;align-items:stretch">
      <div style="flex:1.4;padding:20px 24px;border-right:1px solid var(--line)">
        ${r.type==='ex'?`
          <div class="tiny" style="margin-bottom:8px">所屬展覽（先選展覽，點池才會出現）</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">
            ${EXHIBITIONS.map(e=>`<button class="chip ${r.exId===e.id?'teal':'out'}" style="height:34px;padding:0 13px"
              onclick="S.rb.exId='${e.id}';S.rb.picked={};S.rb.name=EXHIBITIONS.find(x=>x.id==='${e.id}').n+'導覽';render()">${e.n}</button>`).join('')}
            <button class="chip out" style="height:34px;padding:0 13px" onclick="say('示意：開新展覽表單（名稱／常設・特展／場館／展期）')">＋ 新展覽</button>
          </div>`:''}
        <div class="tiny" style="margin-bottom:6px">路線名稱${r.type==='theme'?'　＋　一句話（會直接出現在前台卡片上）':''}</div>
        <input value="${r.name}" oninput="S.rb.name=this.value" placeholder="${r.type==='ex'?'例：博物臺灣導覽':'例：聽的臺灣史'}"
          style="width:100%;height:44px;border:1px solid var(--line-2);border-radius:12px;padding:0 14px;font:inherit;margin-bottom:10px">
        ${r.type==='theme'?`<input value="${r.intro}" oninput="S.rb.intro=this.value" placeholder="一句策展觀點，對使用者說話（例：這條路線全部由會發出聲音的展件組成）"
          style="width:100%;height:44px;border:1px solid var(--line-2);border-radius:12px;padding:0 14px;font:inherit;margin-bottom:10px">`:''}
        <div class="tiny" style="margin:12px 0 6px">導覽總覽（無點位的音檔，播放序列的開場）</div>
        <button class="chip ${r.overview?'teal':'out'}" style="height:34px;padding:0 13px"
          onclick="S.rb.overview=!S.rb.overview;say('路線總覽音檔 '+(S.rb.overview?'已加入（開場播放、不佔站數）':'已移除'));render()">
          ${r.overview?I.check+' 已加入路線總覽音檔':'＋ 路線總覽音檔'}</button>
        ${r.overview?`<span class="tiny" style="margin-left:8px">上傳各語系音檔＋逐字稿（示意）</span>`:''}

        <div style="display:flex;align-items:baseline;gap:8px;margin:16px 0 8px">
          <b style="font-size:14px">${r.type==='ex'?'這檔展覽的導覽點':'全館導覽點（跨展覽勾選）'}</b>
          <span class="tiny">點一下＝必看、再點＝選看、再點＝移除</span>
        </div>
        ${r.type==='ex'&&!r.exId?`<div class="emptybox">先在上面選一檔展覽</div>`:
          zones.map(zn=>`
          <div style="display:flex;align-items:center;gap:8px;margin:12px 0 6px">
            <span class="tiny">${zn}</span>
            <button class="chip ${r.sections[zn]?'teal':'out'}" style="font-size:10.5px"
              onclick="event.stopPropagation();S.rb.sections['${zn.replace(/'/g,"\\'")}']=!S.rb.sections['${zn.replace(/'/g,"\\'")}'];render()">
              ${r.sections[zn]?I.check+' 分區導聆':'＋ 分區導聆'}</button>
          </div>
          <div class="rowlist">
            ${pool.filter(p=>vname(p.v)+' '+p.fl+'・'+p.z===zn).map(p=>{
              const w=r.picked[p.id], dis=p.lvl!=='full';
              return `<button class="row" onclick="rbToggle('${p.id}')" style="${dis?'opacity:.55':''}">
                <div class="mk ${w==='must'?'on-route':(w==='opt'?'done':'')}" style="position:static">${w?(w==='must'?picked.indexOf(p)+1:I.check):''}</div>
                <div class="g"><div class="n">${p.n}</div>
                  <div class="s"><span class="lvl ${p.lvl}">${p.lvl==='full'?'完整級':'文字級'}</span>

              <span class="chip" style="background:rgba(255,255,255,.92)">${r.type==='ex'?(exName||'展覽路線'):'全館主題'}</span>
              ${venues.length>1?'<span class="chip gold">跨場館</span>':''}

        </div>
        <div class="state" style="margin-top:14px;background:#fff;border:1px solid var(--line);color:var(--ink-2)">

/* =====================================================================
   ⑫ 導覽中地圖（內頁）：底層是地圖、只標正在聽的點位／路線點位；
   底部換成 mini play bar（無 tab menu）；返回一律回地圖頁
   ===================================================================== */
/* 路線內搜尋（2026-11-02）：留在導覽中地圖上開一層，只搜這條路線的站；點結果＝地圖聚焦到那一站並開小卡，不跳到最外層搜尋 */
function rsHits(){
  const q=(S.rsearch||'').trim(), m=p=>!q||p.n.includes(q)||p.z.includes(q)||(p.no&&p.no.startsWith(q));
  const fl=new Set(S.route.list.map(id=>{ const p=byId(id); return p.v+'|'+p.fl; }));
  return { stops:S.route.list.map(byId).filter(m),

function scrPlaylist(){
  if(!S.player) return blank('沒有正在播放的內容','先在地圖上點一個展品，或開始一條路線。');
  const r = (S.player.mode!=='single' && S.route) ? S.route : null;
  const t = r?theme(r.themeId):null;

  /* 右側播放鈕：淡紫底▶；播放中＝實紫底（暫停/播放跟著 S.paused） */
  const pbtn=(id,seg)=>{
    const cur=id===S.player.id;
    return `<button style="width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:grid;place-items:center;

      ${cur?(S.paused?I.play:I.pause):I.play}</button>`;
  };
  /* 群組頭卡（灰底）：區名＋位置；有分區導聆才有播放鈕 */
  const headCard=(title,sub,segId)=>`
    <div style="background:var(--grey);border-radius:16px;padding:13px 13px 13px 18px;margin-bottom:10px;
      display:flex;align-items:center;gap:10px">

        <div class="tiny" style="margin-top:3px">${sub}</div>
      </div>

    </div>`;
  /* 站點卡（白底、內縮）：序號徽章＋縮圖＋標題 */
  const itemCard=(id)=>{
    const it=byId(id), cur=id===S.player.id;
    const no=r?r.list.indexOf(id)+1:0;
    const heard=r&&r.heard.includes(id)&&!cur;
    return `<div style="background:#fff;border-radius:16px;margin:0 0 10px 28px;padding:10px 12px;
      display:flex;align-items:center;gap:11px;cursor:pointer;
      box-shadow:0 1px 2px rgba(60,60,60,.05),0 6px 18px rgba(60,60,60,.06)"
      onclick="openSheet('${id}')">
      <div style="width:26px;height:26px;flex:0 0 26px;border-radius:999px;display:grid;place-items:center;
        background:var(--acc-l);color:var(--acc-d);font-size:12px;font-weight:700">${heard?I.check:(no||'♪')}</div>
      <div style="width:46px;height:46px;flex:0 0 46px;border-radius:10px;background:${thumbArt(id)}"></div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
          ${cur?'color:var(--acc-d)':''}">${it.n}</div>
        <div class="tiny" style="margin-top:2px">${vname(it.v)} ${it.fl}・${Math.round(it.dur/60*10)/10} 分</div>
      </div>
      ${pbtn(id,false)}
    </div>`;
  };

  let body='', meta='';
  if(!r){
    meta='不在路線上・1 則';
    body = itemCard(S.player.id).replace('margin:0 0 10px 28px','margin:0 0 10px 0');
  }else{
    const secKeys=Object.keys(t.sections||{});
    const groups=[];
    r.list.forEach(id=>{ const z=byId(id).z;
      let g=groups.find(x=>x.z===z); if(!g){ g={z,ids:[]}; groups.push(g); } g.ids.push(id); });
    const segN=(t.overview?1:0)+groups.filter(g=>secKeys.indexOf(g.z)>=0).length;
    meta=r.list.length+' 站'+(segN?'＋導聆 '+segN+' 段':'')+'・'+LANGS[S.lang];
    body = (t.overview?headCard('介紹','導覽概覽・'+Math.round(SEGS['sg-'+t.id].dur/60*10)/10+' 分','sg-'+t.id):'')
      + groups.map(g=>{
          const si=secKeys.indexOf(g.z);
          const fp=byId(g.ids[0]);
          const sub=vname(fp.v)+' '+fp.fl+(si>=0?'・分區導聆 '+Math.round(SEGS['sg-'+t.id+'-'+si].dur/60*10)/10+' 分':'');
          return headCard(g.z, sub, si>=0?('sg-'+t.id+'-'+si):null)
               + g.ids.map(itemCard).join('');

  }

  return `<div class="scr">

  ${S.sheet?pointSheet():''}
</div>`;
}

/* =====================================================================
   互動
   ===================================================================== */
function back(){
  /* 鐵則：所有返回＝回上一個步驟（歷史堆疊），不寫死目的地 */
  /* 導覽內頁（播放器）返回：整頁收合進下一頁的迷你播放器，帶一點回彈（2026-11-02） */
  const F=document.getElementById('frame');
  const fromPlayer = S.screen==='player' && S.player && !S._noAnim && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  const shrink = fromPlayer ? (()=>{ const o=F.querySelector('.scr:not(.scr-exit):not(.shrink-out)'); return o&&o.cloneNode(true); })() : null;
  S._growFrom=null; S._growScreen=null;
  let prev = S.hist.pop();
  if((S.screen==='map'||S.screen==='tourmap') && !['map','tourmap'].includes(prev||'home')){ S.navPath=null; S.herePick=null; clearHere(); }   // 從地圖返回別頁＝離開帶我去
  S.mapSheet=null; S.mapFocus=false;
  if((prev||'home')!==S.screen) S._scrAnim=S._noAnim?null:'back';
  S.screen = prev || 'home'; S._noAnim=false;
  if(shrink) S._scrAnim=null;
  render();
  if(shrink){
    const fr=F.getBoundingClientRect(), mini=F.querySelector('.minifloat .mini')||F.querySelector('#microP');
    const r=mini?mini.getBoundingClientRect():{top:fr.bottom-110,bottom:fr.bottom-40,left:fr.left+14,right:fr.right-14};
    const t=r.top-fr.top, bt=fr.bottom-r.bottom, l=r.left-fr.left, rt=fr.right-r.right, rad=mini&&mini.id==='microP'?16:18;
    shrink.classList.remove('anim-fwd','anim-grow','anim-back'); shrink.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
    shrink.style.cssText+=';position:absolute;inset:0;z-index:60;pointer-events:none';
    F.appendChild(shrink);
    const ins=(k)=>`inset(${t-k}px ${rt-k}px ${bt-k}px ${l-k}px round ${rad}px)`;
    shrink.animate([{clipPath:'inset(0 0 0 0 round 0)',opacity:1},{clipPath:ins(-10),opacity:.9,offset:.72},{clipPath:ins(4),opacity:.6,offset:.88},{clipPath:ins(0),opacity:0}],
      {duration:520,easing:'cubic-bezier(.55,0,.25,1)',fill:'forwards'}).onfinish=()=>shrink.remove();
    if(mini&&mini.animate) mini.animate([{transform:'scale(1)'},{transform:'scale(1)',offset:.6},{transform:'scale(1.05)',offset:.8},{transform:'scale(.98)',offset:.92},{transform:'scale(1)'}],{duration:620,easing:'ease-out'});
  }
  const y=(S.scrollMem||{})[S.screen];                 // 返回上一頁＝回到原本捲到的位置，不跳回頂部
  if(y){ const put=()=>{ const b=document.querySelector('#frame .body'); if(b) b.scrollTop=y; }; put(); setTimeout(put,0); setTimeout(put,60); }
}
function langMenu(){
  const ks=Object.keys(LANGS), i=ks.indexOf(S.lang);

function setLang(l){
  S.lang=l;
  syncLangPath();
  if(S.route){
    const anchor = S.route.list[S.route.idx], t = S.route.themeId;
    const per = personasFor(t,l).includes(S.persona)?S.persona:(personasFor(t,l)[0]||S.persona);
    S.persona = per;
    const list = plan(t,l,per,S.minutes).map(p=>p.id);
    if(list.length){
      S.route.list = list;
      S.route.heard = S.route.heard.filter(id=>list.includes(id));
      const at = list.indexOf(anchor);
      S.route.idx = at>=0?at:0;
      say('切換語系 → 依導覽點 ID 定位：'+byId(anchor).n+(at>=0?'（仍是第 '+(at+1)+' 站）':'（此站無'+LANGS[l]+'語音，停在原地並提示）'));
      if(at<0 && S.player) S.player.id = anchor;
    }else{
      say('切換語系 → 此路線在'+LANGS[l]+'不成立，回到首頁列表（該路線不出現）');
      S.route=null; S.player=null; S.screen='home';
    }
  }
  render();
}
/* 展品所屬的展覽（themes 裡 scope=exhibition 的那個）；搜尋／掃碼直接聽單件時，用來帶回整個展覽的導覽 */
function exThemeOf(p){ return p&&Object.keys(p.themes||{}).map(theme).find(t=>t&&t.scope==='exhibition'); }
function exEntryBtn(p){ const t=exThemeOf(p); if(!t || (onTour()&&S.route.themeId===t.id)) return '';
  return `<button class="btn ghost" style="width:100%;margin-bottom:12px;justify-content:space-between;padding:0 16px" onclick="startEntryFrom('${t.id}','${p.id}')">
    <span>${onTour()?'改聽':'開始'}「${t.n.split('：')[0]}」整個展覽的導覽</span>${I.arrow}</button>`; }
/* 從某件展品進展覽導覽：路線一定包含這件（就算選的時間排不進去），免得「剛剛那件不見了」 */
function pinIntoRoute(r,id){ if(id && byId(id) && !r.list.includes(id)){ r.list.push(id); r.list.sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b)); } }
/* 導覽內頁點展品「從這一站開始導覽」：沿用規劃好的路線（沒規劃就用內頁顯示的清單），這件不在路線裡就補進去，從這一站開始聽 */
function startFromHere(id){ const tid=S.viewTheme;
  if(!(S.route&&S.route.themeId===tid)){ S.clang=viewLang(tid); S.persona=viewPersona(tid); S.route={themeId:tid,list:viewIds(tid),idx:0,heard:[]}; }
  pinIntoRoute(S.route,id); S.sheet=null; S.lastStop=null;
  if(isTextStop(tid,id)) return goStation(S.route.list.indexOf(id));
  playPoint(id,1); }
function startEntryFrom(tid,id){
  if(S.route && S.route.themeId===tid && !onTour()){ pinIntoRoute(S.route,id); openThemeInfo(tid); return; }   // 設定過但還沒開始：沿用那條，補進這件
  S.entryPin={themeId:tid,id}; startEntry(tid);
}
function startEntry(id){
  if(onTour() && S.route.themeId!==id){ S.tourAsk={kind:'entry',tid:id,pin:S.entryPin&&S.entryPin.themeId===id?S.entryPin.id:null}; S.sheet=null; render(); return; }   // 導覽中換展覽 → 先問
  if(S.route && S.route.themeId===id && !S.entryForce){ openThemeInfo(id); return; }  // 同個導覽已在進行 → 直接進內頁
  S.entryForce=false;
  S.entry={themeId:id, lang:S.lang, persona:null, minutes:null, kidAge:S.kidAge}; go('entry');
}
/* 導覽內頁（⑮）：瀏覽一條路線的介紹＋列表＋地圖，不需先做設定 */
/* 預覽用的導覽語言：介面語言沒有這條導覽的版本時，改用它有的第一個（常設展目前只有台灣手語） */
function viewLang(tid){ const ls=langsFor(tid); return ls.includes(S.lang)?S.lang:(ls[0]||S.lang); }
function viewPersona(tid){ const ps=personasFor(tid,viewLang(tid)); return ps.includes(S.persona)?S.persona:(ps[0]||'general'); }
/* 主題路線（scope=venue）＝照路線地圖一站站走；A 版仍先問停留時間（A 版特色，2026-10-29 使用者定案），排好的站點含文字站。
   站點照官網路線圖；有的站沒有音檔，只有文字導覽（哪幾站是示意，跟 B 版同一組） */
const THEME_TEXT = {must:['m_map','m_tally','m_tour','m_warmem','m_stone'], listen:['l_place','l_asai','l_end','l_demo']};
const isRouteTheme = tid => (theme(tid)||{}).scope==='venue';
const isTextStop = (tid,id) => (THEME_TEXT[tid]||[]).includes(id);
function themeStops(tid){ return P.filter(p=>p.lvl==='full'&&p.themes[tid]).sort((a,b)=>ORDER.indexOf(a.id)-ORDER.indexOf(b.id)).map(p=>p.id); }
function stopKind(tid,id){ if(isTextStop(tid,id)) return '文字'; return playLang(byId(id))==='tsl'?'手語':'語音'; }
function routeMeta(tid){ const l=themeStops(tid), tx=l.filter(id=>isTextStop(tid,id)).length;
  const m=Math.round(l.reduce((a,id)=>a+(isTextStop(tid,id)?60:byId(id).dur)+60,0)/60);
  return l.length+' 站・約 '+m+' 分鐘'+(tx?'・部分站點為文字導覽':''); }
/* 開始走路線：正在聽別的導覽、還沒聽完 → 先問要不要中斷 */
function startThemeWalk(tid, force){
  if(!force && S.player && !byId(S.player.id).seg && !(S.route&&S.route.themeId===tid&&S.route.list.includes(S.player.id))){ S.walkAsk=tid; render(); return; }
  S.walkAsk=null;
  if(!(S.route&&S.route.themeId===tid)){ S.clang=viewLang(tid); S.persona=viewPersona(tid); S.route={themeId:tid,list:themeStops(tid),idx:0,heard:[]}; }
  S.player=null; S.lastStop=null;
  goStation(0);
}
function goStation(i){ const l=S.route.list; i=Math.max(0,Math.min(l.length-1,i)); const id=l[i];
  if(isTextStop(S.route.themeId,id)){ S.route.idx=i; if(!S.route.heard.includes(id)) S.route.heard.push(id);
    const p=byId(id); S.at=id; S.venue=p.v; S.floor=p.fl;
    S.player={id,mode:'route',tonly:true}; S.paused=true; go('player'); return; }   /* 文字站也進導覽內頁，只換排版（不再跳到另一頁） */
  playPoint(id,1); }
function walkAskBox(){ if(!S.walkAsk) return ''; const t=theme(S.walkAsk), cur=byId(S.player.id);
  return `<div class="dim${once('walkask')}" style="z-index:40" onclick="S.walkAsk=null;render()"></div>

function viewIds(tid){
  const t=theme(tid);
  if(t&&t._forceList) return t._forceList.filter(i=>byId(i));         // 後台預覽：排序覆寫（embed 專用）
  if(S.route && S.route.themeId===tid) return S.route.list.slice();   // 已客製 → 內頁顯示組好的路線
  if(isRouteTheme(tid)) return themeStops(tid);                        // 主題路線＝固定站點（含文字站）
  return pool(tid,viewLang(tid),viewPersona(tid)).map(p=>p.id);       // 未客製 → 完整點池預覽
}

function openSheetFrom(id){ const p=byId(id); S.sheet=id; S.sheetExpand=false; S.sheetFullId=null; S.kbd=false;
  if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();   // 收鍵盤：先讓輸入框失焦
  S.venue=p.v; S.floor=p.fl; render(); }
function playPoint(id, asRoute){                 /* asRoute：從路線相關的按鈕進來（開始導覽／上下站／路線清單）＝照路線算 */
  if(!asRoute && onTour() && !stationNo(id)){ S.tourAsk={kind:'point',id}; S.sheet=null; render(); return; }   // 導覽中聽路線外的展品 → 先問
  if(asRoute && S.route && S.route.suspended && stationNo(id)) S.route.suspended=false;   // 接著聽擱著的路線
  const no=(asRoute||onTour())?stationNo(id):0, p=byId(id);
  const prevZone = byId(S.at) ? byId(S.at).z : null;
  const zoneChanged = prevZone!==p.z || byId(S.at).v!==p.v;
  S.player={id,mode:no?'route':'single'};
  if(no){ S.route.idx=no-1; if(!S.route.heard.includes(id)) S.route.heard.push(id);
    say('續走路線：第 '+no+' 站 '+p.n+'（推進進度）');
    if(S.route.heard.length===S.route.list.length && !S.route.done){   // 最後一站也聽了 → 路線完成
      S.route.done=true;
      clearTimeout(window._done);
      window._done=setTimeout(routeComplete, 1600);                    // 原型：稍等模擬最後一站播完
    } }
  else { if(!S.heardSingle.includes(id)) S.heardSingle.push(id);
    say('單獨聆聽：'+p.n+'（不動路線進度 '+(S.route?S.route.heard.length+'／'+S.route.list.length:'—')+'）'); }
  S.at=id; S.venue=p.v; S.floor=p.fl; S.sheet=null;
  scheduleNudge();
  if(S.screen==='player') go('player'); else enterTour();
  if(zoneChanged&&!NMTH){                            // NFC/QR 點位模擬（標規版沒有感應硬體，不提示）：跨進新展區 → 廣播＋Dainy 主動搭話
    say('點位觸發：已進入「'+p.z+'」（NFC/QR 定位）');
    setTimeout(()=>toast('📍 已進入・'+p.z), 250);
    clearTimeout(window._zg);
    window._zg=setTimeout(()=>zoneGreet(id), 2600);  // 等人走到定位再開口
  }
}
/* 入區搭話：像簡報「已進入・三葉蟲展區→虎寶主動出題」——任務站出任務、一般站給重點 */
function zoneGreet(pid){
  if(document.body.classList.contains('embed')) return;
  const p=byId(pid);
  if(!S.player||S.player.id!==pid) return;           // 已經換站就不說了
  if(S.dainySheet||S.cam||S.navPath||S.kbd) return;  // 對話中/拍照/導航中不打擾
  S.dainy.mode='talking';
  S.dainy.msgs.push({who:'d',
    m:'我們到「'+p.z+'」了！這一區我最想帶你看的就是眼前這件「'+p.n+'」，邊聽邊看，有什麼想追問的都可以。',
    why:'進入展區觸發（NFC/QR 點位定位）',
    sugg:['這區還有什麼必看？','這區大概逛多久？']});
  say('入區搭話：'+p.z);
  S.dainySheet='full'; render();
}
/* 陪伴層 nudge：每段（展品或導聆）播完後，Dainy 時不時主動跳出關心／提相關問題。
   「時不時」＝隔次觸發；正在導航、拍照、對話中或已完成路線時保持沉默 */
let _nudgeN=0;
/* 一鍵評分：送進館方「意見回饋」（與 AI 回答校正分流） */
function fbSend(score){
  const p=S.player?byId(S.player.id):null;
  S.dainy.msgs.push({who:'me',m:{good:'👍 有幫助',mid:'普通',bad:'沒幫助'}[score]});
  S.dainy.msgs.push({who:'d',m:score==='bad'
    ?'謝謝你告訴我。想多說一句哪裡不好嗎？打在下面就行——館方會看到。'
    :'收到，謝謝你的回饋！'+(score==='good'?'我會繼續加油！':'')});
  say('播畢評分：'+(p?p.n:'')+'（'+score+'）→ 進後台「意見回饋」');
  render();
}
function scheduleNudge(){
  if(NMTH) return;                                        // 標規版：沒有陪伴層，不主動搭話
  if(document.body.classList.contains('embed')) return;   // 後台預覽：不主動跳出，安靜呈現腳本
  clearTimeout(window._nudge);
  const cur=S.player&&S.player.id;
  if(!cur) return;
  window._nudge=setTimeout(()=>{
    if(!S.player||S.player.id!==cur||S.paused||S.dainySheet||S.cam||S.navPath) return;
    if(S.route&&S.route.done) return;
    _nudgeN++;
    if(_nudgeN%2===0){ say('陪伴層：本段播完，這次選擇不開口（時不時原則）'); return; }
    const p=byId(cur);
    S.dainy.mode='talking';
    if(p.seg){
      const nextId=S.route?S.route.list[S.route.idx]:null;
      S.dainy.msgs.push({who:'d',
        m:'這段導聆聽完了。'+(nextId?('接下來是「'+byId(nextId).n+'」，需要我帶你過去嗎？'):'想繼續就挑下一站吧。'),
        why:'導聆播放結束＋間隔觸發',
        act:nextId?{t:'帶我去下一站',fn:"startNav('"+nextId+"')"}:null});
    }else{
      S.dainy.msgs.push({who:'d',
        m:'「'+p.n+'」聽完了，感覺怎麼樣？想多聊聊這件都可以問我，累了附近也有休息區。',
        why:'展品播放結束＋間隔觸發',
        sugg:['這件為什麼重要？','附近還有類似的嗎？','附近哪裡可以坐一下？']});
    }
    /* 意見回饋入口：聽完一段的一鍵評分（進後台「意見回饋」，非 AI 回答校正） */
    if(S.player&&!byId(S.player.id).seg){
      S.dainy.msgs.push({who:'d', m:'這一段的導覽對你有幫助嗎？',
        why:'播畢回饋（進館方「意見回饋」）',
        opts:[{t:'👍 有幫助',fn:"fbSend('good')"},{t:'普通',fn:"fbSend('mid')"},{t:'沒幫助',fn:"fbSend('bad')"}]});
    }
    say('陪伴層：本段播完 → Dainy 主動跳出');
    S.dainySheet='full'; render();
  }, 8000);                                          // 原型：8 秒模擬本段播完
}
/* 路線走完 → Dainy 自動跳出：恭喜＋延伸問題＋建議下一條路線 */
function routeComplete(){
  if(!S.route||!S.route.done) return;
  const t=theme(S.route.themeId);
  const next = themesFor(S.lang).find(x=>x.id!==t.id);
  if(NMTH){ say('路線完成：'+t.n+'（標規版無陪伴層，只提示完成）'); toast('「'+t.n+'」全部走完了'); render(); return; }
  say('路線完成：'+t.n+' → Dainy 主動跳出（延伸問題＋建議下一條）');
  S.dainy.mode='talking';
  S.dainy.msgs.push({who:'d',
    m:'「'+t.n+'」的 '+S.route.list.length+' 站全部走完了，辛苦了！剛剛的內容有什麼想追問的，都可以問我。',
    why:'路線進度 '+S.route.list.length+'／'+S.route.list.length+'（完成）',
    sugg:['剛剛哪一件最珍貴？','報馬仔身上掛的是什麼？','剛剛漏聽的可以補嗎？']});
  if(next) S.dainy.msgs.push({who:'d',
    m:'還有時間的話，「'+next.n+'」跟這條很搭：'+next.intro,

function playRoute(i){

}
/* 上一則／下一則：照完整播放序列走，路線總覽、分區導聆這些音檔也算一則（2026-11-02） */
function seqPos(){ const r=S.route, seq=seqOf(r); let i=seq.indexOf(S.player&&S.player.id); if(i<0) i=seq.indexOf(r.list[r.idx]); return {seq,i}; }
function seqStep(d){
  const r=S.route, {seq,i}=seqPos(), j=i+d;
  if(j<0||j>=seq.length){ toast(d>0?'已經是最後一則':'已經是第一則'); return; }
  const id=seq[j];
  if(SEGS[id]){ S.paused=false; return playSeg(id); }
  if(isRouteTheme(r.themeId)) return goStation(r.list.indexOf(id));
  playPoint(id,1);
}
function nextStation(){ if(!S.route) return; seqStep(1); }
function prevStation(){ if(!S.route){ toast('單獨聆聽沒有上一則'); return; } seqStep(-1); }
/* 地圖上的上一站／下一站（迷你播放器上方）：不開內頁，只把地圖移到那一站。

/* 地圖上的上一站／下一站也照完整序列走：路線導聆是第一則（2026-11-02） */
function mapPos(){ const r=S.route, seq=seqOf(r), cur=(S.player&&byId(S.player.id).seg)?S.player.id:r.list[r.idx]; return {seq, i:Math.max(0,seq.indexOf(cur))}; }
function mapStep(d){
  if(!S.route) return;
  const {seq,i:k}=mapPos(), j=k+d; if(j<0||j>=seq.length) return;
  if(SEGS[seq[j]]){ S.paused=false; return playSeg(seq[j]); }
  const l=S.route.list, id=seq[j], i=l.indexOf(id);
  if(!isTextStop(S.route.themeId,id)) return playPoint(id,1);
  const p=byId(id);
  const sameFloor = S.screen==='tourmap' && S.venue===p.v && S.floor===p.fl;
  S.route.idx=i; S.venue=p.v; S.floor=p.fl; S.mapView='floor'; S.sheet=null;
  if(!sameFloor){ S.mapZoom=1; S.mapPan={x:0,y:0}; }
  say('地圖聚焦：第 '+(i+1)+' 站 '+p.n+'（文字導覽）');
  if(S.screen!=='tourmap') go('tourmap'); else render();
  setTimeout(()=>mzFocus(id), 60);
  toast('第 '+(i+1)+' 站是文字導覽・點標記看介紹');

function jumpNextPlayable(){
  if(!S.route) return;

/* 帶我去：不開彈窗——直接在地圖上畫 A→B 動態路徑。

function startNav(id, picked){
  if(!id) return;
  if(!picked){ askHere(id); return; }               // 人會移動：每次「帶我去」都先請觀眾重新點自己在哪
  const from = S.here;
  const A=byId(from), B=byId(id);
  S.navPath={from, to:id, back:false};
  S.sheet=null; S.mapSheet=null; S.mapPick=false; S.mapFocus=false; S.dainySheet=null;
  S.venue=A.v; S.floor=A.fl; S.mapView='floor';
  const cross = A.v!==B.v || A.fl!==B.fl;
  say('帶我去：'+B.n+'（起點 '+A.n+(cross?'，跨樓層——先走到電梯':'，同層直達')+'）');
  if(S.screen!=='map' && S.screen!=='tourmap'){ S.navPath.back=true; S._noAnim=true; go('map'); } else render();

/* 標規版的「查看位置」：切到該點所在樓層並選取，不畫導航路徑（標規 MAP-01 只要點位標示） */

/* ===== 我的位置：手動標註（館內沒有 Beacon、也不用 GPS，起點只能由觀眾告訴我們） ===== */
function askHere(to){

  S.herePick={to:to||null, back};
  S.navPath=null; S.sheet=null; S.mapSheet=null; S.mapPick=false; S.mapFocus=false; S.dainySheet=null;
  if(S.mapView==='site'||(to&&byId(to).v==='park'&&S.venue!=='main')){ S.venue='park'; S.floor='戶外'; }   /* 從館區地圖或戶外點位進來：先在館區地圖標起點 */
  S.mapView='floor';
  say('標註位置：請觀眾在地圖上點自己附近的展品或設施'+(to?'（之後帶去 '+byId(to).n+'）':''));

function setHere(id){
  const p=byId(id), pk=S.herePick; if(!p) return;

function clearHere(){ S.here=null; S.hereSpot=null; }
function cancelHere(){ const b=S.herePick&&S.herePick.back; S.herePick=null; clearHere(); if(b){ S._noAnim=true; back(); } else render(); }
function hereChip(){

function closeNav(){ const b=S.navPath&&S.navPath.back; S.navPath=null; clearHere(); toast('已結束帶路，路線已收起'); if(b){ S._noAnim=true; back(); } else render(); }   /* 從別頁進來的導航，關閉就回那一頁 */

function navSegForFloor(){
  if(!S.navPath) return null;
  const A=byId(S.navPath.from), B=byId(S.navPath.to);
  if(A.v===B.v && A.fl===B.fl){
    return (S.venue===A.v&&S.floor===A.fl) ? {pts:walkPts(A,B), liftId:null} : null;
  }
  if(A.v==='park'||B.v==='park'){                     /* 館內 ⇄ 館區戶外：進館走正門入口、離館走 1F 西側出口 */
    const goIn=A.v==='park', In=goIn?B:A, O=goIn?A:B;
    const door=byId(goIn?'f_entry1':'f_exit1'), gate=byId(goIn?'f_gate_p':'f_exit_p');
    if(S.venue==='park') return {pts:goIn?walkPts(O,gate):walkPts(gate,O), liftId:gate.id, liftLabel:goIn?'從正門入口進館':'出口出來後沿路徑走'};
    if(S.venue===In.v&&S.floor===In.fl){
      if(In.fl==='1F') return {pts:goIn?walkPts(door,In):walkPts(In,door), liftId:door.id, liftLabel:goIn?'進正門後沿路徑走':'從出口離館'};
      const lift=nearest('lift',In.v,In.fl);
      return {pts:goIn?walkPts(lift,In):walkPts(In,lift), liftId:lift.id, liftLabel:goIn?'出電梯後沿路徑走':'搭電梯到 1F'};
    }
    if(S.venue===In.v&&S.floor==='1F'){ const lift=nearest('lift',In.v,'1F');
      return {pts:goIn?walkPts(door,lift):walkPts(lift,door), liftId:goIn?lift.id:door.id, liftLabel:goIn?'搭電梯到 '+In.fl:'從出口離館'}; }
    return null;
  }
  if(S.venue===A.v && S.floor===A.fl){
    const lift=nearest('lift',A.v,A.fl);
    return {pts:walkPts(A,lift), liftId:lift.id, liftLabel:'搭電梯往 '+vname(B.v)+' '+B.fl};
  }
  if(S.venue===B.v && S.floor===B.fl){
    const lift=nearest('lift',B.v,B.fl);
    return {pts:walkPts(lift,B), liftId:lift.id, liftLabel:'出電梯後沿路徑走'};
  }
  return null;
}

function setPersona(k){
  S.persona=k;
  if(S.route){ const l=plan(S.route.themeId,S.lang,k,S.minutes).map(p=>p.id);
    if(l.length){ S.route.list=l; S.route.heard=S.route.heard.filter(x=>l.includes(x)); S.route.idx=0;
      say('換對象腳本 → 重新組裝為 '+l.length+' 站'); }
    else { say('此對象在本語系無可成立路線 → 路線退出'); S.route=null; S.player=null; S.screen='home'; } }
  render();
}
function setMinutes(v){
  S.minutes=+v;
  if(S.route){ const l=plan(S.route.themeId,S.lang,S.persona,+v).map(p=>p.id);
    S.route.list=l; S.route.heard=S.route.heard.filter(x=>l.includes(x));
    say('時間預算 '+tlabel(+v)+' → 重新組裝為 '+l.length+' 站'); }
  render();
}
function setVenue(v){ S.venue=v; S.floor=Object.keys(VENUES[v].floors)[0]||'—'; S.sheet=null; render(); }
function setNum(k,v){ S[k]=+v; render(); }
function setStr(k,v){ S[k]=v; render(); }

/* ---------- render ---------- */
/* 退場動畫：換頁時留一份舊頁面做往外滑；同頁內關掉的面板（sheet／抽屜／彈窗／詳情）也留一份做退場 */
const OV_SEL='.sheet,.dim,.popc,.popt,.drawerp,.detailpanel';
const ovKind=el=>['sheet','dim','popc','popt','drawerp','detailpanel'].find(c=>el.classList.contains(c));
function render(){
  const F = document.getElementById('frame');
  const oldScr = F.querySelector('.scr:not(.scr-exit):not(.shrink-out)');
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pageKind = S._scrAnim;                                      // 有值＝這次是換頁
  const oldClone = (!reduce && oldScr && pageKind) ? oldScr.cloneNode(true) : null;
  const fr = F.getBoundingClientRect();
  const oldOv = (!reduce && oldScr && !pageKind) ? [...oldScr.querySelectorAll(OV_SEL)].map(el=>{
    const r=el.getBoundingClientRect(); return {k:ovKind(el), el:el.cloneNode(true), r}; }) : [];
  /* 同一頁重繪（開 sheet、切狀態）不換頁時，保留原本捲到的位置，不跳回頂部 */
  const _ob = (oldScr && !pageKind && S._lastScreen===S.screen) ? oldScr.querySelector(':scope > .body') : null;
  const keepY = _ob ? _ob.scrollTop : 0;
  const _pc = oldScr && oldScr.querySelector('#pcard'), _pv = _pc && _pc.querySelector('[data-pvar]');   /* 播放卡切換前：記下會變的那一塊（進度＋播放鍵） */
  const _pvClone = _pv ? _pv.cloneNode(true) : null, _pvH = _pv ? _pv.offsetHeight : 0;
  S._prevShown=S._shown||{}; S._nowShown={};
  if(S.screen==='admin'||S.screen==='builder'){ S.screen='home'; }   // 後台畫面另見 admin.html
  {
    F.innerHTML = ({home:scrHome,entry:scrEntry,route:scrRoute,map:scrMap,code:scrCode,
                    player:scrPlayer,member:scrMember,tourmap:scrTourmap,playlist:scrPlaylist,dainylist:scrDainyList,
                    routeinfo:scrRouteInfo,tstop:scrTStop,routegen:scrRouteGen,excard:scrExCard,sign:scrSign,exlist:scrExList,events:scrEvents,locate:scrLocate,qr:scrQR,howto:scrHowto,login:scrLogin,privacy:scrPrivacy,notes:scrNotes,feedback:scrFeedback,offline:scrOffline})[S.screen]();
  }
  const scrEl = F.querySelector('.scr');
  if(keepY && scrEl){ const nb=scrEl.querySelector(':scope > .body'); if(nb) nb.scrollTop=keepY; }
  S._lastScreen=S.screen;
  if(scrEl && S.walkAsk) scrEl.insertAdjacentHTML('beforeend', walkAskBox());   // 開始走路線前的中斷提示
  if(scrEl && S.tourAsk) scrEl.insertAdjacentHTML('beforeend', tourAskBox());   // 導覽中聽路線外展品／換展覽前的中斷提示
  if(scrEl && S._grow && S._scrAnim==='fwd'){         // 由迷你播放器展開
    S._scrAnim='grow'; S._growScreen=S.screen; S._growFrom=S._grow;
    scrEl.style.setProperty('--gt',S._grow.t+'px'); scrEl.style.setProperty('--gb',S._grow.b+'px'); }
  S._grow=null;
  if(document.getElementById('mz')) mzApply();          // 地圖頁：一進來就套用邊界
  /* 播放卡切換（2026-11-02）：展品資訊列與上一則／下一則是共有元件，原地不動；
     只有「進度＋播放控制」這一塊有差異——出現時由 0 長高淡入、消失時縮回淡出，卡片頂端跟著平滑移動 */
  { const nc=F.querySelector('#pcard'); if(nc&&_pc&&!reduce&&!pageKind){ const nv=nc.querySelector('[data-pvar]');
    const grow=(el,from,to,o0,o1,done)=>{ el.style.overflow='hidden'; el.animate([{height:from+'px',opacity:o0},{height:to+'px',opacity:o1}],{duration:320,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>{ el.style.overflow=''; done&&done(); }; };
    if(nv&&!_pv) grow(nv,0,nv.offsetHeight,0,1);
    else if(!nv&&_pvClone){ nc.insertBefore(_pvClone, nc.children[1]||null); grow(_pvClone,_pvH,0,1,0,()=>_pvClone.remove()); } } }
  if(scrEl && S._scrAnim){ scrEl.classList.add('anim-'+S._scrAnim); }
  /* 由迷你播放器展開成整頁：從播放器的實際位置與大小長出來，最後微微彈一下（與收合對稱，2026-11-02） */
  if(scrEl && S._scrAnim==='grow' && S._growFrom && !reduce && scrEl.animate){ const g=S._growFrom;
    scrEl.style.animation='none';
    scrEl.animate([{clipPath:`inset(${g.t}px ${g.r||12}px ${g.b}px ${g.l||12}px round ${g.rad||18}px)`,transform:'scale(1)',opacity:.6},
      {clipPath:'inset(0 0 0 0 round 0)',transform:'scale(1.012)',opacity:1,offset:.72},
      {clipPath:'inset(0 0 0 0 round 0)',transform:'scale(.997)',offset:.88},
      {clipPath:'inset(0 0 0 0 round 0)',transform:'scale(1)',opacity:1}],{duration:540,easing:'cubic-bezier(.2,.8,.3,1)'}); }
  if(oldClone && scrEl){                                              // 舊頁退場
    const k = S._scrAnim || pageKind;
    oldClone.classList.remove('anim-fwd','anim-back','anim-tab','anim-grow');
    oldClone.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
    oldClone.classList.add('scr-exit','k-'+(k==='grow'?'grow':k));
    F.insertBefore(oldClone, k==='back'?null:scrEl);
    setTimeout(()=>oldClone.remove(), 460);
  }
  if(oldOv.length && scrEl){                                          // 同頁關掉的面板退場
    const now={}; scrEl.querySelectorAll(OV_SEL).forEach(el=>{ const k=ovKind(el); now[k]=(now[k]||0)+1; });
    const seen={};
    oldOv.forEach(o=>{ seen[o.k]=(seen[o.k]||0)+1; if(seen[o.k]<=(now[o.k]||0)) return;
      const w=document.createElement('div'); w.className='exitwrap';
      w.style.cssText=`left:${o.r.left-fr.left}px;top:${o.r.top-fr.top}px;width:${o.r.width}px;height:${o.r.height}px;z-index:40`;
      o.el.classList.remove('anim-in'); o.el.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
      o.el.style.position='absolute'; o.el.style.inset='0'; o.el.style.left='0'; o.el.style.right='0'; o.el.style.top='0'; o.el.style.bottom='0';
      o.el.style.transform = o.k==='popc' ? 'none' : o.el.style.transform;
      o.el.classList.add('ov-exit-'+o.k); w.appendChild(o.el); F.appendChild(w);
      setTimeout(()=>w.remove(), 320); });
  }
  S._scrAnim=null;
  if(scrEl){
    if(S.cam){ scrEl.insertAdjacentHTML('beforeend', camOverlay()); camAttach(); }
    if(S.dainySheet && !S._dainyClosing) scrEl.insertAdjacentHTML('beforeend', dainySheet());
    if(S.report) scrEl.insertAdjacentHTML('beforeend', reportModal());
    if(closeDue()) scrEl.insertAdjacentHTML('beforeend', closeBox());   // 閉館前 30／5 分鐘提醒，蓋在所有頁面最上層
  }
  /* 逐字重繪會讓搜尋框失焦 → 補 focus；但鍵盤已收（點了卡片、開了 sheet）就不能再 focus，否則 onfocus 會把鍵盤叫回來 */
  if(S.screen==='code'&&S._typing&&!S.sheet){ const inp=F.querySelector('input'); if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); } }
  S._typing=false;
  S._shown=S._nowShown; S._tabPop=null;
}
/* 點微型播放器以外的地方＝收合它。不能在 pointerdown 就重繪：重繪會換掉手指下的按鈕，那一下點擊就被吃掉（語言、速度鈕「沒反應」） */
window.addEventListener('click', e=>{
  if(S.microOpen && !e.target.closest('#microP')){ S.microOpen=false; requestAnimationFrame(()=>{ if(!S.microOpen&&document.querySelector('#microP.open')) render(); }); }
}, true);
/* 後台 iframe 預覽模式：?embed=ex&ex=<exId>[&n=&intro=]（展覽內頁）／?embed=pt&id=<pid>（播放器）。
   後台的即時預覽直接載真前台，不另做仿 UI；名稱與一句話介紹可由參數覆寫做即時同步 */
const __PV=new URLSearchParams(__QS);
/* 首頁區塊開關（後台「首頁管理」連動）：off=carousel,theme,... 的型別不渲染 */
window.__hbOff=new Set((__PV.get('off')||'').split(',').filter(Boolean));
window.hbOn=t=>!window.__hbOff.has(t);
/* 首頁底部延伸資訊（後台「首頁管理」連動）：ext=名稱清單＝只顯示這些；無參數＝預設全開 */
window.__extOn=__PV.has('ext')?new Set(decodeURIComponent(__PV.get('ext')||'').split(',').filter(Boolean)):null;

if(__PV.get('embed')){
  document.body.classList.add('embed');
  S.onboarded=true;                                  /* 預覽不跑首次設定 onboarding */
  if(!S.persona) S.persona='general';
  /* 後台欄位即時同步：不重載 iframe，直接改資料重繪 */
  window.__pvUpdate=(d)=>{
    if(__PV.get('embed')==='pt'){
      const q=byId(__PV.get('id'));
      if(q&&d.text!=null) q.text=d.text;
      if(q&&d.n!=null) q.n=d.n;
      if(q&&d.guide!=null) q.guide=d.guide;
      if(d.persona&&PERSONAS[d.persona]) S.persona=d.persona;
      if(d.lang&&LANGS[d.lang]) S.lang=d.lang;
      render();
      return;
    }
    if(__PV.get('embed')==='theme'){
      const t=theme(__PV.get('id'));
      if(t){ if(d.n!=null) t.n=d.n; if(d.intro!=null) t.intro=d.intro;
        if(d.list) t._forceList=d.list.slice(); }
      if(d.lang&&LANGS[d.lang]) S.lang=d.lang;
      render();
      return;
    }
    const e=EXHIBITIONS.find(x=>x.id===__PV.get('ex')); if(!e) return;
    const t=theme(e.themeId);
    if(d.n!=null){ e.n=d.n; if(t) t.n=d.n; }
    if(d.list&&t) t._forceList=d.list.slice();
    if(d.intro!=null&&t) t.intro=d.intro;
    if(d.loc!=null) e.loc=d.loc;
    if(d.period!=null) e.period=d.period;
    if(d.lang&&LANGS[d.lang]) S.lang=d.lang;
    render();
  };
  if(__PV.get('embed')==='home'){
    S.onboarded=true; go('home');
  }else if(__PV.get('embed')==='theme'){
    const t=theme(__PV.get('id'));
    if(t){
      if(__PV.get('n')) t.n=__PV.get('n');
      if(__PV.get('intro')) t.intro=__PV.get('intro');
      openThemeInfo(t.id); S.infoSheet='full';
      if(__PV.get('tab')==='list') S.infoTab='list';
    }
  }else if(__PV.get('embed')==='excard'){
    S.onboarded=true;
    const e=EXHIBITIONS.find(x=>x.id===__PV.get('ex'));
    if(e){ if(__PV.get('n')) e.n=__PV.get('n');
      const t=theme(e.themeId); if(t&&__PV.get('intro')) t.intro=__PV.get('intro');
      go('excard'); }
  }else if(__PV.get('embed')==='ex'){
    const e=EXHIBITIONS.find(x=>x.id===__PV.get('ex'));
    const t=e&&theme(e.themeId);
    if(t){
      if(__PV.get('n')){ t.n=__PV.get('n'); e.n=__PV.get('n'); }
      if(__PV.get('intro')) t.intro=__PV.get('intro');
      openThemeInfo(t.id); S.infoSheet='full';
      if(__PV.get('tab')==='list') S.infoTab='list';
    }
  }else if(__PV.get('embed')==='pt'){
    const pid=__PV.get('id');
    if(!byId(pid)){                                 /* 後台新建、前台尚無的點：用後台資料建臨時展品照樣預覽 */
      P.push({id:pid, n:decodeURIComponent(__PV.get('n')||'展品預覽'), text:'（內容同步中…）',
        lvl:'full', tracks:{general:['zh']}, themes:{}, v:'main', fl:'1F', z:'展區', dur:90, tags:[], no:''});
    }
    playPoint(pid);
    go('player');                                   /* 預覽直接進播放器（逐字稿主體），不停在地圖頁 */
    if(__PV.get('pv')==='detail'){ S.detail=pid; render(); }   /* 展品頁預覽：疊出展品詳情面板 */
  }
}
/* 易用性測試的情境入口：?go=pt:412 掃到展籤 QR Code（先開展品卡）；?go=play:203 參觀到一半、正在聽這一件 */
(()=>{ const [k,no]=(new URLSearchParams(__QS).get('go')||'').split(':');
  if(k==='ex'){ const e=EXHIBITIONS.find(x=>x.id===no); if(e){ openThemeInfo(e.themeId); S.infoSheet='full'; } return; }   /* ?go=ex:ex_mazu 掃展場入口的 QR Code：開這檔展覽的導覽頁 */
  if(k==='tour'){ const [,exId,n]=(new URLSearchParams(__QS).get('go')||'').split(':'), e=EXHIBITIONS.find(x=>x.id===exId); if(!e) return;   /* ?go=tour:ex_perm:3 展覽導覽聽到第 3 站（前兩站已聽完） */
    const tid=e.themeId, list=viewIds(tid), i=Math.max(0,Math.min(list.length-1,(+n||1)-1));
    S.clang=viewLang(tid); S.persona=viewPersona(tid); S.route={themeId:tid,list,idx:i,heard:list.slice(0,i)};
    playPoint(list[i],1); go('player'); return; }
  const p=no&&P.find(x=>x.no===no); if(!p) return;
  if(k==='pt') openSheetFrom(p.id);
  if(k==='play'){ playPoint(p.id); go('player'); } })();
render();

</script>
</body></html>
