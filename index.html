<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>body{margin:0}</style></head><body>
<title>臺史博導覽試用任務</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* 版面：單欄任務卡，一次一步；上方進度軌跡，底部固定操作列。臺史博前臺 token（墨青／米白／金只做圖形） */
:root{
  --paper:#F7F4F0; --surface:#FFFFFF; --ink:#2F2E2C; --muted:#67645E; --line:#E4DED5;
  --teal:#2E5C6E; --teal-soft:#E4EDF0; --btn:#2E5C6E; --btn-fg:#FFFFFF;
  --gold:#C9A961; --warn:#8D0E0E; --ok:#2F6B4A; --ok-soft:#E6F0EA;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121819; --surface:#1A2224; --ink:#ECE8E1; --muted:#A8A39A; --line:#2D383B;
  --teal:#8DBDCC; --teal-soft:#1D3036; --btn:#8DBDCC; --btn-fg:#0E1A1E;
  --gold:#C9A961; --warn:#E59A9A; --ok:#8FCBA6; --ok-soft:#1B2E24; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121819; --surface:#1A2224; --ink:#ECE8E1; --muted:#A8A39A; --line:#2D383B;
  --teal:#8DBDCC; --teal-soft:#1D3036; --btn:#8DBDCC; --btn-fg:#0E1A1E;
  --gold:#C9A961; --warn:#E59A9A; --ok:#8FCBA6; --ok-soft:#1B2E24; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;letter-spacing:.02em}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.brand{display:flex;align-items:center;gap:10px;font-weight:500}
.seal{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;color:var(--teal)}
.track{display:flex;gap:4px;margin:14px 0 26px}
.track i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.track i.on{background:var(--gold)}
.track i.cur{background:var(--teal)}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35;letter-spacing:.04em}
h1{font-size:clamp(28px,6vw,36px)}
h2{font-size:24px}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--teal);font-weight:500;margin-bottom:6px}
.lead{color:var(--muted);margin:12px 0 0}
.stack{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(46,92,110,.06)}
.scenario{border-left:3px solid var(--gold);padding:4px 0 4px 16px;font-size:19px;line-height:1.75}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.facts div{background:var(--surface);border-radius:12px;padding:12px}
.facts b{display:block;font-family:var(--f-display);font-size:22px;color:var(--teal)}
.facts span{font-size:13px;color:var(--muted)}
ol.rules{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
label.q{display:block;font-weight:500;margin-bottom:8px}
.hint{font-size:13px;color:var(--muted);font-weight:400}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:92px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
.choices button[aria-checked="true"]{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:500}
.choices button[aria-checked="true"]::before{content:"✓ "}
.scale{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.scale button{font:inherit;font-variant-numeric:tabular-nums;font-size:17px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.scale button[aria-checked="true"]{background:var(--btn);color:var(--btn-fg);border-color:var(--btn);font-weight:700}
.scale-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:500;border-radius:999px;padding:12px 22px;border:1px solid var(--btn);background:var(--btn);color:var(--btn-fg);cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--teal);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.open{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.open .meta{font-size:13px;color:var(--muted)}
.qr{display:flex;gap:16px;align-items:center;margin-top:14px}
.qr .box{background:#fff;padding:8px;border-radius:8px;line-height:0}
.narrow-only{display:none}
@media (max-width:700px){.wide-only{display:none!important}.narrow-only{display:block}}
.ver{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--teal);background:var(--teal-soft);border-radius:999px;padding:3px 12px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.bar .in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar .need{font-size:13px;color:var(--muted)}
.notice{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:14px 16px}
pre.copy{white-space:pre-wrap;word-break:break-all;font-size:12px;max-height:220px;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0}
.demo{display:flex;gap:10px;align-items:stretch}
.demo div{flex:1;border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:13px;color:var(--muted);text-align:center}
.demo b{display:block;color:var(--ink);font-size:14px}
/* 研究者結果頁 */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:13px}
.meter{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;margin-right:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold)}
.quote{border-left:2px solid var(--line);padding-left:12px;margin:8px 0;font-size:14px}
.quote small{color:var(--muted)}
@media (max-width:420px){.facts{gap:8px}.facts div{padding:10px}.facts b{font-size:18px}.scale button{height:42px;font-size:15px}}
@media (prefers-reduced-motion:no-preference){.view{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
/* 任務卡：開始 → 計時中 → 結果與卡關 */
.tk{display:flex;flex-direction:column;gap:12px}
.tk.locked{opacity:.55}
.tk-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tk-n{font-size:13px;font-weight:700;color:var(--btn-fg);background:var(--teal);border-radius:999px;padding:2px 12px}
.tk-do{margin:0;font-size:17px;font-weight:500;line-height:1.7}
.tk-go{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tk-run{background:var(--teal-soft);border-radius:12px;padding:14px 16px}
.timer{font-family:var(--f-display);font-size:22px;color:var(--teal);font-variant-numeric:tabular-nums;margin-bottom:4px}
.linkbtn{font:inherit;font-size:13px;color:var(--teal);background:none;border:0;padding:8px 0 0;text-decoration:underline;cursor:pointer}
.choices button[role="checkbox"][aria-checked="true"]{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:500}
.choices button[role="checkbox"][aria-checked="true"]::before{content:"✓ "}
/* 展品說明牌示意 */
.lbls{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.lbl{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#FBF8F2;color:#2F2E2C;border:1px solid #D9CFBF;border-radius:6px;padding:14px 16px}
.lbl .hint{color:#67645E}
.lbl-no{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1;color:#2E5C6E}
.lbl-n{font-size:14px;margin:6px 0 2px}
.lbl .box{background:#fff;padding:6px;border-radius:4px;line-height:0;flex:0 0 auto}
</style>

const STATUS = [['gaveup','找不到，放棄'],['unsure','做完了，但不確定對不對'],['done','我完成了']];   /* 由左到右跟分數同方向 */
const FRICTION = [['wrong','點錯，要退回上一頁'],['nobtn','找不到要按的按鈕或入口'],['lost','不知道自己在哪個畫面'],['lag','畫面沒反應或很慢，多按了幾次'],['read','字太小或看不清楚'],['none','都沒有，很順']];
const ERRS = [['0','0 次'],['1','1 次'],['2','2 次'],['3','3 次以上']];
const HOW = [['no','輸入展品編號'],['qr','掃說明牌上的 QR Code'],['map','在平面圖上點選'],['list','從展覽的展品清單找'],['other','其他方式']];
const TAPS = [['2','1–2 下'],['4','3–4 下'],['5','5 下以上'],['na','不記得']];
const AGE = ['18–24','25–34','35–44','45–54','55–64','65 以上'];
const ROLE = ['展示／策展','教育推廣／導覽解說','服務台／觀眾服務','研究典藏','行政／其他','不是館內人員'];
const GUIDE = ['很熟，常協助觀眾使用','知道，但不常接觸','不太清楚'];
const VNAME = ['版本一','版本二'];
const KEY = 'nmth-ut-v2';
const NTASK = QS.reduce((n,q)=>n+q.tasks.length,0);

/* ===== 分組：網址 #ab #ba 兩版都測（順序不同）；#a #b 只測一版；沒帶就隨機 ab／ba ===== */
const tag = (location.hash||'').slice(1).toLowerCase();
let S = load() || fresh();
function fresh(){
  const order = tag==='ab'?['A','B']:tag==='ba'?['B','A']:tag==='a'?['A']:tag==='b'?['B']:(Math.random()<.5?['A','B']:['B','A']);
  return {sid:Math.random().toString(36).slice(2,8).toUpperCase(), order, step:0, profile:{}, tasks:{}, qs:{}, umux:{}, compare:{}, startedAt:new Date().toISOString(), submitted:false};
}
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&s.order&&(!['ab','ba','a','b'].includes(tag)||s.order.join('').toLowerCase()===tag)) return s; }catch(e){} return null; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function steps(){
  const st=['intro','profile','howto'];
  S.order.forEach((v,vi)=>{ st.push('ver:'+vi); QS.forEach((q,qi)=>st.push('q:'+vi+':'+qi)); st.push('umux:'+vi); });
  if(S.order.length>1) st.push('compare');
  st.push('review','done');
  return st;
}
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qkey=(v,q)=>v+'_'+q.id;                 /* 情境：A_q1 */
const tk=(v,q,t)=>v+'_'+q.id+t.id;            /* 任務：A_q1a */
const label=(list,k)=>(list.find(x=>x[0]===k)||[])[1];
/* 原型網址加上情境入口：artifact 用 #…&go=，GitHub Pages 用 ?…&go= */
function protoUrl(v,go){ const u=PROTO[v]; if(!go) return u; return u+(/[?#]/.test(u)?'&':'#')+'go='+go; }
const mmss=s=>s==null?'':s<60?s+' 秒':Math.floor(s/60)+' 分 '+(s%60)+' 秒';

function choices(name,opts,val){
  return `<div class="choices" role="radiogroup">${opts.map(o=>{const [k,l]=Array.isArray(o)?o:[o,o];return `<button type="button" role="radio" aria-checked="${val===k}" data-set="${name}" data-val="${esc(k)}">${esc(l)}</button>`}).join('')}</div>`;
}
function multi(name,opts,val){
  val=val||[];
  return `<div class="choices" role="group">${opts.map(([k,l])=>`<button type="button" role="checkbox" aria-checked="${val.includes(k)}" data-tog="${name}" data-val="${k}">${esc(l)}</button>`).join('')}</div>`;
}
function scale(name,val,lo,hi,n){
  n=n||7;
  return `<div class="scale" role="radiogroup" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${Array.from({length:n},(_,i)=>i+1).map(x=>`<button type="button" role="radio" aria-label="${x} 分" aria-checked="${val===x}" data-set="${name}" data-val="${x}" data-num="1">${x}</button>`).join('')}</div><div class="scale-ends"><span>1 ${lo}</span><span>${hi} ${n}</span></div>`;
}
/* 寫入 S 的路徑：profile.age / task.A_q1a.status / q.A_q1.clean / umux.A.q1 / compare.pick */
function bucket(p){ return p[0]==='task'?(S.tasks[p[1]]=S.tasks[p[1]]||{}):p[0]==='q'?(S.qs[p[1]]=S.qs[p[1]]||{}):p[0]==='umux'?(S.umux[p[1]]=S.umux[p[1]]||{}):S[p[0]]; }
function setVal(path,v){ const p=path.split('.'); const o=bucket(p); o[p[p.length-1]]=v; save(); }
function toggle(path,v){ const p=path.split('.'); const o=bucket(p); let a=o[p[2]]||[];
  a = a.includes(v) ? a.filter(x=>x!==v) : v==='none' ? ['none'] : [...a.filter(x=>x!=='none'),v];
  o[p[2]]=a; save(); }

/* 說明牌示意：編號＋QR Code，掃了會直接開到那件展品 */
function labelCard(v,no,name){
  return `<div class="lbl"><div><div class="lbl-no">${no}</div><div class="lbl-n">${esc(name)}</div><div class="hint">萬相天后：臺灣媽祖信仰文化特展</div></div><div class="box" data-qr="${esc(protoUrl(v,'pt:'+no))}"></div></div>`;
}
/* 一個任務：先讀任務 → 按開始計時 → 在手機上做 → 按結果停止計時 → 填答案與卡關 */
function taskCard(vi,q,t,j,locked){
  const v=S.order[vi], k=tk(v,q,t), T=S.tasks[k]||{};
  const head=`<div class="tk-h"><span class="tk-n">任務 ${j+1}</span>${T.status?`<span class="hint">${esc(label(STATUS,T.status))}・用了 ${mmss(T.secs)}</span>`:''}</div>`;
  if(locked) return `<div class="card tk locked">${head}<p class="hint" style="margin:0">做完上一個任務後才會出現。</p></div>`;
  let body=`<p class="tk-do">${esc(t.do)}</p>`;
  if(!T.t0) body+=`<div class="tk-go"><button class="btn" type="button" data-act="start" data-k="${k}">開始</button><span class="hint">讀完任務再按開始，接著在手機上操作。</span></div>`;
  else if(!T.status) body+=`<div class="tk-run"><div class="timer" id="tm-${k}" data-t0="${T.t0}">計時中</div><div class="hint" style="margin-bottom:10px">做完或決定放棄，馬上回來按一個：</div>
    <div class="choices">${STATUS.map(([s,l])=>`<button type="button" data-act="stop" data-k="${k}" data-val="${s}">${esc(l)}</button>`).join('')}</div></div>`;
  else body+=`<div class="stack" style="gap:16px">
    <div><div class="q">結果</div>${choices('task.'+k+'.status',STATUS,T.status)}<button type="button" class="linkbtn" data-act="redo" data-k="${k}">重新計時</button></div>
    ${T.status==='gaveup'?'':`<div><label class="q" for="ans-${k}">${esc(t.ask)}</label><input type="text" id="ans-${k}" data-in="task.${k}.answer" value="${esc(T.answer)}" placeholder="${esc(t.ph)}" autocomplete="off"></div>`}
    ${t.how?`<div><div class="q">你用了哪一種方式？</div>${choices('task.'+k+'.how',HOW,T.how)}
      ${T.how==='other'?`<label class="hint" for="how-${k}" style="display:block;margin:12px 0 6px">是什麼方式？</label><input type="text" id="how-${k}" data-in="task.${k}.howtxt" value="${esc(T.howtxt)}" placeholder="例如：從首頁的熱門展品找到" autocomplete="off">`:''}</div>`:''}
    ${t.taps?`<div><div class="q">從開始到看到位置，你大約點了幾下？</div>${choices('task.'+k+'.taps',TAPS,T.taps)}</div>`:''}
    <div><div class="q">過程中有遇到下面這些情況嗎？<span class="hint">（可複選）</span></div>${multi('task.'+k+'.fr',FRICTION,T.fr)}
      <label class="hint" for="frn-${k}" style="display:block;margin:12px 0 6px">想補充發生了什麼？<span>（選填）</span></label><textarea id="frn-${k}" data-in="task.${k}.frnote" style="min-height:64px" placeholder="例如：我以為○○可以按，按了沒反應">${esc(T.frnote)}</textarea></div>
    <div><div class="q">點錯、或退回上一頁大約幾次？</div>${choices('task.'+k+'.errs',ERRS,T.errs)}</div></div>`;
  return `<div class="card tk">${head}${body}</div>`;
}

  const st=steps(); const cur=st[S.step]; const [kind,a,b]=cur.split(':');
  $('#track').innerHTML=st.map((_,i)=>`<i class="${i<S.step?'on':i===S.step?'cur':''}"></i>`).join('');
  $('#stepno').textContent=`${S.step+1} / ${st.length}`;
  const app=$('#app'); let h='';
  if(kind==='intro'){
    h=`<div class="stack view"><div><div class="eyebrow">國立臺灣歷史博物館・Web 導覽系統原型</div><h1>幫我們試試看，新的 Web 導覽系統好不好用</h1>
    <p class="lead">我們做了${S.order.length>1?'兩個版本':'一個版本'}的 Web 導覽系統，想知道參觀的人用起來順不順。接下來有 ${QS.length} 個參觀情境，每個情境有幾個小任務，照著做，做完告訴我們感覺。</p></div>
    <div class="facts"><div><b>${S.order.length*NTASK}</b><span>個小任務</span></div><div><b>約 ${S.order.length>1?40:20} 分</b><span>全部做完</span></div><div><b>輕鬆就好</b><span>照平常習慣用，沒有標準答案</span></div></div>
    <div class="card"><ol class="rules"><li>沒有人在旁邊，遇到卡住的地方<strong>不用問人</strong>，照你自己的直覺做就好。卡住正是我們想知道的。</li><li>每個任務都會計時，只是記錄，不用趕。找不到就按「放棄」，不用硬猜。</li><li>原型裡的活動時間、展品內容是示意資料，聲音不一定會真的播放。</li><li>中途關掉也沒關係，用同一個瀏覽器再打開會接著做。</li></ol></div></div>`;
  }
  if(kind==='profile'){
    const P=S.profile;
    h=`<div class="stack view"><div><div class="eyebrow">開始前</div><h2>先認識你一下</h2><p class="lead">只用來分析，不會公開。</p></div>
    <div><label class="q" for="nick">怎麼稱呼你？<span class="hint">（選填，代號也可以）</span></label><input type="text" id="nick" data-in="profile.nick" value="${esc(P.nick)}" autocomplete="off"></div>
    <div><div class="q">年齡</div>${choices('profile.age',AGE,P.age)}</div>
    <div><div class="q">你在館內主要負責哪一塊？</div>${choices('profile.role',ROLE,P.role)}</div>
    <div><div class="q">你對館內現有的導覽服務熟悉嗎？</div>${choices('profile.guide',GUIDE,P.guide)}</div>
    </div>`;
  }
  if(kind==='howto'){
    h=`<div class="stack view"><div><div class="eyebrow">怎麼進行</div><h2>電腦看題目，手機操作導覽</h2></div>
    <div class="card stack"><p style="margin:0">請準備<strong>一台電腦和一支手機</strong>：這個表單開在電腦上，Web 導覽系統開在手機上。</p>
    <div class="demo"><div><b>① 讀情境</b>掃 QR Code，在手機打開導覽</div><div><b>② 按開始</b>在手機上做任務</div><div><b>③ 按結果</b>回到電腦填答</div></div>

    <div class="open narrow-only"><a class="btn" href="${esc(url)}" target="_blank" rel="noopener" data-open="1">打開導覽 ↗</a> <span class="meta">畫面停在「${esc(q.where)}」</span></div></div>

      <div><label class="q" for="qn">還有哪裡讓你猶豫，或覺得很順？<span class="hint">（選填）</span></label><textarea id="qn" data-in="q.${qkey(v,q)}.note" placeholder="例如：我一開始以為要按○○，結果…">${esc(Q.note)}</textarea></div></div>`:''}</div>`;

    <div><div class="q">這個版本很容易使用</div>${scale('umux.'+v+'.q2',U.q2,'非常不同意','非常同意')}</div>

    ${S.order.length>1?card('兩個版本比一比',at('compare'),row('偏好',{v1:'版本一',v2:'版本二',same:'差不多'}[S.compare.pick])+row('原因',S.compare.why)):''}</div>`;

  }

  tick();

/* 計時中的任務：每秒更新顯示 */
function tick(){ document.querySelectorAll('.timer[data-t0]').forEach(el=>{ const s=Math.round((Date.now()-+el.dataset.t0)/1000); el.textContent='計時中 '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }); }
setInterval(tick,1000);

function missing(kind,a,b){
  if(kind==='profile') return S.profile.age?'':'請選年齡';
  if(kind==='q'){ const v=S.order[+a], q=QS[+b];
    for(const [j,t] of q.tasks.entries()){ const T=S.tasks[tk(v,q,t)]||{}, n='任務 '+(j+1);
      if(!T.status) return n+'還沒做完';
      if(t.how&&!T.how) return n+'：請選用了哪種方式';
      if(t.how&&T.how==='other'&&!(T.howtxt||'').trim()) return n+'：請寫下是什麼方式';
      if(t.taps&&!T.taps) return n+'：請選大約點了幾下';
      if(!(T.fr||[]).length) return n+'：請勾有沒有遇到狀況';
      if(T.errs==null) return n+'：請選點錯幾次'; }
    const Q=S.qs[qkey(v,q)]||{};
    if(q.pref&&!Q.pref) return '請選最想用的方式';
    return Q.clean&&Q.text?'':'請給簡潔度和文字大小分數'; }
  if(kind==='umux'){ const U=S.umux[S.order[+a]]||{}; return U.q1&&U.q2?'':'請回答兩題分數'; }
  if(kind==='compare') return S.compare.pick?'':'請選一個';
  return '';
}
function bar(kind,a,b){
  const st=steps(); const m=missing(kind,a,b);
  $('#bar').hidden = kind==='done';
  $('#back').style.visibility = S.step===0?'hidden':'visible';
  $('#need').textContent=m;
  $('#next').disabled=!!m;
  $('#next').textContent = kind==='intro'?'開始':st[S.step+1]==='done'?'送出':S.fromReview?'回到檢視頁':'下一步';
}
function curKind(){ return steps()[S.step].split(':'); }

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-goto]');
  if(g){ S.step=+g.dataset.goto; S.fromReview = steps()[S.step]!=='review'; save(); render(true); return; }
  const act=e.target.closest('[data-act]');
  if(act){ const k=act.dataset.k, T=S.tasks[k]=S.tasks[k]||{};
    if(act.dataset.act==='start'){ T.t0=Date.now(); }
    if(act.dataset.act==='stop'){ T.secs=Math.round((Date.now()-T.t0)/1000); T.status=act.dataset.val; }
    if(act.dataset.act==='redo'){ T.t0=null; T.status=null; T.secs=null; T.redo=(T.redo||0)+1; }
    save(); render(); return; }
  const c=e.target.closest('[data-set]');
  if(c){ setVal(c.dataset.set, c.dataset.num?+c.dataset.val:c.dataset.val); render(); return; }
  const m=e.target.closest('[data-tog]');
  if(m){ toggle(m.dataset.tog, m.dataset.val); render(); return; }
  if(e.target.closest('[data-open]')){ const [k,a,b]=curKind(); if(k==='q'){ const key=qkey(S.order[+a],QS[+b]); const Q=S.qs[key]=S.qs[key]||{}; Q.opens=(Q.opens||0)+1; save(); } }
});
document.addEventListener('input',e=>{ const p=e.target.dataset.in; if(p){ setVal(p,e.target.value); const [k,a,b]=curKind(); bar(k,a,b);} });
$('#next').addEventListener('click',()=>{
  const st=steps();
  if(S.fromReview){ S.fromReview=false; S.step=st.indexOf('review'); } else S.step=Math.min(S.step+1,st.length-1);
  save(); render(true);
});
$('#back').addEventListener('click',()=>{ S.step=Math.max(0,S.step-1); save(); render(true); });

/* ===== 送出：能寫進共享資料就寫；不能（例如沒登入）就給一段文字讓受測者傳回 ===== */
function payload(){
  const tasks={}; Object.entries(S.tasks).forEach(([k,x])=>{ const {t0,...rest}=x; tasks[k]=rest; });
  return {v:2, sid:S.sid, order:S.order.join(''), profile:S.profile, tasks, qs:S.qs, umux:S.umux, compare:S.compare, startedAt:S.startedAt, finishedAt:new Date().toISOString(), ua:navigator.userAgent.slice(0,120)};
}
/* 把結果拆成 Google 表單的一題一欄；原本整包 JSON 那欄保留當備份 */
function gfInputs(data){
  const p=data.profile||{}, r={sid:data.sid, order:data.order.split('').join(' → '), nick:p.nick, age:p.age, role:p.role, guide:p.guide, started:data.startedAt, finished:data.finishedAt};
  Object.entries(data.tasks).forEach(([k,x])=>{ r[k+'_status']=label(STATUS,x.status); r[k+'_secs']=x.secs; r[k+'_answer']=x.status==='gaveup'?'':x.answer;
    r[k+'_how']=x.how==='other'&&x.howtxt?'其他方式：'+x.howtxt:label(HOW,x.how); r[k+'_taps']=label(TAPS,x.taps); r[k+'_fr']=(x.fr||[]).map(f=>label(FRICTION,f)).join('、'); r[k+'_frnote']=x.frnote; r[k+'_errs']=label(ERRS,x.errs); });
  Object.entries(data.qs||{}).forEach(([k,x])=>{ r[k+'_clean']=x.clean; r[k+'_text']=x.text; r[k+'_note']=x.note; r[k+'_pref']=x.pref==='any'?'都可以':label(HOW,x.pref); });
  Object.entries(data.umux||{}).forEach(([v,u])=>{ r[v+'_umux_q1']=u.q1; r[v+'_umux_q2']=u.q2; r[v+'_umux_note']=u.note; });
  const c=data.compare||{}; if(c.pick) r.pick=c.pick==='same'?'差不多':(S.order[c.pick==='v1'?0:1]+' 版'); r.why=c.why;
  return Object.entries(r).filter(([k,v])=>GFORM.fields&&GFORM.fields[k]&&v!=null&&v!=='').map(([k,v])=>`<input type="hidden" name="entry.${GFORM.fields[k]}" value="${esc(v)}">`).join('');
}
async function submit(){
  const box=$('#sendbox'); const data=payload(); let ok=false;
  try{
    const db=await claude.use('db'), user=await claude.use('user');
    const id=user&&await user.id();
    if(db&&id){ await db.doc('responses/'+id).set(data); ok=true; }
  }catch(e){ ok=false; }
  S.submitted=ok; save();
  if(ok){ box.innerHTML=`<div class="notice">已經送出，可以關掉這個頁面了。</div><p class="hint" style="margin:12px 0 0">受測編號 ${S.sid}</p>`; return; }
  const text='臺史博導覽試用結果\n'+JSON.stringify(data);
  const gf=!!(GFORM.url&&GFORM.entry);
  const copyBlock=`<button class="btn${gf?' ghost':''}" type="button" id="cp">複製結果</button> <span class="hint" id="cpm"></span><pre class="copy" id="raw" style="margin-top:12px">${esc(text)}</pre>`;
  box.innerHTML = gf
    ? `<p style="margin:0 0 12px"><strong>還差最後一步：</strong>按下面的按鈕送出。會打開一個新分頁，看到「已收到您回覆的表單」就完成了。</p>
      <form method="post" action="${esc(GFORM.url)}" target="_blank"><input type="hidden" name="entry.${esc(GFORM.entry)}" value="${esc(JSON.stringify(data))}">${gfInputs(data)}<button class="btn" type="submit">送出結果 ↗</button></form>
      <details style="margin-top:16px"><summary class="hint" style="cursor:pointer">按了沒反應？改用複製的方式</summary><p class="hint">複製下面的結果，貼給${esc(CONTACT)}（LINE 或 Email 都可以）。</p>${copyBlock}</details>`
    : `<p style="margin:0 0 12px"><strong>還差最後一步：</strong>請按下面的按鈕複製結果，貼給${esc(CONTACT)}（LINE 或 Email 都可以）。</p>${copyBlock}`;
  $('#cp').onclick=async()=>{ try{ await navigator.clipboard.writeText(text); $('#cpm').textContent='已複製'; }catch(e){ const r=document.createRange(); r.selectNodeContents($('#raw')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); $('#cpm').textContent='已選取，請按複製'; } };
}

/* ===== 研究者結果頁：網址加 #results，只有擁有者看得到全部回覆 ===== */
async function results(){
  $('#bar').hidden=true; $('#track').hidden=true; $('#stepno').textContent='結果';
  const app=$('#app'); app.innerHTML='<p>讀取中…</p>';
  let rows=[], db;
  try{
    const user=await claude.use('user'); const owner=user&&await user.isOwner();
    db=await claude.use('db');
    if(!db||!owner){ app.innerHTML='<div class="card">結果只有測試負責人看得到。</div>'; return; }
    const [a,b]=await Promise.all([db.collection('responses').get(), db.collection('imported').get()]);
    const seen=new Set(); [...a.docs,...b.docs].map(d=>d.data()).forEach(r=>{ if(r&&r.sid&&r.v===2&&!seen.has(r.sid)){ seen.add(r.sid); rows.push(r); } });   /* 只算新版題目（v2） */
  }catch(e){ app.innerHTML='<div class="card">讀不到結果，稍後再試。</div>'; return; }
  /* 匯入：Google 試算表那一欄、或受測者傳回的「複製結果」，整段貼上；每筆用 sid 去重 */
  const importCard=`<div class="card stack"><h3 style="margin:0;font-size:16px">匯入回覆</h3><p class="hint" style="margin:0">打開 Google 表單的回覆試算表，選取「試用結果」整欄複製貼上；受測者用 LINE／Email 傳回的「複製結果」也貼這裡。重複的會自動略過。</p>
    <textarea id="imp" placeholder="貼上這裡"></textarea><div><button class="btn" type="button" id="impbtn">匯入</button> <span class="hint" id="impm"></span></div></div>`;
  const bindImport=()=>{ $('#impbtn').onclick=async()=>{
    const src=$('#imp').value; const found=[];
    /* 一行一筆；從試算表複製的儲存格會被包成 "{""sid"":…}"，要先還原雙引號 */
    src.split('\n').forEach(line=>{ const s=line.indexOf('{'), e=line.lastIndexOf('}'); if(s<0||e<s) return;
      const raw=line.slice(s,e+1), quoted=line.trim().startsWith('"');
      for(const t of quoted?[raw.replace(/""/g,'"'),raw]:[raw]){ try{ const r=JSON.parse(t); if(r&&r.sid&&r.tasks){ found.push(r); break; } }catch(_){} } });
    const have=new Set(rows.map(r=>r.sid)); const add=found.filter(r=>!have.has(r.sid)&&(have.add(r.sid),true));
    if(!found.length){ $('#impm').textContent='沒有讀到結果，確認貼的是整段文字'; return; }
    try{ for(const r of add) await db.doc('imported/'+r.sid).set(r); $('#impm').textContent=`讀到 ${found.length} 筆，新增 ${add.length} 筆`; if(add.length) setTimeout(results,600); }
    catch(e){ $('#impm').textContent='存不進去，稍後再試'; }
  }; };
  if(!rows.length){ app.innerHTML=`<div class="stack"><h2>還沒有人送出</h2><p class="lead">受測者送出後，回覆會進 Google 表單的試算表，複製過來貼在下面就會出現在這裡。</p>${importCard}</div>`; bindImport(); return; }
  const avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length):null;
  const med=a=>{ if(!a.length) return null; const s=[...a].sort((x,y)=>x-y); const m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
  const f1=v=>v==null?'—':v.toFixed(1);
  const pick=k=>rows.filter(r=>r.compare&&r.compare.pick&&({v1:r.order[0],v2:r.order[1],same:'same'}[r.compare.pick])===k).length;
  const umux=v=>{ const us=rows.map(r=>(r.umux||{})[v]).filter(u=>u&&u.q1&&u.q2); return {n:us.length, score:avg(us.map(u=>((u.q1-1)+(u.q2-1))/12*100))}; };
  /* 一個任務一列：完成（自選「我完成了」）／秒數中位數／目標秒數內／平均點錯／最常見的卡關 */
  const tstat=(v,q,t,first)=>{ const rs=rows.filter(r=>!first||r.order[0]===v).map(r=>(r.tasks||{})[tk(v,q,t)]).filter(x=>x&&x.status);
    const secs=rs.map(x=>x.secs).filter(x=>x!=null), fr={};
    rs.forEach(x=>(x.fr||[]).filter(f=>f!=='none').forEach(f=>fr[f]=(fr[f]||0)+1));
    return {n:rs.length, done:rs.filter(x=>x.status==='done').length, secs:med(secs), fast:t.goal?secs.filter(s=>s<=t.goal).length:null,
      errs:avg(rs.map(x=>x.errs).filter(x=>x!=null).map(Number)), fr:Object.entries(fr).sort((a,b)=>b[1]-a[1]).map(([f,c])=>label(FRICTION,f)+' '+c).join('、')}; };
  const qstat=(v,q,first)=>{ const xs=rows.filter(r=>!first||r.order[0]===v).map(r=>(r.qs||{})[qkey(v,q)]).filter(Boolean); return {clean:avg(xs.map(x=>x.clean).filter(Boolean)), text:avg(xs.map(x=>x.text).filter(Boolean))}; };
  const cell=(x,t)=>`<td><span class="meter"><i style="width:${x.n?x.done/x.n*100:0}%"></i></span>${x.done}/${x.n}</td><td>${x.secs??'—'}${t.goal&&x.n?`<br><span class="hint">≤${t.goal} 秒 ${x.fast}/${x.n}</span>`:''}</td><td>${f1(x.errs)}</td><td class="hint">${esc(x.fr)||'—'}</td>`;
  const table=first=>`<div class="tbl"><table><thead><tr><th>任務</th><th>版本</th><th>完成</th><th>秒數</th><th>點錯</th><th>卡關</th></tr></thead><tbody>${
    QS.map((q,qi)=>{ const qa=qstat('A',q,first), qb=qstat('B',q,first);
      return `<tr><td colspan="6" style="background:var(--paper)"><strong>情境 ${qi+1}・${esc(q.title)}</strong> <span class="hint">簡潔度 A ${f1(qa.clean)}／B ${f1(qb.clean)}・文字大小 A ${f1(qa.text)}／B ${f1(qb.text)}（1–5）</span></td></tr>`+
      q.tasks.map((t,j)=>['A','B'].map((v,vi)=>`<tr>${vi===0?`<td rowspan="2">${qi+1}-${j+1} ${esc(t.do)}<br><span class="hint">${esc(t.expect)}</span></td>`:''}<td>${v}</td>${cell(tstat(v,q,t,first),t)}</tr>`).join('')).join(''); }).join('')}</tbody></table></div>`;
  const uA=umux('A'), uB=umux('B');
  const notes=rows.flatMap(r=>[...Object.entries(r.qs||{}).filter(([,x])=>x.note).map(([k,x])=>({k,x,r})),...Object.entries(r.tasks||{}).filter(([,x])=>x.frnote).map(([k,x])=>({k,x:{note:x.frnote},r}))]);
  const hows=rows.flatMap(r=>Object.entries(r.tasks||{}).filter(([,x])=>x.how).map(([k,x])=>k[0]+' '+label(HOW,x.how)));
  const howCount=['A','B'].map(v=>v+' 版：'+(HOW.map(([h,l])=>[l,hows.filter(s=>s===v+' '+l).length]).filter(x=>x[1]).map(x=>x[0]+' '+x[1]).join('、')||'—')).join('<br>');
  app.innerHTML=`<div class="stack"><div><div class="eyebrow">研究者檢視</div><h2>試用結果・${rows.length} 人</h2><p class="lead">完成＝受測者自選「我完成了」（請對照灰字的正確答案再判讀）；秒數＝按「開始」到按結果的中位數；點錯＝自填次數平均；卡關＝勾選次數。</p></div>
  <div class="facts"><div><b>${f1(uA.score)}</b><span>A 版 UMUX-Lite（${uA.n} 人）</span></div><div><b>${f1(uB.score)}</b><span>B 版 UMUX-Lite（${uB.n} 人）</span></div><div><b>${pick('A')} : ${pick('B')}</b><span>偏好 A : B（差不多 ${pick('same')}）</span></div></div>
  <div class="card"><h3 style="margin:0 0 8px;font-size:16px">情境 2：找展品導覽用的方式</h3><p style="margin:0;font-size:14px">${howCount}</p></div>
  <div class="card"><h3 style="margin:0 0 8px;font-size:16px">全部資料</h3>${table(false)}</div>
  <div class="card"><h3 style="margin:0 0 8px;font-size:16px">只看先測的那一版</h3><p class="hint" style="margin:0 0 8px">排除「第二次做」的熟悉效應，比較以這張為準。</p>${table(true)}</div>
  <div class="card"><h3 style="margin:0 0 8px;font-size:16px">回饋文字</h3>${notes.map(({k,x,r})=>`<div class="quote">${esc(x.note)}<br><small>${k.replace('_','・')}・${esc(r.profile?.nick||r.sid)}</small></div>`).join('')||'<p class="hint">還沒有</p>'}</div>
  <div><button class="btn ghost" id="csv" type="button">複製 CSV</button> <span class="hint" id="csvm"></span></div>${importCard}</div>`;
  bindImport();
  $('#csv').onclick=async()=>{
    const head=['sid','order','nick','age','role','guide','version','scenario','task','status','secs','answer','how','taps','friction','frnote','errs','clean','text','note'];
    const lines=[head.join(',')];
    rows.forEach(r=>{ const p=r.profile||{}; ['A','B'].forEach(v=>QS.forEach(q=>{ const Q=(r.qs||{})[qkey(v,q)]||{}; q.tasks.forEach(t=>{ const x=(r.tasks||{})[tk(v,q,t)]; if(!x) return;
      lines.push([r.sid,r.order,p.nick,p.age,p.role,p.guide,v,q.id,t.id,x.status,x.secs,x.answer,x.how==='other'&&x.howtxt?'other:'+x.howtxt:x.how,x.taps,(x.fr||[]).join('|'),x.frnote,x.errs,Q.clean,Q.text,Q.note].map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')); }); })); });
    try{ await navigator.clipboard.writeText(lines.join('\n')); $('#csvm').textContent='已複製，可貼進試算表'; }catch(e){ $('#csvm').textContent='瀏覽器不允許複製'; }
  };
}

if(tag==='results') results(); else render();
</script>
</body></html>
