.mpin.playing{display:flex;align-items:center;justify-content:center;gap:5px;padding:0 10px} .peq{display:inline-flex;gap:2px;align-items:flex-end;height:12px} .peq b{width:3px;height:6px;background:var(--ink);border-radius:1px} .peq.go b{animation:eq .9s ease-in-out infinite} .peq.go b:nth-child(2){animation-delay:.2s} .peq.go b:nth-child(3){animation-delay:.4s} .mpin.playing>i{background:var(--teal7);color:#fff}   /* 2026-11-11 留言：正在播的點位——金底放大＋跳動音波＋「播放中」 */

  p101:{"n":"斯土斯民：臺灣的故事","no":"101","fl":"2F","zone":"臺灣，交會之島","voice":false,"txt":"大家好，歡迎來到國立臺灣歷史博物館。請各位把博物館想像成一趟跨越不同時空的旅程，在漫長的歲月裡，有來自世界各地的人們造訪過臺灣，他們在這塊土地上交會、互動，有著豐富而多元的文化面貌與精采故事。\n眼前的臺灣人群像，就是由交會的人群所留下的歷史面貌，每張臉龐都是由各式各樣的形象組成，在參與今天行程的同時，我們不僅承繼過去的歷史養分，也正共同寫下未來的臺灣故事。旅程即將啟航，準備好了嗎？一起出發吧！","sign":true,"sv":"sign/2.mp4","sp":"sign/2.jpg","img":"sign/ph-2.jpg","d":89,"i18n":{"en":{"n":"Our Land, Our People: The Story of Taiwan","zone":"Taiwan, An Island on the Crossroads","txt":"Hello, Everybody. Welcome to the National Museum of Taiwan History. Imagine a museum as a place where you can journey through time and space. Over the centuries, people from all over the world have visited Taiwan. They met and interacted with others on this island, which boasts rich cultural diversity, and wonderful stories.\nLook closely at “Taiwanese Portrait” in front of you. Note that each photo is a collage consisting of individuals from history. During today’s visit, not only will we absorb important information from the past, but will also work together to write Taiwan’s future story. Our journey is about to commence. Are you ready? Let’s go!"}}},
  p102:{"n":"交會之島","no":"102","fl":"2F","zone":"臺灣，交會之島","voice":false,"txt":"眼前播放的動畫影像，帶我們探索臺灣的故事。臺灣位於海陸交會之處，因為這樣的地理位置，迎來了來自四面八方的人群。這些人群在不同時期陸陸續續進入臺灣，在這座島嶼落地成家，以各種不同的語言為土地命名，隨著地理環境、族群差異而形成不同的發展。臺灣的歷史是新舊移民之間從衝突到共存的過程，不僅造就臺灣的多元文化，也使臺灣的成分不斷被重新定義。生活在同一片土地上的我們，也對臺灣的未來有著各種不同的想像。","sign":true,"sv":"sign/3.mp4","sp":"sign/3.jpg","img":"sign/ph-3.jpg","d":101,"i18n":{"en":{"n":"Taiwan, An Island on the Crossroads","zone":"Taiwan, An Island on the Crossroads","txt":"The animation being played in front of you will be our guide as we explore Taiwan’s story. Taiwan stands at the joint of Asia and the Pacific, a geographical location that has drawn people from around the world. These peoples arrived and settled at different times in Taiwan’s history, christening the land with names in their own languages, and as a result of different geographical environments and backgrounds, they developed along different trajectories. The story of Taiwan is characterized by old and new immigrants initially experiencing conflicts and then learning to coexist. This process has contributed to Taiwan’s diverse cultures and caused it’s component parts to be continually redefined. Living on this land together, we all have different dreams for Taiwan’s future."}}},
  p201:{"n":"發光的少女","no":"201","fl":"2F","zone":"最初的抵岸","voice":false,"txt":"眼前這件作品，是藝術家受到原住民神話的啟發而創作。在許多阿美族部落中，都流傳著這樣的一個故事。據說，在很久很久以前，有個全身會發光的女孩叫迪雅瑪贊，她身上的光芒，深深吸引了海神之子的注意。於是，愛上少女的海神之子，以瀰天蓋地的海水淹沒了大地，將迪雅瑪贊帶走，有人說後來她和她的家人幻化為彩虹或雷聲、也有人說她的家人幻化為各部族的人。\n大家仔細看看這件藝術作品，在彷彿植物生長蔓延之處，隱藏著一個小女孩的形象，藝術家以白色半透明的裝置，散發出微微的光芒，暗示生命在宇宙混沌中孕育而生。透過這件藝術作品，大家可以了解到，歷史的傳承型態非常多元，除了文字以外，人們也會透過口耳相傳的方式留下集體記憶，包含歌謠、神話故事和民間傳說等。這些材料不僅是屬於臺灣歷史的一部分，同時也反映了各個族群不同的世界觀。","sign":true,"sv":"sign/5.mp4","sp":"sign/5.jpg","img":"sign/ph-5.jpg","d":115,"i18n":{"en":{"n":"Tiyamacan: The Girl Who Glowed","zone":"First Landings","txt":"The piece in front of you was inspired by an indigenous myth. A story has been passed down in many Amis tribes. It goes like this: Long, long ago, there was a girl by the name of Tiyamacan whose body glowed. Her radiance drew the attention of the son of the sea god and he fell in love with her, so he covered the land with water to carry Tiyamacan away. Some say that she and her family later transformed into the rainbow or thunder, while others say that her family became members of other tribes. Look closely. This piece resembles a plant, growing, spreading, with a young lady hidden inside. The artist employs a translucent white device to exude a faint light, suggesting that life is conceived and born in the chaos of the universe.\nFrom this piece of art, we can see that history is passed down in a variety of ways. In addition to the written words, oral tradition, songs, mythological stories, and folklore, are also used to disseminate collective memories. Together, not only do they represent part of the history of Taiwan, but also reflect the worldviews of different peoples."}}},
  p202:{"n":"史前人群的遷徙","no":"202","fl":"2F","zone":"最初的抵岸","voice":false,"txt":"大家有沒有想過，臺灣島上的人群是從什麼時候開始出現呢？目前，對於最古老臺灣人的來源有兩種說法，第一種是大約在2~3萬年前的冰河時期，海平面比今天低很多，臺灣海峽間形成一片廣闊而平緩的陸地，於是有獵人追逐獵物來到臺灣；其他考古學家提出不同的看法，他們認為最早的臺灣人可能是東南亞海域的漁夫，循著潮流或追逐魚群，北上而來。\n水聲)\n由於臺灣位於歐亞大陸板塊和菲律賓海板塊的交界處，在兩個板塊相互擠壓之下而形成。島內複雜多變的地形，再加上海島的開放性，使得臺灣從史前時代就不斷有人群移入，並在島內形成不同社群。眼前的臺東縣長濱鄉八仙洞遺址，就是島上最早的人類活動證據之一，當時的人們主要居住在海邊的洞穴或岩石遮蔽的地方。到了距今約6千多年前，又陸續有新的人群渡海遷入臺灣。一波接著一波的新移民一方面帶來新的文化，另一方面也將臺灣帶向了下一個文化階段。","sign":true,"sv":"sign/4.mp4","sp":"sign/4.jpg","img":"sign/ph-4.jpg","d":187,"i18n":{"en":{"n":"The Migration of Prehistoric Peoples","zone":"First Landings","txt":"Do you know when people first arrived on the island of Taiwan? There are currently two theories as to where the earliest people in Taiwan came from. The first one states that around the Ice Age, 20-30 thousand years ago, sea levels were much lower than they are today, so there was a wide swath of land with gentle terrain where the Taiwan Strait is today. Hunters crossed it and came to Taiwan in pursuit of prey. Other archaeologists offer an alternative explanation. They think that the earliest Taiwanese could have been fishermen from Southeast Asia who followed the currents or pursued schools of fish northward.\nSituated at the junction of the Eurasian Tectonic Plate and the Philippine Sea Plate, Taiwan was formed as the two plates pushed against each other. Due to the island’s complex topography and accessibility, Taiwan has seen the arrival of one group of people after another since before prehistoric times. These groups set up various communities on the island. The Baxian Caves site in Changbin Township shown here is one of the earliest signs of human activity on the island. Most of the inhabitants of the island at that time dwelt in caves or places sheltered by rock near the ocean. By about 6,000 years ago, more groups of people crossed the sea to Taiwan. Wave after wave of new immigrants brought new cultures with them and helped bring the existent cultures to their next phase."}}},
  p301:{"n":"冒充「臺灣人」行騙世界！","no":"301","fl":"2F","zone":"倚海而生的島與人","voice":false,"txt":"這裡是18世紀英國的一場社交聚會，噓…大家跟著我安靜地走進來，現在有一位名叫喬治·撒瑪納札的人，正在介紹自己的故鄉福爾摩沙，我們來聽聽他怎麼說……\n撒瑪納扎：各位先生、各位女士，你們可曾聽過遙遠的東方有一座美麗的島嶼，叫做「福爾摩沙」？信不信由你，我可是土生土長的福爾摩沙人喔！你們歐洲人信上帝，我們福爾摩沙人崇拜日月星辰，我們還有自己的語言和文字。大家想不想學學看美妙的福爾摩沙語啊～\n喬治·撒瑪納札，是一位法國人，他在1703年來到英國倫敦後，就謊稱自己是福爾摩沙人，並出版《福爾摩沙島歷史與地理概述》這本書。剛剛提到的福爾摩沙語，雖然是虛構的語文，但整部書並非完全憑空捏造，而是有部分參考的依據。例如，福爾摩沙語，其實參雜了拉丁文和日本語，另外，書中所附的福爾摩沙地圖，也是參考當時歐洲人所繪製的臺灣地圖。所以不難發現，喬治．撒瑪納札應該是從歐洲傳教士、商人口中，得知有關臺灣的資訊，並在書中混雜的引用了這些資料，才使書的內容虛實參雜。而此書對於臺灣的描述，也反映了當時歐洲人對這座遙遠的美麗之島曾有的想像。","img":"work-hero.jpg","d":111,"i18n":{"en":{"n":"Counterfeit ‘Taiwanese’ Fools the World","zone":"An Island and People Living by the Sea","txt":"This is a party in 18th century England. Shhh … Come quietly with us as we go inside. A man by the name of George Psalmanazar is introducing Formosa, the place he comes from. Let’s see what he says.\nPsalmanazar: Ladies and gentlemen, have you ever heard of Formosa, a beautiful island far off in the Orient? Believe it or not, I was born and raised in Formosa. You Europeans believe in God. We Formosans worship the sun, moon, and stars. We have our own written and spoken language. Would you like to learn some of the beautiful Formosan language?\nAfter arriving in London, England in 1703, George Psalmanazar, a Frenchman, pretended to be from Formosa, even publishing a book entitled “An Historical and Geographical Description of Formosa”. Although “Formosan”, the language just mentioned, does not exist, the book itself was not a complete fabrication; rather, parts of it were based on facts. For example, the language of Formosan includes some Latin and Japanese words. In addition, the map of Formosa included in the book was based on a map of Taiwan drawn by Europeans at the time. Evidently, George Psalmanazar obtained information about Taiwan from European merchants and missionaries and included what he learned hodge-podge in his book, making it a mixture of truth and fiction. The way the book depicts Taiwan also gives us a glimpse into how Europeans at the time imagined this beautiful, far-off island."}}},
  p302:{"n":"明代東西洋航海圖","no":"302","fl":"2F","zone":"倚海而生的島與人","voice":false,"txt":"眼前這幅地圖17世紀就收藏在英國牛津大學圖書館，兩位研究人員正在討論它，我們來聽聽他們的對話......\n西方學者：我注意到這張古地圖的範圍涵蓋了一部分的中國領土，也包含日本、朝鮮半島、東南亞，還有印度，整張地圖的視覺焦點並非以中國為中心，而是有很鮮明的海洋意象，似乎暗示著這張地圖應該有很特別的用途。\n東方學者：嗯，我也這麼認為。這是一張提供航海資訊、指引方向的航海圖。圖上標示出中國帆船經常使用的航海路線，這些航線是從中國沿海出發，往北航行到日本，南下去到整個東南亞地區，顯示出在歐洲人尚未抵達以前，亞洲海域之間彼此就有互動與交易。\n西方學者：我注意到這張地圖好像也把臺灣描繪進去了。\n東方學者：沒錯，圖上有澎湖，再往東看，還有一座標上北港和加里林地名的島嶼，就是臺灣！從地圖上可以看出，臺灣和澎湖位於北上日本、南下東南亞的重要航線上，所以後來你們歐洲人會選擇在臺灣落腳，也是因為臺灣是東亞航線的樞紐。","sign":true,"sv":"sign/7.mp4","sp":"sign/7.jpg","img":"sign/ph-7.jpg","d":145,"i18n":{"en":{"n":"The Selden Map of China","zone":"An Island and People Living by the Sea","txt":"This map was added to Oxford College’s library collection in the 17th century. Two researchers are discussing it. Let’s listen in on their conversation…\nWestern scholar: I’ve noticed that this old map includes part of China’s territory as well as Japan, the Korean Peninsula, Southeast Asia, and India. Also, the map isn’t orientated around China; rather, it has clear oceanic imagery, suggesting that it has some special purpose.\nAsian scholar: Yes, I agree. This is a nautical chart with navigational information and sea routes often used by Chinese sailing vessels. They start out from along China’s coast and go northward to Japan and southward to Southeast Asia. This shows that peoples in Asia interacted and traded amongst themselves before Europeans ever appeared on the scene.\nWestern scholar: I’ve noticed that there also seems to be a sketch of Taiwan on this map. Asian scholar: You’re right. Penghu (also called the Pescadores) is marked on the map and if you go East, you’ll also see an island marked with the place names Beigang and Jialilin … That’s Taiwan. You can see from the map that Taiwan and Penghu are situated on an important sea route between Japan to the north, and Southeast Asian to the south. That’s why you Europeans later decided to stay in Taiwan: It is an important hub in East Asia."}}},
  p303:{"n":"艾爾摩沙島荷蘭港口圖","no":"303","fl":"2F","zone":"倚海而生的島與人","voice":false,"txt":"荷蘭人於1624年來到臺灣，在臺南安平建立貿易據點，兩年後，西班牙人的船隻也進入雞籠港發展貿易和傳教事業，並試圖將荷蘭勢力逐出臺灣海域。為了戰事所需，西班牙人根據一位通譯提供的情報，秘密繪製出「艾爾摩沙島荷蘭港口圖」。這張地圖反映了荷蘭人統治臺灣後，不同族群在這一帶活動的縮影。我們來聽聽這個來自澳門的通譯怎麼介紹這張地圖……\n澳門人通譯：我曾經擔任過荷蘭東印度公司的翻譯，所以對大員的地理環境非常熟悉。請大家看看眼前這張地圖，右下角的沙洲就是大員，荷蘭人在這裡蓋了熱蘭遮城作為對臺灣經營的統治中心。從堡壘往左邊看，有船隻停泊的地方叫做北線尾，有荷蘭人的商館，漢人、日本人會來此處貿易。當時大員港沿岸也住了不少日本人和原住民，有蕭壠社、目加溜灣社和麻豆社。地圖上方的堡壘和牧牛區，是荷蘭人在赤崁建立的新市鎮，由於北線尾不適合居住，所以荷蘭人打算將商館和住宅區搬遷過來。從牧牛區往右看，還有漢人漁民和海盜住的村落。早在荷蘭人到達臺灣以前，就有許多漢人、日本人在此與原住民交易，當時臺灣的鹿皮貿易幾乎都被日本人獨佔了。","sign":true,"sv":"sign/6.mp4","sp":"sign/6.jpg","img":"sign/ph-6.jpg","d":126,"i18n":{"en":{"n":"Spanish Map of Hermosa Showing the Dutch Port","zone":"An Island and People Living by the Sea","txt":"The Dutch arrived in Taiwan in 1624 and established a stronghold in Anping, Tainan to carry out trading. Two years later, Spanish ships sailed into Keelung Harbor to trade and do missionary work. They also attempted to expel the Dutch from Taiwan and the surrounding seas. For the purpose of war, the Spanish secretly drew up a Map of Hermosa Showing the Dutch Port based on information provided by an interpreter. The map shows where different people groups were active while the Dutch controlled the area. An interpreter from Macao is talking about the map. Let’s listen in.\nInterpreter from Macao: I once served as an interpreter for the Dutch East Indian Company, so I’m very familiar with the geographical environment of Teijouan. Please look at the map in front of you. This sand bar on the bottom right is Teijouan. The Dutch built Fort Zeelandia here to serve as their center for governing Taiwan. To the left of the fort, you can see Baxemboy where they moored their ships, and the Dutch trade building, where Chinese and Japanese came to trade. Along the coast at Teijouan Port lived many Japanese as well as indigenous people, including the Soulang, Backloun, and Matta. The fort and the cattle grazing area at the top of the map represent the new town built by the Dutch at Chikan. Baxemboy was not a suitable place to live, so the Dutch were planning to relocate the trade building and the residential area to this place. There is also a village to the right side of the cattle grazing area where Chinese fishermen and pirates lived. Long before the Dutch arrived in Taiwan, many Chinese and Japanese were already here engaging in trade with the indigenous peoples. The Japanese had practically cornered Taiwan’s deerskin market."}}},
  p304:{"n":"地方會議與大肚王","no":"304","fl":"2F","zone":"倚海而生的島與人","voice":false,"txt":"部落族人A：哼，那些荷蘭人實在太可惡了，我們大肚王不應該和這樣的人簽訂和約，還參加他們主持的地方會議。雖然東印度公司看起來很禮遇每一個部落領主，但對授予權杖這件事，我只感到羞辱和不平。\n部落族人B：唉，我知道你很難忘記荷蘭人燒毀部落的事，但現在我們這塊土地上有荷蘭人、漢人和日本人，如果不跟他們來往，他們就會來攻打我們。為了在夾縫中求生存，大肚王才選擇這樣的權宜之計，我相信他不是完全順從荷蘭人。\n荷蘭人進入臺灣之前，臺灣島上的原住民部落，大致維持著自主性。荷蘭人來臺後，不斷透過武力征服各部落，逼迫簽訂條約，派駐政務官、牧師等，監管部落，並要求部落領袖出席地方會議。目的是透過選出長老、授予權杖等儀式，展示荷蘭人至高無上的統治權。但是，此時的原住民部落也並非完全接受荷蘭人的安排。以臺灣中部巴布拉族的大肚王為例，雖然他被納入荷蘭人的管轄範圍，但是大肚王不肯接受基督教，只讓基督徒通過領土而不准他們定居，直到1662年荷蘭人離開臺灣為止，大肚王國都維持半獨立狀態。","img":"work-2.jpg","d":104,"i18n":{"en":{"n":"Landdag and the King of Middag","zone":"An Island and People Living by the Sea","txt":"Tribe member A: Those Dutch people are scoundrels. The King of Middag shouldn’t sign agreements with people like them. He even took part in their landdag, or meetings. The Dutch East Indian Company might seem to treat the head of each tribe with decorum, but when the Dutch bestow them with scepters, it just feels shameful and wrong.\nTribe member B: Yes, I know it’s hard for you to forget that the Dutch burned down the village, but there are now Dutch, Chinese, and Japanese on this land of ours. If we do not have dealings with them, they will attack us. The King of Middag looks upon this decision as an expediency, a matter of survival. I’m confident that he’s not submitting completely to the Dutch.\nBefore the arrival of the Dutch, the indigenous peoples of the island of Taiwan more or less maintained their autonomy. Since their arrival, they have continued to use arms to conquer the various tribes and force them to sign treaties. Then, they station political affairs officers and missionaries to monitor and control the tribes and require that tribal leaders attend landdags. The objective is to employ such ceremonies as selecting elders and bestowing scepters to demonstrate their supreme right to rule. However, the indigenous peoples aren’t completely toeing the line. Take the King of Middag of the Papora people in central Taiwan as an example. Although his people have been put under the jurisdiction of the Dutch, he refuses to accept Christianity. He allows Christians to pass through his territory, but they are not permitted to reside there. When the Dutch left Taiwan in 1662, his kingdom continued to enjoy a state of semi-independence."}}},
  p305:{"n":"清朝的無戶籍者","no":"305","fl":"2F","zone":"倚海而生的島與人","voice":false,"txt":"當代臺灣有許多跨越國界的移民，他們努力在這座小島上安身立命，卻因各種複雜的因素，陷入國界關卡，失去身分，成為黑戶。像這樣的人，也曾出現在清朝時期的臺灣……\n清朝官兵：欸，你你你，從哪兒來的啊？入臺許可證拿出來我瞧瞧！羅漢腳：啊..這這….（支支吾吾）大人，小民原是廣東潮州人，在家鄉上有老，下有小，沒有田可耕種、也找不到工作，才費盡千辛萬苦到臺灣討生活，求您行行好，給個方便吧！清朝官兵：哼，上頭都說了，到臺灣來的人，我都得仔細查驗，不然你們這些羅漢腳在臺灣惹事生非，我也跟著倒霉！\n清朝統治臺灣後，對於移民入臺採取嚴格的限制措施，需由移民向戶籍地的官府提出申請，還要鄰居親戚作保，才能取得許可證來臺。不少移民在原鄉本來也沒有戶籍，因為謀生不易，才想來臺灣求發展。但是入籍臺灣的過程頗費周章，所以真正依照官方程序來臺者不多，反而偷渡的風氣非常盛行。這些沒有戶籍的移民除了成為臺灣重要的勞動力來源外，在臺灣班兵人數不足時還能充當補充兵員。但部份男子隻身來臺，在臺灣沒有家室，因為居無定所四處遊蕩，被官府視為羅漢腳，也造成當時臺灣的社會問題。","sign":true,"sv":"sign/9.mp4","sp":"sign/9.jpg","img":"sign/ph-9.jpg","d":137,"i18n":{"en":{"n":"Unregistered Citizens of the Qing Dynasty","zone":"An Island and People Living by the Sea","txt":"Today, Taiwan has a number of cross-border immigrants. They strive to settle down in Taiwan and work in peace, but due to a number of complicated factors, they found themselves stuck at a border check point of sorts. They lost their identity and became unregistered citizens. Many people in this situation could also be found in Taiwan during the Qing Dynasty.\nQing soldier: Hey?! Where are you from? Show me your entry permit for Taiwan! Unmarried male: Umm, well, you know … (looking for words) Well, Sir, I’m from Chaozhou in Guangdong Province. I have parents and children back home to take care of, but I didn’t have any land to farm and I couldn’t find work, so I did what I could to come to Taiwan to eke out a living here. Have a heart. Qing soldier: Harrumph, I have orders to check out everybody that comes to Taiwan, because you “luó hàn jiǎo ” … single men … are stirring up a lot of trouble in Taiwan. If I don’t follow orders, I’ll get into trouble!\nAfter the Qing government began governing Taiwan, it adopted strict immigration measures for Taiwan. To obtain permits to enter Taiwan, individuals were required to submit an application to the local government and have neighbors or relatives serve as guarantors. Many immigrants weren’t even registered in their hometowns back in the Mainland and wished to come to Taiwan because scratching out a living back home wasn’t easy. Getting registered in Taiwan, however, was such a hassle that very few people actually followed the official procedures. As a result, sneaking in was very common. In addition to being an important source of labor, unregistered immigrants were used as reserve soldiers when Taiwan didn’t have enough military personnel. Some males, however, came to Taiwan alone and didn’t have any relatives here. They were homeless and drifted about. Referred to as “luó hàn jiǎo” by the government, they became a social problem in Taiwan."}}},
  p401:{"n":"帝國與番界","no":"401","fl":"2F","zone":"山海之間的共存與競逐","voice":false,"txt":"有一位清朝官員正奉命來巡查漢人違法越界開墾的情形，我們來聽聽看其中發生了什麼事？\n清朝官員：欸欸欸，你是哪來的人，這裡已經立了碑，是屬於界外禁地，誰允許你在這兒開墾？漢人：大人，小人的地是跟這位平埔原住民租的，在這兒耕種已有一段時間了，一家生計全靠這塊土地，請大人行行好，高抬貴手，放了小人一馬。平埔原住民：是啊，大人，這幾年獵到的鹿越來越少了，為了繳稅，我不得已只好將土地租給漢人。清朝官員：唉，算了算了，看來這裡越界開墾也不是一天兩天的事了，經過這次調查後，番界就會重新劃定了。\n清朝統治臺灣時，時常有漢人進入原住民土地活動，導致雙方發生衝突，再加上山區容易造成治安死角，於是政府劃設番界，禁止漢人進入。這種分界表現在地圖上就是俗稱的「土牛紅線」，在地表上則有界碑、土牛堆等阻隔設施。但是官方的界線擋不住漢人越界，加上官府也無法嚴格執行禁令，所以時間一久，原先劃定的番界範圍逐漸模糊，官府只好屢屢修改番界的位置，每一次修改，界線都更往東邊移動，也反映了漢人不斷往東邊開墾的趨勢。","sign":true,"sv":"sign/8.mp4","sp":"sign/8.jpg","img":"sign/ph-8.jpg","d":76,"i18n":{"en":{"n":"Empire and the Savage Border","zone":"Coexistence and Competition between Mountains and Sea","txt":"A Qing Dynasty official is inspecting the fields of Han Chinese who are illegally farming beyond the set boundaries. Let’s listen in on one the conversations to see what’s happening.\nQing officer: Where are you from? There’s a marker set up here. You crossed over the boundary. This is forbidden land. Who said you could develop this land? Han Chinese: Sir, I’m leasing it from this Pingpu indigenous landowner here. I’ve been tilling this piece of land for quite some time. My family’s livelihood depends on it. Please, Sir, be merciful and kind. Let me go this time. Pingpu aborigine: That’s correct, Sir. Over the past few years, there have been fewer deer to hunt. To pay my taxes, I’ve had no choice but to rent this land to Han Chinese. Qing officer: Hmmm. Never mind. It looks like farming outside the boundaries here has been going on for a while. After the next survey, the boundary will be redrawn.\nWhen the Qing Dynasty was governing Taiwan, Han Chinese frequently entered and were active in indigenous lands, leading to conflicts between the two groups. In addition, there were areas in mountainous regions where authorities found it difficult to uphold the law, so the government established boundaries and prohibited Han Chinese from crossing them. The lines that represented these boundaries on maps were referred to by the people as “tuniu”, literally “earth oxen”, red lines, but on the actual ground, boundary markers or large mounds were used to indicate the division. Official boundaries, however, didn’t keep the Han Chinese out and the government was unable to strictly enforce the restrictions, so after a while, boundaries became increasingly blurred. The government had little choice but to keep redrawing the boundaries. With each change, the boundaries were moved further east, reflecting the trend that the Han Chinese were developing land further and further inland."}}},
  p402:{"n":"平埔領袖潘踏比厘","no":"402","fl":"2F","zone":"山海之間的共存與競逐","voice":false,"txt":"潘踏比厘是清朝埔里地區平埔原住民部落的領袖，曾經擔任軍官，他正在使用眼前這顆鈐印，裁決一場部落糾紛，我們一起來聽聽其中發生了什麼事？\n潘踏比厘：烏肉打毛里妳跟馬六干馬下六借了四十七銀元，不但不還錢，還在對方向妳討錢時，反過來誣陷對方，經過我跟其他部落長老的調查，真相終於水落石出。現在，我們要妳拿出一塊土地來抵債，寫下這紙契約，表示你們雙方都同意接受這個協調結果，日後不得找藉口反悔，聽清楚了嗎？一男一女（異口同聲）：聽清楚了。\n潘踏比厘：好，那我也拿我的千總官印蓋在契約上，以示見證，就此結案。\n從剛剛的故事可以發現，潘踏比厘的鈐印除了使用在官方公文上，也會用來處理部落的公共事務。清朝的原住民部落若發生紛爭，在鬧到衙門訴訟之前，通常會先以部落會議的形式處理，但因為這起事件涉及土地權利轉移的問題，必須比照漢人習慣，簽訂紙本契約，此時，具有傳統領袖身分，又兼具官方權力和地位的潘踏比厘，自然就成了最佳見證人。\n在清朝統治臺灣後，平埔原住民被納入官方的行政體系下，為了生存與發展，每個部落各自採取不同的策略來應對、改變。就像潘踏比厘，他與官府關係密切，透過軍功和職銜維持了自己的地位。","img":"player-photo.jpg","d":119,"i18n":{"en":{"n":"Indigenous Leader Phoann Ta̍h-pí-lî","zone":"Coexistence and Competition between Mountains and Sea","txt":"Phoann Ta̍ h-pí-lî was of the Pingpu tribe in the Puli area during the Qing Dynasty. He once served as a military officer. With the chop you see in front of you, he’s passing judgement on a dispute within his tribe. Let’s listen in and see what’s happening.\nPhoann Ta̍ h-pí-lî: Damuri, you borrowed 47 pieces of silver from Maxala. Not only didn’t you pay him back, but when he asked for his money, you turned around and made false charges against him. The other elders and I carried out an investigation and the truth has come to light. Now, you are to pay him back with a piece of land. We have prepared this agreement which indicates that the two of you agree to this compromise. You will not be permitted to use any excuses to go back on your word. Do you understand?\nA man and a woman (say in unison): Yes.\nPhoann Ta̍ h-p í -lî: Good. Now, in my capacity as company commander, I will apply the seal of my office on the agreement, using my official chop, as testimony that this case is closed.\nThis story shows us that in addition to using his chop on official documents, Phoann Ta̍ h-p í -lî ’ also used it when handling public affairs in the tribe. During the Qing Dynasty, when disputes occurred among people in indigenous tribes, disagreements were usually first dealt with in tribal meetings before lawsuits were filed with the yamen. This particular case involved the transfer of land rights, so it had to be dealt with in accordance with the customs of the Han Chinese: signing an agreement written on paper. Because he is the traditional leader and he has official power and position, Phoann Ta̍ h-pí-lî was the ideal person to serve as witness in this case.\nAfter the Qing Dynasty began governing Taiwan, Pingpu indigenous people were included into the official administrative system. Tribes developed different strategies to ensure that they could continue to survive and thrive. Phoann Ta̍ h-p í -lî, for example, enjoyed a close relationship with the government and used his military achievements and title to maintain his position."}}},
  p403:{"n":"原漢交易","no":"403","fl":"2F","zone":"山海之間的共存與競逐","voice":false,"txt":"眼前的大木籤可不是廟裡求神用的占卜籤喔！請各位仔細看看籤上的文字，猜猜它是什麼用途？木籤是漢人發給原住民的交易憑證，背面記載各種物資的數量，族人可憑此籤向漢人領取物資。籤上還寫著「循例」兩個字，代表著這種憑證已經通用一段時間了，很可能是漢人透過贈送物資的方式，穩定原漢雙方社群的關係。從荷蘭時代開始，原住民和漢人就時常在山邊地帶進行貿易。到了清朝時，官府劃設番界，禁止漢人進入，仍然無法隔絕族群之間的貿易行為。\n漢人通事會在入山口搭建社寮，作為原漢交易場所，以菸、布、糖、鹽等物品，交換原住民的鹿皮、鹿肉乾、原住民布料等物產，再轉賣給商人，所得用來代替部落繳稅。而原住民取得鐵器、火藥等違禁品，則靠另一群仲介者進行違法走私。在官府廢除「番界」、採取「開山撫番」政策之前，漢人在山區的活動，常如此遊走在合法與非法的灰色地帶。","sign":true,"sv":"sign/10.mp4","sp":"sign/10.jpg","img":"sign/ph-10.jpg","d":81,"i18n":{"en":{"n":"Trade between Indigenous Peoples and Han Chinese","zone":"Coexistence and Competition between Mountains and Sea","txt":"This “wood certificate” isn’t a temple divination stick. Look carefully at the characters on it and try to guess what it was used for. Wood like this was issued by Han Chinese to indigenous people as transaction vouchers. Goods and materials and the quantities that were traded were recorded on the back. People of a tribe would present pieces of wood like this to get supplies from Han Chinese. The characters “循例” (“meaning in accordance with convention”) written on the slat indicate that vouchers like this had already been in common use for quite some time. It’s likely that the Han Chinese gave away supplies as a means for stabilizing relations between the Han Chinese and indigenous peoples.\nUnder Dutch rule, indigenous people and Han Chinese began trading in areas near mountains. During the time of the Qing Dynasty, the government drew boundaries which Han Chinese were prohibited to cross, but this did not stop trade between the two people groups.\nHan Chinese interpreters set up sheliao (huts) at passes into the mountains as places where indigenous peoples and Han Chinese could trade. The Chinese exchanged goods like tobacco, cloth, sugar, and salt for deerskins, venison jerky, and cloth from indigenous tribes which the Han Chinese would then sell to merchants. The profits were also used to pay their taxes. Indigenous people were able to acquire prohibited items, like iron implements and gunpowder, which were smuggled to them illegally by others. Prior to the government’s policy to pacify the mountain regions, the activities of Han Chinese in mountainous regions were often carried out like this in the grey area between legal and illegal activity."}}},
  p404:{"n":"「仙姑」金娘","no":"404","fl":"2F","zone":"山海之間的共存與競逐","voice":false,"txt":"18世紀末發生林爽文事件，當中有一位名叫金娘的女子特別引人注意，她其實是一位原住民女子，被官府稱為妖女，但在地方上卻是受人景仰的仙姑，為何會被捲入事件中？我們來聽聽她的故事……\n金娘：（回憶往事的口吻）我叫金娘，來自鳳山縣的上淡水社，以前學過畫符治病，後來就此維生。林爽文發動戰爭的時候，莊大田請我在打狗港祭神，我碰巧醫好他們同夥的病，就被招為軍師啦。莊大田要攻打鳳山時，我幫他請神助戰，後來居然攻城成功，大家就對我非常的信服。之後每當要攻城的時候，我就在山頭唸咒打鼓的。林爽文認為我對南路的戰事很有幫助，封我做一品夫人，沒想到最後運氣不太好。唉，我就被官府給逮住了。\n林爽文事件雖然是以漢人為主體的抗官事件，但其中也有各種人群參與，例如仙姑金娘，在林爽文陣營扮演著穩定軍心的角色；而清朝官方也跟其他原住民合作，圍堵林爽文勢力。在不同族群彼此接觸的過程中，有往來或合作，也可能爆發衝突或糾紛。衝突的雙方，可能是原住民與漢人，或是漢人與清朝官府，甚至是漢人社會裡的不同人群。","sign":true,"sv":"sign/14.mp4","sp":"sign/14.jpg","img":"sign/ph-14.jpg","d":139,"i18n":{"en":{"n":"Witch or Goddess: Kim-niû","zone":"Coexistence and Competition between Mountains and Sea","txt":"The Lin Shuang-wen Incident occurred at the end of the 18th century. One of the individuals in this incident, Kimniû, is particularly noteworthy. She was an indigenous woman referred to by the government as a witch, but she was held in deep respect in the area as an immortal. How did she get involved in this incident? Let’s listen to her story…\nKim-niû: (Remembering the past) My name is Kim-niû. I’m from Shangdanshui Village 上淡水社 in Fengshan County. I studied and made a living by painting charms to cure the sick. When Lin Shuang-wen went to war, Zhuang Da-tian asked me to hold a ceremony honoring the gods in Takow port. I had just healed their companions, so I was recruited to serve as a military advisor. When Zhuang Da-tian was preparing to attack Fengshan, I asked the gods for help on his behalf and his army actually succeeded in their siege of the city. As a result, everybody was convinced that I had some kind of power. Later, every time they planned to attack a town, I would chant and beat on a drum on a mountain. Convinced that my help was important for their southern military action, Lin Shuang-wen conferred the title Honorable Lady on me. In the end, however, I had the bad luck of being captured by the government.\nAlthough the Lin Shuang-wen Incident was primarily Han Chinese resisting the government, individuals from a number of ethnic groups participated in it, such as Kim-niû, whose job it was to boost the morale of Lin Shuang-wen’s army. For its part, the Qing Dynasty government collaborated with other indigenous peoples to besiege Lin Shuang-wen’s forces. As the various groups came in contact with each other, sometimes they interacted and worked together, sometimes they had conflicts and disputes. The parties involved in a conflict might be indigenous people and Han Chinese, or Han Chinese and the Qing Dynasty government, or even different groups within Han Chinese society."}}},
  p405:{"n":"府城大商人林朝英","no":"405","fl":"2F","zone":"山海之間的共存與競逐","voice":false,"txt":"鄉民A：欸欸欸，你這急著上哪兒去呢？鄉民B：我跟你說啊，林朝英老爺幫忙重修孔廟有功，被官府表揚，還蓋了座牌坊，就立在龍王廟前，我要去看看呢。鄉民A：說起林老爺不僅經商有成，又樂善好施。我記得前些年收成不好，米價貴得嚇死人，後來林老爺把自家商號的米糧低價出售，救濟了許多百姓，真是名副其實的大善人。鄉民B：你說了那麼多，到底要不要一塊兒去啊？鄉民A：當然要啊，走，咱們去湊熱鬧！\n林朝英是18世紀府城臺南一位重要的商紳。17世紀晚期，他的祖父林登榜從中國福建漳州渡海來臺，初期經營布料與砂糖的貿易；之後更發展土地投資事業，土地範圍擴及嘉義到屏東。到了第三代林朝英主掌家務時，家族已經累積了豐厚資產，他因此有充裕的資金，能夠投入建城、修廟、蓋學校等許多公共建設；另一方面，他擅長書畫，常幫城內寺廟題寫匾額，作品也受許多人收藏，這幅由林家後代捐贈的〈自畫像〉就是著名的作品之一。像林朝英這樣的傳統城市商紳，他們藉由城市公共事務與藝文活動的參與，既經營人際網絡，也累積聲望與地位；而他們的品味與高消費力，往往也帶動了城市生活與物質文化的精緻化。","sign":true,"sv":"sign/13.mp4","sp":"sign/13.jpg","img":"sign/ph-13.jpg","d":140,"i18n":{"en":{"n":"Lin Chao-ying — Esteemed Tainan Businessman","zone":"Coexistence and Competition between Mountains and Sea","txt":"Villager A: Hey … Where are you off to in such a hurry? Villager B: The government honored Lin Chao-ying for meritorious service for his help in rebuilding the Confucius Temple and even built a memorial archway in his honor in front of the Longwang Temple. I’m going to go see it. Villager A: Mr. Lin is not only a successful businessman; he loves to do charity work. I remember a few years ago, the harvest was very poor. The price of rice was shockingly high. Mr. Lin decided to have his store sell rice at low prices, thereby providing relief for many people. He truly is a philanthropist worthy of the name. Villager B: So, do you want to come along? Villager A: Of course. Let’s go join the fun!\nLin Chao-ying was an important member of the merchant gentry class in Tainan in the 18th century. His grandfather Lin Deng-bang came to Taiwan from Zhangzhou, Fujian in the late 17th century. At first, he traded in cloth and sugar, later, he invested in land from Chiayi to Pingdong. By the third generation, when Lin Chao-ying took over the business, the family had accumulated a great deal of wealth. As a result, he had an abundance of money to put into public infrastructure projects in the city as well as to repair temples and build schools. He was also an accomplished painter and calligrapher, so he often made the inscriptions on plaques in temples in Tainan. Many people have collected his works. This particular painting, a self-portrait donated by one of his descendants, is one of his more renowned works.\nMembers of the traditional city merchant gentry, like Lin Chao-ying, participated in public affairs and cultural activities to build social networks and to enhance their reputation and status. Their taste and ability to spend generous amounts of money served to drive the refinement of city life and material culture."}}},
  p406:{"n":"行銷世界的臺灣茶","no":"406","fl":"2F","zone":"山海之間的共存與競逐","voice":false,"txt":"1860年代，臺灣開港通商以後，開放淡水、安平、雞籠、打狗四個港口，臺灣再次與世界經貿體系接軌，外銷大宗的茶、煤和樟腦業等產業也隨之蓬勃發展。臺灣北部最重要的出口商品就是茶葉。先是由英國商人陶德發現臺灣北部茶產業的潛力，確認過氣候、地形都適合種茶後，建立起外銷茶葉的產銷流程；當時在外國人開設的洋行擔任「買辦」的李春生，積極地從安溪引進茶種，並貸款給農民，鼓勵種植，結果種出好成績，讓品質好、風味佳的臺灣茶葉，開始聞名國際。製作茶葉，有幾個重要的過程：第一是以手摘採茶葉，第二是篩選，第三則是讓茶葉充分的曝曬，第四是加以揉捻翻炒，接著，再用火烘焙。經過一道道仔細程序後，充滿香氣的臺灣茶也就誕生了。最後則有試茶人進行品嚐，判定每一種茶的等級。","sign":true,"sv":"sign/16.mp4","sp":"sign/16.jpg","img":"sign/ph-16.jpg","d":154,"i18n":{"en":{"n":"Taiwan Tea — Sold Worldwide","zone":"Coexistence and Competition between Mountains and Sea","txt":"In the 1860s, after Taiwan’s ports were opened for commerce, the four ports of Danshui, Anping, Keelung, and Dagou became the major channels of trade between Taiwan and the rest of the world, resulting in the rise of such export industries as tea, sugar, and camphor. In northern Taiwan, the most important export commodity was tea. The first merchant was the Englishman John Dodd, who considered the climate and geography of the area as very suitable for growing tea. So with the assistance of Li Chunsheng, an agent in the foreign offices set up by Westerners, tea trees were imported from Anxi and credit extended to farmers, encouraging them to grow tea. The result was an excellent crop, and Taiwanese tea became famous around the world for its quality and aroma. There are several important steps in the production of tea. The first is hand-picking the tea leaves, the second involves sorting them, the third is completely drying them, the fourth is heating them, and then they are cured, which further enhances the fragrance. With each step done meticulously, the full and rich aroma of Taiwanese tea comes out. The final step, of course, is for someone to brew a pot, savor the tea and distinguish its various grades."}}},
  p407:{"n":"走入教會","no":"407","fl":"2F","zone":"山海之間的共存與競逐","voice":false,"txt":"請各位仔細觀察這幅絹本手繪地圖，是否注意到地名圖示上有十字符號的標記呢？這是一幅紀錄1870年代基督教長老教會在臺宣教成果的地圖，圖上除了我們常見的山川地形，和地名資訊外，小小的十字符號，代表著「宣道站」的位置。\n清朝時基督教傳入臺灣，以英國和加拿大長老教會為主。英國長老教會於1865年派遣傳教士馬雅各抵達打狗，建立教會。初期傳教工作並不順利，臺灣民眾對外國傳教士有諸多猜疑，謠言因之而起，於是發生民眾包圍教堂、丟石頭威脅等情形。後來他們以行醫傳教，幫民眾醫治各種病症，因為接觸漸多，人們對教義有所認識，才越來越多人走入教會。\n從地圖上的標示可以發現，愈往南，宣道站的數量就愈密集，顯示出當時傳教範圍以臺南、高雄等地為主，最遠擴展到屏東和中部山區。另外，地圖上也標示出淡水和新竹的宣教站，顯示出同一時期加拿大長老教會在北部的傳教成果。隨著傳教範圍日漸拓展，也可以看出臺灣開港後，外國人在各地活動的足跡。","img":"rec-2.jpg","d":96,"i18n":{"en":{"n":"Joining Churches","zone":"Coexistence and Competition between Mountains and Sea","txt":"Take a look at the hand painted silk scroll in front of you. Do you see the crosses next to the place names? This map records the Presbyterian Church missionary achievements in Taiwan in 1870. In addition to such typical information as geographical features, including mountains, rivers, and place names, this map also has little crosses to indicate the locations of the missionary stations.\nWhen Christianity was introduced into Taiwan during the Qing Dynasty, the primary denomination was the Presbyterian Churches of England and Canada. The English Presbyterian Church sent James Laidlaw Maxwell, a missionary who arrived in Kaohsiung and established a church in 1865. His missionary work wasn’t going smoothly at first. The people of Taiwan had many misgivings about foreign missionaries and rumors spread, actually sparking several incidents, including people surrounding his church, rock throwing, and threats. They later provided medical care as a means to spread the gospel, and healing a variety of sicknesses. As contact with the people gradually increased, the people became increasingly familiar with the church’s doctrines and more people joined the church.\nFrom the map, you can see that the further south you go, the more missionary stations there were, which tells us that missionary work was carried out primarily in the Tainan and Kaohsiung areas. The furthest it expanded was to Pingdong and the mountainous areas of central Taiwan. The map also shows missionary stations in Danshui and Hsinchu, indicating the results of evangelization work of the Canadian Presbyterian Church carried out at the same time in northern Taiwan. The scope of missionary work continued to expand and it can be seen that after Taiwan ports were opened up to the outside world, the footprints of foreigners could be seen around Taiwan."}}},
  p408:{"n":"牡丹社少女阿臺","no":"408","fl":"2F","zone":"山海之間的共存與競逐","voice":false,"txt":"1874年，日本藉口琉球船隻擱淺，在恆春遭到原住民攻擊，於是派兵攻打牡丹社等原住民部落。在日軍進攻途中，擄獲了一名少女，年約12、3歲，身體矮小，眼睛和腿部都有殘疾，日本人叫她阿臺「オタイ」（お臺），她被寄養在軍隊中，隨後被送往東京……攝影師：給妳穿上漂亮的衣服，現在看起來乾淨整齊多了，我們來拍張照片。日本婦人：欸，不行，妳不是學會用筷子了嗎？怎麼還用手抓肉吃？\n來到東京之後，阿臺開始學日語，穿和服，接受日本式的教養。在清朝與日本議和後，日本人才將阿臺送回臺灣。根據牡丹社耆老的口述，阿臺回到部落後，因為適應困難，加上族人異樣的眼光，導致精神恍惚，不久就過世了。\n在這幅日本人繪製的畫報裡，帝國擅自將自己的價值觀套在阿臺身上，所以我們只能看見阿臺被畫成一臉懵懂無知的樣子，被日軍穿上日式服裝，之後還被送到東京學習，接受所謂的文明洗禮；但我們如果試著跳出這個畫面，也許會發現，阿臺似乎沒有像畫報所呈現的那樣美好順利，而是有大時代下身不由己的無奈。","sign":true,"sv":"sign/15.mp4","sp":"sign/15.jpg","img":"sign/ph-15.jpg","d":118,"i18n":{"en":{"n":"Otai, a Girl from Mudan","zone":"Coexistence and Competition between Mountains and Sea","txt":"In 1874, a ship from Ryukyu Kingdom (today Okinawa) was attacked by indigenous people when it ran aground off of Hengchun. The Japanese used this as an excuse to dispatch troops to attack indigenous villages, such as Mudan She. During their attack, the Japanese military captured a teenage girl around the age of 12 or 13. She was tiny in stature and had disfigured eyes and legs. The Japanese called her Otai. She was placed in the care of the military and sent to Tokyo.\nPhotographer: Now that we’ve given you pretty clothes to wear, you look clean and tidy. Let’s take your picture. Japanese woman: Hmm… that won’t do. Wasn’t she taught to use chopsticks? Why is she still using her hands to eat?\nAfter arriving in Tokyo, Otai began learning Japanese, wearing kimonos, and receiving a Japanese-style education. After the Qing government and Japan negotiated peace, Otai was returned to Taiwan. According to older people of Mudan She, after Otai returned to the village, she had difficulty adjusting and other villagers gave her strange looks. As a result, she began having mental health issues and died soon after.\nThis Japanese pictorial magazine suggested that the empire forced its own values on Otai, so we see her painted as if she were muddle-headed and ignorant as Japanese soldiers dressed her up in Japanese garments. She was sent to Tokyo to be educated and “civilized”, but if you look beyond this illustration, we might discover that life for Otai wasn’t all that wonderful; rather, she was swept along helplessly by the tides of her time."}}},
  p501:{"n":"鉅變 1895","no":"501","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"乙未之役時，在民主國總統唐景崧逃離臺北後，駐守臺南的劉永福成為南臺灣的抗日領導中心……\n府城士紳：牧師啊，現在日軍已經兵臨府城了，人心惶惶，這可怎麼辦呢？長老教會傳教士：我聽說劉永福將軍已經寫信給日本人求和，信裡還要求要善待臺灣人民，相信會沒事的。府城士紳：您沒聽到風聲嗎？談判已經破局了，昨夜劉將軍喬裝後，搭船逃走了！長老教會傳教士：什麼！劉大人已經逃跑了！官府的人若真的跑光了，誰來維持秩序呢？府城士紳：是啊，現在城內已經亂糟糟了，所以我們想請教會代表府城人民，出面向日軍求和。\n在戰情不利，談判又破局的情況下，劉永福選擇逃離臺灣，臺南士紳請求長老教會巴克禮牧師等人，前往日軍陣營求和。然而，我們眼前這幅上海出版的畫報「劉大將軍擒獲倭督樺山斬首全圖」，卻將劉永福描繪成完全相反的英勇事蹟。乙未之役時，清日雙方透過文字紀錄、圖像印刷等，從各自不同的角度解讀這場戰爭。這些畫報、年畫的主題大多強調劉永福的英勇形象，雖然內容明顯與實情不同，但也透露出人民對劉永福抗日成功的殷切渴望。","sign":true,"sv":"sign/17.mp4","sp":"sign/17.jpg","img":"sign/ph-17.jpg","d":96,"i18n":{"en":{"n":"The Great Transformation of 1895","zone":"Frustration and Dreams under a New Order","txt":"During the Yiwei War, when Tang Jing-song, the president of the Republic of Formosa, fled from Taipei, Liu Yong-fu, who was garrisoned in Tainan, became the leader of the resistance against Japan for southern Taiwan…\nMember of gentry class: Pastor, Japanese forces are on the outskirts of Tainan. Fear is spreading through the populace. What are we going to do? Presbyterian Church missionary: I’ve heard that General Liu Yong-fu has written to the Japanese to sue for peace. In his letter, he also asked that the people of Taiwan be treated well. I’m confident things will be alright. Member of gentry class: You didn’t hear the rumor? The peace talks have broken down. Last night, General Liu fled in disguise on a ship! Presbyterian Church missionary: What! Mr. Liu ran away?! If all the people in the government flee, who is going to keep order? Member of gentry class: You’re right. The city is in chaos, so we would like to ask the church to represent the people in seeking peace with the Japanese.\nWith the war not going in Taiwan’s favor, the breakdown in negotiations, and Liu Yong-fu fleeing Taiwan, community leaders in Tainan’s gentry class asked individuals of the Presbyterian Church, including Reverend Thomas Barclay, to go to the Japanese encampment and sue for peace. This “Imaginary Scene of the Great General Liu capturing and beheading the Japanese Governor-General Kabayama” from a pictorial magazine printed in Shanghai depicts Liu Yong-fu as a hero, in sharp contrast to what really happened. During the Yiwei War, in addition to fighting in the real world, the Qing government and the Japanese also employed written documents and pictorials to portray the war from their different perspectives.\nThe majority of these pictorials and imaginary scenes stressed the image of Liu Yong-fu as courageous. Their content stands out in sharp contrast to reality, but they also divulge the hope of the people that Liu Yong-fu would succeed in his fight against the Japanese."}}},
  p502:{"n":"臺灣民主國","no":"502","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"1895年因為甲午戰爭的失敗，清國和日本簽訂馬關條約，將臺灣割讓給日本。當時，臺灣的士紳丘逢甲等人，一同推舉臺灣巡撫唐景崧為總統，發表宣言建立「臺灣民主國」，定年號為「永清」，以臺北作為首都，而您眼前的這面黃虎旗，就是「臺灣民主國」的國旗。「臺灣民主國」的成立，是希望藉由暫時脫離中國的獨立行動，引起世界各國的關注，反抗日本的接管。但是，第一任總統唐景崧不久之後就逃回中國，臺灣人為了保衛鄉土成立了義勇軍，以游擊的方式繼續抵抗，但是依然抵擋不住日軍的大力進攻，經過半年多的抗戰，臺灣的抗日勢力終於瓦解，也開啟了臺灣往後五十年的日本時代。","img":"work-4.jpg","d":64,"i18n":{"en":{"n":"Formosa Republic","zone":"Frustration and Dreams under a New Order","txt":"After the Qing dynasty was defeated by the Japanese in the 1895 Sino-Japanese War, China and Japan signed the Treaty of Shimonoseki, the Qing ceding Taiwan to Japan. At the time, such members of Taiwan’s gentry as Qiu Fengjia chose Taiwan Governor Tang Jingsong as their new president, and declared the establishment of the “Formosa Republic.” They chose the era name “Yongqing,” and declared Taipei the capital. The flag with a yellow tiger on a blue ground that you see here was chosen as the national flag. The founding of the “Formosa Republic” was done in the hopes of achieving temporary independence from the Qing government so as to attract international attention and try to thwart the takeover by the Japanese. However, President Tang Jingsong soon fled to China, leaving the Taiwan people to form armed militias to protect their homeland. Using guerilla tactics to continue the resistance, they were unable eventually to withstand the might of the Japanese military. After fighting for more than half a year, anti-Japanese forces in Taiwan finally collapsed, and the island began a fifty-year era as a Japanese colony."}}},
  p503:{"n":"派出所","no":"503","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"在各位眼前這個派出所，是復原日本時代嘉義東門町的派出所。東門町派出所原先是磚造，但是因為受到1930年嘉義大地震的影響，重建的時候就使用阿里山的木材，便成了木造建築。派出所的所在地，一般都設立在交通要道，或是市街繁忙處，以便能迅速掌握地方上的風吹草動。派出所的建築強調對稱工整，色調也多半相當單調，因為這樣的搭配，可以呈現出莊嚴的氣氛。當時派出所內還有拘留所，警察擁有可以把人拘留在派出所內29天的權力，權力可說相當大，所以當時總是稱警察為「警察大人」，或直接稱他「大人」，顯示一般民眾對警察的敬畏之心。而「警察來了！」，更是當時大人們常用來嚇阻小朋友吵鬧的話語。一直到現在，這樣的習慣都還存在著。","img":"work-5.jpg","d":71,"i18n":{"en":{"n":"Police Stations","zone":"Frustration and Dreams under a New Order","txt":"What you see before you is a re-creation of the police station from the East Gate District in Chiayi that was built in the Japanese colonial era. The police station was originally made of brick, but was damaged in the Great Chiayi Earthquake of 1930, and it was then rebuilt using lumber from Alishan. Police stations were generally established along major thoroughfares or in busy places, making it easy for the police keep in touch with local events and move quickly into action. Precinct buildings emphasize balance and uprightness, the colors usually being subdued, a combination that creates an atmosphere of dignity and authority.\nPolice stations at the time would include a holding cell, with police having the authority to hold a suspect for up to 29 days, making them quite powerful locally. As local representatives of the Governor, police were often referred to in those days as “Sir Policeman” or just plain “Sir,” showing just how much respect and fear people had for them. When somebody said, “Here comes the police!” it was often a way for adults to get unruly children to behave and keep quiet. This habit in dealing with children still exists today."}}},
  p504:{"n":"武裝反抗","no":"504","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"1895年，在臺灣民主國抗日失敗後，各地擁有聲望、資產和武力的地主、豪強，紛紛組織義勇軍進行游擊抗日。其中北部的義勇軍領袖詹振、林李成與陳秋菊等人，約定於12月31日在各地發動攻擊，讓日軍疲於奔命，再趁機攻入臺北、宜蘭城……\n義勇軍A：哼，日本人真是可惡，以為拿著洋槍洋砲就能在我們面前耀武揚威！義勇軍B：他們根本不把臺灣人當人看，不但強佔民宅、欺辱民女，小老百姓做生意要繳稅、尿急找個地方解決也要罰錢。軍隊還住進廟裡，簡直是對神明大不敬！義勇軍A：日本人犯下的十項大罪，天理難容，我等起義圍攻臺北城，以此檄文昭告天下！\n日本統治臺灣初期，徵用臺灣的廟宇作為軍營、辦事處或宿舍等，被認為不尊重臺灣傳統的宗教習俗，加上日本政府規範臺灣人的生活習慣，地方士紳也自認沒有受到應有的尊重和禮遇，導致各地不斷有抗日事件發生。為了因應此起彼落的抗爭，日本政府開始制定相對應的政策，同時也逐漸在臺灣建立起殖民統治的體制。","img":"unit-1.jpg","d":98,"i18n":{"en":{"n":"Armed Resistance","zone":"Frustration and Dreams under a New Order","txt":"In 1895, after the Republic of Formosa failed in its resistance against the Japanese, landlords and powerful people around Taiwan with prestige, assets, and weapons organized volunteers to carry out guerilla warfare against the Japanese.\nLeaders of these volunteer groups in the north, including Zhan Zhen, Lin Li-cheng, and Chen Qiu-ju, agreed to launch attacks in different places on December 31, so that the Japanese would become exhausted as they ran from place to place to engage them. They could then take advantage of the situation to bring their fighting to Taipei city and Yilan city. Volunteer A: Humph! Those Japanese are real jerks. They swagger about all day, because they have guns and cannons from the West. Volunteer B: They don’t even think of Taiwanese as human beings. They occupy homes, bully and shame our women, exact taxes from people trying to eke out a living, and fine us when we take a piss. Japanese soldiers even disrespect our gods by garrisoning in our temples! Volunteer A: The heavens will not tolerate the many evils that they have committed. We are going to rise up and lay siege on Taipei. We call on everyone to rise up!\nWhen the Japanese began governing Taiwan, they appropriated temples in Taiwan and used them as military camps, offices, and dormitories which the people considered as insulting to their traditional religions. In addition, the Japanese government compelled the people of Taiwan to change their habits and customs. The local gentry also felt that they did not receive the respect and courtesy that they deserved. As a result, anti-Japanese incidents continued to break out all over Taiwan. To deal with these pockets of resistance as they set up a colonial government in Taiwan, the Japanese government began developing policies to deal with the incidents."}}},
  p505:{"n":"南無警察大菩薩","no":"505","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"警察系統是總督府控制臺灣社會及推動官方政策的重要管道。日人統治臺灣後，總督府在全臺各地廣設警察派出所，以這些派出所為基礎，掌握各地的風吹草動，並將政策推行到地方上的每一個角落。另外，總督府也將清代的保甲制度與警察制度結合，選任臺灣人擔任保正、甲長，一方面協助推動政策，另一方面也達到監控社會的目的，同時還可以將臺灣地方菁英納入統治系統，成為總督府嚴密統治不可或缺的部分。\n對當時的臺灣百姓而言，警察可以說是總督府在地方的代言人。這邊的「南無警察大菩薩」，一手握著劍，一手數著佛珠，端坐於雲彩之上，背後如千手觀音般的手掌中，拿著象徵維持治安、調查戶口、管制思想、衛生保健、推廣農作技術、催繳租稅、社會救助等日本時代警察眾多任務的器具，說明日本時代警察高度的權威與無所不包的職掌。","sign":true,"sv":"sign/18.mp4","sp":"sign/18.jpg","img":"sign/ph-18.jpg","d":96,"i18n":{"en":{"n":"Namo Buddha Policeman","zone":"Frustration and Dreams under a New Order","txt":"The police system was the main way of controlling Taiwanese society and promoting the policies of the GovernorGeneral’s Office. After Japan had taken over the whole island, police stations were set up across Taiwan to monitor local activities and supervise the implementation of government policies. The Governor-General’s Office also adopted the old Baojia system that had been established under the Qing Dynasty and applied it to its police system. Under this members of the Taiwanese elite worked as street-level officers, as they could help the police in monitoring and controlling the population, and this also meant that they themselves could be properly managed by the Japanese government. Such close ties between the police and the Governor-General’s Office meant that the Taiwanese people saw the former as the local representatives of the Japanese government. The picture of the “Namo Buddha Policeman” shown here depicts a police officer sitting on a cloud with two hands holding a sword and prayer beads in the front, and many other hands at the back holding different tools that symbolize the many tasks the police would have to do. These included maintaining security, taking household surveys and monitoring public health, as well as propaganda, promoting agricultural technologies, and administrating both tax payments and social relief. This picture thus illustrates the great authority of the police and how they had a hand in almost every aspect of life at the time."}}},
  p506:{"n":"警察大人","no":"506","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"一位日本警察巡視到賣菜的擔子前。日本警察：「這花菜看起來很新鮮，不過你的秤好像不太好！」小販：「大人，這把秤還很新呢！」賣菜的小販恭恭敬敬的把秤拿給警察看。警察聽完後，便拿走秤，說上面的刻度已經模糊，不能再使用了。小販不願失去生財工具，不肯服從，警察一氣之下，就把「秤」折斷，還把他帶到衙門定罪。\n日本時代，臺灣總督府利用警察來管理臺灣人，當時的警察無事不管，例如政府頒佈度量衡相關規定，只有經過政府認可的秤才能在市場上使用，違反的話，就會遭到處罰。有人說日本時代的臺灣是警察之島，警察具有高度權威，臺灣民眾看到多半會懼怕，常尊稱他們為「警察大人」。","img":"unit-5.jpg","d":65,"i18n":{"en":{"n":"Police Bosses","zone":"Frustration and Dreams under a New Order","txt":"A Japanese police officer making his rounds spots a vegetable peddler. Japanese policeman: “This cauliflower looks fresh, but your scale doesn’t look too good!” Peddler: “Sir, this scale is still very new!” The vegetable peddler respectfully gives the scale to the policeman for inspection. After the policeman listens to the peddler’s story, he takes the scale away, saying that its markings are so worn that it can no longer be used. The peddler does not want to lose the tool he uses to earn money and is unwilling to acquiesce quietly. The policeman loses his temper, breaks the scale, and hauls him off to be convicted in court.\nDuring the Japanese era, Taiwan’s Office of the Governor-General controlled Taiwanese people through the police, whose administrative duties covered everything. For example, the governmentissued regulations on weights and measures stipulated that only scales approved by the government could be used in the marketplace, and any violation of that rule would be punished.\nSome people have described Taiwan during the Japanese era as the “island of police.” The police had a high degree of authority, and people were mostly afraid of them, calling them “police bosses.”"}}},
  p507:{"n":"失落的大羽冠","no":"507","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"佐久間左馬太總督上任後，對原住民改採嚴厲的武裝鎮壓。日本政府原本扶植花蓮阿美族七腳川社來固守隘勇線，但是族人不滿長期服勞役，卻薪資微薄，加上日本人也沒有按時發放工資，導致年輕族人殺了日本警察，日方認定是全社暴動，於是展開軍事鎮壓……七腳川社人A：快點快點！日本人快來了，我們把這些食物帶一帶，趕快走！七腳川社人B：等等，大羽冠還沒來得及拿。七腳川社人A：沒辦法了，先逃再說！\n七腳川事件發生後，日本人命令族人必須離開原本居住的地方，並放火燒村。族人在逃難過程中，不僅文化傳統裡重要的大羽冠沒有保留下來，其他相關文物也大多遺失。後來七腳川社的後代，透過訪談耆老、參考鄰近部落的歷史影像，才再現出屬於部落的大羽冠。而大羽冠也象徵著族人對於自身文化知識的再追溯。","sign":true,"sv":"sign/19.mp4","sp":"sign/19.jpg","img":"sign/ph-19.jpg","d":86,"i18n":{"en":{"n":"Lost Feather Headdress","zone":"Frustration and Dreams under a New Order","txt":"After taking office, GovernorGeneral Sakuma Samata began to use harsh armed suppression against indigenous peoples. The Japanese government had been supporting the Cikasuan Tribe of the Amis in Hualien to defend the Frontier Guard Line, but the tribesmen were unhappy with being required to engage in long-term service, as well as the meager wages. To add insult to injury, the Japanese didn’t even pay them on time. This led to the killing of Japanese policemen by young members of the tribe. The Japanese viewed this as insurrection by the entire tribe which they then suppressed with the military.\nCikasuan Tribe Member A: Hurry up! The Japanese will be here soon. Let’s take this food and get out of here! Cikasuan Tribe Member B: Hold on! I didn’t have time to get the feather headdress. Cikasuan Tribe Member A: There’s nothing that can be done about that. Let’s get out of here!\nAfter the Cikasuan Incident, the Japanese ordered the tribe to relocate and then burnt their village down. As they fled, most of their cultural articles, including the very important feather headdress, were lost. Descendants of the Cikasuan Tribe interviewed older members of the tribe and referred to historical images from neighboring tribes to recreate a tribal feather headdress. This feather headdress represents the retracing of the tribe’s knowledge of its own culture."}}},
  p508:{"n":"新式糖廠","no":"508","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"日本統治臺灣初期，將臺灣當作熱帶經濟作物和糧食的生產地，透過各項基礎建設的進行，以及產業的調查和探勘，有系統地開發臺灣各項產業資源，以便提供日本帝國所需。提高糖的產量，也是重要課題之一。1902年，臺灣第一座機械製糖廠在高雄橋頭成立。在日俄戰爭與第一次世界大戰後，日本大量資金也投注到臺灣的製糖業，各地新式糖廠紛紛建立。總督府透過徵收砂糖消費稅的稅金，直接補助資本家設立新式製糖廠，例如：購買機器、修築灌溉系統、免費提供蔗苗等等。並且建立原料採收區域制度，區域內的蔗農只能夠將甘蔗賣給區域內的製糖會社，採購價格由製糖會社決定，臺灣有句諺語說：「第一憨，種甘蔗給會社秤」，就是在講蔗農在這種制度下價格被資方控制的心酸處境。眼前這座糖廠模型，即為新式糖廠的樣式。新式糖廠從甘蔗壓榨到製糖完成都是機械作業，而依附糖廠為生的工人，全臺灣更是數以萬計。隨著糖業的發展，還興建了綿密的糖業鐵路，即是大家熟悉的「五分仔車」，減少從產地到工廠的運輸時間，這些現代化設備，終使臺灣成為世界四大產糖地之一。","sign":true,"sv":"sign/20.mp4","sp":"sign/20.jpg","img":"sign/ph-20.jpg","d":127,"i18n":{"en":{"n":"New Sugar Refinery","zone":"Frustration and Dreams under a New Order","nodesc":true}}},
  p509:{"n":"臺灣速寫","no":"509","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"膠卷影片誕生於19世紀末年，成為一種全新的影像紀錄方式，被廣泛運用於宣傳、紀錄及娛樂等範疇。日本人將此技術引進臺灣後，影片成為政府推行社會教化、宣導政策及宣傳政績的媒介，民間社團如臺灣文化協會等，也曾將播放電影當作啟迪民智的重要手段。相對於過去的文字與圖像，影片能夠承載更多的訊息，除了本身內容外，片中的場景與人物，甚至劇情架構，都反映拍攝時的社會背景與時代特色。不過，由於早期膠卷不易保存，使這種珍貴的歷史資料經常因損毀而流失。現在您眼前播放的，是本館館藏的《南進臺灣》紀錄片。《南進臺灣》為1937年拍攝的宣傳片，內容介紹臺灣風土民情、各地物產及政府重要建設，並宣傳臺灣做為日本南進基地的重要性，紀錄了當代臺灣社會與產業的狀態，以及日本官方視角下的臺灣定位。","img":"unit-6.jpg","d":79,"i18n":{"en":{"n":"A Sketch of Taiwan","zone":"Frustration and Dreams under a New Order","txt":"Moving pictures were invented at the end of the nineteenth century, and quickly became a new method for visual documentation, applied to such varied uses as propaganda, documenting scenes and events, and entertainment. After the Japanese introduced these techniques to Taiwan, films were also used by officials to promote government policies, social education, and to advertise Japan’s achievements. Civil groups, such as the Taiwan Culture Association, also used films to educate people. Compared to printed words and pictures, films can display much more information in a much more appealing fashion, and also be understood by people who may be illiterate. The settings, the characters, and even the story in such films all reflect the social background of the time. However, as a stable environment was critical to the preservation of early films, many of these precious artifacts have now been damaged by the passing of time. The film that is playing in front of you now is the documentary Taiwan—the Base of Southward Expansion. Shot in 1937, this film was a piece of propaganda introducing the land and customs, the agricultural products, and the major public infrastructure in Taiwan. Taiwan—the Base of Southward Expansion not only promoted Taiwan as a strategic base in Japan’s imperial process, but also recorded the status of the various Taiwanese societies and industries at the time. Additionally, it shows how the Japanese positioned Taiwan in their empire."}}},
  p510:{"n":"臺灣俯瞰圖","no":"510","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"臺灣鐵路建設始於清末，進入日本時代後，鐵路快速擴及全島各地，1908年基隆到高雄的縱貫鐵路開通，1938年環島鐵路網大致形成，加上各式各樣星羅棋佈的產業鐵道，徹底改變了臺灣的交通環境。1908年縱貫鐵路開通後，成為臺灣島內交通運輸的大動脈，使原先向西部沿海各港口集中的貨物，改通過鐵路運輸至縱貫線兩端的高雄和基隆，形成南北兩大港對外貿易的格局。鐵路同時也為此時臺灣休閒旅遊的出現，提供了良好的外在條件，除了方便人們到處移動外，並大幅縮減出遊所需的時間。在我們面前展示了一份日本時代的《臺灣俯瞰圖》，圖中臺灣以西面朝下的方向橫放，可以清楚看到以縱貫鐵路為首的鐵路網，已遍佈臺灣西部平原，並延伸進入部份山林地區。鐵路沿線標示各地物產及觀光名勝，透露日本時代鐵路無可取代的重要性。","img":"u3-1.jpg","d":80,"i18n":{"en":{"n":"Bird’s-Eye View of Taiwan","zone":"Frustration and Dreams under a New Order","txt":"The construction of railways in Taiwan was started in the late Qing period, and the network then rapidly extended over the island during Japanese rule. From the full operation of the Western line in 1908, to the substantialcompletion of the aroundthe-island rail network in 1938, as well as all kinds of industrial railways in different regions, this led to a revolution in transport in Taiwan. The Western line became the main transportation route on the island,when it was opened in 1908, moving much of the export industry from the ports along the west coastline to Kaohsiung and Keelung, the two ends of the Western line. Railways not only changed the trading routes from the west coast to the two ports at the north and south of the island, but also facilitated the tourism industry by allowing people to travel around in a much shorter time. The map in front of you shows a“Bird’seye view of Taiwan” published during Japanese rule. In this picture, Taiwan is presented horizontally by putting the west side down, and you can clearly see how the rail network, led by the Western line, spread all over the western plains and even extended to some of the mountainous areas. Along the railway you can also see marks indicating where different items were produced and a number of scenic areas, showing how important the railways were in the Japanese period."}}},
  p511:{"n":"集章遊臺灣","no":"511","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"有許多人喜歡透過集章留下旅程的紀念，但是這種「紀念章文化」可不是近年才開始流行的喔。日本時代總督府積極發展觀光政策，集章風氣便由日本吹向了臺灣。這裡有一本獨特的旅遊手札，是日本人中西竹山在1934年到臺灣遊覽時蒐集的，我們請中西先生來分享他的旅遊心情……中西竹山：大家好，我是一位集章愛好者，臺灣各地的火車站、風景名勝的戳章，我都收藏在這本紀念冊裡，還有沿途拿到票券和名片，我也一一保留下來，還畫上插畫裝飾呢！\n哇！真的很棒耶。中西先生，那您在臺灣有沒有什麼印象特別深刻的人事物呢？\n中西竹山：呵呵，臺灣不僅像我想像的富有南國風情，而且非常現代化，城市裡有自來水和電，還能搭著火車，南北走透透。這次旅行真讓我對這個南方島嶼為之改觀啊。我記得其中一天，我們到日月潭遊湖，那兒真美，不愧被票選為臺灣八景之一。\n那您有沒有帶一些臺灣的紀念品回去呢？中西竹山：當然有啊，我從總督府鐵道部出版的旅遊手冊中，看到地方物產的介紹，有香蕉飴、月桃草帽、銀竹筏等等，我還在臺中買了瓶福祿清酒，那滋味真是難忘呢！哎呀，不跟各位多說了，我得趕緊到碼頭搭船回日本了，希望有機會下次見！","sign":true,"sv":"sign/21.mp4","sp":"sign/21.jpg","img":"sign/ph-21.jpg","d":152,"i18n":{"en":{"n":"Collecting Stamps While Traveling in Taiwan","zone":"Frustration and Dreams under a New Order","txt":"Many people like to collect stamps to serve as souvenirs of places they’ve visited. Commemorative stamps like this have been popular for quite some time. During the period of Japanese governance, the Office of the GovernorGeneral developed tourism policies and the trend to collect stamps spread from Japan to Taiwan. This unique handwritten travel diary was put together by Nakanishi Chikuzan a citizen who travelled in Taiwan in 1934. Let’s ask Mr. Nakanishi to share his thoughts on travelling in Taiwan.\nNakanishi Chikuzan: Hello. I love to collect stamps. I have stamps from train stations and scenic spots around Taiwan in this travel diary of mine. I also kept the tickets and business cards I gathered along the way. I even drew some pictures to decorate my diary.\nWow, that’s great. Mr. Nakanishi, what do you remember most about Taiwan? Nakanishi Chikuzan: Oh, Taiwan had the ambiance of a nation in the South, yet, it was also very modern. The cities had running water and electricity. You could take trains up and down the island. This trip really changed my perspective on the island. I remember going to Sun Moon Lake. It was truly beautiful. It’s no wonder it was selected as one of the Eight Wonders of Taiwan.\nDid you bring any souvenirs of Taiwan back with you?\nNakanishi Chikuzan: But of course! I read about local products in a travel brochure printed by the Railway Department of the Governor-General Office of Taiwan. There were things like banana treats, shell ginger straw hats, and bamboo rafts made out of silver. In Taichung, I also bought a bottle of Fortune Sake. I’ll never forget how wonderful it tasted. Goodness! I have to go. I’ve got to hurry to the pier to catch my ship back to Japan. I hope I have the opportunity to see you again."}}},
  p512:{"n":"「國民」養成","no":"512","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"日本時代臺灣教育系統的核心，是由小學校和公學校所組成的初等教育，其中公學校招收臺灣學童，小學校則以在臺日人學童為主，也收少數的臺灣菁英家庭學童。臺灣初等教育以上的教育系統發展相對遲緩，直到1922年「臺灣教育令」修訂後，才開始建構從初等到高等教育的完整教育體系。總督府的教育目標，是將臺灣學童培養成忠貞順服的日本國民，同時訓練生活必需的技術與能力，以協助統治並開發臺灣資源。因此，在教育內容的安排上，除了教授日語、修身、唱歌等課程，培養現代素養與日式觀念外，相當重視能養成團體紀律、健康身體及實用技能的體操和農事、裁縫等實業課程，到日本統治後期，農、工、商等實業教育已成為臺灣教育中相當重要的部份。","sign":true,"sv":"sign/22.mp4","sp":"sign/22.jpg","img":"sign/ph-22.jpg","d":98,"i18n":{"en":{"n":"“Nationalist” Trained","zone":"Frustration and Dreams under a New Order","txt":"The foundation of the education system in Taiwan during Japanese rule was the primary education based on two kinds of schools, the Shogakko and Kogakko. Both served as elementary educational organizations. The Shogakko were mainly for Japanese children in Taiwan, or local Taiwanese from elite families, while the Kogakko were only for Taiwanese children. The development of secondary and higher education in Taiwan, however, was rather slow. It wasn’t until the Japanese issued the Taiwan Education Rescript in 1922 that education expanded beyond the primary level to higher establishments. The aim of education, in the eyes of the Governor-General’s Office, was to teach Taiwanese children to be loyal, obedient Japanese citizens, while giving them the techniques and abilities that could assist Imperial rule in Taiwan. Therefore, in order to impose Japanese values, schools provided courses in the Japanese language, moral values, and singing. To promote discipline, health, and practical skills, there were also courses in gymnastics, agriculture, and tailoring. By the late Japanese period, education in industrial agriculture, engineering, and commerce had become an important part of the Taiwanese system."}}},
  p513:{"n":"新式教育","no":"513","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"清朝的私塾或書房，和我們現在認知的學校很不一樣，比較像老師個人的補習班，學習內容以儒家經典為主。日本時代將新式教育引進臺灣，近代學校的授課內容非常多樣化，除了有語言、數學、歷史、地理等新學科之外，也有體育、唱遊、圖畫等傳統教育不會出現的課程。前方有兩位公學校的學童走過來了，一起來聽聽他們的校園生活話題！\n學童A：聽說高年級的學長姊明天要去修學旅行了，可以去外面上課，好羨慕呀！學童B：與其羨慕他們，我比較擔心今天的考試，你都準備好了嗎？學童A：那是當然的，國語、算數這些科目我最拿手了，老師說這些科目學得好，畢業以後就能在公家機關工作，或是參加資格考試。學童B：唉，比起這些科目，我還是喜歡體育和唱遊，但我阿爸說這些科目只是在玩，沒有什麼用處。\n學童A：哎呀打鐘了，我們趕快回教室上課，不然老師要罵人了！\n從公學校成立以來，體育課就一直是必修課，由於日本人認為體力就等同於國力，國民如果能夠擁有強健的體魄，國家的軍事就能強盛，所以學校會透過體育課培養國民體能。在做體操時，讓學生聽號令律動身體，並從整齊劃一的動作中，學習守規矩和團體合作的精神。","img":"u4-2.jpg","d":114,"i18n":{"en":{"n":"New Education","zone":"Frustration and Dreams under a New Order","txt":"The private academies and study halls of the Qing Dynasty were different from schools of today. They were more like cram schools run by individual teachers who taught primarily the Confucian Classics. During the Japanese era, modern education was introduced in Taiwan. Modern schools had a varied curriculum offering subjects with new content, like languages, math, history, and geography, as well as subjects that you would never see in traditional schools, like physical education, singing, and drawing. Two students from a public elementary school are walking this way. Let’s listen in on their conversation to see what topics are hot on campus.\nStudent A: I hear that students in higher grades in school are going on a field trip tomorrow. They get to have class outside of school. They’re so lucky! Student B: I don’t have any time to envy them. I’m worried about the test today. Are you ready for it? Student A: Of course, I am. My best subjects are Japanese and arithmetic. The teacher said that if you do well in these subjects, when you graduate, you can get a job in the government or you can take a certification exam. Student B: I’m not a fan of those subjects. I like physical education and singing, but my dad says that those courses are just for fun. They’re basically useless.\nStudent A: There’s the bell. We’d better hurry back to class or the teacher will get on our cases.\nSince the establishment of the public elementary school, physical education has been a required subject, because the Japanese believe that national strength is built upon the physical strength of the individual. If citizens have strong bodies, the nation’s military will be strong, so schools use physical education classes to nurture the physical strength of the people of the nation. When performing calisthenics, students line up in straight rows and perform various movements to commands. This teaches them teamwork and how to follow the rules."}}},
  p514:{"n":"臺灣文化協會","no":"514","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"臺灣文化協會成立前一個月，蔣渭水寫了封信給臺中霧峰的林獻堂。信中附上一首蔣渭水自創的會歌歌詞，讓我們一起回到歌詞創作的當下……\n蔣渭水：獻堂先生敬啟，透過這封信向您報告各地同志加入的情形。協會的募集人數已達五百多人，這些同志都具有非常堅定的意志，人數雖少，但聲勢浩大。我在信件的背後，寫下《臺灣文化協會會歌》。這首歌有兩種唱法，都是我們耳熟能詳的曲子。我特別用白話文來寫歌詞，就是認為協會成員都是新時代的知識份子，會歌要能彰顯新青年的思想，同時具有我們這一輩人的時代意義，我們不僅是臺灣人，更是世界人。\n從文化協會的會歌歌詞，可以想像1920年代的新知識份子，有一部分人認為世界和平的前提，就是東西文化的平等，所以中、日要合作，而臺灣人便扮演著中日橋樑的關鍵角色。必須先提升自身的文化水準，才能勝任這個角色，於是新知識份子透過辦報紙、舉辦各種啟蒙課程等方式，試圖對臺灣的文化與社會進行改造。","sign":true,"sv":"sign/23.mp4","sp":"sign/23.jpg","img":"sign/ph-23.jpg","d":94,"i18n":{"en":{"n":"Taiwanese Cultural Association","zone":"Frustration and Dreams under a New Order","txt":"A month before the Taiwan Cultural Association was established, Chiang Wei-shui wrote a letter to Lin Hsien-tang in Wufeng, Taichung. The letter included the lyrics to a song written by Chiang Wei-shui. Let’s go back in time to when the lyrics were written.\nChiang Wei-shui: Dear Mr. Lin Hsientang. I’m writing this letter to tell you how people from all over are joining the association. Over 500 resolute individuals have joined. This number might be small, but their voice is powerful. On the back of this letter, I have written the Taiwan Cultural Association Anthem. There are two ways to sing it. Both are tunes that we are very familiar with. I made it a point to write the lyrics in vernacular Chinese, because the members of the association are modern intelligentsia. The association’s anthem needs to reflect the thinking of young people. It also has significance for people in our generation. We are not just the people of Taiwan. We are people of the world.\nFrom the lyrics of the Taiwan Cultural Association Anthem, you can imagine the new intellectuals of the 1920s. Some of them felt that the prerequisite to world peace was equality between the cultures of the East and West, so China and Japan needed to work together, and the people of Taiwan needed to play the key role of serving as a bridge between these two countries. To play this role, Taiwan needed to first enhance its cultural level, so the emerging intelligentsia started newspapers and organized various courses designed to enlighten as they strived to reform Taiwan culture and society."}}},
  p515:{"n":"新女性","no":"515","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"20世紀以後，有一些臺灣女性開始可以去上學，甚至有接受更高教育的機會，她們從近代教育中得到了思想的啟蒙與解放，並讓這些女性得到了新的自我認同。有些女性，乘著新時代的浪潮，成為具有新觀念的新女性。隨著新產業的發達，開始有女性進入職場工作，他們的社會角色可為醫師、記者、畫家、助產士、護士、女老師等。當然，纏著小腳的婦女也是存在著，那個時候，可說是處在一個新舊交替之間的時光中。在都會街頭上，出現穿著時髦的摩登女性也日益增多，他們開始用彩妝、流行服飾、時尚髮型裝扮自己，在海水浴場上，也毫無畏懼的穿上泳衣。為當時的社會，注入一個美麗的力量。","img":"u5-1.jpg","d":64,"i18n":{"en":{"n":"Modern Women","zone":"Frustration and Dreams under a New Order","txt":"In the twentieth century, more women in Taiwan began to go to school, some even having the opportunity to receive a higher education. These women were inspired and liberated by the ideas that they received from modern education, giving them a new sense of self. Some women also took advantage of new trends at the time to themselves become pioneers of modern thinking. Moreover, with the opportunities presented by new industries and a diversifying economy, more women made their way into the work force, with increasing numbers entering society in such roles as doctors, reporters, painters, mid-wives, nurses, and teachers. There were still a few women, though, who had bound feet, because it was a period of transition from the old society to the new. In the cities, more and more selfconsciously modern women began to use makeup, wear the latest fashions, and sport the newest hairstyles. Some even dared to go to the beach wearing a swimsuit, injecting a new sense of beauty into society of the time."}}},
  p516:{"n":"街屋","no":"516","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"由於臺灣在清朝末年和日本時代與外來文化接觸頻繁，社會結構逐漸改變，日本時代的街屋尤其忠實地反應了整個臺灣社會結構的演變過程。造景中的街屋，有一層樓的閩南式建築，二層樓的拱式街屋，以及三層樓的巴洛克風格街屋，便是象徵著這樣的過程。臺灣過往的房舍，由於受限於物力及技術，多半是一層樓建築。為了防禦盜賊，街道相當狹隘，且採光、排水不良。為了營造臺灣新的市街風貌，總督府投下大量的經費，從事都市計畫。隨著總督府的市街改正，道路拓寬，街屋的改造，讓臺灣的市街風貌，呈現了一種混合式的樣貌。","sign":true,"sv":"sign/24.mp4","sp":"sign/24.jpg","img":"sign/ph-24.jpg","d":127,"i18n":{"en":{"n":"Shop Houses","zone":"Frustration and Dreams under a New Order","txt":"The structure of society in Taiwan gradually changed following its increasing contact with foreign cultures during the late Qing dynasty and Japanese colonial eras. Street houses from the Japanese era are especially faithful in reflecting the overall changes in Taiwan’s social structure. The street house that you seen in the re-creation here consists of a onestory southern Fujian-style building, a two-story arched street house, and a three-story Baroque-style street house, symbolizing the transformation in architecture that took place in Taiwan at this time. Previously, due to limitations of resources and technology, houses in Taiwan were mostly one-story buildings. In addition, to protect against thieves, homes were often narrow, and had both poor lighting and drainage. However, with the coming of Japanese rule, the Governor’s office invested a large amount of money in urban renewal projects. The reformation of market areas, widening of streets, and transformation of street houses changed the look of many of Taiwan’s towns and cities, creating a mix of different styles."}}},
  p517:{"n":"雜貨店","no":"517","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"雜貨店是提供一般民眾日常生活衣物、雜貨用品的小型零售商店。日本統治臺灣後，臺灣社會面臨巨大的變革，與一般民眾生活息息相關的雜貨店，也隨著出現許多新的功能與特徵。如果大家仔細觀察面前的小雜貨店，就會發現有許多日本時代特有或出現的時代痕跡。在略顯擁擠的小店裡，老闆坐在厚實的桌子後方，與身邊的老顧客聊著收音機播送的時事，顯示雜貨店擔任地方上交換、傳遞資訊場所的重要功能。在老闆背後的牆上，掛著一塊寫著「煙草小賣所」的紅色鐵牌。這鐵牌代表這家雜貨店取得總督府的認可，具備販售專賣局相關產品的資格。當時，只有信譽、財務狀況良好，且商店陳設空間整齊乾淨的店家，才有機會申請到這項資格。在四周的櫃子裡，滿滿放著各式各樣從食品、佐料到兒童玩具的雜貨商品，牆壁和柱子上處處貼著廣告海報和傳單，則反映日本時代興起的新式廣告行銷及消費文化。","img":"z-colony.jpg","d":86,"i18n":{"en":{"n":"Grocery Stores","zone":"Frustration and Dreams under a New Order","txt":"The Japanese’ rule of Taiwan brought great changes to the local society, and this was also reflected in the grocery stores on the island. If you look closely at the small shop before you now, you will see many signs of this. In the rather crowded shop, you can see the shop owner is sitting behind a big desk, chatting with a regular customer about the current events being discussed on the radio. This shows how grocery stores became a place for exchanging news and information. On the wall behind the owner, there is a red plate saying “tobacco retailer”, meaning that this grocery store had obtained a license from the Governor-General’s Office and is thus allowed to sell cigarettes and other related products. During this time, only stores with excellent financial records and reputations, and equipped with proper business spaces, could apply for the license. In the cupboards there are all kinds of products, ranging from basic foods and spices to children’s toys. There are also advertising posters and flyers glued on the walls and pillars, which show new ways of marketing and an emerging consumer culture."}}},
  p518:{"n":"吳服屋","no":"518","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"吳服屋，是販售日本和服的店家，在臺灣的出現，象徵臺灣社會服飾文化的改變。日本時代，總督府推動各項風俗改良政策，在服裝上引進西式洋服與日本傳統服裝，藉此改變臺灣人的穿著習慣。在官方與民間團體的鼓吹下，臺灣社會逐漸接受由日人引介的服飾文化，另方面也受到上海流行的影響，興起穿著旗袍的風潮，在服飾文化上產生巨大的改變。在許多這個時期的照片裡，經常可以看到穿著中式、西式與日式服裝的成員共同留影，甚至出現一個人身上混搭不同服飾文化的情況。大約在1920年代後，臺灣各地主要市街上，都已經都可以看到販售洋裝的「洋服屋」，以及我們面前這種販售和服的「吳服屋」。在接受新式服裝文化的同時，臺灣人也開始透過學校和訓練班等教育機構，學習西服與和服的剪裁。在吳服屋右側的牆上，展示日本時代洋服屋及洋裁訓練班等相關照片和證書，記錄西服與洋裁在臺灣發展的足跡。","img":"z-market.jpg","d":88,"i18n":{"en":{"n":"Kimono Shops","zone":"Frustration and Dreams under a New Order","txt":"During Japanese rule the GovernorGeneral’s Office initiated a series of “Custom Reform Policies.” In terms of clothing, the government introduced both Western and traditional Japanese clothes to the island, and they were gradually accepted by the local inhabitants. However, the fashions from Shanghai also influenced the Taiwanese people’s choice of clothes, and thus Chinese cheongsam were also seen, along with Japanese kimonos and western-style clothing. These changes in Taiwanese culture can be seen in the photos of the time, in which you can see people wearing all three different types of clothes – Western, Chinese and Japanese – and sometimes even mixing all three in a single outfit. It was in the 1920s when stores selling Western clothing and kimonos became more common on the main streets in Taiwan. In adopting the new culture, the Taiwanese people also started to learn how to make Western and Japanese clothing in schools and training classes. On the right of the kimono shop you can see some photos of the Western clothes shops and certificates for tailoring Western clothes, documenting the development of this style in Taiwan."}}},
  p519:{"n":"寫真館","no":"519","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"攝影最早在19世紀由外國旅行家、官員首度帶到臺灣，留下許多珍貴的風景和人文景觀記錄。不過，攝影技術真正被引進並在臺灣扎根是在日本時代，ㄧ些日本攝影師開始在臺灣各大城市開設被稱為「寫真館」的照相館，才慢慢帶動攝影技術的普及，讓攝影留念逐漸成為臺灣人記錄人生重要時刻的習慣。在這間「寫真館」裡，有一位攝影師操作著一臺可以調整遠近焦距的蛇腹式相機，對準前方以風景掛簾為背景的座椅，準備為客人拍照留念。兩側牆上，掛著許多當代的照片，有拍攝臺灣人文、自然景觀的，有拍攝結婚及家族聚會的，同時也有許多家庭出遊、學校校外旅行的紀念照片。透過攝影的技術，記錄臺灣攝影文化發展，社會風氣、文化生活的變化，以及觀光旅遊風氣的興起。","img":"o-flour.jpg","d":73,"i18n":{"en":{"n":"Photo Studios","zone":"Frustration and Dreams under a New Order","txt":"Photography was first introduced to Taiwan by foreign travelers and government official in the 19 th century, who left some precious visual documents of the natural and cultural scenes of the time. But it was only in the Japanese period that photography in Taiwan truly developed into a local practice. After a few Japanese photographers opened photo studios in the big cities, the Taiwanese people not only became familiar with the technology, but also developed the habit of taking photos to keep records of the important moments their lives. In this photo studio, there is a photographer operating a folding camera with a zoom, focusing on the chair with a landscape background, preparing to take photos of a customer. On the walls there are pictures taken during this era. Some are of natural and cultural scenes, and others of weddings, family reunions, or school trips. Through such images we can witness how Taiwanese photographic culture developed, how society and life were changing at the time, and how tourism flourished."}}},
  p520:{"n":"珈琲店與大眾文化","no":"520","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"店經理：「唉！我晚上忙完店裡的生意，白天還得面試，經理真不好做。不過這『女給』得好好選，會影響店裡的生意！」1930年代，臺灣曾掀起一股「珈琲店」熱潮，在店裡陪顧客聊天、飲食的女性，稱為「女給」。珈琲店貼出招聘公告，消息一出，應徵的女性蜂擁而至。\n當時的「珈琲店」和今天定義的不同，帶有酒館性質。內部裝潢多半有濃濃的西洋風格，店內燈光昏暗，有唱盤播著輕快節奏的爵士樂，以及當時流行的歌曲。\n「珈琲店」成為當時流行的聚會場所，顯示出日本時代將摩登文化帶入臺灣，改變臺灣人的傳統生活模式，除了工作賺錢外，上珈啡店、看電影、聽流行歌曲，交織出日本時代多采多姿的大眾文化。","img":"zone-card-1.jpg","d":67,"i18n":{"en":{"n":"Cafes and Mass Culture","zone":"Frustration and Dreams under a New Order","txt":"Store manager: “Yi! In the evening I’m busy with store business, and during the days I have to do interviews. Being a manager isn’t easy. But these waitresses must be well-chosen—they can affect a store’s business!” During the 1930s, Taiwan experienced a “cafe” craze. This kind of “cafe” employed women, called jokyū or “ waitresses ” who would sit with the customers and eat and chat with them. As soon as a store posted recruitment notices and the news spread, it would get a flood of applicants. “Cafes” in those days meant something else—they were more like bars. The interior décor was heavily Western in style, lights were dim, and jazz music and popular tunes would be played from record players.\n“ Cafes” became popular gathering places at the time. They showed that the Japanese era brought modern culture to Taiwan and changed the traditional lifestyle of Taiwanese. Besides working and earning money, going to cafes, watching movies, and listening to popular music were all parts of the colorful mass culture of the Japanese era."}}},
  p521:{"n":"診所","no":"521","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"日本統治初期，臺灣總督府鑒於臺灣瘧疾、霍亂等傳染病肆虐，造成嚴重的社會保健及統治問題，於是將防堵傳染病傳播及改善公共衛生環境，做為統治臺灣的重要工作之一。總督府首先在臺灣施行公醫制度，將醫療人員及資源派駐到各地，主導當地衛生與醫療事務。同時，為了解決臺灣西式醫療人才短缺，需不斷從日本內地調派人力的困境，積極推動醫學教育，培育本地醫療人才，使醫學成為臺灣人最早能接觸的高階教育之一。在日本人引進西式醫療的同時，傳統的漢醫藥並未就此消聲匿跡，反而出現許多創新與改變。診所左側的展示櫃裡，展示了這個時期出現的成藥廣告單和寄藥包。這種寄藥包內裝各種常用的成藥，懸掛於人們家中客廳牆上，供需要時取用，每隔一段時間藥廠再派人到府巡視、補充，並依藥物減少情況收費，以提供醫療資源相對匱乏的鄉村地區醫療服務。","img":"zone-card-3.jpg","d":83,"i18n":{"en":{"n":"Clinics","zone":"Frustration and Dreams under a New Order","txt":"Given the spreading of the infectious diseases in Taiwan, the Taiwan GovernorGeneral’s Office saw improving public health and social conditions as one of the top priorities during the early stage of its governance. The Office first established the public medical service to make sure that medical practitioners and resources were properly assigned across Taiwan, so that they could manage local affairs. In the meantime, as the government needed to solve the problem of importing experts from Japan to cover the shortage of Western medical specialists in Taiwan, the Governor General’s Office introduced medical education to the island, medicine thus being one of the earliest higher education subjects for the Taiwanese people. Although the Japanese actively promoted Western medical methods, traditional Han medicine in Taiwan did not simply disappear, but underwent a number of changes by adapting to the new society. In the case on the left of the clinic are advertising flyers and a set of herbal medicines from the time. Such medical kits usually contained a large range of medicines for the most common illness, and would be hung on the walls in people’s homes for them to reach when needed. Every once in a while the medicine providers would send their staff to these household to check if anything needed to be replaced, and this thus provided many underdeveloped areas with limited but much needed medical services."}}},
  p522:{"n":"宜蘭戲院","no":"522","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"娛樂事業的發展，是近代城市的重要指標。臺灣的近代摩登娛樂活動，從1930年代開始蓬勃發展，一直延續至今，取代了傳統的娛樂型態，奠下了現代流行文化的基礎戲院，是流行文化的重要傳播地。不只是在都會中，戲院在各鄉鎮中也如雨後春筍般的出現。例如在宜蘭地區，也搭上現代流行的風潮，在1933年8月，出現了第一家戲院「宜蘭座」，也就是後來的宜蘭戲院。二層樓的宜蘭戲院興建時，是用鋼筋水泥興建而成，建築總共花費了花費三萬四千餘日圓，這在當時的宜蘭地區，可算是首屈一指的。興建的發起人，並不是日本人，而是由一群臺灣仕紳商人聯合集資而成的。顯然當時的現代生活娛樂，已經深植到臺灣人的心目中了。","img":"zone-card-4.jpg","d":68,"i18n":{"en":{"n":"Ilan Theater","zone":"Frustration and Dreams under a New Order","txt":"The development of the entertainment industry is an important indicator of a modern city. Taiwan’s new forms of entertainment rose in the 1930s and have continued to the present, replacing many traditional ones and setting the stage for modern popular culture. Theaters were major places for the spread of popular culture. They appeared not only in the capital, but also began to pop up in many towns and villages. For example, the Ilan area kept up with the times by witnessing the opening of its first theater in August of 1933. Called the Ilan Palace, it became known as the Ilan Theater in later times. Construction of the two-story Ilan Theater involved the use of reinforced concrete, with the total cost coming to 34,000 yen, a considerable amount at the time, and making it a prime symbol on the development of the area in those days. It should be noted, however, that the people behind the theater’s construction were not Japanese, but a group of Taiwanese gentry and merchants who pooled their resources to build it. It was at this time that modern forms of life and entertainment became firmly planted in the minds of many Taiwanese, even those outside of the capital."}}},
