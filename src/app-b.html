  p523:{"n":"戰爭總動員","no":"523","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"1937年後日本陷入漫長的戰爭，總督府一方面加強糧食、礦物、工業產品等物資的生產與控管，同時徵收民間金屬等物品，轉為各種軍事用途使用，另一方面透過開徵稅收、發行公債、鼓勵積蓄等方式徵集民間資金，以支應戰爭日趨沉重的開銷。隨著戰事的擴大和延長，日本人力資源逐漸枯竭，被迫開始徵招原本不能兵役的殖民地人民上戰場。開始時，總督府僅徵調臺人擔任軍伕、軍屬等輔助性工作，但自1942年起戰局漸趨不利，總督府開始以「志願兵」的方式，讓臺灣人以軍人身份投入戰場。當時，受到皇民化氛圍、媒體宣傳以及總督府強力動員的影響下，許多人紛紛「志願」入伍。到了1944年公告實施徵兵制，1945年起在臺進行徵兵，但僅實施一期後日本就戰敗。當時在應徵者出征前夕，往往會舉行盛大的送行儀式，除了家屬之外，還會動員學生和地方官員前來列隊送行，以突顯為國奉獻的精神，塑造社會上的愛國氛圍。","sign":true,"sv":"sign/25.mp4","sp":"sign/25.jpg","img":"sign/ph-25.jpg","d":90,"i18n":{"en":{"n":"Total Mobilization in the War","zone":"Frustration and Dreams under a New Order","txt":"After 1937, Japan was dragged into the long battle of World War II. This drove the Governor-General’s Office to strengthen its control of food, mines, and industrial products in Taiwan, while at the same time taking metal products for military use. It also collected funds to pay for the increasing war expenses by introducing new taxes, issuing public bonds, and encouraging savings. With the expansion and prolonging of the war, human resources on Japanese soil were beginning to dwindle, which forced the Japanese government to enlist men in the colonies who had once been rejected from the Japanese army. At the beginning, the Governor-General’s Office only drafted Taiwanese people for positions such as translators and in logistic services. In 1942, however, the war gradually turned against Japan, and the GovernorGeneral’s Office started to let Taiwanese volunteers serve as soldiers. Under the auspices of the Japanization movement, propaganda, and mobilization, many Taiwanese volunteered, or were forced to ‘volunteer,’ to fight in the war. In 1944, the Japanese government enacted military conscription and started to conscript Taiwanese soldiers in 1945—although this only lasted one term before Japan was defeated. At the time, soldiers would have a grand farewell ceremony before they were sent to the battlefield. In addition to the soldiers’ families, the government would also mobilize local students and officials standing in lines to send off the soldiers, in order to show their willingness to make sacrifices and build the image of a patriotic society."}}},
  p524:{"n":"戰線後方的生活","no":"524","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"第二次世界大戰後期，臺灣深陷戰爭的漩渦，在動員臺灣人投入戰場的同時，留在臺灣的人們，開始面對戰爭下的嚴苛生活。1943年起，盟軍開始頻繁空襲臺灣，各類官、私建築設施遭到攻擊，許多都市居民因此被迫疏散到鄉村地區，防空警報聲與躲防空洞的經驗，成為人們共同的時代記憶。展櫃中的手搖空襲警報器、避免燈光外洩的防空燈罩、保護頭部的防空頭巾和寫上姓名、血型等資料的名牌，都道出在空襲威脅下生活的無奈與恐懼。總督府為了修復空襲中損壞的道路、機場等設施，在各地組織勞動奉公班，動員平民百姓參加各種戰備工作。戰爭下的婦女也被賦予支援前線的任務，不但要投入生產，填補男性被徵招後留下的空缺，為了提振前方軍隊士氣，許多人還被動員參加愛國婦女會一類後方組織，負責製作「慰問袋」等工作。慰問袋原本是由士兵家屬自行縫製，裡頭裝著寄給前線家人的香菸、餅乾等小物件的袋子，後來改由日本軍方接手統一管理，由各級學校和婦女團體生產製造。","img":"theme-1.jpg","d":95,"i18n":{"en":{"n":"Life Behind the Front Line","zone":"Frustration and Dreams under a New Order","txt":"Taiwan was dragged into later stages of the Second World War, and while many Taiwanese were mobilized to fight on the front lines, those who stayed behind also faced their own sort of war. Starting in 1943, Taiwan became one of the targets for the Allied forces. Frequent air strikes were conducted on all public and private facilities, and thus the residents in the cities were evacuated to the countryside. Such experiences, along with the sounds of air-raid sirens and the smells of bomb shelters, shaped the memories of many of the Taiwanese people during this time. The hand cranked air-raid siren, lamp cover, air-raid hood, and nametags with blood types—these items in the cabinet reveal the fear and helplessness of the Taiwanese while living under the threat of air strikes. To repair facilities, such as roads and airports, that were damaged during air raids, the Governor-General’s Office mobilized civilians into groups to meet various logistical needs. Meanwhile, women were also given tasks to support the front lines. They not only needed to fill in the vacancies in supply production left by the enlisted men, but they were also called on to make things such as the Imonbukuro—the soldiers’ comfort bags. Imon-bukuro were originally made by families of soldiers, in which they would put small items from their hometown, such as cigarettes and cookies, to send to the front lines. Such tasks were afterwards taken over by the Japanese army, which organized schools and female groups to standardize the manufacture of such items."}}},
  p525:{"n":"二戰下的臺灣人","no":"525","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"母親：「阿仁，拍完照，我們全家一起去廟裡拜拜，你一定要平平安安的回家。千萬不要像隔壁的阿明，被徵召到南洋戰場後，就再也沒回來。」這裡正在舉行一場出征儀式，上戰場前，與家人合照留念幾乎是當時出征家庭的共同儀式。1937年中日戰爭爆發，臺灣總督府為了讓臺灣人同心協力支援戰爭，大力推動皇民化運動，鼓勵臺灣人學日語、改日本姓名、參拜神社。這些政策的目的是將人民改造成真正的日本人，將身心靈都奉獻給天皇。\n隨著戰爭規模擴大，臺灣總督府也加強動員殖民地的物資與金錢，例如鼓勵糧食生產、獎勵儲蓄，甚至徵收家中的金屬物品，像是鍋子、門把等，都被重新改造為軍用品。同時，臺灣總督府也徵召臺灣人上戰場，當時從軍的臺灣人有些是被迫、有些則是為了與日本人平起平坐或愛國心的驅使下而志願從軍。到了第二次世界大戰後期，盟軍飛機密集轟炸臺灣各大城市，連一般住宅也成為目標，當時臺灣人整天提心吊膽，一聽到空襲警報，就往防空洞躲，或是跑到山區避難。許多老一輩的臺灣人，至今仍有躲避空襲的恐怖回憶。","img":"theme-4.jpg","d":103,"i18n":{"en":{"n":"Taiwanese People During World War II","zone":"Frustration and Dreams under a New Order","txt":"Mother: “Aren, after we take the photo, let’s have everyone in the family go to the temple and worship—you must be able to get back home safely. Don’t be like Aming next door—drafted to the South Pacific battlefield, never to return.” A sending-off-to-battle ceremony is being held here: before a man went off to war, having pre-departure photos with the family was a virtually universal ritual. When the Sino-Japanese War broke out in 1937, the Taiwan Governor-General’s Office vigorously promoted the Japanization Movement and encouraged Taiwanese to learn Japanese, adopt Japanese names, and visit Shinto shrines. The aim of these policies was to transform them into true Japanese people, willing to dedicate their minds and bodies to the emperor. As the war expanded, the GovernorGeneral’s Office also enhanced the mobilization of money and material throughout the colony. For instance, it encouraged food production, rewarded savings, and even requisitioned metallic objects in homes, such as cooking pots, doorknobs, and so on, which were remade into military supplies. At the same time, the Governor-General’s Office recruited Taiwanese into the Japanese army. Some at the time were forced to join, and others volunteered, motivated either by the desire to become equal to the Japanese or by patriotism.\nIn the latter part of World War II, Allied planes heavily bombarded Taiwan’s major cities, and even general residential areas became targets. Taiwanese people felt they were on tenterhooks all day long, and as soon as they heard an air-raid siren, they would run and hide in air-raid shelters or take refuge in the mountains. Many elderly Taiwanese still have terrifying memories of avoiding air strikes."}}},
  p526:{"n":"戰爭記憶","no":"526","fl":"2F","zone":"新秩序下的苦悶與夢想","voice":false,"txt":"第二次世界大戰期間，有許多臺灣人參與戰爭，例如眼前這個遺物盒的主人，林清春，他是一位臺籍日本兵，在服役時遭遇空襲陣亡，當年日軍送回來的遺物盒裡，裝著指甲、頭髮和衣服，而木盒上的數字「92」，代表遺體編號。林清春的母親非常傷心，一直將木盒帶在身邊，並經常取出來端詳，藉此想念兒子。在母親過世後，林清春的弟弟決定將木盒捐贈給博物館，在捐贈時他說：林清春弟弟：阿兄啊，以後這個盒子要到博物館去了，今天我決定把這個捐給博物館，希望這個盒子可以給大家看一看，讓我們的後代知道有這樣一個東西，有你這一件事情……\n二次大戰除了對當時的臺灣人造成傷痛外，戰爭結束後帶來的身分認同的轉折，也成為臺灣人既矛盾又複雜的歷史記憶。透過博物館收藏並展出這個遺物盒，可以作為臺灣人曾經參與二戰的歷史見證。","img":"theme-5.jpg","d":83,"i18n":{"en":{"n":"War Memories","zone":"Frustration and Dreams under a New Order","txt":"Many Taiwanese fought in the World War Ⅱ , such as Lin Ching-chun, whose belongings have been placed in the box in front of you. It is called a box of belongings left by the deceased. A Taiwanese, Lin served in the Japanese military and was killed during an air raid. The Japanese sent back these wooden boxes which contained the fingernails, hair, and clothing of the deceased. This particular box is marked with the number “92”. Lin Ching-chun’s mother was devastated by her son’s death and kept this box by her side and often took it out and looked at it to remember him. After her death, Lin Ching-chun’s brother decided to donate this box to the museum. When he did, he said the following.\nLin Ching-Chun’s younger brother: Brother, this box will be in the museum soon. I decided to donate it in the hopes that those who see it will know about this thing and know about you …\nWorld War Two brought pain to the people of Taiwan, but it also caused a change in identity which resulted in complicated and mixed historical memories. Having this box of belongings left by the deceased in the museum’s collection and displaying it serves as a testimony that the people of Taiwan fought in WWII."}}},
  p601:{"n":"戰後大遷徙","no":"601","fl":"2F","zone":"走向民主這條路","voice":false,"txt":"眼前這只皮箱的主人是舞蹈家李惠美，她的本名是鈴木惠美子，出生成長於日本，我們來聽聽她的故事……\n李惠美：當年我到滿洲國，卻因為戰亂被困在東北無法回家，在當地認識了我的丈夫。國共內戰爆發後，我們夫妻倆隨軍隊遷徙了大半個中國，最後遷到臺灣來，定居在高雄鳳山。戰後的生活困苦，再加上女兒也出生了，總覺得生活充滿了挑戰，但我始終沒有忘記我最熱愛的舞蹈，後來我成立了這間舞蹈研究社，教的是民族舞、芭蕾舞、踢踏舞等等，可都是當時最活潑、最時髦的舞蹈喔！每次演出都得到滿堂喝采！\n二次大戰結束後，原先居住在臺灣的日本人，大多數遭到盟軍遣返回國。部分參與戰爭的臺灣人，或是移居海外的臺灣人，也在此時藉由各種途徑回臺。1948年年底，政府於國共內戰失利，大批軍民陸續遷入臺灣。一波接著一波的人口移動，不僅帶來社會結構的改變，也為臺灣注入新的文化內涵。藉由這只皮箱，我們看見在動盪年代顛沛流離的人群，最後在臺灣這塊土地上安身立命的故事。","sign":true,"sv":"sign/26.mp4","sp":"sign/26.jpg","img":"sign/ph-26.jpg","d":78,"i18n":{"en":{"n":"Post-war Migration","zone":"The Road to Democracy","txt":"The suitcase in front of you belonged to dancer Li Hui-Mei who was born in Japan and whose original name was Suzuki Emiko. Let’s listen to her story.\nLi Hui-Mei: I was in the State of Manchuria when war broke and was unable to leave northeast China and return home. It was there that I met my husband. After the civil war between the Communist Party of China and the Kuomintang erupted, the two of us traveled with the army as it moved around a large part of China. We ended up in Taiwan and settled down in Fengshan, Kaohsiung. Life after the war was hard and our daughter was born. Life was filled with challenges, but I never forgot my passion: Dance. I later founded this dance research center where we taught the liveliest and most popular dance styles of the time, like folk dance, ballet, and tap dancing. Every performance we had brought down the house!\nAfter World War Two, most of the Japanese who had lived in Taiwan were repatriated to Japan by the Allies. Some Taiwanese who fought in the war and others who had emigrated to other countries, returned to Taiwan any way they could. In late 1948, the government suffered setbacks in the civil war and large numbers of military personnel and civilians poured into Taiwan. Wave after wave of people brought changes to the society and culture. This leather suitcase tells us the story of the displaced people who endured many hardships before they ended up in Taiwan where they could finally settle down and live normal lives again."}}},
  p602:{"n":"二二八事件","no":"602","fl":"2F","zone":"走向民主這條路","voice":false,"txt":"二戰結束後，由於民生經濟崩潰、社會動盪不安，導致人民對政府積怨日深，終於在1947年因為取締私煙而爆發二二八事件。衝突擴散至全島後，臺灣各地的情勢有所不同，其中以嘉義軍民對峙最為激烈。當時擔任嘉義市參議員的陳澄波，與當地士紳一同前往和政府的軍隊協商，結果遭到逮捕和刑求，在被公開槍決的前夕，陳澄波在紙片上，寫下了幾張遺書，我們眼前就是其中一張……\n陳澄波邊念邊寫遺書：（以炭筆寫字的聲音）我兒啊~這是你父親澄波的遺言。今日我能為了十二萬嘉義同胞而死，也算是問心無愧了。父親走後你要好好孝順母親，兄弟姐妹間也要和睦相處、共同扶持。與我自身的命運相比，父親更擔心你們的將來，若是日後生活有困難，就將家中物品變賣。澄波淚筆。\n在陳澄波受害後，他的妻子小心保存遺書、受害時的衣服和相關底片，有將近四五十年的時間都不敢拿出來。一直到1987年解嚴後，社會各界積極要求政府平反並公布真相，二二八事件才得以公開討論。當年收藏保存的受難者遺物，也成為後世揭露歷史真相的重要物證。","sign":true,"sv":"sign/27.mp4","sp":"sign/27.jpg","img":"sign/ph-27.jpg","d":98,"i18n":{"en":{"n":"The 228 Incident","zone":"The Road to Democracy","txt":"In the wake of WWII, economic collapse and social unrest brought about increasing resentment against the government, which eventually erupted in 1947 in the 228 Incident, which was directly triggered by sales of illicit cigarettes. The conflict spread throughout Taiwan, with different situations developing all over the island, among them confrontations between the military and civilians in Chiayi being the most intense. Chen Cheng-po, a Chiayi City Council member, went with other members of the local gentry to engage in negotiations with the military, but was arrested and tortured. Prior to his public execution, Chen Cheng-po wrote a letter. The paper in front of you is one of the pages from the letter.\nChen Cheng-po (reading aloud as he writes): (The sound of writing with chalk) My Son … these are the last words of your father, Cheng-po. Today, as I prepare to die on behalf of my 120,000 fellow citizens of Chiayi, I have a clear conscience. After I’m gone, be a good son to your mother. I also want all of you children to get along and help each other. I’m more concerned about your futures than I am about my own fate. If life becomes difficult, sell off our belongings. Written with tears, Cheng-po\nAfter his execution, Chen Chengpo’s wife carefully preserved his final letter. For 40 or 50 years afterChen’s death, she was afraid to look at the clothing that he wore when he was put to death or the negatives of the photos taken afterward. It wasn’t until the lifting of martial law in 1987, and people throughout society calling on the government to redress the issue and make the truth publically known, that the 228 Incident could be openly discussed. Items left behind by victims became important evidence for revealing the truth of history."}}},
  p603:{"n":"越禁越有勁","no":"603","fl":"2F","zone":"走向民主這條路","voice":false,"txt":"兩位唱片公司人員正在討論唱片遭到查禁的事，我們一起來聽聽看……\n唱片公司員工A：怎會這樣呢，我們公司好不容易發行了一張這麼受歡迎的唱片，現在跟我說不能播了！唱片公司員工B：審查單位說「今天不回家」的歌名會妨害家庭溫馨，這可怎麼辦呢？唱片公司員工A：這樣吧，我們換個名字，把唱片封套改成「今天要回家」再重新發行！\n1949年後臺灣進入長期戒嚴，依據「臺灣省戒嚴期間新聞紙雜誌圖書管制辦法」，臺灣省保安司令部，也就是後來的警備總部，成為各類出版品的審核主管機關。除了書之外，電影、歌曲等影視作品，政府也會進行審查，動不動就以為匪宣傳、暴力、色情等理由，發布特定書刊或歌曲的禁令。雖然上有政策下有對策，被禁止的內容仍透過各種方式到處流通，不過在長期的審閱查禁制度之下，創作者與出版者不免自我審查，成為「人人心中都有小警總」。政府推動的政治觀念與意識形態，也深刻地影響了整個臺灣社會。","img":"rec-1.jpg","d":94,"i18n":{"en":{"n":"The More It’s Banned, the More It Spreads","zone":"The Road to Democracy","txt":"Two record company employees are discussing the banning of one of their records. Let’s listen in.\nRecord Company Employee A: What the heck! Our company finally released a popular record like this and now we’re not even allowed to play it?! Record Company Employee B: The government censors said that the title of the song Not Going Home Today is not conducive to happy homes. What can we do? Record Company Employee A: Well, how about we change the name on the album cover to Going Home Today and re-release it?\nAfter 1949, Taiwan was placed under martial law for a long time. In accordance with “Rules Governing the Control over the Newspapers, Magazines and Books during the Martial Time”, the Taiwan Provincial Security Command, later renamed the Garrison Command, was put in charge of checking and approving various publications. In addition to books, the government also reviewed audio and video works, such as movies and songs. Books, periodicals, and songs were subject to censorship for such reasons as Communist propaganda, sex, and violence, but people still had ways to get around government policies, so banned content remained in circulation. On the other hand, faced with long-term censorship, creators and publishers became self censors, checking their own work. The political ideas and ideologies promoted by the government had a huge impact throughout Taiwan society."}}},
  p604:{"n":"眷村記憶與文化","no":"604","fl":"2F","zone":"走向民主這條路","voice":false,"txt":"1949年隨政府來臺的百萬軍民，是臺灣近代數量最多、規模最大的移民浪潮。當時，來臺的軍人及眷屬被依照軍種和階級，安排遷入散佈全臺的臨時居所，形成所謂的「眷村」聚落。在眷村中，居民共享特殊的時間、空間背景，透過從家鄉帶來的記憶、飲食、鄉音等元素，凝聚共同的時代經驗、向心力與歸屬感，形塑眷村獨有的特殊文化。眷村的故事，也成為文學作品及電影常見的素材，如《小畢的故事》和《竹籬笆外的春天》，都是以眷村為背景的創作。近年受到都市化等因素影響，各地眷村面臨拆除、改建的命運，加上眷村第一代的凋零和年輕世代向外發展，過往獨特的文化場域漸漸消逝，促使各方開始重視眷村文化的保存，如保留具代表性的眷村聚落，並設置相關文化機構，希望為臺灣保存這份特有的生活記憶。","img":"rec-3.jpg","d":77,"i18n":{"en":{"n":"Dependent Villages: Memories and Culture","zone":"The Road to Democracy","txt":"In 1949, over a million military men and civilians moved to Taiwan along with the ROC government, and these formed the biggest wave of immigration in modern Taiwanese history. Arriving in Taiwan, the military and their dependents were allocated to temporary shelters across Taiwan, according to their rank and service. These settlements gradually became what we now know as the military dependents’ villages. In these villages, residents shared similar experiences and backgrounds, and thus after living together for decades they developed their own culture and sense of identity by sharing the memories, foods, and accents they brought from their hometowns. Stories of these villages became integrated into modern Taiwanese literature and movies. The Taiwanese films Growing Up and The Spring Outside of the Fence, for example, are both stories based on military dependents’ villages. Today, under the influence of urbanization, many of these villages are now facing the prospect of being demolished or reconstructed. Meanwhile, with the passing away of the first generation in these villages, and the departure of the younger inhabitants, the disappearance of this once-thriving culture has given rise to an urge to preserve these sites and establish cultural organizations. In this way, these villages can be preserved not just as evidence of military settlements and history, but as visible signs of the important memories and cultures they hold."}}},
  p605:{"n":"爸爸的星象盤","no":"605","fl":"2F","zone":"走向民主這條路","voice":false,"txt":"胡鑫麟兒子：爸爸，你說這張星象盤，是你在綠島時自己做的，這是真的嗎？好厲害喔！畫得好好看，你能把它送給我嗎？胡鑫麟：（半開玩笑的口氣）呵呵，是啊！我那時想著，若是有一天可以划船逃離綠島，有了這星象盤，就不會在太平洋裡迷失了。現在送給你，你要好好保管喔！\n胡鑫麟是白色恐怖時期，第一批被送往綠島的政治犯，他在擔任臺大醫院眼科主任醫師時，遭到情治人員逮捕，以涉嫌參加叛亂組織的罪名，被判刑十年。在綠島服刑期間，醫療資源非常匱乏。當時胡鑫麟和許多受難醫師共同組織醫療隊，請家人從臺灣寄來藥品和器材，在克難的環境中，醫治難友、官兵和眷屬，後來也為居民看診。刑滿出獄後，胡鑫麟仍然受到情治單位的監控，為了怕連累家人，便和妻子到東京定居，在看診之餘，致力於編寫臺語辭典，而星象盤也成為白色恐怖時代最有力的見證。","img":"work-3.jpg","d":84,"i18n":{"en":{"n":"Dad’s Planisphere","zone":"The Road to Democracy","txt":"Hu Hsin-lin’s Son: Daddy, you said that you made this planisphere when you were on Green Island. Is that true? Wow! You’re really good! You did a great job. Can I have it?\nHu Hsin-lin: (Half-jokingly) Ha ha. Sure! When I was drawing this, I was thinking that if one day I had a boat that I could row to get away from Green Island, I wouldn’t get lost somewhere in the Pacific Ocean if I had a planisphere. Now, it’s yours. Take good care of it.\nHu Hsin-lin was in the first batch of political prisoners sent to Green Island during the period of White Terror. When he was a chief physician in the National Taiwan Hospital’s ophthalmology department, he was arrested by intelligence personnel on suspicion of being a member of an insurgent group and was sentenced to ten years. When serving time on Green Island, medical resources were very scarce. Hu Hsin-lin and a number of other doctors imprisoned there organized a medical team and asked families to mail drugs and equipment from Taiwan. In that adverse environment, they were able to treat other prisoners, military personnel, and dependents. Later, they also provided medical assistance to local residents. After his sentence was up and he was released, Hu Hsin-lin continued to be surveilled by intelligence agencies. Fearful that his family would be implicated, he and his wife moved to Tokyo. When he wasn’t seeing patients, he devoted his time to compiling a Taiwanese dictionary. His planisphere became one of the most powerful testimonies of the White Terror period."}}},
  p606:{"n":"地下經濟","no":"606","fl":"2F","zone":"走向民主這條路","voice":false,"txt":"新竹縣尖石鄉泰雅族部落，在1970年代盛行種植香菇。族人為了取得栽培香菇所需的原料，經常進入部落附近的國有林地，因而面臨林務局人員的取締….\n泰雅族人A：快點快點，有戴安全帽的人騎車上山了，應該是巡山員來了，趕快去通知在山上工作的族人！泰雅族人B：好，我去敲織布機通知大家！\n泰雅族人C：欸~警報響了啦，巡山員上山了，趕快把東西收一收，香菇也不要弄了！泰雅族人D：沒問題的，我已經把火滅了，巡山員不會發現的。\n日本時代將絕大部分的山林地收歸國有，一直到戰後也延續這個規定，使得原住民的生活空間受到壓縮。族人為了生計，經常使用鄰近的國有林地。從原住民的角度來說，他們認為自己是在傳統領域裡使用土地和森林，但從林務局的角度，族人的行為是違反國家規定。當原住民族和國家在資源使用上產生矛盾與衝突時，泰雅族人卻將傳統織布機轉化為自我保護的武器，並從中衍生出一套生存機制。","img":"work-hero.jpg","d":92,"i18n":{"en":{"n":"Underground Economy","zone":"The Road to Democracy","txt":"In the 1970s, growing shiitake mushrooms became prevalent in the Atayal villages in Jianshi Township, Hsinchu County. To obtain the materials needed to raise shiitake mushrooms, members of the tribe frequently entered nearby national forest lands which resulted in a crackdown by the Forestry Bureau.\nAtayal A: Hurry up. Somebody wearing a helmet is riding a motorcycle up the mountain. It’s probably somebody on patrol. Go warn the others working up the mountain. Atayal B: Okay, I’ll go bang on the loom to let them know.\nAtayal C: Huh?! The alarm! Patrol personnel are coming up the mountain. Gather everything and let the shiitake mushrooms be! Atayal D: Alright! I already put out the fire. They won’t find it.\nDuring the Japanese era, the vast majority of mountain forests were nationalized and remained that way even after the war, effectively shrinking the living space of the indigenous peoples. To make a living, they often had to use nearby nationalized forest lands.\nIndigenous peoples felt that they were using the land and forests of their traditional territories, but the Forestry Bureau saw things differently. They felt that the indigenous people were violating national regulations. When resource issues arose between indigenous peoples and the government, the Atayal used their traditional looms as a means for protecting themselves and to help them survive."}}},
  p607:{"n":"臺灣經濟發展","no":"607","fl":"2F","zone":"走向民主這條路","voice":false,"txt":"母親：「阿慶啊，這些手工傍晚前就得送去給工廠，人家趕著要出貨。我跟隔壁伯母都在趕工，你也趕緊多幫忙做一些」。林國慶：「好！」（語氣：積極想幫忙媽媽的心情！）媽媽帶著小孩圍坐在客廳板凳上，一邊聽著電視、一邊串聖誕燈泡，這種｢家庭代工｣的場景，在40年前的臺灣是很普遍的現象。\n自1950年代起，政府開始推動臺灣工業發展，原本以農業為主的社會逐漸轉型，開始利用臺灣勤奮、廉價的勞動力發展代工產業，設立加工出口區，吸引美日等國家投資。後來，為了增加生產，也鼓勵在家照顧小孩的婦女，把工廠手工拿回家做。臺灣的產業從代工中也摸索研發出自己的品牌，逐漸在國際打出知名度。隨著科學園區建立，臺灣躍升為高科技生產國。","sign":true,"sv":"sign/28.mp4","sp":"sign/28.jpg","img":"sign/ph-28.jpg","d":104,"i18n":{"en":{"n":"Taiwan’s Economic Development and Prospects for the Future","zone":"The Road to Democracy","txt":"Mother: “Aqing, this handiwork has to be sent to the factory before evening— they’re rushing to ship. The auntie next door and I are both working hard, and you’ll need to do more to help.” Lin Guoqing: “No Problem!” The mother leads her children as they sit on benches in the living room, and they string Christmas bulbs together while listening to the TV. This “family OEM” scene was a common phenomenon in Taiwan forty years ago.\nStarting in the 1950s, the government promoted Taiwan’s industrial development, and what was once an agricultural society was gradually transformed. At first it used Taiwan’s diligent and inexpensive labor force to develop OEM or “offshore equipment manufacturing.” It set up processing and export zones and attracted investment from the United States, Japan, and other countries. Later on, in order to increase production, women who had to take care of children were encouraged to take items from the factory for hand-assembly at home. Through the OEM process, Taiwan’s industries also explored and developed making their own brands, which gradually became famous in the international market. Following the establishment of the Science Parks, Taiwan became a high-tech producer."}}},
  p608:{"n":"客廳即工場","no":"608","fl":"2F","zone":"走向民主這條路","voice":false,"txt":"大家或許會有點印象，在民國六、七十年代的時候，很多人家裡面的客廳，常常堆滿了一堆手工加工品，很多同學一下課後，就要趕著離開，他們不是要去補習，而是要回家幫忙。為什麼呢？這是因為他們在做家庭代工。1972年，當時的省政府主席謝東閔喊出了「客廳即工場」的口號，鼓勵本來在家煮飯帶小孩子的婦女，利用家事空檔，坐在客廳的椅子上，作著代工的工作。這對當時的婦女而言，是個不錯的工作型態，不用離開家裡，就可以在家就近照顧小孩、做家事，而且還能貼補家用。廠商也因為這樣不用大肆招募，就可以得到便宜的婦女勞動人力。每個客廳生產出來的東西或許都不多，但是全民生產風潮一點一滴累積起來，就成為一股帶動臺灣經濟起飛的力量了。","img":"work-2.jpg","d":72,"i18n":{"en":{"n":"Your Living Room is a Factory","zone":"The Road to Democracy","txt":"Many people of the older generation in Taiwan may recall that back in the 1970s and 80s manufacturing equipment and semi-finished products could be found in the living rooms of many homes. Students would often rush off after classes, not to go to cram schools, but to their homes. Why? That’s because they were helping out with manufacturing there. It was in 1972 that the then-chairman of the provincial government, Xie Dongmin, came up with the slogan, “Your living room is a factory,” encouraging many women with children to use their spare time from household duties to sit in their living rooms and do outsourced factory work. For many women at the time, it was a convenient arrangement. They could stay at home and take care of the children and the house while also adding a little to the family income. Factories also did not need to recruit large numbers of workers, because they could depend on the cheaper labor of women at home. Though a single living room may not be able to produce very much, the output of all of them combined helped provide much the force for Taiwan’s economy to take off."}}},
  p609:{"n":"持續的挑戰","no":"609","fl":"2F","zone":"走向民主這條路","voice":false,"txt":"臺灣在解嚴後，各種訴求的社會運動浮上檯面，經過一連串的抗爭與政治改革，各項公民權利得到了更多的保障。但因為發生不少苦難辛酸的社會事件，讓我們驚覺仍有許多問題，需要大眾持續關心與改進。我們眼前一顆顆色彩繽紛的石頭，不僅畫出原住民族對於土地的情感，也訴說著一段勇敢爭取權益的故事。\n2017年，在總統府前的凱達格蘭大道上，由原住民團體發起了一場爭取傳統領域的抗爭，他們長達數年夜宿在凱道上，主張原住民族對土地使用的權利。各地區的部落為了表達支持，紛紛以故鄉的石頭，彩繪各種圖騰，送到凱道上，就連非原住民族也以各種方式表達支持和聲援。這起抗爭不僅獲得臺灣各界不同層面的關注，同時也帶回了人們對土地的關心。請各位環顧四周，我們的身邊還存在著許許多多持續發生的議題，讓我們一起來聆聽他們分享的故事。","sign":true,"sv":"sign/29.mp4","sp":"sign/29.jpg","img":"sign/ph-29.jpg","d":104,"i18n":{"en":{"n":"Continuous Challenges","zone":"The Road to Democracy","txt":"After martial law was lifted, social movements with all kinds of demands popped up in Taiwan. Following a series of struggles and political reforms, civil rights were better protected. But there are still many painful incidents occurring in our society that caused us to realize that there are still many issues that need our attention and to be improved. The colorful rocks in front of us now not only represent the sentiments that the indigenous peoples have for their land, they also tell the story of the brave people who have fought for their rights.\nIn 2017 on Ketagalan Boulevard in front of the Presidential Office, indigenous groups began to fight for their traditional territories. They protested on Ketagalan Boulevard for years, even sleeping there at night, claiming that indigenous peoples have the right to use the land of their traditional lands.\nTribes from all over expressed their support by painting things on stones from their lands and sending them to Ketagalan Boulevard. Even people who were not from the indigenous groups voiced support and solidarity in various ways. This fight gathered all the eyeballs of the society and caused people to place their attention once again on the land.\nPlease look around you. Many problems continue unabated. Let us listen as they share their stories."}}},
  p701:{"n":"大家的博物館","no":"701","fl":"2F","zone":"大家的博物館","voice":false,"txt":"剛剛我們一起走過了漫長的臺灣歷史，分享了關於臺灣過往的點點滴滴，透過展覽中的各種物件與記憶，我們可以知道每個人都是臺灣歷史的一部分，也都正在共同參與、創造臺灣的未來。展覽的最後，來到了「大家的博物館」展廳，裡面有各式各樣的生活器物、宗教用品、交通工具。現在，邀請您為這些物件賦予您的詮釋與觀點，在博物館中留下屬於您的選擇與故事。探索臺灣故事的旅程，到這裡告一段落。國立臺灣歷史博物館歡迎您的再度蒞臨，謝謝，再見！","sign":true,"sv":"sign/30.mp4","sp":"sign/30.jpg","img":"sign/ph-30.jpg","d":90,"i18n":{"en":{"n":"Museum for Everyone","zone":"Museum for Everyone","txt":"During our little journey down through the history of Taiwan, we saw some interesting details of the island’s past. It is our hope that through the items and memories showcased here at the exhibition, you will come to realize that everyone is a part of Taiwan’s history and that we are participating in and creating Taiwan’s future. Here at the end of our journey is the exhibition hall titled Museum for Everyone. In it, you can find all kinds of implements used in daily life, religious paraphernalia, and modes of transportation. We’d like to invite you to look at these items and offer your own commentary and thoughts on them, so that you can leave your own story here with the museum. Our exploration of the story of Taiwan comes to a close here. The National Museum of Taiwan History invites you to come again. Thank you and see you next time."}}},

  w6:{n:'走向民主這條路', d:190, sign:true, no:'215', img:'work-hero.jpg', fl:'2F', zone:'常設展廳'},
  mz1:{n:'單元一｜海濱神姑：海口女巫的天后之路', d:110, no:'411', img:'mazu.jpg', fl:'4F', zone:'第一特展室', txt:'媽祖原為只知其姓的巫女林氏，經由歷代對媽祖顯聖事蹟的層累，形塑出神通廣大的女聖人樣貌，可看見媽祖在政治與宗教力量塑造下，成為護國救民的英烈天妃。本單元透過17至19世紀的圖像與經典文獻，看見媽祖的形象在官方與民間的共同詮釋下，逐步確立為天后林默的過程。'},   /* 萬相天后特展：單元名稱與文字照 A 版（官網展覽頁） */
  mz2:{n:'單元二｜海上福星：媽祖信仰傳播的航跡', d:115, no:'412', img:'mazu.jpg', fl:'4F', zone:'第一特展室', txt:'媽祖的海上神蹟，深受閩、粵兩地崇奉。明代以來，隨著頻繁的海上活動，媽祖信仰從中國東南沿海出發，沿著貿易路徑向東亞諸國延伸。船員與移民隨身攜帶的神像與聖物，使媽祖香火得以越過汪洋，在異鄉落地生根；延伸至臺灣後，又向外輻射至世界各地。'},
  mz3:{n:'單元三｜盛裝駕到：千變萬化的臺灣天后', d:120, no:'413', img:'mazu.jpg', fl:'4F', zone:'第一特展室', txt:'媽祖信仰深入臺灣後，因地域與族群的差異，被賦予不同的稱呼與形象：是榮及雙親的孝女，是慈愛赤子的媽婆；能以施藥救疫，也在戰火之中顯聖。除了多樣性的神像外，冠服、神輿與時尚精品，也形塑出不同時代的媽祖樣貌。'},
  mz4:{n:'單元四｜萬年香火：當靈力鑄化為聖物', d:125, no:'414', img:'mazu.jpg', fl:'4F', zone:'第一特展室', txt:'無形的靈力，憑附於有形的物件，亦降於大符與各類聖物；承受香火的香爐與運載神火的香擔，是最關鍵的靈力載體。進香、遶境與過爐，是親近媽祖的神聖時刻，也是廟與廟、人與人之間交通互動的時刻，將世代的信仰記憶傳承下去。'},
  mz5:{n:'單元五｜善願必佑：在當代與媽祖相遇', d:130, no:'415', img:'mazu.jpg', fl:'4F', zone:'第一特展室', txt:'隨時代更迭與社會結構變化，天后以各類形式顯聖與再現。數位科技改變了信仰傳播途徑，媽祖信仰以媒體直播與影像跨越地域限制；素昧平生的人們也因「結緣品」而聚合，比肩同行，使媽祖信仰得以歷久彌新。'},
  s1:{n:'原住民族的語言與名字', d:196, no:'206', voice:false, sign:true, img:'rec-2.jpg', fl:'2F', zone:'常設展廳'},   /* 只有手語版的展品（示意） */
  r2:{n:'臺灣文化協會會歌', d:202, no:'210', img:'player-photo.jpg', fl:'2F', zone:'常設展廳'},
  bd0:{n:'零、非關公民歷史教室', d:100, no:'431', img:'border.jpg', fl:'4F', zone:'走廊延伸展區', txt:'當邊界被劃下時，我們如何看見真正的彼此？從過去到現在，不同時代都存在著被排除在主流社會及國家制度之外的人——他們可能沒有戶籍、沒有國籍，始終游移在法律與現實的邊界。本區從更長遠的歷史脈絡出發，回看「非公民」如何被界定與形成。'},   /* 邊界之外特展：單元名稱與文字照 A 版（官網展覽頁） */
  bd1:{n:'一、時代浪潮下的移動：跨越邊界的生命印記', d:105, no:'432', img:'bd-12.jpg', fl:'4F', zone:'第三特展室', txt:'「當動盪席捲世界，人們帶來的只是行李嗎？」臺灣的歷史與世界局勢緊密相連。來自圖伯特、緬甸、香港與烏克蘭的人們，因冷戰、政變、戰爭與迫害，陸續跨越邊界來到這裡；他們的移動不只是個人選擇，而是為了守護生命、自由、信仰與未來。'},
  bd2:{n:'二、看不見的邊界', d:110, no:'433', img:'bd-10.jpg', fl:'4F', zone:'第三特展室', txt:'「跨過了邊界，邊界就消失了嗎？」「身分」的邊界，從來不是固定的，它會隨著法律制度、國際局勢與國家安全考量而被重新劃定。對許多來到臺灣的人而言，邊界不只存在於海關，也延伸到入境後的停留、居留或定居審查。'},
  bd3:{n:'三、At Home', d:115, no:'434', img:'bd-11.jpg', fl:'4F', zone:'第三特展室', txt:'「『家』，對你來說是什麼？」對有些人而言，「家」是正在經歷戰火的地方；對流亡者而言，是宗教、文化與身分認同的延續；對離開香港的人而言，那個地方還在，卻已不同。來自不同地方的人們，帶著各自對「家」的記憶與牽掛來到臺灣。'},
  bd4:{n:'四、邊界上的未盡旅程', d:120, no:'435', img:'bd-9.jpg', fl:'4F', zone:'第三特展室', txt:'「當全球的流離與遷徙來到臺灣，我們將讓邊界變窄，還是讓關係展開？」我們看見人們在動盪中離開家園，看見人的身分如何在穿越邊界後被重新定義，也看見許多人在不安的處境中，仍努力在這裡生活、行動並照顧彼此。'},
};

function exNavMount(){
  const sc=document.querySelector('#app > .scr .scroll'), nav=document.getElementById('exNav'), hero=document.querySelector('#app > .scr .exhero'), tab=document.querySelector('#app > .scr .tabstick');
  if(!sc||!nav||!hero) return;

  imgs.forEach(i=>{ i.dataset.l=i.getAttribute('src'); i.dataset.d=dk(i.getAttribute('src')); });
  let was=null;
  const ins=hero.classList.contains('ins'), cl=v=>Math.max(0,Math.min(1,v));
  const hIm=hero.querySelector('img'), hGr=hero.querySelector('.exgrad'), hPq=hero.querySelector('.explaque');   /* 收合時要反向補償的三個元素，先抓起來不要每次捲動都查 */
  const tabBtns=tab?[...tab.querySelectorAll('button[data-sec]')]:[]; let curSec=null;   /* 展覽頁的分頁＝錨點，捲動時要跟著高亮（路線頁的分頁沒有 data-sec，不會進來） */
  if(tabBtns.length){   /* 頁尾留白撐到剛好讓最後一段（評論）也能捲到分頁列下方，否則最後兩顆點下去會停在同一個底部位置 */
    const sp=document.getElementById('exSpacer'), rv=document.getElementById(EX_SEC.rev);
    if(sp&&rv){ const base=+sp.dataset.base||96; sp.style.height=Math.max(base, sc.clientHeight-EX_STICK-rv.offsetHeight)+'px'; } }
  const f=()=>{ const y=sc.scrollTop, past=y>=hero.offsetTop+hero.offsetHeight-57, solid=ins||past;
    if(solid!==was){ was=solid; nav.classList.toggle('solid',solid); imgs.forEach(i=>i.src=solid?i.dataset.d:i.dataset.l); }
    if(ins){ nav.classList.toggle('ttl',past);   /* 內縮版：nav 一開始就是白底，捲過主圖才出現展名 */
      const k=REDUCED?(y>0?1:0):cl(y/220), m=24*(1-k);   /* 左右內縮 24px→0、圓角 20px→0；圖片與漸層反向補償，所以只有「框」在收，圖不動 */
      hero.style.marginLeft=hero.style.marginRight=m+'px'; hero.style.borderRadius=(20*(1-k))+'px';
      if(hIm){ hIm.style.left=-m+'px'; hIm.style.width='calc(100% + '+(2*m)+'px)'; }

      if(hPq){ hPq.style.left=hPq.style.right=(44-m)+'px'; } }
    if(tab) tab.classList.toggle('stuck', tab.getBoundingClientRect().top-sc.getBoundingClientRect().top<=56.5);
    if(tabBtns.length){   /* 捲到哪一段就亮哪一顆；捲到底一定算最後一段；剛點過的那顆先鎖住不被捲動途中的值蓋掉（同首頁） */

      if(y>=sc.scrollHeight-sc.clientHeight-4) cur='rev';

    const ci=document.getElementById('exCta'), fx=document.getElementById('exCtaFix'), fab=document.getElementById('scanFab'); if(ci){ const c=ci.getBoundingClientRect(), on=!!fx&&c.bottom<sc.getBoundingClientRect().top+56+48; if(fx&&fx.classList.contains('on')!==on){ fx.classList.toggle('on',on); fx.setAttribute('aria-hidden',String(!on)); fx.inert=!on; }
      if(fab){ const r=fab.getBoundingClientRect(), hit=on||(c.bottom>r.top-8&&c.top<r.bottom+8); fab.classList.toggle('fabhide',hit); fab.inert=hit; } } };   /* ④ 開始導覽捲出畫面後，固定在底部；開始導覽（原位或固定）跟「找展品導覽」FAB 疊到時先收起 FAB */

/* 幫我排今天的順序：只用今天的場次資料＋展覽的「約 N 分鐘」排。
   原則：要現場報名、名額有限的先去（VR）→ 有場次的照最近一場依序排（場次不重疊，前一項結束才排下一項）→ 常設展、特展不用排隊，塞進場次之間的空檔或排在最後 */
function dayPlan(){ const now=nowMin(), close=hm('17:00'); if(now>=close) return [];
  const evs=todayEvents(), rows=[]; let cur=now;
  const exs=['perm','zj','asia'].map(k=>{ const e=EXHIBITIONS[k], m=(e.meta[0].match(/約 (\d+) 分鐘/)||[])[1]; return {k, n:e.n.split('：')[0], where:e.meta[1], type:e.type, dur:+m||30}; });
  const reg=evs.filter(e=>e.note&&/名額有限/.test(e.note)&&e.live);   /* 正在報名中的：現在就去 */
  reg.forEach(e=>{ rows.push({t:'現在', n:e.n, where:e.where, why:`${e.live.label||''}報名中，名額有限、額滿為止，先去報名，體驗時間依服務臺安排`}); cur=now+10; });
  const isReg=e=>e.note&&/名額有限/.test(e.note);
  const anchors=evs.filter(e=>isReg(e)&&!e.live&&e.next).map(e=>({e,s:e.next}));   /* 要報名、還沒開始的：固定在它開始的時間，其他場次不能跟它撞 */
  let todo=evs.filter(e=>!isReg(e));
  const fill=gap=>{ for(const x of [...exs].sort((a,b)=>b.dur-a.dur)){ if(x.dur+5<=gap){ rows.push({t:fmtHM(cur)+'–'+fmtHM(cur+x.dur), n:x.n+'（'+x.type+'）', where:x.where, why:`不用排隊，剛好利用下一場前的空檔，約 ${x.dur} 分鐘`, ex:x.k}); cur+=x.dur+5; gap-=x.dur+5; exs.splice(exs.indexOf(x),1); } } };
  const endOf=(e,s)=>s.end?hm(s.end):s.st+(e.dur||30);
  for(;;){ const c=todo.map(e=>({e, s:e.ss.find(x=>x.st>=cur&&x.st<close)})).filter(o=>o.s).sort((a,b)=>a.s.st-b.s.st)[0], A=anchors[0];
    if(A&&(!c||endOf(c.e,c.s)+5>A.s.st)){   /* 報名的前面不塞展覽：一開放就去，避免看展看到錯過 */
      rows.push({t:(A.s.label?A.s.label+' ':'')+A.s.t+'–'+A.s.end, n:A.e.n, where:A.e.where, why:`名額有限、額滿為止，${A.s.label||'這一場'}一開始就去報名，體驗時間依服務臺安排`});
      cur=Math.max(cur,A.s.st)+10; anchors.shift(); continue; }
    if(!c) break;
    fill(c.s.st-cur); const {e,s}=c, end=endOf(e,s), last=e.ss.filter(x=>x.st>=s.st).length===1;
    rows.push({t:s.t+'–'+fmtHM(end), n:e.n, where:e.where, why:`最近一場 ${s.t}${last?'，也是今天最後一場':''}，每場約 ${e.dur} 分鐘`});
    cur=end+5; todo=todo.filter(x=>x!==e); }
  /* 場次排完：剩下的展覽照閉館前的時間排，放得下的先排；只剩一點時間就挑一檔聽重點；排不進的列在最後一句 */
  const left=[];
  for(const x of [...exs].sort((a,b)=>b.dur-a.dur)){ const room=close-cur;
    if(x.dur<=room){ rows.push({t:fmtHM(cur)+'–'+fmtHM(cur+x.dur), n:x.n+'（'+x.type+'）', where:x.where, why:'不用排隊、隨時能進，排在場次之後慢慢看', ex:x.k}); cur+=x.dur+5; }
    else left.push(x); }
  if(left.length&&close-cur>=10){ const x=left.sort((a,b)=>a.dur-b.dur).shift(); rows.push({t:fmtHM(cur)+'–17:00', n:x.n+'（'+x.type+'）', where:x.where, why:`快閉館了，看不完整檔（約 ${x.dur} 分鐘），挑幾件聽重點`, ex:x.k}); cur=close; }
  if(rows.length&&left.length) rows.left=left.map(x=>x.n);
  return rows; }

, "唱遊歌曲": "Singing Games", "流行音樂的誕生": "The Birth of Pop Music", "終戰那一天": "The Day the War Ended", "臺灣民主歌": "Song of Taiwanese Democracy", "愛國歌曲與禁歌": "Patriotic Songs and Banned Songs", "流離之音：歌曲裡的戰後原住民史": "Sounds of Displacement: Postwar Indigenous History in Song", "「生命的脈動」藝術品": "\"Pulse of Life\" artwork", "福爾摩沙島宣教地圖": "Missionary Map of Formosa", "向漢人領取物資的木籤憑證": "Wooden Tally for Collecting Goods from the Han", "林朝英水墨自畫像": "Ink Self-portrait of Lin Chao-ying", "北路屯千總潘踏比厘六品武官補服": "Sixth-rank Military Robe of Northern Tun Commander Pan Tabili", "七腳川後代復振之大羽冠帽飾": "Feather Headdress Revived by Cikasuan Descendants", "排灣族女子銀幣飾品長衣": "Paiwan Woman's Robe with Silver Coins", "臺灣一周紀念旅行手札": "Souvenir Album of a Round-Taiwan Trip", "蔣渭水致林獻堂書信": "Letter from Chiang Wei-shui to Lin Hsien-tang", "「人們記憶中的戰爭」文物": "Objects of \"The War as People Remember It\"", "一場戰爭，各自記憶": "One War, Many Memories", "228・陳澄波遺物": "228 · Belongings of Chen Cheng-po", "「沒有人是局外人」彩繪石頭": "\"No One Is an Outsider\" painted stones", "「你也是寫歷史的人」文物": "Objects of \"You Write History Too\"", "鐵剪刀": "Iron Scissors", "糖郊李勝興米駝": "Rice Camel of the Li Sheng-hsing Sugar Guild", "豬頭骨與檳榔": "Pig Skull and Betel Nut", "南無警察大菩薩": "Namu Police Great Bodhisattva", "警報器": "Air-raid Siren", "以麵粉袋做成的衣褲": "Clothes Made from Flour Sacks", "陪伴我們的臺灣島嶼，一起穿越數百年的記憶流轉吧！在這裡，你會從神秘的起源傳說開始，跟著這塊土地，一次次歷經時代的更迭與鉅變，看見大歷史之下人群的樣貌、聲音與故事。展覽以「時代」作為單元，分為「臺灣，交會之島」、「最初的抵岸」、「倚海而生的島與人」、「山海之間的共存與競逐」、「新秩序下的苦悶與夢想」、「走向民主這條路」、「大家的博物館」7 大單元；從史前到當代，相異的時空情境中，是否喚起你似曾相似的共鳴？": "Travel with the island of Taiwan through centuries of memory. Starting from mysterious origin legends, you follow this land through change and upheaval, and see the faces, voices and stories of people within the larger sweep of history. The exhibition is arranged by era in 7 sections: Taiwan, an Island of Encounters; First Landings; An Island and People Living by the Sea; Coexistence and Competition between Mountain and Sea; Frustrations and Dreams under a New Order; The Road to Democracy; and Everyone's Museum. From prehistory to today, which moments will feel familiar to you?", "媽祖是臺灣最具代表性的民間信仰之一。本次展覽透過館藏、國內外機構典藏，以及臺灣各地媽祖廟所傳承的重要文物，探討媽祖神蹟如何被詮釋，並展現出媽祖的多元面貌。": "Mazu is one of Taiwan's most representative folk beliefs. Drawing on the museum's collection, institutions at home and abroad, and important relics kept by Mazu temples across Taiwan, this exhibition explores how Mazu's miracles have been interpreted and shows her many faces.", "「非公民」是指有人沒有任何國家承認其國籍；也有人雖擁有國籍，卻因政治、戰亂與制度等因素，無法獲得原國家的保護。本特展透過主展場與走廊延伸展區，串聯這段歷史，並述說來到臺灣的不同群體的故事。": "\"Non-citizens\" are people whose nationality no state recognizes, or who hold a nationality but cannot get their country's protection because of politics, war or institutions. Through the main gallery and a corridor extension, this exhibition connects that history and tells the stories of different groups who came to Taiwan.", "聲音，演譯了誰的心情？傳遞著哪些故事？歷史上的歌謠、唸詞、流行歌，穿越數百年的聲音，用歌詞與曲調留下了特殊歷史情境的當下痕跡，呼喚您來傾聽。": "Whose feelings do these sounds express, and what stories do they carry? Folk songs, chants and pop songs from across the centuries left traces of their moment in lyrics and melodies. Come and listen.", "博物館研究員私心推薦的經典藏品，這些物件背後，或是反映獨特的歷史記憶、人物真切的生命經歷，或是在地視角的投射，也有可能隱藏著歷史研究控的物質密碼？等你一起來解讀！": "Classic objects picked by the museum's researchers. Behind them are unique historical memories, real life stories and local perspectives, and perhaps material clues for history buffs. Come and decode them!", "伸出手一起來「觸摸」臺灣史吧！7大觸摸展件與點字展臺，不僅是量身為視覺不便的夥伴打造的路線，建立更多元友善的觀展方式，也讓我們可以用不同的感官，體驗、觸碰不同面向的臺灣歷史。": "Reach out and touch Taiwan's history! Seven touch objects and braille stands make a route designed for visitors with visual impairments, offering a more inclusive way to visit and letting everyone experience Taiwan's history through other senses.", "媽祖原為只知其姓的巫女林氏，經由歷代對媽祖顯聖事蹟的層累，形塑出神通廣大的女聖人樣貌，可看見媽祖在政治與宗教力量塑造下，成為護國救民的英烈天妃。本單元透過17至19世紀的圖像與經典文獻，看見媽祖的形象在官方與民間的共同詮釋下，逐步確立為天后林默的過程。": "Mazu began as a shaman known only by her surname, Lin. Layer upon layer of miracle stories turned her into a powerful holy woman, and political and religious forces made her a heroic consort who protected the state and its people. Through images and texts from the 17th to 19th centuries, this unit shows how official and popular interpretations together established her as the Heavenly Empress Lin Mo.", "媽祖的海上神蹟，深受閩、粵兩地崇奉。明代以來，隨著頻繁的海上活動，媽祖信仰從中國東南沿海出發，沿著貿易路徑向東亞諸國延伸。船員與移民隨身攜帶的神像與聖物，使媽祖香火得以越過汪洋，在異鄉落地生根；延伸至臺灣後，又向外輻射至世界各地。": "Mazu's miracles at sea were revered in Fujian and Guangdong. From the Ming dynasty, with growing maritime activity, her worship spread from China's southeast coast along trade routes across East Asia. Statues and sacred objects carried by sailors and migrants took her incense across the ocean to new homes, and from Taiwan it spread around the world.", "媽祖信仰深入臺灣後，因地域與族群的差異，被賦予不同的稱呼與形象：是榮及雙親的孝女，是慈愛赤子的媽婆；能以施藥救疫，也在戰火之中顯聖。除了多樣性的神像外，冠服、神輿與時尚精品，也形塑出不同時代的媽祖樣貌。": "As Mazu belief took root in Taiwan, different regions and communities gave her different names and images: a filial daughter honoring her parents, a loving grandmother to children, a healer in epidemics, a protector in war. Alongside varied statues, crowns, robes, palanquins and even fashion items shaped her image in each era.", "無形的靈力，憑附於有形的物件，亦降於大符與各類聖物；承受香火的香爐與運載神火的香擔，是最關鍵的靈力載體。進香、遶境與過爐，是親近媽祖的神聖時刻，也是廟與廟、人與人之間交通互動的時刻，將世代的信仰記憶傳承下去。": "Invisible spiritual power rests in physical objects, talismans and sacred items; incense burners and the carriers of sacred fire are its most important vessels. Pilgrimages, processions and incense rites are sacred moments close to Mazu, and moments of exchange between temples and people that pass faith down the generations.", "隨時代更迭與社會結構變化，天后以各類形式顯聖與再現。數位科技改變了信仰傳播途徑，媽祖信仰以媒體直播與影像跨越地域限制；素昧平生的人們也因「結緣品」而聚合，比肩同行，使媽祖信仰得以歷久彌新。": "As times and society change, the Empress appears in new forms. Digital technology has changed how faith spreads: livestreams and images carry Mazu belief beyond place, and strangers gather and walk together through shared souvenirs, keeping the belief alive and new.", "當邊界被劃下時，我們如何看見真正的彼此？從過去到現在，不同時代都存在著被排除在主流社會及國家制度之外的人——他們可能沒有戶籍、沒有國籍，始終游移在法律與現實的邊界。本區從更長遠的歷史脈絡出發，回看「非公民」如何被界定與形成。": "When borders are drawn, how do we truly see one another? In every era some people have been excluded from mainstream society and the state, without household registration or nationality, drifting at the edge of law and reality. This area takes a longer historical view of how \"non-citizens\" came to be defined.", "「當動盪席捲世界，人們帶來的只是行李嗎？」臺灣的歷史與世界局勢緊密相連。來自圖伯特、緬甸、香港與烏克蘭的人們，因冷戰、政變、戰爭與迫害，陸續跨越邊界來到這裡；他們的移動不只是個人選擇，而是為了守護生命、自由、信仰與未來。": "\"When turmoil sweeps the world, is luggage all people bring?\" Taiwan's history is closely tied to world events. People from Tibet, Myanmar, Hong Kong and Ukraine crossed borders to come here because of the Cold War, coups, war and persecution. Their moves were not just personal choices but ways to protect life, freedom, faith and the future.", "「跨過了邊界，邊界就消失了嗎？」「身分」的邊界，從來不是固定的，它會隨著法律制度、國際局勢與國家安全考量而被重新劃定。對許多來到臺灣的人而言，邊界不只存在於海關，也延伸到入境後的停留、居留或定居審查。": "\"Once you cross a border, does it disappear?\" The borders of identity are never fixed; laws, international affairs and national security keep redrawing them. For many who come to Taiwan, the border isn't only at customs but extends to reviews for stay, residence and settlement.", "「『家』，對你來說是什麼？」對有些人而言，「家」是正在經歷戰火的地方；對流亡者而言，是宗教、文化與身分認同的延續；對離開香港的人而言，那個地方還在，卻已不同。來自不同地方的人們，帶著各自對「家」的記憶與牽掛來到臺灣。": "\"What does home mean to you?\" For some, home is a place at war; for exiles, it is the continuation of faith, culture and identity; for those who left Hong Kong, it is still there but no longer the same. People from many places bring their memories of home to Taiwan.", "「當全球的流離與遷徙來到臺灣，我們將讓邊界變窄，還是讓關係展開？」我們看見人們在動盪中離開家園，看見人的身分如何在穿越邊界後被重新定義，也看見許多人在不安的處境中，仍努力在這裡生活、行動並照顧彼此。": "\"As global displacement reaches Taiwan, will we narrow our borders or open up relationships?\" We see people leaving home in turmoil, identities redefined after crossing borders, and many who, despite uncertainty, still live, act and care for one another here.", "這件展品位在「臺灣，交會之島」單元。臺灣，要從「交會」開始說起。這是一段不同人群，碰撞、摸索，共有同一塊土地的故事。本單元也有母語地名故事的線上展覽。": "This object is in the section \"Taiwan, an Island of Encounters\". Taiwan's story begins with encounters: different peoples meeting, testing each other and sharing one land. This section also has an online exhibition on place names in native languages.", "這件展品位在「身陷角力戰的原住民」展區。在這段期間，隨著漢人、日本人、荷蘭人、西班牙人相繼到來，原本保持相對穩定狀態的臺灣原住民族社會受到一定程度的攪動。面對外來者，原住民各部落會主動選擇有利於部落的同盟對象，也會與敵對的勢力產生衝突。不同族群之間各有盤算，有時彼此交惡，有時維持著不穩定的聯盟關係。而外來團體間彼此也有糾葛衝突。": "This object is in the area \"Indigenous Peoples Caught in a Power Struggle\". As the Han, Japanese, Dutch and Spanish arrived, the relatively stable Indigenous societies were shaken. Villages chose allies that served them and clashed with rivals. Each group had its own aims, sometimes hostile, sometimes in uneasy alliances, while the newcomers also fought among themselves.", "這件展品位在「山海之間的共存與競逐」單元。1684年臺灣被清朝併入版圖，大量漢人移民持續渡海前來，在平原、丘陵、沿山發展出各自的村落、產業及生活方式；在這片山與海之間的土地上，不同人群相互共存，也彼此競逐。": "This object is in the section \"Coexistence and Competition between Mountain and Sea\". In 1684 Taiwan was incorporated into the Qing empire, and Han migrants kept crossing the strait, building villages, industries and ways of life on the plains, hills and mountain edges. On this land between mountain and sea, different peoples coexisted and competed.", "這件展品位在「平埔原住民的人生故事」展區。不同地方的平埔社群，原本有自己的生活文化與網絡，再加上與漢人社會、清朝官府、歐美傳教士等不同人群的接觸，每個部落的際遇與發展都不盡相同。有的人與官府關係密切，身上冠有軍功、職銜；有的人則是收取地租的「番頭家」，或是跟漢人一樣投資經商；但也有更多人因為難以在原鄉過活，遠徙他處。從這些原住民社群人們的人生故事可以看到：在不同時代與際遇下，這塊土地上的人們，各自採用什麼樣的策略來生存發展。": "This object is in the area \"Life Stories of the Pingpu Peoples\". Pingpu communities had their own cultures and networks, and their contact with Han society, Qing officials and Western missionaries shaped each village differently. Some had close ties to officials and held military honors; some were landlords collecting rent or invested in trade like the Han; many more, unable to make a living at home, moved far away. Their life stories show the strategies people on this land used to survive in different times.", "這件展品位在「新時代，新產業」展區。日本時代初期將臺灣當作熱帶經濟作物和糧食的生產地，有系統地開發臺灣各項農、林、漁等產業資源，以提供日本帝國所需。工業則以新式製糖及食品加工業為主。1930年代後期，總督府提出臺灣「工業化」的方針，戰爭時期並發展各項軍需工業，也替日後臺灣工業化奠定基礎。伴隨產業建設，島內外交通手段也逐漸完備。交通的完備與治安的穩定也逐步建構起臺灣旅遊業。日本帝國為展示其殖民建設成果，舉辦許多大型博覽會，產業與物產都是其中重要的宣傳面向。": "This object is in the area \"New Era, New Industries\". Early in Japanese rule, Taiwan was developed as a source of tropical crops and food, with agriculture, forestry and fisheries systematically exploited for the empire; industry centered on modern sugar refining and food processing. In the late 1930s the colonial government pushed industrialization and wartime military industries, laying foundations for later development. Transport improved, and with stable public order a tourism industry emerged. The empire held large expositions to show off its colonial achievements, with industries and products as key showpieces.", "這件展品位在「當原住民遭逢近代國家」展區。當日本帝國以近代國家形式進入臺灣，對人口、土地展開嚴密的掌控後，曾經在政治、文化上維持相對自主的山地，與雖已納入版圖但控制有限的東部地區，終於也逐步納入殖民體制。在國家的政策與征討下，原住民族的生活世界遭逢劇烈變動，並透過口述傳說，留下與官方紀錄大不相同、屬於族人觀點的歷史記憶。": "This object is in the area \"When Indigenous Peoples Met the Modern State\". When the Japanese empire brought modern state control over people and land, the mountains, once politically and culturally autonomous, and the loosely governed east were gradually absorbed into the colonial system. Under state policy and military campaigns, Indigenous life changed drastically, and oral traditions preserved memories from their own point of view, very different from official records.", "這件展品位在「近代教育與社會運動」展區。日本殖民者引進了近代教育，其主要目標是讓臺灣人成為「理想的日本國民」及殖民統治所需的基礎人力。但是近代教育同時啟發了臺灣人的自覺，也有不少臺灣人至島外接受教育，習得了近代議會政治民主等概念。這些新世代的知識份子不滿臺灣的殖民制度，透過政治與社會運動，取得臺灣民眾支持，形成新時代的抵抗行動，向殖民者爭取政治權利之外，也進行臺灣的社會文化改造運動。": "This object is in the area \"Modern Education and Social Movements\". The Japanese introduced modern education to make Taiwanese \"ideal Japanese subjects\" and a workforce for colonial rule. But it also awakened Taiwanese self-awareness, and many studied abroad and learned about parliamentary democracy. This new generation of intellectuals, unhappy with colonial rule, won public support through political and social movements, demanding political rights and reforming Taiwanese society and culture.", "臺灣文化協會會歌的原件，附在1921年9月21日蔣渭水寫給林獻堂的文協創立大會邀請信裡。信中寫明，會歌平時用〈黃海戰〉曲調演唱，儀式時改用〈始政紀念歌〉曲調。": "The original song of the Taiwanese Cultural Association, enclosed in Chiang Wei-shui's 21 September 1921 letter inviting Lin Hsien-tang to the founding meeting. The letter says the song was sung to the tune of \"Battle of the Yellow Sea\" normally and to the \"Commemoration of the Beginning of Rule\" song at ceremonies.", "這件展品位在「現代風格起步走」展區。從都市、城鎮開始，20世紀前半的臺灣人，普遍感受到時代變革的步伐愈催愈緊，從視覺、聽覺、身體意識等感官，到社會結構、人際倫理觀念，都反映大不相同的新氣象，有人稱之為「文明」，有人戲稱為「毛斷」（modern臺語音譯）。自固有慣習裡游離而出的新一代臺灣人，憑著「和洋」（日本/西洋）混雜的技術與形式，展開創作與生活文化的改良，現代臺灣的面貌也隨之逐漸成形。": "This object is in the area \"Stepping into Modern Style\". In the first half of the 20th century, starting in the cities, Taiwanese felt change speeding up, from sight, sound and body to social structure and ethics. Some called it \"civilization\"; others jokingly said \"mo-tng\" (Taiwanese for \"modern\"). A new generation, breaking from old habits, mixed Japanese and Western techniques and forms to reinvent art and daily life, and modern Taiwan gradually took shape.", "這件展品位在「戰爭淹沒了社會：臺灣人的二次世界大戰」展區。1930年代，總督府特別重視農漁村的經濟自立，推展部落振興運動，由上至下進行社區改造，推行社會教化，欲在鄉村建立一套新秩序。戰爭爆發後，社會教化體系便轉為支援戰爭的動員組織。臺灣人一方面過著緊縮的物質生活，另一方面還要面對皇民化運動的強大文化壓力，被鼓勵放棄自己原有的語言、姓名，甚至走向戰場、失去生命。": "This object is in the area \"Society Engulfed by War: Taiwanese in World War II\". In the 1930s the colonial government promoted self-reliance in farming and fishing villages, remaking communities from the top down to build a new rural order. When war broke out, these networks became wartime mobilization. Taiwanese lived with scarcity and the heavy cultural pressure of the Kominka movement, urged to give up their language and names, and even to go to war and lose their lives.", "這件展品位在「反共復國基地」展區。1950年韓戰爆發。以美國、蘇聯為首的資本主義、共產主義兩大國際陣營在東亞展開對抗，作為西太平洋「第一島鏈」關鍵位置的臺灣，由中國國民黨長期執政，成為中華民國「反共復國」的基地、「自由中國」的堡壘。隨著北京政府的外交拓展，中華民國的國際地位接連挫敗，1971年退出聯合國、1978年與美國斷交。然而，政府仍力主「三民主義統一中國」的政治口號，構成一黨獨大、以黨領政的威權體制。": "This object is in the area \"Anti-Communist Base\". The Korean War broke out in 1950 as the capitalist and communist blocs led by the US and USSR confronted each other in East Asia. Taiwan, key to the West Pacific \"first island chain\", was ruled long-term by the KMT and became the base for \"retaking the mainland\" and a bastion of \"Free China\". As Beijing's diplomacy expanded, the ROC suffered setbacks, leaving the UN in 1971 and losing US recognition in 1978. Yet the government held to the slogan of \"reunifying China under the Three Principles of the People\", sustaining a one-party authoritarian system.", "這件展品位在「走向民主這條路」單元。1945年後臺灣人熱烈參政，隨後卻受228事件的影響而噤聲；其後實施長達38年戒嚴。這條曲折的民主路，是不同意見折衝摩擦的過程，也是近兩、三代臺灣人相互看顧、多元對話的生命經驗。": "This object is in the section \"The Road to Democracy\". After 1945 Taiwanese eagerly joined politics, then fell silent after the 228 Incident, followed by 38 years of martial law. This winding road to democracy was a process of clashing views, and the shared experience of two or three generations caring for each other in open dialogue.", "本作品發想自阿美族傳說：會發光的女孩迪雅瑪贊（Tiyamacan）被迷戀她的海神之子用海水帶走，之後化成雷聲、彩虹和各種生命。作品中的光代表迪雅瑪贊的初心，也象徵混沌大地裡蔓生而出的生命。": "Inspired by an Amis legend: Tiyamacan, a girl who glowed with light, was carried off by the sea god's son who loved her, and became thunder, rainbows and all kinds of life. The light in the work stands for her original heart and for life growing out of the primordial earth.", "英國愛丁堡 W. & A.K. Johnston 地圖出版商製作的絹本設色手繪大地圖，推定為1873年的內容。圖上標了101個地名，其中25個是長老教會宣道站，反映1870年代李庥、馬偕等人的宣教成果。": "A large hand-colored map on silk by the Edinburgh publisher W. & A.K. Johnston, dated to around 1873. It marks 101 place names, 25 of them Presbyterian mission stations, reflecting the work of missionaries such as Hugh Ritchie and George Mackay in the 1870s.", "嘉慶17年（1812）建興庄公館發給排灣族望仔立社（今屏東來義鄉望嘉部落）頭人的賞籤，原住民持籤可領取銀30元、布匹等物資。籤上寫「循例」，可見這種做法已行之有年，是清代漢人與原住民往來的見證。": "A reward tally issued in 1812 by the Jianxing village office to the chief of the Paiwan Bongarid village (today Wangjia in Laiyi, Pingtung). Holders could collect 30 silver dollars, cloth and other goods. It says \"as customary\", showing the practice was long established, a record of Qing-era Han–Indigenous relations.", "清代臺灣書畫家林朝英的紙本水墨自畫像，依題款推定畫於嘉慶7年（1802），當時他64歲。畫中他頭戴冬冠、身穿大褂，身後有抱琴侍童，題款用他招牌的「竹葉書」寫成，是記錄他晚年真實面貌的唯一實物。": "An ink self-portrait on paper by Qing-era Taiwanese artist Lin Chao-ying, dated by its inscription to 1802, when he was 64. He wears a winter hat and long robe, with a servant boy holding a qin behind him. The inscription is in his signature \"bamboo-leaf script\". It is the only object recording how he looked in later life.", "石青色清代官服，前胸和後背各縫一塊方形補子，主圖是六品武官專用的「彪」。原主人是埔里烏牛欄社的潘踏比厘（1827-1917），1886年升補北路屯千總，1887年取得正六品武官職銜。官服由潘家代代收藏，後由後人捐贈。": "A dark blue Qing official robe with square badges on the chest and back showing a \"biao\" leopard, used by sixth-rank military officers. It belonged to Pan Tabili (1827–1917) of the Aoxgulan village in Puli, promoted to Northern Tun commander in 1886 and granted sixth rank in 1887. Kept by the family for generations, it was donated by his descendants.", "這本經摺裝手札的主人，推測是大阪人中西竹山。他在1934年5月搭高千穗丸來臺環島旅行，一路收集各地戳章、御朱印、車票、入山證和旅館紙品，再加上自己畫的插圖，記下從基隆南下臺南、高雄再北返的完整行程。": "This accordion-fold album probably belonged to Nakanishi Chikuzan of Osaka. In May 1934 he sailed on the Takachiho Maru to tour Taiwan, collecting stamps, temple seals, tickets, mountain permits and hotel paper along the way, with his own drawings, recording the full trip from Keelung south to Tainan and Kaohsiung and back.", "蔣渭水於1921年9月21日寫信給林獻堂，邀他出席臺灣文化協會創立大會，並附上文協會歌。依讓售人說法，蔣家確認這是目前唯一認定的蔣渭水親筆文協書信孤本；整件合訂冊另收有1927年文協分裂前後寄給林獻堂的信函。": "On 21 September 1921 Chiang Wei-shui wrote to Lin Hsien-tang inviting him to the founding of the Taiwanese Cultural Association, enclosing its song. According to the seller, the Chiang family confirmed it as the only known letter on the Association in Chiang's own hand. The bound volume also holds letters to Lin from around the Association's 1927 split.", "陳澄波（1895-1947）是嘉義畫家，1926年以《嘉義街外》入選日本帝展，二二八事件中遇害。展出遺物有他用過的皮箱、帽子、畫筆、調色盤和雕刻工具，由陳澄波文化基金會捐贈。妻子張捷把畫作藏在天花板裡保存，直到1979年才首次舉辦遺作展。": "Chen Cheng-po (1895–1947), a painter from Chiayi, was selected for Japan's Imperial Exhibition in 1926 with \"Outside Chiayi Street\" and was killed in the 228 Incident. On show are his suitcase, hat, brushes, palette and carving tools, donated by the Chen Cheng-po Cultural Foundation. His wife Chang Chieh hid his paintings in the ceiling; his first posthumous exhibition was held only in 1979.", "歷史是不同的人站在各自位置、用自己的方式記錄當下，所累積出來的理解。這個展區收錄陸季盈、謝招治、陳崧波等人的個人紀錄，傳達「每個人都是寫歷史的人」。": "History is an understanding built from many people recording their own moment from where they stand. This area holds personal records of Lu Chi-ying, Hsieh Chao-chih, Chen Sung-po and others, showing that everyone writes history.", "這件展品位在「倚海而生的島與人」單元。16世紀中期，臺灣逐漸成為東亞貿易的會合點與轉運點，東西方各大海權勢力在此競逐，臺灣的原住民社會開始面對一波波外來衝擊。": "This object is in the section \"An Island and People Living by the Sea\". From the mid-16th century Taiwan became a meeting and transit point for East Asian trade. Maritime powers from East and West competed here, and Indigenous societies faced wave after wave of outside impact.", "這件展品位在「商業市鎮」展區。清代臺灣西部港口大多是商業繁盛的市鎮，郊商、文市、洋行遞次發展。當貨物自中國沿海運至港口後，經由郊行統籌，再由批發商、零售商及挑販逐層經手，最後才到消費者手中。其中，府城（今臺南）、鹿港、艋舺（今臺北萬華）、大稻埕這四個由南至北的港口城市，各自代表了清代臺灣不同階段與類型的商業發展。": "This object is in the area \"Market Towns\". Most western ports in Qing Taiwan were thriving market towns where guild merchants, shops and foreign firms developed in turn. Goods from the Chinese coast passed through guilds, wholesalers, retailers and peddlers before reaching buyers. Fucheng (Tainan), Lukang, Monga (Wanhua, Taipei) and Dadaocheng, from south to north, each represent a different stage and type of Qing-era commerce.", "這件展品位在「日本殖民體制的建立：行政、警察、教化」展區。日本的殖民統治，主要可分為行政、警察、教化三大系統。首先是以臺灣總督府為頂點的行政體系，往上接續帝國中央政府，往下伸展至地方街庄役場，以專業分工的官僚確保績效。其次是警察、保甲系統，負責維持治安、執行法令。第三是以小學校、公學校為中心的教化系統。日本殖民統治前期，熟悉原有社會運作的臺灣人民，不滿日本統治帶來的近代國家運作模式，而屢有武裝反抗事件，總督府也逐步摸索調整其統治策略，透過三大系統逐步掌控臺灣，也使原本處於各自分散的地方社會狀態，逐步邁向一體化。": "This object is in the area \"Building the Colonial System: Administration, Police, Education\". Japanese rule rested on three systems. First, an administration headed by the Government-General, linked up to the imperial government and down to local offices, run by professional bureaucrats. Second, police and the baojia system kept order and enforced the law. Third, education centered on elementary and public schools. Early on, Taiwanese used to the old ways resisted the modern state, often with arms; the colonial government adjusted its strategies and, through these three systems, gained control, gradually unifying once scattered local societies.", "國民政府遷臺以來大力推動防空工作，「逃警報」和「防空演習」因此成為許多臺灣人的共同記憶，至今仍有軍民聯合防空演習。": "After the government moved to Taiwan it promoted air defense, so running from sirens and air-raid drills became a shared memory for many Taiwanese. Joint military–civilian drills still take place today.", "1950到1965年美援時期，美國援助臺灣麵粉等物資。純棉的麵粉袋（俗稱「卡動」）就成了民眾做內衣和家常服的布料，衣褲上常還印著中美合作標誌和製粉公司商標。": "During the US aid period (1950–1965), the US sent flour and other goods to Taiwan. The cotton flour sacks (\"carton\" in local slang) became fabric for underwear and everyday clothes, often still printed with the Sino-American cooperation logo and mill brands.", "16 世紀中期，臺灣逐漸成為東亞貿易的會合點與轉運點，東西方各大海權勢力在此競逐，臺灣的原住民社會開始面對一波波外來衝擊。首先是中國及日本的私商、海盜，以臺灣為會合貿易的地點。進入 17 世紀以後，又加入了來自歐洲的荷蘭人與西班牙人。": "From the mid-16th century, Taiwan became a meeting and transit point for East Asian trade. Maritime powers from East and West competed here, and Indigenous societies faced wave after wave of outside impact. First came Chinese and Japanese private traders and pirates, who met to trade in Taiwan. In the 17th century they were joined by the Dutch and Spanish from Europe.", "東西方文化在此交會，使臺灣成為東亞歷史舞臺上的要角。當你站在這面航海圖前，不妨先找找臺灣的位置——在當時的世界地圖上，它還沒有固定的形狀，卻已經是各方勢力都想標記的座標。": "East and West met here, making Taiwan a key player on the East Asian stage. Standing before this sea chart, try to find Taiwan: on the world maps of the time it had no fixed shape yet, but every power already wanted to mark it.", "十七世紀前後，臺灣位於東亞海域的交會處。往來的商船、漁民與移住者在此靠岸，帶來稻米、鐵器、瓷器與信仰，也把鹿皮、砂糖與樟腦運往遠方。": "Around the 17th century, Taiwan sat at a crossroads of East Asian seas. Merchant ships, fishermen and settlers landed here, bringing rice, iron, porcelain and faith, and carrying deerskin, sugar and camphor far away.", "這一區以船、港與貨物為線索，重現當時人們如何倚海而生：從原住民族的漁獵與交易，到漢人移民的定居，再到荷蘭、西班牙與日本商人在此地的競逐。": "Using ships, ports and goods as clues, this area shows how people lived by the sea: from Indigenous fishing, hunting and trade, to Han settlement, to competition among Dutch, Spanish and Japanese merchants.", "展櫃中的貿易瓷片與航海圖複製件，是這段往來留下的痕跡。仔細看圖上的臺灣，形狀還沒有固定，說明當時的人對這座島的認識，正隨著一次次航行慢慢累積。": "The trade porcelain shards and replica sea charts in the case are traces of these exchanges. Look closely: Taiwan's shape isn't fixed yet, showing how knowledge of the island grew voyage by voyage.", "歡迎來到國立臺灣歷史博物館。先花三分鐘，認識一下這裡怎麼逛。": "Welcome to the National Museum of Taiwan History. Take three minutes to learn how to get around.", "你會從 8 號門進入展示教育大樓的 1F 大廳。服務臺在大廳右側，可以在這裡詢問、免費借輪椅，或報名需要現場登記的活動。": "You'll enter the 1F lobby of the Exhibition Building through Gate 8. The information desk is on the right, where you can ask questions, borrow a wheelchair for free, or sign up for activities that need on-site registration.", "1F 有兒童廳，適合帶小朋友動手玩、慢慢看；時光車站有火車劇場，圓形劇場則輪播影片，各自有固定場次，可以先看「本日活動」的時間。": "1F has the Children's Gallery for hands-on play; the Time Station has a train theater, and the Round Theater shows films. Each has set show times; check Today's Events.", "搭手扶梯、樓梯或電梯到 2F，就是常設展「斯土斯民：臺灣的故事」。常設展分成七個單元，從史前時代一路講到當代，展出上千件文物。展區是開放式的，不用照順序走，可以挑有興趣的單元先看。": "Take the escalator, stairs or elevator to 2F for the permanent exhibition, \"Land and People: The Story of Taiwan\". Its seven sections run from prehistory to today with over a thousand objects. The space is open, so start with whatever interests you.", "二樓挑高直通四樓，所以館內沒有三樓。搭電梯到 4F，是特展室和 VR 再現製造所。特展每隔一段時間就會更換，出電梯後跟著指標就能找到展廳；VR 體驗要現場報名，名額有限。": "2F is double-height up to 4F, so there is no 3F. Take the elevator to 4F for the special galleries and the VR Reenactment Studio. Special exhibitions change regularly; follow the signs from the elevator. VR sessions need on-site sign-up and seats are limited.", "館外是臺灣歷史公園，每天 05:00 到 22:00 免費開放，參觀前後可以到湖畔走走。": "Outside is the Taiwan History Park, open free daily from 05:00 to 22:00. Take a lakeside walk before or after your visit.", "展示教育大樓開放時間是 09:00 到 17:00，16:30 最後入場，每週一休館。館內只有一間咖啡廳，也沒有提款機，現金請先準備好。": "The Exhibition Building is open 09:00 to 17:00, last entry 16:30, closed Mondays. There is only one café and no ATM, so bring cash.", "離館時請走 1F 大廳左側的 6 號門，8 號門只能進、不能出。祝你參觀愉快。": "When leaving, use Gate 6 on the left of the 1F lobby; Gate 8 is entry only. Enjoy your visit.", "歡迎來到國立臺灣歷史博物館。先花三分鐘，認識一下這裡怎麼逛。你會從 8 號門進入展示教育大樓的 1F 大廳。服務臺在大廳右側，可以在這裡詢問、免費借輪椅，或報名需要現場登記的活動。1F 有兒童廳，適合帶小朋友動手玩、慢慢看；時光車站有火車劇場，圓形劇場則輪播影片，各自有固定場次，可以先看「本日活動」的時間。搭手扶梯、樓梯或電梯到 2F，就是常設展「斯土斯民：臺灣的故事」。常設展分成七個單元，從史前時代一路講到當代，展出上千件文物。展區是開放式的，不用照順序走，可以挑有興趣的單元先看。二樓挑高直通四樓，所以館內沒有三樓。搭電梯到 4F，是特展室和 VR 再現製造所。特展每隔一段時間就會更換，出電梯後跟著指標就能找到展廳；VR 體驗要現場報名，名額有限。館外是臺灣歷史公園，每天 05:00 到 22:00 免費開放，參觀前後可以到湖畔走走。展示教育大樓開放時間是 09:00 到 17:00，16:30 最後入場，每週一休館。館內只有一間咖啡廳，也沒有提款機，現金請先準備好。離館時請走 1F 大廳左側的 6 號門，8 號門只能進、不能出。祝你參觀愉快。": "Welcome to the National Museum of Taiwan History. Take three minutes to learn how to get around. You'll enter the 1F lobby of the Exhibition Building through Gate 8. The information desk is on the right, where you can ask questions, borrow a wheelchair for free, or sign up for activities that need on-site registration. 1F has the Children's Gallery for hands-on play; the Time Station has a train theater, and the Round Theater shows films. Each has set show times; check Today's Events. Take the escalator, stairs or elevator to 2F for the permanent exhibition, \"Land and People: The Story of Taiwan\". Its seven sections run from prehistory to today with over a thousand objects. The space is open, so start with whatever interests you. 2F is double-height up to 4F, so there is no 3F. Take the elevator to 4F for the special galleries and the VR Reenactment Studio. Special exhibitions change regularly; follow the signs from the elevator. VR sessions need on-site sign-up and seats are limited. Outside is the Taiwan History Park, open free daily from 05:00 to 22:00. Take a lakeside walk before or after your visit. The Exhibition Building is open 09:00 to 17:00, last entry 16:30, closed Mondays. There is only one café and no ATM, so bring cash. When leaving, use Gate 6 on the left of the 1F lobby; Gate 8 is entry only. Enjoy your visit.", "邊界之外‧島嶼之中": "Beyond Borders, Within the Island", "全區平面圖": "Grounds map", "選起點": "choose a start", "選目的地": "choose a destination", "① 先到電梯": "① Elevator first", "沿虛線走約 # 公尺到電梯": "Follow the dotted line about # m to the elevator", "第一特展室特展入口": "Special Gallery 1 entrance", "第三特展室特展入口": "Special Gallery 3 entrance", "登入識別": "sign-in", "提供跨裝置同步": "for sync", "收藏與導覽歷程": "Favorites and history", "大廳左側離館的門": "the exit door on the left of the lobby", "# 號門": "Gate #", "單元一": "Unit 1", "單元二": "Unit 2", "單元三": "Unit 3", "單元四": "Unit 4", "單元五": "Unit 5", "海濱神姑：海口女巫的天后之路": "Goddess of the Shore: A Seaside Shaman's Path to Heavenly Empress", "海上福星：媽祖信仰傳播的航跡": "Lucky Star of the Sea: How Mazu Belief Spread", "盛裝駕到：千變萬化的臺灣天后": "Arriving in Splendor: Taiwan's Ever-changing Empress", "萬年香火：當靈力鑄化為聖物": "Eternal Incense: When Spiritual Power Becomes Sacred Objects", "善願必佑：在當代與媽祖相遇": "Every Good Wish Answered: Meeting Mazu Today", "語言": "Language"};

」作為單元，分為「臺灣，交會之島」、「最初的抵岸」、「倚海而生的島與人」、「山海之間的共存與競逐」、「新秩序下的苦悶與夢想」、「走向民主這條路」、「大家的博物館」# 大單元；從史前到當代，相異的時空情境中，是否喚起你似曾相似的共鳴？":"私たちとともにあった台湾の島で、数百年にわたる記憶の流れをたどりましょう。ここでは、神秘的な起源の伝説から始まり、この土地とともに何度も時代の移り変わりと大きな変化を経験し、大きな歴史の中で人々の姿、声、物語を見ることができます。展示は「時代」をユニットとし、「台湾、出会いの島」「最初の上陸」「海とともに生きる島と人々」「山と海のあいだの共存と競い合い」「新秩序のもとでの苦悩と夢」「民主主義への道のり」「みんなの博物館」の#つの大ユニットに分かれています。先史から現代まで、異なる時代と状況の中で、どこか見覚えのある共感が呼び起こされるでしょうか。","展品 #":"展示品 #","原住民族的語言與名字":"先住民族の言語と名前","維護中":"メンテナンス中","展品 #・":"展示品 #・","手語影片・附字幕":"手話動画・字幕付き","媽祖是臺灣最具代表性的民間信仰之一。本次展覽透過館藏、國內外機構典藏，以及臺灣各地媽祖廟所傳承的重要文物，探討媽祖神蹟如何被詮釋，並展現出媽祖的多元面貌。":"媽祖は、台湾を代表する民間信仰のひとつです。本展では、館蔵品、国内外の機関の所蔵品、そして台湾各地の媽祖廟が受け継ぐ重要な文物を通して、媽祖の霊験がどのように解釈されてきたかを探り、媽祖の多様な姿を紹介します。","單元一｜海濱神姑：海口女巫的天后之路":"ユニット1｜海辺の巫女：港の巫女が天后になるまで","單元二｜海上福星：媽祖信仰傳播的航跡":"ユニット2｜海の福の星：媽祖信仰が広まった航跡","單元三｜盛裝駕到：千變萬化的臺灣天后":"ユニット3｜盛装でご降臨：千変万化の台湾の天后","單元四｜萬年香火：當靈力鑄化為聖物":"ユニット4｜万年の香火：霊力が聖なる品になるとき","單元五｜善願必佑：在當代與媽祖相遇":"ユニット5｜願いは必ず叶う：現代で媽祖に出会う","「非公民」是指有人沒有任何國家承認其國籍；也有人雖擁有國籍，卻因政治、戰亂與制度等因素，無法獲得原國家的保護。本特展透過主展場與走廊延伸展區，串聯這段歷史，並述說來到臺灣的不同群體的故事。":"「非市民」とは、どの国にも国籍を認められていない人や、国籍はあっても政治、戦乱、制度などの要因により、本来の国の保護を受けられない人のことです。本特別展は、メイン展示場と廊下の延長展示エリアを通じてこの歴史をつなぎ、台湾にやって来たさまざまな人々の物語を伝えます。","零、非關公民歷史教室":"ゼロ、非市民の歴史教室","一、時代浪潮下的移動：跨越邊界的生命印記":"1、時代の波の中の移動：境界を越えた生命の刻印","二、看不見的邊界":"2、見えない境界","三、At Home":"3、At Home","四、邊界上的未盡旅程":"4、境界線上の終わらない旅","路線進度 #／# 站":"ルート進捗 #／#か所","下一站：臺灣文化協會會歌":"次の見どころ：台湾文化協会会歌","路線地圖":"ルートマップ","聲音，演譯了誰的心情？傳遞著哪些故事？歷史上的歌謠、唸詞、流行歌，穿越數百年的聲音，用歌詞與曲調留下了特殊歷史情境的當下痕跡，呼喚您來傾聽。":"声は、誰の気持ちを表し、どんな物語を伝えているのでしょうか。歴史の中の歌謡、唱え言葉、流行歌は、数百年を越える声として、歌詞と旋律に特別な歴史的状況の跡を残しています。どうぞ耳を傾けてください。","查看路線站點":"ルートの見どころを見る","路線進度":"ルート進捗","路線站點":"ルートの見どころ","# 站":"#か所","地名記憶了相遇故事":"地名が記憶する出会いの物語","文字":"テキスト","部落傳唱的荷蘭歌":"部落で歌い継がれるオランダの歌","語音":"音声","唐山過臺灣唸謠":"唐山から台湾へ渡る唱え歌","淺井惠倫採集平埔歌曲":"浅井恵倫が採集した平埔の歌","林業勞動歌":"林業労働歌","馬蘭阿美群的歌謠":"マラン・アミ族の歌謡","唱遊歌曲":"唱歌遊戯の歌","臺灣文化協會會歌":"台湾文化協会会歌","流行音樂的誕生":"流行音楽の誕生","終戰那一天":"終戦のその日","臺灣民主歌":"台湾民主歌","愛國歌曲與禁歌":"愛国歌曲と禁歌","流離之音：歌曲裡的戰後原住民史":"流浪の声：歌に見る戦後の先住民史","收起路線站點":"ルートの見どころを閉じる","下一站：向漢人領取物資的木籤憑證":"次の見どころ：漢人から物資を受け取るための木札","博物館研究員私心推薦的經典藏品，這些物件背後，或是反映獨特的歷史記憶、人物真切的生命經歷，或是在地視角的投射，也有可能隱藏著歷史研究控的物質密碼？等你一起來解讀！":"博物館の研究員がひそかにおすすめする名品です。これらの品の背後には、独自の歴史の記憶や人物の真実の人生、地元の視点が映し出されているかもしれません。歴史研究好きだけが読み解ける物質の暗号が隠れていることも。一緒に読み解きましょう。","「生命的脈動」藝術品":"「生命の鼓動」アート作品","福爾摩沙島宣教地圖":"フォルモサ島宣教地図","向漢人領取物資的木籤憑證":"漢人から物資を受け取るための木札","林朝英水墨自畫像":"林朝英の水墨自画像","北路屯千總潘踏比厘六品武官補服":"北路屯千総・潘踏比厘の六品武官補服","七腳川後代復振之大羽冠帽飾":"七脚川の子孫が復興した大羽冠の頭飾り","排灣族女子銀幣飾品長衣":"パイワン族女性の銀貨飾り付き長衣","臺灣一周紀念旅行手札":"台湾一周記念旅行手帳","蔣渭水致林獻堂書信":"蔣渭水から林献堂への書簡","「人們記憶中的戰爭」文物":"「人々の記憶の中の戦争」の文物","一場戰爭，各自記憶":"ひとつの戦争、それぞれの記憶","#・陳澄波遺物":"#・陳澄波の遺品","「沒有人是局外人」彩繪石頭":"「誰も部外者ではない」彩色石","「你也是寫歷史的人」文物":"「あなたも歴史を書く人」の文物","下一站：糖郊李勝興米駝":"次の見どころ：糖郊・李勝興の米駱駝","伸出手一起來「觸摸」臺灣史吧！#大觸摸展件與點字展臺，不僅是量身為視覺不便的夥伴打造的路線，建立更多元友善的觀展方式，也讓我們可以用不同的感官，體驗、觸碰不同面向的臺灣歷史。":"手を伸ばして、台湾史に「触れて」みましょう。#つの大型触れる展示品と点字展示台は、視覚に不自由のある方のために作られたルートであり、より多様で優しい鑑賞方法を築くと同時に、さまざまな感覚で台湾の歴史のいろいろな面を体験し、触れることができます。","鐵剪刀":"鉄のはさみ","糖郊李勝興米駝":"糖郊・李勝興の米駱駝","豬頭骨與檳榔":"豚の頭骨と檳榔","南無警察大菩薩":"南無警察大菩薩","警報器":"警報機","以麵粉袋做成的衣褲":"小麦粉袋で作った衣服","導覽":"ガイド","展品介紹":"展示品紹介","導覽語言・目前語音導覽・中文":"ガイド言語・現在 音声ガイド・中国語","中文":"中国語","台語":"台湾語","客語":"客家語","手語・附字幕":"手話・字幕付き","請戴上耳機收聽，展廳內不要外放聲音":"イヤホンをご使用ください。展示室内では音を外に出さないでください","# 世紀中期，臺灣逐漸成為東亞貿易的會合點與轉運點，東西方各大海權勢力在此競逐，臺灣的原住民社會開始面對一波波外來衝擊。首先是中國及日本的私商、海盜，以臺灣為會合貿易的地點。進入 # 世紀以後，又加入了來自歐洲的荷蘭人與西班牙人。":"#世紀半ば、台湾は次第に東アジア貿易の合流点・中継点となり、東西の海上勢力がここで競い合い、台湾の先住民社会は次々と外からの衝撃に直面し始めました。まず、中国や日本の私商・海賊が、台湾を貿易の合流地としました。#世紀に入ると、ヨーロッパからオランダ人とスペイン人も加わりました。","東西方文化在此交會，使臺灣成為東亞歷史舞臺上的要角。當你站在這面航海圖前，不妨先找找臺灣的位置——在當時的世界地圖上，它還沒有固定的形狀，卻已經是各方勢力都想標記的座標。":"東西の文化がここで出会い、台湾は東アジアの歴史の舞台で重要な役割を果たすようになりました。この航海図の前に立ったら、まず台湾の位置を探してみてください。当時の世界地図では、まだ決まった形はありませんでしたが、すでにあらゆる勢力が印を付けたい座標でした。","同展區其他導覽點":"同じエリアのほかのガイドポイント","#F 常設展廳・# 個":"#階 常設展示室・#か所","展品 #・語音・#:#":"展示品 #・音声・#:#","展品 #・手語・#:#":"展示品 #・手話・#:#","展品 #・#F 常設展廳":"展示品 #・#階 常設展示室","十七世紀前後，臺灣位於東亞海域的交會處。往來的商船、漁民與移住者在此靠岸，帶來稻米、鐵器、瓷器與信仰，也把鹿皮、砂糖與樟腦運往遠方。":"17世紀前後、台湾は東アジアの海域の交差点に位置していました。行き交う商船、漁民、移住者がここに寄港し、米、鉄器、陶磁器、信仰をもたらし、鹿皮、砂糖、樟脳を遠くへ運びました。","這一區以船、港與貨物為線索，重現當時人們如何倚海而生：從原住民族的漁獵與交易，到漢人移民的定居，再到荷蘭、西班牙與日本商人在此地的競逐。":"このエリアでは、船、港、貨物を手がかりに、当時の人々が海とともにどう生きていたかを再現します。先住民族の漁猟と交易から、漢人移民の定住、さらにオランダ、スペイン、日本の商人がこの地で競い合った様子までを紹介します。","展櫃中的貿易瓷片與航海圖複製件，是這段往來留下的痕跡。仔細看圖上的臺灣，形狀還沒有固定，說明當時的人對這座島的認識，正隨著一次次航行慢慢累積。":"展示ケースの貿易陶片と航海図の複製は、こうした往来が残した痕跡です。図の中の台湾をよく見てください。形はまだ定まっておらず、当時の人々のこの島への理解が、航海を重ねるごとに少しずつ積み重なっていたことがわかります。","延伸探索":"さらに探索","同主題":"同じテーマ","熱蘭遮城與東亞貿易":"ゼーランディア城と東アジア貿易","同展區":"同じエリア","#F 山海之間的共存與競逐":"#階 山と海のあいだの共存と競い合い","同時代":"同じ時代","十七世紀的臺灣住民":"17世紀の台湾の住民","上一則":"前へ","這是第一則":"これが最初の1件です","下一則":"次へ","收合播放器":"プレーヤーを閉じる","調整文字大小":"文字サイズを調整","收藏":"お気に入り","播放器分頁":"プレーヤーのタブ","導覽語言，目前語音導覽・中文":"ガイド言語、現在 音声ガイド・中国語","知道了，關閉提醒":"了解、通知を閉じる","臺灣，交會之島 的圖片":"台湾、出会いの島 の画像","臺灣，交會之島（第 # 張，共 # 張）":"台湾、出会いの島（#枚目、全#枚）","全螢幕檢視圖片":"画像を全画面で表示","第 # 張":"#枚目","在地圖上看位置":"地図で位置を見る","導覽列表":"ガイド一覧","播放進度":"再生位置","從頭播放":"最初から再生","後退 # 秒":"#秒戻る","前進 # 秒":"#秒進む","播放速度 # 倍":"再生速度 #倍","展覽導覽":"展示ガイド","已聽 #／# 則":"聴取済み #／#件","#・播放中・語音・#:#":"#・再生中・音声・#:#","#・已聽完・語音・#:#":"#・聴取済み・音声・#:#","#・語音・#:#":"#・音声・#:#","#・語音・#:#・維護中":"#・音声・#:#・メンテナンス中","播放速度":"再生速度","較慢":"ゆっくり","稍快":"やや速い","快速":"速い","最初的抵岸 的圖片":"最初の上陸 の画像","最初的抵岸（第 # 張，共 # 張）":"最初の上陸（#枚目、全#枚）","倚海而生的島與人 的圖片":"海とともに生きる島と人々 の画像","倚海而生的島與人（第 # 張，共 # 張）":"海とともに生きる島と人々（#枚目、全#枚）","山海之間的共存與競逐 的圖片":"山と海のあいだの共存と競い合い の画像","山海之間的共存與競逐（第 # 張，共 # 張）":"山と海のあいだの共存と競い合い（#枚目、全#枚）","手語（本則未提供）":"手話（この項目は未対応）","文物維護中":"文物メンテナンス中","部分文物送修維護中，展櫃暫時以複製品展出":"一部の文物は修復・メンテナンス中のため、展示ケースでは一時的にレプリカを展示しています","新秩序下的苦悶與夢想 的圖片":"新秩序のもとでの苦悩と夢 の画像","新秩序下的苦悶與夢想（第 # 張，共 # 張）":"新秩序のもとでの苦悩と夢（#枚目、全#枚）","#・播放中・語音・#:#・維護中":"#・再生中・音声・#:#・メンテナンス中","已經是最後一則":"これが最後の1件です","走向民主這條路 的圖片":"民主主義への道のり の画像","走向民主這條路（第 # 張，共 # 張）":"民主主義への道のり（#枚目、全#枚）","#・已聽完・語音・#:#・維護中":"#・聴取済み・音声・#:#・メンテナンス中","#F 第一特展室・# 個":"#階 第1特別展示室・#か所","展品 #・#F 第一特展室":"展示品 #・#階 第1特別展示室","媽祖原為只知其姓的巫女林氏，經由歷代對媽祖顯聖事蹟的層累，形塑出神通廣大的女聖人樣貌，可看見媽祖在政治與宗教力量塑造下，成為護國救民的英烈天妃。本單元透過#至#世紀的圖像與經典文獻，看見媽祖的形象在官方與民間的共同詮釋下，逐步確立為天后林默的過程。":"媽祖はもともと、姓だけが伝わる巫女の林氏でした。歴代にわたる霊験の積み重ねによって、神通力に優れた女性の聖人の姿が形づくられ、政治と宗教の力の中で、国を護り民を救う烈婦の天妃となっていった様子が見て取れます。このユニットでは、#〜#世紀の図像と経典文献を通して、官と民の双方の解釈のもとで、媽祖の姿が次第に天后・林黙として確立していく過程をたどります。","單元一｜海濱神姑：海口女巫的天后之路 的圖片":"ユニット1｜海辺の巫女：港の巫女が天后になるまで の画像","單元一｜海濱神姑：海口女巫的天后之路（第 # 張，共 # 張）":"ユニット1｜海辺の巫女：港の巫女が天后になるまで（#枚目、全#枚）","媽祖的海上神蹟，深受閩、粵兩地崇奉。明代以來，隨著頻繁的海上活動，媽祖信仰從中國東南沿海出發，沿著貿易路徑向東亞諸國延伸。船員與移民隨身攜帶的神像與聖物，使媽祖香火得以越過汪洋，在異鄉落地生根；延伸至臺灣後，又向外輻射至世界各地。":"媽祖の海上での霊験は、閩（福建）と粤（広東）の両地で深く崇められました。明代以降、海上活動が盛んになるにつれ、媽祖信仰は中国南東沿岸から貿易ルートに沿って東アジア諸国へ広がりました。船乗りや移民が携えた神像や聖物によって、媽祖の香火は大海を越えて異郷に根づき、台湾に伝わった後は、さらに世界各地へ広がっていきました。","單元二｜海上福星：媽祖信仰傳播的航跡 的圖片":"ユニット2｜海の福の星：媽祖信仰が広まった航跡 の画像","單元二｜海上福星：媽祖信仰傳播的航跡（第 # 張，共 # 張）":"ユニット2｜海の福の星：媽祖信仰が広まった航跡（#枚目、全#枚）","媽祖信仰深入臺灣後，因地域與族群的差異，被賦予不同的稱呼與形象：是榮及雙親的孝女，是慈愛赤子的媽婆；能以施藥救疫，也在戰火之中顯聖。除了多樣性的神像外，冠服、神輿與時尚精品，也形塑出不同時代的媽祖樣貌。":"媽祖信仰は台湾に深く根づくと、地域や民族の違いによって、さまざまな呼び名や姿が与えられました。両親に栄誉をもたらす孝行娘であり、赤子を慈しむ媽婆でもあります。薬を施して疫病を救い、戦火の中でも霊験を現しました。多様な神像のほか、冠服、神輿、ファッションブランド品も、時代ごとの媽祖の姿を形づくっています。","單元三｜盛裝駕到：千變萬化的臺灣天后 的圖片":"ユニット3｜盛装でご降臨：千変万化の台湾の天后 の画像","單元三｜盛裝駕到：千變萬化的臺灣天后（第 # 張，共 # 張）":"ユニット3｜盛装でご降臨：千変万化の台湾の天后（#枚目、全#枚）","無形的靈力，憑附於有形的物件，亦降於大符與各類聖物；承受香火的香爐與運載神火的香擔，是最關鍵的靈力載體。進香、遶境與過爐，是親近媽祖的神聖時刻，也是廟與廟、人與人之間交通互動的時刻，將世代的信仰記憶傳承下去。":"目に見えない霊力は、形ある物に宿り、大きな護符やさまざまな聖物にも降ります。香火を受ける香炉と、神の火を運ぶ香担ぎは、最も重要な霊力の依り代です。進香、遶境、過炉は、媽祖に近づく神聖なひとときであり、廟と廟、人と人が交流するときでもあり、世代を越えた信仰の記憶を受け継いでいきます。","單元四｜萬年香火：當靈力鑄化為聖物 的圖片":"ユニット4｜万年の香火：霊力が聖なる品になるとき の画像","單元四｜萬年香火：當靈力鑄化為聖物（第 # 張，共 # 張）":"ユニット4｜万年の香火：霊力が聖なる品になるとき（#枚目、全#枚）","隨時代更迭與社會結構變化，天后以各類形式顯聖與再現。數位科技改變了信仰傳播途徑，媽祖信仰以媒體直播與影像跨越地域限制；素昧平生的人們也因「結緣品」而聚合，比肩同行，使媽祖信仰得以歷久彌新。":"時代の移り変わりや社会構造の変化とともに、天后はさまざまな形で霊験を現し、再び姿を現します。デジタル技術は信仰の広まり方を変え、媽祖信仰はメディアの生中継や映像によって地域の制約を越えました。見ず知らずの人々も「結縁品」を通じて集まり、肩を並べて歩み、媽祖信仰が時を経ても新しくあり続けることを可能にしています。","單元五｜善願必佑：在當代與媽祖相遇 的圖片":"ユニット5｜願いは必ず叶う：現代で媽祖に出会う の画像","單元五｜善願必佑：在當代與媽祖相遇（第 # 張，共 # 張）":"ユニット5｜願いは必ず叶う：現代で媽祖に出会う（#枚目、全#枚）","導覽語言・目前手語導覽・中文字幕":"ガイド言語・現在 手話ガイド・中国語字幕","導覽語言，目前手語導覽・中文字幕":"ガイド言語、現在 手話ガイド・中国語字幕","手語導覽影片：原住民族的語言與名字":"手話ガイド動画：先住民族の言語と名前","手語導覽影片":"手話ガイド動画","原住民族的語言與名字 的圖片":"先住民族の言語と名前 の画像","原住民族的語言與名字（第 # 張，共 # 張）":"先住民族の言語と名前（#枚目、全#枚）","臺灣文化協會會歌 的圖片":"台湾文化協会会歌 の画像","臺灣文化協會會歌（第 # 張，共 # 張）":"台湾文化協会会歌（#枚目、全#枚）","展品 #・#F 走廊延伸展區":"展示品 #・#階 廊下の延長展示エリア","當邊界被劃下時，我們如何看見真正的彼此？從過去到現在，不同時代都存在著被排除在主流社會及國家制度之外的人——他們可能沒有戶籍、沒有國籍，始終游移在法律與現實的邊界。本區從更長遠的歷史脈絡出發，回看「非公民」如何被界定與形成。":"境界が引かれたとき、私たちは本当にお互いを見ることができるのでしょうか。過去から現在まで、どの時代にも、主流社会や国家制度から排除された人々がいました。戸籍も国籍もなく、法と現実の境界をさまよい続けた人々です。このエリアでは、より長い歴史の流れから、「非市民」がどのように定義され形成されてきたのかを振り返ります。","零、非關公民歷史教室 的圖片":"ゼロ、非市民の歴史教室 の画像","零、非關公民歷史教室（第 # 張，共 # 張）":"ゼロ、非市民の歴史教室（#枚目、全#枚）","#F 第三特展室・# 個":"#階 第3特別展示室・#か所","展品 #・#F 第三特展室":"展示品 #・#階 第3特別展示室","「當動盪席捲世界，人們帶來的只是行李嗎？」臺灣的歷史與世界局勢緊密相連。來自圖伯特、緬甸、香港與烏克蘭的人們，因冷戰、政變、戰爭與迫害，陸續跨越邊界來到這裡；他們的移動不只是個人選擇，而是為了守護生命、自由、信仰與未來。":"「世界が動乱に揺れるとき、人々が持ってくるのは荷物だけでしょうか。」台湾の歴史は世界情勢と密接につながっています。チベット、ミャンマー、香港、ウクライナからの人々は、冷戦、クーデター、戦争、迫害により、次々と境界を越えてここにやって来ました。その移動は個人の選択にとどまらず、命、自由、信仰、そして未来を守るためのものでした。","一、時代浪潮下的移動：跨越邊界的生命印記 的圖片":"1、時代の波の中の移動：境界を越えた生命の刻印 の画像","一、時代浪潮下的移動：跨越邊界的生命印記（第 # 張，共 # 張）":"1、時代の波の中の移動：境界を越えた生命の刻印（#枚目、全#枚）","「跨過了邊界，邊界就消失了嗎？」「身分」的邊界，從來不是固定的，它會隨著法律制度、國際局勢與國家安全考量而被重新劃定。對許多來到臺灣的人而言，邊界不只存在於海關，也延伸到入境後的停留、居留或定居審查。":"「境界を越えたら、境界はなくなるのでしょうか。」「身分」の境界は決して固定されたものではなく、法制度、国際情勢、国家安全保障の考慮によって引き直されます。台湾に来た多くの人にとって、境界は税関だけでなく、入国後の滞在、居留、定住の審査にまで及びます。","二、看不見的邊界 的圖片":"2、見えない境界 の画像","二、看不見的邊界（第 # 張，共 # 張）":"2、見えない境界（#枚目、全#枚）","「『家』，對你來說是什麼？」對有些人而言，「家」是正在經歷戰火的地方；對流亡者而言，是宗教、文化與身分認同的延續；對離開香港的人而言，那個地方還在，卻已不同。來自不同地方的人們，帶著各自對「家」的記憶與牽掛來到臺灣。":"「あなたにとって『家』とは何ですか。」ある人にとって「家」は戦火の中にある場所であり、亡命者にとっては宗教、文化、アイデンティティの継続であり、香港を離れた人にとっては、その場所はまだあっても、もう以前とは違うものです。さまざまな場所から来た人々が、それぞれの「家」の記憶と思いを抱いて台湾にやって来ました。","三、At Home 的圖片":"3、At Home の画像","三、At Home（第 # 張，共 # 張）":"3、At Home（#枚目、全#枚）","「當全球的流離與遷徙來到臺灣，我們將讓邊界變窄，還是讓關係展開？」我們看見人們在動盪中離開家園，看見人的身分如何在穿越邊界後被重新定義，也看見許多人在不安的處境中，仍努力在這裡生活、行動並照顧彼此。":"「世界の流浪と移動が台湾に訪れたとき、私たちは境界を狭くするのでしょうか、それとも関係を広げるのでしょうか。」動乱の中で故郷を離れる人々、境界を越えた後に身分が定義し直される様子、そして不安な状況の中でも、ここで暮らし、行動し、互いを気遣おうと努力する多くの人々の姿が見えます。","四、邊界上的未盡旅程 的圖片":"4、境界線上の終わらない旅 の画像","四、邊界上的未盡旅程（第 # 張，共 # 張）":"4、境界線上の終わらない旅（#枚目、全#枚）","展品 #・#F 臺灣，交會之島":"展示品 #・#階 台湾、出会いの島","這件展品位在「臺灣，交會之島」單元。臺灣，要從「交會」開始說起。這是一段不同人群，碰撞、摸索，共有同一塊土地的故事。本單元也有母語地名故事的線上展覽。":"この展示品は「台湾、出会いの島」ユニットにあります。台湾は「出会い」から語り始めなければなりません。これは、さまざまな人々がぶつかり合い、手探りしながら、同じ土地を分かち合う物語です。このユニットには、母語の地名の物語を紹介するオンライン展示もあります。","地名記憶了相遇故事 的圖片":"地名が記憶する出会いの物語 の画像","地名記憶了相遇故事（第 # 張，共 # 張）":"地名が記憶する出会いの物語（#枚目、全#枚）","展品 #・#F 倚海而生的島與人":"展示品 #・#階 海とともに生きる島と人々","這件展品位在「身陷角力戰的原住民」展區。在這段期間，隨著漢人、日本人、荷蘭人、西班牙人相繼到來，原本保持相對穩定狀態的臺灣原住民族社會受到一定程度的攪動。面對外來者，原住民各部落會主動選擇有利於部落的同盟對象，也會與敵對的勢力產生衝突。不同族群之間各有盤算，有時彼此交惡，有時維持著不穩定的聯盟關係。而外來團體間彼此也有糾葛衝突。":"この展示品は「勢力争いに巻き込まれた先住民」エリアにあります。この時期、漢人、日本人、オランダ人、スペイン人が相次いで訪れ、それまで比較的安定していた台湾先住民族の社会は、ある程度かき乱されました。外来者に直面した先住民の各部落は、自らに有利な同盟相手を主体的に選び、敵対する勢力と衝突することもありました。民族間にはそれぞれの思惑があり、時には仲違いし、時には不安定な同盟関係を保ちました。外来の集団同士にも対立や衝突がありました。","部落傳唱的荷蘭歌 的圖片":"部落で歌い継がれるオランダの歌 の画像","部落傳唱的荷蘭歌（第 # 張，共 # 張）":"部落で歌い継がれるオランダの歌（#枚目、全#枚）","展品 #・#F 山海之間的共存與競逐":"展示品 #・#階 山と海のあいだの共存と競い合い","這件展品位在「山海之間的共存與競逐」單元。#年臺灣被清朝併入版圖，大量漢人移民持續渡海前來，在平原、丘陵、沿山發展出各自的村落、產業及生活方式；在這片山與海之間的土地上，不同人群相互共存，也彼此競逐。":"この展示品は「山と海のあいだの共存と競い合い」ユニットにあります。#年に台湾が清朝の版図に組み込まれると、大量の漢人移民が海を渡って来続け、平野、丘陵、山沿いにそれぞれの村落、産業、生活様式を築きました。山と海のあいだのこの土地で、さまざまな人々が共存し、互いに競い合いました。","唐山過臺灣唸謠 的圖片":"唐山から台湾へ渡る唱え歌 の画像","唐山過臺灣唸謠（第 # 張，共 # 張）":"唐山から台湾へ渡る唱え歌（#枚目、全#枚）","展品 #・#F 新秩序下的苦悶與夢想":"展示品 #・#階 新秩序のもとでの苦悩と夢","這件展品位在「平埔原住民的人生故事」展區。不同地方的平埔社群，原本有自己的生活文化與網絡，再加上與漢人社會、清朝官府、歐美傳教士等不同人群的接觸，每個部落的際遇與發展都不盡相同。有的人與官府關係密切，身上冠有軍功、職銜；有的人則是收取地租的「番頭家」，或是跟漢人一樣投資經商；但也有更多人因為難以在原鄉過活，遠徙他處。從這些原住民社群人們的人生故事可以看到：在不同時代與際遇下，這塊土地上的人們，各自採用什麼樣的策略來生存發展。":"この展示品は「平埔先住民の人生物語」エリアにあります。各地の平埔の集団には、もともと独自の生活文化とネットワークがあり、さらに漢人社会、清朝の役所、欧米の宣教師などさまざまな人々と接したことで、各部落の境遇と発展はそれぞれ異なっていました。役所と親しく、軍功や官職を持つ人もいれば、地代を受け取る「番頭家」になった人、漢人と同じように投資や商売をした人もいました。しかし、故郷で暮らしていけず、遠くへ移り住んだ人はさらに多くいました。これらの先住民の人々の人生物語からは、さまざまな時代と境遇のもとで、この土地の人々がそれぞれどのような戦略で生き延び、発展したのかがわかります。","淺井惠倫採集平埔歌曲 的圖片":"浅井恵倫が採集した平埔の歌 の画像","淺井惠倫採集平埔歌曲（第 # 張，共 # 張）":"浅井恵倫が採集した平埔の歌（#枚目、全#枚）","這件展品位在「新時代，新產業」展區。日本時代初期將臺灣當作熱帶經濟作物和糧食的生產地，有系統地開發臺灣各項農、林、漁等產業資源，以提供日本帝國所需。工業則以新式製糖及食品加工業為主。#年代後期，總督府提出臺灣「工業化」的方針，戰爭時期並發展各項軍需工業，也替日後臺灣工業化奠定基礎。伴隨產業建設，島內外交通手段也逐漸完備。交通的完備與治安的穩定也逐步建構起臺灣旅遊業。日本帝國為展示其殖民建設成果，舉辦許多大型博覽會，產業與物產都是其中重要的宣傳面向。":"この展示品は「新時代、新産業」エリアにあります。日本統治時代の初期、日本は台湾を熱帯の経済作物と食糧の生産地とし、日本帝国が必要とする農業、林業、漁業などの資源を体系的に開発しました。工業は新式の製糖と食品加工が中心でした。#年代後半には総督府が台湾の「工業化」方針を打ち出し、戦時には各種軍需工業も発展して、のちの台湾の工業化の基礎となりました。産業の整備に伴い、島内外の交通手段も次第に整いました。交通の整備と治安の安定は、台湾の観光業も徐々に形づくりました。日本帝国は植民地建設の成果を示すため、多くの大型博覧会を開催し、産業と物産はその重要な宣伝の柱でした。","林業勞動歌 的圖片":"林業労働歌 の画像","林業勞動歌（第 # 張，共 # 張）":"林業労働歌（#枚目、全#枚）","這件展品位在「當原住民遭逢近代國家」展區。當日本帝國以近代國家形式進入臺灣，對人口、土地展開嚴密的掌控後，曾經在政治、文化上維持相對自主的山地，與雖已納入版圖但控制有限的東部地區，終於也逐步納入殖民體制。在國家的政策與征討下，原住民族的生活世界遭逢劇烈變動，並透過口述傳說，留下與官方紀錄大不相同、屬於族人觀點的歷史記憶。":"この展示品は「先住民が近代国家に出会うとき」エリアにあります。日本帝国が近代国家の形で台湾に入り、人口と土地を厳しく掌握するようになると、政治的・文化的に比較的自主性を保っていた山地や、版図に入ってはいたものの支配が限られていた東部地域も、ついに植民地体制に組み込まれていきました。国の政策と討伐のもと、先住民族の生活世界は激しく変動し、口述伝承を通して、公式記録とは大きく異なる、民族の視点による歴史の記憶を残しました。","馬蘭阿美群的歌謠 的圖片":"マラン・アミ族の歌謡 の画像","馬蘭阿美群的歌謠（第 # 張，共 # 張）":"マラン・アミ族の歌謡（#枚目、全#枚）","這件展品位在「近代教育與社會運動」展區。日本殖民者引進了近代教育，其主要目標是讓臺灣人成為「理想的日本國民」及殖民統治所需的基礎人力。但是近代教育同時啟發了臺灣人的自覺，也有不少臺灣人至島外接受教育，習得了近代議會政治民主等概念。這些新世代的知識份子不滿臺灣的殖民制度，透過政治與社會運動，取得臺灣民眾支持，形成新時代的抵抗行動，向殖民者爭取政治權利之外，也進行臺灣的社會文化改造運動。":"この展示品は「近代教育と社会運動」エリアにあります。日本の植民者は近代教育を導入しました。その主な目的は、台湾人を「理想的な日本国民」とし、植民地統治に必要な基礎的人材にすることでした。しかし近代教育は同時に台湾人の自覚も呼び覚まし、島外で教育を受け、議会政治や民主などの近代的な概念を身につけた人も少なくありませんでした。こうした新世代の知識人は台湾の植民地制度に不満を持ち、政治・社会運動を通じて台湾の人々の支持を得て、新しい時代の抵抗運動を形成し、植民者に政治的権利を求めるとともに、台湾の社会文化を改革する運動も進めました。","唱遊歌曲 的圖片":"唱歌遊戯の歌 の画像","唱遊歌曲（第 # 張，共 # 張）":"唱歌遊戯の歌（#枚目、全#枚）","臺灣文化協會會歌的原件，附在#年#月#日蔣渭水寫給林獻堂的文協創立大會邀請信裡。信中寫明，會歌平時用〈黃海戰〉曲調演唱，儀式時改用〈始政紀念歌〉曲調。":"台湾文化協会会歌の原本は、#年#月#日に蔣渭水が林献堂に宛てた、文協創立大会への招待状に添えられていました。手紙には、会歌は普段は〈黄海戦〉の曲で歌い、儀式では〈始政記念歌〉の曲に改めると記されています。","這件展品位在「現代風格起步走」展區。從都市、城鎮開始，#世紀前半的臺灣人，普遍感受到時代變革的步伐愈催愈緊，從視覺、聽覺、身體意識等感官，到社會結構、人際倫理觀念，都反映大不相同的新氣象，有人稱之為「文明」，有人戲稱為「毛斷」（modern臺語音譯）。自固有慣習裡游離而出的新一代臺灣人，憑著「和洋」（日本/西洋）混雜的技術與形式，展開創作與生活文化的改良，現代臺灣的面貌也隨之逐漸成形。":"この展示品は「モダンスタイルの始まり」エリアにあります。都市や町を皮切りに、#世紀前半の台湾の人々は、時代の変革の歩みがますます速まるのを広く感じていました。視覚、聴覚、身体感覚から、社会構造、人間関係の倫理観に至るまで、まったく異なる新しい気風が表れ、それを「文明」と呼ぶ人もいれば、「モーダン」（modernの台湾語の音訳）と戯れて呼ぶ人もいました。従来の慣習から抜け出した新世代の台湾人は、「和洋」（日本・西洋）が混ざった技術と形式で、創作や生活文化の改良を進め、現代台湾の姿も次第に形づくられていきました。","流行音樂的誕生 的圖片":"流行音楽の誕生 の画像","流行音樂的誕生（第 # 張，共 # 張）":"流行音楽の誕生（#枚目、全#枚）","這件展品位在「戰爭淹沒了社會：臺灣人的二次世界大戰」展區。#年代，總督府特別重視農漁村的經濟自立，推展部落振興運動，由上至下進行社區改造，推行社會教化，欲在鄉村建立一套新秩序。戰爭爆發後，社會教化體系便轉為支援戰爭的動員組織。臺灣人一方面過著緊縮的物質生活，另一方面還要面對皇民化運動的強大文化壓力，被鼓勵放棄自己原有的語言、姓名，甚至走向戰場、失去生命。":"この展示品は「戦争に呑み込まれた社会：台湾人の第二次世界大戦」エリアにあります。#年代、総督府は農漁村の経済的自立を特に重視し、部落振興運動を進め、上から下へ地域改造と社会教化を行って、農村に新しい秩序を築こうとしました。戦争が始まると、社会教化の体系は戦争支援の動員組織に変わりました。台湾の人々は、切り詰めた物質生活を送る一方で、皇民化運動の強い文化的圧力にも向き合い、自らの言語や姓名を捨てるよう促され、さらには戦場に赴いて命を落とすことさえありました。","終戰那一天 的圖片":"終戦のその日 の画像","終戰那一天（第 # 張，共 # 張）":"終戦のその日（#枚目、全#枚）","臺灣民主歌 的圖片":"台湾民主歌 の画像","臺灣民主歌（第 # 張，共 # 張）":"台湾民主歌（#枚目、全#枚）","展品 #・#F 走向民主這條路":"展示品 #・#階 民主主義への道のり","這件展品位在「反共復國基地」展區。#年韓戰爆發。以美國、蘇聯為首的資本主義、共產主義兩大國際陣營在東亞展開對抗，作為西太平洋「第一島鏈」關鍵位置的臺灣，由中國國民黨長期執政，成為中華民國「反共復國」的基地、「自由中國」的堡壘。隨著北京政府的外交拓展，中華民國的國際地位接連挫敗，#年退出聯合國、#年與美國斷交。然而，政府仍力主「三民主義統一中國」的政治口號，構成一黨獨大、以黨領政的威權體制。":"この展示品は「反共復国の基地」エリアにあります。#年に朝鮮戦争が勃発しました。アメリカとソ連を筆頭とする資本主義と共産主義の二大陣営が東アジアで対立し、西太平洋の「第一列島線」の要所にある台湾は、中国国民党が長期にわたり政権を握り、中華民国の「反共復国」の基地、「自由中国」の砦となりました。北京政府の外交拡大に伴い、中華民国の国際的地位は相次いで後退し、#年に国連を脱退、#年にアメリカと断交しました。しかし政府は「三民主義による中国統一」という政治スローガンを掲げ続け、一党独大・党が政を導く権威主義体制を築きました。","愛國歌曲與禁歌 的圖片":"愛国歌曲と禁歌 の画像","愛國歌曲與禁歌（第 # 張，共 # 張）":"愛国歌曲と禁歌（#枚目、全#枚）","這件展品位在「走向民主這條路」單元。#年後臺灣人熱烈參政，隨後卻受#事件的影響而噤聲；其後實施長達#年戒嚴。這條曲折的民主路，是不同意見折衝摩擦的過程，也是近兩、三代臺灣人相互看顧、多元對話的生命經驗。":"この展示品は「民主主義への道のり」ユニットにあります。#年以後、台湾の人々は熱心に政治に参加しましたが、その後#事件の影響で沈黙を余儀なくされ、続いて#年にわたる戒厳令が敷かれました。この曲がりくねった民主化の道は、異なる意見がぶつかり合う過程であり、ここ二、三世代の台湾の人々が互いに見守り合い、多様な対話を重ねてきた人生経験でもあります。","流離之音：歌曲裡的戰後原住民史 的圖片":"流浪の声：歌に見る戦後の先住民史 の画像","流離之音：歌曲裡的戰後原住民史（第 # 張，共 # 張）":"流浪の声：歌に見る戦後の先住民史（#枚目、全#枚）","展品 #・#F 最初的抵岸":"展示品 #・#階 最初の上陸","本作品發想自阿美族傳說：會發光的女孩迪雅瑪贊（Tiyamacan）被迷戀她的海神之子用海水帶走，之後化成雷聲、彩虹和各種生命。作品中的光代表迪雅瑪贊的初心，也象徵混沌大地裡蔓生而出的生命。":"この作品は、アミ族の伝説から着想を得ています。光り輝く少女ティヤマチャン（Tiyamacan）は、彼女に恋した海神の子に海水で連れ去られ、のちに雷鳴、虹、さまざまな生命に姿を変えました。作品の光はティヤマチャンの初心を表し、混沌とした大地に芽吹いた生命も象徴しています。","「生命的脈動」藝術品 的圖片":"「生命の鼓動」アート作品 の画像","「生命的脈動」藝術品（第 # 張，共 # 張）":"「生命の鼓動」アート作品（#枚目、全#枚）","英國愛丁堡 W. & A.K. Johnston 地圖出版商製作的絹本設色手繪大地圖，推定為#年的內容。圖上標了#個地名，其中#個是長老教會宣道站，反映#年代李庥、馬偕等人的宣教成果。":"イギリス・エディンバラの地図出版社W. & A.K. Johnstonが制作した、
