vention. Although Taiwan's resistance was indeed reported by media around the world, the hoped-for intervention never came. After Japanese troops landed at Keelung the Republic of Formosa collapsed rapidly and the centre of resistance moved south; many Taiwanese formed volunteer armies along the way, and in Tainan Liu Yongfu led the resistance. But with training and equipment far inferior to the Japanese, after more than half a year of resistance the main anti-Japanese forces were broken.\nBoth the Qing and the Japanese left a great deal of pictorial and written material from this war, including photographs and drawings. Qing pictorials, such as this imagined picture of General Liu capturing and beheading the Japanese governor Kabayama, mostly took Liu Yongfu's brave resistance as their subject, and even invented the \"fake news\" that Liu had executed Kabayama Sukenori, the future governor-general — reflecting people's hopes for the war at the time. Japanese works such as Fūzoku Gahō, on the other hand, stressed the bravery of the Japanese army and vilified the Qing troops and volunteers, and also contained much invention: the nishiki-e of the occupation of Taipei fabricated a scene of the Japanese army heroically taking the city, when in fact Taipei opened its gates and no battle took place. Compared with the Qing and Japanese sides, Taiwanese popular resistance left relatively little material; you can listen here to the ballad \"Song of the Democratic Republic of Taiwan\" and to the various ways Prince Kitashirakawa is said to have died, which speak for the feelings of the Taiwanese."}, "ja": {"n": "鉅変1895", "txt": "当初、台湾の仕紳や官吏は台湾割譲の知らせを受けてそのまま屈することを望まず、「台湾民主国」を組織し、この藍地に黄虎の旗を掲げて日本の接収に抵抗し、国際的な関心と干渉を引き起こそうとしました。台湾の抗日活動は各国メディアの報道を呼びましたが、期待された国際的干渉は起こりませんでした。日本軍が基隆に上陸すると台湾民主国は急速に崩壊し、台湾の抗日の重心は南へ移ります。道中では多くの台湾民衆が義勇軍を組織して抵抗し、台南では劉永福が指導にあたりました。しかし訓練と装備は日本軍にはるかに及ばず、半年あまりの抵抗を経て主要な抗日勢力も瓦解を告げます。\nこの戦争では、清・日双方とも写真や図絵を含む大量の図文資料を残しました。清側の画報、たとえばこの「劉大将軍が倭督樺山を擒え斬首する図」は、多くが劉永福の勇敢な抗日を題材に描かれ、のちの台湾総督・樺山資紀を劉永福が斬ったという「偽の報せ」まで作り出しています。そこには当時の人々がこの戦争に抱いた期待が映っています。一方、日本側が残した『風俗画報』などは、日本軍の勇敢さをことさら強調し、抗日の清軍や義勇軍を醜く描きました。そこにも虚構が少なくなく、台北城占領の錦絵は日本軍が勇敢に台北城を落とした場面を創作していますが、史実では台北城は自ら城門を開き、戦闘は起きていません。清・日双方に比べると台湾民間の抗日勢力が残した資料は少なく、ここでは『台省民主歌』の歌謡や、能久親王のさまざまな死に方の伝説などから、台湾の人々の心の声を聞くことができます。"}, "ko": {"n": "거변 1895", "txt": "처음에 타이완의 사신(士紳)과 관리들은 타이완 할양 소식을 듣고 그대로 굴복하려 하지 않고 '타이완민주국'을 조직해, 이 남색 바탕에 황색 호랑이가 그려진 깃발을 내걸고 일본의 접수에 저항하며 국제사회의 관심과 개입을 끌어내려 했습니다. 타이완의 항일 활동은 각국 언론의 보도를 불러왔지만, 기대했던 국제적 개입은 일어나지 않았습니다. 일본군이 지룽에 상륙하자 타이완민주국은 빠르게 무너졌고 항일의 중심은 남쪽으로 옮겨 갔습니다. 가는 길마다 많은 타이완 민중이 의용군을 조직해 저항했고, 타이난에서는 류융푸가 이끌었습니다. 그러나 훈련과 장비가 일본군에 크게 못 미쳐 반년 남짓의 저항 끝에 주요 항일 세력도 무너졌습니다.\n이 전쟁에서 청과 일본 양측 모두 사진과 그림을 포함한 대량의 자료를 남겼습니다. 청 측의 화보, 예컨대 이 '류 대장군이 왜독 가바야마를 사로잡아 참수하는 그림'은 대개 류융푸의 용감한 항일을 소재로 삼았고, 훗날 타이완 총독이 되는 가바야마 스케노리를 류융푸가 베었다는 '가짜 소식'까지 만들어 냈습니다. 여기에는 당시 사람들이 이 전쟁에 품었던 기대가 담겨 있습니다. 한편 일본 측이 남긴 『풍속화보』 등은 일본군의 용맹을 특히 강조하고 항일 청군과 의용군을 추하게 그렸는데, 여기에도 꾸며낸 부분이 적지 않습니다. 타이베이성 점령 니시키에는 일본군이 용감히 타이베이성을 함락한 장면을 지어냈지만, 실제로 타이베이성은 스스로 성문을 열었고 전투는 일어나지 않았습니다. 청·일 양측에 비해 타이완 민간 항일 세력이 남긴 자료는 적습니다. 이곳에서는 『타이성민주가』 노래와 기타시라카와노미야의 여러 죽음 전설 등을 통해 타이완 사람들의 속마음을 들을 수 있습니다."}}, "g23": {"en": {"n": "Building the Japanese Colonial System", "txt": "As we enter the period of Japanese rule, the police station at the very centre of this area shows that the police system was an important institution through which Japanese colonial rule controlled Taiwanese society. The police and the baojia system, responsible for keeping order and enforcing the law, together with the administrative bureaucracy headed by the Government-General and the educational system centred on primary and public schools, were the three great channels through which state power was carried out.\nInside the station are displays on important policies of the Japanese period. Japan governed Taiwan on the basis of scientific surveys and the large quantities of data they produced, while presenting itself as the agent of civilisation. Unifying the whole island was one of its important policies. The clock you see here shows the Government-General's policy of replacing the traditional system of twelve double-hours with a 24-hour clock, unifying the sense of time.\nThe Great Bodhisattva of the Police in the middle holds a sword in one hand and prayer beads in the other, symbolising a strategy of rule that combined coercion with conciliation; the many arms reaching out behind the policeman, each holding a different object, show how widely the Japanese police governed, covering every aspect of Taiwanese life and wielding great authority. The hand holding scales at the lower right stands for the police role in promoting and managing the Government-General's policy of unified weights and measures. In the case opposite are the various \"metric\" measuring tools laid down by the Japanese, including a dou for measuring rice, metric scales, and a chart comparing the different lengths of the chi used in various places with the chi set by Japan."}, "ja": {"n": "日本の植民体制の確立", "txt": "日本統治期に入ると、展示区域のちょうど中央にある警察の派出所が示すとおり、警察制度は日本の植民統治が台湾社会を統制するうえで重要な制度でした。治安の維持と法令の執行を担う警察・保甲の系統は、総督府を頂点とする行政官僚体系、小学校・公学校を中心とする教化の系統とあわせて、国家権力を貫徹する三大経路でした。\n派出所に入ると、日本時代の重要な政策に関する展示が並びます。日本は台湾において、科学的調査と調査で得た大量のデータを統治の根拠とし、同時に自らを文明の代理人として宣伝しました。統治の過程では全島の一体化が重要な政策とされます。ここに見える時計は、総督府が12時辰の伝統的な時刻制に代えて24時間制を採り、時間の観念を統一した政策を示しています。\n中央の南無警察大菩薩は、一方の手に剣、もう一方の手に数珠を持ち、日本の統治戦略が高圧と懐柔を併用したことを象徴します。警察の背後から伸びる、それぞれ異なる品を手にした多くの腕は、日本の警察の管理範囲の広さを示し、台湾の人々の生活のあらゆる面に及ぶ強い権威を持っていたことを表します。右下の秤を持つ手は、警察が総督府の度量衡統一政策の推進と管理を担ったことを表しています。向かいの展示ケースには、日本が定めた各種の「メートル法」の度量衡の道具が展示されており、米を量る斗、メートル法の秤、そして元来各地で異なっていた「尺」と日本が定めた「尺」との対照図などがあります。"}, "ko": {"n": "일본 식민 체제의 확립", "txt": "일본 통치기로 들어서면, 전시 구역 한가운데 있는 경찰 파출소가 보여 주듯 경찰 제도는 일본 식민 통치가 타이완 사회를 통제하는 중요한 제도였습니다. 치안 유지와 법령 집행을 맡은 경찰·보갑 체계는 총독부를 정점으로 한 행정 관료 체계, 소학교·공학교를 중심으로 한 교화 체계와 더불어 국가 권력을 관철하는 세 갈래 통로였습니다.\n파출소에 들어가면 일본 시대의 주요 정책에 관한 전시가 놓여 있습니다. 일본은 타이완에서 과학적 조사와 거기서 얻은 방대한 자료를 통치의 근거로 삼는 한편, 스스로를 문명의 대리인으로 선전했습니다. 통치 과정에서는 전 섬의 일체화가 중요한 정책이었습니다. 여기 보이는 시계는 총독부가 12시진의 전통 시각 제도를 24시간제로 바꾸어 시간 관념을 통일한 정책을 보여 줍니다.\n가운데의 '남무경찰대보살'은 한 손에 칼, 다른 손에 염주를 들어 일본의 통치 전략이 강압과 회유를 함께 썼음을 상징합니다. 경찰 뒤로 뻗어 나온, 저마다 다른 물건을 든 여러 팔은 일본 경찰의 관리 범위가 얼마나 넓었는지, 타이완 사람들의 생활 전반에 미치는 강한 권위를 지녔음을 보여 줍니다. 오른쪽 아래 저울을 든 손은 경찰이 총독부의 도량형 통일 정책을 추진하고 관리하는 역할을 맡았음을 나타냅니다. 맞은편 진열장에는 일본이 정한 각종 '미터법' 도량형 도구가 전시되어 있으며, 쌀을 재는 말, 미터법 저울, 그리고 본래 지역마다 달랐던 '척'과 일본이 정한 '척'을 비교한 그림 등이 있습니다."}}, "g24": {"en": {"n": "Indigenous Peoples Meet the Modern State", "txt": "Towards indigenous peoples, especially in the mountain areas the Qing had not directly governed, the Government-General carried out a planned policy combining suppression and conciliation, forcing state power into indigenous communities. First it used anthropologists such as Inō Kanori to carry out surveys, grasping indigenous customs and culture through anthropological classification and research. Then it controlled communities by armed suppression and the stationing of police, while setting up education centres to teach indigenous people and lead them gradually to identify with Japan in thought and outlook. Economically, new industries were promoted in the communities, changing their original modes of production. Through these policies, Taiwan's indigenous peoples gradually became new subjects under Japanese rule.\nIn the encounter between indigenous peoples and the Government-General, conflict and cooperation were interwoven. Besides the well-known Musha Incident, the Chikasuan community to which this great feather crown belonged at first cooperated with the Japanese; later, when the Government-General conscripted its people to guard the guard-line but failed to pay them on time, conflict broke out and Japanese police were killed or wounded. The Government-General immediately mobilised troops and police to attack the community — the Chikasuan Incident. Fleeing their village in haste, the Chikasuan people did not take with them the great feather crown so important in their traditional culture; the one on display was recently remade by their descendants in the indigenous cultural revitalisation movement, after research drawing on elders' accounts and comparable objects from other communities.\nTransforming indigenous people through education, to make them the ideal subjects in Japanese eyes, was an important policy of the Government-General. The chart of indigenous education centres and public schools shows how such centres and schools were set up around the island. Indigenous children who entered them would have looked much like those on the postcard of an education centre: wearing the prescribed uniform, learning Japanese and the curriculum the Japanese had designed. At first these courses aimed mainly at \"civilising\" and \"guiding agriculture\"; later, in the kōminka period, they shifted further towards making indigenous peoples into \"true Japanese\"."}, "ja": {"n": "先住民が近代国家に出会うとき", "txt": "先住民族、とりわけ清朝の官府が直接管理していなかった山地地域に対し、総督府は計画的に鎮圧と懐柔を併用する政策を実施し、国家の力を先住民の部落へ強引に及ぼしました。総督府はまず伊能嘉矩ら人類学者による調査を通じて、人類学的な分類・研究の方法で先住民の伝統的習俗と生活文化を把握します。次に武力による鎮圧と警察の駐在によって部落を統制し、同時に教育所を設けて先住民を教育し、思想や観念の面でしだいに日本に同一化させようとしました。経済面では部落に新しい産業を導入し、もとの生産形態を変えていきます。これらの政策により、台湾の先住民族はしだいに日本統治下の新しい「国民」となっていきました。\n先住民と総督府が出会う過程では、衝突と協力が交錯しました。著名な霧社事件のほかに、この大羽冠が属する七脚川社は、当初は日本人と協力的な態度をとっていましたが、のちに総督府が社の人々を隘勇線の守備に徴用しながら報酬を期日どおり支払わなかったことなどから日本人と衝突し、日本の警察に死傷者が出ます。総督府はただちに軍警を動員して部落を攻撃しました。これが七脚川事件です。七脚川の族人は部落から逃れる際、急いでいたため伝統文化で重要な大羽冠を持ち出せませんでした。展示されているこの一点は、近年の先住民文化復振運動のなかで、七脚川社の子孫が長老の口述や他の部落の同種の文物を参照し、考証を経て新たに作り直したものです。\n教育によって先住民を改造し、日本人の目から見た理想的な国民にすることは、総督府の先住民統治の重要な政策でした。蕃童教育所・蕃人公学校の表図からは、日本が各地に蕃童教育所と蕃人公学校を設けた状況がわかります。学びに入った先住民の児童は、蕃童教育所の絵葉書に見られるように、定められた服装を身につけ、日本語と日本人が計画した課程を学んだことでしょう。これらの課程は当初「開化」「農耕の指導」を主な目的としていましたが、のちの皇民化期には、先住民族を「真の日本人」にすることへとさらに変わっていきました。"}, "ko": {"n": "원주민이 근대 국가를 만났을 때", "txt": "원주민, 특히 청 관청이 직접 관리하지 않던 산간 지역에 대해 총독부는 계획적으로 진압과 회유를 함께 쓰는 정책을 시행하며 국가의 힘을 원주민 부락에 강제로 밀어 넣었습니다. 총독부는 먼저 이노 가노리 등 인류학자의 조사를 통해 인류학적 분류와 연구 방식으로 원주민의 전통 풍습과 생활 문화를 파악했습니다. 이어 무력 진압과 경찰 주재로 부락을 통제하는 한편 교육소를 세워 원주민을 교육하며 사상과 관념 면에서 점차 일본에 동화되게 했습니다. 경제적으로는 부락에 새로운 산업을 들여와 본래의 생산 형태를 바꾸었습니다. 이러한 정책으로 타이완 원주민은 점차 일본 통치 아래의 새로운 '국민'이 되어 갔습니다.\n원주민과 총독부가 만나는 과정에서는 충돌과 협력이 교차했습니다. 잘 알려진 우서 사건 외에, 이 큰 깃털관이 속한 치자오촨사는 처음에는 일본인과 협력적인 태도를 취했습니다. 그러나 이후 총독부가 마을 사람들을 애용선 수비에 동원하고도 보수를 제때 지급하지 않은 일 등으로 일본인과 충돌해 일본 경찰에 사상자가 생겼습니다. 총독부는 곧바로 군과 경찰을 동원해 부락을 공격했는데, 이것이 치자오촨 사건입니다. 치자오촨 사람들은 부락을 떠나며 서두르는 바람에 전통문화에서 중요한 큰 깃털관을 가지고 나오지 못했습니다. 전시된 이 관은 최근 원주민 문화 부흥 운동 속에서 치자오촨사 후손들이 어르신들의 구술과 다른 부락의 같은 종류 유물을 참고해 고증을 거쳐 새로 만든 것입니다.\n교육으로 원주민을 바꾸어 일본인이 보는 이상적인 국민으로 만드는 일은 총독부 원주민 통치의 중요한 정책이었습니다. 번동교육소·번인공학교 도표에서는 일본이 각지에 번동교육소와 번인공학교를 설치한 상황을 볼 수 있습니다. 배움에 들어간 원주민 아동은 번동교육소 엽서에서 보듯 정해진 복장을 입고 일본어와 일본인이 짠 교육 과정을 배웠을 것입니다. 이 과정은 처음에는 '개화'와 '농경 지도'를 주된 목적으로 했지만, 뒷날 황민화 시기에는 원주민을 '진정한 일본인'으로 만드는 쪽으로 더욱 바뀌어 갔습니다."}}, "g25": {"en": {"n": "New Era, New Industries", "txt": "In the early period of Japanese colonisation, Taiwan was treated as a producer of tropical cash crops and food. Through infrastructure projects and surveys and prospecting of industries, new techniques and varieties were systematically introduced to develop Taiwan's agricultural, forestry and fishery resources and supply the needs of Japan itself.\nGrowing sugarcane and making sugar were important industries in Japanese-period Taiwan. Through policies favourable to Japanese investors — rewarding Japanese investment, improving varieties and setting up a district harvesting system — the Government-General encouraged new sugar factories across the island, making Taiwan an important sugar exporter worldwide. From the late 1930s the Government-General set out a policy of \"industrialisation\" for Taiwan, promoting construction that included many wartime military industries and laying the foundation for Taiwan's later industrialisation.\nAfter putting transport, public order and sanitation in order, the Government-General began to promote tourism vigorously and to print travel books and advertisements. In the 1920s the Taiwan Daily News ran a public vote for the \"Eight Views of Taiwan\", setting off a wave of travel whose influence continues today; sites such as Sun Moon Lake and Alishan rose to fame then. To meet tourist demand, local specialities and souvenirs were developed everywhere: bananas and pineapples evoking a southern land, model bamboo rafts from Tainan, indigenous crafts and more were all popular with visitors."}, "ja": {"n": "新しい時代、新しい産業", "txt": "日本が台湾を植民地とした初期、台湾は熱帯の経済作物と食糧の生産地として位置づけられました。各種の基礎建設の推進と産業の調査・探査を通じて、新しい技術と品種が体系的に導入され、台湾の農業・林業・漁業などの資源が開発され、日本本国の需要に供されます。\n砂糖黍の栽培と製糖は、日本時代の台湾の重要な産業でした。総督府は日本人の投資奨励、品種改良、区域ごとの採収制度の制定など、日本の投資家に有利な政策を通じて各地に新式糖廠の設立を促し、台湾を世界有数の砂糖輸出地にしました。1930年代後期、総督府は台湾の「工業化」方針を打ち出し、多くの戦時軍需工業を含む関連建設を進め、のちの台湾の工業化の基礎を築きます。\n交通・治安・衛生を整えたのち、総督府は観光旅行産業の推進に力を入れ、旅行書や広告を印刷しました。1920年代には『台湾日日新報』が「台湾八景」を投票で選び、旅行ブームを起こします。その影響は今日まで続き、日月潭や阿里山などの名所はこの時期に興りました。観光客の消費に応じて各地で土産や特産品の開発も始まり、南国の印象を強調するバナナやパイナップル、台南の竹筏の模型、先住民の工芸品などは、いずれも観光客に大変人気のある土産でした。"}, "ko": {"n": "새로운 시대, 새로운 산업", "txt": "일본이 타이완을 식민지로 삼은 초기, 타이완은 열대 경제 작물과 식량의 생산지로 자리매김되었습니다. 각종 기반 시설 건설과 산업 조사·탐사를 통해 새로운 기술과 품종이 체계적으로 도입되어 타이완의 농업·임업·어업 자원이 개발되었고, 일본 본국의 수요에 공급되었습니다.\n사탕수수 재배와 제당은 일본 시대 타이완의 중요한 산업이었습니다. 총독부는 일본인 투자 장려, 품종 개량, 구역별 수확 제도 제정 등 일본 투자자에게 유리한 정책으로 각지에 신식 제당 공장 설립을 북돋아 타이완을 세계적인 설탕 수출지로 만들었습니다. 1930년대 후반 총독부는 타이완의 '공업화' 방침을 내놓고 전시 군수 공업을 포함한 여러 건설을 추진해 훗날 타이완 공업화의 토대를 놓았습니다.\n교통·치안·위생을 정비한 뒤 총독부는 관광 산업을 적극 추진하고 여행서와 광고를 찍어 냈습니다. 1920년대에는 『타이완일일신보』가 '타이완 8경'을 투표로 뽑아 여행 붐을 일으켰고, 그 영향은 오늘날까지 이어져 르웨탄과 아리산 같은 명소가 이 시기에 떠올랐습니다. 관광객의 소비에 맞춰 각지에서 특산품과 기념품 개발도 시작되어, 남국의 인상을 강조한 바나나와 파인애플, 타이난의 대나무 뗏목 모형, 원주민 공예품 등이 모두 관광객에게 큰 인기를 끌었습니다."}}, "g26": {"en": {"n": "Modern Education and Social Movements", "txt": "The Government-General set up an education system in Taiwan based on primary and public schools, training people to serve colonial rule through modern education; in the process it also opened a path for Taiwanese intellectuals to encounter contemporary Western knowledge. The school curriculum of the time included \"national language\" — that is, Japanese — to build basic civic ability; moral training to cultivate loyalty to the emperor, patriotism and the \"Japanese spirit\"; history to shape identification with Japan, and so on. There were also many practical subjects such as agricultural practice and abacus, as well as gymnastics to train the body and the spirit of obedience.\nThe building of the education system also drove the rise of a credential system in Taiwan. On the blackboard before you are job advertisements printed in a newspaper of the Japanese period; look closely and you will see that educational qualifications had already become an important condition for applying for work."}, "ja": {"n": "近代教育と社会運動", "txt": "総督府は台湾に小学校・公学校を基礎とする教育体系を設け、新式教育を通じて植民統治に奉仕する人材を育てました。その過程で、台湾の知識人が同時代の西洋の知に触れる道も開かれます。当時の学校の課程には、国民としての基礎能力を養う「国語」すなわち日本語の課程、忠君愛国の観念と「日本精神」を養う修身の課程、日本への帰属意識を形づくる歴史の課程などがありました。同時に、生活に役立つ技能に関わる農業実習や珠算の課程、国民の身体と服従の精神を鍛える体操の課程も数多く置かれました。\n教育体系の構築は、台湾における学歴制度の興隆にも影響しました。目の前の黒板には日本時代の新聞の求人広告が印刷されています。よく見ると、学歴がすでに仕事に応募する際の重要な条件になっていたことがわかります。"}, "ko": {"n": "근대 교육과 사회 운동", "txt": "총독부는 타이완에 소학교·공학교를 기초로 한 교육 체계를 세워 신식 교육을 통해 식민 통치에 복무할 인력을 길렀습니다. 그 과정에서 타이완 지식인이 당대 서구 지식을 접하는 길도 열렸습니다. 당시 학교 교육 과정에는 국민으로서의 기초 능력을 기르는 '국어' 곧 일본어 과목, 충군애국 관념과 '일본 정신'을 기르는 수신 과목, 일본에 대한 귀속감을 형성하는 역사 과목 등이 있었습니다. 동시에 생활에 쓰이는 기능과 관련된 농업 실습과 주산 과목, 국민의 신체와 복종 정신을 단련하는 체조 과목도 많이 두었습니다.\n교육 체계의 구축은 타이완에서 학력 제도가 자리 잡는 데에도 영향을 주었습니다. 눈앞의 칠판에는 일본 시대 신문의 구인 광고가 인쇄되어 있습니다. 자세히 보면 학력이 이미 일자리에 지원할 때의 중요한 조건이 되어 있었음을 알 수 있습니다."}}, "g27": {"en": {"n": "Modern Style Takes Its First Steps", "txt": "In the 1920s Taiwanese intellectuals, both of the older and newer kind, dissatisfied with the Government-General's colonial policies, used newspapers, political movements and social movements, founding organisations such as the Taiwan Cultural Association to rally people, calling for political rights and the establishment of a parliament, and seeking to enlighten society and reform cultural customs.\nModern education also shaped a group of \"new women\". Unlike Taiwanese women before them, these women were educated, had a degree of economic capacity, and built a new sense of self in their thinking.\nIn the towns, the Government-General actively carried out \"city rectification\" plans, including rebuilding shop-houses, widening roads, and installing sanitary sewers, fire services, green spaces and other public facilities, gradually reshaping Taiwan's traditional streets and settlements into \"modern\" cities. The row of shop-houses before us — a general store, a kimono shop, a photography studio, a café and a clinic — reflects the appearance of new streets, consumer culture and mass entertainment in the Japanese period, and shows the great changes in the life of ordinary Taiwanese."}, "ja": {"n": "モダンなスタイルの始まり", "txt": "1920年代、台湾の新旧の知識人は総督府の植民政策に不満を抱き、新聞の発行、政治運動と社会運動を通じて、台湾文化協会などの組織をつくって民衆に呼びかけ、政治的権利の獲得と議会の設置を唱え、台湾の社会大衆を啓蒙し文化習俗を改造しようとしました。\n新式教育はまた、一群の「新時代の女性」を生み出しました。彼女たちは従来の台湾女性とは異なり、教育を受け、一定の経済力を持ち、思想の面でも新しい自己の認識を築いていきました。\n町では総督府が「市区改正」計画を積極的に進め、街屋の改造、道路の拡幅、衛生的な下水道・消防・緑地などの公共施設の整備を行い、台湾の伝統的な市街や集落をしだいに「近代的」な都市の姿へと変えていきました。目の前のこの街屋の列は、それぞれ雑貨店・呉服店・写真館・喫茶店・診療所で、日本時代の新しい街並み、消費文化、大衆娯楽の出現を映し出し、日本時代の台湾の人々の生活の大きな変化を示しています。"}, "ko": {"n": "모던한 양식의 첫걸음", "txt": "1920년대 타이완의 신구 지식인들은 총독부의 식민 정책에 불만을 품고 신문 발행, 정치 운동과 사회 운동을 통해 타이완문화협회 같은 조직을 만들어 민중에게 호소하며 정치적 권리 획득과 의회 설치를 주장했고, 타이완 사회 대중을 계몽하고 문화 습속을 바꾸고자 했습니다.\n신식 교육은 또한 한 무리의 '신여성'을 만들어 냈습니다. 이들은 이전의 타이완 여성과 달리 교육을 받고 일정한 경제력을 지녔으며 사상 면에서도 새로운 자기 인식을 세워 갔습니다.\n도시에서는 총독부가 '시구 개정' 계획을 적극 추진해 가로변 상가 건물 개조, 도로 확장, 위생적인 하수도·소방·녹지 등 공공시설 정비를 진행하며 타이완의 전통 시가와 취락을 점차 '근대적' 도시의 모습으로 바꾸어 갔습니다. 눈앞의 이 상가 건물 줄은 각각 잡화점·포목점·사진관·찻집·진료소로, 일본 시대의 새로운 거리 풍경과 소비 문화, 대중 오락의 등장을 보여 주며 일본 시대 타이완 사람들의 생활에 일어난 큰 변화를 나타냅니다."}}, "g28": {"en": {"n": "War Engulfed Society: Taiwanese in the Second World War", "txt": "In the later Japanese period Taiwan was drawn into a long war. Under war conditions every aspect of Taiwan's politics, economy, society and education had to serve the war effort. To meet wartime needs the Government-General launched the kōminka movement, encouraging Taiwanese to give up their own language and names in favour of Japanese, in an attempt to make them loyal subjects of the Japanese emperor. In matters of belief, the relatively relaxed management of folk religion was tightened; under the slogan \"a shrine for the nation, a kamidana for the home\", shrines were actively built to replace traditional temples, and attempts were even made to confiscate temple property, without success. In the home, the Government-General promoted Japanese-style kamidana to replace the traditional main-hall arrangement.\nIn wartime, Taiwanese society was filled with all kinds of propaganda: raising war supplies, encouraging saving, lifting morale, cracking down on the black market and much more. From this propaganda we can glimpse the course of the war and life in Taiwan under it. The poster on eliminating the black market, for instance, reflects how people gathered necessities through underground channels when supplies were scarce and rations insufficient. The poster \"Decisive Battle! Special Collection of Copper and Iron\" shows Japan's shortage of metals such as copper and iron after a long war, while the map \"Destroy America and Britain: A Grand View of the Construction of Greater East Asia\" tells us of the Japanese empire's optimistic belief that its forces moving south into South-East Asia would be welcomed and supported by local people and would strike its enemies hard.\nIn the final phase of the war, to make up for the shortage of manpower, Taiwanese were mobilised in turn as military labourers, military civilian employees, volunteer soldiers and conscripts. Before departure, outwardly glorious send-off ceremonies were often held, with signed flags or senninbari given to pray for the soldier's good fortune in war, and photographs taken with family and colleagues. But war is always cruel. Here is the box of belongings of Lin Qingchun, a Taiwanese soldier killed in an air raid; after being kept by his family for decades it was donated to the museum by his brothers, in the hope of recording this history and the stories of people at the time. Taiwanese who served as Japanese soldiers at the end of the Second World War were long overlooked after the war — they too sacrificed for the state of their time, yet were left in an awkward position seldom mentioned by either side.\nOn 15 August 1945 the Japanese emperor read out the Imperial Rescript on the Termination of the War over the radio. People of different generations, backgrounds and nationalities felt very differently about the \"end of the war\": some were at a loss, others rejoiced that it was over. Collected here are the different memories of that day from many who lived through it; if you have time later, come back and listen, and experience the many sides of history."}, "ja": {"n": "戦争が社会を呑み込んだ：台湾人の第二次世界大戦", "txt": "日本時代の後期、台湾は長期の戦争に巻き込まれました。戦時下では台湾の政治・経済・社会・教育のあらゆる面が戦争に奉仕することを求められます。戦争の必要に応じ、総督府は「皇民化」運動を推進し、台湾人にもとの言語と姓名を捨てさせ、日本語と日本式の姓名を使わせることで、台湾人を日本の天皇に忠誠を尽くす臣民にしようとしました。信仰の面では、それまで比較的緩やかだった民間信仰の管理を引き締め、「国に神社あり、家に神棚あり」をスローガンに神社の建設を積極的に進めて伝統的な寺廟に取って代わらせ、寺廟の財産の没収も試みましたが、これは成功しませんでした。家庭では、総督府は日本式の神棚で伝統的な正庁のしつらえを置き換えることを推し進めました。\n戦争期の台湾社会は、さまざまな戦争宣伝にあふれていました。戦争物資の調達、貯蓄の奨励、民心と士気の鼓舞、闇市の取り締まりなど、その内容は多岐にわたります。戦争宣伝からは、当時の戦況と戦時下の台湾の人々の暮らしを垣間見ることができます。たとえば闇市撲滅のポスターは、戦時の物資不足と配給の不十分さのなか、人々が闇市などの地下の経路で生活必需品を集めていた状況を映しています。「決戦！銅・鉄の特別回収」のポスターは、長い戦争のもとで日本が銅や鉄などの金属資源の不足に苦しんでいたことを示し、「撃滅米英・大東亜建設大観」の地図は、日本帝国が、南下して東南アジアへ向かう日本軍が現地の人々の歓迎と支持を受け、敵を痛撃できると楽観的に見ていたことを伝えています。\n戦争末期、人手不足を補うために、軍夫・軍属・志願兵・徴兵といった形で台湾の人々が次々と戦争に動員されました。出征前にはしばしば、表向きは晴れがましい見送りの儀式が行われ、寄せ書きの旗や千人針が贈られて出征者の武運長久が祈られ、家族や同僚と記念写真が撮られました。しかし戦争はつねに残酷です。ここには空襲で亡くなった台湾人兵士・林清春の遺品箱があります。この木箱は家族の手で数十年保管されたのち、兄弟によって博物館に寄贈されました。この歴史と当時の人々の物語を記録に残したいという願いからです。第二次大戦末期の台湾籍日本兵は、戦後長いあいだ重んじられませんでした。当時の国家のために犠牲となったにもかかわらず、戦争の双方がほとんど語らない、居心地の悪い位置に置かれてきたのです。\n1945年8月15日、日本の天皇はラジオを通じて「終戦の詔書」を読み上げました。世代も背景も国籍も異なる人々は、「終戦」についてそれぞれ異なる感慨を抱きました。茫然と立ち尽くす人もいれば、戦争の終結を喜ぶ人もいました。ここにはこの日を身をもって経験した多くの人々の、「終戦」のその日についてのさまざまな記憶が集められています。のちほどお時間があれば戻ってきて耳を傾け、歴史の多面性を感じてみてください。"}, "ko": {"n": "전쟁이 사회를 삼키다: 타이완 사람들의 제2차 세계대전", "txt": "일본 시대 후기에 타이완은 오랜 전쟁에 휘말렸습니다. 전시 체제 아래 타이완의 정치·경제·사회·교육 모든 면이 전쟁에 복무하도록 요구받았습니다. 전쟁의 필요에 따라 총독부는 '황민화' 운동을 추진해 타이완 사람들에게 본래의 언어와 성명을 버리고 일본어와 일본식 성명을 쓰게 함으로써 일본 천황에게 충성하는 신민으로 만들려 했습니다. 신앙 면에서는 비교적 느슨했던 민간 신앙 관리를 조이고 '나라에는 신사, 집에는 가미다나'라는 구호 아래 신사 건설을 적극 추진해 전통 사원을 대체하려 했으며, 사원 재산 몰수도 시도했으나 성공하지 못했습니다. 가정에서는 총독부가 일본식 가미다나로 전통적인 정청(正廳) 배치를 대체하도록 밀어붙였습니다.\n전쟁기 타이완 사회는 온갖 전쟁 선전으로 가득했습니다. 전쟁 물자 조달, 저축 장려, 민심과 사기 진작, 암시장 단속 등 내용도 다양했습니다. 전쟁 선전에서는 당시 전황과 전시 타이완 사람들의 삶을 엿볼 수 있습니다. 예컨대 암시장 박멸 포스터는 전시 물자 부족과 배급 부족 속에서 사람들이 암시장 같은 지하 경로로 생활필수품을 구하던 상황을 보여 줍니다. '결전! 구리와 철의 특별 회수' 포스터는 오랜 전쟁으로 일본이 구리와 철 같은 금속 자원 부족에 시달렸음을 보여 주고, '미영 격멸·대동아 건설 대관' 지도는 일본 제국이 남하해 동남아시아로 향하는 일본군이 현지 사람들의 환영과 지지를 받아 적을 크게 칠 수 있다고 낙관했음을 알려 줍니다.\n전쟁 말기, 인력 부족을 메우기 위해 군부(軍夫)·군속·지원병·징병 등의 방식으로 타이완 사람들이 잇따라 전쟁에 동원되었습니다. 출정 전에는 겉보기에 영광스러운 환송 의식이 자주 열려 기념 서명 깃발이나 센닌바리를 건네며 무운장구를 빌고 가족·동료와 기념사진을 찍었습니다. 그러나 전쟁은 언제나 잔혹합니다. 이곳에는 공습으로 숨진 타이완인 병사 린칭춘의 유품 상자가 있습니다. 이 나무 상자는 가족이 수십 년 간직하다 형제들이 박물관에 기증한 것으로, 이 역사와 당시 사람들의 이야기를 기록으로 남기고자 하는 마음에서였습니다. 제2차 대전 말기의 타이완 출신 일본군은 전후 오랫동안 주목받지 못했습니다. 당시의 국가를 위해 희생했음에도 전쟁의 어느 쪽에서도 거의 언급되지 않는 어정쩡한 자리에 놓여 있었습니다.\n1945년 8월 15일 일본 천황은 라디오로 '종전 조서'를 낭독했습니다. 세대도 배경도 국적도 다른 사람들은 '종전'에 대해 저마다 다른 감회를 품었습니다. 망연자실한 사람도, 전쟁이 끝난 것을 기뻐한 사람도 있었습니다. 이곳에는 그날을 몸소 겪은 여러 사람의 서로 다른 기억이 모여 있습니다. 나중에 시간이 되시면 다시 들러 귀 기울이며 역사의 여러 얼굴을 느껴 보시기 바랍니다."}}, "g29": {"en": {"n": "The Great Post-War Migration", "txt": "In those turbulent years the suitcase became an object through which many remember this experience. This suitcase belonged to Ms Li Huimei. Originally from Japan, her real name was Suzuki Emiko; during the Second World War she went to Manchukuo to look for someone, and the chaos of war left her stranded in the north-east, unable to return to Japan. There she met and married her husband, who served in the Nationalist army, and afterwards moved from place to place with the army, finally settling in Kaohsiung, Taiwan, where she taught dance under the stage name Li Huimei and won prizes in many Chinese folk dance competitions. Her story and her life stand for the shared experience of migration of many people of that era.\nAt the beginning of the change of regime, Taiwanese society generally felt it was leaving colonial rule and \"returning to the motherland\", and welcomed the takeover; there was even a wave of learning Mandarin and de-Japanisation. But the two sides had been separated for a long time and there were many gaps between them; with the post-war economic collapse, slow demobilisation and frequent reports of official corruption, social tensions kept rising, until the far-reaching February 28 Incident broke out. After it, the official military suppression and \"village cleansing\" brought disaster to many of Taiwan's elite, and cast a shadow over post-war political and social development. The interactive screen in the gallery collects the important events of each day across Taiwan during the February 28 Incident; if you are interested, you can come and browse later."}, "ja": {"n": "戦後の大移動", "txt": "この動乱の時代、トランクは多くの人がこの経験を思い起こす代表的な品となりました。このトランクは李恵美さんのものです。彼女はもと日本籍で、本名を鈴木恵美子といいます。第二次大戦中、人を探して満州国に赴き、戦乱のため日本に帰れず東北に留まりました。そこで国軍に勤める男性と出会って結婚し、その後は軍とともに各地を移り、最後に台湾の高雄に定住して、李恵美の芸名で舞踊の教室を開き、多くの中華民族舞踊コンクールで受賞しました。彼女の物語と人生は、あの時代の多くの人々に共通する移動の経験を体現しています。\n政権交代の当初、台湾社会は植民地から離れ「祖国に復帰する」という思いを広く抱き、政府の接収を歓迎する態度をとりました。国語を学び、日本的なものを取り除こうとする風潮さえ生まれます。しかし双方は長く分かれており隔たりが多く、加えて戦後の経済崩壊、復員の遅れ、官員の汚職がしばしば伝えられるなかで社会の矛盾は深まり続け、ついに深い影響を残す二二八事件が起こります。事件後の官側による軍事鎮圧と清郷により、多くの台湾のエリートが不測の災いに遭い、戦後台湾の政治・社会の発展にも影を落としました。会場のインタラクティブ画面には、二二八事件の期間に台湾各地で日ごとに起きた重要な出来事が集められています。ご興味があれば、のちほどこちらで選んでご覧いただけます。"}, "ko": {"n": "전후의 대이동", "txt": "이 격동의 시대에 여행 가방은 많은 사람이 이 경험을 떠올리는 대표적인 물건이 되었습니다. 이 가방은 리후이메이 여사의 것입니다. 그는 본래 일본 국적으로 본명은 스즈키 에미코입니다. 제2차 대전 중 사람을 찾으러 만주국에 갔다가 전란으로 일본에 돌아가지 못하고 동북에 머물렀습니다. 그곳에서 국군에 복무하던 남성을 만나 결혼했고, 이후 군을 따라 여러 곳을 옮겨 다니다 마지막으로 타이완 가오슝에 정착해 리후이메이라는 예명으로 무용을 가르치며 여러 중화민족 무용 대회에서 상을 받았습니다. 그의 이야기와 삶은 그 시대 많은 사람이 공유한 이주의 경험을 보여 줍니다.\n정권 교체 초기, 타이완 사회는 식민지에서 벗어나 '조국으로 돌아간다'는 마음을 널리 품고 정부의 접수를 환영하는 태도를 보였습니다. 국어를 배우고 일본적인 것을 걷어 내려는 분위기까지 일었습니다. 그러나 양측은 오래 갈라져 있어 간극이 컸고, 전후 경제 붕괴와 더딘 복원, 관리들의 부정부패가 자주 전해지며 사회적 갈등은 계속 깊어져 마침내 깊은 영향을 남긴 2·28 사건이 일어났습니다. 사건 이후 관의 군사 진압과 청향(淸鄕)으로 많은 타이완 엘리트가 화를 입었고, 전후 타이완의 정치·사회 발전에도 그늘을 드리웠습니다. 전시장의 인터랙티브 화면에는 2·28 사건 기간에 타이완 각지에서 날마다 일어난 주요 사건이 모여 있습니다. 관심이 있으시면 나중에 이곳에서 골라 보실 수 있습니다."}}, "g30": {"en": {"n": "Base for Opposing Communism and Recovering the Mainland", "txt": "With the outbreak of the Korean War in 1950, Taiwan became an anti-communist outpost in the western Pacific within the global Cold War system. To guard against communist infiltration, martial law was imposed in Taiwan, restricting citizens' freedom of movement, speech, assembly and association. Under the anti-communist banner, society was filled with anti-communist slogans; many popular songs familiar today, such as \"Not Going Home Tonight\" and \"A Cup Full of Bitter Wine\", were banned for various reasons, while anti-communist patriotic songs were strongly promoted by the government.\nDuring the martial law period, many social elites — both Taiwanese and mainlanders — suffered political oppression and restriction, and even imprisonment, for reasons that are hard to understand today. This is a star chart made by Hu Hsin-lin, an ophthalmologist at National Taiwan University Hospital, while serving his sentence on Green Island after being arrested for taking part in a left-leaning reading group. When he later gave the chart to his son he said, half joking, that he had made it \"in case I could row away from Green Island — with a star chart I could find the direction of Taiwan\"."}, "ja": {"n": "反共復国の基地", "txt": "1950年に朝鮮戦争が勃発すると、台湾は世界の冷戦体制のもとで西太平洋地域の反共の最前線となりました。共産党の浸透を防ぐため台湾では戒厳が敷かれ、国民の行動・言論・集会結社などの権利が制限されます。反共の旗印のもと、社会にはさまざまな反共の標語やスローガンがあふれ、今日よく知られる流行歌の多くも、「今天不回家」「苦酒満杯」などさまざまな理由で発売禁止となりました。反対に、反共愛国の歌曲は政府によって大いに奨励されました。\n戒厳の時期には、本省人・外省人を問わず少なからぬ社会のエリートが、今日の目から見れば理解しがたい理由で政治的な圧迫や制限を受け、判決を受けて投獄されることさえありました。これは台湾大学病院の眼科医・胡鑫麟が、左傾思想の読書会に参加したとして逮捕され、緑島で服役していたあいだに自作した星座盤です。のちにこの星座盤を息子に渡すとき、彼は半ば冗談めかして、「万一、船を漕いで緑島から逃げられたときのために……星空図があれば台湾の方角がわかる」ために作ったのだと語りました。"}, "ko": {"n": "반공 복국의 기지", "txt": "1950년 한국전쟁이 일어나면서 타이완은 세계 냉전 체제 아래 서태평양 지역의 반공 최전선이 되었습니다. 공산당의 침투를 막기 위해 타이완에는 계엄이 시행되어 국민의 행동·언론·집회 결사 등의 권리가 제한되었습니다. 반공의 기치 아래 사회에는 온갖 반공 표어와 구호가 넘쳤고, 오늘날 잘 알려진 유행가 상당수도 '오늘은 집에 가지 않아', '쓴 술이 가득한 잔' 등 여러 이유로 금지되었습니다. 반대로 반공 애국 가요는 정부가 크게 장려했습니다.\n계엄 시기에는 본성인과 외성인을 가리지 않고 적지 않은 사회 엘리트가 오늘날의 시각으로는 이해하기 어려운 이유로 정치적 압박과 제한을 받았고, 형을 선고받아 수감되기도 했습니다. 이것은 타이완대학병원 안과 의사 후신린이 좌경 사상 독서회에 참가했다는 이유로 체포되어 뤼다오에서 복역하는 동안 직접 만든 별자리판입니다. 훗날 이 별자리판을 아들에게 주면서 그는 반쯤 농담처럼, '혹시라도 배를 저어 뤼다오를 벗어날 수 있다면… 별자리 그림이 있어야 타이완 방향을 찾을 수 있으니까' 만든 것이라고 말했습니다."}}, "g31": {"en": {"n": "Behind the Economic Miracle", "txt": "In economic terms, in the early post-war years the government solved the problem of inflation through currency reform and US aid, and used land reform to ease social tensions, gradually overcoming the difficulties of the post-war economy. Of the materials given as US aid, the one people know best is probably the sacks of flour, and children's clothes made from used flour sacks are a particularly distinctive object of the era, often seen in books. Here we have displayed a textile similar to those flour sacks; do touch it and see whether the feel of flour-sack clothing matches what you imagined.\nGuided by government economic policy, Taiwan earned foreign exchange by exporting agricultural goods and their processed products, and fostered light industry; industrial output surpassed agricultural output in the 1960s, and the booming economy earned the name \"the Taiwan economic miracle\". Coming here, you may find this scene familiar. In the era of Taiwan's economic take-off, the government promoted the policy of \"the living room as a factory\": many families' living rooms were piled with handmade goods for processing, and housewives and children home from school worked together on piecework at home. Output per household was small, but it really did add to the family income."}, "ja": {"n": "経済の奇跡の舞台裏", "txt": "経済面では、戦後初期に政府は幣制改革と米国の援助によってインフレーションの問題を解決し、土地改革を進めて台湾社会の矛盾を和らげ、戦後台湾経済の苦境をしだいに脱していきました。米国の援助物資のなかで、最もよく知られているのは袋入りの小麦粉でしょう。使い終わった小麦粉袋で作られた子どもの服は、書物でもよく目にする、その時代を象徴する品です。ここには当時の小麦粉袋に近い織物を展示しています。触れてみて、小麦粉袋の服の手触りが想像どおりかどうか確かめてみてください。\n政府の経済政策に導かれ、台湾は農産物とその加工品の輸出によって外貨を得て、民生工業の発展を支えました。工業生産額は1960年代に農業生産額を上回り、活発な経済発展は「台湾の経済の奇跡」と称えられます。ここまで来ると、この光景に見覚えのある方もいるかもしれません。台湾経済の離陸期、政府は民間に「客庁即工場（居間がすなわち工場）」の政策を進めました。多くの家庭の居間には手作業の加工品が積み上げられ、主婦と学校から帰った子どもが一緒に自宅の居間で内職をしました。一軒あたりの生産量は多くありませんが、確かに家計の収入を増やしたのです。"}, "ko": {"n": "경제 기적의 뒷모습", "txt": "경제 면에서 전후 초기 정부는 화폐 개혁과 미국의 원조로 인플레이션 문제를 해결하고 토지 개혁을 추진해 타이완 사회의 갈등을 누그러뜨리며 전후 경제의 어려움을 차츰 벗어났습니다. 미국 원조 물자 가운데 가장 잘 알려진 것은 아마 자루에 담긴 밀가루일 것입니다. 다 쓴 밀가루 자루로 만든 아이 옷은 책에서도 자주 보이는, 그 시대를 상징하는 물건입니다. 이곳에는 당시 밀가루 자루와 비슷한 직물을 전시했습니다. 직접 만져 보시고 밀가루 자루 옷의 감촉이 상상하신 것과 같은지 확인해 보세요.\n정부의 경제 정책에 따라 타이완은 농산물과 그 가공품 수출로 외화를 벌어 민생 공업의 발전을 뒷받침했습니다. 공업 생산액은 1960년대에 농업 생산액을 넘어섰고, 활발한 경제 발전은 '타이완 경제 기적'이라 불렸습니다. 여기까지 오시면 이 광경이 낯익은 분도 계실 것입니다. 타이완 경제 도약기에 정부는 민간에 '거실이 곧 공장'이라는 정책을 추진했습니다. 많은 가정의 거실에는 손으로 하는 가공품이 쌓였고, 주부와 학교에서 돌아온 아이가 함께 집 거실에서 부업을 했습니다. 한 집의 생산량은 많지 않았지만 분명 가계 수입을 늘려 주었습니다."}}, "g32": {"en": {"n": "The Money Economy", "txt": "Economic take-off and development had a definite impact on indigenous communities, changing the life they had known. Urbanisation and the collapse of the forest economy forced many to leave home for the urban labour market, another kind of migration within the island. As the money economy entered the communities, people were encouraged to go into the forests to grow cash crops such as mushrooms. But most forests had been nationalised since the Japanese period, and growing mushrooms in traditional territory often conflicted with national forest regulations. To avoid the rangers who patrolled the mountains to stop mushroom growing, people in the community would strike this alarm made from a loom with a stick when the rangers came up, warning those growing mushrooms in the hills to hide. Later, once broadcasting systems became common, the community would play \"China Must Be Strong\" to signal that the rangers had come, and \"When Will You Return\" to signal that they had left — a way of living with the conflict between state power and local needs.\nWith economic and social development, in recent years large numbers of migrant workers and marriage migrants, mainly from South-East Asia, have joined Taiwanese society as the newest wave of migration; the culture and life experience they bring enrich Taiwan's diversity. Earlier, when the internet was not yet widespread, migrant workers who had come far from home to work in Taiwan would ask shops run by fellow countrypeople for help whenever they wanted to send things home. To prove that a parcel had indeed been delivered, the shop would often ask the courier at home to take a photograph of the parcel with the worker's family, kept in the shop as proof of delivery."}, "ja": {"n": "貨幣経済", "txt": "経済の離陸と発展は、先住民の社群にも一定の衝撃を与え、部落のもとの暮らしを変えました。都市化と山林経済の崩壊により、多くの族人はやむなく故郷を離れて都市の労働市場へ入り、島内におけるもう一つの人の移動が生まれます。また貨幣経済が部落に入り、族人は山林に入って椎茸などの経済作物を栽培するよう促されました。しかし多くの山林は日本時代から国有化されており、先住民が伝統領域で椎茸を栽培する経済行為は、国有林地の法規としばしば衝突しました。椎茸栽培の取り締まりのために山を巡回する巡山員を避けるため、部落の族人は巡山員が山に入ると、この機織り機で作った警報器を棒で打ち鳴らし、山で椎茸を育てる族人に身を隠すよう知らせました。のちに放送設備が普及すると、部落では〈中国一定強〉を流して巡山員が来たことを、〈何日君再来〉を流して去ったことを伝えるようになります。国家の力と地域の必要が衝突するなかで生まれた共存の仕組みでした。\n経済と社会の発展にともない、近年は東南アジアを中心とする多くの国際移住労働者や結婚移民が台湾社会に加わり、最も新しい移民の波となっています。彼らがもたらす文化と生活の経験は、台湾の多元的な人文の風景を豊かにしています。少し前、インターネットがまだあまり普及していなかった頃、はるばる故郷を離れて台湾で働く移住労働者たちは、故郷へ何かを送りたいとき、同郷の人が営む小さな店に頼みました。店は荷物を確かに届けたことを証明するため、故郷の配達人に荷物と労働者の家族が一緒に写った写真を撮ってもらい、それを店に置いて配達の証としたのです。"}, "ko": {"n": "화폐 경제", "txt": "경제의 도약과 발전은 원주민 집단에도 적지 않은 충격을 주어 부락 본래의 삶을 바꾸었습니다. 도시화와 산림 경제의 붕괴로 많은 사람이 고향을 떠나 도시 노동 시장으로 들어가야 했고, 이는 섬 안의 또 다른 인구 이동이 되었습니다. 또 화폐 경제가 부락에 들어오면서 사람들은 산림에 들어가 표고버섯 같은 환금 작물을 재배하도록 권장받았습니다. 그러나 대부분의 산림은 일본 시대부터 국유화되어, 원주민이 전통 영역에서 버섯을 기르는 경제 행위는 국유림 법규와 자주 충돌했습니다. 버섯 재배를 단속하러 산을 도는 순산원을 피하려고, 부락 사람들은 순산원이 산에 오르면 이 베틀로 만든 경보기를 막대로 두드려 산에서 버섯을 기르는 이들에게 몸을 숨기라고 알렸습니다. 뒷날 방송 설비가 보급되자 부락에서는 〈중국일정강〉을 틀어 순산원이 왔음을, 〈하일군재래〉를 틀어 떠났음을 알렸습니다. 국가의 힘과 지역의 필요가 부딪히는 가운데 생겨난 공존의 방식이었습니다.\n경제와 사회의 발전에 따라 최근에는 동남아시아를 중심으로 많은 이주 노동자와 결혼 이민자가 타이완 사회에 합류해 가장 새로운 이민의 물결을 이루고 있습니다. 이들이 가져온 문화와 삶의 경험은 타이완의 다원적인 인문 풍경을 풍요롭게 합니다. 조금 이전, 인터넷이 아직 널리 퍼지지 않았을 때, 멀리 고향을 떠나 타이완에서 일하던 이주 노동자들은 고향으로 무언가를 부치고 싶을 때 같은 고향 사람이 운영하는 작은 가게에 부탁했습니다. 가게는 소포를 확실히 전달했음을 증명하려고 고향의 배달원에게 소포와 노동자 가족이 함께 찍힌 사진을 찍게 해 가게에 두고 배달의 증거로 삼았습니다."}}, "g33": {"en": {"n": "The Eruption of Social Energy", "txt": "As Taiwan's economy took off and grew from the 1970s, people's lives became steadily more stable and prosperous, which gradually awakened a desire to take part in politics. After martial law was lifted in 1987, Taiwan's social energy awoke: protests, petitions, self-help actions, street demonstrations and other social movements of every kind surged all at once, marking Taiwan's entry into an era of free expression. Many issues came to the surface — political questions, environmental protection, the revival of Hakka and indigenous cultures, the preservation of military dependants' village culture and more — showing a diverse and vigorous social force and current. Around this table the museum has chosen four unresolved issues that we still have to face today, standing for the many challenges and difficulties Taiwanese society will continue to meet."}, "ja": {"n": "社会の力の噴出", "txt": "1970年代以降の台湾経済の離陸と成長にともない、台湾の人々の暮らしはしだいに安定し豊かになり、それが政治参加への願いをしだいに呼び起こしました。1987年の戒厳令解除ののち、台湾の社会の力は目覚め、さまざまな訴えを掲げた抗議・請願・自力救済・街頭デモなどの社会運動が一斉に湧き起こり、台湾が自由に声をあげる時代に入ったことを示しました。社会の多くの問題が次々と表に現れます。政治的な課題、環境保護、客家と先住民の文化復興、眷村文化の保存など、多元的で活発な社会の力と潮流が表れました。このテーブルのまわりで、博物館は今日なお向き合い続けなければならない4つの未解決の課題を選びました。台湾社会がこれからも直面し続けるさまざまな挑戦と困難を象徴しています。"}, "ko": {"n": "사회의 힘이 터져 나오다", "txt": "1970년대 이후 타이완 경제의 도약과 성장에 따라 사람들의 삶은 점차 안정되고 풍요로워졌고, 이는 정치 참여에 대한 바람을 차츰 불러일으켰습니다. 1987년 계엄 해제 이후 타이완의 사회적 힘은 깨어났습니다. 온갖 주장을 내건 항의·청원·자력 구제·거리 시위 등 사회 운동이 한꺼번에 일어나며 타이완이 자유롭게 목소리를 내는 시대로 들어섰음을 보여 주었습니다. 사회의 많은 문제가 잇따라 수면 위로 떠올랐습니다. 정치적 과제, 환경 보호, 객가와 원주민의 문화 부흥, 쥐안춘 문화의 보존 등 다원적이고 활발한 사회의 힘과 흐름이 드러났습니다. 이 탁자 주위에서 박물관은 오늘날에도 계속 마주해야 하는 네 가지 미해결 과제를 골랐습니다. 타이완 사회가 앞으로도 계속 직면할 여러 도전과 어려움을 상징합니다."}}};

   一檔展覽可以有一條以上的「導覽線」。每條線＝一份清單（ids）＋一種呈現方式（kind：text／voice／sign）。
     main：主線。現正展出、展覽頁、地圖、掃碼、列表進來都是這一條。有語音就是 voice，否則 text。

function exLines(k){ const e=EXHIBITIONS[k]; if(!e) return [];

  return L; }

function exVoice(k){ const out=[]; EXHIBITIONS[k].items.forEach(id=>{ const x=it(id); if(x.voice!==false) trk(x).forEach(t=>{ t=t.replace('臺灣',''); if(!out.includes(t)) out.push(t); }); }); return out; }   /* 各展語音語言；萬相天后示意中英日韓（2026-11-11 留言） */
function langTags(k,line){
  /* 語音語言和手語合成同一個標籤（2026-11-11 留言）；手語段保留金底，第 1 輪測試要求手語一眼看得到 */
  const tg=langTag(k,'',line); return tg?`<div class="langtags">${tg}</div>`:''; }
/* 語言標籤（2026-11-11 留言改版）：所有語言同一層、不分組，一律用縮寫、固定順序，卡片與展覽頁同一種寫法；完整語言名放在 title／aria-label
   縮寫依介面語言：中文 華台客英日韓、日文 中台客英日韓、韓文 중대하영일한、英文 ZH TW HAK EN JA KO */
const LG_SH={ zh:{'中文':'華','台語':'台','客語':'客','英文':'英','日文':'日','韓文':'韓'},
  ja:{'中文':'中','台語':'台','客語':'客','英文':'英','日文':'日','韓文':'韓'},
  ko:{'中文':'중','台語':'대','客語':'하','英文':'영','日文':'일','韓文':'한'},
  en:{'中文':'ZH','台語':'TW','客語':'HAK','英文':'EN','日文':'JA','韓文':'KO'} };
const trkLabel=t=>t==='中文'?'華語':t.replace('臺灣','');   /* 2026-11-20 留言：語音語言名稱用「華語」，不是「中文」 */
const LG_FULL={ zh:{'中文':'華語','台語':'台語','客語':'客語','英文':'英語','日文':'日語','韓文':'韓語'},
  en:{'中文':'Mandarin','台語':'Taiwanese','客語':'Hakka','英文':'English','日文':'Japanese','韓文':'Korean'},
  ja:{'中文':'中国語','台語':'台湾語','客語':'客家語','英文':'英語','日文':'日本語','韓文':'韓国語'},
  ko:{'中文':'중국어','台語':'대만어','客語':'하카어','英文':'영어','日文':'일본어','韓文':'한국어'} };
function langTag(k,cls,line){ const ln=lineOf(k,line||'main'), v=!!ln&&ln.kind==='voice', sg=!!ln&&ln.kind==='sign';   /* 2026-11-18：標籤照卡片代表的那條線（現正展出＝主線，無障礙專區＝手語線） */
  const a=exVoice(k), L=S.lang in LG_SH?S.lang:'zh', full=a.map(t=>LG_FULL[L][t]||t).join('、');
  const lv=a.length===1?`<span translate="no">${({zh:'語音',en:'Audio',ja:'音声',ko:'음성'})[L]}</span>`:a.map(t=>`<span class="ln" translate="no">${LG_SH[L][t]||t}</span>`).join('');   /* 2026-11-12：卡片只顯示這個介面語言的語音，單一語言時不寫語言、只寫「語音導覽」；多種（如中文介面的華台客）才列語言 */
  if(!v&&!sg) return '';   /* 沒有語音也沒有手語（文字導覽或只有多媒體）不放標籤（2026-11-12） */
  return `<span class="langtag${cls?' '+cls:''}" title="${full}${sg?'、手語':''}" aria-label="導覽語言：${full}${sg?'、手語':''}">${v?`<span class="lv" aria-hidden="true">${MI(MD.head,14,'currentColor')}<span>${lv}</span></span>`:''}${sg?`<span class="ls">${SIGN_IC}<span>手語</span></span>`:''}</span>`; }
/* 語言太多、標籤超出照片時：保留前面幾個（目前介面語言排第一），其餘收成「+N」 */
function fitLangTags(){ document.querySelectorAll('#app .langtag').forEach(t=>{ const box=t.closest('.cardimg'); if(!box) return; const max=box.clientWidth-20+1;
  const ln=[...t.querySelectorAll('.ln')]; let n=ln.length, more=t.querySelector('.lmore');
  const ls=t.querySelector('.ls'); if(t.scrollWidth>max&&ls&&t.querySelector('.lv')){ const t2=document.createElement('span'); t2.className='langtag'; t2.setAttribute('aria-hidden','true'); t2.appendChild(ls); t.after(t2); }   /* 放不下時先把手語段換到第二行，語言縮寫完整保留 */
  while(t.scrollWidth>max&&n>1){ n--; ln[n].style.display='none'; if(!more){ more=document.createElement('span'); more.className='lmore'; ln[0].parentNode.appendChild(more); } more.textContent='+'+(ln.length-n); }
  }); }
function exLangs(k){ const ids=EXHIBITIONS[k].items, v=ids.some(id=>it(id).voice!==false), sg=ids.some(id=>it(id).sign);
  return (v?exVoice(k):[]).concat(sg?['手語']:[]).join('・'); }
/* 第 1 輪測試修正（T4）：手語標籤用的手勢圖示（線條風格，跟其他圖示一致） */
const SIGN_IC=`<svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11V5a1.5 1.5 0 0 1 3 0v6"/><path d="M14 11V6.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-.5a6 6 0 0 1-4.6-2.2L3.3 15.7a1.5 1.5 0 0 1 2.3-1.9L8 16"/></svg>`;
const exMeta=(k,ms)=>ms;   /* 2026-11-18：卡片一律用「N 個導覽點・約 M 分鐘」，常設展與特展同一種寫法（後台只要給則數與時間） */
function exCard(key, isRoute, listMeta, over){
  const e = Object.assign({}, isRoute ? ROUTES[key] : EXHIBITIONS[key], over||{});
  let meta = listMeta || (isRoute ? e.meta : exMeta(key, e.meta));
  if(isRoute) meta=meta.filter(m=>!/站・/.test(m));   /* 2026-11-18：主題路線的站數與時長要點進去選完「打算花多少時間」才算得出來，卡片上不能先講死；改放主題簡介 */
  const go_ = e.onclick || (isRoute ? `openRoute('${key}')` : `openEx('${key}')`);
  return `<div class="card" onclick="${go_}" style="cursor:pointer">
    <div class="cardimg${e.mapImg?' mapimg':''}"><img src="${A(e.card)}" alt="">${!isRoute&&EXHIBITIONS[key]?langTags(key,e.line):''}</div>   <!-- 第 1 輪測試修正（T4）：手語標籤改疊在照片左上角，標題上方不再放 -->
    <div class="cardt">
      <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
        ${e.date&&!isRoute?`<div style="display:flex;flex-direction:column"><span class="cardtitle lc2">${L(e.n)}</span><span style="font-size:${listMeta?13:12}px;color:var(--text2)">${e.date}</span><span class="tealbtn icon" aria-hidden="true">${img('ic-arrow-right.svg',16,16)}</span></div>`
          :`<div class="ttlbox"><span class="cardtitle lc2">${L(e.n)}</span><span class="tealbtn icon" aria-hidden="true">${img('ic-arrow-right.svg',16,16)}</span></div>`}
        <div class="metas">${meta.map(m=>`<div class="meta"><i></i>${L(m)}</div>`).join('')}</div><!-- 卡片拿掉「導覽語言」說明列，語言只看照片上的標籤（2026-11-11 留言） -->
        ${e.desc?`<p style="font-size:12px;line-height:1.5;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${e.desc}</p>`:''}
      </div>
    </div></div>`;   /* 箭頭移進標題區，跟著標題垂直置中 */
}
/* 2026-11-17 留言：首頁「無障礙專區」——只列純手語導覽的展覽（有手語影片、沒有語音導覽）。
   手語影片只在中文介面提供，所以外文介面不顯示這一區；demo 展覽不列（同手語導覽頁的規則） */
function signOnlyEx(){ return Object.keys(EXHIBITIONS).filter(k=>!/^demo/.test(k)&&hasSignLine(k)); }   /* 2026-11-18：有手語線的展覽 */
function a11ySection(){ const ks=signOnlyEx(); if(!ks.length) return '';
  const cards=ks.map(k=>{ const e=EXHIBITIONS[k], ids=lineOf(k,'sign').ids, m=Math.round(ids.reduce((n,id)=>n+it(id).d,0)/60);   /* 2026-11-18：手語導覽只有手語影片，卡片不再把文字導覽算進去 */
    return exCard(k,false,[`${ids.length} 支手語影片・約 ${m} 分鐘`,(e.meta||[]).find(x=>/^\dF/.test(x))||''],{line:'sign', onclick:`openEx('${k}','sign')`}); }).join('');
  return `<div class="divider"></div>
    <div class="secthead" id="secA11y"><div class="r"><b>無障礙專區</b><em>accessibility</em></div></div>
    <div class="cardrow">${cards}</div>`; }

function homeScroll(){

  const par=document.getElementById('hpar'), line=hero.querySelector('.hline'), rows=[...hero.querySelectorAll('.plaque>*')];

  setTimeout(()=>hero.querySelectorAll('.play').forEach(e=>e.classList.remove('play')),1700);   /* 進場播完就拿掉，讓退場的捲動效果接手 */

/* 幫我排今天的順序：只用今天的場次資料＋展覽的「約 N 分鐘」排。
   原則：要現場報名、名額有限的先去（VR）→ 有場次的照最近一場依序排（場次不重疊，前一項結束才排下一項）→ 常設展、特展不用排隊，塞進場次之間的空檔或排在最後 */
function dayPlan(){ const now=nowMin(), close=hm('17:00'); if(now>=close) return [];
  const evs=todayEvents(), rows=[]; let cur=now;
  const exs=['perm','zj','asia'].map(k=>{ const e=EXHIBITIONS[k], m=(e.meta[0].match(/約 (\d+) 分鐘/)||[])[1]; return {k, n:e.n.split('：')[0], where:e.meta[1], type:e.type, dur:+m||30}; });
  const reg=evs.filter(e=>e.note&&/名額有限/.test(e.note)&&e.live);   /* 正在報名中的：現在就去 */
  reg.forEach(e=>{ rows.push({t:'現在', n:e.n, where:e.where, why:`${e.live.label||''}報名中，名額有限、額滿為止，先去報名，體驗時間依服務臺安排`}); cur=now+10; });
  const isReg=e=>e.note&&/名額有限/.test(e.note);
  const anchors=evs.filter(e=>isReg(e)&&!e.live&&e.next).map(e=>({e,s:e.next}));   /* 要報名、還沒開始的：固定在它開始的時間，其他場次不能跟它撞 */
  let todo=evs.filter(e=>!isReg(e));
  const fill=gap=>{ for(const x of [...exs].sort((a,b)=>b.dur-a.dur)){ if(x.dur+5<=gap){ rows.push({t:fmtHM(cur)+'–'+fmtHM(cur+x.dur), n:x.n+'（'+x.type+'）', where:x.where, why:`不用排隊，剛好利用下一場前的空檔，約 ${x.dur} 分鐘`, ex:x.k}); cur+=x.dur+5; gap-=x.dur+5; exs.splice(exs.indexOf(x),1); } } };
  const endOf=(e,s)=>s.end?hm(s.end):s.st+(e.dur||30);
  for(;;){ const c=todo.map(e=>({e, s:e.ss.find(x=>x.st>=cur&&x.st<close)})).filter(o=>o.s).sort((a,b)=>a.s.st-b.s.st)[0], A=anchors[0];
    if(A&&(!c||endOf(c.e,c.s)+5>A.s.st)){   /* 報名的前面不塞展覽：一開放就去，避免看展看到錯過 */
      rows.push({t:(A.s.label?A.s.label+' ':'')+A.s.t+'–'+A.s.end, n:A.e.n, where:A.e.where, why:`名額有限、額滿為止，${A.s.label||'這一場'}一開始就去報名，體驗時間依服務臺安排`});
      cur=Math.max(cur,A.s.st)+10; anchors.shift(); continue; }
    if(!c) break;
    fill(c.s.st-cur); const {e,s}=c, end=endOf(e,s), last=e.ss.filter(x=>x.st>=s.st).length===1;
    rows.push({t:s.t+'–'+fmtHM(end), n:e.n, where:e.where, why:`最近一場 ${s.t}${last?'，也是今天最後一場':''}，每場約 ${e.dur} 分鐘`});
    cur=end+5; todo=todo.filter(x=>x!==e); }
  /* 場次排完：剩下的展覽照閉館前的時間排，放得下的先排；只剩一點時間就挑一檔聽重點；排不進的列在最後一句 */
  const left=[];
  for(const x of [...exs].sort((a,b)=>b.dur-a.dur)){ const room=close-cur;
    if(x.dur<=room){ rows.push({t:fmtHM(cur)+'–'+fmtHM(cur+x.dur), n:x.n+'（'+x.type+'）', where:x.where, why:'不用排隊、隨時能進，排在場次之後慢慢看', ex:x.k}); cur+=x.dur+5; }
    else left.push(x); }
  if(left.length&&close-cur>=10){ const x=left.sort((a,b)=>a.dur-b.dur).shift(); rows.push({t:fmtHM(cur)+'–17:00', n:x.n+'（'+x.type+'）', where:x.where, why:`快閉館了，看不完整檔（約 ${x.dur} 分鐘），挑幾件聽重點`, ex:x.k}); cur=close; }
  if(rows.length&&left.length) rows.left=left.map(x=>x.n);
  return rows; }

代復振之大羽冠帽飾": "Feather Headdress Revived by Cikasuan Descendants", "排灣族女子銀幣飾品長衣": "Paiwan Woman's Robe with Silver Coins", "臺灣一周紀念旅行手札": "Souvenir Album of a Round-Taiwan Trip", "蔣渭水致林獻堂書信": "Letter from Chiang Wei-shui to Lin Hsien-tang", "「人們記憶中的戰爭」文物": "Objects of \"The War as People Remember It\"", "一場戰爭，各自記憶": "One War, Many Memories", "228・陳澄波遺物": "228 · Belongings of Chen Cheng-po", "「沒有人是局外人」彩繪石頭": "\"No One Is an Outsider\" painted stones", "「你也是寫歷史的人」文物": "Objects of \"You Write History Too\"", "鐵剪刀": "Iron Scissors", "糖郊李勝興米駝": "Rice Camel of the Li Sheng-hsing Sugar Guild", "豬頭骨與檳榔": "Pig Skull and Betel Nut", "南無警察大菩薩": "Namu Police Great Bodhisattva", "警報器": "Air-raid Siren", "以麵粉袋做成的衣褲": "Clothes Made from Flour Sacks", "陪伴我們的臺灣島嶼，一起穿越數百年的記憶流轉吧！在這裡，你會從神秘的起源傳說開始，跟著這塊土地，一次次歷經時代的更迭與鉅變，看見大歷史之下人群的樣貌、聲音與故事。展覽以「時代」作為單元，分為「臺灣，交會之島」、「最初的抵岸」、「倚海而生的島與人」、「山海之間的共存與競逐」、「新秩序下的苦悶與夢想」、「走向民主這條路」、「大家的博物館」7 大單元；從史前到當代，相異的時空情境中，是否喚起你似曾相似的共鳴？": "Travel with the island of Taiwan through centuries of memory. Starting from mysterious origin legends, you follow this land through change and upheaval, and see the faces, voices and stories of people within the larger sweep of history. The exhibition is arranged by era in 7 sections: Taiwan, an Island of Encounters; First Landings; An Island and People Living by the Sea; Coexistence and Competition between Mountain and Sea; Frustrations and Dreams under a New Order; The Road to Democracy; and Everyone's Museum. From prehistory to today, which moments will feel familiar to you?", "媽祖是臺灣最具代表性的民間信仰之一。本次展覽透過館藏、國內外機構典藏，以及臺灣各地媽祖廟所傳承的重要文物，探討媽祖神蹟如何被詮釋，並展現出媽祖的多元面貌。": "Mazu is one of Taiwan's most representative folk beliefs. Drawing on the museum's collection, institutions at home and abroad, and important relics kept by Mazu temples across Taiwan, this exhibition explores how Mazu's miracles have been interpreted and shows her many faces.", "「非公民」是指有人沒有任何國家承認其國籍；也有人雖擁有國籍，卻因政治、戰亂與制度等因素，無法獲得原國家的保護。本特展透過主展場與走廊延伸展區，串聯這段歷史，並述說來到臺灣的不同群體的故事。": "\"Non-citizens\" are people whose nationality no state recognizes, or who hold a nationality but cannot get their country's protection because of politics, war or institutions. Through the main gallery and a corridor extension, this exhibition connects that history and tells the stories of different groups who came to Taiwan.", "聲音，演譯了誰的心情？傳遞著哪些故事？歷史上的歌謠、唸詞、流行歌，穿越數百年的聲音，用歌詞與曲調留下了特殊歷史情境的當下痕跡，呼喚您來傾聽。": "Whose feelings do these sounds express, and what stories do they carry? Folk songs, chants and pop songs from across the centuries left traces of their moment in lyrics and melodies. Come and listen.", "博物館研究員私心推薦的經典藏品，這些物件背後，或是反映獨特的歷史記憶、人物真切的生命經歷，或是在地視角的投射，也有可能隱藏著歷史研究控的物質密碼？等你一起來解讀！": "Classic objects picked by the museum's researchers. Behind them are unique historical memories, real life stories and local perspectives, and perhaps material clues for history buffs. Come and decode them!", "伸出手一起來「觸摸」臺灣史吧！7大觸摸展件與點字展臺，不僅是量身為視覺不便的夥伴打造的路線，建立更多元友善的觀展方式，也讓我們可以用不同的感官，體驗、觸碰不同面向的臺灣歷史。": "Reach out and touch Taiwan's history! Seven touch objects and braille stands make a route designed for visitors with visual impairments, offering a more inclusive way to visit and letting everyone experience Taiwan's history through other senses.", "媽祖原為只知其姓的巫女林氏，經由歷代對媽祖顯聖事蹟的層累，形塑出神通廣大的女聖人樣貌，可看見媽祖在政治與宗教力量塑造下，成為護國救民的英烈天妃。本單元透過17至19世紀的圖像與經典文獻，看見媽祖的形象在官方與民間的共同詮釋下，逐步確立為天后林默的過程。": "Mazu began as a shaman known only by her surname, Lin. Layer upon layer of miracle stories turned her into a powerful holy woman, and political and religious forces made her a heroic consort who protected the state and its people. Through images and texts from the 17th to 19th centuries, this unit shows how official and popular interpretations together established her as the Heavenly Empress Lin Mo.", "媽祖的海上神蹟，深受閩、粵兩地崇奉。明代以來，隨著頻繁的海上活動，媽祖信仰從中國東南沿海出發，沿著貿易路徑向東亞諸國延伸。船員與移民隨身攜帶的神像與聖物，使媽祖香火得以越過汪洋，在異鄉落地生根；延伸至臺灣後，又向外輻射至世界各地。": "Mazu's miracles at sea were revered in Fujian and Guangdong. From the Ming dynasty, with growing maritime activity, her worship spread from China's southeast coast along trade routes across East Asia. Statues and sacred objects carried by sailors and migrants took her incense across the ocean to new homes, and from Taiwan it spread around the world.", "媽祖信仰深入臺灣後，因地域與族群的差異，被賦予不同的稱呼與形象：是榮及雙親的孝女，是慈愛赤子的媽婆；能以施藥救疫，也在戰火之中顯聖。除了多樣性的神像外，冠服、神輿與時尚精品，也形塑出不同時代的媽祖樣貌。": "As Mazu belief took root in Taiwan, different regions and communities gave her different names and images: a filial daughter honoring her parents, a loving grandmother to children, a healer in epidemics, a protector in war. Alongside varied statues, crowns, robes, palanquins and even fashion items shaped her image in each era.", "無形的靈力，憑附於有形的物件，亦降於大符與各類聖物；承受香火的香爐與運載神火的香擔，是最關鍵的靈力載體。進香、遶境與過爐，是親近媽祖的神聖時刻，也是廟與廟、人與人之間交通互動的時刻，將世代的信仰記憶傳承下去。": "Invisible spiritual power rests in physical objects, talismans and sacred items; incense burners and the carriers of sacred fire are its most important vessels. Pilgrimages, processions and incense rites are sacred moments close to Mazu, and moments of exchange between temples and people that pass faith down the generations.", "隨時代更迭與社會結構變化，天后以各類形式顯聖與再現。數位科技改變了信仰傳播途徑，媽祖信仰以媒體直播與影像跨越地域限制；素昧平生的人們也因「結緣品」而聚合，比肩同行，使媽祖信仰得以歷久彌新。": "As times and society change, the Empress appears in new forms. Digital technology has changed how faith spreads: livestreams and images carry Mazu belief beyond place, and strangers gather and walk together through shared souvenirs, keeping the belief alive and new.", "當邊界被劃下時，我們如何看見真正的彼此？從過去到現在，不同時代都存在著被排除在主流社會及國家制度之外的人——他們可能沒有戶籍、沒有國籍，始終游移在法律與現實的邊界。本區從更長遠的歷史脈絡出發，回看「非公民」如何被界定與形成。": "When borders are drawn, how do we truly see one another? In every era some people have been excluded from mainstream society and the state, without household registration or nationality, drifting at the edge of law and reality. This area takes a longer historical view of how \"non-citizens\" came to be defined.", "「當動盪席捲世界，人們帶來的只是行李嗎？」臺灣的歷史與世界局勢緊密相連。來自圖伯特、緬甸、香港與烏克蘭的人們，因冷戰、政變、戰爭與迫害，陸續跨越邊界來到這裡；他們的移動不只是個人選擇，而是為了守護生命、自由、信仰與未來。": "\"When turmoil sweeps the world, is luggage all people bring?\" Taiwan's history is closely tied to world events. People from Tibet, Myanmar, Hong Kong and Ukraine crossed borders to come here because of the Cold War, coups, war and persecution. Their moves were not just personal choices but ways to protect life, freedom, faith and the future.", "「跨過了邊界，邊界就消失了嗎？」「身分」的邊界，從來不是固定的，它會隨著法律制度、國際局勢與國家安全考量而被重新劃定。對許多來到臺灣的人而言，邊界不只存在於海關，也延伸到入境後的停留、居留或定居審查。": "\"Once you cross a border, does it disappear?\" The borders of identity are never fixed; laws, international affairs and national security keep redrawing them. For many who come to Taiwan, the border isn't only at customs but extends to reviews for stay, residence and settlement.", "「『家』，對你來說是什麼？」對有些人而言，「家」是正在經歷戰火的地方；對流亡者而言，是宗教、文化與身分認同的延續；對離開香港的人而言，那個地方還在，卻已不同。來自不同地方的人們，帶著各自對「家」的記憶與牽掛來到臺灣。": "\"What does home mean to you?\" For some, home is a place at war; for exiles, it is the continuation of faith, culture and identity; for those who left Hong Kong, it is still there but no longer the same. People from many places bring their memories of home to Taiwan.", "「當全球的流離與遷徙來到臺灣，我們將讓邊界變窄，還是讓關係展開？」我們看見人們在動盪中離開家園，看見人的身分如何在穿越邊界後被重新定義，也看見許多人在不安的處境中，仍努力在這裡生活、行動並照顧彼此。": "\"As global displacement reaches Taiwan, will we narrow our borders or open up relationships?\" We see people leaving home in turmoil, identities redefined after crossing borders, and many who, despite uncertainty, still live, act and care for one another here.", "這件展品位在「臺灣，交會之島」單元。臺灣，要從「交會」開始說起。這是一段不同人群，碰撞、摸索，共有同一塊土地的故事。本單元也有母語地名故事的線上展覽。": "This object is in the section \"Taiwan, an Island of Encounters\". Taiwan's story begins with encounters: different peoples meeting, testing each other and sharing one land. This section also has an online exhibition on place names in native languages.", "這件展品位在「身陷角力戰的原住民」展區。在這段期間，隨著漢人、日本人、荷蘭人、西班牙人相繼到來，原本保持相對穩定狀態的臺灣原住民族社會受到一定程度的攪動。面對外來者，原住民各部落會主動選擇有利於部落的同盟對象，也會與敵對的勢力產生衝突。不同族群之間各有盤算，有時彼此交惡，有時維持著不穩定的聯盟關係。而外來團體間彼此也有糾葛衝突。": "This object is in the area \"Indigenous Peoples Caught in a Power Struggle\". As the Han, Japanese, Dutch and Spanish arrived, the relatively stable Indigenous societies were shaken. Villages chose allies that served them and clashed with rivals. Each group had its own aims, sometimes hostile, sometimes in uneasy alliances, while the newcomers also fought among themselves.", "這件展品位在「山海之間的共存與競逐」單元。1684年臺灣被清朝併入版圖，大量漢人移民持續渡海前來，在平原、丘陵、沿山發展出各自的村落、產業及生活方式；在這片山與海之間的土地上，不同人群相互共存，也彼此競逐。": "This object is in the section \"Coexistence and Competition between Mountain and Sea\". In 1684 Taiwan was incorporated into the Qing empire, and Han migrants kept crossing the strait, building villages, industries and ways of life on the plains, hills and mountain edges. On this land between mountain and sea, different peoples coexisted and competed.", "這件展品位在「平埔原住民的人生故事」展區。不同地方的平埔社群，原本有自己的生活文化與網絡，再加上與漢人社會、清朝官府、歐美傳教士等不同人群的接觸，每個部落的際遇與發展都不盡相同。有的人與官府關係密切，身上冠有軍功、職銜；有的人則是收取地租的「番頭家」，或是跟漢人一樣投資經商；但也有更多人因為難以在原鄉過活，遠徙他處。從這些原住民社群人們的人生故事可以看到：在不同時代與際遇下，這塊土地上的人們，各自採用什麼樣的策略來生存發展。": "This object is in the area \"Life Stories of the Pingpu Peoples\". Pingpu communities had their own cultures and networks, and their contact with Han society, Qing officials and Western missionaries shaped each village differently. Some had close ties to officials and held military honors; some were landlords collecting rent or invested in trade like the Han; many more, unable to make a living at home, moved far away. Their life stories show the strategies people on this land used to survive in different times.", "這件展品位在「新時代，新產業」展區。日本時代初期將臺灣當作熱帶經濟作物和糧食的生產地，有系統地開發臺灣各項農、林、漁等產業資源，以提供日本帝國所需。工業則以新式製糖及食品加工業為主。1930年代後期，總督府提出臺灣「工業化」的方針，戰爭時期並發展各項軍需工業，也替日後臺灣工業化奠定基礎。伴隨產業建設，島內外交通手段也逐漸完備。交通的完備與治安的穩定也逐步建構起臺灣旅遊業。日本帝國為展示其殖民建設成果，舉辦許多大型博覽會，產業與物產都是其中重要的宣傳面向。": "This object is in the area \"New Era, New Industries\". Early in Japanese rule, Taiwan was developed as a source of tropical crops and food, with agriculture, forestry and fisheries systematically exploited for the empire; industry centered on modern sugar refining and food processing. In the late 1930s the colonial government pushed industrialization and wartime military industries, laying foundations for later development. Transport improved, and with stable public order a tourism industry emerged. The empire held large expositions to show off its colonial achievements, with industries and products as key showpieces.", "這件展品位在「當原住民遭逢近代國家」展區。當日本帝國以近代國家形式進入臺灣，對人口、土地展開嚴密的掌控後，曾經在政治、文化上維持相對自主的山地，與雖已納入版圖但控制有限的東部地區，終於也逐步納入殖民體制。在國家的政策與征討下，原住民族的生活世界遭逢劇烈變動，並透過口述傳說，留下與官方紀錄大不相同、屬於族人觀點的歷史記憶。": "This object is in the area \"When Indigenous Peoples Met the Modern State\". When the Japanese empire brought modern state control over people and land, the mountains, once politically and culturally autonomous, and the loosely governed east were gradually absorbed into the colonial system. Under state policy and military campaigns, Indigenous life changed drastically, and oral traditions preserved memories from their own point of view, very different from official records.", "這件展品位在「近代教育與社會運動」展區。日本殖民者引進了近代教育，其主要目標是讓臺灣人成為「理想的日本國民」及殖民統治所需的基礎人力。但是近代教育同時啟發了臺灣人的自覺，也有不少臺灣人至島外接受教育，習得了近代議會政治民主等概念。這些新世代的知識份子不滿臺灣的殖民制度，透過政治與社會運動，取得臺灣民眾支持，形成新時代的抵抗行動，向殖民者爭取政治權利之外，也進行臺灣的社會文化改造運動。": "This object is in the area \"Modern Education and Social Movements\". The Japanese introduced modern education to make Taiwanese \"ideal Japanese subjects\" and a workforce for colonial rule. But it also awakened Taiwanese self-awareness, and many studied abroad and learned about parliamentary democracy. This new generation of intellectuals, unhappy with colonial rule, won public support through political and social movements, demanding political rights and reforming Taiwanese society and culture.", "臺灣文化協會會歌的原件，附在1921年9月21日蔣渭水寫給林獻堂的文協創立大會邀請信裡。信中寫明，會歌平時用〈黃海戰〉曲調演唱，儀式時改用〈始政紀念歌〉曲調。": "The original song of the Taiwanese Cultural Association, enclosed in Chiang Wei-shui's 21 September 1921 letter inviting Lin Hsien-tang to the founding meeting. The letter says the song was sung to the tune of \"Battle of the Yellow Sea\" normally and to the \"Commemoration of the Beginning of Rule\" song at ceremonies.", "這件展品位在「現代風格起步走」展區。從都市、城鎮開始，20世紀前半的臺灣人，普遍感受到時代變革的步伐愈催愈緊，從視覺、聽覺、身體意識等感官，到社會結構、人際倫理觀念，都反映大不相同的新氣象，有人稱之為「文明」，有人戲稱為「毛斷」（modern臺語音譯）。自固有慣習裡游離而出的新一代臺灣人，憑著「和洋」（日本/西洋）混雜的技術與形式，展開創作與生活文化的改良，現代臺灣的面貌也隨之逐漸成形。": "This object is in the area \"Stepping into Modern Style\". In the first half of the 20th century, starting in the cities, Taiwanese felt change speeding up, from sight, sound and body to social structure and ethics. Some called it \"civilization\"; others jokingly said \"mo-tng\" (Taiwanese for \"modern\"). A new generation, breaking from old habits, mixed Japanese and Western techniques and forms to reinvent art and daily life, and modern Taiwan gradually took shape.", "這件展品位在「戰爭淹沒了社會：臺灣人的二次世界大戰」展區。1930年代，總督府特別重視農漁村的經濟自立，推展部落振興運動，由上至下進行社區改造，推行社會教化，欲在鄉村建立一套新秩序。戰爭爆發後，社會教化體系便轉為支援戰爭的動員組織。臺灣人一方面過著緊縮的物質生活，另一方面還要面對皇民化運動的強大文化壓力，被鼓勵放棄自己原有的語言、姓名，甚至走向戰場、失去生命。": "This object is in the area \"Society Engulfed by War: Taiwanese in World War II\". In the 1930s the colonial government promoted self-reliance in farming and fishing villages, remaking communities from the top down to build a new rural order. When war broke out, these networks became wartime mobilization. Taiwanese lived with scarcity and the heavy cultural pressure of the Kominka movement, urged to give up their language and names, and even to go to war and lose their lives.", "這件展品位在「反共復國基地」展區。1950年韓戰爆發。以美國、蘇聯為首的資本主義、共產主義兩大國際陣營在東亞展開對抗，作為西太平洋「第一島鏈」關鍵位置的臺灣，由中國國民黨長期執政，成為中華民國「反共復國」的基地、「自由中國」的堡壘。隨著北京政府的外交拓展，中華民國的國際地位接連挫敗，1971年退出聯合國、1978年與美國斷交。然而，政府仍力主「三民主義統一中國」的政治口號，構成一黨獨大、以黨領政的威權體制。": "This object is in the area \"Anti-Communist Base\". The Korean War broke out in 1950 as the capitalist and communist blocs led by the US and USSR confronted each other in East Asia. Taiwan, key to the West Pacific \"first island chain\", was ruled long-term by the KMT and became the base for \"retaking the mainland\" and a bastion of \"Free China\". As Beijing's diplomacy expanded, the ROC suffered setbacks, leaving the UN in 1971 and losing US recognition in 1978. Yet the government held to the slogan of \"reunifying China under the Three Principles of the People\", sustaining a one-party authoritarian system.", "這件展品位在「走向民主這條路」單元。1945年後臺灣人熱烈參政，隨後卻受228事件的影響而噤聲；其後實施長達38年戒嚴。這條曲折的民主路，是不同意見折衝摩擦的過程，也是近兩、三代臺灣人相互看顧、多元對話的生命經驗。": "This object is in the section \"The Road to Democracy\". After 1945 Taiwanese eagerly joined politics, then fell silent after the 228 Incident, followed by 38 years of martial law. This winding road to democracy was a process of clashing views, and the shared experience of two or three generations caring for each other in open dialogue.", "本作品發想自阿美族傳說：會發光的女孩迪雅瑪贊（Tiyamacan）被迷戀她的海神之子用海水帶走，之後化成雷聲、彩虹和各種生命。作品中的光代表迪雅瑪贊的初心，也象徵混沌大地裡蔓生而出的生命。": "Inspired by an Amis legend: Tiyamacan, a girl who glowed with light, was carried off by the sea god's son who loved her, and became thunder, rainbows and all kinds of life. The light in the work stands for her original heart and for life growing out of the primordial earth.", "英國愛丁堡 W. & A.K. Johnston 地圖出版商製作的絹本設色手繪大地圖，推定為1873年的內容。圖上標了101個地名，其中25個是長老教會宣道站，反映1870年代李庥、馬偕等人的宣教成果。": "A large hand-colored map on silk by the Edinburgh publisher W. & A.K. Johnston, dated to around 1873. It marks 101 place names, 25 of them Presbyterian mission stations, reflecting the work of missionaries such as Hugh Ritchie and George Mackay in the 1870s.", "嘉慶17年（1812）建興庄公館發給排灣族望仔立社（今屏東來義鄉望嘉部落）頭人的賞籤，原住民持籤可領取銀30元、布匹等物資。籤上寫「循例」，可見這種做法已行之有年，是清代漢人與原住民往來的見證。": "A reward tally issued in 1812 by the Jianxing village office to the chief of the Paiwan Bongarid village (today Wangjia in Laiyi, Pingtung). Holders could collect 30 silver dollars, cloth and other goods. It says \"as customary\", showing the practice was long established, a record of Qing-era Han–Indigenous relations.", "清代臺灣書畫家林朝英的紙本水墨自畫像，依題款推定畫於嘉慶7年（1802），當時他64歲。畫中他頭戴冬冠、身穿大褂，身後有抱琴侍童，題款用他招牌的「竹葉書」寫成，是記錄他晚年真實面貌的唯一實物。": "An ink self-portrait on paper by Qing-era Taiwanese artist Lin Chao-ying, dated by its inscription to 1802, when he was 64. He wears a winter hat and long robe, with a servant boy holding a qin behind him. The inscription is in his signature \"bamboo-leaf script\". It is the only object recording how he looked in later life.", "石青色清代官服，前胸和後背各縫一塊方形補子，主圖是六品武官專用的「彪」。原主人是埔里烏牛欄社的潘踏比厘（1827-1917），1886年升補北路屯千總，1887年取得正六品武官職銜。官服由潘家代代收藏，後由後人捐贈。": "A dark blue Qing official robe with square badges on the chest and back showing a \"biao\" leopard, used by sixth-rank military officers. It belonged to Pan Tabili (1827–1917) of the Aoxgulan village in Puli, promoted to Northern Tun commander in 1886 and granted sixth rank in 1887. Kept by the family for generations, it was donated by his descendants.", "這本經摺裝手札的主人，推測是大阪人中西竹山。他在1934年5月搭高千穗丸來臺環島旅行，一路收集各地戳章、御朱印、車票、入山證和旅館紙品，再加上自己畫的插圖，記下從基隆南下臺南、高雄再北返的完整行程。": "This accordion-fold album probably belonged to Nakanishi Chikuzan of Osaka. In May 1934 he sailed on the Takachiho Maru to tour Taiwan, collecting stamps, temple seals, tickets, mountain permits and hotel paper along the way, with his own drawings, recording the full trip from Keelung south to Tainan and Kaohsiung and back.", "蔣渭水於1921年9月21日寫信給林獻堂，邀他出席臺灣文化協會創立大會，並附上文協會歌。依讓售人說法，蔣家確認這是目前唯一認定的蔣渭水親筆文協書信孤本；整件合訂冊另收有1927年文協分裂前後寄給林獻堂的信函。": "On 21 September 1921 Chiang Wei-shui wrote to Lin Hsien-tang inviting him to the founding of the Taiwanese Cultural Association, enclosing its song. According to the seller, the Chiang family confirmed it as the only known letter on the Association in Chiang's own hand. The bound volume also holds letters to Lin from around the Association's 1927 split.", "陳澄波（1895-1947）是嘉義畫家，1926年以《嘉義街外》入選日本帝展，二二八事件中遇害。展出遺物有他用過的皮箱、帽子、畫筆、調色盤和雕刻工具，由陳澄波文化基金會捐贈。妻子張捷把畫作藏在天花板裡保存，直到1979年才首次舉辦遺作展。": "Chen Cheng-po (1895–1947), a painter from Chiayi, was selected for Japan's Imperial Exhibition in 1926 with \"Outside Chiayi Street\" and was killed in the 228 Incident. On show are his suitcase, hat, brushes, palette and carving tools, donated by the Chen Cheng-po Cultural Foundation. His wife Chang Chieh hid his paintings in the ceiling; his first posthumous exhibition was held only in 1979.", "歷史是不同的人站在各自位置、用自己的方式記錄當下，所累積出來的理解。這個展區收錄陸季盈、謝招治、陳崧波等人的個人紀錄，傳達「每個人都是寫歷史的人」。": "History is an understanding built from many people recording their own moment from where they stand. This area holds personal records of Lu Chi-ying, Hsieh Chao-chih, Chen Sung-po and others, showing that everyone writes history.", "這件展品位在「倚海而生的島與人」單元。16世紀中期，臺灣逐漸成為東亞貿易的會合點與轉運點，東西方各大海權勢力在此競逐，臺灣的原住民社會開始面對一波波外來衝擊。": "This object is in the section \"An Island and People Living by the Sea\". From the mid-16th century Taiwan became a meeting and transit point for East Asian trade. Maritime powers from East and West competed here, and Indigenous societies faced wave after wave of outside impact.", "這件展品位在「商業市鎮」展區。清代臺灣西部港口大多是商業繁盛的市鎮，郊商、文市、洋行遞次發展。當貨物自中國沿海運至港口後，經由郊行統籌，再由批發商、零售商及挑販逐層經手，最後才到消費者手中。其中，府城（今臺南）、鹿港、艋舺（今臺北萬華）、大稻埕這四個由南至北的港口城市，各自代表了清代臺灣不同階段與類型的商業發展。": "This object is in the area \"Market Towns\". Most western ports in Qing Taiwan were thriving market towns where guild merchants, shops and foreign firms developed in turn. Goods from the Chinese coast passed through guilds, wholesalers, retailers and peddlers before reaching buyers. Fucheng (Tainan), Lukang, Monga (Wanhua, Taipei) and Dadaocheng, from south to north, each represent a different stage and type of Qing-era commerce.", "這件展品位在「日本殖民體制的建立：行政、警察、教化」展區。日本的殖民統治，主要可分為行政、警察、教化三大系統。首先是以臺灣總督府為頂點的行政體系，往上接續帝國中央政府，往下伸展至地方街庄役場，以專業分工的官僚確保績效。其次是警察、保甲系統，負責維持治安、執行法令。第三是以小學校、公學校為中心的教化系統。日本殖民統治前期，熟悉原有社會運作的臺灣人民，不滿日本統治帶來的近代國家運作模式，而屢有武裝反抗事件，總督府也逐步摸索調整其統治策略，透過三大系統逐步掌控臺灣，也使原本處於各自分散的地方社會狀態，逐步邁向一體化。": "This object is in the area \"Building the Colonial System: Administration, Police, Education\". Japanese rule rested on three systems. First, an administration headed by the Government-General, linked up to the imperial government and down to local offices, run by professional bureaucrats. Second, police and the baojia system kept order and enforced the law. Third, education centered on elementary and public schools. Early on, Taiwanese used to the old ways resisted the modern state, often with arms; the colonial government adjusted its strategies and, through these three systems, gained control, gradually unifying once scattered local societies.", "國民政府遷臺以來大力推動防空工作，「逃警報」和「防空演習」因此成為許多臺灣人的共同記憶，至今仍有軍民聯合防空演習。": "After the government moved to Taiwan it promoted air defense, so running from sirens and air-raid drills became a shared memory for many Taiwanese. Joint military–civilian drills still take place today.", "1950到1965年美援時期，美國援助臺灣麵粉等物資。純棉的麵粉袋（俗稱「卡動」）就成了民眾做內衣和家常服的布料，衣褲上常還印著中美合作標誌和製粉公司商標。": "During the US aid period (1950–1965), the US sent flour and other goods to Taiwan. The cotton flour sacks (\"carton\" in local slang) became fabric for underwear and everyday clothes, often still printed with the Sino-American cooperation logo and mill brands.", "16 世紀中期，臺灣逐漸成為東亞貿易的會合點與轉運點，東西方各大海權勢力在此競逐，臺灣的原住民社會開始面對一波波外來衝擊。首先是中國及日本的私商、海盜，以臺灣為會合貿易的地點。進入 17 世紀以後，又加入了來自歐洲的荷蘭人與西班牙人。": "From the mid-16th century, Taiwan became a meeting and transit point for East Asian trade. Maritime powers from East and West competed here, and Indigenous societies faced wave after wave of outside impact. First came Chinese and Japanese private traders and pirates, who met to trade in Taiwan. In the 17th century they were joined by the Dutch and Spanish from Europe.", "東西方文化在此交會，使臺灣成為東亞歷史舞臺上的要角。當你站在這面航海圖前，不妨先找找臺灣的位置——在當時的世界地圖上，它還沒有固定的形狀，卻已經是各方勢力都想標記的座標。": "East and West met here, making Taiwan a key player on the East Asian stage. Standing before this sea chart, try to find Taiwan: on the world maps of the time it had no fixed shape yet, but every power already wanted to mark it.", "十七世紀前後，臺灣位於東亞海域的交會處。往來的商船、漁民與移住者在此靠岸，帶來稻米、鐵器、瓷器與信仰，也把鹿皮、砂糖與樟腦運往遠方。": "Around the 17th century, Taiwan sat at a crossroads of East Asian seas. Merchant ships, fishermen and settlers landed here, bringing rice, iron, porcelain and faith, and carrying deerskin, sugar and camphor far away.", "這一區以船、港與貨物為線索，重現當時人們如何倚海而生：從原住民族的漁獵與交易，到漢人移民的定居，再到荷蘭、西班牙與日本商人在此地的競逐。": "Using ships, ports and goods as clues, this area shows how people lived by the sea: from Indigenous fishing, hunting and trade, to Han settlement, to competition among Dutch, Spanish and Japanese merchants.", "展櫃中的貿易瓷片與航海圖複製件，是這段往來留下的痕跡。仔細看圖上的臺灣，形狀還沒有固定，說明當時的人對這座島的認識，正隨著一次次航行慢慢累積。": "The trade porcelain shards and replica sea charts in the case are traces of these exchanges. Look closely: Taiwan's shape isn't fixed yet, showing how knowledge of the island grew voyage by voyage.", "歡迎來到國立臺灣歷史博物館。先花三分鐘，認識一下這裡怎麼逛。": "Welcome to the National Museum of Taiwan History. Take three minutes to learn how to get around.", "你會從 8 號門進入展示教育大樓的 1F 大廳。服務臺在大廳右側，可以在這裡詢問、免費借輪椅，或報名需要現場登記的活動。": "You'll enter the 1F lobby of the Exhibition Building through Gate 8. The information desk is on the right, where you can ask questions, borrow a wheelchair for free, or sign up for activities that need on-site registration.", "1F 有兒童廳，適合帶小朋友動手玩、慢慢看；時光車站有火車劇場，圓形劇場則輪播影片，各自有固定場次，可以先看「本日活動」的時間。": "1F has the Children's Gallery for hands-on play; the Time Station has a train theater, and the Round Theater shows films. Each has set show times; check Today's Events.", "搭手扶梯、樓梯或電梯到 2F，就是常設展「斯土斯民：臺灣的故事」。常設展分成七個單元，從史前時代一路講到當代，展出上千件文物。展區是開放式的，不用照順序走，可以挑有興趣的單元先看。": "Take the escalator, stairs or elevator to 2F for the permanent exhibition, \"Land and People: The Story of Taiwan\". Its seven sections run from prehistory to today with over a thousand objects. The space is open, so start with whatever interests you.", "二樓挑高直通四樓，所以館內沒有三樓。搭電梯到 4F，是特展室和 VR 再現製造所。特展每隔一段時間就會更換，出電梯後跟著指標就能找到展廳；VR 體驗要現場報名，名額有限。": "2F is double-height up to 4F, so there is no 3F. Take the elevator to 4F for the special galleries and the VR Reenactment Studio. Special exhibitions change regularly; follow the signs from the elevator. VR sessions need on-site sign-up and seats are limited.", "館外是臺灣歷史公園，每天 05:00 到 22:00 免費開放，參觀前後可以到湖畔走走。": "Outside is the Taiwan History Park, open free daily from 05:00 to 22:00. Take a lakeside walk before or after your visit.", "展示教育大樓開放時間是 09:00 到 17:00，16:30 最後入場，每週一休館。館內只有一間咖啡廳，也沒有提款機，現金請先準備好。": "The Exhibition Building is open 09:00 to 17:00, last entry 16:30, closed Mondays. There is only one café and no ATM, so bring cash.", "離館時請走 1F 大廳左側的 6 號門，8 號門只能進、不能出。祝你參觀愉快。": "When leaving, use Gate 6 on the left of the 1F lobby; Gate 8 is entry only. Enjoy your visit.", "歡迎來到國立臺灣歷史博物館。先花三分鐘，認識一下這裡怎麼逛。你會從 8 號門進入展示教育大樓的 1F 大廳。服務臺在大廳右側，可以在這裡詢問、免費借輪椅，或報名需要現場登記的活動。1F 有兒童廳，適合帶小朋友動手玩、慢慢看；時光車站有火車劇場，圓形劇場則輪播影片，各自有固定場次，可以先看「本日活動」的時間。搭手扶梯、樓梯或電梯到 2F，就是常設展「斯土斯民：臺灣的故事」。常設展分成七個單元，從史前時代一路講到當代，展出上千件文物。展區是開放式的，不用照順序走，可以挑有興趣的單元先看。二樓挑高直通四樓，所以館內沒有三樓。搭電梯到 4F，是特展室和 VR 再現製造所。特展每隔一段時間就會更換，出電梯後跟著指標就能找到展廳；VR 體驗要現場報名，名額有限。館外是臺灣歷史公園，每天 05:00 到 22:00 免費開放，參觀前後可以到湖畔走走。展示教育大樓開放時間是 09:00 到 17:00，16:30 最後入場，每週一休館。館內只有一間咖啡廳，也沒有提款機，現金請先準備好。離館時請走 1F 大廳左側的 6 號門，8 號門只能進、不能出。祝你參觀愉快。": "Welcome to the National Museum of Taiwan History. Take three minutes to learn how to get around. You'll enter the 1F lobby of the Exhibition Building through Gate 8. The information desk is on the right, where you can ask questions, borrow a wheelchair for free, or sign up for activities that need on-site registration. 1F has the Children's Gallery for hands-on play; the Time Station has a train theater, and the Round Theater shows films. Each has set show times; check Today's Events. Take the escalator, stairs or elevator to 2F for the permanent exhibition, \"Land and People: The Story of Taiwan\". Its seven sections run from prehistory to today with over a thousand objects. The space is open, so start with whatever interests you. 2F is double-height up to 4F, so there is no 3F. Take the elevator to 4F for the special galleries and the VR Reenactment Studio. Special exhibitions change regularly; follow the signs from the elevator. VR sessions need on-site sign-up and seats are limited. Outside is the Taiwan History Park, open free daily from 05:00 to 22:00. Take a lakeside walk before or after your visit. The Exhibition Building is open 09:00 to 17:00, last entry 16:30, closed Mondays. There is only one café and no ATM, so bring cash. When leaving, use Gate 6 on the left of the 1F lobby; Gate 8 is entry only. Enjoy your visit.", "邊界之外‧島嶼之中": "Beyond Borders, Within the Island", "全區平面圖": "Grounds map", "選起點": "choose a start", "選目的地": "choose a destination", "① 先到電梯": "① Elevator first", "沿虛線走約 # 公尺到電梯": "Follow the dotted line about # m to the elevator", "第一特展室特展入口": "Special Gallery 1 entrance", "第三特展室特展入口": "Special Gallery 3 entrance", "登入識別": "sign-in", "提供跨裝置同步": "for sync", "收藏與導覽歷程": "Favorites and history", "大廳左側離館的門": "the exit door on the left of the lobby", "# 號門": "Gate #", "單元一": "Unit 1", "單元二": "Unit 2", "單元三": "Unit 3", "單元四": "Unit 4", "單元五": "Unit 5", "海濱神姑：海口女巫的天后之路": "Goddess of the Shore: A Seaside Shaman's Path to Heavenly Empress", "海上福星：媽祖信仰傳播的航跡": "Lucky Star of the Sea: How Mazu Belief Spread", "盛裝駕到：千變萬化的臺灣天后": "Arriving in Splendor: Taiwan's Ever-changing Empress", "萬年香火：當靈力鑄化為聖物": "Eternal Incense: When Spiritual Power Becomes Sacred Objects", "善願必佑：在當代與媽祖相遇": "Every Good Wish Answered: Meeting Mazu Today", "語言": "Language"};

代」をユニットとし、「台湾、出会いの島」「最初の上陸」「海とともに生きる島と人々」「山と海のあいだの共存と競い合い」「新秩序のもとでの苦悩と夢」「民主主義への道のり」「みんなの博物館」の#つの大ユニットに分かれています。先史から現代まで、異なる時代と状況の中で、どこか見覚えのある共感が呼び起こされるでしょうか。","展品 #":"展示品 #","原住民族的語言與名字":"先住民族の言語と名前","維護中":"メンテナンス中","展品 #・":"展示品 #・","手語影片・附字幕":"手話動画・字幕付き","媽祖是臺灣最具代表性的民間信仰之一。本次展覽透過館藏、國內外機構典藏，以及臺灣各地媽祖廟所傳承的重要文物，探討媽祖神蹟如何被詮釋，並展現出媽祖的多元面貌。":"媽祖は、台湾を代表する民間信仰のひとつです。本展では、館蔵品、国内外の機関の所蔵品、そして台湾各地の媽祖廟が受け継ぐ重要な文物を通して、媽祖の霊験がどのように解釈されてきたかを探り、媽祖の多様な姿を紹介します。","單元一｜海濱神姑：海口女巫的天后之路":"ユニット1｜海辺の巫女：港の巫女が天后になるまで","單元二｜海上福星：媽祖信仰傳播的航跡":"ユニット2｜海の福の星：媽祖信仰が広まった航跡","單元三｜盛裝駕到：千變萬化的臺灣天后":"ユニット3｜盛装でご降臨：千変万化の台湾の天后","單元四｜萬年香火：當靈力鑄化為聖物":"ユニット4｜万年の香火：霊力が聖なる品になるとき","單元五｜善願必佑：在當代與媽祖相遇":"ユニット5｜願いは必ず叶う：現代で媽祖に出会う","「非公民」是指有人沒有任何國家承認其國籍；也有人雖擁有國籍，卻因政治、戰亂與制度等因素，無法獲得原國家的保護。本特展透過主展場與走廊延伸展區，串聯這段歷史，並述說來到臺灣的不同群體的故事。":"「非市民」とは、どの国にも国籍を認められていない人や、国籍はあっても政治、戦乱、制度などの要因により、本来の国の保護を受けられない人のことです。本特別展は、メイン展示場と廊下の延長展示エリアを通じてこの歴史をつなぎ、台湾にやって来たさまざまな人々の物語を伝えます。","零、非關公民歷史教室":"ゼロ、非市民の歴史教室","一、時代浪潮下的移動：跨越邊界的生命印記":"1、時代の波の中の移動：境界を越えた生命の刻印","二、看不見的邊界":"2、見えない境界","三、At Home":"3、At Home","四、邊界上的未盡旅程":"4、境界線上の終わらない旅","路線進度 #／# 站":"ルート進捗 #／#か所","下一站：臺灣文化協會會歌":"次の見どころ：台湾文化協会会歌","路線地圖":"ルートマップ","聲音，演譯了誰的心情？傳遞著哪些故事？歷史上的歌謠、唸詞、流行歌，穿越數百年的聲音，用歌詞與曲調留下了特殊歷史情境的當下痕跡，呼喚您來傾聽。":"声は、誰の気持ちを表し、どんな物語を伝えているのでしょうか。歴史の中の歌謡、唱え言葉、流行歌は、数百年を越える声として、歌詞と旋律に特別な歴史的状況の跡を残しています。どうぞ耳を傾けてください。","查看路線站點":"ルートの見どころを見る","路線進度":"ルート進捗","路線站點":"ルートの見どころ","# 站":"#か所","地名記憶了相遇故事":"地名が記憶する出会いの物語","文字":"テキスト","部落傳唱的荷蘭歌":"部落で歌い継がれるオランダの歌","語音":"音声","唐山過臺灣唸謠":"唐山から台湾へ渡る唱え歌","淺井惠倫採集平埔歌曲":"浅井恵倫が採集した平埔の歌","林業勞動歌":"林業労働歌","馬蘭阿美群的歌謠":"マラン・アミ族の歌謡","唱遊歌曲":"唱歌遊戯の歌","臺灣文化協會會歌":"台湾文化協会会歌","流行音樂的誕生":"流行音楽の誕生","終戰那一天":"終戦のその日","臺灣民主歌":"台湾民主歌","愛國歌曲與禁歌":"愛国歌曲と禁歌","流離之音：歌曲裡的戰後原住民史":"流浪の声：歌に見る戦後の先住民史","收起路線站點":"ルートの見どころを閉じる","下一站：向漢人領取物資的木籤憑證":"次の見どころ：漢人から物資を受け取るための木札","博物館研究員私心推薦的經典藏品，這些物件背後，或是反映獨特的歷史記憶、人物真切的生命經歷，或是在地視角的投射，也有可能隱藏著歷史研究控的物質密碼？等你一起來解讀！":"博物館の研究員がひそかにおすすめする名品です。これらの品の背後には、独自の歴史の記憶や人物の真実の人生、地元の視点が映し出されているかもしれません。歴史研究好きだけが読み解ける物質の暗号が隠れていることも。一緒に読み解きましょう。","「生命的脈動」藝術品":"「生命の鼓動」アート作品","福
