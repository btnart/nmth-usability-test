  mz1:{n:'單元一｜海濱神姑：海口女巫的天后之路', d:110, no:'411', img:'mazu.jpg', fl:'4F', zone:'第一特展室', txt:'媽祖原為只知其姓的巫女林氏，經由歷代對媽祖顯聖事蹟的層累，形塑出神通廣大的女聖人樣貌，可看見媽祖在政治與宗教力量塑造下，成為護國救民的英烈天妃。本單元透過17至19世紀的圖像與經典文獻，看見媽祖的形象在官方與民間的共同詮釋下，逐步確立為天后林默的過程。'},   /* 萬相天后特展：單元名稱與文字照 A 版（官網展覽頁） */

  mz4:{n:'單元四｜萬年香火：當靈力鑄化為聖物', d:125, no:'414', img:'mazu.jpg', fl:'4F', zone:'第一特展室', txt:'無形的靈力，憑附於有形的物件，亦降於大符與各類聖物；承受香火的香爐與運載神火的香擔，是最關鍵的靈力載體。進香、遶境與過爐，是親近媽祖的神聖時刻，也是廟與廟、人與人之間交通互動的時刻，將世代的信仰記憶傳承下去。'},

  bd2:{n:'二、看不見的邊界', d:110, no:'433', img:'bd-10.jpg', fl:'4F', zone:'第三特展室', txt:'「跨過了邊界，邊界就消失了嗎？」「身分」的邊界，從來不是固定的，它會隨著法律制度、國際局勢與國家安全考量而被重新劃定。對許多來到臺灣的人而言，邊界不只存在於海關，也延伸到入境後的停留、居留或定居審查。'},
  bd3:{n:'三、At Home', d:115, no:'434', img:'bd-11.jpg', fl:'4F', zone:'第三特展室', txt:'「『家』，對你來說是什麼？」對有些人而言，「家」是正在經歷戰火的地方；對流亡者而言，是宗教、文化與身分認同的延續；對離開香港的人而言，那個地方還在，卻已不同。來自不同地方的人們，帶著各自對「家」的記憶與牽掛來到臺灣。'},

  rs_l_play:{n:'唱遊歌曲', d:105, no:'227', img:'work-5.jpg', fl:'2F', zone:'新秩序下的苦悶與夢想', rstop:true,

  rs_l_pop:{n:'流行音樂的誕生', d:125, no:'229', img:'work-5.jpg', fl:'2F', zone:'新秩序下的苦悶與夢想', rstop:true,

  rs_l_ban:{n:'愛國歌曲與禁歌', d:125, no:'232', img:'unit-6.jpg', fl:'2F', zone:'走向民主這條路', rstop:true,

async function decodePhoto(file){

  if('BarcodeDetector' in window){ try{ const r=await new BarcodeDetector({formats:['qr_code']}).detect(img); if(r[0]) return r[0].rawValue; }catch(e){} }
  const jsQR=await loadJsQR(), W=img.width, H=img.height, c=document.createElement('canvas'), x=c.getContext('2d',{willReadFrequently:true});
  /* 先整張試，再放大中間區域試：QR Code 只佔照片一小塊時（例如拍電腦螢幕），整張縮小會糊到讀不出來 */
  const tries=[[1,800],[1,1400],[.6,1400],[.4,1200],[.25,1000],[.25,1600]];
  [0,.5,1].forEach(py=>[0,.5,1].forEach(px=>tries.push([.45,1800,px,py])));   /* QR Code 沒拍在正中間時，九宮格各放大一次 */
  tries.push([1,2400]);
  for(const [f,max,px=.5,py=.5] of tries){
    const sw=W*f, sh=H*f, k=Math.min(1,max/Math.max(sw,sh)), w=Math.round(sw*k), h=Math.round(sh*k);
    c.width=w; c.height=h; x.drawImage(img,(W-sw)*px,(H-sh)*py,sw,sh,0,0,w,h);
    const r=jsQR(x.getImageData(0,0,w,h).data,w,h); if(r&&r.data) return r.data;
    await new Promise(ok=>setTimeout(ok)); }
  return null; }
function nativeScan(onText){ loadJsQR().catch(()=>{}); const i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.setAttribute('capture','environment');
  i.style.cssText='position:fixed;left:-9999px;top:0;opacity:0'; document.body.appendChild(i);   /* iOS 上沒放進頁面的 input 有時拍完不會觸發 change */
  i.onchange=async()=>{ const f=i.files&&i.files[0]; i.remove(); if(!f) return; toast('辨識中…'); let t=null; try{ t=await decodePhoto(f); }catch(e){} onText(t); };
  i.click(); }

    scr.addEventListener('pointermove',e=>{ if(!d||e.pointerId!==d.id) return; const dx=e.clientX-d.x, dy=e.clientY-d.y;

/* ---------- 本日活動時刻表（旅程痛點：入館前不知道設施時刻） ----------
   場次為示意；?now=14:20 可示範現在時間、?day=sat 示範假日場次 */
const _qs=new URLSearchParams(__QS);
function nowMin(){ const q=_qs.get('now'); if(q&&/^\d{1,2}:\d{2}$/.test(q)){ const [h,m]=q.split(':').map(Number); return h*60+m; } const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function isHoliday(){ const q=_qs.get('day'); if(q) return q==='sat'||q==='sun'; const g=new Date().getDay(); return g===0||g===6; }
const hm=t=>{ const [h,m]=t.split(':').map(Number); return h*60+m; };
const fmtHM=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function every(a,b,st){ const o=[]; for(let m=hm(a);m<=hm(b);m+=st) o.push(fmtHM(m)); return o; }
function todayEvents(){ const hol=isHoliday(), now=nowMin();
  return [
    {n:'華語定時導覽', where:'1F 服務臺集合', dur:60, s:['10:30','14:30'].map(t=>({t}))},
    {n:'時光車站', where:'1F 兒童廳', dur:15, note:hol?'假日現場發號碼牌':'每 30 分鐘一班', s:every('09:30','16:30',30).map(t=>({t}))},
    {n:'圓形劇場影片', where:'1F 圓形劇場', dur:20, s:['10:00','11:00','13:30','15:00','16:00'].map(t=>({t}))},
    {n:'VR 體驗・現場報名', where:'1F 服務臺報名', note:'名額有限，額滿為止', s:[{t:'09:30',end:'12:00',label:'上午場'},{t:'13:30',end:'16:30',label:'下午場'}]},
  ].map(e=>{ const ss=e.s.map(x=>{ const st=hm(x.t), en=x.end?hm(x.end):st+(e.dur||30); return {...x,st,en,state:now>=en?'past':now>=st?'live':'next'}; });
    return {...e, ss, live:ss.find(x=>x.state==='live'), next:ss.find(x=>x.state==='next'), left:ss.filter(x=>x.state!=='past').length}; });
}
function eventsSection(){
  const now=nowMin(), evs=todayEvents(), remain=evs.reduce((n,e)=>n+e.left,0);
  evs.sort((a,b)=>{ const k=e=>e.left?(e.live||e.next).st:9999; return k(a)-k(b); });
  const chip=(x,first)=>{ const lab=(x.label?x.label+' ':'')+x.t+(x.end?'–'+x.end:'');
    if(x.state==='past') return `<span class="evc past"><s>${lab}</s><span class="sr">（已結束）</span></span>`;
    if(x.state==='live') return `<span class="evc live"><i></i>進行中 ${lab}</span>`;
    return `<span class="evc ${first?'first':''}">${first?'下一場 ':''}${lab}</span>`; };
  const shown=S.evAll?evs:evs.slice(0,2);
  return `<div class="secthead" style="min-height:0"><div class="r"><b>本日活動</b><em>today</em><span style="margin-left:auto;font-size:12px;color:var(--text2)">現在 ${fmtHM(now)}</span></div>
      ${remain?'':'<p>今天的場次都結束了，明天見</p>'}</div>
    <div style="display:flex;flex-direction:column;gap:10px;padding:0 24px 34px">${shown.map((e,ei)=>{
      const status=e.live?'進行中'+(e.live.end?'，到 '+e.live.end:''):e.next?(e.next.st-now<=60?(e.next.st-now)+' 分鐘後開始':'下一場 '+e.next.t):'今日場次已結束';
      return `<div style="background:#fff;border-radius:16px;box-shadow:0 8px 24px -4px rgba(0,0,0,.14);padding:14px 16px;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;align-items:baseline;gap:8px"><b style="flex:1;font-weight:700;font-size:15px;color:${e.left?'var(--ink)':'var(--text2)'}">${e.n}</b>
          <span style="font-size:12px;${e.left?'font-weight:500;color:var(--teal7)':'color:var(--text2)'}">${status}</span></div>
        <div class="meta" style="padding:0"><i></i>${e.where}${e.note?'・'+e.note:''}</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${(()=>{ const past=e.ss.filter(x=>x.state==='past'), open=S.evPast&&S.evPast[e.n];
          return (past.length&&!open?`<button class="evc past" onclick="(S.evPast=S.evPast||{})['${e.n}']=true;render()" aria-label="顯示已結束的 ${past.length} 場">已結束 ${past.length} 場</button>`:'')
            + e.ss.filter(x=>open||x.state!=='past').map(x=>chip(x,x===e.next&&!e.live)).join(''); })()}</div></div>`; }).join('')}
      ${evs.length>2?`<button onclick="S.evAll=!S.evAll;render()" style="align-self:center;min-height:44px;font-size:13px;color:var(--teal7)">${S.evAll?'收起':'看全部 '+evs.length+' 項活動'}</button>`:''}</div>
    <div class="divider"></div>`;
}

        `<button class="tealbtn" style="align-self:flex-start" onclick="toast('已複製上車地點：臺史博洽公停車場')">複製上車地點給司機</button>`)}
      ${card('公車',p('6 號門外「臺史博」站：10、18、紅 3（往臺南火車站）'))}
      ${card('周邊吃什麼',['安南區・虱目魚粥（步行 8 分）','鹿耳門天后宮商圈小吃（車程 10 分）','四草大眾廟周邊海產（車程 12 分）'].map(t=>`<div class="meta" style="padding:0"><i></i>${t}</div>`).join(''))}
      <button onclick="go('feedback')" style="font-size:13px;color:var(--teal7);padding:4px 0">參觀後有意見？到意見回饋告訴我們 →</button></div>
  </div></div>`;
}
/* ---------- 多語系（落地頁偵測／選單切換／無該語系提示） ---------- */
const LANGS = {zh:['繁體中文','zh-TW'], en:['English','en'], ja:['日本語','ja'], ko:['한국어','ko']};
const NO_LANG = {en:'This content is not yet available in English', ja:'この内容はまだ日本語に対応していません', ko:'이 콘텐츠는 아직 한국어로 제공되지 않습니다'};
const EN = {   /* 英文版只翻首頁（照 4(3)-a）；其他頁顯示「無該語系」提示＋中文原文 */
  '歡迎來到臺史博<br>語音導覽':' ',   /* 英文版主標已是英文，中文副標拿掉 */ '本日開館 09:00 – 17:00':'Open today 09:00 – 17:00', '週一休館':'Closed Mondays',
  '當前展覽':'Current Exhibitions', '常設展與特展，掃描展品即可聆聽':'Scan any object in our exhibitions to listen',
  '主題路線':'Themed Routes', '多種主題內容，邀請你從不同的路徑探索臺史博':'Follow themed routes or explore the museum freely!',
  '展區地圖':'Floor Map', '探索樓層平面與設施位置':'Floor plans and facilities', '樓層介紹':'Floor Guide',
  '斯土斯民：臺灣的故事':'Land and People: The Story of Taiwan', '萬相天后：臺灣媽祖信仰文化特展':'Myriad Faces of Mazu: Special Exhibition on Mazu Belief in Taiwan', '邊界之外‧島嶼之中：當代臺灣非公民的故事特展':'Beyond Borders, Within the Island: Stories of Non-citizens in Contemporary Taiwan', '必看之物':'Must-see Objects', '「聽」的臺灣史':'Listening to Taiwan History', '「摸」的臺灣史':'Touching Taiwan History',
  '「聽的臺灣史」聆聽路線':'Listening to Taiwan History', '必看之物精選路線':'Must-See Highlights',
  '25 個導覽點・約 60 分鐘':'25 stops・approx. 60 min', '2F 常設展廳':'2F Permanent Gallery', '主題路線｜全館':'Themed route｜Whole museum',
  '展示教育大樓4樓第1特展室':'4F Special Exhibition Room 1', '國立臺灣歷史博物館':'National Museum of Taiwan History' };
const L = t => (S.lang==='en' && S.screen==='home' && EN[t]) || t;
function detectLang(){ const q=new URLSearchParams(__QS).get('lang'); if(q&&LANGS[q]) return q;
  const n=(navigator.language||'zh').toLowerCase(); return n.startsWith('en')?'en':n.startsWith('ja')?'ja':n.startsWith('ko')?'ko':'zh'; }
function scrLanding(){
  const d=S.detect;
  return `<div class="scr landing ${S.landIn?'':'enter'}" style="background:#0f212b">
    <img class="lbg" src="${A('landing-b.jpg')}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(15,33,43,.5),rgba(15,33,43,.86))"></div>
    <div style="position:absolute;left:0;right:0;top:330px;display:flex;flex-direction:column;gap:16px;align-items:center;white-space:nowrap">
      <h1 style="font-weight:700;font-size:26px;line-height:normal;color:#fff">臺史博語音導覽</h1>
      <p style="font-size:12px;color:var(--tealL)">National Museum of Taiwan History</p>
      <button class="landgo" onclick="leaveLanding()">開始導覽</button>
      <div style="width:220px;display:flex;flex-direction:column;gap:8px;align-items:center" role="status" aria-live="polite">
        <div class="landbar" aria-hidden="true"><i id="landFill" style="width:${S.loadPct||0}%"></i></div>
        <p id="landMsg" style="font-size:12px;color:var(--tealL)">${landMsg()}</p></div>
      <button onclick="S.sheet='lang';render()" style="border:1px solid rgba(255,255,255,.7);border-radius:18px;padding:8px 16px;min-height:44px;display:flex;gap:10px;align-items:center;font-weight:500;font-size:12px;color:#fff">
        ${LANGS[S.lang][0]}・Language <span style="transform:rotate(90deg);display:flex">${img('ic-chevron-right-white12.svg',12,12)}</span></button>
    </div></div>`;
}
/* 預載首頁會用到的圖片；不自動跳轉，觀眾隨時可以按「開始導覽」先進去（網路慢時邊用邊載） */
function leaveLanding(){ const l=document.querySelector('#app > .scr.landing'); if(!l||REDUCED) return setLang(S.lang);
  l.classList.add('leaving'); setTimeout(()=>setLang(S.lang),420); }
function landMsg(){ return S.loadPct>=100?'內容已準備好':S.slowNet?'網路較慢，可以先進入，內容會邊用邊載入':'正在準備導覽內容…'; }
function preloadHome(){
  const list=['home-hero.jpg','ex-permanent.jpg','mazu.jpg','route-listen.jpg','route-mustsee.jpg','map-site.png','logo-sprite.png'];
  let n=0; S.loadPct=0; S.slowNet=false;
  const upd=()=>{ const f=document.getElementById('landFill'), m=document.getElementById('landMsg'); if(f) f.style.width=S.loadPct+'%'; if(m) m.textContent=landMsg(); };
  list.forEach(f=>{ const im=new Image(); im.onload=im.onerror=()=>{ n++; S.loadPct=Math.round(n/list.length*100); upd(); }; im.src=A(f); });
  setTimeout(()=>{ if(S.loadPct<100){ S.slowNet=true; upd(); } },5000);
}
function setLang(k){ S.lang=k; S.sheet=null; if(S.screen==='landing'){ S.screen='home'; S.hist=[]; render(true,'fade'); } else render(true); }
function showMT(){ const el=document.createElement('div'); el.className='mtnote'; el.setAttribute('role','status');
  el.innerHTML=`<span style="font-size:13px;color:#8a6d00" aria-hidden="true">⚙</span><p>This section is machine-translated.　<span lang="zh-TW">本區內容為機器翻譯，導覽核心內容均為人工翻譯。</span></p>`;
  document.getElementById('app').appendChild(el); setTimeout(()=>el.remove(),4000); }
function langSheet(){
  return `<div class="dim" onclick="S.sheet=null;render()"></div>
  <div class="sheet" role="dialog" aria-labelledby="lgH" style="border-radius:24px;padding:14px 24px 28px;display:flex;flex-direction:column;gap:14px">${closeX('S.sheet=null;render()')}
    <div class="grab"></div>
    <h2 id="lgH" style="font-weight:500;font-size:16px;color:var(--ink)">選擇語言 / Language</h2>
    <div role="radiogroup" aria-labelledby="lgH" style="display:flex;flex-direction:column;gap:14px">${Object.entries(LANGS).map(([k,[n]])=>`
      <button role="radio" aria-checked="${S.lang===k}" lang="${LANGS[k][1]}" onclick="${S.screen==='landing'?`S.lang='${k}';S.sheet=null;render()`:`setLang('${k}')`}" style="display:flex;align-items:center;gap:10px;padding:12px 8px;border-radius:10px;text-align:left;${S.lang===k?'background:var(--tealL)':''}">
        <span style="width:300px;display:flex;flex-direction:column;gap:2px">${S.lang===k?`<span style="font-weight:500;font-size:14px;color:var(--teal7)">${n}</span><span style="font-size:11px;color:var(--text2)">目前使用</span>`:`<span style="font-size:14px;color:var(--text)">${n}</span>`}</span>
        ${S.lang===k?img('ic-check-teal.svg',20,20):''}</button>`).join('')}</div>
    <p style="background:var(--cream);border-radius:8px;padding:9px 12px;font-size:11px;color:var(--text2)">臺灣台語、客語導覽為語音版本，於播放器內切換即可</p>
  </div>`;
}
function langBanner(){
  if(S.lang==='zh' || (S.lang==='en'&&S.screen==='home') || ['landing','scan'].includes(S.screen)) return '';
  return `<div class="nolang" role="note" lang="${LANGS[S.lang][1]}"><b>${NO_LANG[S.lang]}</b><span lang="zh-TW">以下顯示中文原文｜可用語音導覽：華語・臺灣台語・客語</span></div>`;
}
/* =====================================================================
   render
   ===================================================================== */
const SCREENS={leave:scrLeave, landing:scrLanding, login:scrLogin, feedback:scrFeedback, home:scrHome, theme:scrTheme, sign:scrSign, scan:scrScan, exlist:scrExList, ex:scrEx, route:scrRoute, stop:scrStop, player:()=>S.player?scrPlayer():scrHome(), map:scrMap, member:scrMember};
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
/* 底部面板高度跟著內容走（不再固定 250px），地圖可視區的下緣跟著面板上緣 */
function syncSheet(){ document.querySelectorAll('#app > .scr').forEach(scr=>{ const z=scr.querySelector(':scope .zonesheet'); if(z) scr.style.setProperty('--sh',z.offsetHeight+'px'); else scr.style.removeProperty('--sh'); }); }
function render(resetScroll, anim){
  const app=document.getElementById('app');
  let ghost=null;
  /* 展開播放器：記下迷你播放器的位置，新畫面從那裡長出來 */
  const rel=el=>{ if(!el) return null; const a=app.getBoundingClientRect(), r=el.getBoundingClientRect(); return {t:r.top-a.top, l:r.left-a.left, b:a.bottom-r.bottom, r:a.right-r.right}; };
  const fromMini = anim==='up' && !REDUCED ? rel(app.querySelector(':scope > .scr .mini .box')) : null;
  /* 收合／展開時，主圖和標題各自飛到對方的位置（跟切換逐字稿一樣是同一個東西在移動） */
  const box_=el=>{ if(!el) return null; const a=app.getBoundingClientRect(), r=el.getBoundingClientRect();
    if(r.width<2||r.right<a.left+2||r.left>a.right-2||r.bottom<a.top||r.top>a.bottom) return null; return {x:r.left-a.left,y:r.top-a.top,w:r.width,h:r.height}; };
  const txt_=el=>{ if(!el) return null; const g=document.createRange(); g.selectNodeContents(el); const b=box_({getBoundingClientRect:()=>g.getBoundingClientRect()}); if(!b) return null;
    const cs=getComputedStyle(el); return {...b, fs:parseFloat(cs.fontSize), fw:cs.fontWeight, c:cs.color, t:el.textContent.trim()}; };
  const fly = (!REDUCED && (anim==='down'||anim==='up')) ? (anim==='down' ? (()=>{ const pi=app.querySelector('#pimg'), sg=app.querySelector('.sgvid');
      const im=pi?pi.querySelectorAll('img')[S.ci||0]:null;
      return { img:box_(pi||sg), src:im?im.src:(S.player?A(it(S.player.id).img):''), r0:16, title:txt_(app.querySelector('.pname')||app.querySelector('.sgttl p')) }; })()
    : (()=>{ const th=app.querySelector(':scope > .scr .mini .th img'); return { img:box_(th), src:th?th.src:'', r0:8, title:txt_(app.querySelector(':scope > .scr .mini .tt span')) }; })()) : null;
  if(anim && !REDUCED && app.firstElementChild){   /* 舊畫面留著做轉場，轉完就移除 */
    ghost=document.createElement('div'); ghost.className='ghost g-'+anim;
    while(app.firstChild) ghost.appendChild(app.firstChild);
    ghost.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
  }
  const sc=app.querySelector('.scroll'); const top=(!resetScroll&&sc)?sc.scrollTop:0;
  let html=(SCREENS[S.screen]||scrHome)();
  if(S.sheet==='menu') html+=menuOverlay();
  if(S.sheet==='plan'&&S.plan) html+=`<div class="scr" style="background:transparent;z-index:45">${planSheet()}</div>`;
  if(S.sheet==='switch') html+=`<div class="scr" style="background:transparent;z-index:45">${switchSheet()}</div>`;
  if(S.sheet==='display') html+=`<div class="scr" style="background:transparent;z-index:45">${displaySheet()}</div>`;
  if(S.sheet==='a11y') html+=`<div class="scr" style="background:transparent;z-index:45">${a11ySheet()}</div>`;
  if(S.sheet==='offline') html+=`<div class="scr" style="background:transparent;z-index:45">${offlineSheet()}</div>`;
  if(S.sheet==='lang') html+=`<div class="scr" style="background:transparent;z-index:45">${langSheet()}</div>`;
  const lb=langBanner(); if(lb) html+=`<div style="position:absolute;left:0;right:0;top:${S.screen==='home'?67:64}px;z-index:7">${lb}</div>`;
  if(S.sheet==='howto') html+=`<div class="scr" style="background:transparent;z-index:45">${howtoSheet()}</div>`;
  app.innerHTML=html;
  syncSheet();
  const toMini = anim==='down' && ghost ? rel(app.querySelector(':scope > .scr .mini .box')) : null;
  const ins=m=>`inset(${m.t}px ${m.r}px ${m.b}px ${m.l}px round 20px)`, EASE='cubic-bezier(.32,.72,0,1)';
  if(fly && ghost && (toMini||fromMini)){ const dur=toMini?460:480;
    const tImgEl = toMini ? app.querySelector(':scope > .scr .mini .th img') : (app.querySelector('#pimg')||app.querySelector('.sgvid'));
    const tTitEl = toMini ? app.querySelector(':scope > .scr .mini .tt span') : (app.querySelector('.pname')||app.querySelector('.sgttl p'));
    const tImg=box_(tImgEl), tTit=txt_(tTitEl);
    const hideG = toMini ? ['.pimg','.sgvid','.pname','.sgttl p'] : ['.mini .th img','.mini .tt span'];
    const reveal=[];
    if(fly.img&&tImg){ ghost.querySelectorAll(hideG.slice(0,toMini?2:1).join(',')).forEach(e=>e.style.visibility='hidden'); tImgEl.style.visibility='hidden'; reveal.push(tImgEl);
      const el=document.createElement('div'); el.setAttribute('aria-hidden','true');
      Object.assign(el.style,{position:'absolute',zIndex:80,pointerEvents:'none',background:`url("${fly.src}") center/cover`,boxShadow:'0 6px 18px rgba(0,0,0,.18)'});
      app.appendChild(el); const r1=toMini?8:16, f=fly.img;
      el.animate([{left:f.x+'px',top:f.y+'px',width:f.w+'px',height:f.h+'px',borderRadius:fly.r0+'px'},{left:tImg.x+'px',top:tImg.y+'px',width:tImg.w+'px',height:tImg.h+'px',borderRadius:r1+'px'}],{duration:dur,easing:EASE,fill:'forwards'}).onfinish=()=>el.remove();
      setTimeout(()=>el.remove(),dur+300); }
    if(fly.title&&tTit){ ghost.querySelectorAll(hideG.slice(toMini?2:1).join(',')).forEach(e=>e.style.visibility='hidden'); tTitEl.style.visibility='hidden'; reveal.push(tTitEl);
      const f=fly.title, k=tTit.fs/f.fs, el=document.createElement('span'); el.textContent=f.t; el.setAttribute('aria-hidden','true');
      Object.assign(el.style,{position:'absolute',left:f.x+'px',top:f.y+'px',zIndex:81,pointerEvents:'none',whiteSpace:'nowrap',fontSize:f.fs+'px',fontWeight:f.fw,color:f.c,lineHeight:f.h+'px',transformOrigin:'0 0'});
      app.appendChild(el);
      el.animate([{transform:'translate(0,0) scale(1)',color:f.c},{transform:`translate(${tTit.x-f.x}px,${tTit.y-f.y}px) scale(${k})`,color:tTit.c}],{duration:dur,easing:EASE,fill:'forwards'}).onfinish=()=>el.remove();
      setTimeout(()=>el.remove(),dur+300); }
    setTimeout(()=>reveal.forEach(e=>e.style.visibility=''),dur); }
  if(ghost && (toMini || fromMini)){   /* 播放器整頁縮進迷你播放器／從迷你播放器放大回整頁 */
    const scr=app.querySelector('.scr'), box=app.querySelector(':scope > .scr .mini .box');
    if(toMini){ app.appendChild(ghost); ghost.style.zIndex=50;
      ghost.animate([{clipPath:'inset(0px 0px 0px 0px round 28px)',opacity:1},{clipPath:ins(toMini),opacity:1,offset:.8},{clipPath:ins(toMini),opacity:0}],{duration:460,easing:EASE,fill:'forwards'}).onfinish=()=>ghost.remove();
      const inner=ghost.firstElementChild; if(inner) inner.animate([{transform:'scale(1)'},{transform:'scale(.92)'}],{duration:460,easing:EASE,fill:'forwards'});
      if(box) box.animate([{opacity:0},{opacity:0,offset:.6},{opacity:1}],{duration:460});
    } else { app.insertBefore(ghost, app.firstChild);
      scr.style.zIndex=2; scr.animate([{clipPath:ins(fromMini),opacity:.4},{clipPath:ins(fromMini),opacity:1,offset:.12},{clipPath:'inset(0px 0px 0px 0px round 0px)',opacity:1}],{duration:480,easing:EASE}).onfinish=()=>{ ghost.remove(); scr.style.zIndex=''; };
      const inner=scr.firstElementChild; if(inner) inner.animate([{transform:'scale(.94)'},{transform:'scale(1)'}],{duration:480,easing:EASE}); }
    setTimeout(()=>ghost.remove(),900);
  } else if(ghost){ const scr=app.querySelector('.scr');
    if(anim==='pop'||anim==='down'){ app.appendChild(ghost); if(scr&&anim==='pop') scr.classList.add('in-back'); }
    else { app.insertBefore(ghost, app.firstChild); if(scr) scr.classList.add('in-'+anim); }
    const done=()=>{ ghost.remove(); app.querySelectorAll('.in-push,.in-up,.in-fade,.in-back').forEach(e=>e.classList.remove('in-push','in-up','in-fade','in-back')); };
    ghost.addEventListener('animationend',done,{once:true}); setTimeout(done,600); }
  app.className=(S.fs==='l'?'fs-l ':'')+(S.hc?'hc':'');
  const sc2=app.querySelector(':scope > .scr .scroll'); if(sc2) sc2.scrollTop=top;
  if(S.screen==='landing') setTimeout(()=>{ S.landIn=true; },1200);
  if(S.screen==='home'){ homeScroll(); S.heroPlayed=true; }   /* 說明牌式進場只在第一次進首頁播放 */ if(S.screen==='ex'||S.screen==='route') exNavMount(); if(S.screen==='player') playerMount(); if(S.screen==='map') mapMount();
  const pr=document.getElementById('prog');
  if(pr) pr.onpointerdown=ev=>{ const r=pr.getBoundingClientRect(); const f=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width)); S.player.pos=f*it(S.player.id).d; render(); };
}
/* 模擬播放：每秒依倍速推進；播完自動下一則 */
setInterval(()=>{ const p=S.player; if(!p||!p.playing) return;
  p.pos+=p.speed; if(p.pos>=it(p.id).d){ p.pos=it(p.id).d; p.playing=false;
    if(p.ctx.type==='route' && p.ctx.idx===ROUTES[p.ctx.key].list.length-1) return routeDone();
    if((S.screen==='player'||(S.screen==='map'&&S.tour&&!S.nav&&!S.herePick&&!S.way))&&!S.sheet) render(); else tickDOM(); return; }   /* 地圖上的現場導覽面板也要從「正在聽」換成「剛聽完」 */
  tickDOM(); }, 1000);
/* 輪播自動換圖：只在播放分頁、沒開逐字稿與手語時 */
setInterval(()=>{ const p=S.player; if(S.screen!=='player'||!p||S.sheet||(S.pTab||'play')!=='detail'||REDUCED) return; goSlide((S.ci||0)+1); }, 4000);
S.detect=detectLang();
S.lang=S.detect;
try{ S.signPref = localStorage.getItem('nmth.signPref')==='1'; }catch(e){ S.signPref=false; }
/* 易用性測試的情境入口：?go=home 直接到首頁；?go=pt:412 掃到展籤 QR Code（開掃碼頁並帶入編號）；?go=play:205 參觀到一半、正在聽這一件 */
const __GO=(_qs.get('go')||'').split(':');
if(!__GO[0]&&!new URLSearchParams(__QS).has('skip')){ S.screen='landing'; preloadHome(); }
(()=>{ if(__GO[0]==='ex'&&EXHIBITIONS[__GO[1]]){ openEx(__GO[1]); S.hist=['home']; return; }   /* ?go=ex:zj 掃展場入口的 QR Code：開這檔展覽頁 */
  if(__GO[0]==='tour'&&EXHIBITIONS[__GO[1]]){ const k=__GO[1], l=exBase(k), i=Math.max(0,Math.min(l.length-1,(+__GO[2]||1)-1));   /* ?go=tour:perm:3 展覽導覽聽到第 3 則（前面的已聽完） */
    S.heard[k]=new Set(l.slice(0,i)); play(l[i],{type:'ex',key:k}); S.hist=['home']; return; }
  const e=Object.entries(ITEMS).find(([k,v])=>v.no===__GO[1]); if(!e) return;
  if(__GO[0]==='pt'){ S.hist=['home']; S.screen='scan'; S.code=__GO[1]; }
  if(__GO[0]==='play'){ const ex=Object.keys(EXHIBITIONS).find(k=>(EXHIBITIONS[k].items||[]).includes(e[0]))||'perm'; play(e[0],{type:'ex',key:ex}); S.hist=['home']; } })();
render(true);
</script>
