越過汪洋，在異鄉落地生根；延伸至臺灣後，又向外輻射至世界各地。":"媽祖の海上での霊験は、閩（福建）と粤（広東）の両地で深く崇められました。明代以降、海上活動が盛んになるにつれ、媽祖信仰は中国南東沿岸から貿易ルートに沿って東アジア諸国へ広がりました。船乗りや移民が携えた神像や聖物によって、媽祖の香火は大海を越えて異郷に根づき、台湾に伝わった後は、さらに世界各地へ広がっていきました。","單元二｜海上福星：媽祖信仰傳播的航跡 的圖片":"ユニット2｜海の福の星：媽祖信仰が広まった航跡 の画像","單元二｜海上福星：媽祖信仰傳播的航跡（第 # 張，共 # 張）":"ユニット2｜海の福の星：媽祖信仰が広まった航跡（#枚目、全#枚）","媽祖信仰深入臺灣後，因地域與族群的差異，被賦予不同的稱呼與形象：是榮及雙親的孝女，是慈愛赤子的媽婆；能以施藥救疫，也在戰火之中顯聖。除了多樣性的神像外，冠服、神輿與時尚精品，也形塑出不同時代的媽祖樣貌。":"媽祖信仰は台湾に深く根づくと、地域や民族の違いによって、さまざまな呼び名や姿が与えられました。両親に栄誉をもたらす孝行娘であり、赤子を慈しむ媽婆でもあります。薬を施して疫病を救い、戦火の中でも霊験を現しました。多様な神像のほか、冠服、神輿、ファッションブランド品も、時代ごとの媽祖の姿を形づくっています。","單元三｜盛裝駕到：千變萬化的臺灣天后 的圖片":"ユニット3｜盛装でご降臨：千変万化の台湾の天后 の画像","單元三｜盛裝駕到：千變萬化的臺灣天后（第 # 張，共 # 張）":"ユニット3｜盛装でご降臨：千変万化の台湾の天后（#枚目、全#枚）","無形的靈力，憑附於有形的物件，亦降於大符與各類聖物；承受香火的香爐與運載神火的香擔，是最關鍵的靈力載體。進香、遶境與過爐，是親近媽祖的神聖時刻，也是廟與廟、人與人之間交通互動的時刻，將世代的信仰記憶傳承下去。":"目に見えない霊力は、形ある物に宿り、大きな護符やさまざまな聖物にも降ります。香火を受ける香炉と、神の火を運ぶ香担ぎは、最も重要な霊力の依り代です。進香、遶境、過炉は、媽祖に近づく神聖なひとときであり、廟と廟、人と人が交流するときでもあり、世代を越えた信仰の記憶を受け継いでいきます。","單元四｜萬年香火：當靈力鑄化為聖物 的圖片":"ユニット4｜万年の香火：霊力が聖なる品になるとき の画像","單元四｜萬年香火：當靈力鑄化為聖物（第 # 張，共 # 張）":"ユニット4｜万年の香火：霊力が聖なる品になるとき（#枚目、全#枚）","隨時代更迭與社會結構變化，天后以各類形式顯聖與再現。數位科技改變了信仰傳播途徑，媽祖信仰以媒體直播與影像跨越地域限制；素昧平生的人們也因「結緣品」而聚合，比肩同行，使媽祖信仰得以歷久彌新。":"時代の移り変わりや社会構造の変化とともに、天后はさまざまな形で霊験を現し、再び姿を現します。デジタル技術は信仰の広まり方を変え、媽祖信仰はメディアの生中継や映像によって地域の制約を越えました。見ず知らずの人々も「結縁品」を通じて集まり、肩を並べて歩み、媽祖信仰が時を経ても新しくあり続けることを可能にしています。","單元五｜善願必佑：在當代與媽祖相遇 的圖片":"ユニット5｜願いは必ず叶う：現代で媽祖に出会う の画像","單元五｜善願必佑：在當代與媽祖相遇（第 # 張，共 # 張）":"ユニット5｜願いは必ず叶う：現代で媽祖に出会う（#枚目、全#枚）","導覽語言・目前手語導覽・中文字幕":"ガイド言語・現在 手話ガイド・中国語字幕","導覽語言，目前手語導覽・中文字幕":"ガイド言語、現在 手話ガイド・中国語字幕","手語導覽影片：原住民族的語言與名字":"手話ガイド動画：先住民族の言語と名前","手語導覽影片":"手話ガイド動画","原住民族的語言與名字 的圖片":"先住民族の言語と名前 の画像","原住民族的語言與名字（第 # 張，共 # 張）":"先住民族の言語と名前（#枚目、全#枚）","臺灣文化協會會歌 的圖片":"台湾文化協会会歌 の画像","臺灣文化協會會歌（第 # 張，共 # 張）":"台湾文化協会会歌（#枚目、全#枚）","展品 #・#F 走廊延伸展區":"展示品 #・#階 廊下の延長展示エリア","當邊界被劃下時，我們如何看見真正的彼此？從過去到現在，不同時代都存在著被排除在主流社會及國家制度之外的人——他們可能沒有戶籍、沒有國籍，始終游移在法律與現實的邊界。本區從更長遠的歷史脈絡出發，回看「非公民」如何被界定與形成。":"境界が引かれたとき、私たちは本当にお互いを見ることができるのでしょうか。過去から現在まで、どの時代にも、主流社会や国家制度から排除された人々がいました。戸籍も国籍もなく、法と現実の境界をさまよい続けた人々です。このエリアでは、より長い歴史の流れから、「非市民」がどのように定義され形成されてきたのかを振り返ります。","零、非關公民歷史教室 的圖片":"ゼロ、非市民の歴史教室 の画像","零、非關公民歷史教室（第 # 張，共 # 張）":"ゼロ、非市民の歴史教室（#枚目、全#枚）","#F 第三特展室・# 個":"#階 第3特別展示室・#か所","展品 #・#F 第三特展室":"展示品 #・#階 第3特別展示室","「當動盪席捲世界，人們帶來的只是行李嗎？」臺灣的歷史與世界局勢緊密相連。來自圖伯特、緬甸、香港與烏克蘭的人們，因冷戰、政變、戰爭與迫害，陸續跨越邊界來到這裡；他們的移動不只是個人選擇，而是為了守護生命、自由、信仰與未來。":"「世界が動乱に揺れるとき、人々が持ってくるのは荷物だけでしょうか。」台湾の歴史は世界情勢と密接につながっています。チベット、ミャンマー、香港、ウクライナからの人々は、冷戦、クーデター、戦争、迫害により、次々と境界を越えてここにやって来ました。その移動は個人の選択にとどまらず、命、自由、信仰、そして未来を守るためのものでした。","一、時代浪潮下的移動：跨越邊界的生命印記 的圖片":"1、時代の波の中の移動：境界を越えた生命の刻印 の画像","一、時代浪潮下的移動：跨越邊界的生命印記（第 # 張，共 # 張）":"1、時代の波の中の移動：境界を越えた生命の刻印（#枚目、全#枚）","「跨過了邊界，邊界就消失了嗎？」「身分」的邊界，從來不是固定的，它會隨著法律制度、國際局勢與國家安全考量而被重新劃定。對許多來到臺灣的人而言，邊界不只存在於海關，也延伸到入境後的停留、居留或定居審查。":"「境界を越えたら、境界はなくなるのでしょうか。」「身分」の境界は決して固定されたものではなく、法制度、国際情勢、国家安全保障の考慮によって引き直されます。台湾に来た多くの人にとって、境界は税関だけでなく、入国後の滞在、居留、定住の審査にまで及びます。","二、看不見的邊界 的圖片":"2、見えない境界 の画像","二、看不見的邊界（第 # 張，共 # 張）":"2、見えない境界（#枚目、全#枚）","「『家』，對你來說是什麼？」對有些人而言，「家」是正在經歷戰火的地方；對流亡者而言，是宗教、文化與身分認同的延續；對離開香港的人而言，那個地方還在，卻已不同。來自不同地方的人們，帶著各自對「家」的記憶與牽掛來到臺灣。":"「あなたにとって『家』とは何ですか。」ある人にとって「家」は戦火の中にある場所であり、亡命者にとっては宗教、文化、アイデンティティの継続であり、香港を離れた人にとっては、その場所はまだあっても、もう以前とは違うものです。さまざまな場所から来た人々が、それぞれの「家」の記憶と思いを抱いて台湾にやって来ました。","三、At Home 的圖片":"3、At Home の画像","三、At Home（第 # 張，共 # 張）":"3、At Home（#枚目、全#枚）","「當全球的流離與遷徙來到臺灣，我們將讓邊界變窄，還是讓關係展開？」我們看見人們在動盪中離開家園，看見人的身分如何在穿越邊界後被重新定義，也看見許多人在不安的處境中，仍努力在這裡生活、行動並照顧彼此。":"「世界の流浪と移動が台湾に訪れたとき、私たちは境界を狭くするのでしょうか、それとも関係を広げるのでしょうか。」動乱の中で故郷を離れる人々、境界を越えた後に身分が定義し直される様子、そして不安な状況の中でも、ここで暮らし、行動し、互いを気遣おうと努力する多くの人々の姿が見えます。","四、邊界上的未盡旅程 的圖片":"4、境界線上の終わらない旅 の画像","四、邊界上的未盡旅程（第 # 張，共 # 張）":"4、境界線上の終わらない旅（#枚目、全#枚）","展品 #・#F 臺灣，交會之島":"展示品 #・#階 台湾、出会いの島","這件展品位在「臺灣，交會之島」單元。臺灣，要從「交會」開始說起。這是一段不同人群，碰撞、摸索，共有同一塊土地的故事。本單元也有母語地名故事的線上展覽。":"この展示品は「台湾、出会いの島」ユニットにあります。台湾は「出会い」から語り始めなければなりません。これは、さまざまな人々がぶつかり合い、手探りしながら、同じ土地を分かち合う物語です。このユニットには、母語の地名の物語を紹介するオンライン展示もあります。","地名記憶了相遇故事 的圖片":"地名が記憶する出会いの物語 の画像","地名記憶了相遇故事（第 # 張，共 # 張）":"地名が記憶する出会いの物語（#枚目、全#枚）","展品 #・#F 倚海而生的島與人":"展示品 #・#階 海とともに生きる島と人々","這件展品位在「身陷角力戰的原住民」展區。在這段期間，隨著漢人、日本人、荷蘭人、西班牙人相繼到來，原本保持相對穩定狀態的臺灣原住民族社會受到一定程度的攪動。面對外來者，原住民各部落會主動選擇有利於部落的同盟對象，也會與敵對的勢力產生衝突。不同族群之間各有盤算，有時彼此交惡，有時維持著不穩定的聯盟關係。而外來團體間彼此也有糾葛衝突。":"この展示品は「勢力争いに巻き込まれた先住民」エリアにあります。この時期、漢人、日本人、オランダ人、スペイン人が相次いで訪れ、それまで比較的安定していた台湾先住民族の社会は、ある程度かき乱されました。外来者に直面した先住民の各部落は、自らに有利な同盟相手を主体的に選び、敵対する勢力と衝突することもありました。民族間にはそれぞれの思惑があり、時には仲違いし、時には不安定な同盟関係を保ちました。外来の集団同士にも対立や衝突がありました。","部落傳唱的荷蘭歌 的圖片":"部落で歌い継がれるオランダの歌 の画像","部落傳唱的荷蘭歌（第 # 張，共 # 張）":"部落で歌い継がれるオランダの歌（#枚目、全#枚）","展品 #・#F 山海之間的共存與競逐":"展示品 #・#階 山と海のあいだの共存と競い合い","這件展品位在「山海之間的共存與競逐」單元。#年臺灣被清朝併入版圖，大量漢人移民持續渡海前來，在平原、丘陵、沿山發展出各自的村落、產業及生活方式；在這片山與海之間的土地上，不同人群相互共存，也彼此競逐。":"この展示品は「山と海のあいだの共存と競い合い」ユニットにあります。#年に台湾が清朝の版図に組み込まれると、大量の漢人移民が海を渡って来続け、平野、丘陵、山沿いにそれぞれの村落、産業、生活様式を築きました。山と海のあいだのこの土地で、さまざまな人々が共存し、互いに競い合いました。","唐山過臺灣唸謠 的圖片":"唐山から台湾へ渡る唱え歌 の画像","唐山過臺灣唸謠（第 # 張，共 # 張）":"唐山から台湾へ渡る唱え歌（#枚目、全#枚）","展品 #・#F 新秩序下的苦悶與夢想":"展示品 #・#階 新秩序のもとでの苦悩と夢","這件展品位在「平埔原住民的人生故事」展區。不同地方的平埔社群，原本有自己的生活文化與網絡，再加上與漢人社會、清朝官府、歐美傳教士等不同人群的接觸，每個部落的際遇與發展都不盡相同。有的人與官府關係密切，身上冠有軍功、職銜；有的人則是收取地租的「番頭家」，或是跟漢人一樣投資經商；但也有更多人因為難以在原鄉過活，遠徙他處。從這些原住民社群人們的人生故事可以看到：在不同時代與際遇下，這塊土地上的人們，各自採用什麼樣的策略來生存發展。":"この展示品は「平埔先住民の人生物語」エリアにあります。各地の平埔の集団には、もともと独自の生活文化とネットワークがあり、さらに漢人社会、清朝の役所、欧米の宣教師などさまざまな人々と接したことで、各部落の境遇と発展はそれぞれ異なっていました。役所と親しく、軍功や官職を持つ人もいれば、地代を受け取る「番頭家」になった人、漢人と同じように投資や商売をした人もいました。しかし、故郷で暮らしていけず、遠くへ移り住んだ人はさらに多くいました。これらの先住民の人々の人生物語からは、さまざまな時代と境遇のもとで、この土地の人々がそれぞれどのような戦略で生き延び、発展したのかがわかります。","淺井惠倫採集平埔歌曲 的圖片":"浅井恵倫が採集した平埔の歌 の画像","淺井惠倫採集平埔歌曲（第 # 張，共 # 張）":"浅井恵倫が採集した平埔の歌（#枚目、全#枚）","這件展品位在「新時代，新產業」展區。日本時代初期將臺灣當作熱帶經濟作物和糧食的生產地，有系統地開發臺灣各項農、林、漁等產業資源，以提供日本帝國所需。工業則以新式製糖及食品加工業為主。#年代後期，總督府提出臺灣「工業化」的方針，戰爭時期並發展各項軍需工業，也替日後臺灣工業化奠定基礎。伴隨產業建設，島內外交通手段也逐漸完備。交通的完備與治安的穩定也逐步建構起臺灣旅遊業。日本帝國為展示其殖民建設成果，舉辦許多大型博覽會，產業與物產都是其中重要的宣傳面向。":"この展示品は「新時代、新産業」エリアにあります。日本統治時代の初期、日本は台湾を熱帯の経済作物と食糧の生産地とし、日本帝国が必要とする農業、林業、漁業などの資源を体系的に開発しました。工業は新式の製糖と食品加工が中心でした。#年代後半には総督府が台湾の「工業化」方針を打ち出し、戦時には各種軍需工業も発展して、のちの台湾の工業化の基礎となりました。産業の整備に伴い、島内外の交通手段も次第に整いました。交通の整備と治安の安定は、台湾の観光業も徐々に形づくりました。日本帝国は植民地建設の成果を示すため、多くの大型博覧会を開催し、産業と物産はその重要な宣伝の柱でした。","林業勞動歌 的圖片":"林業労働歌 の画像","林業勞動歌（第 # 張，共 # 張）":"林業労働歌（#枚目、全#枚）","這件展品位在「當原住民遭逢近代國家」展區。當日本帝國以近代國家形式進入臺灣，對人口、土地展開嚴密的掌控後，曾經在政治、文化上維持相對自主的山地，與雖已納入版圖但控制有限的東部地區，終於也逐步納入殖民體制。在國家的政策與征討下，原住民族的生活世界遭逢劇烈變動，並透過口述傳說，留下與官方紀錄大不相同、屬於族人觀點的歷史記憶。":"この展示品は「先住民が近代国家に出会うとき」エリアにあります。日本帝国が近代国家の形で台湾に入り、人口と土地を厳しく掌握するようになると、政治的・文化的に比較的自主性を保っていた山地や、版図に入ってはいたものの支配が限られていた東部地域も、ついに植民地体制に組み込まれていきました。国の政策と討伐のもと、先住民族の生活世界は激しく変動し、口述伝承を通して、公式記録とは大きく異なる、民族の視点による歴史の記憶を残しました。","馬蘭阿美群的歌謠 的圖片":"マラン・アミ族の歌謡 の画像","馬蘭阿美群的歌謠（第 # 張，共 # 張）":"マラン・アミ族の歌謡（#枚目、全#枚）","這件展品位在「近代教育與社會運動」展區。日本殖民者引進了近代教育，其主要目標是讓臺灣人成為「理想的日本國民」及殖民統治所需的基礎人力。但是近代教育同時啟發了臺灣人的自覺，也有不少臺灣人至島外接受教育，習得了近代議會政治民主等概念。這些新世代的知識份子不滿臺灣的殖民制度，透過政治與社會運動，取得臺灣民眾支持，形成新時代的抵抗行動，向殖民者爭取政治權利之外，也進行臺灣的社會文化改造運動。":"この展示品は「近代教育と社会運動」エリアにあります。日本の植民者は近代教育を導入しました。その主な目的は、台湾人を「理想的な日本国民」とし、植民地統治に必要な基礎的人材にすることでした。しかし近代教育は同時に台湾人の自覚も呼び覚まし、島外で教育を受け、議会政治や民主などの近代的な概念を身につけた人も少なくありませんでした。こうした新世代の知識人は台湾の植民地制度に不満を持ち、政治・社会運動を通じて台湾の人々の支持を得て、新しい時代の抵抗運動を形成し、植民者に政治的権利を求めるとともに、台湾の社会文化を改革する運動も進めました。","唱遊歌曲 的圖片":"唱歌遊戯の歌 の画像","唱遊歌曲（第 # 張，共 # 張）":"唱歌遊戯の歌（#枚目、全#枚）","臺灣文化協會會歌的原件，附在#年#月#日蔣渭水寫給林獻堂的文協創立大會邀請信裡。信中寫明，會歌平時用〈黃海戰〉曲調演唱，儀式時改用〈始政紀念歌〉曲調。":"台湾文化協会会歌の原本は、#年#月#日に蔣渭水が林献堂に宛てた、文協創立大会への招待状に添えられていました。手紙には、会歌は普段は〈黄海戦〉の曲で歌い、儀式では〈始政記念歌〉の曲に改めると記されています。","這件展品位在「現代風格起步走」展區。從都市、城鎮開始，#世紀前半的臺灣人，普遍感受到時代變革的步伐愈催愈緊，從視覺、聽覺、身體意識等感官，到社會結構、人際倫理觀念，都反映大不相同的新氣象，有人稱之為「文明」，有人戲稱為「毛斷」（modern臺語音譯）。自固有慣習裡游離而出的新一代臺灣人，憑著「和洋」（日本/西洋）混雜的技術與形式，展開創作與生活文化的改良，現代臺灣的面貌也隨之逐漸成形。":"この展示品は「モダンスタイルの始まり」エリアにあります。都市や町を皮切りに、#世紀前半の台湾の人々は、時代の変革の歩みがますます速まるのを広く感じていました。視覚、聴覚、身体感覚から、社会構造、人間関係の倫理観に至るまで、まったく異なる新しい気風が表れ、それを「文明」と呼ぶ人もいれば、「モーダン」（modernの台湾語の音訳）と戯れて呼ぶ人もいました。従来の慣習から抜け出した新世代の台湾人は、「和洋」（日本・西洋）が混ざった技術と形式で、創作や生活文化の改良を進め、現代台湾の姿も次第に形づくられていきました。","流行音樂的誕生 的圖片":"流行音楽の誕生 の画像","流行音樂的誕生（第 # 張，共 # 張）":"流行音楽の誕生（#枚目、全#枚）","這件展品位在「戰爭淹沒了社會：臺灣人的二次世界大戰」展區。#年代，總督府特別重視農漁村的經濟自立，推展部落振興運動，由上至下進行社區改造，推行社會教化，欲在鄉村建立一套新秩序。戰爭爆發後，社會教化體系便轉為支援戰爭的動員組織。臺灣人一方面過著緊縮的物質生活，另一方面還要面對皇民化運動的強大文化壓力，被鼓勵放棄自己原有的語言、姓名，甚至走向戰場、失去生命。":"この展示品は「戦争に呑み込まれた社会：台湾人の第二次世界大戦」エリアにあります。#年代、総督府は農漁村の経済的自立を特に重視し、部落振興運動を進め、上から下へ地域改造と社会教化を行って、農村に新しい秩序を築こうとしました。戦争が始まると、社会教化の体系は戦争支援の動員組織に変わりました。台湾の人々は、切り詰めた物質生活を送る一方で、皇民化運動の強い文化的圧力にも向き合い、自らの言語や姓名を捨てるよう促され、さらには戦場に赴いて命を落とすことさえありました。","終戰那一天 的圖片":"終戦のその日 の画像","終戰那一天（第 # 張，共 # 張）":"終戦のその日（#枚目、全#枚）","臺灣民主歌 的圖片":"台湾民主歌 の画像","臺灣民主歌（第 # 張，共 # 張）":"台湾民主歌（#枚目、全#枚）","展品 #・#F 走向民主這條路":"展示品 #・#階 民主主義への道のり","這件展品位在「反共復國基地」展區。#年韓戰爆發。以美國、蘇聯為首的資本主義、共產主義兩大國際陣營在東亞展開對抗，作為西太平洋「第一島鏈」關鍵位置的臺灣，由中國國民黨長期執政，成為中華民國「反共復國」的基地、「自由中國」的堡壘。隨著北京政府的外交拓展，中華民國的國際地位接連挫敗，#年退出聯合國、#年與美國斷交。然而，政府仍力主「三民主義統一中國」的政治口號，構成一黨獨大、以黨領政的威權體制。":"この展示品は「反共復国の基地」エリアにあります。#年に朝鮮戦争が勃発しました。アメリカとソ連を筆頭とする資本主義と共産主義の二大陣営が東アジアで対立し、西太平洋の「第一列島線」の要所にある台湾は、中国国民党が長期にわたり政権を握り、中華民国の「反共復国」の基地、「自由中国」の砦となりました。北京政府の外交拡大に伴い、中華民国の国際的地位は相次いで後退し、#年に国連を脱退、#年にアメリカと断交しました。しかし政府は「三民主義による中国統一」という政治スローガンを掲げ続け、一党独大・党が政を導く権威主義体制を築きました。","愛國歌曲與禁歌 的圖片":"愛国歌曲と禁歌 の画像","愛國歌曲與禁歌（第 # 張，共 # 張）":"愛国歌曲と禁歌（#枚目、全#枚）","這件展品位在「走向民主這條路」單元。#年後臺灣人熱烈參政，隨後卻受#事件的影響而噤聲；其後實施長達#年戒嚴。這條曲折的民主路，是不同意見折衝摩擦的過程，也是近兩、三代臺灣人相互看顧、多元對話的生命經驗。":"この展示品は「民主主義への道のり」ユニットにあります。#年以後、台湾の人々は熱心に政治に参加しましたが、その後#事件の影響で沈黙を余儀なくされ、続いて#年にわたる戒厳令が敷かれました。この曲がりくねった民主化の道は、異なる意見がぶつかり合う過程であり、ここ二、三世代の台湾の人々が互いに見守り合い、多様な対話を重ねてきた人生経験でもあります。","流離之音：歌曲裡的戰後原住民史 的圖片":"流浪の声：歌に見る戦後の先住民史 の画像","流離之音：歌曲裡的戰後原住民史（第 # 張，共 # 張）":"流浪の声：歌に見る戦後の先住民史（#枚目、全#枚）","展品 #・#F 最初的抵岸":"展示品 #・#階 最初の上陸","本作品發想自阿美族傳說：會發光的女孩迪雅瑪贊（Tiyamacan）被迷戀她的海神之子用海水帶走，之後化成雷聲、彩虹和各種生命。作品中的光代表迪雅瑪贊的初心，也象徵混沌大地裡蔓生而出的生命。":"この作品は、アミ族の伝説から着想を得ています。光り輝く少女ティヤマチャン（Tiyamacan）は、彼女に恋した海神の子に海水で連れ去られ、のちに雷鳴、虹、さまざまな生命に姿を変えました。作品の光はティヤマチャンの初心を表し、混沌とした大地に芽吹いた生命も象徴しています。","「生命的脈動」藝術品 的圖片":"「生命の鼓動」アート作品 の画像","「生命的脈動」藝術品（第 # 張，共 # 張）":"「生命の鼓動」アート作品（#枚目、全#枚）","英國愛丁堡 W. & A.K. Johnston 地圖出版商製作的絹本設色手繪大地圖，推定為#年的內容。圖上標了#個地名，其中#個是長老教會宣道站，反映#年代李庥、馬偕等人的宣教成果。":"イギリス・エディンバラの地図出版社W. & A.K. Johnstonが制作した、絹地に彩色した手描きの大地図で、#年の内容と推定されています。図上には#の地名が記され、そのうち#か所は長老教会の宣教所で、#年代にリース（李庥）やマッカイ（馬偕）らが挙げた宣教の成果を反映しています。","福爾摩沙島宣教地圖 的圖片":"フォルモサ島宣教地図 の画像","福爾摩沙島宣教地圖（第 # 張，共 # 張）":"フォルモサ島宣教地図（#枚目、全#枚）","嘉慶#年（#）建興庄公館發給排灣族望仔立社（今屏東來義鄉望嘉部落）頭人的賞籤，原住民持籤可領取銀#元、布匹等物資。籤上寫「循例」，可見這種做法已行之有年，是清代漢人與原住民 保存，直到#年才首次舉辦遺作展。":"陳澄波（#-#）は嘉義の画家で、#年に『嘉義の街外れ』が帝展に入選し、二二八事件で命を落としました。展示する遺品は、彼が使った革のトランク、帽子、絵筆、パレット、彫刻道具で、陳澄波文化基金会から寄贈されました。妻の張捷は絵画を天井裏に隠して守り、#年になって初めて遺作展が開かれました。","#・陳澄波遺物 的圖片":"#・陳澄波の遺品 の画像","#・陳澄波遺物（第 # 張，共 # 張）":"#・陳澄波の遺品（#枚目、全#枚）","「沒有人是局外人」彩繪石頭 的圖片":"「誰も部外者ではない」彩色石 の画像","「沒有人是局外人」彩繪石頭（第 # 張，共 # 張）":"「誰も部外者ではない」彩色石（#枚目、全#枚）","展品 #・#F 大家的博物館":"展示品 #・#階 みんなの博物館","歷史是不同的人站在各自位置、用自己的方式記錄當下，所累積出來的理解。這個展區收錄陸季盈、謝招治、陳崧波等人的個人紀錄，傳達「每個人都是寫歷史的人」。":"歴史とは、さまざまな人がそれぞれの立場で、自分なりの方法で今を記録し、積み重ねてできた理解です。このエリアには、陸季盈、謝招治、陳崧波らの個人的な記録が収められ、「誰もが歴史を書く人」というメッセージを伝えています。","「你也是寫歷史的人」文物 的圖片":"「あなたも歴史を書く人」の文物 の画像","「你也是寫歷史的人」文物（第 # 張，共 # 張）":"「あなたも歴史を書く人」の文物（#枚目、全#枚）","這件展品位在「倚海而生的島與人」單元。#世紀中期，臺灣逐漸成為東亞貿易的會合點與轉運點，東西方各大海權勢力在此競逐，臺灣的原住民社會開始面對一波波外來衝擊。":"この展示品は「海とともに生きる島と人々」ユニットにあります。#世紀半ば、台湾は次第に東アジア貿易の合流点・中継点となり、東西の海上勢力がここで競い合い、台湾の先住民社会は次々と外からの衝撃に直面し始めました。","手語導覽影片：鐵剪刀":"手話ガイド動画：鉄のはさみ","鐵剪刀 的圖片":"鉄のはさみ の画像","鐵剪刀（第 # 張，共 # 張）":"鉄のはさみ（#枚目、全#枚）","這件展品位在「商業市鎮」展區。清代臺灣西部港口大多是商業繁盛的市鎮，郊商、文市、洋行遞次發展。當貨物自中國沿海運至港口後，經由郊行統籌，再由批發商、零售商及挑販逐層經手，最後才到消費者手中。其中，府城（今臺南）、鹿港、艋舺（今臺北萬華）、大稻埕這四個由南至北的港口城市，各自代表了清代臺灣不同階段與類型的商業發展。":"この展示品は「商業都市」エリアにあります。清代の台湾西部の港は、多くが商業の栄えた町で、郊商、文市、洋行が次々に発展しました。貨物は中国沿岸から港へ運ばれると、郊行が取りまとめ、卸売商、小売商、行商人が順に取り扱い、最後に消費者の手に届きました。中でも府城（現在の台南）、鹿港、艋舺（現在の台北・万華）、大稲埕という南から北の四つの港湾都市は、それぞれ清代台湾の異なる段階と類型の商業の発展を表しています。","手語導覽影片：糖郊李勝興米駝":"手話ガイド動画：糖郊・李勝興の米駱駝","糖郊李勝興米駝 的圖片":"糖郊・李勝興の米駱駝 の画像","糖郊李勝興米駝（第 # 張，共 # 張）":"糖郊・李勝興の米駱駝（#枚目、全#枚）","手語導覽影片：豬頭骨與檳榔":"手話ガイド動画：豚の頭骨と檳榔","豬頭骨與檳榔 的圖片":"豚の頭骨と檳榔 の画像","豬頭骨與檳榔（第 # 張，共 # 張）":"豚の頭骨と檳榔（#枚目、全#枚）","這件展品位在「日本殖民體制的建立：行政、警察、教化」展區。日本的殖民統治，主要可分為行政、警察、教化三大系統。首先是以臺灣總督府為頂點的行政體系，往上接續帝國中央政府，往下伸展至地方街庄役場，以專業分工的官僚確保績效。其次是警察、保甲系統，負責維持治安、執行法令。第三是以小學校、公學校為中心的教化系統。日本殖民統治前期，熟悉原有社會運作的臺灣人民，不滿日本統治帶來的近代國家運作模式，而屢有武裝反抗事件，總督府也逐步摸索調整其統治策略，透過三大系統逐步掌控臺灣，也使原本處於各自分散的地方社會狀態，逐步邁向一體化。":"この展示品は「日本の植民地体制の確立：行政・警察・教化」エリアにあります。日本の植民地統治は、主に行政、警察、教化の三大システムに分けられます。まず、台湾総督府を頂点とする行政体系で、上は帝国の中央政府につながり、下は地方の街庄役場にまで及び、専門分業の官僚が成果を確保しました。次に、警察・保甲システムで、治安維持と法令の執行を担いました。三つ目は、小学校・公学校を中心とする教化システムです。日本統治の前期、従来の社会運営に慣れていた台湾の人々は、日本統治がもたらした近代国家の運営方式に不満を持ち、たびたび武装抵抗が起きました。総督府も次第に統治戦略を模索・調整し、三大システムを通じて台湾を徐々に掌握し、もともと分散していた地方社会を次第に一体化へと向かわせました。","手語導覽影片：南無警察大菩薩":"手話ガイド動画：南無警察大菩薩","南無警察大菩薩 的圖片":"南無警察大菩薩 の画像","南無警察大菩薩（第 # 張，共 # 張）":"南無警察大菩薩（#枚目、全#枚）","國民政府遷臺以來大力推動防空工作，「逃警報」和「防空演習」因此成為許多臺灣人的共同記憶，至今仍有軍民聯合防空演習。":"国民政府が台湾に移って以来、防空活動が強力に進められ、「空襲警報からの避難」と「防空演習」は多くの台湾人の共通の記憶となり、今でも軍民合同の防空演習が行われています。","手語導覽影片：警報器":"手話ガイド動画：警報器","警報器 的圖片":"警報器 の画像","警報器（第 # 張，共 # 張）":"警報器（#枚目、全#枚）","#到#年美援時期，美國援助臺灣麵粉等物資。純棉的麵粉袋（俗稱「卡動」）就成了民眾做內衣和家常服的布料，衣褲上常還印著中美合作標誌和製粉公司商標。":"#年から#年の米国援助の時期、アメリカは台湾に小麦粉などの物資を援助しました。綿100%の小麦粉袋（俗称「カードン」）は、人々の下着や普段着の生地となり、衣服にはよく中米合作のマークや製粉会社の商標が印刷されていました。","手語導覽影片：以麵粉袋做成的衣褲":"手話ガイド動画：小麦粉袋で作った衣服","以麵粉袋做成的衣褲 的圖片":"小麦粉袋で作った衣服 の画像","以麵粉袋做成的衣褲（第 # 張，共 # 張）":"小麦粉袋で作った衣服（#枚目、全#枚）","歡迎來到國立臺灣歷史博物館。先花三分鐘，認識一下這裡怎麼逛。":"国立台湾歴史博物館へようこそ。まず3分かけて、館内の回り方を確認しましょう。","你會從 # 號門進入展示教育大樓的 #F 大廳。服務臺在大廳右側，可以在這裡詢問、免費借輪椅，或報名需要現場登記的活動。":"#番出入口から展示教育棟の#階ロビーに入ります。インフォメーションはロビーの右側にあり、ご質問、車いすの無料貸出、現地登録が必要なイベントの申込ができます。","#F 有兒童廳，適合帶小朋友動手玩、慢慢看；時光車站有火車劇場，圓形劇場則輪播影片，各自有固定場次，可以先看「本日活動」的時間。":"#階には子どもホールがあり、お子様が手を動かして遊んだり、ゆっくり見たりするのに向いています。時光ステーションには汽車シアターがあり、円形シアターでは映像を上映しています。それぞれ開催回が決まっているので、まず「本日のイベント」の時間をご確認ください。","搭手扶梯、樓梯或電梯到 #F，就是常設展「斯土斯民：臺灣的故事」。常設展分成七個單元，從史前時代一路講到當代，展出上千件文物。展區是開放式的，不用照順序走，可以挑有興趣的單元先看。":"エスカレーター、階段、エレベーターで#階へ上がると、常設展「斯土斯民：台湾の物語」です。常設展は七つのユニットに分かれ、先史時代から現代まで、千点以上の文物を展示しています。展示エリアは開放的で、順番どおりに進む必要はなく、興味のあるユニットから見られます。","二樓挑高直通四樓，所以館內沒有三樓。搭電梯到 #F，是特展室和 VR 再現製造所。特展每隔一段時間就會更換，出電梯後跟著指標就能找到展廳；VR 體驗要現場報名，名額有限。":"2階は吹き抜けで4階まで通じているため、館内に3階はありません。エレベーターで#階へ上がると、特別展示室とVR再現製造所があります。特別展は一定期間ごとに入れ替わり、エレベーターを出たら案内表示に従って展示室へ行けます。VR体験は現地での申込が必要で、定員があります。","館外是臺灣歷史公園，每天 #:# 到 #:# 免費開放，參觀前後可以到湖畔走走。":"館外は台湾歴史公園で、毎日#:#から#:#まで無料で開放されています。見学の前後に湖畔を散策できます。","展示教育大樓開放時間是 #:# 到 #:#，#:# 最後入場，每週一休館。館內只有一間咖啡廳，也沒有提款機，現金請先準備好。":"展示教育棟の開館時間は#:#から#:#まで、最終入場は#:#、毎週月曜は休館です。館内にはカフェが1軒だけで、ATMもありませんので、現金は事前にご用意ください。","離館時請走 #F 大廳左側的 # 號門，# 號門只能進、不能出。祝你參觀愉快。":"退館の際は、#階ロビー左側の#番出入口をご利用ください。#番出入口は入るだけで、出ることはできません。どうぞ楽しい見学を。","#F 入口大廳":"#階 エントランスロビー","場館概覽：臺史博  목록","地圖":"지도","陪伴我們的臺灣島嶼，一起穿越數百年的記憶流轉吧！在這裡，你會從神秘的起源傳說開始，跟著這塊土地，一次次歷經時代的更迭與鉅變，看見大歷史之下人群的樣貌、聲音與故事。展覽以「時代」作為單元，分為「臺灣，交會之島」、「最初的抵岸」、「倚海而生的島與人」、「山海之間的共存與競逐」、「新秩序下的苦悶與夢想」、「走向民主這條路」、「大家的博物館」# 大單元；從史前到當代，相異的時空情境中，是否喚起你似曾相似的共鳴？":"함께해 온 대만 섬과 함께 수백 년의 기억이 흐르는 시간을 건너 보세요! 이곳에서 신비한 기원 전설에서 시작해 이 땅이 시대의 교체와 격변을 거듭 겪어 온 모습을 따라가며, 큰 역사 속 사람들의 모습과 목소리, 이야기를 만나게 됩니다. 전시는 '시대'를 단원으로 삼아 '대만, 만남의 섬', '최초의 상륙', '바다에 기대어 사는 섬과 사람들', '산과 바다 사이의 공존과 경쟁', '새로운 질서 아래의 고뇌와 꿈', '민주주의로 가는 길', '모두의 박물관'의 #개 큰 단원으로 나뉩니다. 선사 시대부터 현대까지, 서로 다른 시공간 속에서 어디선가 본 듯한 공감이 떠오르시나요?","展品 #":"전시품 #","原住民族的語言與名字":"원주민족의 언어와 이름","維護中":"점검 중","展品 #・":"전시품 #・","手語影片・附字幕":"수어 영상・자막 포함","媽祖是臺灣最具代表性的民間信仰之一。本次展覽透過館藏、國內外機構典藏，以及臺灣各地媽祖廟所傳承的重要文物，探討媽祖神蹟如何被詮釋，並展現出媽祖的多元面貌。":"마조는 대만에서 가장 대표적인 민간 신앙 중 하나입니다. 이번 전시는 박물관 소장품과 국내외 기관 소장품, 대만 각지 마조 사당에 전해 내려오는 중요한 문물을 통해 마조의 영험이 어떻게 해석되어 왔는지 살피고 마조의 다양한 모습을 보여 줍니다.","單元一｜海濱神姑：海口女巫的天后之路":"단원 1｜해변의 신고: 항구 무녀의 천후로 가는 길","單元二｜海上福星：媽祖信仰傳播的航跡":"단원 2｜바다의 복성: 마조 신앙이 전파된 항적","單元三｜盛裝駕到：千變萬化的臺灣天后":"단원 3｜성장 행차: 천변만화하는 대만 천후","單元四｜萬年香火：當靈力鑄化為聖物":"단원 4｜만년 향불: 영력이 성물로 거듭날 때","單元五｜善願必佑：在當代與媽祖相遇":"단원 5｜선한 서원은 반드시 보우하리: 오늘날 마조를 만나다","「非公民」是指有人沒有任何國家承認其國籍；也有人雖擁有國籍，卻因政治、戰亂與制度等因素，無法獲得原國家的保護。本特展透過主展場與走廊延伸展區，串聯這段歷史，並述說來到臺灣的不同群體的故事。":"'비시민'은 어떤 국가에서도 국적을 인정받지 못하는 사람, 또는 국적이 있어도 정치, 전란, 제도 등의 이유로 본국의 보호를 받지 못하는 사람을 가리킵니다. 이 특별전은 주 전시장과 복도 연장 전시 구역을 통해 이 역사를 잇고, 대만에 온 여러 집단의 이야기를 전합니다.","零、非關公民歷史教室":"0. 비시민 역사 교실","一、時代浪潮下的移動：跨越邊界的生命印記":"1. 시대의 물결 속 이동: 경계를 넘은 삶의 흔적","二、看不見的邊界":"2. 보이지 않는 경계","三、At Home":"3. At Home","四、邊界上的未盡旅程":"4. 경계 위의 끝나지 않은 여정","路線進度 #／# 站":"코스 진행 #／#곳","下一站：臺灣文化協會會歌":"다음 지점: 대만문화협회 회가","路線地圖":"코스 지도","聲音，演譯了誰的心情？傳遞著哪些故事？歷史上的歌謠、唸詞、流行歌，穿越數百年的聲音，用歌詞與曲調留下了特殊歷史情境的當下痕跡，呼喚您來傾聽。":"소리는 누구의 마음을 표현했을까요? 어떤 이야기를 전하고 있을까요? 역사 속 노래, 구음, 유행가는 수백 년을 건너온 소리로, 가사와 곡조에 특별한 역사적 상황의 순간적 흔적을 남겼습니다. 귀 기울여 들어 보세요.","查看路線站點":"코스 지점 보기","路線進度":"코스 진행","路線站點":"코스 지점","# 站":"#곳","地名記憶了相遇故事":"지명이 기억한 만남의 이야기","文字":"텍스트","部落傳唱的荷蘭歌":"부락에서 전해 부르는 네덜란드 노래","語音":"음성","唐山過臺灣唸謠":"당산이 대만을 건너다 구음","淺井惠倫採集平埔歌曲":"아사이 에린이 채집한 평포족 노래","林業勞動歌":"임업 노동요","馬蘭阿美群的歌謠":"마란 아미족의 노래","唱遊歌曲":"율동 창가","臺灣文化協會會歌":"대만문화협회 회가","流行音樂的誕生":"대중음악의 탄생","終戰那一天":"종전의 그날","臺灣民主歌":"대만 민주가","愛國歌曲與禁歌":"애국가요와 금지곡","流離之音：歌曲裡的戰後原住民史":"유랑의 소리: 노래 속 전후 원주민 역사","收起路線站點":"코스 지점 접기","下一站：向漢人領取物資的木籤憑證":"다음 지점: 한인에게 물자를 받기 위한 나무 표찰","博物館研究員私心推薦的經典藏品，這些物件背後，或是反映獨特的歷史記憶、人物真切的生命經歷，或是在地視角的投射，也有可能隱藏著歷史研究控的物質密碼？等你一起來解讀！":"박물관 연구원이 개인적으로 추천하는 대표 소장품입니다. 이 물건들 뒤에는 독특한 역사적 기억이나 인물의 생생한 삶의 경험, 현지의 시각이 담겨 있을 수도 있고, 역사 연구 마니아만 알아볼 물질 속 암호가 숨어 있을지도 모릅니다. 함께 풀어 보세요!","「生命的脈動」藝術品":"'생명의 맥동' 예술품","福爾摩沙島宣教地圖":"포르모사 섬 선교 지도","向漢人領取物資的木籤憑證":"한인에게 물자를 받기 위한 나무 표찰","林朝英水墨自畫像":"린차오잉 수묵 자화상","北路屯千總潘踏比厘六品武官補服":"북로둔 천총 판타비리 육품 무관 보복","七腳川後代復振之大羽冠帽飾":"치자촨 후손이 되살린 큰 깃털 관모 장식","排灣族女子銀幣飾品長衣":"파이완족 여성 은화 장식 긴 옷","臺灣一周紀念旅行手札":"대만 일주 기념 여행 수첩","蔣渭水致林獻堂書信":"장웨이수이가 린셴탕에게 보낸 서신","「人們記憶中的戰爭」文物":"'사람들이 기억하는 전쟁' 문물","一場戰爭，各自記憶":"하나의 전쟁, 저마다의 기억","#・陳澄波遺物":"#・천청포 유품","「沒有人是局外人」彩繪石頭":"'아무도 방관자가 아니다' 채색 돌","「你也是寫歷史的人」文物":"'당신도 역사를 쓰는 사람' 문물","下一站：糖郊李勝興米駝":"다음 지점: 탕자오 리성싱 쌀 운반구","伸出手一起來「觸摸」臺灣史吧！#大觸摸展件與點字展臺，不僅是量身為視覺不便的夥伴打造的路線，建立更多元友善的觀展方式，也讓我們可以用不同的感官，體驗、觸碰不同面向的臺灣歷史。":"손을 뻗어 함께 대만사를 '만져' 봐요! #개의 대형 촉각 전시물과 점자 전시대는 시각이 불편한 분들을 위해 만든 코스일 뿐 아니라, 더 다양하고 친근한 관람 방식을 만들고 서로 다른 감각으로 대만 역사의 여러 면을 체험하고 만져 볼 수 있게 합니다.","鐵剪刀":"쇠가위","糖郊李勝興米駝":"탕자오 리성싱 쌀 운반구","豬頭骨與檳榔":"돼지 머리뼈와 빈랑","南無警察大菩薩":"나무 경찰 대보살","警報器":"경보기","以麵粉袋做成的衣褲":"밀가루 포대로 만든 옷","導覽":"가이드","展品介紹":"전시품 소개","導覽語言・目前語音導覽・中文":"가이드 언어・현재 오디오 가이드・중국어","中文":"중국어","台語":"대만어","客語":"하카어","手語・附字幕":"수어・자막 포함","請戴耳機收聽":"이어폰을 착용해 주세요","# 世紀中期，臺灣逐漸成為東亞貿易的會合點與轉運點，東西方各大海權勢力在此競逐，臺灣的原住民社會開始面對一波波外來衝擊。首先是中國及日本的私商、海盜，以臺灣為會合貿易的地點。進入 # 世紀以後，又加入了來自歐洲的荷蘭人與西班牙人。":"# 세기 중반, 대만은 점차 동아시아 무역의 접점이자 환적지가 되었고, 동서양 해양 세력이 이곳에서 경쟁하며 대만 원주민 사회는 거듭되는 외부 충격에 직면하기 시작했습니다. 먼저 중국과 일본의 민간 상인과 해적이 대만을 무역 거점으로 삼았고, # 세기에 들어서는 유럽의 네덜란드인과 스페인인이 더해졌습니다.","東西方文化在此交會，使臺灣成為東亞歷史舞臺上的要角。當你站在這面航海圖前，不妨先找找臺灣的位置——在當時的世界地圖上，它還沒有固定的形狀，卻已經是各方勢力都想標記的座標。":"동서양 문화가 이곳에서 만나 대만은 동아시아 역사 무대의 주요 인물이 되었습니다. 이 항해도 앞에 서면 먼저 대만의 위치를 찾아보세요. 당시 세계 지도에서 대만은 아직 고정된 모양이 없었지만, 이미 각 세력이 표시하고 싶어 하는 좌표였습니다.","同展區其他導覽點":"같은 전시 구역의 다른 가이드 지점","#F 常設展廳・# 個":"#F 상설전시실・#개","展品 #・語音・#:#":"전시품 #・음성・#:#","展品 #・手語・#:#":"전시품 #・수어・#:#","展品 #・#F 常設展廳":"전시품 #・#F 상설전시실","十七世紀前後，臺灣位於東亞海域的交會處。往來的商船、漁民與移住者在此靠岸，帶來稻米、鐵器、瓷器與信仰，也把鹿皮、砂糖與樟腦運往遠方。":"17세기 전후, 대만은 동아시아 해역의 교차점에 위치했습니다. 오가는 상선과 어민, 이주민이 이곳에 닿아 쌀, 철기, 도자기와 신앙을 들여왔고, 사슴 가죽, 설탕, 장뇌를 먼 곳으로 실어 보냈습니다.","這一區以船、港與貨物為線索，重現當時人們如何倚海而生：從原住民族的漁獵與交易，到漢人移民的定居，再到荷蘭、西班牙與日本商人在此地的競逐。":"이 구역은 배, 항구, 화물을 실마리로 당시 사람들이 바다에 기대어 살던 모습을 재현합니다. 원주민족의 어로와 교역, 한인 이민자의 정착, 그리고 네덜란드・스페인・일본 상인이 이곳에서 벌인 경쟁까지 이어집니다.","展櫃中的貿易瓷片與航海圖複製件，是這段往來留下的痕跡。仔細看圖上的臺灣，形狀還沒有固定，說明當時的人對這座島的認識，正隨著一次次航行慢慢累積。":"전시 케이스 속 무역 도자기 조각과 항해도 복제품은 이 왕래가 남긴 흔적입니다. 지도 속 대만을 자세히 보면 모양이 아직 고정되지 않았는데, 당시 사람들이 이 섬을 이해하는 정도가 항해를 거듭하며 조금씩 쌓여 갔음을 보여 줍니다.","延伸探索":"더 알아보기","同主題":"같은 주제","熱蘭遮城與東亞貿易":"젤란디아 성과 동아시아 무역","同展區":"같은 전시 구역","#F 山海之間的共存與競逐":"#F 산과 바다 사이의 공존과 경쟁","同時代":"같은 시대","十七世紀的臺灣住民":"17세기의 대만 주민","上一則":"이전","這是第一則":"첫 번째 가이드입니다","下一則":"다음","收合播放器":"플레이어 접기","調整文字大小":"글자 크기 조절","收藏":"즐겨찾기","播放器分頁":"플레이어 탭","導覽語言，目前語音導覽・中文":"가이드 언어, 현재 오디오 가이드・중국어","知道了，關閉提醒":"알겠어요, 알림 닫기","臺灣，交會之島 的圖片":"대만, 만남의 섬 이미지","臺灣，交會之島（第 # 張，共 # 張）":"대만, 만남의 섬（#/#번째 이미지）","全螢幕檢視圖片":"이미지 전체 화면으로 보기","第 # 張":"#번째 이미지","在地圖上看位置":"지도에서 위치 보기","導覽列表":"가이드 목록","播放進度":"재생 진행률","從頭播放":"처음부터 재생","後退 # 秒":"#초 뒤로","前進 # 秒":"#초 앞으로","播放速度 # 倍":"재생 속도 #배","展覽導覽":"전시 가이드","已聽 #／# 則":"#／#개 들음","#・播放中・語音・#:#":"#・재생 중・음성・#:#","#・已聽完・語音・#:#":"#・청취 완료・음성・#:#","#・語音・#:#":"#・음성・#:#","#・語音・#:#・維護中":"#・음성・#:#・점검 중","播放速度":"재생 속도","較慢":"느리게","稍快":"약간 빠르게","快速":"빠르게","最初的抵岸 的圖片":"최초의 상륙 이미지","最初的抵岸（第 # 張，共 # 張）":"최초의 상륙（#/#번째 이미지）","倚海而生的島與人 的圖片":"바다에 기대어 사는 섬과 사람들 이미지","倚海而生的島與人（第 # 張，共 # 張）":"바다에 기대어 사는 섬과 사람들（#/#번째 이미지）","山海之間的共存與競逐 的圖片":"산과 바다 사이의 공존과 경쟁 이미지","山海之間的共存與競逐（第 # 張，共 # 張）":"산과 바다 사이의 공존과 경쟁（#/#번째 이미지）","手語（本則未提供）":"수어(이 가이드에는 없음)","文物維護中":"문물 점검 중","部分文物送修維護中，展櫃暫時以複製品展出":"일부 문물이 수리・보존 처리 중이라 전시 케이스에 임시로 복제품을 전시하고 있습니다","新秩序下的苦悶與夢想 的圖片":"새로운 질서 아래의 고뇌와 꿈 이미지","新秩序下的苦悶與夢想（第 # 張，共 # 張）":"새로운 질서 아래의 고뇌와 꿈（#/#번째 이미지）","#・播放中・語音・#:#・維護中":"#・재생 중・음성・#:#・점검 중","已經是最後一則":"마지막 가이드입니다","走向民主這條路 的圖片":"민주주의로 가는 길 이미지","走向民主這條路（第 # 張，共 # 張）":"민주주의로 가는 길（#/#번째 이미지）","#・已聽完・語音・#:#・維護中":"#・청취 완료・음성・#:#・점검 중","#F 第一特展室・# 個":"#F 제1특별전시실・#개","展品 #・#F 第一特展室":"전시품 #・#F 제1특별전시실","媽祖原為只知其姓的巫女林氏，經由歷代對媽祖顯聖事蹟的層累，形塑出神通廣大的女聖人樣貌，可看見媽祖在政治與宗教力量塑造下，成為護國救民的英烈天妃。本單元透過#至#世紀的圖像與經典文獻，看見媽祖的形象在官方與民間的共同詮釋下，逐步確立為天后林默的過程。":"마조는 본래 성만 알려진 무녀 린 씨였으나, 역대에 걸쳐 영험 사적이 쌓이면서 신통력이 큰 여성 성인의 모습으로 빚어졌습니다. 정치와 종교의 힘 속에서 마조가 나라를 지키고 백성을 구하는 열렬한 천비가 된 과정을 볼 수 있습니다. 이 단원은 #세기부터 #세기까지의 도상과 경전 문헌을 통해, 관과 민간의 공동 해석 아래 마조의 이미지가 천후 린모로 차츰 자리 잡아 간 과정을 살펴봅니다.","單元一｜海濱神姑：海口女巫的天后之路 的圖片":"단원 1｜해변의 신고: 항구 무녀의 천후로 가는 길 이미지","單元一｜海濱神姑：海口女巫的天后之路（第 # 張，共 # 張）":"단원 1｜해변의 신고: 항구 무녀의 천후로 가는 길（#/#번째 이미지）","媽祖的海上神蹟，深受閩、粵兩地崇奉。明代以來，隨著頻繁的海上活動，媽祖信仰從中國東南沿海出發，沿著貿易路徑向東亞諸國延伸。船員與移民隨身攜帶的神像與聖物，使媽祖香火得以越過汪洋，在異鄉落地生根；延伸至臺灣後，又向外輻射至世界各地。":"마조의 바다 위 영험은 푸젠과 광둥 두 지역에서 깊이 숭배받았습니다. 명대 이래 해상 활동이 잦아지면서 마조 신앙은 중국 동남 연안에서 출발해 무역로를 따라 동아시아 여러 나라로 퍼졌습니다. 선원과 이민자가 지니고 간 신상과 성물 덕분에 마조의 향불은 바다를 건너 타향에 뿌리내렸고, 대만에 이른 뒤에는 다시 세계 각지로 뻗어 나갔습니다.","單元二｜海上福星：媽祖信仰傳播的航跡 的圖片":"단원 2｜바다의 복성: 마조 신앙이 전파된 항적 이미지","單元二｜海上福星：媽祖信仰傳播的航跡（第 # 張，共 # 張）":"단원 2｜바다의 복성: 마조 신앙이 전파된 항적（#/#번째 이미지）","媽祖信仰深入臺灣後，因地域與族群的差異，被賦予不同的稱呼與形象：是榮及雙親的孝女，是慈愛赤子的媽婆；能以施藥救疫，也在戰火之中顯聖。除了多樣性的神像外，冠服、神輿與時尚精品，也形塑出不同時代的媽祖樣貌。":"마조 신앙이 대만에 깊이 들어온 뒤, 지역과 민족의 차이에 따라 서로 다른 호칭과 이미지를 얻었습니다. 부모에게 영광을 안긴 효녀이기도, 자애로운 아기 어머니이기도 했고, 약을 베풀어 역병을 구하기도, 전화 속에서 영험을 나타내기도 했습니다. 다양한 신상 외에도 관복, 가마, 패션 소품이 시대마다 다른 마조의 모습을 빚었습니다.","單元三｜盛裝駕到：千變萬化的臺灣天后 的圖片":"단원 3｜성장 행차: 천변만화하는 대만 천후 이미지","單元三｜盛裝駕到：千變萬化的臺灣天后（第 # 張，共 # 張）":"단원 3｜성장 행차: 천변만화하는 대만 천후（#/#번째 이미지）","無形的靈力，憑附於有形的物件，亦降於大符與各類聖物；承受香火的香爐與運載神火的香擔，是最關鍵的靈力載體。進香、遶境與過爐，是親近媽祖的神聖時刻，也是廟與廟、人與人之間交通互動的時刻，將世代的信仰記憶傳承下去。":"보이지 않는 영력은 눈에 보이는 물건에 깃들고, 큰 부적과 각종 성물에도 내립니다. 향불을 받는 향로와 신의 불을 나르는 향 멜대가 가장 핵심적인 영력의 매개체입니다. 향 올리기 순례, 순행, 향로 건너기는 마조와 가까워지는 신성한 순간이자 사당과 사당, 사람과 사람이 교류하는 순간으로, 세대의 신앙 기억을 이어 갑니다.","單元四｜萬年香火：當靈力鑄化為聖物 的圖片":"단원 4｜만년 향불: 영력이 성물로 거듭날 때 이미지","單元四｜萬年香火：當靈力鑄化為聖物（第 # 張，共 # 張）":"단원 4｜만년 향불: 영력이 성물로 거듭날 때（#/#번째 이미지）","隨時代更迭與社會結構變化，天后以各類形式顯聖與再現。數位科技改變了信仰傳播途徑，媽祖信仰以媒體直播與影像跨越地域限制；素昧平生的人們也因「結緣品」而聚合，比肩同行，使媽祖信仰得以歷久彌新。":"시대 변화와 사회 구조의 변화에 따라 천후는 여러 형태로 영험을 나타내고 다시 나타납니다. 디지털 기술이 신앙 전파 경로를 바꾸어, 마조 신앙은 미디어 생중계와 영상으로 지역의 한계를 뛰어넘습니다. 서로 모르던 사람들도 '인연 나눔 물품'으로 모여 어깨를 나란히 걸으며 마조 신앙이 오래도록 새로울 수 있게 합니다.","單元五｜善願必佑：在當代與媽祖相遇 的圖片":"단원 5｜선한 서원은 반드시 보우하리: 오늘날 마조를 만나다 이미지","單元五｜善願必佑：在當代與媽祖相遇（第 # 張，共 # 張）":"단원 5｜선한 서원은 반드시 보우하리: 오늘날 마조를 만나다（#/#번째 이미지）","導覽語言・目前手語導覽・中文字幕":"가이드 언어・현재 수어 가이드・중국어 자막","導覽語言，目前手語導覽・中文字幕":"가이드 언어, 현재 수어 가이드・중국어 자막","手語導覽影片：原住民族的語言與名字":"수어 가이드 영상: 원주민족의 언어와 이름","手語導覽影片":"수어 가이드 영상","原住民族的語言與名字 的圖片":"원주민족의 언어와 이름 이미지","原住民族的語言與名字（第 # 張，共 # 張）":"원주민족의 언어와 이름（#/#번째 이미지）","臺灣文化協會會歌 的圖片":"대만문화협회 회가 이미지","臺灣文化協會會歌（第 # 張，共 # 張）":"대만문화협회 회가（#/#번째 이미지）","展品 #・#F 走廊延伸展區":"전시품 #・#F 복도 연장 전시 구역","當邊界被劃下時，我們如何看見真正的彼此？從過去到現在，不同時代都存在著被排除在主流社會及國家制度之外的人——他們可能沒有戶籍、沒有國籍，始終游移在法律與現實的邊界。本區從更長遠的歷史脈絡出發，回看「非公民」如何被界定與形成。":"경계가 그어질 때 우리는 어떻게 서로의 진짜 모습을 볼 수 있을까요? 과거부터 지금까지 어느 시대에나 주류 사회와 국가 제도 밖으로 배제된 사람들이 있었습니다. 호적도 국적도 없이 법과 현실의 경계를 떠돌았을지 모릅니다. 이 구역은 더 긴 역사적 맥락에서 출발해 '비시민'이 어떻게 규정되고 형성되었는지 돌아봅니다.","零、非關公民歷史教室 的圖片":"0. 비시민 역사 교실 이미지","零、非關公民歷史教室（第 # 張，共 # 張）":"0. 비시민 역사 교실（#/#번째 이미지）","#F 第三特展室・# 個":"#F 제3특별전시실・#개","展品 #・#F 第三特展室":"전시품 #・#F 제3특별전시실","「當動盪席捲世界，人們帶來的只是行李嗎？」臺灣的歷史與世界局勢緊密相連。來自圖伯特、緬甸、香港與烏克蘭的人們，因冷戰、政變、戰爭與迫害，陸續跨越邊界來到這裡；他們的移動不只是個人選擇，而是為了守護生命、自由、信仰與未來。":"'격동이 세상을 휩쓸 때, 사람들이 가져온 것은 짐뿐일까요?' 대만의 역사는 세계 정세와 긴밀히 이어져 있습니다. 티베트, 미얀마, 홍콩, 우크라이나에서 온 사람들은 냉전, 쿠데타, 전쟁, 박해로 인해 잇따라 경계를 넘어 이곳에 왔습니다. 이들의 이동은 개인의 선택만이 아니라 생명, 자유, 신앙, 미래를 지키기 위한 것이었습니다.","一、時代浪潮下的移動：跨越邊界的生命印記 的圖片":"1. 시대의 물결 속 이동: 경계를 넘은 삶의 흔적 이미지","一、時代浪潮下的移動：跨越邊界的生命印記（第 # 張，共 # 張）":"1. 시대의 물결 속 이동: 경계를 넘은 삶의 흔적（#/#번째 이미지）","「跨過了邊界，邊界就消失了嗎？」「身分」的邊界，從來不是固定的，它會隨著法律制度、國際局勢與國家安全考量而被重新劃定。對許多來到臺灣的人而言，邊界不只存在於海關，也延伸到入境後的停留、居留或定居審查。":"'경계를 넘으면 경계는 사라질까요?' '신분'의 경계는 결코 고정된 적이 없으며, 법 제도, 국제 정세, 국가 안보 고려에 따라 다시 그어집니다. 대만에 온 많은 사람에게 경계는 세관에만 있지 않고, 입국 후 체류, 거주 또는 정착 심사로도 이어집니다.","二、看不見的邊界 的圖片":"2. 보이지 않는 경계 이미지","二、看不見的邊界（第 # 張，共 # 張）":"2. 보이지 않는 경계（#/#번째 이미지）","「『家』，對你來說是什麼？」對有些人而言，「家」是正在經歷戰火的地方；對流亡者而言，是宗教、文化與身分認同的延續；對離開香港的人而言，那個地方還在，卻已不同。來自不同地方的人們，帶著各自對「家」的記憶與牽掛來到臺灣。":"'당신에게 집은 무엇인가요?' 어떤 이에게 '집'은 전화를 겪고 있는 곳이고, 망명자에게는 종교, 문화, 정체성의 연속이며, 홍콩을 떠난 사람에게는 그곳이 아직 있지만 이미 달라진 곳입니다. 서로 다른 곳에서 온 사람들이 각자의 '집'에 대한 기억과 그리움을 안고 대만에 왔습니다.","三、At Home 的圖片":"3. At Home 이미지","三、At Home（第 # 張，共 # 張）":"3. At Home（#/#번째 이미지）","「當全球的流離與遷徙來到臺灣，我們將讓邊界變窄，還是讓關係展開？」我們看見人們在動盪中離開家園，看見人的身分如何在穿越邊界後被重新定義，也看見許多人在不安的處境中，仍努力在這裡生活、行動並照顧彼此。":"'전 세계의 유랑과 이주가 대만에 닿을 때, 우리는 경계를 좁힐까요, 관계를 펼칠까요?' 사람들이 격동 속에서 고향을 떠나고, 경계를 넘은 뒤 신분이 다시 정의되는 모습을 보았고, 불안한 처지 속에서도 이곳에서 살아가며 행동하고 서로를 돌보려 애쓰는 많은 이들도 보았습니다.","四、邊界上的未盡旅程 的圖片":"4. 경계 위의 끝나지 않은 여정 이미지","四、邊界上的未盡旅程（第 # 張，共 # 張）":"4. 경계 위의 끝나지 않은 여정（#/#번째 이미지）","展品 #・#F 臺灣，交會之島":"전시품 #・#F 대만, 만남의 섬","這件展品位在「臺灣，交會之島」單元。臺灣，要從「交會」開始說起。這是一段不同人群，碰撞、摸索，共有同一塊土地的故事。本單元也有母語地名故事的線上展覽。":"이 전시품은 '대만, 만남의 섬' 단원에 있습니다. 대만은 '만남'에서부터 이야기해야 합니다. 서로 다른 사람들이 부딪히고 더듬으며 같은 땅을 함께 나눈 이야기입니다. 이 단원에는 모국어 지명 이야기를 담은 온라인 전시도 있습니다.","地名記憶了相遇故事 的圖片":"지명이 기억한 만남의 이야기 이미지","地名記憶了相遇故事（第 # 張，共 # 張）":"지명이 기억한 만남의 이야기（#/#번째 이미지）","展品 #・#F 倚海而生的島與人":"전시품 #・#F 바다에 기대어 사는 섬과 사람들","這件展品位在「身陷角力戰的原住民」展區。在這段期間，隨著漢人、日本人、荷蘭人、西班牙人相繼到來，原本保持相對穩定狀態的臺灣原住民族社會受到一定程度的攪動。面對外來者，原住民各部落會主動選擇有利於部落的同盟對象，也會與敵對的勢力產生衝突。不同族群之間各有盤算，有時彼此交惡，有時維持著不穩定的聯盟關係。而外來團體間彼此也有糾葛衝突。":"이 전시품은 '세력 다툼에 휘말린 원주민' 전시 구역에 있습니다. 이 기간에 한인, 일본인, 네덜란드인, 스페인인이 차례로 오면서 비교적 안정적이던 대만 원주민족 사회는 어느 정도 흔들렸습니다. 외래 세력을 마주한 원주민 각 부락은 부락에 유리한 동맹 상대를 스스로 택하기도 했고, 적대 세력과 충돌하기도 했습니다. 민족마다 각자의 셈법이 있어 때로는 서로 반목했고, 때로는 불안정한 동맹을 유지했습니다. 외래 집단끼리도 서로 얽혀 충돌했습니다.","部落傳唱的荷蘭歌 的圖片":"부락에서 전해 부르는 네덜란드 노래 이미지","部落傳唱的荷蘭歌（第 # 張，共 # 張）":"부락에서 전해 부르는 네덜란드 노래（#/#번째 이미지）","展品 #・#F 山海之間的共存與競逐":"전시품 #・#F 산과 바다 사이의 공존과 경쟁","這件展品位在「山海之間的共存與競逐」單元。#年臺灣被清朝併入版圖，大量漢人移民持續渡海前來，在平原、丘陵、沿山發展出各自的村落、產業及生活方式；在這片山與海之間的土地上，不同人群相互共存，也彼此競逐。":"이 전시품은 '산과 바다 사이의 공존과 경쟁' 단원에 있습니다. #년 대만이 청나라 영토에 편입된 뒤 많은 한인 이민자가 계속 바다를 건너와 평원, 구릉, 산기슭에 각자의 마을, 산업, 생활 방식을 일구었습니다. 산과 바다 사이의 이 땅에서 서로 다른 사람들은 함께 살았고, 또한 서로 경쟁했습니다.","唐山過臺灣唸謠 的圖片":"당산이 대만을 건너다 구음 이미지","唐山過臺灣唸謠（第 # 張，共 # 張）":"당산이 대만을 건너다 구음（#/#번째 이미지）","展品 #・#F 新秩序下的苦悶與夢想":"전시품 #・#F 새로운 질서 아래의 고뇌와 꿈","這件展品位在「平埔原住民的人生故事」展區。不同地方的平埔社群，原本有自己的生活文化與網絡，再加上與漢人社會、清朝官府、歐美傳教士等不同人群的接觸，每個部落的際遇與發展都不盡相同。有的人與官府關係密切，身上冠有軍功、職銜；有的人則是收取地租的「番頭家」，或是跟漢人一樣投資經商；但也有更多人因為難以在原鄉過活，遠徙他處。從這些原住民社群人們的人生故事可以看到：在不同時代與際遇下，這塊土地上的人們，各自採用什麼樣的策略來生存發展。":"이 전시품은 '평포 원주민의 인생 이야기' 전시 구역에 있습니다. 각지의 평포 공동체는 원래 자신들의 생활문화와 네트워크가 있었는데, 한인 사회, 청나라 관부, 서양 선교사 등 서로 다른 사람들과 접촉하면서 부락마다 처지와 발전이 달랐습니다. 어떤 이는 관부와 가까워 군공과 관직을 얻었고, 어떤 이는 지대를 받는 '번두가'가 되거나 한인처럼 투자해 장사를 했습니다. 그러나 고향에서 살아가기 어려워 먼 곳으로 떠난 사람이 더 많았습니다. 이들 원주민 공동체 사람들의 인생 이야기에서, 시대와 처지가 달라도 이 땅의 사람들이 각자 어떤 전략으로 살아남고 발전했는지 볼 수 있습니다.","淺井惠倫採集平埔歌曲 的圖片":"아사이 에린이 채집한 평포족 노래 이미지","淺井惠倫採集平埔歌曲（第 # 張，共 # 張）":"아사이 에린이 채집한 평포족 노래（#/#번째 이미지）","這件展品位在「新時代，新產業」展區。日本時代初期將臺灣當作熱帶經濟作物和糧食的生產地，有系統地開發臺灣各項農、林、漁等產業資源，以提供日本帝國所需。工業則以新式製糖及食品加工業為主。#年代後期，總督府提出臺灣「工業化」的方針，戰爭時期並發展各項軍需工業，也替日後臺灣工業化奠定基礎。伴隨產業建設，島內外交通手段也逐漸完備。交通的完備與治安的穩定也逐步建構起臺灣旅遊業。日本帝國為展示其殖民建設成果，舉辦許多大型博覽會，產業與物產都是其中重要的宣傳面向。":"이 전시품은 '새로운 시대, 새로운 산업' 전시 구역에 있습니다. 일본 시대 초기 대만을 열대 환금작물과 식량 생산지로 보고, 농・임・어업 등 각종 산업 자원을 체계적으로 개발하여 일본 제국이 필요로 하는 것을 공급했습니다. 공업은 신식 제당과 식품 가공업이 중심이었습니다. #년대 후반 총독부는 대만 '공업화' 방침을 내놓았고, 전시에는 각종 군수 산업을 발전시켜 훗날 대만 공업화의 기초도 닦았습니다. 산업 건설과 함께 섬 안팎의 교통수단도 차츰 갖춰졌습니다. 교통의 정비와 치안의 안정은 대만 관광업도 차츰 형성시켰습니다. 일본 제국은 식민 건설의 성과를 과시하려 많은 대형 박람회를 열었고, 산업과 물산은 그 중요한 홍보 소재였습니다.","林業勞動歌 的圖片":"임업 노동요 이미지","林業勞動歌（第 # 張，共 # 張）":"임업 노동요（#/#번째 이미지）","這件展品位在「當原住民遭逢近代國家」展區。當日本帝國以近代國家形式進入臺灣，對人口、土地展開嚴密的掌控後，曾經在政治、文化上維持相對自主的山地，與雖已納入版圖但控制有限的東部地區，終於也逐步納入殖民體制。在國家的政策與征討下，原住民族的生活世界遭逢劇烈變動，並透過口述傳說，留下與官方紀錄大不相同、屬於族人觀點的歷史記憶。":"이 전시품은 '원주민이 근대 국가를 만났을 때' 전시 구역에 있습니다. 일본 제국이 근대 국가의 형태로 대만에 들어와 인구와 토지를 엄격히 통제하자, 정치와 문화에서 비교적 자율을 유지하던 산지와, 영토에 편입되었지만 통제가 제한적이던 동부 지역도 마침내 식민 체제에 차츰 편입되었습니다. 국가 정책과 토벌 아래 원주민족의 생활 세계는 격렬한 변화를 겪었고, 구전 전설을 통해 관의 기록과는 크게 다른 부족의 관점에서 본 역사적 기억을 남겼습니다.","馬蘭阿美群的歌謠 的圖片":"마란 아미족의 노래 이미지","馬蘭阿美群的歌謠（第 # 張，共 # 張）":"마란 아미족의 노래（#/#번째 이미지）","這件展品位在「近代教育與社會運動」展區。日本殖民者引進了近代教育，其主要目標是讓臺灣人成為「理想的日本國民」及殖民統治所需的基礎人力。但是近代教育同時啟發了臺灣人的自覺，也有不少臺灣人至島外接受教育，習得了近代議會政治民主等概念。這些新世代的知識份子不滿臺灣的殖民制度，透過政治與社會運動，取得臺灣民眾支持，形成新時代的抵抗行動，向殖民者爭取政治權利之外，也進行臺灣的社會文化改造運動。":"이 전시품은 '근대 교육과 사회운동' 전시 구역에 있습니다. 일본 식민 당국은 근대 교육을 도입했고, 주된 목표는 대만인을 '이상적인 일본 국민'이자 식민 통치에 필요한 기초 인력으로 만드는 것이었습니다. 그러나 근대 교육은 동시에 대만인의 자각도 일깨웠고, 섬 밖에서 교육을 받아 근대 의회정치와 민주 같은 개념을 익힌 대만인도 적지 않았습니다. 이 새로운 세대의 지식인들은 대만의 식민 제도에 불만을 품고, 정치・사회 운동을 통해 대만 민중의 지지를 얻어 새로운 시대의 저항 행동을 이루었으며, 식민 당국에 정치적 권리를 요구하는 한편 대만의 사회문화 개조 운동도 펼쳤습니다.","唱遊歌曲 的圖片":"율동 창가 이미지","唱遊歌曲（第 # 張，共 # 張）":"율동 창가（#/#번째 이미지）","臺灣文化協會會歌的原件，附在#年#月#日蔣渭水寫給林獻堂的文協創立大會邀請信裡。信中寫明，會歌平時用〈黃海戰〉曲調演唱，儀式時改用〈始政紀念歌〉曲調。":"대만문화협회 회가의 원본으로, #년 #월 #일 장웨이수이가 린셴탕에게 보낸 문협 창립 대회 초청 편지에 붙어 있습니다. 편지에는 회가를 평소에는 〈황해전〉 곡조로 부르고, 의식 때는 〈시정기념가〉 곡조로 바꿔 부른다고 적혀 있습니다.","這件展品位在「現代風格起步走」展區。從都市、城鎮開始，#世紀前半的臺灣人，普遍感受到時代變革的步伐愈催愈緊，從視覺、聽覺、身體意識等感官，到社會結構、人際倫理觀念，都反映大不相同的新氣象，有人稱之為「文明」，有人戲稱為「毛斷」（modern臺語音譯）。自固有慣習裡游離而出的新一代臺灣人，憑著「和洋」（日本/西洋）混雜的技術與形式，展開創作與生活文化的改良，現代臺灣的面貌也隨之逐漸成形。":"이 전시품은 '현대적 스타일의 출발' 전시 구역에 있습니다. 도시와 읍에서 시작해 #세기 전반의 대만인은 시대 변화의 걸음이 갈수록 빨라짐을 두루 느꼈습니다. 시각, 청각, 신체 의식 같은 감각에서 사회 구조, 인간관계 윤리 관념에 이르기까지 크게 다른 새 기운이 나타났습니다. 어떤 이는 이를 '문명'이라 불렀고, 어떤 이는 '마오돤'(modern의 대만어 음역)이라 농담 삼아 불렀습니다. 기존 관습에서 벗어난 새 세대 대만인은 '화양'(일본/서양) 혼합의 기술과 형식으로 창작과 생활문화 개량에 나섰고, 현대 대만의 모습도 차츰 갖춰졌습니다.","流行音樂的誕生 的圖片":"대중음악의 탄생 이미지","流行音樂的誕生（第 # 張，共 # 張）":"대중음악의 탄생（#/#번째 이미지）","這件展品位在「戰爭淹沒了社會：臺灣人的二次世界大戰」展區。#年代，總督府特別重視農漁村的經濟自立，推展部落振興運動，由上至下進行社區改造，推行社會教化，欲在鄉村建立一套新秩序。戰爭爆發後，社會教化體系便轉為支援戰爭的動員組織。臺灣人一方面過著緊縮的物質生活，另一方面還要面對皇民化運動的強大文化壓力，被鼓勵放棄自己原有的語言、姓名，甚至走向戰場、失去生命。":"이 전시품은 '전쟁이 사회를 삼키다: 대만인의 제2차 세계대전' 전시 구역에 있습니다. #년대, 총독부는 농어촌의 경제적 자립을 특히 중시해 부락진흥운동을 추진하고, 위에서 아래로 지역사회 개조와 사회 교화를 시행하여 농촌에 새 질서를 세우려 했습니다. 전쟁이 터지자 사회 교화 체계는 전쟁 지원 동원 조직으로 바뀌었습니다. 대만인은 한편으로 궁핍한 물질생활을 하고, 한편으로 황민화 운동의 강한 문화적 압력을 마주해 원래의 언어와 이름을 버리도록 장려받고, 심지어 전장에 나가 목숨을 잃기도 했습니다.","終戰那一天 的圖片":"종전의 그날 이미지","終戰那一天（第 # 張，共 # 張）":"종전의 그날（#/#번째 이미지）","臺灣民主歌 的圖片":"대만 민주가 이미지","臺灣民主歌（第 # 張，共 # 張）":"대만 민주가（#/#번째 이미지）","展品 #・#F 走向民主這條路":"전시품 #・#F 민주주의로 가는 길","這件展品位在「反共復國基地」展區。#年韓戰爆發。以美國、蘇聯為首的資本主義、共產主義兩大國際陣營在東亞展開對抗，作為西太平洋「第一島鏈」關鍵位置的臺灣，由中國國民黨長期執政，成為中華民國「反共復國」的基地、「自由中國」的堡壘。隨著北京政府的外交拓展，中華民國的國際地位接連挫敗，#年退出聯合國、#年與美國斷交。然而，政府仍力主「三民主義統一中國」的政治口號，構成一黨獨大、以黨領政的威權體制。":"이 전시품은 '반공 복국 기지' 전시 구역에 있습니다. #년 한국전쟁이 발발했습니다. 미국과 소련이 이끄는 자본주의, 공산주의 두 국제 진영이 동아시아에서 대립했고, 서태평양 '제1도련선'의 요충인 대만은 중국국민당이 장기 집권하며 중화민국의 '반공 복국' 기지, '자유 중국'의 보루가 되었습니다. 베이징 정부의 외교 확대와 함께 중화민국의 국제 지위는 잇따라 타격을 입어 #년 유엔에서 탈퇴하고 #년 미국과 단교했습니다. 그러나 정부는 여전히 '삼민주의로 중국 통일'이라는 정치 구호를 고수하여, 일당 독주와 당이 정부를 이끄는 권위주의 체제를 이루었습니다.","愛國歌曲與禁歌 的圖片":"애국가요와 금지곡 이미지","愛國歌曲與禁歌（第 # 張，共 # 張）":"애국가요와 금지곡（#/#번째 이미지）","這件展品位在「走向民主這條路」單元。#年後臺灣人熱烈參政，隨後卻受#事件的影響而噤聲；其後實施長達#年戒嚴。這條曲折的民主路，是不同意見折衝摩擦的過程，也是近兩、三代臺灣人相互看顧、多元對話的生命經驗。":"이 전시품은 '민주주의로 가는 길' 단원에 있습니다. #년 이후 대만인은 정치에 열렬히 참여했지만 곧 #사건의 영향으로 입을 닫았고, 이후 #년에 이르는 계엄이 시행되었습니다. 이 굴곡진 민주의 길은 서로 다른 의견이 부딪히고 조율되는 과정이자, 최근 두세 세대 대만인이 서로 돌보고 다양하게 대화해 온 삶의 경험입니다.","流離之音：歌曲裡的戰後原住民史 的圖片":"유랑의 소리: 노래 속 전후 원주민 역사 이미지","流離之音：歌曲裡的戰後原住民史（第 # 張，共 # 張）":"유랑의 소리: 노래 속 전후 원주민 역사（#/#번째 이미지）","展品 #・#F 最初的抵岸":"전시품 #・#F 최초의 상륙","本作品發想自阿美族傳說：會發光的女孩迪雅瑪贊（Tiyamacan）被迷戀她的海神之子用海水帶走，之後化成雷聲、彩虹和各種生命。作品中的光代表迪雅瑪贊的初心，也象徵混沌大地裡蔓生而出的生命。":"이 작품은 아미족 전설에서 착안했습니다. 빛을 내는 소녀 티야마찬(Tiyamacan)이 그녀에게 반한 바다 신의 아들에게 바닷물에 실려 갔고, 이후 천둥소리, 무지개, 갖가지 생명으로 변했다는 이야기입니다. 작품 속 빛은 티야마찬의 초심을 나타내며, 혼돈의 대지에서 번져 나온 생명도 상징합니다.","「生命的脈動」藝術品 的圖片":"'생명의 맥동' 예술품 이미지","「生命的脈動」藝術品（第 # 張，共 # 張）":"'생명의 맥동' 예술품（#/#번째 이미지）","英國愛丁堡 W. & A.K. Johnston 地圖出版商製作的絹本設色手繪大地圖，推定為#年的內容。圖上標了#個地名，其中#個是長老教會宣道站，反映#年代李庥、馬偕等人的宣教成果。":"영국 에든버러 W. & A.K. Johnston 지도 출판사가 제작한 견본 채색 수제 대형 지도로, #년의 내용으로 추정됩니다. 지도에는 #개의 지명이 표시되어 있으며 그중 #개는 장로교회 선교소로, #년대 리슈, 마카이(맥케이) 등의 선교 성과를 반영합니다.","福爾摩沙島宣教地圖 的圖片":"포르모사 섬 선교 지도 이미지","福爾摩沙島宣教地圖（第 # 張，共 # 張）":"포르모사 섬 선교 지도（#/#번째 이미지）","嘉慶#年（#）建興庄公館發給排灣族望仔立社（今屏東來義鄉望嘉部落）頭人的賞籤，原住民持籤可領取銀#元、布匹等物資。籤上寫「循例」，可見這種做法已行之有年，是清代漢人與原住民往來的見證。":"가경 #년(#) 건흥장 공관이 파이완족 왕자리사(현 핑둥 라이이향 왕자 부락) 두인에게 발급한 상금 표찰로, 원주민은 이 표찰을 가지고 은 #원, 포목 등의 물자를 받을 수 있었습니다. 표찰에 '관례에 따름'이라고 적혀 있어 이런 관행이 오래전부터 있었음을 알 수 있으며, 청대 한인과 원주민이 교류한 증거입니다.","向漢人領取物資的木籤憑證 的圖片":"한인에게 물자를 받기 위한 나무 표찰 이미지","向漢人領取物資的木籤憑證（第 # 張，共 # 張）":"한인에게 물자를 받기 위한 나무 표찰（#/#번째 이미지）","清代臺灣書畫家林朝英的紙本水墨自畫像，依題款推定畫於嘉慶#年（#），當時他#歲。畫中他頭戴冬冠、身穿大褂，身後有抱琴侍童，題款用他招牌的「竹葉書」寫成，是記錄他晚年真實面貌的唯一實物。":"청대 대만의 서화가 린차오잉의 종이 수묵 자화상으로, 관지에 따라 가경 #년(#)에 그린 것으로 추정되며 당시 그는 #세였습니다. 그림 속 그는 겨울 관을 쓰고 두루마기를 입었고, 뒤에 거문고를 안은 시동이 있으며, 관지는 그의 트레이드마크인 '죽엽서'로 쓰였습니다. 노년의 실제 모습을 기록한 유일한 실물입니다.","林朝英水墨自畫像 的圖片":"린차오잉 수묵 자화상 이미지","林朝英水墨自畫像（第 # 張，共 # 張）":"린차오잉 수묵 자화상（#/#번째 이미지）","石青色清代官服，前胸和後背各縫一塊方形補子，主圖是六品武官專用的「彪」。原主人是埔里烏牛欄社的潘踏比厘（#-#），#年升補北路屯千總，#年取得正六品武官職銜。官服由潘家代代收藏，後由後人捐贈。":"청석색 청대 관복으로, 앞가슴과 등에 각각 사각형 흉배를 꿰맸으며 주 문양은 육품 무관 전용인 '범'입니다. 원래 주인은 푸리 우뉴란사의 판타비리(#-#)로, #년 북로둔 천총에 승진 임명되었고 #년 정육품 무관 직함을 받았습니다. 관복은 판 씨 집안에서 대대로 보관하다가 후손이 기증했습니다.","北路屯千總潘踏比厘六品武官補服 的圖片":"북로둔 천총 판타비리 육품 무관 보복 이미지","北路屯千總潘踏比厘六品武官補服（第 # 張，共 # 張）":"북로둔 천총 판타비리 육품 무관 보복（#/#번째 이미지）","七腳川後代復振之大羽冠帽飾 的圖片":"치자촨 후손이 되살린 큰 깃털 관모 장식 이미지","七腳川後代復振之大羽冠帽飾（第 # 張，共 # 張）":"치자촨 후손이 되살린 큰 깃털 관모 장식（#/#번째 이미지）","排灣族女子銀幣飾品長衣 的圖片":"파이완족 여성 은화 장식 긴 옷 이미지","排灣族女子銀幣飾品長衣（第 # 張，共 # 張）":"파이완족 여성 은화 장식 긴 옷（#/#번째 이미지）","這本經摺裝手札的主人，推測是大阪人中西竹山。他在#年#月搭高千穗丸來臺環島旅行，一路收集各地戳章、御朱印、車票、入山證和旅館紙品，再加上自己畫的插圖，記下從基隆南下臺南、高雄再北返的完整行程。":"이 접이식 수첩의 주인은 오사카 사람 나카니시 다케야마로 추정됩니다. 그는 #년 #월 다카치호마루를 타고 대만에 와 섬을 일주하며 여행했고, 가는 곳마다 스탬프, 고슈인, 승차권, 입산증, 숙소 종이 자료를 모으고 직접 그린 삽화를 더해 지룽에서 남쪽으로 타이난, 가오슝을 거쳐 북쪽으로 돌아온 전체 여정을 기록했습니다.","臺灣一周紀念旅行手札 的圖片":"대만 일주 기념 여행 수첩 이미지","臺灣一周紀念旅行手札（第 # 張，共 # 張）":"대만 일주 기념 여행 수첩（#/#번째 이미지）","蔣渭水於#年#月#日寫信給林獻堂，邀他出席臺灣文化協會創立大會，並附上文協會歌。依讓售人說法，蔣家確認這是目前唯一認定的蔣渭水親筆文協書信孤本；整件合訂冊另收有#年文協分裂前後寄給林獻堂的信函。":"장웨이수이가 #년 #월 #일 린셴탕에게 편지를 보내 대만문화협회 창립 대회 참석을 청하며 협회 회가를 동봉했습니다. 양도인의 설명에 따르면 장 씨 가문은 이것이 현재 유일하게 인정되는 장웨이수이 친필 문협 서신의 유일본이라고 확인했으며, 합본 전체에는 #년 문협 분열 전후 린셴탕에게 보낸 서신도 수록되어 있습니다.","蔣渭水致林獻堂書信 的圖片":"장웨이수이가 린셴탕에게 보낸 서신 이미지","蔣渭水致林獻堂書信（第 # 張，共 # 張）":"장웨이수이가 린셴탕에게 보낸 서신（#/#번째 이미지）","「人們記憶中的戰爭」文物 的圖片":"'사람들이 기억하는 전쟁' 문물 이미지","「人們記憶中的戰爭」文物（第 # 張，共 # 張）":"'사람들이 기억하는 전쟁' 문물（#/#번째 이미지）","一場戰爭，各自記憶 的圖片":"하나의 전쟁, 저마다의 기억 이미지","一場戰爭，各自記憶（第 # 張，共 # 張）":"하나의 전쟁, 저마다의 기억（#/#번째 이미지）","陳澄波（#-#）是嘉義畫家，#年以《嘉義街外》入選日本帝展，二二八事件中遇害。展出遺物有他用過的皮箱、帽子、畫筆、調色盤和雕刻工具，由陳澄波文化基金會捐贈。妻子張捷把畫作藏在天花板裡保存，直到#年才首次舉辦遺作展。":"천청포(#-#)는 자이 출신 화가로, #년 《자이 거리 밖》이 일본 제국미술전람회에 입선했고 2·28 사건 중 목숨을 잃었습니다. 전시 유품은 그가 쓰던 가죽 트렁크, 모자, 붓, 팔레트, 조각 도구로, 천청포문화재단이 기증했습니다. 아내 장제는 그림을 천장 속에 숨겨 보존했고, #년에야 처음으로 유작전이 열렸습니다.","#・陳澄波遺物 的圖片":"#・천청포 유품 이미지","#・陳澄波遺物（第 # 張，共 # 張）":"#・천청포 유품（#/#번째 이미지）","「沒有人是局外人」彩繪石頭 的圖片":"'아무도 방관자가 아니다' 채색 돌 이미지","「沒有人是局外人」彩繪石頭（第 # 張，共 # 張）":"'아무도 방관자가 아니다' 채색 돌（#/#번째 이미지）","展品 #・#F 大家的博物館":"전시품 #・#F 모두의 박물관","歷史是不同的人站在各自位置、用自己的方式記錄當下，所累積出來的理解。這個展區收錄陸季盈、謝招治、陳崧波等人的個人紀錄，傳達「每個人都是寫歷史的人」。":"역사는 서로 다른 사람들이 각자의 자리에서 자기 방식으로 현재를 기록하며 쌓아 온 이해입니다. 이 전시 구역에는 루지잉, 셰자오즈, 천쑹보 등의 개인 기록이 수록되어 '모든 사람이 역사를 쓰는 사람'이라는 메시지를 전합니다.","「你也是寫歷史的人」文物 的圖片":"'당신도 역사를 쓰는 사람' 문물 이미지","「你也是寫歷史的人」文物（第 # 張，共 # 張）":"'당신도 역사를 쓰는 사람' 문물（#/#번째 이미지）","這件展品位在「倚海而生的島與人」單元。#世紀中期，臺灣逐漸成為東亞貿易的會合點與轉運點，東西方各大海權勢力在此競逐，臺灣的原住民社會開始面對一波波外來衝擊。":"이 전시품은 '바다에 기대어 사는 섬과 사람들' 단원에 있습니다. # 세기 중반, 대만은 점차 동아시아 무역의 접점이자 환적지가 되었고, 동서양 해양 세력이 이곳에서 경쟁하며 대만 원주민 사회는 거듭되는 외부 충격에 직면하기 시작했습니다.","手語導覽影片：鐵剪刀":"수어 가이드 영상: 쇠가위","鐵剪刀 的圖片":"쇠가위 이미지","鐵剪刀（第 # 張，共 # 張）":"쇠가위（#/#번째 이미지）","這件展品位在「商業市鎮」展區。清代臺灣西部港口大多是商業繁盛的市鎮，郊商、文市、洋行遞次發展。當貨物自中國沿海運至港口後，經由郊行統籌，再由批發商、零售商及挑販逐層經手，最後才到消費者手中。其中，府城（今臺南）、鹿港、艋舺（今臺北萬華）、大稻埕這四個由南至北的港口城市，各自代表了清代臺灣不同階段與類型的商業發展。":"이 전시품은 '상업 도시' 전시 구역에 있습니다. 청대 대만 서부 항구는 대부분 상업이 번성한 시가지로, 상인 조합, 문시, 양행이 차례로 발전했습니다. 화물이 중국 연안에서 항구로 운송되면 상인 조합이 총괄하고, 도매상, 소매상, 행상을 거쳐 단계별로 넘어간 뒤 마지막에 소비자 손에 닿았습니다. 그중 부성(오늘날 타이난), 루강, 멍자(오늘날 타이베이 완화), 다다오청 네 남북 항구 도시는 각각 청대 대만 상업 발전의 서로 다른 단계와 유형을 대표합니다.","手語導覽影片：糖郊李勝興米駝":"수어 가이드 영상: 탕자오 리성싱 쌀 운반구","糖郊李勝興米駝 的圖片":"탕자오 리성싱 쌀 운반구 이미지","糖郊李勝興米駝（第 # 張，共 # 張）":"탕자오 리성싱 쌀 운반구（#/#번째 이미지）","手語導覽影片：豬頭骨與檳榔":"수어 가이드 영상: 돼지 머리뼈와 빈랑","豬頭骨與檳榔 的圖片":"돼지 머리뼈와 빈랑 이미지","豬頭骨與檳榔（第 # 張，共 # 張）":"돼지 머리뼈와 빈랑（#/#번째 이미지）","這件展品位在「日本殖民體制的建立：行政、警察、教化」展區。日本的殖民統治，主要可分為行政、警察、教化三大系統。首先是以臺灣總督府為頂點的行政體系，往上接續帝國中央政府，往下伸展至地方街庄役場，以專業分工的官僚確保績效。其次是警察、保甲系統，負責維持治安、執行法令。第三是以小學校、公學校為中心的教化系統。日本殖民統治前期，熟悉原有社會運作的臺灣人民，不滿日本統治帶來的近代國家運作模式，而屢有武裝反抗事件，總督府也逐步摸索調整其統治策略，透過三大系統逐步掌控臺灣，也使原本處於各自分散的地方社會狀態，逐步邁向一體化。":"이 전시품은 '일본 식민 체제의 확립: 행정, 경찰, 교화' 전시 구역에 있습니다. 일본의 식민 통치는 크게 행정, 경찰, 교화 세 체계로 나뉩니다. 먼저 대만총독부를 정점으로 하는 행정 체계로, 위로는 제국 중앙정부와 이어지고 아래로는 지방 가장역장까지 뻗어 전문 분업의 관료가 성과를 보장했습니다. 다음은 경찰과 보갑 체계로 치안 유지와 법령 집행을 맡았습니다. 셋째는 소학교와 공학교를 중심으로 한 교화 체계입니다. 식민 통치 전기에는 기존 사회 운영에 익숙한 대만 사람들이 일본 통치가 가져온 근대 국가 운영 방식에 불만을 품어 무장 저항이 자주 일어났고, 총독부도 통치 전략을 조금씩 모색・조정하며 세 체계를 통해 대만을 차츰 장악해, 흩어져 있던 지방 사회가 점차 일체화되었습니다.","手語導覽影片：南無警察大菩薩":"수어 가이드 영상: 나무 경찰 대보살","南無警察大菩薩 的圖片":"나무 경찰 대보살 이미지","南無警察大菩薩（第 # 張，共 # 張）":"나무 경찰 대보살（#/#번째 이미지）","國民政府遷臺以來大力推動防空工作，「逃警報」和「防空演習」因此成為許多臺灣人的共同記憶，至今仍有軍民聯合防空演習。":"국민정부는 대만으로 옮겨온 뒤 방공 업무를 크게 추진했고, '공습 대피'와 '방공 훈련'은 많은 대만인의 공통된 기억이 되었습니다. 지금도 군민 합동 방공 훈련이 있습니다.","手語導覽影片：警報器":"수어 가이드 영상: 경보기","警報器 的圖片":"경보기 이미지","警報器（第 # 張，共 # 張）":"경보기（#/#번째 이미지）","#到#年美援時期，美國援助臺灣麵粉等物資。純棉的麵粉袋（俗稱「卡動」）就成了民眾做內衣和家常服的布料，衣褲上常還印著中美合作標誌和製粉公司商標。":"#년부터 #년까지 미국 원조 시기에 미국은 대만에 밀가루 등 물자를 원조했습니다. 순면 밀가루 포대(속칭 '카둥')는 사람들이 속옷과 평상복을 만드는 천이 되었고, 옷에는 중미 합작 마크와 제분 회사 상표가 찍혀 있는 경우가 많았습니다.","手語導覽影片：以麵粉袋做成的衣褲":"수어 가이드 영상: 밀가루 포대로 만든 옷","以麵粉袋做成的衣褲 的圖片":"밀가루 포대로 만든 옷 이미지","以麵粉袋做成的衣褲（第 # 張，共 # 張）":"밀가루 포대로 만든 옷（#/#번째 이미지）","歡迎來到國立臺灣歷史博物館。先花三分鐘，認識一下這裡怎麼逛。":"국립대만역사박물관에 오신 것을 환영합니다. 3분 동안 이곳을 어떻게 둘러보는지 알아볼까요.","你會從 # 號門進入展示教育大樓的 #F 大廳。服務臺在大廳右側，可以在這裡詢問、免費借輪椅，或報名需要現場登記的活動。":"#번 출입문으로 전시교육동 #F 로비에 들어옵니다. 안내데스크는 로비 오른쪽에 있으며, 이곳에서 문의하거나 휠체어를 무료로 빌리거나 현장 등록이 필요한 행사를 신청할 수 있습니다.","#F 有兒童廳，適合帶小朋友動手玩、慢慢看；時光車站有火車劇場，圓形劇場則輪播影片，各自有固定場次，可以先看「本日活動」的時間。":"#F에는 어린이관이 있어 아이와 함께 직접 해 보고 천천히 보기 좋습니다. 시간 정거장에는 기차 극장이 있고 원형극장은 영상을 번갈아 상영하며, 각각 정해진 회차가 있으니 먼저 '오늘의 행사' 시간을 확인하세요.","搭手扶梯、樓梯或電梯到 #F，就是常設展「斯土斯民：臺灣的故事」。常設展分成七個單元，從史前時代一路講到當代，展出上千件文物。展區是開放式的，不用照順序走，可以挑有興趣的單元先看。":"에스컬레이터, 계단 또는 엘리베이터로 #F에 올라가면 상설전 '이 땅의 사람들: 대만 이야기'입니다. 상설전은 일곱 개 단원으로 나뉘며 선사 시대부터 현대까지 천여 점의 문물을 전시합니다. 전시 구역은 개방형이라 순서대로 갈 필요 없이 관심 있는 단원부터 보시면 됩니다.","二樓挑高直通四樓，所以館內沒有三樓。搭電梯到 #F，是特展室和 VR 再現製造所。特展每隔一段時間就會更換，出電梯後跟著指標就能找到展廳；VR 體驗要現場報名，名額有限。":"2층은 4층까지 트여 있어 건물에 3층이 없습니다. 엘리베이터로 #F에 올라가면 특별전시실과 VR 재현 제조소입니다. 특별전은 일정 기간마다 바뀌며, 엘리베이터에서 내려 표지판을 따라가면 전시실을 찾을 수 있습니다. VR 체험은 현장 신청이며 인원이 한정되어 있습니다.","館外是臺灣歷史公園，每天 #:# 到 #:# 免費開放，參觀前後可以到湖畔走走。":       el.animate([{transform:'translate(0,0) scale(1)',color:f.c,opacity:1},{transform:`translate(${tTit.x-(f.wrap?f.ex:f.x)}px,${tTit.y-(f.wrap?f.ey:f.y)}px) scale(${k})`,color:tTit.c,opacity:f.wrap?.6:1}],{duration:dur,easing:PAN_EZ,fill:'forwards'}).onfinish=()=>el.remove();
      setTimeout(()=>el.remove(),dur+300); }
    setTimeout(()=>reveal.forEach(e=>e.style.visibility=''),dur);
    setTimeout(()=>app.querySelectorAll(':scope > .scr #pcard b, :scope > .scr #pcard img, :scope > .scr #pimg, :scope > .scr .pname, :scope > .scr .sgvid, :scope > .scr .mini .th img, :scope > .scr .mini .tt span').forEach(e=>{ if(e.style.visibility==='hidden') e.style.visibility=''; }),dur+80); }   /* 保險：飛行途中畫面若重畫過，新畫面的標題／縮圖一定恢復顯示 */
  if(ghost && (toMini || fromMini)){   /* 播放器整頁縮進迷你播放器／從迷你播放器放大回整頁 */
    const scr=app.querySelector('.scr'), box=app.querySelector(':scope > .scr .mini .box');
    if(toMini){ app.appendChild(ghost); ghost.style.zIndex=50;
      ghost.animate([{clipPath:'inset(0px 0px 0px 0px round 28px)',opacity:1},{clipPath:ins(toMini),opacity:1,offset:.8},{clipPath:ins(toMini),opacity:0}],{duration:PAN_MS,easing:PAN_EZ,fill:'forwards'}).onfinish=()=>ghost.remove();
      const inner=ghost.firstElementChild; if(inner) inner.animate([{transform:'scale(1)'},{transform:'scale(.92)'}],{duration:PAN_MS,easing:PAN_EZ,fill:'forwards'});
      if(box) box.animate([{opacity:0},{opacity:0,offset:.6},{opacity:1}],{duration:PAN_MS});
    } else { app.insertBefore(ghost, app.firstChild);
      scr.style.zIndex=2; scr.animate([{clipPath:ins(fromMini),opacity:.4},{clipPath:ins(fromMini),opacity:1,offset:.12},{clipPath:'inset(0px 0px 0px 0px round 0px)',opacity:1}],{duration:PAN_MS,easing:PAN_EZ}).onfinish=()=>{ ghost.remove(); scr.style.zIndex=''; };
      const inner=scr.firstElementChild; if(inner) inner.animate([{transform:'scale(.94)'},{transform:'scale(1)'}],{duration:PAN_MS,easing:PAN_EZ}); }
    setTimeout(()=>ghost.remove(),900);
  } else if(ghost){ const scr=app.querySelector('.scr');
    /* 2026-11-16 留言：換頁時迷你播放器固定不動，只有後面的頁面切換——轉場期間把新頁的迷你播放器拉到最上層、原位不動，舊頁的藏起來 */
    const mO=ghost.querySelector('.mini'), mN=app.querySelector(':scope > .scr .mini'); let pin=null;
    if(mO&&mN&&(anim==='push'||anim==='pop')){ const wN=mN.parentElement, home=wN.parentElement, nx=wN.nextSibling, r=rel(wN), css=wN.style.cssText;
      mO.parentElement.style.visibility='hidden'; app.appendChild(wN); Object.assign(wN.style,{left:r.l+'px',right:r.r+'px',bottom:r.b+'px',top:'auto',zIndex:60});
      pin=()=>{ if(!pin) return; pin=null; wN.style.cssText=css; if(home.isConnected) home.insertBefore(wN, nx&&nx.parentNode===home?nx:null); else wN.remove(); }; }
    if(anim==='pop'||anim==='down'){ app.appendChild(ghost); if(scr&&anim==='pop') scr.classList.add('in-back'); }
    else { app.insertBefore(ghost, app.firstChild); if(scr) scr.classList.add('in-'+anim); }
    const done=()=>{ ghost.remove(); if(pin) pin(); app.querySelectorAll('.in-push,.in-up,.in-fade,.in-back').forEach(e=>e.classList.remove('in-push','in-up','in-fade','in-back')); };
    ghost.addEventListener('animationend',done,{once:true}); setTimeout(done,600); }
  app.className=(S.fs==='l'?'fs-l ':S.fs==='s'?'fs-s ':'')+(S.hc?'hc ':'')+(FROM_PLAT?'plat ':'')+'lang-'+S.lang;
  const sc2=app.querySelector(':scope > .scr .scroll'); if(sc2) sc2.scrollTop=top;
  if(hx) [...app.querySelectorAll(':scope > .scr .cardrow, :scope > .scr .hs')].forEach((e,i)=>{ if(hx[i]) e.scrollLeft=hx[i]; });
  if(S.screen==='landing') setTimeout(()=>{ S.landIn=true; },1200);
  sgMount(); audSync(); miniMarquee(); pcMarquee(); document.querySelectorAll('#app .pptx').forEach(ppMask); if(S.sheet==='signfs') sfFit();
  if(S.screen==='home'){ homeScroll(); S.heroPlayed=true; }   /* 說明牌式進場只在第一次進首頁播放 */ if(S.screen==='ex') exNavMount(); if(S.screen==='player') playerMount(); if(S.screen==='map') mapMount();
  const pr=document.getElementById('prog');
  bindProg();   /* 2026-11-21：進度條統一由 bindProg 綁（可拖曳）；原本這裡按下就整頁重畫，拖不動 */
}
/* 模擬播放：每秒依倍速推進；播完自動下一則 */
setInterval(()=>{ const p=S.player; if(!p||!p.playing||S._seeking) return;
  if(p.sign&&SGV.dataset.src===sgSrc(it(p.id))) p.pos=SGV.ended?it(p.id).d:Math.min(it(p.id).d,SGV.currentTime); else if(audOn()&&AUD.src){ audSync(); p.pos=AUD.ended?it(p.id).d:Math.min(it(p.id).d,AUD.currentTime||0); } else p.pos+=p.speed; if(p.pos>=it(p.id).d){ p.pos=it(p.id).d; p.playing=false;
    if((S.screen==='player'||(S.screen==='map'&&S.tour&&!S.nav&&!S.herePick&&!S.way))&&!S.sheet) render(); else tickDOM(); return; }   /* 地圖上的現場導覽面板也要從「正在聽」換成「剛聽完」 */
  tickDOM(); }, 1000);
/* 輪播自動換圖：只在播放分頁、沒開逐字稿與手語時 */
setInterval(()=>{ const p=S.player; if(S.screen!=='player'||!p||S.sheet||(S.pTab||'play')!=='detail'||REDUCED||pImgs(it(p.id)).length<2) return; goSlide((S.ci||0)+1); }, 4000);
S.detect=detectLang();
S.lang=S.detect;
try{ S.signPref = localStorage.getItem('nmth.signPref')==='1'; S.gType=localStorage.getItem('nmth.gType')||null; }catch(e){ S.signPref=false; }
try{ S.notes=JSON.parse(localStorage.getItem('nmth.notes')||'{}')||{}; }catch(e){}
try{ S.fav=new Set(JSON.parse(localStorage.getItem('nmth.fav')||'[]')); }catch(e){}
try{ const r=JSON.parse(localStorage.getItem('nmth.resume')||'null'); if(r&&ITEMS[r.id]&&(r.ctx.type==='route'?ROUTES[r.ctx.key]:EXHIBITIONS[r.ctx.key])&&r.pos>3&&r.pos<it(r.id).d-3) S.resume=r; }catch(e){}   /* 審查 #10：同一支手機中斷後重開，首頁提示續聽 */
setInterval(()=>{ const p=S.player; if(!p||isTxt(p.id,p.ctx)||p.ctx.type==='pre') return; try{ localStorage.setItem('nmth.resume',JSON.stringify({id:p.id,ctx:{type:p.ctx.type,key:p.ctx.key,idx:p.ctx.idx,sg:p.ctx.sg},pos:Math.floor(p.pos),t:Date.now()})); }catch(e){} },2000);
/* 易用性測試的情境入口：?go=home 直接到首頁；?go=pt:412 掃到展籤 QR Code（開掃碼頁並帶入編號）；?go=play:205 參觀到一半、正在聽這一件 */
const __GO=(_qs.get('go')||'').split(':');
if(!__GO[0]&&!new URLSearchParams(__QS).has('skip')){ S.screen='landing'; preloadHome(); }
(()=>{ 
  if(__GO[0]==='ex'&&EXHIBITIONS[__GO[1]]){ openEx(__GO[1]); S.hist=['home']; return; }   /* ?go=ex:zj 掃展場入口的 QR Code：開這檔展覽頁 */
  if(__GO[0]==='tour'&&EXHIBITIONS[__GO[1]]){ const k=__GO[1], l=exBase(k), i=Math.max(0,Math.min(l.length-1,(+__GO[2]||1)-1));   /* ?go=tour:perm:3 展覽導覽聽到第 3 則（前面的已聽完） */
    S.heard[k]=new Set(l.slice(0,i)); play(l[i],{type:'ex',key:k}); S.hist=['home']; return; }
  if(__GO[0]==='pre'){ startPre(); S.hist=['home']; return; }
  if(__GO[0]==='resume'){ S.resume={id:'p102',ctx:{type:'ex',key:'perm'},pos:42,t:Date.now()-3600e3}; return; }   /* 易用性測試情境：#go=resume 模擬上次聽到一半 */   /* ?go=pre 從官網連結進來：直接開參觀前先聽 */
  const e=Object.entries(ITEMS).find(([k,v])=>v.no===__GO[1]); if(!e) return;
  if(__GO[0]==='pt'){ play(e[0],{type:'ex',key:exOf(e[0])}); S.hist=['home']; return; }   /* 掃展籤 QR Code：直接進播放器開始播這一件（不再停在掃碼頁按開始） */
  if(__GO[0]==='play'){ const ex=Object.keys(EXHIBITIONS).find(k=>(EXHIBITIONS[k].items||[]).includes(e[0]))||'perm'; play(e[0],{type:'ex',key:ex}); S.hist=['home']; } })();
/* 2026-11-13（審查 #15）：逐字稿複製超過 50 字，貼上時自動附出處與網址 */
document.addEventListener('copy',ev=>{ const sel=document.getSelection(), t=sel?String(sel):''; if(t.length<=50||!S.player) return;
  const n=sel.anchorNode, el=n&&(n.nodeType===1?n:n.parentElement); if(!el||!el.closest('.pscroll')) return;
  ev.clipboardData.setData('text/plain',t+'\n\n——出自：國立臺灣歷史博物館手機導覽〈'+it(S.player.id).n+'〉\n'+location.href.split('#')[0]); ev.preventDefault(); });
render(true);
</script>
