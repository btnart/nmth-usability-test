const PERM_UNIT_TXT={"0": "大家好！今天我們要參觀的展覽是臺史博的常設展「斯土斯民：臺灣的故事」。這次的旅程中，我們將透過展場的情境、文物展示及互動設施，從史前時代、荷西明鄭時期、清領時期、日本時代一路走到二戰後的臺灣，為各位編織一趟從不同角度切入，呈現臺灣多元文化與人群的歷史故事。\n臺灣，首先是一個交會的島嶼，在手扶梯上來的右手邊，是展覽的開場動畫，呈現來自四方又共處在臺灣這塊土地上的人們與其一同編寫的臺灣故事。可以使用這裡的互動設施，閱覽從地圖、地名和藏品角度切入的故事內容。\n如果大家抬頭，會看到剛剛在手扶梯上就有看到的這幅「臺灣人群像」，大家可以在旁邊的 3 臺機器，錄製一小段動態，系統會用博物館 3000 多張館藏影像，拼成一段馬賽克短片在大螢幕輪播，動態下方還會加入歷史上今天發生的重要事件。這樣可以讓所有來參觀的觀眾，與我們一起成為展覽的一部分，提醒所有人—你們都是臺灣故事的一員，臺灣歷史的下個篇章，即是你我大家共同書寫的成果。大家還可以在拍攝後，掃描螢幕上的 QR-CODE 將自己的動態帶走。", "1": "誰是最古老的臺灣人？他們從哪裡來？又為何來到臺灣？在有文字紀錄以前，已經有一波又一波的人群來到這座島嶼。當時的人們，往往是以小團體或小型聚落的型態前來，他們在島上彼此往來、交流，甚至建立與島外世界的聯繫。\n這邊展示了 3 個分別代表不同時期的史前臺灣人類生活模型。", "2": "抬頭看到這張世界地圖，大家找得到臺灣在哪裡嗎？\n臺灣在地圖中央燈光特別打亮的位置，一個旁邊寫著 I Formosa 的小小黃色島嶼就是臺灣。在周邊海域有沒有看到好幾條代表 16、17 世紀重要貿易航線的藍色虛線？16 世紀中葉以後，隨著東亞海域商業貿易的興盛，位於中國大陸、日本、澳門、香料群島等地之間，又在南北航線樞紐附近的臺灣島，逐漸為各方所認識，成為東西方各大海權勢力競逐之地，島上的原住民社會也開始面對一波一波外來衝擊。首先到來的是中國及日本的私商、海盜，他們以臺灣為非法貿易的據點。進入 17 世紀以後，又加入了來自歐洲的荷蘭人與西班牙人，自此東西方文化在此交會，使臺灣成為東亞歷史舞臺上的要角。\n在展場中央的平臺上，可以看到波光蕩漾的海面，海面周圍有 4 組互動螢幕，述說此時在臺灣的不同族群相遇的故事。在檯面上，除了推動航海時代最重要船隻之外，還放置了達悟族銀盔及排灣族琉璃珠飾，這兩件原住民傳統文化中的重要物件，卻以本地不出產的銀與琉璃珠作為材料，從側面反映臺灣很早就已與島外世界有著頻繁的接觸。", "3": "清領時期，大量漢人移民持續渡海前來，在中央山脈以西的沿海、平原、丘陵等不同地形與區域，發展出各自的村落、產業及生活方式，逐漸形成了以漢人移民為主體的傳統地域社會。在這個過程中，對於原本居住於此的原住民社群，造成了前所未有的衝擊，同時開啟了不同人群共存、競逐，互動頻繁且複雜的時代。", "4": "1894 年，明治維新後的日本與清國在朝鮮，也就是今天的韓國，發生甲午戰爭，結果清朝政府戰敗割讓臺灣、澎湖等地成為日本的殖民地。臺灣人在日本統治下體驗了前所未有的巨大變革，一方面受到日本轉手的西方近代文明的吸引，另一方面苦於殖民地的差別對待，在苦悶、抗拒、不平，和迎接現代生活的期待、轉變之間，度過半世紀的「日本時代」。", "5": "第二次世界大戰結束後，臺灣隨著中華民國的接收，進入一個新的時代。戰爭的結束，帶動了一波人口的遷徙，原先長住臺灣的日本軍民遭到遣返，因戰爭四散海外的臺灣人陸續回歸，數年後隨著國共內戰失利，超過百萬大陸軍民遷入臺灣，組成臺灣戰後的大遷徙浪潮。", "6": "走過臺灣多元而豐富的歷史旅程，不知道各位是不是有特別的感觸？我們常設展的導覽，到這裡告一段落，謝謝您的聆聽。這邊還有一個「大家的博物館」展示空間，您會看到許多與生活經驗息息相關的文物，在互動螢幕中可以投票選出您覺得最喜愛、符合互動問題物件，將您的選擇留給接下來每一個參觀的觀眾，與博物館共同書寫臺灣歷史故事！國立臺灣歷史博物館歡迎您的再度蒞臨，謝謝，再會！"};
const PERM_GUIDE=[{"id": "g01", "u": 1, "n": "舊石器時代：第一批臺灣人群之謎", "sv": 4, "img": "p202", "txt": "首先，是舊石器時代臺東長濱八仙洞遺址，可以看到住在沿海地帶岩洞中的人類，依靠漁獵採集生活的情形，這個遺址也是目前臺灣本島發現最古老的人類存留證據。"}, {"id": "g02", "u": 1, "n": "新石器時代：新移民帶來了新科技", "sv": null, "img": "p202", "txt": "大約在 6000 多年前，一批來自亞洲大陸東南沿海的人類渡海來到臺灣，將臺灣帶入新石器時代。我們面前的墾丁遺址裡，已出現這個時期的特徵之一，也就是農業的出現。有農業提供穩定的糧食來源，人們開始有餘力發展工藝及宗教活動，各地聚落逐漸出現文化上的多樣性以及社會制度。同時期的新石器時代遺址中，經常發現花蓮的玉器等外來物品，說明臺灣各地之間的交流日趨頻繁。"}, {"id": "g03", "u": 1, "n": "鐵器時代：人群的再到來？或文化變革？", "sv": 5, "img": "p201", "txt": "在距今 2000 多年前，臺灣部分地區進入了鐵器時代，也就是說，此時透過自發或對外文化交流，擁有了煉製鐵器的技術。這個時期，臺灣慢慢出現大型聚落，如這裡位於蘭陽平原的淇武蘭遺址，便經常有像這種外來船隻前來交易，遺址中出現不少來自中國、日本、韓國、東南亞各地的舶來品。鐵器時代也是史前時代與歷史時期的橋梁，許多今天臺灣原住民的祖先，都可以追溯至這時期的考古遺址，甚至歷史文獻中的聚落紀載。舉例來說，這個淇武蘭遺址便可能是噶瑪蘭族人祖先的居住地，著名的新北市十三行遺址、臺東舊香蘭遺址，則分別可能是凱達格蘭族與排灣族祖先的遺留。"}, {"id": "g04", "u": 1, "n": "生命的脈動（迪雅瑪讚）", "sv": null, "img": "p202", "txt": "在考古的發現和文獻紀錄外，原住民的起源傳說也是了解臺灣史前時代的重要依據。在這裡，展覽運用一位阿美族藝術家根據其族人一則傳說「迪雅瑪贊」所創作的藝術作品，述說在原住民視角下臺灣故事的開篇。\n據說，很久很久以前，有一位身體會發光的女孩「迪雅瑪贊」。海神之子因為深深迷戀上了她，用大水將她帶離家人，據說此後迪雅瑪贊就此幻化成雷聲、彩虹與各種生命，而因大水中離散的家人，就變成了臺灣各地原住民族群的起源。"}, {"id": "g05", "u": 2, "n": "世界航線，集結！", "sv": 7, "img": "p302", "txt": "現在，讓我們先來看看一張記錄西方人來之前，東亞傳統海上航路的地圖。這張明代東西洋航海圖標示了明代的東洋、西洋航線。其中「東洋航線」，由福建出發，經澎湖一帶，北往琉球、日本，南往呂宋、婆羅洲，使澎湖及臺灣逐漸成為船隻往來的樞紐，在明朝禁止日本人前往中國大陸貿易時，中、日商人及海盜便順著這條航線，來到地圖中標註北港、加里林的臺灣會合，進行走私貿易。\n16 世紀後歐洲各國先後來到東亞，試圖開啟與中國、日本的貿易。荷蘭人繞過非洲南端好望角，再經印度洋來到東方；西班牙人則是先向西穿越大西洋到美洲墨西哥，再航渡太平洋來到亞洲。荷、西兩國各自繞了地球半圈，最終在 17 世紀的 20 年代於臺灣碰頭，在臺灣南、北各自建立了殖民與商業據點。此時，臺灣成為世界東、西航路的會合點之一，為臺灣帶來商業交易與文化交流的機會。\n在我們身邊的展櫃中，展出了 16、17 世紀時，臺灣周邊海域的重要商品，包括中國的生絲、陶瓷器，日本、墨西哥的白銀，東南亞的辛香料；臺灣此時的出產品則以鹿皮、鹿筋、鹿肉為主，另外也包括硫磺、烏魚子和糖等其他物品。這裡的鹽、鐵鍋和布疋則是商人與原住民村落交易鹿製品常用的商品。"}, {"id": "g06", "u": 2, "n": "登上臺灣的各國人士", "sv": 6, "img": "p303", "txt": "在這裡展出大量臺史博特色收藏之一的早期臺灣地圖與書籍，每一張地圖或書籍，往往都記載了一段特殊的歷史故事與其時代背景。17 世紀初，荷蘭與西班牙在歐洲進行曠日持久的戰爭，雙方的對抗一路從歐洲延燒到了亞洲，荷蘭人除了對西屬菲律賓群島展開直接的攻擊，為了要打擊西班牙與中國、日本的貿易往來，還搶先西班牙人一步於 1624 年占領臺灣南部的大員，作為貿易及切斷明朝沿海與馬尼拉西班牙人貿易航線的基地。為了回應荷蘭人的挑戰，西班牙人於 1626 年佔領雞籠、淡水一帶。這張西班牙人繪製的艾爾摩沙島荷蘭港口圖，便是這場對抗中，西班牙人佔領雞籠後，根據一位曾服務於荷蘭聯合東印度公司，對大員地理環境熟悉的人提供情報，所繪製的台江內海周邊地圖。此圖原本應該是預備在攻打荷蘭據點時使用，但由於暴風等氣候因素西班牙軍隊的進攻未能進行。若干年後，西班牙人由於商業不景氣，無力維持臺灣的據點，最終在 1642 年敗給荷蘭人退出臺灣。\n雖然未能完成最初的目的，這幅地圖仍為我們留下 17 世紀台江內海周圍生活空間相關的寶貴歷史紀錄。從地圖中，可以看到荷蘭人的熱蘭遮城，左側停泊船隻的北線尾附近有漢人前來交易，而在內海沿岸除了荷蘭人建立的要塞之外，還有蕭壠社、目加溜灣社、麻豆社及漢人、日本人的聚落，聚落外也可看到獵鹿的景象。"}, {"id": "g07", "u": 2, "n": "身陷角力戰的原住民", "sv": null, "img": "p304", "txt": "隨著漢人、日本人、荷蘭人、西班牙人相繼到來，臺灣原住民社會受到不小的影響。面對外來者，原住民各部落會主動選擇有利於部落的同盟對象，也會與敵對的勢力產生衝突。不同族群之間各有盤算，有時彼此交惡，有時維持著不穩定的聯盟關係。而外來團體間彼此也有糾葛衝突。可以說，外來者的出現，對原住民來說不僅是一種挑戰，有時也是一種機會，各部落往往視情況援引外來者的勢力，藉以提升自己的威望。因此，這段歷史並不是「強大的歐洲人 vs. 弱勢的原住民」的常見既定印象，而是一個彼此權衡、協調或衝突、合作的動態歷史。\n除了原住民與外來勢力的關係，不同外來群體之間也上演激烈的競爭。荷蘭人在臺勢力一擴張，馬上與更早到來的漢人、日本人產生利益衝突，其中濱田彌兵衛事件甚至擴大成為荷蘭、日本之間的國際貿易糾紛，最後荷蘭人低頭才使日本重開對荷貿易。"}, {"id": "g08", "u": 2, "n": "「滄海」變「桑田」的政權轉折", "sv": 9, "img": "p305", "txt": "1662 年，在中國大陸東南地區抗清失利的鄭成功跨海攻臺，在包圍熱蘭遮城 9 個月後，荷、鄭雙方簽訂合約，荷蘭人正式退出臺灣。鄭氏政權在取代荷蘭政權後，建立了一個以漢人為主體的社會，但由於鄭氏原本就是活躍於海上的集團，因此依舊相當重視海上貿易，與海上各國維持緊密的貿易關係。\n這樣的情況，延續到清朝於 1683 年遣施琅率軍於澎湖海戰擊敗鄭氏，將臺灣納入清朝版圖為止。清朝的統治，讓臺灣從面向海洋的海洋政權與文化，轉而成為以陸權為主的清朝領地，不但商貿從國際貿易轉向以兩岸貿易為主，同時促使臺灣文化發展的脈絡由海洋轉向陸地。"}, {"id": "g09", "u": 2, "n": "唐山人的臺灣夢", "sv": null, "img": "p302", "txt": "隨著臺灣被納入清朝版圖後，人口稠密的福建、廣東二省人民，便前仆後繼地移入臺灣。當時臺灣地廣人稀，有大片未開墾的土地，對移民來說十分具有吸引力。不過，清朝政府為避免太多移民來臺後難以控制，制訂了繁瑣的渡臺政策，而號稱「黑水溝」的臺灣海峽，海象險惡，使渡海來臺之事充滿困難與風險。然而即便如此，漢人移民還是源源不斷，或以合法申請、或以非法偷渡的方式來到臺灣，尋求「臺灣錢淹腳目」的「臺灣夢」。\n在我們左手邊的紅頭船，是清領時期載運各類商品和移民往返臺海兩岸的最主要交通工具。在船頭邊的船艙中，可以看到幾位偷渡客，正在偷偷的向外張望，想要找個機會偷溜上岸，他們象徵此時大量非法來臺的漢人移民。另外，在船尾處有一對合法渡海來臺的漢人夫妻，雖然我們經常可以聽到清領時期移民不得攜家帶眷，只有孤身男子可以來臺的說法，不過這樣的規定並非始終如一。渡臺禁令的內容，在清潮統治的 200 餘年間屢屢進行調整，有時可以攜眷，有時可以接眷，政策搖擺不定，再加上清朝政府在臺灣力量有限，因此未能阻止大量漢人移民到臺灣，改變了臺灣人口的主要結構及社會文化發展的方向。"}, {"id": "g10", "u": 3, "n": "遇見清朝", "sv": 8, "img": "p401", "txt": "當原住民碰到清朝統治時，各自採取不同的因應方式。西半部地區的大多數社群，向清朝繳稅、提供勞務，被政府稱為「熟番」，在《職貢圖》中為偏右側的人群；而山區及東半部地區的大多數社群，則維持部落自主，不隸屬清朝，因此被政府稱為「生番」在《職貢圖》中位置偏左，另外還有介於兩這之間的「歸化生番」的分類。\n「熟番」被清人認為是順從的、較熟悉文明的原住民社群，在文獻圖像裡經常被描述為上古社會裡自然純樸的人。這些原住民社群在居住生活、買賣交易等方面與漢人有頻繁互動，衣著、器物用品方面也多受漢人影響。在這邊可以看到清領時期用以「教化」社會的《聖諭廣訓衍》，在原住民聚落中設置的社師，以及原住民改姓漢姓的對照簿，都記錄以熟番為主的原住民社群面，對清朝統治及漢人移民時的處境與適應。\n為了區隔漢人、熟番與居住在「化外」，也就是清政府控制區域以外的生番，同時阻止漢人進入山區造成治安隱憂，官府劃設了「番界」加以隔離，建立界碑、土牛堆、壕溝等設施，禁止漢人越線。然而，界外的土地和資源依舊吸引大量漢人移民越界，官府因此屢屢修改「番界」的位置，每一次修改，界線都更往東邊移動。在番界圖上有紅、藍兩種顏色的界線，即分別代表 18 世紀上半葉兩次界線的調整變化，反映了西部地區人群不斷往東推移的趨勢。"}, {"id": "g11", "u": 3, "n": "公廨", "sv": null, "img": "p401", "txt": "在人群不斷接觸、交會的過程中，會在語言、信仰、物質或生活文化中，留下各種文化交織的痕跡。大家轉身看到的這間，是博物館根據 19 世紀西方旅行家紀錄，搭建重現的早期公廨。公廨是西拉雅族、馬卡道族舉辦宗教儀式、眾人議事的場所，族人相信祖靈可藉由這些壺內的水來發揮靈力，保佑族人。\n稍微往前看，右手邊這是一個很特別的展櫃，博物館請頭社原住民耆老，親自來博物館佈置這個關於該社信仰的展示。這裡可以看到壺、豬頭骨等前面公廨中也有出現的重要物件，值得注意的是這些物件後方的祭祀用旗，從內容上可看出已加入不少道教符咒等漢人文化元素。"}, {"id": "g12", "u": 3, "n": "平埔原住民的人生故事", "sv": null, "img": "p402", "txt": "臺灣的平埔原住民社群，在遭遇漢人社會和清朝官府帶來新的挑戰與社會秩序時，做出了許多不同的抉擇與應對，為部落帶來了不一樣的際遇。畫像中的潘敦，也稱作潘敦仔，是中部巴宰族岸裡社的頭人。在他的領導下，岸裡社屢次協助清朝政府平定各地亂事，不但為自己掙得軍功與職銜，同時拉近自己族人與官府的關係，又透過割地換水等方式引入水田耕作技術，使部落農作產量提升。這些改變了部落的傳統生活型態，卻也為部落爭取到較好的發展條件。\n旁邊這件補服，屬於另一位選擇與清朝官府合作的南投烏牛欄社頭人潘踏比厘。他 19 世紀擔任千總職務，協助清朝政府處理埔里地區「熟番」社群事務、守衛番界線，在官服胸口方方正正的補子上，可以看到象徵六品武官的彪紋圖案。"}, {"id": "g13", "u": 3, "n": "簽約租地", "sv": null, "img": "p401", "txt": "這是一個模擬清領時期平埔原住民地主跟漢人佃戶簽訂土地契約的場景。場中的 4 個人，除了立契雙方，也就是地主與租地佃戶之外，通常還會有 1 位漢人代書協助書寫契約，以及平埔村社的通事或土目見證契約成立，稱為「在場」或「知見」。這樣的場景，象徵著臺灣的土地，一點一滴落入漢人手中的過程。除了極少數「番頭家」因為在部落中本來就是領導階級，藉著出租田地給漢人耕作，收租致富之外，許多原住民在這場社會變革中，逐漸喪失了原有的土地，被迫遠走他鄉尋覓新的家園。"}, {"id": "g14", "u": 3, "n": "地域社會", "sv": null, "img": "p401", "txt": "從這裡開始，展場述說清領時期臺灣社會因應各地不同的自然條件，以及移民自原鄉帶來的生活習慣，再加上早期交通不便，區域間交流不易，形成地區不同的產業與生活方式。在展廳的右手邊依序展出沿海、平原、丘陵、後山 4 個不同區域，左手邊則展示商業城鎮的崛起，分別介紹各地域社會的發展特色，突顯先民「靠山吃山、靠海吃海」的智慧。\n中間的對宗教遶境隊伍，則述說清領時期與多元地域社會相對，也出現跨越地域與族群的宗教文化。宗教信仰是臺灣移民社會，在面對不熟悉的新環境和茫茫不可知的未來時，最重要的心靈寄託。移民在橫渡黑水溝時，基於祈求平安，往往將家鄉的神明隨身攜帶，在臺灣落地生根後，再設法興建廟宇酬謝神明保佑。這些傳統信仰歷經時代更替的考驗，直到現在依然香火不斷，每年臺灣各地的宗教遶境活動，早已成為臺灣文化不可或缺的部分。這裡的繞境隊伍後半段，是主要負責驅逐瘟疫的王爺信仰，以及前半段則是主掌海路靖平的媽祖信仰。"}, {"id": "g15", "u": 3, "n": "沿海（無展板）", "sv": null, "img": "p401", "txt": "首先，我們來到沿海地區。由於臺灣沿海地區土地貧瘠，漁撈又受限於當時的工具及氣候環境，於是沿海居民發展出特殊的生活型態，藉著結合多樣的生產方式來彌補先天環境的不足。像是在澎湖的居民，利用當地礁岸地形及多孔隙石材，在潮間帶堆築大型「石滬」，藉著潮汐漲退的自然現象，捕捉隨潮水來去的魚群。在臺灣本島西南沿海地區，居民在潟湖、溼地、出海口等地修築魚塭，經營養殖漁業。又因當地因日照充足，適合曬鹽，一坵坵的鹽埕，讓「白水」變成「鹹金」，一直以來都是臺灣重要的鹽產地。"}, {"id": "g16", "u": 3, "n": "平原：從鹿場到田園", "sv": null, "img": "work-4.jpg", "txt": "臺灣平原地區主要的農作物為稻米和甘蔗，兩者在清領時期的發展受到市場需求很大的影響。荷蘭人在臺灣時便開始鼓勵甘蔗的種植，糖於是成為重要的出口貿易品。這裡的牛車正準備將收割後的甘蔗送往糖廍製糖，牛車高大的板輪，方便於早期泥濘的道路行進，是清領時期臺灣最重要陸上交通工具之一。\n稻米的種植，在清領初期受到缺乏灌溉設施等因素影響，一直未能擴大種植面積。不過，到 18 世紀以後，華南地區糧食需求提高，促使許多地方仕紳相繼投入稻米的種植與出口，帶動了水利設施的興建，著名的八堡圳、瑠公圳、曹公圳，都是這樣時代背景下的產物。在農業社會中，水是非常重要的資源，清領時期臺灣社會往往不惜訴諸武力械鬥，來保護珍貴的水資源。這邊的兩位農民正在巡守水圳，避免他人侵占村子的灌溉用水。"}, {"id": "g17", "u": 3, "n": "丘陵地區的聚落", "sv": 10, "img": "p403", "txt": "在沿海和平原地區之後，我們來到臺灣北部的丘陵淺山地區。清朝政府在此設置了俗稱「土牛紅線」的番界線，用來隔離漢人、熟番與國家控制外的生番。不過，番界的劃定並不能阻絕人們交流的需要，沿著界線出現許多俗稱「社寮」的原漢交易地點，雙方用平地的火繩槍、腰刀、酒、布料和山區的鹿皮、籐材、獵物等商品進行交易。這邊用來領取物資的木籤憑證上，則可能是漢人透過贈送物資的方式，穩定原、漢關係的歷史證據，收到這個木籤的原住民族人可以憑證向漢人領取布料等物品。\n大約在 19 世紀下半葉，臺灣北部丘陵地區生產的茶葉、樟腦等商品，因開港通商受到國際市場青睞，引發新一波的山林墾拓熱潮。商人為了提煉樟腦，經常進入山區，以金錢或豬隻等物品，與原住民交涉進入山區、砍伐樟樹、設置加工樟腦的腦寮的權利。隨著砍伐的範圍日漸深入山區，對於原住民傳統生活領域造成重大影響，加深樟腦開採業者與原住民的衝突對立，使清末淺山地區成為衝突頻發之地。"}, {"id": "g18", "u": 3, "n": "接觸與衝突", "sv": 14, "img": "p404", "txt": "清領時期臺灣不同族群接觸頻繁，加上資源爭奪激烈，無論原住民與漢人，或是漢人與清朝官府，甚至是漢人社會內的不同人群都經常爆發衝突，進而牽動臺灣地方社會的發展變化。在土埆厝中展示的宋江陣兵器，正是各地聚落為了保護自己的身家財產，籌組巡守隊伍，定期巡邏及操練的地方武力，其中一部分演變為今日寺廟陣頭的武藝展演。\n這幅《平定臺灣戰圖》是清廷畫師繪製臺灣 18 世紀林爽文事件的想像圖。這次動亂牽扯了社會上的眾多不同族群，其中最常被提及的莫過於協助清軍平亂，被頒予《褒忠匾額》的客家族群。其實，當時不只是客家人參加了這次的事件，各族群或多或少都參與事件雙方，我們可以來看看這邊一位原住民女性金娘的故事。\n金娘為下淡水社原住民，在地方替人畫符醫病，亂事爆發後加入林爽文一側的莊大田部，由於在攻城掠地前替莊大田請神助戰，又能以咒語為眾人治病，因此被尊為軍師，在民間被尊稱為仙姑。然而，對於官方而言，金娘則被定義為以咒語、畫符迷惑眾人的妖女。金娘的故事在點出不同族群紛紛被捲入該件的同時，也可以看到一個人物在不同立場下的不同詮釋。"}, {"id": "g19", "u": 3, "n": "商業市鎮", "sv": 13, "img": "p405", "txt": "隨著貿易的發展，沿海的港口城市也跟著繁榮起來。「一府二鹿三艋舺」這句諺語，形容清朝南中北 3 大市鎮鼎立的盛況。一府，是當時的臺灣府城（今臺南）；二鹿，指的是鹿港；三艋舺，則是今天的臺北萬華。這 3 座貿易市鎮的興衰史，正好見證了清領時期臺灣商業貿易的演變，例如臺灣對外貿易從兩岸貿易走到開港通商，貿易品在米、糖之外，增加了茶葉、樟腦，貿易往來的要角從郊商換成了「通曉洋文」的買辦等。\n雖然商業日漸繁盛，但是當時臺灣的度量衡並沒有統一，臺南的一斤與中部的一斤很可能不一樣重，造成交易中很多的爭議及不便。為了解決這樣的問題，各地受到眾人信任的大商家會製作這種公砣，放在廟宇或其他公共場所當作解決爭議的依據。在這個公砣上，可以看到製作公砣的商號、用來量測的貨物種類，以及用蘇州碼書寫的重量數字，大家可以透過這個想像當時跨越地域做生意的景象。\n商業的繁盛也帶來商人家族的崛起，這些大家族興起之後，一邊透過參加公共事務獲得名望、資源與利益，一邊培養子弟讀書參加科考，逐漸轉型為重要地方仕紳，連官府也經常需要借重他們的資金與人脈，方能完成許多政策的推動。與此同時，大家族也會帶動臺灣的文教事業、物質文化發展，如這幅自畫像中府城元美號林家第三代的林朝英，便是 18 世紀府城商紳代表人物，不但功名在身而且精擅被稱為「竹葉體」的書法，許多廟宇至今仍懸掛他所書寫的匾額。\n繼續往前走，來到清領時期中部最重要港口－鹿港。依照清朝政府規定，兩岸貿易僅開放官方規定的臺灣與福建港口一對一交通，被稱為對渡政策。在這張地圖中，可以看到清領時期先後開放的對渡口岸，鹿港在 18 世紀下半葉因中部的發展開放與泉州蚶江對渡，成為出口中部米穀的重要港口。"}, {"id": "g20", "u": 3, "n": "開港通商", "sv": 16, "img": "p406", "txt": "19 世紀中葉後西力東漸，西方商人、傳教士再次來到臺灣。1860 年代初淡水開港通商，受到世界市場的影響，北部的茶葉、樟腦成為重要的出口商品，艋舺附近的大稻埕成為臺灣茶葉集散中心，一躍而成重要的貿易城鎮。這位陶德先生，是當時臺灣茶崛起的重要推手。陶德在開港通商後，來到臺灣調查水土，發現北部丘陵適合種茶，於是自中國大陸引入安溪茶種，招聘有經驗的製茶師傅，生產並出口臺灣茶葉。此前臺灣茶多半略略加工後，就運到福建精製後再出售。陶德在大槄埕設立茶廠之後，不再將茶葉賣往中國大陸市場，改將臺灣烏龍茶直銷紐約，大受歡迎，自此打開臺灣茶葉的知名度。\n在這邊製茶模型中，可以看到當時從採茶、製茶、揀茶到試飲的茶葉生產、銷售流程。在揀茶模型中，可以看到許多女工正在揀選茶葉，這些在騎樓下工作的女工，可說是臺灣早期女性就業的重要例子。"}, {"id": "g21", "u": 3, "n": "山的彼端", "sv": 15, "img": "p408", "txt": "現在在我們右手邊的是後山區域。所謂「後山」，是清領時期對於臺灣東部地區的稱呼。乾隆末年，以漢人及西部平埔原住民為主體的武裝拓墾集團開始進入蘭陽平原，受到衝擊的噶瑪蘭人被迫大規模遷徙，尋找新的生活空間，以維繫傳統文化傳承。在這個過程中，大量人口因天災、疫疾、械鬥衝突而喪命，為了祭祀這些客死異鄉的孤魂，人們在農曆七月大肆舉辦普度活動，而普度的最後會舉行搶孤活動，透過活動大量聚集的人氣，令鬼月出來享用祭祀的孤魂各歸其所。\n1871 年，一艘琉球國的船隻遭風漂流至今天屏東沿海，船員上岸後與當地原住民發生衝突被殺，日本藉口此事出兵登陸臺灣，史稱牧丹社事件。事件後，感受到外國勢力威脅的清朝政府派遣沈葆楨等官員來臺，開始較為積極的經營東部地區，以杜絕外人侵佔。"}, {"id": "g22", "u": 4, "n": "鉅變 1895", "sv": 17, "img": "p501", "txt": "起初，臺灣仕紳、官吏在得知割讓臺灣的消息後，不願就此屈服，籌組「臺灣民主國」以這樣的藍地黃虎旗為旗幟抗拒日本接收，希望引起國際的關注與干涉。雖然臺灣的抗日活動成功引起各國媒體的報導，但期望中的國際干涉卻沒有發生。在日軍登陸基隆後，臺灣民主國迅速崩潰，臺灣抗日重心南移，沿途有許多臺灣民眾組成義勇軍反抗，臺南則由劉永福出面領導，然而由於訓練和裝備遠不及日軍，經過半年多的抵抗，主要的抗日勢力亦宣告瓦解。\n這場戰爭中，清、日兩方皆留下大量的圖文資料，包括照片、圖繪等等。清方的畫報，如這張劉大將軍擒獲倭督樺山斬首圖，多半以描述劉永福英勇抗日為題材創作，甚至虛構了劉永福斬殺後來的日本總督樺山資紀的「假消息」，反映當時人們對此次戰爭的期望。而日方留下《風俗畫報》等作品，則特別強調日本軍隊的英勇，醜化抗日清軍及義勇軍，其中也有不少虛構的成份，如占領臺北城錦繪中便杜撰了日軍英勇攻下臺北城的場景，而歷史上臺北城主動開城並未發生戰事。與清、日雙方相比，臺灣民間抗日勢力留下的資料較少，大家可以聽這邊的《臺省民主歌》歌謠及各種能久親王傳說中的各種死法等，訴說臺灣人的心聲。"}, {"id": "g23", "u": 4, "n": "日本殖民體制的建立", "sv": 18, "img": "p505", "txt": "當我們進入日本統治時期，在整個展區正中間的警察派出所，顯示警察制度為日本殖民統治控制臺灣社會重要的制度。負責維持治安、確保法令執行的警察、保甲系統，搭配以總督府為頂點的行政官僚體系，以及以小、公學校為中心的教化系統，為貫徹國家權力的三大管道。\n進入派出所，這裡陳列日本時代的重要政策相關展示。日本在臺灣以科學調查與調查所得的大量數據作為治理的根據，同時把自己宣傳成文明的代理人。在統治過程中，推動全島一體化為其重要政策。這邊看到的時鐘，展示總督府以 24 小時制取代 12 時辰的傳統計時，統一時間觀念的政策。\n中間這座南無警察大菩薩一手持劍一手持佛珠，象徵日本統治策略的高壓懷柔並濟；警察身後伸出持拿不同物件的多隻手臂，顯示日本警察管理範圍之廣，涵蓋臺灣人生活的各個不同層面，擁有很強的權威。右下角有隻手持秤，即代表警察負責推動、管理總督府統一度量衡政策，在對面的展櫃展示日本人規定的各種「公制」度量衡工具，包括量米的斗、公制的秤子，以及原先各地不同長度的「尺」與日本規定的「尺」對照圖。"}, {"id": "g24", "u": 4, "n": "當原住民遭逢近代國家", "sv": 19, "img": "p507", "txt": "對於原住民族群，尤其是原先清朝官方未直接管理的山地區域，總督府有計畫的施行鎮壓與懷柔並濟的政策，強行讓國家力量進入原住民部落。總督府先是透過伊能嘉矩等人類學家進行調查，以人類學分類、研究的方式，掌握原住民的傳統習俗、生活文化。接著，再用武力鎮壓和設置警察駐守的方式控制部落，同時設立教育所教育原住民，讓原住民在思想觀念上逐漸認同日本。經濟上，則在部落推行新產業，改變原本的生產型態。由於這些政策的推行，臺灣原住民族群逐漸成為日本統治下的新國民。\n在原住民與總督府相遇的過程中，雙方的衝突與合作交錯。除了著名的霧社事件之外，這個大羽冠所屬的七腳川社，最初與日人採取合作態度，但後來由於總督府徵招社人守衛隘勇線未按時支付報酬等緣故，與日人發生衝突造成日本警察死傷，總督府隨即動員軍警攻擊部落，即七腳川事件。七腳川族人在逃離部落時，匆忙中未帶出傳統文化中重要的大羽冠，展出的這頂是近年原住民文化復振運動中，七腳川社後裔參考耆老口述、其他部落同類文物，經過考究後重新製作。\n透過教育改造原住民，使之成為日本人眼中的理想國民，是總督府治理原住民的重要政策。從蕃童教育所及公學校表圖中，可以看到日本在各地設置蕃童教育所及蕃人公學校的狀況，進入學習的原住民學童，可能就要像蕃童教育所明信片裡一樣，穿著規定的服裝，學著日語及日本人規劃的課程，這些課程一開始以「開化」、「輔導農耕」為主要目的，後來皇民化時期，進一步變為讓原住民族成為「真正的日本人」。"}, {"id": "g25", "u": 4, "n": "新時代，新產業", "sv": 20, "img": "p508", "txt": "日本殖民臺灣初期，把臺灣當作熱帶經濟作物和糧食的生產地，透過各項基礎建設的進行，和產業的調查探勘，有系統地引進新技術和品種來開發臺灣各項農、林、漁等產業資源，以便提供日本本國所需。\n甘蔗的種植與製糖是日本時代臺灣重要產業，總督府透過獎勵日人投資、品種改良及擬定區域採收制度等有利日本投資者的政策，鼓勵各地成立新式糖廠，使臺灣成為世界重要糖出口地。1930 年代後期，總督府提出臺灣「工業化」的方針，推動包含許多戰時軍需工業的相關建設，替日後臺灣工業化奠定基礎。\n在整頓交通、治安與衛生之後，總督府開始大力推動觀光旅遊產業、印製旅遊書籍及廣告。1920 年代，《臺灣日日新報》票選「臺灣八景」，帶出一波旅遊熱潮，其影響力一直延續至今。如日月潭、阿里山等景點都是當時興起的。因應觀光客的消費，各地也開始開發土特產品或伴手禮，如強調南國印象的香蕉、鳳梨，又如臺南的竹筏模型、原住民的工藝品等等，都是極受觀光客歡迎的伴手禮。"}, {"id": "g26", "u": 4, "n": "近代教育與社會運動", "sv": 22, "img": "p512", "txt": "總督府在臺灣設立以小學校、公學校為基礎的教育系統，透過新式教育培養為殖民統治服務的人，在此過程中也為臺灣知識分子打開一條接觸當代西方知識的途徑。此時學校的課程，包括培養國民基礎能力的國語，即日語課程；養成忠君愛國觀念及「日本精神」的修身課程；形塑對日本認同感的歷史課程等等。同時，也有許多與生活實用技能相關的農業實習、珠算課程，以及鍛鍊國民身體及服從精神的體操課程。\n教育系統的建構，同時影響了臺灣學歷制度的興起，在眼前的黑板上印了一份日本時代報紙的徵人廣告，細看的話，可以發現學歷已成為應徵工作的重要條件。"}, {"id": "g27", "u": 4, "n": "現代風格起步走", "sv": 24, "img": "p516", "txt": "1920 年代臺灣新舊知識份子，不滿於總督府的殖民政策，透過辦報紙、政治運動與社會運動，建立臺灣文化協會等組織號召民眾，提倡爭取政治權利、設置議會，並試圖臺灣啟蒙社會大眾、改造文化習俗。\n新式教育同時塑造了一批「新時代女性」，這些女性不同於以往的臺灣女性，她們受過教育、有一定的經濟能力，而且在思想上建構新的自我認同。\n在城鎮中，總督府積極進行「市區改正」計畫，包括街屋的改造、拓寬道路、設置衛生下水道、消防、綠地等公共設施，逐步將臺灣傳統的市街聚落改造成「現代化」都市的風貌。在我們面前這排街屋，分別是雜貨店、吳服店、寫真館、咖啡廳和診所，反映著日本時代新式街道、消費文化及大眾娛樂的出現，呈現日本時代臺灣民眾生活的巨大變化。"}, {"id": "g28", "u": 4, "n": "戰爭淹沒了社會：臺灣人的二次世界大戰", "sv": 25, "img": "p523", "txt": "日本時代後期，臺灣被捲入長期的戰爭。戰爭下，臺灣的政治、經濟、社會、教育方方面面都要為戰爭服務。因應戰爭需要，總督府開始推行「皇民化」運動，透過鼓勵臺灣人放棄原有的語言和姓名，改用日語和日本姓名等方式，企圖讓臺灣人成為日本天皇的忠誠子民。在信仰上，緊縮原本對民間信仰相對寬鬆的管理，以「國有神社，家有神棚」為口號的，積極建設神社以取代傳統寺廟，甚至嘗試沒收寺廟財產，卻未獲成功；在家庭中，總督府則推動以日式神龕替代傳統正廳擺設。\n戰爭時期臺灣社會上充斥各種戰爭宣傳，籌集戰爭物資、鼓勵儲蓄、鼓舞民心士氣、打擊黑市等等不一而足。從戰爭宣傳中，可以側面看出當時的戰爭局勢與戰爭下臺灣人的生活，如消滅黑市海報，便反應戰時物資匱乏、配給不足下，人們透過黑市等地下管道收集生活必需品的狀況。而「決戰！銅、鐵的特別回收」海報及「擊滅美英．大東亞建設大觀」地圖，前者顯示日本久戰之下銅、鐵等金屬資源短缺的窘境，後者則告訴我們日本帝國眼中認為日軍南下東南亞，將獲得當地人的歡迎與支持，進而痛擊敵手的樂觀判斷。\n戰爭末期，為了補充人力的不足，先後以軍伕、軍屬、志願兵、徵兵等方式動員臺灣人民支援戰爭。在出征前，經常會舉辦一些看似風光的出征祝福儀式，送上簽名旗幟或千人針祈求出征者武運長久，並與家族成員、同僚合影留念。不過，戰爭總是殘酷的，這邊有一個死於空襲的臺灣士兵林清春的遺物盒，這木盒在家人手上保存了數十年後，由其兄弟捐贈給博物館，希望記錄下這段歷史與當時人們的故事。二戰末期的臺籍日本兵，在戰後很長一段時間都不為人所重視，明明也是為了當時的國家而犧牲，卻處於戰爭雙方都很少提及的尷尬位置。\n1945 年 8 月 15 日，日本天皇透過廣播宣讀「終戰詔書」，不同世代、背景及國籍的人們對於「終戰」都有著不同的感受，有人徬徨若失，有人對戰爭結束感到歡欣鼓舞。這裡收集了許多親身經歷過這一天的人們，對於「終戰」那天不同的回憶，大家可以來聽聽，體驗歷史的多面性。"}, {"id": "g29", "u": 5, "n": "戰後大遷徙", "sv": 26, "img": "p601", "txt": "在這個動盪的年代，皮箱成為許多人回憶這段經歷的代表物件。這個皮箱屬於一位李惠美女士，她原籍日本，本名鈴木惠美子，二戰期間赴滿州國尋人，因戰亂無法返回日本而滯留東北，在此認識並嫁給任職於國軍的丈夫，後來就隨著軍隊四處遷徙，最後定居於臺灣高雄，以藝名李惠美開班教授舞蹈，在許多中華民族舞蹈比賽中獲獎。她的故事與人生經歷代表著許多那個時代人們共同的遷徙經歷。\n在政權交替之初，臺灣社會普遍抱著脫離殖民地、「回歸祖國」的心情，對於政府接收抱持歡迎的態度，甚至興起學習國語、去日本化的風潮。不過，由於雙方分治已久，有許多隔閡，加上戰後經濟崩潰、復員緩慢、官員貪污時有所聞，社會矛盾不斷加劇，最終爆發影響深遠的 228 事件，事件後官方的軍事鎮壓、清鄉，讓許多臺灣菁英遭遇不測，也為戰後臺灣政治、社會發展埋下陰影。展場互動螢幕，收集了 228 事件期間臺灣各地每日發生的重要事件，如果有興趣可以到這邊點選閱覽。"}, {"id": "g30", "u": 5, "n": "反共復國基地", "sv": null, "img": "p605", "txt": "1950 年韓戰爆發，臺灣成為世界冷戰體系下，西太平洋地區反共的前哨站。為了防範共產黨的滲透，臺灣地區實施戒嚴，限縮國民行動、言論與集會結社等權利。在反共的大旗下，社會上充斥著各種反共標語、口號，許多今天耳熟能詳的流行歌曲，如今天不回家、苦酒滿杯等，都因為各種理由遭到查禁；相對的，反共愛國歌曲則受到政府的大力提倡。\n在戒嚴時期，不少本省、外省社會菁英，因為今天我們看起來很難理解的理由，遭到政治上的壓迫、限制，甚至判刑入獄。這個是一位臺大醫院眼科醫師胡鑫麟，因參加左傾思想讀書會，被逮捕在綠島服刑期間自製的星象盤，後來他將這個星象盤給他兒子時，還半開玩笑地說，製作星象盤是「為了萬一能划船逃離綠島的話……有星空圖，就能找到臺灣的方向」用的。"}, {"id": "g31", "u": 5, "n": "經濟奇蹟的幕後", "sv": 28, "img": "p607", "txt": "在經濟上，戰後初期政府透過幣制改革與美援，解決通貨膨脹的問題，推動土地改革穩定臺灣社會矛盾，逐漸解決戰後臺灣經濟的困境。對於美國援助的物資，大家最熟悉的可能就是一袋袋麵粉了，而使用完的麵粉袋做成的小孩衣服，更是大家經常在書上看到的時代特殊物件。這裡展示了一塊當時麵粉袋類似的織品，大家可以來摸一下，看看麵粉袋衣服的觸感是否與你想像中一樣？\n在政府經濟政策的引導下，臺灣透過農產及其加工品的出口來換取外匯，扶植民生工業的發展，工業產值在 1960 年代超過農業產值，蓬勃發展的經濟獲得「臺灣經濟奇蹟」的美譽。來到這裡，大家或許會覺得這樣的景像很熟悉。在臺灣經濟起飛的時代，政府在民間推動「客廳即工廠」的政策，很多人家裡的客廳，經常堆滿了一堆手工加工品，家庭主婦和放學後的孩子，一起在自家客廳裡進行家庭代工，雖然個別產量不大，但確實增加了家庭的收入。"}, {"id": "g32", "u": 5, "n": "貨幣經濟", "sv": null, "img": "p601", "txt": "經濟的起飛與發展，對原住民社群造成一定的衝擊，改變了部落原有的生活。都市化與山林經濟的瓦解，讓許多族人不得不離開家鄉，進入都市的勞動市場，形成另一種島內人群的遷徙。而貨幣經濟進入部落，鼓勵部落族人進入山林種植香菇等經濟作物，不過多數山林自日本時代開始即被收歸國有，原住民於傳統領域種植香菇的經濟行為，與國有林地法規不時產生衝突。為了躲避進山巡邏取締香菇種植的巡山員，部落中的族人會在巡山員上山時，用棍子敲響這個織布機製成的警報器，通知山上種香菇的族人躲避。後來，在廣播系統普及後，部落則會撥放〈中國一定強〉表示巡山員來了，撥放〈何日君再來〉代表已離開，體現國家力量與地方需要互相衝突下的共存機制。\n隨著經濟與社會的發展，近年大量以東南亞為主的國際移工以及婚姻移民加入臺灣社會，成為最新一波的移民浪潮，所帶來的文化與生活經驗，豐富了臺灣的多元人文風貌。在早些時候，當網路還不太發達時，千里迢迢背井離鄉來到臺灣工作的移工們，每次想要寄東西回老家都會找故鄉人開的小店幫忙，店家為了證明自己已將包裹送如實送達，往往會請家鄉的送貨員拍一張包裹與移工家人的合照，放在店裡作為送達的證明。"}, {"id": "g33", "u": 5, "n": "社會力的爆發", "sv": 29, "img": "p609", "txt": "隨著 1970 年代臺灣經濟的起飛與成長，臺灣人生活日漸穩定、富裕，逐漸激發了人們對於政治參與的渴望。1987 年解嚴後，臺灣的社會力量覺醒，各種訴求的抗議、請願、自立救濟、街頭遊行等社會運動一時間風起雲湧，象徵臺灣進入了自由發聲的時代。社會上許多問題紛紛浮上檯面，政治議題、環境保護、客家與原住民文化復興，以及眷村文化的保存等等，展現多元、蓬勃發展的社會力量與潮流。這張桌子周圍，博物館挑選了 4 個今天我們仍須持續面對的未解決議題，象徵臺灣社會將持續面對的各種挑戰和困難。"}];
/* 2026-11-18：第三層的單件展品先隱藏，導覽清單只留展覽總說／單元／子單元；資料與地圖點位都保留，改回 true 就會再出現 */
const PERM_OBJ_ON=false;
const PERM_SEL={"g01": ["p202"], "g04": ["p201"], "g05": ["p302"], "g06": ["p303"], "g07": ["p304"], "g09": ["p305"], "g10": ["p401"], "g12": ["p402"], "g17": ["p403"], "g18": ["p404"], "g19": ["p405"], "g20": ["p406"], "g21": ["p408"], "g22": ["p501"], "g23": ["p503"], "g24": ["p507"], "g25": ["p508"], "g26": ["p512"], "g27": ["p516"], "g28": ["p523"], "g29": ["p601"], "g30": ["p605"], "g31": ["p608"], "g32": ["p606"], "g33": ["p609"]};   /* 子單元底下挑出來寫導覽的展品（館方實際上只會挑部分展品撰稿） */
const PERM_USEL={"0": ["p102"], "6": ["p701"]};   /* 沒有子單元的單元，展品直接掛在單元底下 */
const gDur=t=>Math.max(60,Math.round((t||'').length/4));

   展覽總說 100、單元總說 u50、子單元 u51 起跳，刻意避開館方既有的展品編號 101–701。 */

  PERM_GUIDE.filter(x=>x.u===ui).forEach((x,j)=>{ PERM_NO[x.id]=''+(ui+1)+(51+j); }); });
PERM_GUIDE.forEach(g=>{ const sv=g.sv?'sign/'+g.sv+'.mp4':'', src=sv?EXHIBITIONS.perm.items.map(k=>ITEMS[k]).find(y=>y&&y.sv===sv):null, im=ITEMS[g.img]||ITEMS[(PERM_SEL[g.id]||[])[0]], u=PERM_UNITS[g.u];   /* 2026-11-18：文稿指定的展品圖已刪掉時（g23 的 p505、g31 的 p607），改用這個子單元的代表展品圖 */
  ITEMS[g.id]=Object.assign({ n:g.n, no:PERM_NO[g.id], unit:u, zone:u.replace(/^.、/,''), fl:'2F', voice:false, lv:2, txt:g.txt, img:im?im.img:EXHIBITIONS.perm.hero },
    sv?{ sign:true, sv, sp:'sign/'+g.sv+'.jpg', d:src?src.d:120 }:{ tonly:true, d:gDur(g.txt) }); });
EXHIBITIONS.perm.guide=(()=>{ const intro=EXHIBITIONS.perm.intro||'', hero=EXHIBITIONS.perm.hero;
  ITEMS.gall={ n:'展覽總說', no:PERM_NO.gall, unit:'', zone:'', fl:'2F', voice:false, tonly:true, lv:0, txt:intro, img:hero, d:gDur(intro) };

const PERM_I18N={"gall": {"en": {"n": "Exhibition Overview", "txt": "Journey with the island of Taiwan through centuries of shifting memory. Beginning with mysterious origin legends, you will follow this land through repeated upheavals and changes of era, and meet the faces, voices and stories of ordinary people beneath the grand narrative.\nThe exhibition is organised by period into seven units: Taiwan, Island of Encounters; The First Landfalls; The Island and Its People, Born of the Sea; Coexistence and Contest Between Mountain and Sea; Frustrations and Dreams Under a New Order; The Road to Democracy; and A Museum for Everyone."}, "ja": {"n": "展覧会の総説", "txt": "台湾という島とともに、数百年にわたる記憶の移ろいを旅してみましょう。神秘的な起源伝説から始まり、この土地が幾度もの時代の転換と激変を経てきた道のりをたどり、大きな歴史の下にある人々の姿、声、物語に出会います。\n本展は「時代」を単位として、台湾・交会の島／最初の到来／海に生きる島と人／山と海のあいだの共存と競合／新秩序下の鬱屈と夢／民主への道／みんなの博物館、の7大ユニットで構成されています。"}, "ko": {"n": "전시 총설", "txt": "타이완이라는 섬과 함께 수백 년에 걸친 기억의 흐름을 여행해 봅시다. 신비로운 기원 전설에서 출발해, 이 땅이 거듭 겪어 온 시대의 교체와 격변을 따라가며, 큰 역사 아래 살아온 사람들의 모습과 목소리, 이야기를 만납니다.\n이 전시는 '시대'를 단위로 삼아 타이완, 만남의 섬 / 최초의 상륙 / 바다에 기대어 사는 섬과 사람 / 산과 바다 사이의 공존과 경쟁 / 새로운 질서 아래의 답답함과 꿈 / 민주주의로 가는 길 / 모두의 박물관 등 7개 단원으로 나뉩니다."}}, "gu0": {"en": {"n": "I. Taiwan, Island of Encounters", "txt": "Welcome. Today we are visiting the permanent exhibition of the National Museum of Taiwan History, \"Homeland: The Story of Taiwan\". Through staged settings, objects and interactive installations, we will travel from prehistory through the Dutch, Spanish and Koxinga periods, the Qing era and the Japanese period, all the way to post-war Taiwan.\nTaiwan is first of all an island of encounters. To the right as you come up the escalator is the opening animation, showing people who came from all directions and now share this land. You can use the interactive installations here to read stories told through maps, place names and collection objects.\nLook up and you will see the \"Portraits of the People of Taiwan\". At the three machines beside it you can record a short clip; the system assembles a mosaic film from more than 3,000 museum images and plays it on the large screen, with important events from this day in history shown below. Everyone who visits becomes part of the exhibition — the next chapter of Taiwan's history is written by all of us. After recording, scan the QR code on screen to take your clip home."}, "ja": {"n": "一、台湾、交会の島", "txt": "ようこそ。本日ご覧いただくのは、国立台湾歴史博物館の常設展「この土地、この民――台湾の物語」です。展示空間の情景、文物、インタラクティブ装置を通して、先史時代からオランダ・スペイン・鄭氏の時代、清朝統治期、日本時代を経て、戦後の台湾までをたどります。\n台湾はまず「交会（出会い）の島」です。エスカレーターを上がって右手にあるのがオープニング映像で、四方から来てこの土地にともに暮らす人々と、その人々が共に書いてきた台湾の物語を描いています。ここのインタラクティブ装置では、地図・地名・収蔵品という切り口から物語を読むことができます。\n見上げると「台湾人群像」があります。隣の3台の機械で短い動画を撮影すると、館蔵の3,000点を超える画像でモザイク映像が作られ、大画面に流れます。下部には「今日の歴史上の出来事」も表示されます。来館するすべての方が展示の一部となる――台湾の歴史の次の一章は、私たち皆が共に書くものです。撮影後は画面のQRコードを読み取ってお持ち帰りいただけます。"}, "ko": {"n": "1. 타이완, 만남의 섬", "txt": "환영합니다. 오늘 보실 전시는 국립타이완역사박물관 상설전 '이 땅, 이 사람들 ― 타이완 이야기'입니다. 전시장의 연출, 유물 전시, 인터랙티브 시설을 통해 선사시대부터 네덜란드·스페인·정씨 시기, 청나라 통치기, 일본 시대를 거쳐 전후 타이완까지 함께 둘러봅니다.\n타이완은 무엇보다 '만남의 섬'입니다. 에스컬레이터를 올라오면 오른편에 오프닝 영상이 있습니다. 사방에서 와서 이 땅에 함께 사는 사람들과 그들이 함께 써 온 타이완 이야기를 담았습니다. 이곳의 인터랙티브 시설에서는 지도·지명·소장품의 관점에서 이야기를 볼 수 있습니다.\n고개를 들면 '타이완 사람들의 군상'이 보입니다. 옆의 세 대의 기기에서 짧은 영상을 촬영하면, 박물관 소장 이미지 3,000여 점으로 모자이크 영상을 만들어 큰 화면에 상영합니다. 아래에는 역사 속 오늘의 주요 사건도 함께 나옵니다. 방문하는 모든 분이 전시의 일부가 됩니다. 타이완 역사의 다음 장은 우리 모두가 함께 쓰는 것입니다. 촬영 후 화면의 QR 코드를 찍으면 영상을 가져갈 수 있습니다."}}, "gu1": {"en": {"n": "II. The First Landfalls", "txt": "Who were the oldest Taiwanese? Where did they come from, and why did they come here? Long before written records, wave after wave of people arrived on this island. They usually came in small groups or small settlements, moving and trading among themselves and even building links with the world beyond the island.\nOn display here are three models of prehistoric life in Taiwan, each representing a different period."}, "ja": {"n": "二、最初の到来", "txt": "最も古い台湾人とは誰でしょうか。どこから、なぜこの島へ来たのでしょうか。文字の記録が生まれる前から、幾度もの人の波がこの島に到来していました。当時の人々は小さな集団や小規模な集落として渡来し、島内で行き来し交流し、さらに島の外の世界ともつながりを築いていました。\nここには、それぞれ異なる時代を代表する3つの先史時代の生活模型が展示されています。"}, "ko": {"n": "2. 최초의 상륙", "txt": "가장 오래된 타이완 사람은 누구일까요? 어디에서, 왜 이 섬으로 왔을까요? 문자 기록이 생기기 전부터 여러 차례 사람들의 물결이 이 섬에 닿았습니다. 당시 사람들은 작은 무리나 소규모 취락 형태로 건너와 섬 안에서 서로 오가며 교류했고, 나아가 섬 바깥 세계와도 연결을 맺었습니다.\n이곳에는 서로 다른 시기를 대표하는 선사시대 생활 모형 세 점이 전시되어 있습니다."}}, "gu2": {"en": {"n": "III. The Island and Its People, Born of the Sea", "txt": "Look up at this world map — can you find Taiwan? It is the small yellow island lit at the centre, marked \"I. Formosa\". The blue dotted lines in the surrounding waters are major trade routes of the 16th and 17th centuries.\nFrom the mid-16th century, as maritime trade in East Asia flourished, Taiwan — lying between mainland China, Japan, Macau and the Spice Islands, and close to the hub of the north–south routes — gradually came to the attention of every side, and became contested ground among the great sea powers. Indigenous society on the island began to face wave after wave of outside pressure. First came private traders and pirates from China and Japan, who used Taiwan as a base for illicit trade; after the 17th century the Dutch and the Spanish arrived from Europe. East and West met here, and Taiwan became a leading player on the stage of East Asian history.\nOn the platform at the centre you can see a shimmering sea surface, with four interactive screens around it telling the stories of the different peoples who met here. On the platform, alongside the ships that drove the age of sail, are a Tao silver helmet and Paiwan glass-bead ornaments — important objects in indigenous tradition, yet made from silver and glass beads not produced locally, a sign that Taiwan had long been in frequent contact with the world beyond."}, "ja": {"n": "三、海に生きる島と人", "txt": "この世界地図を見上げてください。台湾はどこにあるでしょうか。中央で特に明るく照らされた、「I. Formosa」と記された小さな黄色い島が台湾です。周囲の海に引かれた青い点線は、16・17世紀の重要な交易航路です。\n16世紀半ば以降、東アジア海域の商業交易が盛んになるにつれ、中国大陸・日本・マカオ・香料諸島のあいだに位置し、南北航路の要衝に近い台湾島は次第に各方面に知られ、東西の海洋勢力が争う地となりました。島の先住民社会も、次々と押し寄せる外からの衝撃に直面し始めます。まず中国と日本の私商や海賊が、台湾を密貿易の拠点としました。17世紀に入るとヨーロッパからオランダ人とスペイン人が加わり、東西の文化がここで交わって、台湾は東アジア史の舞台の主役の一つとなります。\n会場中央の台には、ゆらめく海面と、その周囲に4組のインタラクティブ画面があり、当時台湾で出会った人々の物語を語ります。台上には大航海時代を支えた船のほか、タオ族の銀兜とパイワン族の琉璃珠飾りが置かれています。先住民文化の重要な品でありながら、現地では産出しない銀と琉璃珠を素材としており、台湾が早くから島外世界と頻繁に接触していたことを物語ります。"}, "ko": {"n": "3. 바다에 기대어 사는 섬과 사람", "txt": "이 세계지도를 올려다보세요. 타이완은 어디에 있을까요? 지도 가운데 특히 밝게 비춘, 'I. Formosa'라고 쓰인 작은 노란 섬이 타이완입니다. 주변 바다에 그려진 파란 점선은 16~17세기의 주요 무역 항로입니다.\n16세기 중엽 이후 동아시아 해역의 상업 교역이 번성하면서, 중국 대륙·일본·마카오·향료제도 사이에 자리하고 남북 항로의 요충지에 가까운 타이완섬은 점차 여러 세력에게 알려졌고, 동서 해양 강국들이 다투는 땅이 되었습니다. 섬의 원주민 사회도 밀려오는 외부의 충격을 마주하기 시작했습니다. 먼저 중국과 일본의 사무역 상인과 해적이 타이완을 밀무역 거점으로 삼았고, 17세기에 들어서는 유럽에서 네덜란드인과 스페인인이 더해졌습니다. 동서 문화가 이곳에서 만나면서 타이완은 동아시아 역사 무대의 주역이 되었습니다.\n전시장 가운데 단상에는 일렁이는 바다가 펼쳐지고, 그 주위 네 개의 인터랙티브 화면이 당시 타이완에서 만난 여러 집단의 이야기를 들려줍니다. 단 위에는 대항해시대를 이끈 배와 함께 타오족 은 투구와 파이완족 유리구슬 장신구가 놓여 있습니다. 원주민 전통문화의 중요한 물건이지만 현지에서 나지 않는 은과 유리구슬로 만들어져, 타이완이 일찍부터 섬 밖 세계와 빈번히 접촉했음을 보여 줍니다."}}, "gu3": {"en": {"n": "IV. Coexistence and Contest Between Mountain and Sea", "txt": "During the Qing period large numbers of Han migrants kept crossing the strait. Along the coast, plains and hills west of the Central Mountain Range they developed their own villages, industries and ways of life, gradually forming a traditional regional society with Han settlers at its centre. For the indigenous communities already living here, this brought an unprecedented shock, and opened an era of frequent and complex interaction — of peoples coexisting and competing at once."}, "ja": {"n": "四、山と海のあいだの共存と競合", "txt": "清朝統治期には、多くの漢人移民が海を渡って次々とやって来ました。中央山脈以西の沿海・平野・丘陵といった異なる地形と地域で、それぞれの村落・産業・生活様式が発展し、しだいに漢人移民を主体とする伝統的な地域社会が形づくられていきます。この過程は、もともとそこに暮らしていた先住民の社会にかつてない衝撃を与え、同時に、異なる人々が共存し競合する、交流の頻繁で複雑な時代の幕を開けました。"}, "ko": {"n": "4. 산과 바다 사이의 공존과 경쟁", "txt": "청나라 통치기에는 많은 한족 이민자가 바다를 건너 계속 들어왔습니다. 중앙산맥 서쪽의 해안·평야·구릉 등 서로 다른 지형과 지역에서 각자의 마을과 산업, 생활 방식이 발전하며 점차 한족 이민자를 중심으로 한 전통적 지역 사회가 형성되었습니다. 이 과정은 원래 그곳에 살던 원주민 사회에 전례 없는 충격을 주었고, 동시에 서로 다른 사람들이 공존하면서 경쟁하는, 교류가 잦고 복잡한 시대를 열었습니다."}}, "gu4": {"en": {"n": "V. Frustrations and Dreams Under a New Order", "txt": "In 1894 Japan, newly modernised through the Meiji Restoration, fought the Qing empire in Korea. The Qing was defeated and ceded Taiwan, the Penghu islands and other territory, which became Japanese colonies. Under Japanese rule the people of Taiwan experienced change on a scale never seen before: drawn on one hand to the modern Western civilisation Japan passed on, and burdened on the other by colonial discrimination. Between frustration, resistance and injustice, and the expectation and transformation that came with modern life, they lived through half a century of the \"Japanese era\"."}, "ja": {"n": "五、新秩序下の鬱屈と夢", "txt": "1894年、明治維新を経た日本と清国が朝鮮（現在の韓国）をめぐって日清戦争を起こし、敗れた清朝政府は台湾・澎湖などを割譲し、これらは日本の植民地となりました。日本統治下の台湾の人々は、かつてない大きな変革を経験します。一方では日本を介して入ってきた西洋近代文明に惹かれ、他方では植民地としての差別的な扱いに苦しみました。鬱屈・抵抗・不平と、近代的な生活を迎える期待・変化とのあいだで、半世紀にわたる「日本時代」を過ごしたのです。"}, "ko": {"n": "5. 새로운 질서 아래의 답답함과 꿈", "txt": "1894년, 메이지 유신을 거친 일본과 청나라가 조선에서 청일전쟁을 벌였고, 패한 청 정부는 타이완과 펑후 등을 할양해 이들 지역은 일본의 식민지가 되었습니다. 일본 통치 아래 타이완 사람들은 전례 없는 큰 변화를 겪었습니다. 한편으로는 일본을 통해 들어온 서구 근대 문명에 이끌렸고, 다른 한편으로는 식민지로서의 차별적 대우에 시달렸습니다. 답답함과 저항, 불평등 그리고 근대적 삶에 대한 기대와 변화 사이에서 반세기에 걸친 '일본 시대'를 보냈습니다."}}, "gu5": {"en": {"n": "VI. The Road to Democracy", "txt": "After the Second World War ended, Taiwan entered a new era as it was taken over by the Republic of China. The end of the war set off a wave of migration: Japanese soldiers and civilians who had long lived in Taiwan were repatriated, Taiwanese scattered overseas by the war gradually returned, and a few years later, as the Nationalists lost the civil war, more than a million soldiers and civilians from the mainland moved to Taiwan — the great post-war migration."}, "ja": {"n": "六、民主への道", "txt": "第二次世界大戦の終結後、台湾は中華民国による接収とともに新しい時代に入りました。戦争の終わりは人口移動の波をもたらします。長く台湾に住んでいた日本の軍人・民間人は送還され、戦争で海外に散っていた台湾人は次々と帰還しました。数年後には国共内戦の敗北にともない、百万人を超える大陸の軍民が台湾に移り住み、戦後台湾の大移動の波を形づくりました。"}, "ko": {"n": "6. 민주주의로 가는 길", "txt": "제2차 세계대전이 끝난 뒤, 타이완은 중화민국의 접수와 함께 새로운 시대로 들어섰습니다. 전쟁의 종결은 인구 이동의 물결을 불러왔습니다. 오랫동안 타이완에 살던 일본 군인과 민간인은 송환되었고, 전쟁으로 해외에 흩어졌던 타이완 사람들은 차례로 돌아왔습니다. 몇 해 뒤 국공내전에서 패하면서 100만 명이 넘는 대륙의 군인과 민간인이 타이완으로 이주해, 전후 타이완의 대이동 물결을 이루었습니다."}}, "gu6": {"en": {"n": "VII. A Museum for Everyone", "txt": "Having travelled through Taiwan's diverse and rich history, did anything strike you in particular? Our guided tour of the permanent exhibition ends here — thank you for listening. There is also the \"A Museum for Everyone\" display space, where you will find many objects closely tied to everyday experience. On the interactive screens you can vote for the ones you like most or that best answer the questions posed, leaving your choice for every visitor who comes after you, and writing the story of Taiwan's history together with the museum. The National Museum of Taiwan History looks forward to welcoming you again. Thank you, and goodbye."}, "ja": {"n": "七、みんなの博物館", "txt": "台湾の多様で豊かな歴史の旅を終えて、何か心に残るものはあったでしょうか。常設展のガイドはここまでです。ご清聴ありがとうございました。この先には「みんなの博物館」という展示空間があり、暮らしの経験と深く結びついた数々の文物をご覧いただけます。インタラクティブ画面では、お気に入りの品や問いにふさわしいと思う品に投票でき、あなたの選択はこれから訪れる一人ひとりに受け継がれます。博物館とともに台湾の歴史の物語を書いていきましょう。国立台湾歴史博物館は皆さまの再びのご来館をお待ちしています。ありがとうございました。"}, "ko": {"n": "7. 모두의 박물관", "txt": "타이완의 다양하고 풍성한 역사 여정을 지나오며 특별히 마음에 남은 것이 있으셨나요? 상설전 안내는 여기까지입니다. 들어 주셔서 감사합니다. 이 앞에는 '모두의 박물관'이라는 전시 공간이 있어, 일상의 경험과 깊이 맞닿은 여러 유물을 보실 수 있습니다. 인터랙티브 화면에서는 가장 마음에 드는 물건이나 질문에 어울린다고 생각하는 물건에 투표할 수 있고, 여러분의 선택은 이후 방문하는 모든 관람객에게 전해집니다. 박물관과 함께 타이완 역사 이야기를 써 나가 주세요. 국립타이완역사박물관은 여러분의 재방문을 기다립니다. 감사합니다."}}, "g01": {"en": {"n": "Palaeolithic: The Riddle of Taiwan's First People", "txt": "The first model shows the Baxian Caves site at Changbin, Taitung, from the Palaeolithic period. People lived in coastal caves and survived by fishing, hunting and gathering. This is the oldest evidence of human presence yet found on the island of Taiwan."}, "ja": {"n": "旧石器時代：最初の台湾人群の謎", "txt": "まず旧石器時代、台東長濱の八仙洞遺跡です。海沿いの岩陰に住み、漁撈と狩猟採集で暮らした人々の様子が見られます。この遺跡は、台湾本島で現在までに見つかっている最も古い人類の痕跡でもあります。"}, "ko": {"n": "구석기시대: 최초의 타이완 사람들의 수수께끼", "txt": "먼저 구석기시대, 타이둥 창빈의 바셴둥 유적입니다. 해안가 동굴에 살며 어로와 수렵 채집으로 살아간 사람들의 모습을 볼 수 있습니다. 이 유적은 타이완 본섬에서 지금까지 발견된 가장 오래된 인류의 흔적이기도 합니다."}}, "g02": {"en": {"n": "Neolithic: New Settlers Brought New Technology", "txt": "About 6,000 years ago people crossed the sea from the south-eastern coast of mainland Asia, bringing Taiwan into the Neolithic. At the Kenting site before us agriculture has already appeared. With a stable food supply, people had energy to spare for crafts and religion, and settlements began to differ from one another in culture and social organisation. Jade from Hualien and other non-local goods found at Neolithic sites show that contact across Taiwan was becoming more frequent."}, "ja": {"n": "新石器時代：新移民が新しい技術をもたらした", "txt": "約6,000年前、アジア大陸東南沿海から人々が海を渡って台湾に来て、台湾は新石器時代に入りました。目の前の墾丁遺跡では、この時代の特徴の一つである農業が現れています。安定した食糧が得られたことで、人々は工芸や宗教活動を発展させる余裕を持ち、各地の集落に文化的な多様性と社会制度が生まれました。同時期の遺跡から花蓮産の玉器など外来の品がしばしば出土し、台湾各地の交流が活発になっていたことがわかります。"}, "ko": {"n": "신석기시대: 새로운 이주민이 가져온 새로운 기술", "txt": "약 6,000년 전 아시아 대륙 동남 연안에서 사람들이 바다를 건너와 타이완은 신석기시대로 들어섰습니다. 눈앞의 컨딩 유적에서는 이 시기의 특징 가운데 하나인 농업이 나타납니다. 안정적인 식량 공급 덕분에 사람들은 공예와 종교 활동을 발전시킬 여유를 가졌고, 각지의 취락에 문화적 다양성과 사회 제도가 생겨났습니다. 같은 시기 유적에서 화롄산 옥기 등 외래 물품이 자주 출토되어 타이완 각지의 교류가 활발해졌음을 알 수 있습니다."}}, "g03": {"en": {"n": "Iron Age: New Arrivals, or Cultural Change?", "txt": "Around 2,000 years ago parts of Taiwan entered the Iron Age, acquiring iron-smelting technology either independently or through outside contact. Large settlements began to appear, such as the Kiwulan site on the Lanyang Plain, where foreign ships came to trade and imported goods from China, Japan, Korea and South-East Asia have been found. The Iron Age is also the bridge between prehistory and the historical period: the ancestors of many of today's indigenous peoples can be traced to sites of this era. Kiwulan may be where the ancestors of the Kavalan lived, while the Shihsanhang site in New Taipei and the Jiuxianglan site in Taitung may be the remains of Ketagalan and Paiwan ancestors."}, "ja": {"n": "鉄器時代：人々の再到来か、文化変革か", "txt": "今から約2,000年前、台湾の一部地域は鉄器時代に入ります。自発的に、あるいは対外交流を通じて製鉄技術を手に入れた時代です。蘭陽平野の淇武蘭遺跡のような大型集落が現れ、外来の船が交易に訪れ、中国・日本・韓国・東南アジア各地の舶来品が多数出土しています。鉄器時代は先史時代と歴史時代の橋渡しでもあり、今日の台湾先住民の祖先の多くがこの時期の遺跡にさかのぼれます。淇武蘭遺跡はカバラン族の祖先の居住地、新北市の十三行遺跡と台東の旧香蘭遺跡は、それぞれケタガラン族とパイワン族の祖先の遺跡の可能性があります。"}, "ko": {"n": "철기시대: 사람들의 재도래인가, 문화 변혁인가", "txt": "지금으로부터 약 2,000년 전, 타이완 일부 지역은 철기시대로 들어섭니다. 자체적으로 또는 대외 교류를 통해 제철 기술을 갖게 된 시기입니다. 란양평야의 치우란 유적처럼 대형 취락이 나타나고, 외래 선박이 교역하러 와서 중국·일본·한국·동남아시아 각지의 수입품이 다수 출토되었습니다. 철기시대는 선사시대와 역사시대를 잇는 다리이기도 해서, 오늘날 타이완 원주민 조상의 상당수를 이 시기 유적에서 찾을 수 있습니다. 치우란 유적은 카발란족 조상의 거주지였을 가능성이 있고, 신베이의 스산항 유적과 타이둥의 주샹란 유적은 각각 케타갈란족과 파이완족 조상의 유적일 수 있습니다."}}, "g04": {"en": {"n": "The Pulse of Life (Tiyamacan)", "txt": "Besides archaeological finds and written records, indigenous origin legends are also an important way of understanding prehistoric Taiwan. Here the exhibition uses a work by an Amis artist, based on the legend of Tiyamacan told among her people, to open the story of Taiwan from an indigenous point of view.\nLong, long ago, it is said, there was a girl whose body gave off light — Tiyamacan. The son of the sea god fell deeply in love with her and swept her away from her family with a great flood. Tiyamacan is said to have been transformed into thunder, rainbows and all living things, while the family scattered by the flood became the origins of indigenous peoples across Taiwan."}, "ja": {"n": "生命の脈動（ティヤマザン）", "txt": "考古学の発見と文献記録のほかに、先住民の起源伝説も先史時代の台湾を知る重要な手がかりです。ここではアミ族の芸術家が、自らの民族に伝わる伝説「ティヤマザン」をもとに制作した作品によって、先住民の視点から見た台湾の物語の始まりを語ります。\n遠い昔、体が光る少女ティヤマザンがいました。海神の子が彼女に深く魅せられ、大水で家族から引き離してしまいます。以後ティヤマザンは雷鳴や虹、さまざまな生命へと姿を変え、大水で離散した家族は台湾各地の先住民族の起源になったと伝えられています。"}, "ko": {"n": "생명의 맥동(티야마잔)", "txt": "고고학 발견과 문헌 기록 외에 원주민의 기원 전설도 선사시대 타이완을 이해하는 중요한 단서입니다. 여기서는 아미족 예술가가 자신의 부족에 전해지는 전설 '티야마잔'을 바탕으로 만든 작품을 통해 원주민의 시각에서 본 타이완 이야기의 첫 장을 들려줍니다.\n아주 오래전, 몸에서 빛이 나는 소녀 티야마잔이 있었습니다. 바다 신의 아들이 그녀에게 깊이 반해 큰물로 가족에게서 데려갔고, 이후 티야마잔은 천둥과 무지개, 온갖 생명으로 변했으며 큰물에 흩어진 가족은 타이완 각지 원주민 종족의 기원이 되었다고 전해집니다."}}, "g05": {"en": {"n": "World Sea Routes, Converging!", "txt": "This Ming-dynasty chart of the Eastern and Western Oceans shows East Asian sea routes before Westerners arrived. The \"Eastern Ocean route\" ran from Fujian past the Penghu islands, north to the Ryukyus and Japan and south to Luzon and Borneo, making Penghu and Taiwan a hub for passing ships. When the Ming forbade Japanese traders from going to China, Chinese and Japanese merchants and pirates used this route to meet in Taiwan — at places marked on the map as Beigang and Jialilin — for smuggling.\nAfter the 16th century European states came to East Asia in turn. The Dutch rounded the Cape of Good Hope and crossed the Indian Ocean; the Spanish sailed west across the Atlantic to Mexico and then across the Pacific. Each having circled half the globe, they met in Taiwan in the 1620s and set up colonial and commercial bases in the south and north of the island.\nThe cases around us show key goods of the 16th and 17th centuries: raw silk and ceramics from China, silver from Japan and Mexico, spices from South-East Asia. Taiwan's exports were mainly deerskin, deer sinew and venison, along with sulphur, mullet roe and sugar. Salt, iron pots and cloth were what merchants traded with indigenous villages for deer products."}, "ja": {"n": "世界の航路、集結！", "txt": "この明代東西洋航海図は、西洋人が来る前の東アジアの伝統的な海上航路を示しています。「東洋航路」は福建を出て澎湖一帯を経て、北は琉球・日本へ、南はルソン・ボルネオへ向かい、澎湖と台湾は船が行き交う要衝となりました。明朝が日本人の中国大陸での貿易を禁じると、中国・日本の商人や海賊はこの航路をたどり、地図に北港・加里林と記された台湾で落ち合い、密貿易を行いました。\n16世紀以降、ヨーロッパ各国が相次いで東アジアに来ます。オランダ人はアフリカ南端の喜望峰を回りインド洋を経て東方へ、スペイン人は大西洋を西に渡ってメキシコへ、さらに太平洋を越えてアジアへ。それぞれ地球を半周し、17世紀20年代に台湾で出会い、島の南北にそれぞれ植民・商業拠点を築きました。\n周囲の展示ケースには、16・17世紀に台湾周辺海域で取引された主要な商品が並びます。中国の生糸・陶磁器、日本とメキシコの銀、東南アジアの香辛料。当時の台湾の産品は鹿皮・鹿筋・鹿肉が中心で、硫黄・カラスミ・砂糖なども含まれました。塩・鉄鍋・布は、商人が先住民の集落と鹿製品を取引する際によく使われた商品です。"}, "ko": {"n": "세계 항로, 집결!", "txt": "이 명대 동서양 항해도는 서양인이 오기 전 동아시아의 전통 해상 항로를 보여 줍니다. '동양 항로'는 푸젠에서 출발해 펑후 일대를 지나 북으로는 류큐와 일본, 남으로는 루손과 보르네오로 향했고, 펑후와 타이완은 배가 오가는 요충지가 되었습니다. 명 조정이 일본인의 중국 무역을 금하자 중국과 일본의 상인·해적은 이 항로를 따라 지도에 베이강, 자리린으로 표시된 타이완에서 만나 밀무역을 했습니다.\n16세기 이후 유럽 각국이 잇따라 동아시아로 왔습니다. 네덜란드인은 아프리카 남단 희망봉을 돌아 인도양을 거쳐 동방으로, 스페인인은 대서양을 서쪽으로 건너 멕시코로 간 뒤 다시 태평양을 건너 아시아로 왔습니다. 각각 지구를 반 바퀴 돌아 17세기 1620년대에 타이완에서 만났고, 섬의 남쪽과 북쪽에 각각 식민·상업 거점을 세웠습니다.\n주위 전시장에는 16~17세기 타이완 주변 해역에서 거래된 주요 상품이 놓여 있습니다. 중국의 생사와 도자기, 일본과 멕시코의 은, 동남아시아의 향신료입니다. 당시 타이완의 산물은 사슴 가죽·힘줄·고기가 중심이었고 유황, 어란, 설탕 등도 있었습니다. 소금·무쇠솥·직물은 상인이 원주민 마을과 사슴 제품을 거래할 때 쓰던 상품입니다."}}, "g06": {"en": {"n": "People of Many Nations Who Landed in Taiwan", "txt": "On show here are early maps and books of Taiwan, one of the museum's distinctive collections; each records a particular history and its context. In the early 17th century the long war between the Dutch and the Spanish in Europe spread to Asia. To strike at Spanish trade with China and Japan, the Dutch occupied Dayuan in southern Taiwan in 1624, ahead of the Spanish, as a base for trade and for cutting the route between the Chinese coast and Spanish Manila. The Spanish answered by occupying the Keelung and Tamsui area in 1626. This Spanish map of the Dutch harbour on Isla Hermosa was drawn after the Spanish took Keelung, using intelligence from someone who had served the Dutch East India Company and knew Dayuan well. It was meant for an attack on the Dutch base, which storms and weather prevented. Years later, with trade in decline, the Spanish could no longer hold their Taiwan posts and were finally defeated by the Dutch in 1642.\nThough its original purpose was never fulfilled, the map leaves us a precious record of life around the Taijiang inner sea in the 17th century: the Dutch Fort Zeelandia, Chinese traders near the moored ships at Beixianwei, and along the inner shore, besides the Dutch fortress, the villages of Soulang, Backloun and Mattau and settlements of Chinese and Japanese, with deer hunting visible outside them."}, "ja": {"n": "台湾に上陸した各国の人々", "txt": "ここには当館の特色あるコレクションの一つ、初期台湾の地図と書籍が多数展示されています。一枚一枚が特別な歴史とその時代背景を記録しています。17世紀初頭、ヨーロッパで長く続いたオランダとスペインの戦争はアジアにも及びました。オランダはスペインと中国・日本との貿易を打撃するため、1626年のスペインに先んじて1624年に台湾南部の大員を占領し、貿易と、明朝沿海とマニラのスペイン人を結ぶ航路を断つ拠点としました。これに応じてスペインは1626年に鶏籠・淡水一帯を占領します。このスペイン人が描いた「エルモサ島のオランダ港図」は、鶏籠占領後、オランダ東インド会社に仕えて大員の地理に詳しい人物の情報をもとに描かれた台江内海周辺の地図です。オランダの拠点攻撃に用いる予定でしたが、暴風などの気象条件により進攻は実現しませんでした。数年後、商業の不振でスペインは台湾の拠点を維持できず、1642年にオランダに敗れて台湾から撤退します。\n当初の目的は果たせませんでしたが、この地図は17世紀の台江内海周辺の生活空間に関する貴重な記録を残しました。オランダ人のゼーランディア城、船が停泊する北線尾付近に交易に来る漢人、内海沿岸にはオランダ人の要塞のほか、蕭壠社・目加溜灣社・麻豆社と漢人・日本人の集落、その外では鹿狩りの光景も見てとれます。"}, "ko": {"n": "타이완에 상륙한 여러 나라 사람들", "txt": "이곳에는 박물관의 대표 소장품 가운데 하나인 초기 타이완 지도와 서적이 다수 전시되어 있습니다. 한 장 한 장이 저마다의 역사와 시대 배경을 담고 있습니다. 17세기 초 유럽에서 오래 이어진 네덜란드와 스페인의 전쟁은 아시아까지 번졌습니다. 네덜란드는 스페인과 중국·일본의 교역을 끊기 위해 스페인보다 앞선 1624년 타이완 남부 다위안을 점령해 교역 거점이자 명나라 연안과 마닐라 스페인인을 잇는 항로를 차단하는 기지로 삼았습니다. 이에 맞서 스페인은 1626년 지룽과 단수이 일대를 점령했습니다. 이 스페인인이 그린 '에르모사섬 네덜란드 항구도'는 지룽 점령 뒤, 네덜란드 동인도회사에서 일해 다위안 지리에 밝았던 사람의 정보를 바탕으로 그린 타이장 내해 주변 지도입니다. 네덜란드 거점 공격에 쓰려 했으나 폭풍 등 기상 탓에 진공은 이루어지지 않았습니다. 몇 해 뒤 상업 부진으로 스페인은 타이완 거점을 유지하지 못하고 1642년 네덜란드에 패해 타이완에서 물러났습니다.\n본래 목적은 이루지 못했지만 이 지도는 17세기 타이장 내해 주변 생활 공간에 관한 귀중한 기록을 남겼습니다. 네덜란드의 제일란디아성, 배가 정박한 베이셴웨이 부근에서 교역하는 한족, 내해 연안에는 네덜란드 요새 외에 샤오룽사·무자류완사·마더우사와 한족·일본인 취락이 있고, 그 바깥으로는 사슴 사냥 장면도 보입니다."}}, "g07": {"en": {"n": "Indigenous Peoples Caught in the Contest", "txt": "As Chinese, Japanese, Dutch and Spanish arrived one after another, indigenous society in Taiwan was greatly affected. Facing outsiders, each community actively chose the allies that suited it, and also came into conflict with hostile forces. Different groups had their own calculations: sometimes at odds, sometimes in unstable alliance. The outsiders quarrelled among themselves as well. For indigenous peoples the arrival of outsiders was not only a challenge but at times an opportunity, and communities often drew on outside power as circumstances allowed to raise their own standing. This history is therefore not the familiar image of \"powerful Europeans versus weak indigenous people\", but a dynamic story of weighing, negotiating, clashing and cooperating.\nBeyond relations between indigenous peoples and outside powers, the outsiders competed fiercely among themselves. As Dutch influence in Taiwan grew, it immediately clashed with the interests of the Chinese and Japanese who had come earlier. The Hamada Yahyoe incident even grew into an international trade dispute between the Dutch and Japan, and only after the Dutch backed down did Japan reopen trade with them."}, "ja": {"n": "勢力争いに巻き込まれた先住民", "txt": "漢人・日本人・オランダ人・スペイン人が相次いで到来し、台湾の先住民社会は少なからぬ影響を受けました。外来者に対して、先住民の各部落は自らに有利な同盟相手を主体的に選び、敵対する勢力とは衝突も起こしました。異なる集団にはそれぞれの思惑があり、時に反目し、時に不安定な同盟を保ちました。外来の集団どうしにも対立や衝突があります。先住民にとって外来者の出現は挑戦であると同時に、時には機会でもありました。各部落は状況に応じて外来勢力を引き込み、自らの威信を高めようとしたのです。ですからこの歴史は「強大なヨーロッパ人 対 弱い先住民」という既成のイメージではなく、互いに駆け引きし、調整し、あるいは衝突し協力する動的な歴史でした。\n先住民と外来勢力の関係のほか、外来集団どうしも激しく競い合いました。オランダの勢力が台湾で拡大すると、先に来ていた漢人・日本人と利害が衝突します。なかでも浜田弥兵衛事件はオランダと日本の国際貿易紛争にまで発展し、最後はオランダが折れて日本が対オランダ貿易を再開しました。"}, "ko": {"n": "세력 다툼에 휘말린 원주민", "txt": "한족·일본인·네덜란드인·스페인인이 잇따라 들어오면서 타이완 원주민 사회는 적지 않은 영향을 받았습니다. 외부인을 마주한 원주민 부락들은 자신에게 유리한 동맹 상대를 주체적으로 골랐고, 적대 세력과는 충돌하기도 했습니다. 서로 다른 집단은 저마다 계산이 있어 때로는 반목하고 때로는 불안정한 동맹을 유지했습니다. 외부 집단끼리도 갈등과 충돌이 있었습니다. 원주민에게 외부인의 등장은 도전인 동시에 때로는 기회이기도 했습니다. 부락들은 상황에 따라 외부 세력을 끌어들여 자신의 위상을 높이려 했습니다. 따라서 이 역사는 '강대한 유럽인 대 약한 원주민'이라는 익숙한 이미지가 아니라, 서로 저울질하고 조정하거나 충돌하고 협력하는 역동적인 역사였습니다.\n원주민과 외부 세력의 관계 외에 외부 집단끼리도 치열하게 경쟁했습니다. 네덜란드 세력이 타이완에서 커지자 먼저 와 있던 한족·일본인과 이해가 충돌했습니다. 그중 하마다 야효에 사건은 네덜란드와 일본 사이의 국제 무역 분쟁으로까지 번졌고, 결국 네덜란드가 물러선 뒤에야 일본이 대네덜란드 무역을 재개했습니다."}}, "g08": {"en": {"n": "From Sea to Land: A Turn of Regimes", "txt": "In 1662, after failing in his resistance to the Qing in south-eastern China, Koxinga crossed the sea to attack Taiwan. Following a nine-month siege of Fort Zeelandia, the Dutch and the Zheng signed a treaty and the Dutch formally withdrew from Taiwan. The Zheng regime that replaced them built a society with Han Chinese at its centre, but since the Zheng had always been a maritime group they still valued sea trade and kept close commercial ties with countries across the seas.\nThis lasted until 1683, when the Qing sent Shi Lang, whose forces defeated the Zheng at the naval battle of Penghu and brought Taiwan into the Qing empire. Qing rule turned Taiwan from a sea-facing maritime regime and culture into a land-based Qing territory: trade shifted from international commerce to cross-strait trade, and the thread of Taiwan's cultural development turned from the sea towards the land."}, "ja": {"n": "海から陸へ：政権の転換", "txt": "1662年、中国大陸東南部での抗清に失敗した鄭成功が海を渡って台湾を攻めました。ゼーランディア城を9か月包囲したのち、オランダと鄭氏が条約を結び、オランダは正式に台湾から撤退します。オランダに代わった鄭氏政権は漢人を主体とする社会を築きましたが、もともと海上で活動した集団だったため海上貿易を重視し、海を越えた各国と緊密な交易関係を保ちました。\nこの状況は、1683年に清朝が施琅を派遣し澎湖海戦で鄭氏を破り、台湾を清朝の版図に組み入れるまで続きます。清朝の統治により台湾は、海に向かう海洋政権・海洋文化から、陸を基盤とする清朝の領地へと変わりました。商業は国際貿易から両岸貿易中心へと移り、台湾の文化的発展の文脈も海から陸へと向かっていきます。"}, "ko": {"n": "바다에서 뭍으로: 정권의 전환", "txt": "1662년, 중국 대륙 동남부에서 청에 맞선 싸움에 실패한 정성공이 바다를 건너 타이완을 공격했습니다. 제일란디아성을 아홉 달 포위한 끝에 네덜란드와 정씨가 조약을 맺었고 네덜란드는 공식적으로 타이완에서 물러났습니다. 네덜란드를 대신한 정씨 정권은 한족을 중심으로 한 사회를 세웠지만, 본래 바다에서 활동하던 집단이었기에 해상 무역을 여전히 중시하며 바다 건너 여러 나라와 긴밀한 교역 관계를 유지했습니다.\n이러한 상황은 1683년 청나라가 시랑을 보내 펑후 해전에서 정씨를 물리치고 타이완을 청의 판도에 편입할 때까지 이어집니다. 청의 통치로 타이완은 바다를 향한 해양 정권·해양 문화에서 뭍을 기반으로 한 청의 영토로 바뀌었습니다. 교역은 국제 무역에서 양안 무역 중심으로 옮겨 갔고, 타이완 문화 발전의 맥락도 바다에서 뭍으로 향하게 되었습니다."}}, "g09": {"en": {"n": "The Taiwan Dream of People from Tangshan", "txt": "Once Taiwan was taken into the Qing empire, people from the densely populated provinces of Fujian and Guangdong moved here one after another. Taiwan was then thinly settled with much uncultivated land, which was very attractive to migrants. To prevent too many migrants from becoming hard to control, the Qing government laid down a complicated set of crossing policies, and the Taiwan Strait — known as the \"Black Ditch\" — was treacherous, making the voyage difficult and dangerous. Even so Han migrants kept coming, legally by application or illegally by stowing away, in search of the \"Taiwan dream\" in which \"money in Taiwan floods your ankles\".\nThe red-headed junk on our left was the main means of transport carrying goods and migrants across the strait in the Qing period. In the hold near the bow you can see several stowaways peering out, looking for a chance to slip ashore; they stand for the many Han migrants who came illegally. At the stern is a Han couple who crossed legally. We often hear that migrants in the Qing period could not bring their families and that only single men could come, but the rules were not consistent: over more than two centuries of Qing rule the crossing ban was repeatedly adjusted — sometimes families could come, sometimes they could be sent for — and the policy wavered. With the Qing government's limited power in Taiwan, it could not stop large-scale Han migration, which changed the make-up of Taiwan's population and the direction of its social and cultural development."}, "ja": {"n": "唐山人の台湾の夢", "txt": "台湾が清朝の版図に入ると、人口の多い福建・広東の人々が次々と台湾へ移り住みました。当時の台湾は人が少なく未開墾の土地が広がっており、移民にとって大きな魅力でした。ただし清朝政府は、移民が増えすぎて統制が難しくなるのを避けるため煩雑な渡台政策を定め、「黒水溝」と呼ばれた台湾海峡は海象が険しく、渡海は困難と危険に満ちていました。それでも漢人移民は絶えず、合法的な申請で、あるいは非合法の密航で台湾へ渡り、「台湾の金はくるぶしまで溢れる」という「台湾の夢」を求めました。\n左手の紅頭船は、清朝統治期に各種の商品と移民を台湾海峡の両岸で運んだ最も主要な交通手段です。船首付近の船倉には、こっそり外をうかがう密航者たちの姿が見えます。上陸の機会をうかがう彼らは、当時大量に非合法で渡台した漢人移民を象徴しています。船尾には合法的に渡海した漢人の夫婦がいます。清朝統治期の移民は家族を連れて来られず独身男性しか渡台できなかったとよく言われますが、規定は一定ではありませんでした。清朝統治の200年あまりのあいだ渡台禁令の内容は何度も調整され、家族同伴が認められたり呼び寄せが認められたりと、政策は揺れ動きます。加えて台湾における清朝の力は限られており、大量の漢人移民を止めることはできませんでした。これが台湾の人口構成と社会文化の方向を大きく変えたのです。"}, "ko": {"n": "탕산 사람들의 타이완 드림", "txt": "타이완이 청의 판도에 들어가자 인구가 많은 푸젠성과 광둥성 사람들이 잇따라 타이완으로 이주했습니다. 당시 타이완은 사람이 적고 미개간지가 넓어 이민자에게 큰 매력이었습니다. 다만 청 정부는 이민이 지나치게 늘어 통제가 어려워지는 것을 막으려 복잡한 도항 정책을 두었고, '헤이수이거우'라 불린 타이완 해협은 바닷길이 험해 건너오는 일 자체가 어렵고 위험했습니다. 그럼에도 한족 이민은 끊이지 않아, 합법적인 신청으로 또는 밀항으로 타이완에 와서 '타이완의 돈이 발목까지 찬다'는 '타이완 드림'을 좇았습니다.\n왼편의 훙터우촨은 청 통치기에 각종 상품과 이민자를 해협 양안으로 실어 나른 가장 주요한 교통수단입니다. 뱃머리 쪽 선창에는 몰래 밖을 내다보는 밀항자들이 보입니다. 상륙할 기회를 엿보는 이들은 당시 대거 불법으로 건너온 한족 이민자를 상징합니다. 배 뒤쪽에는 합법적으로 바다를 건넌 한족 부부가 있습니다. 청 통치기 이민자는 가족을 데려올 수 없고 홀몸의 남성만 올 수 있었다고 흔히 말하지만, 규정이 한결같지는 않았습니다. 청의 200여 년 통치 동안 도항 금령의 내용은 거듭 조정되어 가족 동반이 허용되기도, 가족을 불러오는 일이 허용되기도 하며 정책이 흔들렸습니다. 게다가 타이완에서 청의 힘은 제한적이어서 대규모 한족 이민을 막지 못했고, 이는 타이완의 인구 구성과 사회·문화 발전의 방향을 바꾸어 놓았습니다."}}, "g10": {"en": {"n": "Meeting the Qing", "txt": "When indigenous peoples encountered Qing rule, each responded differently. Most communities in the western half of the island paid taxes and provided labour to the Qing and were called \"cooked savages\" by the government; in the Illustrations of Tributary Peoples they appear on the right. Most communities in the mountains and the eastern half kept their autonomy and did not submit to the Qing, and were called \"raw savages\", appearing towards the left; there was also an intermediate category of \"naturalised raw savages\".\nThe Qing regarded the \"cooked savages\" as obedient and more familiar with civilisation, and in texts and images they were often described as natural, simple people of an ancient society. These communities interacted frequently with Han Chinese in daily life and trade, and their clothing and utensils were also much influenced by the Han. Here you can see the Expanded Instructions on the Sacred Edict, used to \"civilise\" society in the Qing period, the community teachers placed in indigenous villages, and a register matching indigenous people with Han surnames — all records of how indigenous communities, mainly \"cooked savages\", faced and adapted to Qing rule and Han migration.\nTo separate Han Chinese and \"cooked savages\" from the \"raw savages\" who lived beyond Qing control, and to stop Han Chinese from entering the mountains and creating unrest, the authorities drew a \"savage boundary\", with boundary stones, earth-ox mounds and ditches forbidding Han Chinese to cross. Yet the land and resources beyond still drew many Han migrants across, so the authorities repeatedly redrew the boundary — each time further east. The red and blue lines on the boundary map represent two adjustments in the first half of the 18th century, showing how people in the west kept pushing eastward."}, "ja": {"n": "清朝との出会い", "txt": "先住民が清朝の統治に直面したとき、それぞれ異なる対応をとりました。西半部の多くの社群は清朝に納税し労役を提供し、政府から「熟番」と呼ばれ、『職貢図』では右寄りに描かれています。山地と東半部の多くの社群は部落の自主を保ち清朝に属さなかったため「生番」と呼ばれ、『職貢図』では左寄りに位置します。さらに両者の中間として「帰化生番」という分類もありました。\n清朝の人々は「熟番」を従順で文明に通じた先住民社群とみなし、文献や図像ではしばしば上古の社会に生きる自然で素朴な人々として描きました。これらの社群は居住生活や売買・交易などで漢人と頻繁に交流し、衣服や器物も漢人の影響を強く受けています。ここでは清朝統治期に社会を「教化」するために用いられた『聖諭広訓衍』、先住民の集落に置かれた社師、先住民が漢姓に改めた対照簿を見ることができ、いずれも熟番を中心とする先住民社群が清朝の統治と漢人移民に直面した状況と適応を記録しています。\n漢人・熟番と、清政府の統制外に暮らす「化外」の生番とを区分し、同時に漢人が山地に入って治安問題を起こすのを防ぐため、官府は「番界」を設けて隔離し、界碑・土牛堆・壕溝などを築いて漢人の越境を禁じました。しかし界外の土地と資源は依然として多くの漢人移民を引き寄せ、官府は「番界」の位置を何度も改めます。改めるたびに境界線はさらに東へ移りました。番界図に見える赤と青の2本の境界線は、18世紀前半の2度の調整を表し、西部の人々が絶えず東へ押し進んだ趨勢を映しています。"}, "ko": {"n": "청나라와의 만남", "txt": "원주민이 청의 통치를 마주했을 때 저마다 다른 방식으로 대응했습니다. 서쪽 지역의 다수 집단은 청에 세금을 내고 노역을 제공해 정부로부터 '숙번'이라 불렸고, 『직공도』에서는 오른쪽에 그려져 있습니다. 산간과 동쪽 지역의 다수 집단은 부락의 자율을 유지하며 청에 속하지 않아 '생번'이라 불렸고 『직공도』에서는 왼쪽에 있습니다. 그 중간에는 '귀화생번'이라는 분류도 있었습니다.\n청나라 사람들은 '숙번'을 순종적이고 문명에 익숙한 원주민 집단으로 여겼고, 문헌과 그림에서는 흔히 상고 사회의 자연스럽고 소박한 사람으로 묘사했습니다. 이들 집단은 거주 생활과 매매·교역에서 한족과 자주 교류했고 복식과 기물도 한족의 영향을 많이 받았습니다. 이곳에서는 청 통치기에 사회를 '교화'하는 데 쓰인 『성유광훈연』, 원주민 취락에 둔 사사(社師), 원주민이 한족 성씨로 바꾼 대조부를 볼 수 있습니다. 모두 숙번을 중심으로 한 원주민 집단이 청의 통치와 한족 이민을 맞아 처했던 상황과 적응을 보여 줍니다.\n한족·숙번과, 청 정부의 통제 밖에 사는 '화외'의 생번을 구분하고 동시에 한족이 산지에 들어가 치안 문제를 일으키는 것을 막기 위해 관청은 '번계'를 그어 격리하고 경계비·토우더미·해자 등을 만들어 한족의 월경을 금했습니다. 그러나 경계 밖의 땅과 자원은 여전히 많은 한족 이민자를 끌어들였고, 관청은 '번계'의 위치를 거듭 고쳤습니다. 고칠 때마다 경계선은 더 동쪽으로 옮겨 갔습니다. 번계도에 보이는 붉은 선과 푸른 선은 18세기 전반의 두 차례 조정을 나타내며, 서부 사람들이 끊임없이 동쪽으로 밀고 나아간 흐름을 보여 줍니다."}}, "g11": {"en": {"n": "The Kongkai", "txt": "Where peoples meet and mingle, traces of cultural interweaving are left in language, belief, material culture and daily life. The building you have turned to see is an early kongkai, reconstructed by the museum from the records of 19th-century Western travellers. The kongkai was where the Siraya and Makatao held religious ceremonies and discussed community affairs; people believed ancestral spirits could work through the water in these jars to protect them.\nLooking a little ahead, the case on the right is unusual: the museum invited elders of the Toushe community to come and install this display about their own beliefs. Here you can see jars, pig skulls and other important objects that also appeared in the kongkai. Note the ritual flags behind them, whose designs show that many Han elements such as Taoist talismans have been absorbed."}, "ja": {"n": "公廨", "txt": "人々が絶えず接触し交わる過程で、言語・信仰・物質文化や生活文化にさまざまな文化の交錯の跡が残ります。振り向いて見えるこの建物は、19世紀の西洋の旅行家の記録をもとに博物館が再現した初期の公廨です。公廨はシラヤ族・マカタオ族が宗教儀礼を行い、人々が議事を行う場でした。族人は祖霊がこれらの壺の中の水を通して霊力を発揮し、自分たちを守ってくれると信じていました。\n少し前を見ると、右手にとても特別な展示ケースがあります。博物館が頭社の先住民の長老を招き、自らの手でその社の信仰に関する展示を設えてもらったものです。ここには壺や豚の頭骨など、先ほどの公廨にもあった重要な品が見られます。注目すべきはそれらの背後にある祭祀用の旗で、その内容からは道教の符呪など漢人文化の要素が少なからず取り入れられていることがわかります。"}, "ko": {"n": "공해(公廨)", "txt": "사람들이 끊임없이 접촉하고 어우러지는 과정에서 언어·신앙·물질문화와 생활문화에 여러 문화가 뒤섞인 흔적이 남습니다. 돌아서면 보이는 이 건물은 19세기 서양 여행가의 기록을 바탕으로 박물관이 재현한 초기의 공해입니다. 공해는 시라야족과 마카타오족이 종교 의례를 치르고 사람들이 함께 의논하던 장소였습니다. 사람들은 조상의 영이 이 항아리 속 물을 통해 영력을 발휘해 자신들을 지켜 준다고 믿었습니다.\n조금 앞을 보면 오른편에 매우 특별한 전시 진열장이 있습니다. 박물관이 터우서 원주민 어르신들을 모셔, 그 마을의 신앙에 관한 전시를 직접 꾸미도록 한 것입니다. 이곳에서는 항아리와 돼지 두개골 등 앞서 공해에도 있던 중요한 물건들을 볼 수 있습니다. 눈여겨볼 것은 그 뒤에 있는 제사용 깃발로, 그 내용에서 도교 부적 같은 한족 문화 요소가 적지 않게 들어왔음을 알 수 있습니다."}}, "g12": {"en": {"n": "Life Stories of the Plains Indigenous People", "txt": "When Taiwan's plains indigenous communities met the new challenges and social order brought by Han society and the Qing authorities, they made many different choices and responses, which brought different fates to their communities. Pan Dun, also called Pan Dunzai, in the portrait, was a leader of the Pazeh Anli community in central Taiwan. Under his leadership Anli repeatedly helped the Qing government put down unrest, earning him military merit and office while bringing his people closer to the authorities; by exchanging land for water rights and similar means he also introduced wet-rice farming technology, raising the community's yields. These changes altered the community's traditional way of life, yet also won it better conditions for development.\nThe court robe beside it belonged to another leader who chose to work with the Qing authorities: Pan Tapili of the Aoran community in Nantou. In the 19th century he served as a qianzong, helping the Qing government manage affairs of the \"cooked savage\" communities in the Puli area and guard the savage boundary. On the square rank badge on the chest of his robe you can see the leopard pattern that marks a sixth-rank military officer."}, "ja": {"n": "平埔先住民の人生の物語", "txt": "台湾の平埔先住民の社群は、漢人社会と清朝の官府がもたらした新たな挑戦と社会秩序に直面したとき、さまざまな選択と対応を行い、それが部落に異なる境遇をもたらしました。肖像画の潘敦（潘敦仔とも）は、中部パゼッヘ族岸裡社の頭人です。彼の指導のもと、岸裡社は清朝政府の各地の騒乱平定に幾度も協力し、自らは軍功と職位を得るとともに、族人と官府との距離を縮めました。さらに割地換水などの方法で水田耕作の技術を導入し、部落の農作物の生産量を高めます。これらは部落の伝統的な生活形態を変えましたが、同時により良い発展条件を勝ち取ることにもなりました。\nその隣の補服は、清朝の官府との協力を選んだもう一人の頭人、南投烏牛欄社の潘踏比厘のものです。彼は19世紀に千総の職を務め、清朝政府が埔里地域の「熟番」社群の事務を処理し番界線を守るのを助けました。官服の胸の四角い補子には、六品の武官を表す「彪」の文様が見られます。"}, "ko": {"n": "평포 원주민의 인생 이야기", "txt": "타이완의 평포 원주민 집단은 한족 사회와 청 관청이 가져온 새로운 도전과 사회 질서를 마주하며 여러 다른 선택과 대응을 했고, 그것이 부락에 서로 다른 처지를 가져왔습니다. 초상화 속 판둔(판둔자이라고도 함)은 중부 파제흐족 안리사의 두인이었습니다. 그의 지도 아래 안리사는 청 정부의 각지 반란 평정에 여러 차례 협력해 스스로 군공과 관직을 얻는 한편 부족민과 관청의 거리를 좁혔습니다. 또한 땅을 내주고 물을 얻는 방식 등으로 논농사 기술을 들여와 부락의 농작물 생산량을 높였습니다. 이는 부락의 전통적인 생활 형태를 바꾸었지만 동시에 더 나은 발전 조건을 얻게 해 주었습니다.\n옆의 보복(補服)은 청 관청과의 협력을 택한 또 다른 두인, 난터우 우뉴란사의 판타비리의 것입니다. 그는 19세기에 천총 직을 맡아 청 정부가 푸리 지역 '숙번' 집단의 사무를 처리하고 번계선을 지키는 일을 도왔습니다. 관복 가슴의 네모난 보자에는 6품 무관을 뜻하는 '표(彪)' 무늬가 보입니다."}}, "g13": {"en": {"n": "Signing a Land Lease", "txt": "This scene re-enacts a plains indigenous landlord and a Han tenant signing a land contract in the Qing period. Of the four people, besides the two parties — the landlord and the tenant — there would usually also be a Han scrivener to help write the contract, and an interpreter or headman of the plains village to witness that it had been concluded, described as \"present\" or \"having seen and known\". Such scenes stand for the process by which Taiwan's land passed, bit by bit, into Han hands. Apart from a very few \"savage landlords\" who were already the leading class in their communities and grew rich by renting land to Han farmers, many indigenous people gradually lost their land in this social transformation and were forced to leave for distant places to find a new home."}, "ja": {"n": "契約を結んで土地を貸す", "txt": "これは清朝統治期に、平埔先住民の地主と漢人の小作人が土地契約を結ぶ場面を再現したものです。場にいる4人のうち、契約を交わす当事者である地主と借地人のほかに、通常は契約書を書くのを助ける漢人の代書が1人、さらに契約成立を見届ける平埔の村社の通事や土目がおり、「在場」「知見」と呼ばれました。こうした場面は、台湾の土地が少しずつ漢人の手に渡っていく過程を象徴しています。もともと部落の指導層であったごく少数の「番頭家」が、漢人に土地を貸して地代で富を得た例を除けば、多くの先住民はこの社会変革のなかで次第に元の土地を失い、新たな故郷を求めて遠く移り住むことを余儀なくされました。"}, "ko": {"n": "계약을 맺고 땅을 빌려주다", "txt": "이것은 청 통치기에 평포 원주민 지주와 한족 소작인이 토지 계약을 맺는 장면을 재현한 것입니다. 네 사람 가운데 계약 당사자인 지주와 소작인 외에, 보통 계약서 작성을 돕는 한족 대서인이 한 명 있고, 계약 성립을 지켜보는 평포 마을의 통사나 토목이 있어 '재장(在場)' 또는 '지견(知見)'이라 불렸습니다. 이런 장면은 타이완의 땅이 조금씩 한족의 손으로 넘어간 과정을 상징합니다. 본래 부락의 지도층이었던 극소수 '번두가'가 한족에게 땅을 빌려주고 소작료로 부를 쌓은 경우를 빼면, 많은 원주민은 이 사회 변화 속에서 점차 본래의 땅을 잃고 새로운 터전을 찾아 멀리 떠나야 했습니다."}}, "g14": {"en": {"n": "Regional Society", "txt": "From here the exhibition tells how Qing-period Taiwanese society, responding to different natural conditions in each area and to the customs migrants brought from their home regions, and hampered by poor transport that made exchange between regions difficult, developed different industries and ways of life from place to place. On the right of the hall are the coast, the plains, the hills and the \"back mountains\" in turn; on the left is the rise of commercial towns. Each introduces the character of a regional society, highlighting the wisdom of earlier generations who \"ate from the mountains when they lived by the mountains, and from the sea when they lived by the sea\".\nThe religious procession in the middle speaks of a religious culture that, unlike the diverse regional societies, crossed regions and peoples. Religious belief was the most important spiritual support for Taiwan's migrant society as it faced an unfamiliar environment and an unknowable future. Crossing the Black Ditch, migrants often carried deities from their home towns with them to pray for safety, and once settled in Taiwan they built temples to thank the gods for their protection. These traditional beliefs have survived the changes of era, and the religious processions held every year across Taiwan have long been an indispensable part of Taiwanese culture. The rear half of the procession here belongs to the Wangye faith, charged chiefly with driving away plague, while the front half belongs to the Mazu faith, which keeps the sea routes calm."}, "ja": {"n": "地域社会", "txt": "ここから展示は、清朝統治期の台湾社会が各地の異なる自然条件と、移民が故郷から持ち込んだ生活習慣、さらに当時の交通の不便さによる地域間交流の難しさから、地域ごとに異なる産業と生活様式を形づくっていったことを語ります。展示室の右手には沿海・平原・丘陵・後山の4つの地域が順に展示され、左手には商業都市の勃興が示されます。それぞれ地域社会の発展の特色を紹介し、「山に拠れば山を食み、海に拠れば海を食む」という先人の知恵を際立たせています。\n中央の宗教の遶境（巡行）の行列は、多様な地域社会に対して、地域と族群を越えて現れた宗教文化を語ります。宗教信仰は、不慣れな新しい環境と見通せない未来に向き合う台湾の移民社会にとって、最も重要な心の拠り所でした。黒水溝を渡るとき、移民は無事を祈って故郷の神を身につけて携え、台湾に根を下ろしたのち廟を建てて神の加護に報いようとしました。これらの伝統的信仰は時代の移り変わりの試練を越え、今も香火が絶えません。毎年台湾各地で行われる宗教遶境は、すでに台湾文化に欠かせない一部となっています。ここの行列の後半は主に疫病を祓う王爺信仰、前半は海路の平安を司る媽祖信仰です。"}, "ko": {"n": "지역 사회", "txt": "여기서부터 전시는 청 통치기 타이완 사회가 각지의 서로 다른 자연 조건과 이민자들이 고향에서 가져온 생활 습관, 그리고 당시 교통이 불편해 지역 간 교류가 어려웠던 사정 때문에 지역마다 다른 산업과 생활 방식을 이루게 된 과정을 들려줍니다. 전시실 오른편에는 해안·평야·구릉·후산 네 지역이 차례로 전시되고, 왼편에는 상업 도시의 부상이 소개됩니다. 각각 지역 사회의 발전 특색을 소개하며 '산에 기대면 산을 먹고, 바다에 기대면 바다를 먹는다'는 선인들의 지혜를 보여 줍니다.\n가운데 종교 행렬은 다양한 지역 사회와 대비되어, 지역과 종족을 넘어 나타난 종교 문화를 이야기합니다. 종교 신앙은 낯선 환경과 알 수 없는 미래를 마주한 타이완 이민 사회에 가장 중요한 마음의 의지처였습니다. 헤이수이거우를 건널 때 이민자들은 무사를 빌며 고향의 신을 몸에 지니고 왔고, 타이완에 자리 잡은 뒤에는 사당을 지어 신의 가호에 보답했습니다. 이런 전통 신앙은 시대의 변화를 견뎌 지금도 향불이 끊이지 않으며, 해마다 타이완 각지에서 열리는 종교 행렬은 이미 타이완 문화에 빼놓을 수 없는 일부가 되었습니다. 이곳 행렬의 뒷부분은 주로 역병을 쫓는 왕야 신앙이고, 앞부분은 바닷길의 평안을 맡는 마조 신앙입니다."}}, "g15": {"en": {"n": "The Coast", "txt": "First we come to the coastal region. Because the soil along Taiwan's coast is poor and fishing was limited by the tools and climate of the time, coastal people developed a distinctive way of life, combining several modes of production to make up for what nature did not provide. In Penghu, for example, people used the local reef terrain and porous stone to build large stone weirs in the intertidal zone, catching fish that came and went with the tides. Along the south-western coast of Taiwan proper, people built fish ponds in lagoons, wetlands and river mouths for aquaculture. With plenty of sunshine, the area was also suited to making salt, and field after field of salt pans turned \"white water\" into \"salty gold\" — this has long been one of Taiwan's most important salt-producing regions."}, "ja": {"n": "沿海（展示パネルなし）", "txt": "まず沿海地域に来ました。台湾の沿海部は土地が痩せており、漁撈も当時の道具と気候環境に制約されたため、沿海の住民は多様な生産方法を組み合わせて自然条件の不足を補う、独特の生活形態を発展させました。たとえば澎湖の住民は、現地の礁岸地形と多孔質の石材を利用して、潮間帯に大型の「石滬」を築き、潮の満ち引きという自然現象を利用して潮とともに来る魚群を捕らえました。台湾本島の南西沿海では、潟湖・湿地・河口などに魚塭（養魚池）を築いて養殖漁業を営みました。またこの地域は日照が豊かで塩作りに適しており、一区画ごとの塩田が「白い水」を「塩の金」に変え、古くから台湾の重要な塩の産地となってきました。"}, "ko": {"n": "해안(전시 패널 없음)", "txt": "먼저 해안 지역에 왔습니다. 타이완 해안 지역은 땅이 척박하고 어로도 당시의 도구와 기후 환경에 제약을 받았기에, 해안 주민들은 여러 생산 방식을 결합해 자연 조건의 부족을 메우는 독특한 생활 형태를 발전시켰습니다. 예를 들어 펑후 주민들은 현지의 암초 지형과 구멍 많은 돌을 이용해 조간대에 커다란 '석호(石滬)'를 쌓고, 밀물과 썰물이라는 자연 현상을 이용해 조수와 함께 오가는 물고기 떼를 잡았습니다. 타이완 본섬 서남 해안에서는 석호(潟湖)·습지·하구 등에 양어장을 만들어 양식 어업을 했습니다. 또 이 지역은 일조량이 풍부해 소금 만들기에 알맞아, 구역마다 펼쳐진 염전이 '흰 물'을 '짠 금'으로 바꾸며 오래도록 타이완의 중요한 소금 산지였습니다."}}, "g16": {"en": {"n": "The Plains: From Deer Field to Farmland", "txt": "The main crops of Taiwan's plains were rice and sugarcane, and their development in the Qing period was strongly shaped by market demand. The Dutch had already encouraged sugarcane growing in Taiwan, and sugar became an important export. The ox cart here is about to carry harvested cane to the sugar mill; its tall plank wheels made it easier to move along the muddy roads of earlier times, and it was one of the most important means of land transport in Qing-period Taiwan.\nIn the early Qing period rice cultivation could not expand because of a lack of irrigation. After the 18th century, however, rising demand for grain in southern China led many local gentry to invest in growing and exporting rice, driving the construction of irrigation works; the famous Babao Canal, Liugong Canal and Caogong Canal all came out of this. In an agricultural society water was a vital resource, and Qing-period Taiwanese society would not hesitate to resort to armed feuds to protect it. The two farmers here are patrolling the canal to stop others from taking the village's irrigation water."}, "ja": {"n": "平原：鹿の野から田園へ", "txt": "台湾の平原地域の主な農作物は米と砂糖黍で、清朝統治期のその発展は市場の需要に大きく左右されました。オランダ人は台湾にいた時期から砂糖黍の栽培を奨励しており、砂糖は重要な輸出品となります。ここの牛車は、収穫した砂糖黍を糖廍（製糖所）へ運ぼうとしているところです。牛車の背の高い板輪は、初期のぬかるんだ道を進むのに適しており、清朝統治期の台湾で最も重要な陸上交通手段の一つでした。\n米の栽培は、清朝統治初期には灌漑施設の不足などの要因で作付面積を広げられずにいました。しかし18世紀以降、華南地域の食糧需要が高まると、多くの地方の有力者が相次いで米の栽培と輸出に乗り出し、水利施設の建設を促します。著名な八堡圳・瑠公圳・曹公圳は、いずれもこうした時代背景から生まれました。農業社会において水は極めて重要な資源であり、清朝統治期の台湾社会では、貴重な水資源を守るために武力による械闘も辞さないことがしばしばありました。ここの2人の農民は、他者が村の灌漑用水を奪わないよう水圳を見回っているところです。"}, "ko": {"n": "평야: 사슴 들에서 논밭으로", "txt": "타이완 평야 지역의 주요 작물은 쌀과 사탕수수였고, 청 통치기의 그 발전은 시장 수요에 크게 좌우되었습니다. 네덜란드인은 타이완에 있던 시기부터 사탕수수 재배를 장려했고, 설탕은 중요한 수출품이 되었습니다. 이곳의 소달구지는 수확한 사탕수수를 제당소로 옮기려는 참입니다. 달구지의 높은 판자 바퀴는 초기의 진흙길을 다니기에 알맞아, 청 통치기 타이완에서 가장 중요한 육상 교통수단 가운데 하나였습니다.\n쌀 재배는 청 통치 초기에 관개 시설 부족 등으로 경작 면적을 넓히지 못했습니다. 그러나 18세기 이후 화남 지역의 식량 수요가 높아지자 많은 지방 유력자가 잇따라 쌀 재배와 수출에 뛰어들었고, 이는 수리 시설 건설을 이끌었습니다. 유명한 바바오취안, 류궁취안, 차오궁취안이 모두 이런 시대 배경에서 나왔습니다. 농업 사회에서 물은 매우 중요한 자원이었고, 청 통치기 타이완 사회에서는 귀한 수자원을 지키려 무력 충돌도 마다하지 않는 일이 잦았습니다. 이곳의 두 농민은 다른 사람이 마을의 관개용수를 빼앗지 못하도록 수로를 돌아보고 있습니다."}}, "g17": {"en": {"n": "Settlements in the Hill Country", "txt": "After the coast and the plains we come to the low hills of northern Taiwan. Here the Qing government set a boundary line, commonly called the \"earth-ox red line\", to separate Han Chinese and \"cooked savages\" from the \"raw savages\" outside state control. Yet drawing a boundary could not cut off the need for exchange: along the line appeared many trading places commonly called sheliao, where the two sides traded lowland matchlocks, waist knives, liquor and cloth for mountain deerskins, rattan and game. The wooden tally used to claim goods here may be historical evidence of Han Chinese stabilising relations with indigenous people by giving them supplies; an indigenous person who received such a tally could use it to collect cloth and other goods from the Han.\nAround the second half of the 19th century, tea, camphor and other goods produced in the hills of northern Taiwan found favour on the international market after the treaty ports opened, setting off a new wave of forest clearance. To extract camphor, merchants often went into the mountains and negotiated with indigenous people, with money or pigs, for the right to enter, fell camphor trees and set up camphor huts for processing. As felling pushed deeper into the mountains it seriously affected indigenous traditional territories, deepening the conflict between camphor operators and indigenous peoples, and making the low hills a place of frequent clashes in the late Qing period."}, "ja": {"n": "丘陵地域の集落", "txt": "沿海と平原の次に、台湾北部の丘陵・浅山地域に来ました。清朝政府はここに俗に「土牛紅線」と呼ばれる番界線を設け、漢人・熟番と国家の統制外にある生番とを隔てました。しかし番界の画定は人々の交流の必要を断ち切ることはできず、境界線沿いには「社寮」と俗称される原漢交易の地点が数多く生まれます。双方は平地の火縄銃・腰刀・酒・布と、山地の鹿皮・籐材・獲物などを取引しました。ここにある物資を受け取るための木籤の証票は、漢人が物資を贈ることで原漢関係を安定させようとした歴史的証拠かもしれません。この木籤を受け取った先住民の族人は、それを証として漢人から布などの品を受け取ることができました。\n19世紀後半頃になると、台湾北部の丘陵地域で生産される茶葉や樟脳などの商品が、開港通商により国際市場で好まれ、新たな山林開拓の波を引き起こします。商人は樟脳を精製するためしばしば山地に入り、金銭や豚などの品をもって先住民と交渉し、山地への立ち入り、樟の伐採、樟脳を加工する「脳寮」の設置の権利を得ました。伐採の範囲がしだいに山奥へ及ぶにつれ、先住民の伝統的生活領域に大きな影響を与え、樟脳採取業者と先住民の対立を深め、清末の浅山地域は衝突の多発地となりました。"}, "ko": {"n": "구릉 지역의 취락", "txt": "해안과 평야에 이어 타이완 북부의 구릉·저산 지역에 왔습니다. 청 정부는 이곳에 흔히 '토우훙셴'이라 불리는 번계선을 두어 한족·숙번과 국가의 통제 밖에 있는 생번을 갈라놓았습니다. 그러나 번계를 긋는다고 사람들의 교류 필요가 끊기지는 않아, 경계선을 따라 '서랴오'라 불리는 한족·원주민 교역 지점이 여럿 생겨났습니다. 양측은 평지의 화승총·허리칼·술·직물과 산지의 사슴 가죽·등나무·사냥감 등을 교환했습니다. 이곳에 있는 물자 수령용 나무 패는 한족이 물자를 건네며 양측 관계를 안정시키려 한 역사적 증거일 수 있습니다. 이 나무 패를 받은 원주민은 그것을 증표로 한족에게서 직물 등의 물품을 받을 수 있었습니다.\n19세기 후반 무렵이 되자 타이완 북부 구릉 지역에서 나는 차와 장뇌 등의 상품이 개항 통상으로 국제 시장의 호응을 얻으며 새로운 산림 개척의 물결을 일으켰습니다. 상인들은 장뇌를 뽑아내기 위해 자주 산지에 들어가 돈이나 돼지 등을 주고 원주민과 교섭해 산지 출입, 녹나무 벌채, 장뇌를 가공하는 '나오랴오' 설치 권리를 얻었습니다. 벌채 범위가 점차 산속 깊이 미치면서 원주민의 전통 생활 영역에 큰 영향을 주었고, 장뇌 채취업자와 원주민의 대립이 깊어져 청 말 저산 지역은 충돌이 잦은 곳이 되었습니다."}}, "g18": {"en": {"n": "Contact and Conflict", "txt": "In Qing-period Taiwan different peoples were in frequent contact and competition for resources was fierce, so conflict often broke out — between indigenous people and Han Chinese, between Han Chinese and the Qing authorities, and even among different groups within Han society — which in turn shaped the development of local society. The Songjiang martial-art weapons displayed in the mud-brick house belonged to local militias: to protect their families and property, settlements across Taiwan organised patrol teams that patrolled and drilled regularly, and some of these later became the martial performances of temple processions.\nThis set of Illustrations of the Pacification of Taiwan was painted by Qing court artists as an imagined depiction of the Lin Shuangwen incident of 18th-century Taiwan. The unrest drew in many different groups in society; the most often mentioned are the Hakka, who helped the Qing army suppress it and were given the \"Praise for Loyalty\" plaque. In fact not only Hakka took part: to varying degrees every group joined one side or the other. Let us look at the story of an indigenous woman here, Jinniang.\nJinniang was from the Xiadanshui community and drew talismans and healed the sick locally. When the unrest broke out she joined Zhuang Datian's forces on Lin Shuangwen's side. Because she invoked the gods to aid the fighting before attacks and could heal people with incantations, she was honoured as a strategist and was popularly called the \"immortal maiden\". To the authorities, however, Jinniang was defined as a witch who deluded the crowd with spells and talismans. Her story shows not only how different groups were drawn into the incident, but also how one person could be interpreted quite differently depending on where one stood."}, "ja": {"n": "接触と衝突", "txt": "清朝統治期の台湾では異なる族群の接触が頻繁で、資源の争奪も激しかったため、先住民と漢人、漢人と清朝の官府、さらには漢人社会内部の異なる人々のあいだでもしばしば衝突が起こり、それが台湾の地方社会の発展を動かしました。土埆厝のなかに展示された宋江陣の武器は、各地の集落が自らの身と財産を守るために巡守の隊を組み、定期的に巡邏と訓練を行った地方の武力を示すものです。その一部は今日の寺廟の陣頭による武芸の演武へと姿を変えました。\nこの『平定台湾戦図』は、清廷の画師が18世紀台湾の林爽文事件を想像で描いたものです。この騒乱には社会の多様な族群が巻き込まれました。最もよく語られるのは、清軍の平定に協力し『褒忠』の扁額を賜った客家の人々です。しかし実際には客家だけでなく、各族群が多かれ少なかれ事件の双方に加わっていました。ここで、一人の先住民女性・金娘の物語を見てみましょう。\n金娘は下淡水社の先住民で、地元で人のために符を描き病を治していました。騒乱が起こると、林爽文側の荘大田の部隊に加わります。城や町を攻める前に荘大田のために神に戦いの加護を請い、さらに呪文で人々の病を治すことができたため軍師と仰がれ、民間では「仙姑」と尊称されました。しかし官の側から見れば、金娘は呪文と符で人々を惑わす妖女と定義されました。金娘の物語は、異なる族群が次々とこの事件に巻き込まれたことを示すと同時に、一人の人物が立場によってまったく異なる解釈をされることをも教えてくれます。"}, "ko": {"n": "접촉과 충돌", "txt": "청 통치기 타이완에서는 서로 다른 종족의 접촉이 잦고 자원 다툼도 치열해, 원주민과 한족, 한족과 청 관청, 나아가 한족 사회 내부의 서로 다른 집단 사이에서도 충돌이 자주 일어났고 이는 타이완 지방 사회의 발전을 움직였습니다. 흙벽돌집 안에 전시된 쑹장진 무기는 각지 취락이 가족과 재산을 지키려 순찰대를 꾸려 정기적으로 순찰과 훈련을 한 지방 무력을 보여 줍니다. 그 일부는 오늘날 사원 행렬의 무예 공연으로 이어졌습니다.\n이 『평정타이완전도』는 청 조정 화가가 18세기 타이완의 린솽원 사건을 상상해 그린 것입니다. 이 소요에는 사회의 다양한 종족이 휘말렸습니다. 가장 자주 언급되는 것은 청군의 평정을 도와 '포충(褒忠)' 편액을 받은 객가 사람들입니다. 그러나 실제로는 객가만이 아니라 여러 종족이 많든 적든 사건의 양쪽에 참여했습니다. 여기서 한 원주민 여성 진냥의 이야기를 보겠습니다.\n진냥은 샤단수이사의 원주민으로, 지역에서 사람들에게 부적을 그려 주고 병을 고쳤습니다. 소요가 일어나자 린솽원 편의 좡다톈 부대에 가담했습니다. 성과 마을을 치기 전에 좡다톈을 위해 신에게 가호를 빌고 주문으로 사람들의 병을 고칠 수 있었기에 군사(軍師)로 받들어졌고, 민간에서는 '선고(仙姑)'라 불렸습니다. 그러나 관의 입장에서 진냥은 주문과 부적으로 사람들을 홀리는 요녀로 규정되었습니다. 진냥의 이야기는 여러 종족이 이 사건에 휘말렸음을 보여 주는 동시에, 한 인물이 입장에 따라 전혀 다르게 해석될 수 있음을 알려 줍니다."}}, "g19": {"en": {"n": "Commercial Towns", "txt": "As trade grew, port cities along the coast prospered. The saying \"first the prefectural city, second Lugang, third Bangka\" describes the three great towns of the south, centre and north under the Qing. The \"prefecture\" was the Taiwan prefectural city of the time, today's Tainan; \"Lugang\" is Lugang; and \"Bangka\" is today's Wanhua in Taipei. The rise and fall of these three trading towns bears witness to the development of commerce in Qing-period Taiwan: foreign trade moved from cross-strait commerce to the treaty-port era; besides rice and sugar, tea and camphor were added to the goods traded; and the leading figures shifted from guild merchants to compradors \"versed in Western languages\".\nThough commerce flourished, weights and measures in Taiwan were not standardised: a catty in Tainan might well weigh differently from a catty in central Taiwan, causing much dispute and inconvenience in trade. To solve this, trusted large merchant houses in each place made standard weights like this one, kept in temples or other public places as a basis for settling disputes. On this weight you can see the name of the firm that made it, the kinds of goods it was used to weigh, and the weight written in Suzhou numerals — through it you can imagine what it was like to do business across regions at the time.\nFlourishing commerce also brought the rise of merchant families. Once established, these families gained prestige, resources and profit by taking part in public affairs, while educating their sons to sit the imperial examinations, gradually becoming important local gentry; the authorities too often needed their capital and connections to carry out policy. At the same time such families drove the development of Taiwan's cultural and material life. Lin Chaoying of the Yuanmei firm of the prefectural city, third generation of his family, appears in this self-portrait; an 18th-century representative of the city's merchant gentry, he held an examination degree and excelled at the calligraphy known as the \"bamboo-leaf style\", and plaques he wrote still hang in many temples today.\nWalking on, we come to Lugang, the most important port in central Taiwan in the Qing period. Under Qing regulations cross-strait trade was limited to officially designated pairs of ports in Taiwan and Fujian, known as the paired-crossing policy. On this map you can see the ports opened in turn during the Qing period. In the second half of the 18th century, as central Taiwan developed, Lugang was opened for paired crossing with Hanjiang in Quanzhou and became an important port for exporting the grain of central Taiwan."}, "ja": {"n": "商業市鎮", "txt": "貿易の発展にともない、沿海の港湾都市も栄えました。「一府二鹿三艋舺」という諺は、清朝の南・中・北の3大市鎮が並び立つ盛況を表しています。「一府」は当時の台湾府城（現在の台南）、「二鹿」は鹿港、「三艋舺」は現在の台北萬華です。この3つの貿易市鎮の盛衰史は、清朝統治期の台湾の商業貿易の変遷をよく示しています。対外貿易は両岸貿易から開港通商へと進み、交易品は米・砂糖のほかに茶葉・樟脳が加わり、取引の主役は郊商から「洋文に通じた」買辦へと移りました。\n商業は日に日に栄えましたが、当時の台湾では度量衡が統一されておらず、台南の一斤と中部の一斤では重さが違うこともあり、取引に多くの争いと不便を生みました。これを解決するため、各地で人々の信頼を得た大商家がこうした「公砣」を作り、廟やその他の公共の場所に置いて争いを解決する基準としました。この公砣には、作った商号、計量に用いる貨物の種類、そして蘇州碼で書かれた重さの数字が見られます。これを通して、当時地域を越えて商いをした光景を想像することができます。\n商業の繁栄は商人一族の台頭ももたらしました。こうした大家族は興隆したのち、公共の事務に参加して名望・資源・利益を得る一方、子弟に学問をさせて科挙を受けさせ、しだいに重要な地方の仕郷となっていきます。官府もまた、多くの政策を進めるために彼らの資金と人脈を頼りにしました。同時に大家族は台湾の文教事業と物質文化の発展も促しました。この自画像に描かれた府城・元美号林家の三代目、林朝英は18世紀の府城商紳の代表的人物で、功名を得たうえに「竹葉体」と呼ばれる書に長じ、多くの廟には今も彼の書いた扁額が掲げられています。\nさらに進むと、清朝統治期の中部で最も重要な港、鹿港に来ます。清朝政府の規定により、両岸貿易は官が定めた台湾と福建の港どうしの一対一の往来のみが認められ、これを対渡政策と呼びます。この地図では、清朝統治期に順次開かれた対渡の港が見られます。鹿港は18世紀後半、中部の発展にともない泉州蚶江との対渡が認められ、中部の米穀を輸出する重要な港となりました。"}, "ko": {"n": "상업 도시", "txt": "무역이 발전하면서 해안의 항구 도시도 번성했습니다. '일부이록삼맹갑(一府二鹿三艋舺)'이라는 속담은 청나라 때 남·중·북의 3대 도시가 나란히 번성하던 모습을 나타냅니다. '일부'는 당시의 타이완부성(오늘날 타이난), '이록'은 루강, '삼맹갑'은 오늘날 타이베이 완화입니다. 이 세 무역 도시의 흥망사는 청 통치기 타이완 상업 무역의 변천을 잘 보여 줍니다. 대외 무역은 양안 무역에서 개항 통상으로 나아갔고, 교역품에는 쌀·설탕 외에 차와 장뇌가 더해졌으며, 거래의 주역은 교상(郊商)에서 '서양 글에 밝은' 매판으로 옮겨 갔습니다.\n상업은 날로 번성했지만 당시 타이완은 도량형이 통일되지 않아 타이난의 한 근과 중부의 한 근의 무게가 다르기도 해, 거래에 많은 분쟁과 불편을 낳았습니다. 이를 해결하려 각지에서 신뢰받던 큰 상가가 이런 '공타(公砣)'를 만들어 사당이나 공공장소에 두고 분쟁 해결의 기준으로 삼았습니다. 이 공타에는 만든 상호, 계량에 쓰는 화물의 종류, 그리고 쑤저우 숫자로 쓴 무게가 보입니다. 이를 통해 당시 지역을 넘나들며 장사하던 모습을 그려 볼 수 있습니다.\n상업의 번영은 상인 가문의 부상도 가져왔습니다. 이들 가문은 일어선 뒤 공공 사무에 참여해 명망과 자원, 이익을 얻는 한편 자제에게 공부를 시켜 과거에 응시하게 하며 점차 중요한 지방 사신(士紳)이 되었습니다. 관청 또한 여러 정책을 펴기 위해 이들의 자금과 인맥에 기대야 했습니다. 동시에 이들 가문은 타이완의 문교 사업과 물질문화 발전도 이끌었습니다. 이 자화상 속 푸청 위안메이하오 린씨 가문의 3대 린차오잉은 18세기 푸청 상신(商紳)의 대표 인물로, 공명을 얻었을 뿐 아니라 '죽엽체'라 불리는 서예에 능해 지금도 많은 사당에 그가 쓴 편액이 걸려 있습니다.\n계속 나아가면 청 통치기 중부에서 가장 중요한 항구였던 루강에 이릅니다. 청 정부의 규정에 따라 양안 무역은 관이 정한 타이완과 푸젠의 항구 사이 일대일 왕래만 허용되었고, 이를 대도(對渡) 정책이라 합니다. 이 지도에서 청 통치기에 차례로 열린 대도 항구를 볼 수 있습니다. 루강은 18세기 후반 중부의 발전에 따라 취안저우 한장과의 대도가 허용되어 중부의 곡물을 수출하는 중요한 항구가 되었습니다."}}, "g20": {"en": {"n": "Opening the Treaty Ports", "txt": "After the mid-19th century, as Western power moved east, Western merchants and missionaries came to Taiwan once again. Tamsui was opened as a treaty port in the early 1860s, and under the influence of the world market tea and camphor from the north became important exports. Dadaocheng near Bangka became the centre of Taiwan's tea trade and rose rapidly into an important commercial town. Mr Dodd here was a key figure in the rise of Taiwanese tea. After the ports opened he came to Taiwan to survey the land and water, found that the northern hills suited tea growing, introduced Anxi tea varieties from mainland China, hired experienced tea masters, and produced and exported Taiwanese tea. Before this, Taiwanese tea was mostly lightly processed and then shipped to Fujian for refining and sale. After Dodd set up a tea factory in Dadaocheng, he no longer sold tea to the mainland market but shipped Taiwanese oolong directly to New York, where it was very well received, making the name of Taiwanese tea.\nIn the tea-making models here you can see the whole process of production and sale at the time — picking, processing, sorting and tasting. In the sorting model, many women workers are sorting tea leaves; working under the arcade, they are an important early example of women's employment in Taiwan."}, "ja": {"n": "開港通商", "txt": "19世紀半ば以降、西洋の力が東へ及び、西洋の商人や宣教師が再び台湾に来ました。1860年代初めに淡水が開港通商すると、世界市場の影響を受けて北部の茶葉・樟脳が重要な輸出商品となります。艋舺付近の大稲埕は台湾の茶葉の集散地となり、一躍重要な貿易都市となりました。このドッド氏は、当時の台湾茶の興隆における重要な立役者です。ドッドは開港通商後に台湾へ来て水土を調査し、北部の丘陵が茶の栽培に適していることを見いだすと、中国大陸から安渓の茶種を導入し、経験豊かな製茶師を招いて台湾茶を生産・輸出しました。それ以前の台湾茶は、簡単な加工ののち福建へ運ばれ、そこで精製されて売られていました。ドッドが大稲埕に製茶工場を設けてからは、茶葉を中国大陸市場へ売らず、台湾烏龍茶をニューヨークへ直接販売するようになり、大いに歓迎されて台湾茶の知名度が開かれました。\nここの製茶模型では、当時の採茶・製茶・揀茶（選別）から試飲まで、茶葉の生産と販売の流れが見られます。揀茶の模型では、多くの女性労働者が茶葉を選別しています。軒下（騎楼）で働く彼女たちは、台湾初期の女性就業の重要な事例といえます。"}, "ko": {"n": "개항 통상", "txt": "19세기 중엽 이후 서양 세력이 동쪽으로 밀려오면서 서양 상인과 선교사가 다시 타이완에 왔습니다. 1860년대 초 단수이가 개항 통상하자 세계 시장의 영향으로 북부의 차와 장뇌가 중요한 수출 상품이 되었습니다. 멍샤 부근의 다다오청은 타이완 차의 집산지가 되어 단숨에 중요한 무역 도시로 올라섰습니다. 이 도드 씨는 당시 타이완 차의 부상에 중요한 역할을 한 인물입니다. 도드는 개항 통상 이후 타이완에 와 땅과 물을 조사해 북부 구릉이 차 재배에 알맞다는 것을 발견하고, 중국 대륙에서 안시 차 품종을 들여오고 경험 많은 제다 장인을 초빙해 타이완 차를 생산·수출했습니다. 그전의 타이완 차는 간단히 가공한 뒤 푸젠으로 보내 정제해 팔았습니다. 도드가 다다오청에 제다 공장을 세운 뒤로는 차를 중국 대륙 시장에 팔지 않고 타이완 우롱차를 뉴욕으로 직접 판매했고, 큰 환영을 받으며 타이완 차의 명성을 열었습니다.\n이곳의 제다 모형에서는 당시 찻잎 따기, 제다, 선별, 시음에 이르는 생산과 판매의 흐름을 볼 수 있습니다. 선별 모형에서는 많은 여성 노동자가 찻잎을 고르고 있습니다. 처마 아래에서 일하는 이들은 타이완 초기 여성 취업의 중요한 사례라 할 수 있습니다."}}, "g21": {"en": {"n": "Beyond the Mountains", "txt": "On our right now is the \"back mountain\" region — the Qing-period name for eastern Taiwan. At the end of the Qianlong era, armed reclamation groups made up mainly of Han Chinese and western plains indigenous people began to enter the Lanyang Plain. The Kavalan, badly affected, were forced into large-scale migration in search of new living space in order to carry on their traditional culture. In this process many people died from natural disasters, epidemics and armed feuds. To make offerings to these souls who had died far from home, people held large pudu ceremonies in the seventh lunar month, ending with the qianggu or \"grappling with the ghosts\" ritual: through the great crowd the event drew, the wandering souls who came out during Ghost Month to enjoy the offerings were sent back each to their own place.\nIn 1871 a Ryukyuan ship was blown ashore on what is now the coast of Pingtung; its crew came ashore, clashed with local indigenous people and were killed. Japan used this as a pretext to send troops and land in Taiwan — the Mudan Incident. After it, the Qing government, feeling the threat of foreign powers, sent officials such as Shen Baozhen to Taiwan and began to develop the east more actively in order to keep outsiders out."}, "ja": {"n": "山の向こう側", "txt": "いま右手にあるのは後山地域です。「後山」とは、清朝統治期に台湾東部を指した呼び方です。乾隆末年、漢人と西部の平埔先住民を主体とする武装開墾集団が蘭陽平野に入り始めました。衝撃を受けたカバラン人は大規模な移住を余儀なくされ、伝統文化を受け継ぐための新しい生活空間を探します。この過程で、天災・疫病・械闘による衝突で多くの人が命を落としました。異郷で客死したこれらの孤魂を祀るため、人々は旧暦7月に盛大に普度の行事を行い、普度の最後には搶孤の行事が行われます。大勢の人が集まる熱気によって、鬼月に出てきて供物を受けた孤魂たちをそれぞれの居場所へ帰らせるのです。\n1871年、琉球国の船が風に流されて現在の屏東沿海に漂着し、上陸した船員が現地の先住民と衝突して殺害されました。日本はこれを口実に出兵して台湾に上陸します。これを牡丹社事件といいます。事件後、外国勢力の脅威を感じた清朝政府は沈葆楨らの官員を台湾に派遣し、外部の侵略を防ぐために東部地域の経営をより積極的に進め始めました。"}, "ko": {"n": "산 너머", "txt": "지금 오른편에 있는 곳이 허우산(後山) 지역입니다. '허우산'은 청 통치기에 타이완 동부를 가리키던 말입니다. 건륭 말년, 한족과 서부 평포 원주민을 중심으로 한 무장 개간 집단이 란양평야에 들어오기 시작했습니다. 충격을 받은 카발란족은 대규모 이주를 강요당하며 전통문화를 이어 갈 새로운 삶의 터전을 찾아야 했습니다. 이 과정에서 천재지변과 역병, 무력 충돌로 많은 사람이 목숨을 잃었습니다. 타향에서 객사한 이 외로운 넋들을 기리기 위해 사람들은 음력 7월에 성대한 보도(普度) 행사를 열었고, 보도의 마지막에는 창구(搶孤) 행사를 치렀습니다. 많은 사람이 모여 만들어 내는 기운으로, 귀월에 나와 제사 음식을 받은 넋들을 각자의 자리로 돌아가게 하는 것입니다.\n1871년 류큐국의 배가 바람에 떠밀려 지금의 핑둥 해안에 표착했고, 상륙한 선원들이 현지 원주민과 충돌해 살해되었습니다. 일본은 이를 구실로 군대를 보내 타이완에 상륙했는데, 이를 무단사 사건이라 합니다. 사건 이후 외국 세력의 위협을 느낀 청 정부는 선바오전 등의 관리를 타이완에 보내, 외부의 침탈을 막기 위해 동부 지역 경영을 보다 적극적으로 추진하기 시작했습니다."}}, "g22": {"en": {"n": "Upheaval 1895", "txt": "At first, when Taiwan's gentry and officials learned that Taiwan had been ceded, they were unwilling to submit and organised the \"Republic of Formosa\", using this yellow tiger flag on a blue ground to resist the Japanese takeover, hoping to attract international attention and inter
